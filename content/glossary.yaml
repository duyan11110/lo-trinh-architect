  vi: conformist
  short_vi: "Quan hệ trong đó downstream context dùng nguyên mô hình của upstream context, không tự dịch"
  short_en: "A relationship where the downstream context uses the upstream model as it is, with no translation"
  introduced_in: design.l3.conformist
- term: anti-corruption-layer
  en: "anti-corruption layer"
  vi_keep: true
  vi: "anti-corruption layer"
  short_vi: "Lớp code ở rìa downstream context, dịch mô hình của upstream sang mô hình của mình"
  short_en: "Code at the edge of a downstream context that translates the upstream model into its own"
  introduced_in: design.l3.anti-corruption-layer
- term: monolith
  en: monolith
  vi_keep: true
  vi: monolith
  short_vi: "Ứng dụng được build và deploy thành một khối, mọi phần chạy trong cùng một process"
  short_en: "An application built and deployed as one unit, with all its parts running in the same process"
  introduced_in: design.l3.modular-monolith
- term: modular-monolith
  en: "modular monolith"
  vi_keep: true
  vi: "modular monolith"
  short_vi: "Monolith mà code chia thành các module, mỗi module sở hữu mô hình và dữ liệu riêng, chỉ được gọi qua hợp đồng"
  short_en: "A monolith whose code is split into modules, each owning its model and data and reached only through its contract"
  introduced_in: design.l3.modular-monolith
- term: module-contract
  en: "module contract"
  vi_keep: false
  vi: "hợp đồng của module"
  short_vi: "Tập nhỏ các kiểu public mà module khác được dùng; mọi thứ còn lại trong module là internal"
  short_en: "The small set of public types other modules may use; everything else in the module stays internal"
  introduced_in: design.l3.module-contracts
- term: microservice
  en: microservice
  vi_keep: true
  vi: microservice
  short_vi: "Service được deploy và chạy riêng, sở hữu dữ liệu của một bounded context, chỉ được gọi qua mạng"
  short_en: "A service deployed and run on its own, owning one bounded context's data and reached only over the network"
  introduced_in: design.l3.before-extracting-a-module
- term: message-broker
  en: "message broker"
  vi_keep: true
  vi: "message broker"
  short_vi: "Server nhận message từ một chương trình và giữ chúng cho tới khi chương trình khác lấy đi"
  short_en: "A server that accepts messages from one program and keeps them until another program takes them"
  introduced_in: backend.l3.message-broker
- term: message-queue
  en: "message queue"
  vi_keep: false
  vi: "hàng đợi message"
  short_vi: "Nơi trong message broker giữ message theo thứ tự đến, chờ một chương trình nhận lấy"
  short_en: "A place in a message broker that holds messages in arrival order until a program takes them"
  introduced_in: backend.l3.message-broker
- term: rabbitmq
  en: RabbitMQ
  vi_keep: true
  vi: RabbitMQ
  short_vi: "Message broker mã nguồn mở mà Đơn Hàng dùng từ stage-3 để các service gửi message cho nhau"
  short_en: "The open-source message broker Đơn Hàng's services use to send each other messages from stage-3"
  introduced_in: backend.l3.message-broker
- term: rabbitmq-exchange
  en: "exchange (RabbitMQ)"
  vi_keep: true
  vi: exchange
  short_vi: "Nơi publisher gửi message tới trong RabbitMQ; nó chép message sang các queue có binding khớp"
  short_en: "Where a publisher sends messages in RabbitMQ; it copies each one to the queues whose bindings match"
  introduced_in: backend.l3.exchanges-and-bindings
- term: rabbitmq-binding
  en: "binding (RabbitMQ)"
  vi_keep: true
  vi: binding
  short_vi: "Quy tắc nối một queue với một exchange, cho biết queue nhận những message nào"
  short_en: "A rule linking a queue to an exchange, saying which messages the queue receives"
  introduced_in: backend.l3.exchanges-and-bindings
- term: routing-key
  en: "routing key"
  vi_keep: true
  vi: "routing key"
  short_vi: "Chuỗi publisher gắn vào message, được exchange so với binding để chọn queue, như order.placed"
  short_en: "A string the publisher attaches to a message, matched against bindings to pick queues, such as order.placed"
  introduced_in: backend.l3.exchanges-and-bindings
- term: publish-subscribe
  en: publish/subscribe
  vi_keep: true
  vi: publish/subscribe
  short_vi: "Cách gửi message mà bên gửi không biết ai nhận; mỗi bên đăng ký nhận được một bản riêng"
  short_en: "Sending messages without knowing the receivers; every subscriber gets its own copy"
  introduced_in: backend.l3.exchanges-and-bindings
- term: dual-write
  en: "dual write"
  vi_keep: true
  vi: "dual write"
  short_vi: "Một thao tác phải ghi vào hai hệ thống, như database và message broker, mà không transaction nào bao cả hai"
  short_en: "One operation writing to two systems, such as a database and a broker, with no transaction covering both"
  introduced_in: backend.l3.dual-write
- term: outbox
  en: outbox
  vi_keep: true
  vi: outbox
  short_vi: "Bảng trong database của bên gửi, lưu message cùng transaction với thay đổi, để publish sau"
  short_en: "A table in the sender's database where a message is saved with the change it describes, to publish later"
  introduced_in: backend.l3.outbox-pattern
- term: publisher-confirm
  en: "publisher confirm"
  vi_keep: true
  vi: "publisher confirm"
  short_vi: "Lời RabbitMQ báo cho bên publish rằng nó đã nhận trách nhiệm giữ một message"
  short_en: "RabbitMQ's answer telling the publisher it has taken responsibility for a message"
  introduced_in: backend.l3.outbox-relay
- term: message-consumer
  en: "message consumer"
  vi_keep: true
  vi: "message consumer"
  short_vi: "Code nhận message từ một queue và xử lý chúng"
  short_en: "Code that receives messages from a queue and handles them"
  introduced_in: backend.l3.consumer-acknowledgements
- term: idempotent-consumer
  en: "idempotent consumer"
  vi_keep: true
  vi: "idempotent consumer"
  short_vi: "Consumer nhận lại một message đã xử lý mà không làm lại việc của nó"
  short_en: "A consumer that receives a message it already handled without doing its work again"
  introduced_in: backend.l3.idempotent-consumer
- term: inbox
  en: "inbox (messaging)"
  vi_keep: true
  vi: inbox
  short_vi: "Bảng của bên nhận ghi id các message đã xử lý, lưu cùng transaction với việc message gây ra"
  short_en: "A receiver's table of handled message ids, saved in the same transaction as the work they caused"
  introduced_in: backend.l3.idempotent-consumer
- term: poison-message
  en: "poison message"
  vi_keep: true
  vi: "poison message"
  short_vi: "Message mà consumer không bao giờ xử lý được, lần giao nào cũng lỗi"
  short_en: "A message the consumer can never handle, failing on every delivery"
  introduced_in: backend.l3.dead-letter-queue
- term: dead-letter-queue
  en: "dead-letter queue"
  vi_keep: true
  vi: "dead-letter queue"
  short_vi: "Queue nhận các message mà queue khác bỏ cuộc, để người xem xét sau"
  short_en: "A queue that receives the messages another queue gives up on, for a person to inspect"
  introduced_in: backend.l3.dead-letter-queue
- term: distributed-transaction
  en: "distributed transaction"
  vi_keep: false
  vi: "giao dịch phân tán"
  short_vi: "Một giao dịch trải trên nhiều database hay hệ thống: tất cả cùng lưu hoặc cùng hủy"
  short_en: "One transaction over several databases or systems: all of them commit, or all roll back"
  introduced_in: backend.l3.two-phase-commit
- term: two-phase-commit
  en: "two-phase commit (2PC)"
  vi_keep: true
  vi: "two-phase commit (2PC)"
  short_vi: "Cách làm giao dịch phân tán: coordinator bảo mọi bên chuẩn bị, rồi chỉ cho commit khi tất cả đã chuẩn bị xong"
  short_en: "A way to run a distributed transaction: a coordinator has every party prepare, then lets all commit only if all prepared"
  introduced_in: backend.l3.two-phase-commit
- term: saga
  en: saga
  vi_keep: true
  vi: saga
  short_vi: "Chuỗi transaction cục bộ ở nhiều service, mỗi bước lưu thay đổi rồi gửi message khởi động bước kế"
  short_en: "A chain of local transactions in several services; each step saves its change and sends a message that starts the next"
  introduced_in: backend.l3.saga
- term: strong-consistency
  en: "strong consistency"
  vi_keep: true
  vi: "strong consistency"
  short_vi: "Mọi lần đọc bắt đầu sau khi một thay đổi đã lưu đều thấy thay đổi đó"
  short_en: "Every read that starts after a change is saved sees that change"
  introduced_in: backend.l3.eventual-consistency
- term: eventual-consistency
  en: "eventual consistency"
  vi_keep: true
  vi: "eventual consistency"
  short_vi: "Các bản dữ liệu có thể lệch nhau một lúc, nhưng khớp lại khi mọi thay đổi đã được xử lý; không hứa thời hạn"
  short_en: "Copies of data may disagree for a while but agree once every change has been handled; no time limit is promised"
  introduced_in: backend.l3.eventual-consistency
- term: compensating-action
  en: "compensating action"
  vi_keep: false
  vi: "hành động bù"
  short_vi: "Một thay đổi mới hủy tác dụng nghiệp vụ của một bước saga đã lưu, thay cho rollback"
  short_en: "A new change that undoes, for the business, a saga step already committed, in place of a rollback"
  introduced_in: backend.l3.compensating-action
- term: saga-choreography
  en: "choreography (saga)"
  vi_keep: true
  vi: "choreography (saga)"
  short_vi: "Cách chạy saga không có bên điều phối: mỗi service tự phản ứng với message của service khác"
  short_en: "Running a saga with no coordinator: each service reacts to the other services' messages"
  introduced_in: backend.l3.choreography-vs-orchestration
- term: saga-orchestration
  en: "orchestration (saga)"
  vi_keep: true
  vi: "orchestration (saga)"
  short_vi: "Cách chạy saga có một orchestrator giữ trạng thái, gửi lệnh cho từng service và chọn bước tiếp theo"
  short_en: "Running a saga with one orchestrator that keeps its state, commands each service and picks the next step"
  introduced_in: backend.l3.choreography-vs-orchestration
