# glossary.yaml — hạt giống cho Giai đoạn 0. Prompt 01 (outline) bổ sung term mới cho từng bài;
# prompt 06 (dịch) chỉ được dùng cách dịch ghi ở đây.
# vi_keep: true  → giữ nguyên tiếng Anh trong bản VI (in đậm lần đầu + giải nghĩa ngắn trong ngoặc)
# vi_keep: false → dùng từ tiếng Việt ở cột `vi`, kèm tiếng Anh trong ngoặc lần đầu
# introduced_in: bài đầu tiên giới thiệu (validate kiểm khớp với `vocab` của bài đó)

- term: process
  en: process
  vi_keep: true
  vi: process
  short_vi: "Một chương trình đang chạy, có bộ nhớ riêng và được hệ điều hành cấp CPU"
  short_en: "A running program with its own memory, scheduled by the OS"
  introduced_in: foundation.l1.program-to-process
- term: thread
  en: thread
  vi_keep: true
  vi: thread
  short_vi: "Luồng thực thi bên trong một process; các thread cùng process dùng chung bộ nhớ"
  short_en: "An execution path inside a process; threads of one process share memory"
  introduced_in: foundation.l1.threads-and-async-intro
- term: stack
  en: stack
  vi_keep: true
  vi: stack
  short_vi: "Vùng nhớ cho biến cục bộ và lời gọi hàm, cấp phát và thu hồi tự động theo thứ tự vào sau ra trước"
  short_en: "Memory region for local variables and calls, freed automatically, last-in first-out"
  introduced_in: foundation.l1.memory-stack-heap
- term: heap
  en: heap
  vi_keep: true
  vi: heap
  short_vi: "Vùng nhớ cho đối tượng sống lâu hơn một lời gọi hàm; trong .NET do garbage collector dọn"
  short_en: "Memory region for objects outliving a call; in .NET reclaimed by the garbage collector"
  introduced_in: foundation.l1.memory-stack-heap
- term: garbage-collector
  en: "garbage collector"
  vi_keep: true
  vi: "garbage collector"
  short_vi: "Thành phần của runtime tự tìm và thu hồi bộ nhớ heap không còn được tham chiếu"
  short_en: "Runtime component that reclaims heap memory no longer referenced"
  introduced_in: foundation.l1.memory-stack-heap
  aliases: [gc]
- term: environment-variable
  en: "environment variable"
  vi_keep: false
  vi: "biến môi trường"
  short_vi: "Cặp tên–giá trị hệ điều hành truyền cho process khi khởi chạy"
  short_en: "Name–value pair the OS passes to a process at start"
  introduced_in: foundation.l1.env-and-config
- term: shell
  en: shell
  vi_keep: true
  vi: shell
  short_vi: "Chương trình nhận lệnh gõ, chạy chương trình khác và nối chúng lại (bash, zsh, PowerShell)"
  short_en: "A program that reads typed commands, runs programs and connects them"
  introduced_in: foundation.l1.terminal-basics
- term: pipe
  en: pipe
  vi_keep: true
  vi: pipe
  short_vi: "Nối output của lệnh này thành input của lệnh kia bằng ký tự |"
  short_en: "Connects one command's output to another's input with |"
  introduced_in: foundation.l1.pipes-and-filters
- term: ip-address
  en: "IP address"
  vi_keep: false
  vi: "địa chỉ IP"
  short_vi: "Địa chỉ định danh một máy trên mạng; IPv4 có dạng 4 số cách nhau bằng dấu chấm"
  short_en: "Address identifying a machine on a network"
  introduced_in: foundation.l1.ip-and-ports
- term: port
  en: port
  vi_keep: true
  vi: port
  short_vi: "Số từ 0 đến 65535 phân biệt các process đang lắng nghe trên cùng một máy"
  short_en: "A number 0–65535 distinguishing listening processes on one machine"
  introduced_in: foundation.l1.ip-and-ports
- term: dns
  en: DNS
  vi_keep: true
  vi: DNS
  short_vi: "Hệ thống dịch tên miền (vd. donhang.vn) thành địa chỉ IP"
  short_en: "System translating domain names to IP addresses"
  introduced_in: foundation.l1.dns
- term: tcp
  en: TCP
  vi_keep: true
  vi: TCP
  short_vi: "Giao thức vận chuyển đảm bảo dữ liệu đến đủ, đúng thứ tự, qua một kết nối"
  short_en: "Transport protocol delivering bytes reliably and in order over a connection"
  introduced_in: foundation.l1.tcp-vs-udp
- term: tls
  en: TLS
  vi_keep: true
  vi: TLS
  short_vi: "Lớp mã hóa trên TCP; là chữ S trong HTTPS"
  short_en: "Encryption layer over TCP; the S in HTTPS"
  introduced_in: foundation.l1.tls-and-https
- term: request
  en: request
  vi_keep: true
  vi: request
  short_vi: "Thông điệp client gửi tới server"
  short_en: "The message a client sends to a server"
  introduced_in: foundation.l1.url-to-page
- term: response
  en: response
  vi_keep: true
  vi: response
  short_vi: "Thông điệp server trả về"
  short_en: "The message a server sends back"
  introduced_in: foundation.l1.url-to-page
- term: header
  en: header
  vi_keep: true
  vi: header
  short_vi: "Dòng mô tả đi kèm request/response"
  short_en: "Name: value pairs carrying metadata with a request or response"
  introduced_in: foundation.l1.http-request-response
- term: status-code
  en: "status code"
  vi_keep: true
  vi: "status code"
  short_vi: "Mã trạng thái, số 3 chữ số trong response cho biết kết quả"
  short_en: "Three-digit number in a response indicating the outcome"
  introduced_in: foundation.l1.http-request-response
- term: http-method
  en: "HTTP method"
  vi_keep: true
  vi: "HTTP method"
  short_vi: "Động từ của request: GET lấy, POST tạo, PUT/PATCH sửa, DELETE xóa"
  short_en: "The verb of a request: GET, POST, PUT, PATCH, DELETE"
  introduced_in: foundation.l1.http-methods
- term: idempotent
  en: idempotent
  vi_keep: true
  vi: idempotent
  short_vi: "Gọi nhiều lần cho kết quả như gọi một lần (GET, PUT, DELETE là idempotent; POST thì không)"
  short_en: "Repeating the call has the same effect as calling once"
  introduced_in: foundation.l1.http-methods
- term: cookie
  en: cookie
  vi_keep: true
  vi: cookie
  short_vi: "Mẩu dữ liệu server nhờ trình duyệt giữ và gửi lại ở các request sau"
  short_en: "Small data the server asks the browser to store and send back"
  introduced_in: foundation.l1.cookies-and-state
- term: cache
  en: cache
  vi_keep: true
  vi: cache
  short_vi: "Bản sao dữ liệu giữ gần nơi dùng để lần sau lấy nhanh hơn, đổi lại có thể cũ"
  short_en: "A copy kept close to where it is used for speed, at the risk of staleness"
  introduced_in: foundation.l1.http-caching
- term: json
  en: JSON
  vi_keep: true
  vi: JSON
  short_vi: "Định dạng văn bản biểu diễn đối tượng, mảng, chuỗi, số, boolean, null"
  short_en: "Text format for objects, arrays, strings, numbers, booleans, null"
  introduced_in: foundation.l1.json-and-encoding
- term: encoding
  en: encoding
  vi_keep: true
  vi: encoding
  short_vi: "Cách chuyển ký tự thành byte và ngược lại; UTF-8 là chuẩn mặc định"
  short_en: "Mapping between characters and bytes; UTF-8 is the default"
  introduced_in: foundation.l1.json-and-encoding
- term: commit
  en: commit
  vi_keep: true
  vi: commit
  short_vi: "Một ảnh chụp toàn bộ project tại một thời điểm, có id, tác giả, thông điệp, và cha"
  short_en: "A snapshot of the whole project with id, author, message and parent"
  introduced_in: foundation.l2.git-mental-model
- term: branch
  en: branch
  vi_keep: true
  vi: branch
  short_vi: "Con trỏ có tên trỏ tới một commit; tạo branch không sao chép file"
  short_en: "A named pointer to a commit"
  introduced_in: foundation.l2.git-branches
- term: merge
  en: merge
  vi_keep: true
  vi: merge
  short_vi: "Gộp lịch sử hai branch bằng một commit có hai cha"
  short_en: "Join two branch histories with a commit that has two parents"
  introduced_in: foundation.l2.git-merge-vs-rebase
- term: rebase
  en: rebase
  vi_keep: true
  vi: rebase
  short_vi: "Chép lại các commit của branch lên trên một commit khác, tạo lịch sử thẳng"
  short_en: "Replay a branch's commits on top of another commit for a linear history"
  introduced_in: foundation.l2.git-merge-vs-rebase
- term: conflict
  en: conflict
  vi_keep: true
  vi: conflict
  short_vi: "Hai phía sửa cùng vùng của một file; Git dừng và để bạn chọn"
  short_en: "Both sides changed the same region; Git stops and asks you"
  introduced_in: foundation.l2.git-conflicts
- term: primary-key
  en: "primary key"
  vi_keep: false
  vi: "khóa chính"
  short_vi: "Cột (hoặc bộ cột) định danh duy nhất mỗi dòng trong bảng"
  short_en: "Column(s) uniquely identifying each row"
  introduced_in: foundation.l1.tables-keys-relations
- term: foreign-key
  en: "foreign key"
  vi_keep: false
  vi: "khóa ngoại"
  short_vi: "Cột tham chiếu khóa chính của bảng khác, tạo quan hệ"
  short_en: "Column referencing another table's primary key"
  introduced_in: foundation.l1.tables-keys-relations
- term: join
  en: JOIN
  vi_keep: true
  vi: JOIN
  short_vi: "Phép ghép dòng của hai bảng theo điều kiện, thường qua khóa ngoại"
  short_en: "Combining rows from two tables on a condition"
  introduced_in: foundation.l1.sql-join
- term: index
  en: index
  vi_keep: true
  vi: index
  short_vi: "Cấu trúc phụ giúp tìm dòng theo cột nhanh mà không quét cả bảng; tốn chỗ và làm chậm ghi"
  short_en: "Auxiliary structure for fast lookup by column, at a cost on writes"
  introduced_in: foundation.l1.sql-index-intro
- term: transaction
  en: transaction
  vi_keep: false
  vi: "giao dịch"
  short_vi: "Nhóm thao tác DB hoặc thành công hết hoặc không gì cả"
  short_en: "A group of DB operations that all succeed or all fail"
  introduced_in: foundation.l1.transaction-intro
- term: interface
  en: interface
  vi_keep: true
  vi: interface
  short_vi: "Hợp đồng liệt kê phương thức mà một kiểu cam kết cung cấp, không có cài đặt"
  short_en: "A contract of methods a type promises to provide"
  introduced_in: foundation.l1.oop-interface-vs-abstract
- term: polymorphism
  en: polymorphism
  vi_keep: false
  vi: "đa hình"
  short_vi: "Cùng một lời gọi, hành vi khác nhau tùy kiểu thật của đối tượng"
  short_en: "Same call, different behavior depending on the runtime type"
  introduced_in: foundation.l1.oop-polymorphism
- term: encapsulation
  en: encapsulation
  vi_keep: false
  vi: "đóng gói"
  short_vi: "Giấu trạng thái bên trong, chỉ cho sửa qua phương thức có kiểm soát"
  short_en: "Hiding internal state behind controlled methods"
  introduced_in: foundation.l1.oop-encapsulation
- term: big-o
  en: Big-O
  vi_keep: true
  vi: Big-O
  short_vi: "Cách nói thời gian/bộ nhớ tăng thế nào khi dữ liệu tăng: O(1), O(log n), O(n), O(n²)"
  short_en: "How time or memory grows with input size"
  introduced_in: foundation.l1.complexity-intro
- term: hash-map
  en: "hash map"
  vi_keep: true
  vi: "hash map"
  short_vi: "Cấu trúc tra cứu theo khóa gần như tức thì (Dictionary trong C#)"
  short_en: "Key-based lookup structure with near-constant access (Dictionary in C#)"
  introduced_in: foundation.l1.collections-in-practice
- term: async-await
  en: async/await
  vi_keep: true
  vi: async/await
  short_vi: "Cú pháp viết code chờ I/O mà không chặn thread"
  short_en: "Syntax for waiting on I/O without blocking a thread"
  introduced_in: foundation.l1.threads-and-async-intro
- term: code-smell
  en: "code smell"
  vi_keep: true
  vi: "code smell"
  short_vi: "Dấu hiệu bề mặt cho thấy code có vấn đề thiết kế sâu hơn (hàm dài, tham số nhiều, trùng lặp)"
  short_en: "A surface sign of a deeper design problem"
  introduced_in: foundation.l1.code-smells-basic
- term: refactoring
  en: refactoring
  vi_keep: true
  vi: refactoring
  short_vi: "Sửa cấu trúc code mà không đổi hành vi, từng bước nhỏ, có test bảo vệ"
  short_en: "Changing structure without changing behavior, in small steps"
  introduced_in: foundation.l1.code-smells-basic
- term: bug-report
  en: "bug report"
  vi_keep: true
  vi: "bug report"
  short_vi: "Mô tả lỗi đủ để người khác tái hiện: bước, kết quả mong đợi, kết quả thực tế, môi trường"
  short_en: "A description letting someone else reproduce the bug"
  introduced_in: foundation.l2.writing-bug-reports
- term: stack-trace
  en: "stack trace"
  vi_keep: true
  vi: "stack trace"
  short_vi: "Danh sách lời gọi hàm đang dở khi lỗi xảy ra, đọc từ trên xuống là từ nơi lỗi ra ngoài"
  short_en: "The list of active calls at the moment of an error"
  introduced_in: foundation.l2.reading-stack-traces
- term: sprint
  en: sprint
  vi_keep: true
  vi: sprint
  short_vi: "Khoảng thời gian cố định (thường 1–4 tuần) team hoàn thành một phần tăng trưởng sản phẩm"
  short_en: "A fixed period in which the team delivers an increment"
  introduced_in: management.l1.scrum-from-junior-seat
- term: user-story
  en: "user story"
  vi_keep: true
  vi: "user story"
  short_vi: "Mô tả ngắn một nhu cầu từ góc người dùng: Là ai, muốn gì, để làm gì"
  short_en: "A short need statement from the user's view"
  introduced_in: management.l1.user-story-and-ac
- term: acceptance-criteria
  en: "acceptance criteria"
  vi_keep: true
  vi: "acceptance criteria"
  short_vi: "Điều kiện kiểm tra được để một story tính là xong"
  short_en: "Checkable conditions for a story to count as done"
  introduced_in: management.l1.user-story-and-ac
- term: definition-of-done
  en: "Definition of Done"
  vi_keep: true
  vi: "Definition of Done"
  short_vi: "Danh sách chung của team về thế nào là 'xong' cho mọi việc (code, test, review, deploy...)"
  short_en: "The team's shared checklist for 'done'"
  introduced_in: management.l1.user-story-and-ac
  aliases: [dod]
- term: code-review
  en: "code review"
  vi_keep: true
  vi: "code review"
  short_vi: "Người khác đọc và góp ý thay đổi code trước khi gộp"
  short_en: "Someone else reads and comments on a change before merging"
  introduced_in: management.l1.code-review-basics
- term: pull-request
  en: "pull request"
  vi_keep: true
  vi: "pull request"
  short_vi: "Yêu cầu gộp một branch vào branch khác, kèm diff và thảo luận"
  short_en: "A request to merge one branch into another, with diff and discussion"
  introduced_in: management.l1.code-review-basics
  aliases: [pr, merge-request]
- term: kestrel
  en: Kestrel
  vi_keep: true
  vi: Kestrel
  short_vi: "Web server tích hợp trong ASP.NET Core, nhận kết nối TCP và tạo request/response cho code của bạn xử lý"
  short_en: "The web server built into ASP.NET Core; turns a TCP connection into a request your code handles"
  introduced_in: backend.l1.what-kestrel-does
- term: endpoint
  en: endpoint
  vi_keep: true
  vi: endpoint
  short_vi: "Một cặp HTTP method và đường dẫn được ánh xạ tới code xử lý, khai báo bằng app.Map…"
  short_en: "A method-and-path pair mapped to handler code, declared with app.Map…"
  introduced_in: backend.l1.hosting-and-program-cs
- term: middleware
  en: middleware
  vi_keep: true
  vi: middleware
  short_vi: "Một bước trong pipeline xử lý request, có thể đọc/sửa request hoặc response, hoặc dừng hẳn pipeline"
  short_en: "A step in the request pipeline that can inspect or change the request/response, or short-circuit the rest"
  introduced_in: backend.l1.middleware-pipeline
- term: short-circuit
  en: "short-circuit (the pipeline)"
  vi_keep: true
  vi: short-circuit
  short_vi: "Một middleware tự viết response và dừng lại, không gọi middleware tiếp theo trong pipeline"
  short_en: "A middleware writes a response and stops, without calling the next middleware in the pipeline"
  introduced_in: backend.l1.middleware-pipeline
- term: resource
  en: resource
  vi_keep: true
  vi: resource
  short_vi: "Một thứ được đặt tên bằng danh từ trong URL (vd. /api/v1/orders); method quyết định làm gì với nó"
  short_en: "A thing named by a noun in the URL; the HTTP method says what to do to it"
  introduced_in: backend.l1.rest-resources
- term: dto
  en: DTO
  vi_keep: true
  vi: DTO
  short_vi: "Kiểu dữ liệu dành riêng cho việc gửi/nhận qua API, tách khỏi kiểu nội bộ server dùng"
  short_en: "A type shaped for the wire, separate from any internal type the server uses"
  introduced_in: backend.l1.dtos-and-serialization
- term: orm
  en: "ORM (object-relational mapper)"
  vi_keep: true
  vi: ORM
  short_vi: "Thư viện ánh xạ giữa class trong code và bảng trong DB, để không viết SQL tay cho từng thao tác"
  short_en: "A library mapping classes in code to database tables, so most queries don't need hand-written SQL"
  introduced_in: backend.l1.efcore-mapping
- term: composite-key
  en: "composite key"
  vi_keep: false
  vi: "khóa kết hợp"
  short_vi: "Khóa chính gồm nhiều cột cùng lúc; chỉ tổ hợp đủ các cột đó mới định danh được một dòng"
  short_en: "A primary key made of more than one column; only the combination identifies a row"
  introduced_in: backend.l1.efcore-relationships-and-keys
- term: migration
  en: migration
  vi_keep: true
  vi: migration
  short_vi: "Một thay đổi schema được mô tả bằng code, có phiên bản, áp dụng bằng lệnh thay vì tay"
  short_en: "A versioned, code-described schema change, applied with a command instead of by hand"
  introduced_in: backend.l1.migrations
- term: n-plus-one
  en: "N+1 (query problem)"
  vi_keep: true
  vi: "N+1"
  short_vi: "Lỗi hiệu năng: lặp qua N dòng rồi truy vấn riêng cho từng dòng, tốn N+1 lượt gọi DB thay vì 1"
  short_en: "A performance bug: querying separately inside a loop over N rows costs N+1 database round trips instead of one"
  introduced_in: backend.l1.efcore-n-plus-one
- term: eager-loading
  en: "eager loading"
  vi_keep: true
  vi: "eager loading"
  short_vi: "Nạp sẵn dữ liệu quan hệ (vd. Include) trong cùng một truy vấn, thay vì đợi truy vấn riêng khi cần"
  short_en: "Fetching related data in the same query (e.g. Include) instead of a separate query when it's accessed"
  introduced_in: backend.l1.efcore-n-plus-one
- term: problem-details
  en: "Problem Details (RFC 9457)"
  vi_keep: true
  vi: "Problem Details"
  short_vi: "Định dạng JSON chuẩn cho response lỗi (RFC 9457): có type, title, status, detail"
  short_en: "The standard JSON shape for an error response (RFC 9457): type, title, status, detail"
  introduced_in: backend.l1.errors-and-problem-details
- term: structured-logging
  en: "structured logging"
  vi_keep: true
  vi: "structured logging"
  short_vi: "Ghi log theo field có tên riêng (vd. orderId=41), thay vì chỉ một câu văn bản tự do"
  short_en: "Logging each piece of information as its own named field, instead of one free-text sentence"
  introduced_in: backend.l1.structured-logging
- term: coupling
  en: coupling
  vi_keep: true
  vi: coupling
  short_vi: "Mức một đơn vị code phụ thuộc/biết về đơn vị khác; càng phụ thuộc nhiều càng khó đổi riêng từng phần"
  short_en: "How much one unit of code depends on or knows about another; high coupling makes changing one risk breaking the other"
  introduced_in: design.l1.coupling-and-cohesion
- term: cohesion
  en: cohesion
  vi_keep: true
  vi: cohesion
  short_vi: "Mức các phần bên trong một đơn vị (hàm, class) cùng phục vụ một việc"
  short_en: "How closely the things inside one unit (a method, a class) belong to the same job"
  introduced_in: design.l1.coupling-and-cohesion
- term: solid
