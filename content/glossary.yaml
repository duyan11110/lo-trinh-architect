- term: service-layer
  en: "service layer"
  vi_keep: false
  vi: "tầng service"
  short_vi: "Tầng giữ quy tắc nghiệp vụ và điều phối các bước, nhận/trả dữ liệu thuần, không biết gì về HTTP"
  short_en: "The layer holding business rules and orchestration, taking and returning plain data with no HTTP involved"
  introduced_in: design.l1.the-service-layer
- term: repository
  en: repository
  vi_keep: true
  vi: repository
  short_vi: "Tầng che cách dữ liệu được đọc/ghi sau vài phương thức mô tả cần gì, không phải như thế nào"
