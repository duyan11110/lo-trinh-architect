  short_en: "Publishing breaking changes under a new version of the API while the old version keeps working"
  introduced_in: backend.l2.api-versioning
- term: openapi
  en: OpenAPI
  vi_keep: true
  vi: OpenAPI
  short_vi: "Định dạng chuẩn, máy đọc được, mô tả endpoint, tham số và hình dạng request/response của một API"
  short_en: "A standard machine-readable format describing an API's endpoints, parameters and request and response shapes"
  introduced_in: backend.l2.openapi-contract
- term: idempotency-key
  en: "idempotency key"
  vi_keep: true
  vi: "idempotency key"
  short_vi: "Giá trị duy nhất client gửi kèm request để server nhận ra lần gửi lại và trả kết quả lần đầu"
  short_en: "A unique value sent with a request so the server can recognise a retry and return the first result"
  introduced_in: backend.l2.idempotent-endpoints
- term: oauth2
  en: "OAuth 2.0"
  vi_keep: true
  vi: "OAuth 2.0"
  short_vi: "Chuẩn để một ứng dụng nhận token gọi API thay người dùng mà không cầm mật khẩu của họ"
  short_en: "A standard for an app to get a token to call an API on a user's behalf without holding the user's password"
  introduced_in: backend.l2.oauth2-roles
- term: authorization-server
  en: "authorization server"
  vi_keep: true
  vi: "authorization server"
  short_vi: "Server xác thực người dùng rồi cấp access token cho client; ở Đơn Hàng là Keycloak"
  short_en: "The server that authenticates the user and issues access tokens to the client; Keycloak in Đơn Hàng"
  introduced_in: backend.l2.oauth2-roles
- term: resource-server
  en: "resource server"
  vi_keep: true
  vi: "resource server"
  short_vi: "Server giữ dữ liệu cần bảo vệ và nhận request kèm access token; ở Đơn Hàng là DonHang.Api"
  short_en: "The server holding the protected data, accepting requests that carry an access token; DonHang.Api in Đơn Hàng"
  introduced_in: backend.l2.oauth2-roles
- term: access-token
  en: "access token"
  vi_keep: true
  vi: "access token"
  short_vi: "Token authorization server cấp để client gửi kèm mỗi request tới API"
  short_en: "A token the authorization server issues for the client to send with each request to the API"
  introduced_in: backend.l2.oauth2-roles
- term: authorization-code-flow
  en: "authorization code flow"
  vi_keep: true
  vi: "authorization code flow"
  short_vi: "Luồng OAuth: trình duyệt nhận một code ngắn hạn, rồi ứng dụng đổi code đó lấy token"
  short_en: "The OAuth flow where the browser receives a short-lived code that the app then exchanges for tokens"
  introduced_in: backend.l2.authorization-code-flow
- term: pkce
  en: PKCE
  vi_keep: true
  vi: PKCE
  short_vi: "Cơ chế buộc ai đổi authorization code phải nộp chuỗi bí mật mà ứng dụng tạo lúc bắt đầu luồng"
  short_en: "A check that whoever exchanges an authorization code also holds a secret the app created at the start"
  introduced_in: backend.l2.authorization-code-flow
- term: oauth-scope
  en: "scope (OAuth)"
  vi_keep: true
  vi: scope
  short_vi: "Tên client xin khi bắt đầu luồng OAuth, giới hạn những gì token được dùng để làm"
  short_en: "A name the client asks for when starting an OAuth flow, limiting what the token may be used for"
  introduced_in: backend.l2.authorization-code-flow
- term: openid-connect
  en: "OpenID Connect (OIDC)"
  vi_keep: true
  vi: "OpenID Connect"
  short_vi: "Lớp trên OAuth 2.0 cho ứng dụng biết ai đã đăng nhập, bằng ID token"
  short_en: "A layer on top of OAuth 2.0 that tells the app who logged in, through an ID token"
  introduced_in: backend.l2.openid-connect-id-token
- term: id-token
  en: "ID token"
  vi_keep: true
  vi: "ID token"
  short_vi: "JWT gửi cho ứng dụng (không phải API), cho biết người dùng nào vừa đăng nhập"
  short_en: "A JWT meant for the app, not the API, saying which user just logged in"
  introduced_in: backend.l2.openid-connect-id-token
- term: public-key
  en: "public key"
  vi_keep: true
  vi: "public key"
  short_vi: "Nửa công khai của một cặp khóa: kiểm được chữ ký do private key tương ứng tạo, nhưng không tạo được chữ ký"
  short_en: "The shareable half of a key pair: it checks signatures made by the matching private key but cannot make one"
  introduced_in: backend.l2.validating-provider-tokens
- term: refresh-token
  en: "refresh token"
  vi_keep: true
  vi: "refresh token"
  short_vi: "Token client gửi riêng cho authorization server để lấy access token mới mà không đăng nhập lại"
  short_en: "A token the client sends only to the authorization server to get a new access token without logging in again"
  introduced_in: backend.l2.refresh-tokens
- term: rbac
  en: "RBAC (role-based access control)"
  vi_keep: true
  vi: RBAC
  short_vi: "Phân quyền theo role được gán cho người dùng, thay vì cấp quyền cho từng người"
  short_en: "Authorization decided by the roles given to a user, instead of permissions granted user by user"
  introduced_in: backend.l2.role-based-access
- term: abac
  en: "ABAC (attribute-based access control)"
  vi_keep: true
  vi: ABAC
  short_vi: "Phân quyền dựa trên thuộc tính của người gọi, của tài nguyên và của request, như ai sở hữu đơn"
  short_en: "Authorization decided from attributes of the caller, the resource and the request, such as who owns an order"
  introduced_in: backend.l2.resource-based-authorization
- term: redis
  en: Redis
  vi_keep: true
  vi: Redis
  short_vi: "Server lưu giá trị theo khóa trong bộ nhớ, nhiều chương trình cùng đọc ghi được"
  short_en: "A server that keeps values under keys in memory, shared by every program connected to it"
  introduced_in: backend.l2.redis-key-value-store
- term: key-value-store
  en: "key-value store"
  vi_keep: false
  vi: "kho key-value"
  short_vi: "Kho dữ liệu chỉ cất và lấy một giá trị theo khóa của nó, không có bảng hay JOIN"
  short_en: "A data store that only puts and gets a value by its key, with no tables or joins"
  introduced_in: backend.l2.redis-key-value-store
- term: ttl
  en: TTL
  vi_keep: true
  vi: TTL
  short_vi: "Thời gian sống: sau bấy nhiêu giây, giá trị tự bị xóa hoặc không còn được dùng"
  short_en: "Time to live: after this many seconds a value is removed or no longer used"
  introduced_in: backend.l2.redis-key-value-store
- term: cache-aside
  en: cache-aside
  vi_keep: true
  vi: cache-aside
  short_vi: "Ứng dụng hỏi cache trước; thiếu thì đọc database rồi tự cất kết quả vào cache"
  short_en: "The app asks the cache first; on a miss it reads the database and stores the answer itself"
  introduced_in: backend.l2.cache-aside
- term: cache-hit
  en: "cache hit"
  vi_keep: true
  vi: "cache hit"
  short_vi: "Lần đọc tìm thấy giá trị trong cache nên không phải hỏi nguồn gốc"
  short_en: "A read that finds the value in the cache, so the source is not asked"
  introduced_in: backend.l2.cache-aside
- term: cache-miss
  en: "cache miss"
  vi_keep: true
  vi: "cache miss"
  short_vi: "Lần đọc không thấy giá trị trong cache nên phải hỏi nguồn gốc"
  short_en: "A read that does not find the value in the cache, so the source must be asked"
  introduced_in: backend.l2.cache-aside
- term: cache-invalidation
  en: "cache invalidation"
  vi_keep: true
  vi: "cache invalidation"
  short_vi: "Xóa hoặc đánh dấu bỏ bản sao trong cache khi dữ liệu gốc đổi, để lần đọc sau lấy bản mới"
  short_en: "Removing a cached copy when the source data changes, so the next read gets the new value"
  introduced_in: backend.l2.cache-invalidation
- term: cache-stampede
  en: "cache stampede"
  vi_keep: true
  vi: "cache stampede"
  short_vi: "Nhiều request cùng miss một key vừa hết hạn và cùng lúc đổ truy vấn vào database"
  short_en: "Many requests miss the same just-expired key and all query the database at once"
  introduced_in: backend.l2.cache-stampede
- term: background-job
  en: "background job"
  vi_keep: true
  vi: "background job"
  short_vi: "Việc ứng dụng tự chạy ngoài mọi request, như gửi email, để không response nào phải chờ nó"
  short_en: "Work the application does outside any request, such as sending an email, so no response waits for it"
  introduced_in: backend.l2.work-outside-the-request
- term: hosted-service
  en: "hosted service"
  vi_keep: true
  vi: "hosted service"
  short_vi: "Lớp được host ASP.NET Core khởi động cùng app và dừng khi app tắt, dùng để chạy việc nền"
  short_en: "A class the ASP.NET Core host starts with the app and stops at shutdown, used to run background work"
  introduced_in: backend.l2.hosted-services
- term: job-queue
  en: "job queue"
  vi_keep: false
  vi: "hàng đợi job"
  short_vi: "Danh sách việc chờ làm được lưu bền, nơi code chạy nền lấy từng việc ra xử lý"
  short_en: "A durable list of work waiting to be done, from which background code takes one item at a time"
  introduced_in: backend.l2.database-job-queue
- term: exponential-backoff
  en: "exponential backoff"
  vi_keep: true
  vi: "exponential backoff"
  short_vi: "Chờ lâu dần trước mỗi lần thử lại, thường gấp đôi thời gian chờ sau mỗi lần thất bại"
  short_en: "Waiting longer before each new retry, usually doubling the delay after every failure"
  introduced_in: backend.l2.retry-with-backoff
- term: at-least-once
  en: at-least-once
  vi_keep: true
  vi: at-least-once
  short_vi: "Bảo đảm việc được làm một hoặc nhiều lần: không bao giờ mất, nhưng đôi khi bị lặp"
  short_en: "A guarantee that work is done one or more times: never lost, but sometimes repeated"
  introduced_in: backend.l2.at-least-once-jobs
- term: at-most-once
  en: at-most-once
  vi_keep: true
  vi: at-most-once
  short_vi: "Bảo đảm việc được làm không quá một lần: không bao giờ lặp, nhưng đôi khi bị mất"
  short_en: "A guarantee that work is done zero or one time: never repeated, but sometimes lost"
  introduced_in: backend.l2.at-least-once-jobs
- term: row-lock
  en: "row lock"
  vi_keep: false
  vi: "khóa dòng"
  short_vi: "Khóa một giao dịch giữ trên một dòng tới khi kết thúc; giao dịch khác xin khóa xung đột trên dòng, thường để sửa, phải chờ hoặc bỏ qua dòng"
  short_en: "A lock a transaction holds on a row until it ends; another one asking for a conflicting lock on it, often to change it, waits or skips it"
  introduced_in: backend.l2.skip-locked-claiming
- term: query-plan
  en: "query plan"
  vi_keep: true
  vi: "query plan"
  short_vi: "Các bước PostgreSQL chọn để trả lời một truy vấn; EXPLAIN in các bước đó ra"
  short_en: "The steps PostgreSQL chooses to answer one query; EXPLAIN prints them"
  introduced_in: backend.l2.indexes-and-plans
- term: query-planner
  en: "query planner"
  vi_keep: true
  vi: "query planner"
  short_vi: "Phần của PostgreSQL ước lượng chi phí các cách chạy một truy vấn và chọn cách rẻ nhất"
  short_en: "The part of PostgreSQL that estimates the cost of possible plans for a query and picks the cheapest"
  introduced_in: backend.l2.indexes-and-plans
- term: composite-index
  en: "composite index"
  vi_keep: true
  vi: "composite index"
  short_vi: "Index trên nhiều cột, sắp theo cột đầu rồi mới tới cột kế tiếp"
  short_en: "An index over several columns, sorted by the first column and then by the next"
  introduced_in: backend.l2.composite-indexes
- term: change-tracker
  en: "change tracker"
  vi_keep: true
  vi: "change tracker"
  short_vi: "Phần của DbContext ghi nhớ các entity đã nạp để SaveChanges biết cái gì đã đổi"
  short_en: "The part of a DbContext that remembers loaded entities so SaveChanges can find what changed"
  introduced_in: backend.l2.no-tracking-queries
- term: projection
  en: projection
  vi_keep: true
  vi: projection
  short_vi: "Truy vấn chỉ lấy các trường được chọn, đổ vào một kiểu mới, thay vì cả entity"
  short_en: "A query that returns only chosen fields, shaped into a new type, instead of whole entities"
  introduced_in: backend.l2.projection-queries
- term: isolation-level
  en: "isolation level"
  vi_keep: true
  vi: "isolation level"
  short_vi: "Thiết lập quyết định một giao dịch thấy gì từ thay đổi của các giao dịch khác khi nó đang chạy"
  short_en: "The setting that decides what a transaction sees of other transactions' changes while it runs"
  introduced_in: backend.l2.transactions-in-practice
- term: lost-update
  en: "lost update"
  vi_keep: true
  vi: "lost update"
  short_vi: "Hai giao dịch cùng đọc một giá trị rồi cùng ghi; lần ghi sau lặng lẽ xóa mất lần ghi trước"
  short_en: "Two transactions read the same value and both write; the later write silently erases the earlier one"
  introduced_in: backend.l2.transactions-in-practice
- term: optimistic-concurrency
  en: "optimistic concurrency"
  vi_keep: true
  vi: "optimistic concurrency"
  short_vi: "Cho đọc không khóa, đến lúc lưu mới kiểm dòng có bị đổi từ khi đọc không; nếu có thì từ chối lưu"
  short_en: "Reading without locks and refusing a save if the row changed since it was read"
  introduced_in: backend.l2.optimistic-concurrency
- term: concurrency-token
  en: "concurrency token"
  vi_keep: true
  vi: "concurrency token"
  short_vi: "Giá trị được so lúc lưu để phát hiện dòng đã bị đổi từ khi đọc"
  short_en: "A value compared at save time to detect that a row changed since it was read"
  introduced_in: backend.l2.optimistic-concurrency
- term: design-pattern
  en: "design pattern"
  vi_keep: true
  vi: "design pattern"
  short_vi: "Một dạng lời giải có tên, dùng lại được, cho một vấn đề thiết kế hay lặp lại"
  short_en: "A named, reusable shape of solution to a design problem that keeps coming back"
  introduced_in: design.l2.strategy-pattern
- term: strategy-pattern
  en: "Strategy pattern"
  vi_keep: true
  vi: "Strategy pattern"
  short_vi: "Mỗi biến thể của một quy tắc nằm trong class riêng; code cần quy tắc được truyền vào một đối tượng trong số đó"
  short_en: "Each variant of a rule lives in its own class, and the code that needs the rule is handed one of them"
  introduced_in: design.l2.strategy-pattern
- term: factory
  en: factory
  vi_keep: true
  vi: factory
  short_vi: "Phương thức hoặc đối tượng chuyên tạo đối tượng, để nơi dùng không phải gọi tên class cụ thể"
  short_en: "A method or object whose job is creating objects, so callers never name the concrete class"
  introduced_in: design.l2.factory
- term: template-method-pattern
  en: "Template Method pattern"
  vi_keep: true
  vi: "Template Method pattern"
  short_vi: "Phương thức ở lớp cha cố định thứ tự các bước, để lớp con điền một số bước"
  short_en: "A base-class method fixes the order of the steps and leaves some of them for subclasses to fill in"
  introduced_in: design.l2.template-method-pattern
- term: builder-pattern
  en: "Builder pattern"
  vi_keep: true
  vi: "Builder pattern"
  short_vi: "Một builder gom cấu hình qua nhiều bước, rồi một lời gọi cuối tạo ra đối tượng hoàn chỉnh"
  short_en: "A builder collects settings over several steps, then one final call creates the finished object"
  introduced_in: design.l2.builder-pattern
- term: decorator-pattern
  en: "Decorator pattern"
  vi_keep: true
  vi: "Decorator pattern"
  short_vi: "Lớp bọc có cùng interface với đối tượng được bọc, làm thêm việc trước hoặc sau mỗi lời gọi"
  short_en: "A wrapper with the same interface as the object it wraps, adding work before or after each call"
  introduced_in: design.l2.decorator-pattern
- term: adapter-pattern
  en: "Adapter pattern"
  vi_keep: true
  vi: "Adapter pattern"
  short_vi: "Class cài đặt interface mà code của bạn cần bằng cách dịch mỗi lời gọi sang interface của thứ khác"
  short_en: "A class that implements the interface your code wants by translating each call into another interface"
  introduced_in: design.l2.adapter-pattern
- term: observer-pattern
  en: "Observer pattern"
  vi_keep: true
  vi: "Observer pattern"
  short_vi: "Các bên đăng ký với một đối tượng; khi có chuyện xảy ra, đối tượng gọi từng bên mà không biết chúng làm gì"
  short_en: "Subscribers register with an object, which calls each of them when something happens, without knowing what they do"
  introduced_in: design.l2.observer-pattern
- term: dependency-rule
  en: "dependency rule"
  vi_keep: true
  vi: "dependency rule"
  short_vi: "Phụ thuộc trong mã nguồn chỉ hướng vào quy tắc nghiệp vụ; code giữ quy tắc không gọi tên thứ gì bên ngoài nó"
  short_en: "Source-code dependencies point only toward the business rules; code holding the rules names nothing outside it"
  introduced_in: design.l2.dependency-rule
- term: hexagonal-architecture
  en: "hexagonal architecture"
  vi_keep: true
  vi: "hexagonal architecture"
  short_vi: "Kiến trúc đặt nghiệp vụ trong một lõi chỉ nói chuyện với bên ngoài qua port (interface của lõi) do adapter cài đặt"
  short_en: "A core of business rules that reaches the outside only through its own interfaces (ports), implemented by adapters"
  introduced_in: design.l2.ports-and-adapters
  aliases: ["ports and adapters"]
- term: driving-adapter
  en: "driving adapter"
  vi_keep: true
  vi: "driving adapter"
  short_vi: "Adapter gọi vào lõi để yêu cầu nó làm một việc, như controller hoặc một test"
  short_en: "An adapter that calls into the core to ask it to do something, such as a controller or a test"
  introduced_in: design.l2.driving-and-driven-adapters
  aliases: ["primary adapter"]
- term: driven-adapter
  en: "driven adapter"
  vi_keep: true
  vi: "driven adapter"
  short_vi: "Adapter được lõi gọi qua một port do lõi khai báo, như repository EF Core hay notifier"
  short_en: "An adapter the core calls through a port it declares, such as an EF Core repository or a notifier"
  introduced_in: design.l2.driving-and-driven-adapters
  aliases: ["secondary adapter"]
- term: clean-architecture
  en: "Clean Architecture"
  vi_keep: true
  vi: "Clean Architecture"
  short_vi: "Kiến trúc vẽ hệ thống thành các vòng, nghiệp vụ ở giữa, framework và DB ở ngoài; phụ thuộc chỉ hướng vào trong"
  short_en: "Draws a system as rings, business rules at the centre, frameworks and database outside; dependencies point inward"
  introduced_in: design.l2.clean-architecture
- term: use-case
  en: "use case"
  vi_keep: true
  vi: "use case"
  short_vi: "Một việc ứng dụng làm cho người dùng, cùng các quy tắc để làm việc đó, như đặt đơn hay hủy đơn"
  short_en: "One thing the application does for its user, with the rules for doing it, such as placing an order"
  introduced_in: design.l2.clean-architecture
- term: unit-of-work
  en: "unit of work"
  vi_keep: true
  vi: "unit of work"
  short_vi: "Theo dõi mọi thay đổi của một thao tác nghiệp vụ rồi ghi tất cả cùng lúc; DbContext của EF Core là một ví dụ"
  short_en: "Tracks every change one business operation makes and writes them all together; EF Core's DbContext is one"
  introduced_in: design.l2.unit-of-work
- term: composition-root
  en: "composition root"
  vi_keep: true
  vi: "composition root"
  short_vi: "Chỗ duy nhất dựng và nối các đối tượng của ứng dụng lại với nhau, như Program.cs"
  short_en: "The one place where the application's objects are wired together, such as Program.cs"
  introduced_in: design.l2.composition-root
- term: architecture-test
  en: "architecture test"
  vi_keep: true
  vi: "architecture test"
