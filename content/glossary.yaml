  short_en: "A relationship where the downstream context uses the upstream model as it is, with no translation"
  introduced_in: design.l3.conformist
- term: anti-corruption-layer
  en: "anti-corruption layer"
  vi_keep: true
  vi: "anti-corruption layer"
  short_vi: "Lớp code ở rìa downstream context, dịch mô hình của upstream sang mô hình của mình"
  short_en: "Code at the edge of a downstream context that translates the upstream model into its own"
  introduced_in: design.l3.anti-corruption-layer
- term: monolith
  en: monolith
  vi_keep: true
  vi: monolith
  short_vi: "Ứng dụng được build và deploy thành một khối, mọi phần chạy trong cùng một process"
  short_en: "An application built and deployed as one unit, with all its parts running in the same process"
  introduced_in: design.l3.modular-monolith
- term: modular-monolith
  en: "modular monolith"
  vi_keep: true
  vi: "modular monolith"
  short_vi: "Monolith mà code chia thành các module, mỗi module sở hữu mô hình và dữ liệu riêng, chỉ được gọi qua hợp đồng"
  short_en: "A monolith whose code is split into modules, each owning its model and data and reached only through its contract"
  introduced_in: design.l3.modular-monolith
- term: module-contract
  en: "module contract"
  vi_keep: false
  vi: "hợp đồng của module"
  short_vi: "Tập nhỏ các kiểu public mà module khác được dùng; mọi thứ còn lại trong module là internal"
  short_en: "The small set of public types other modules may use; everything else in the module stays internal"
  introduced_in: design.l3.module-contracts
- term: microservice
  en: microservice
  vi_keep: true
  vi: microservice
  short_vi: "Service được deploy và chạy riêng, sở hữu dữ liệu của một bounded context, chỉ được gọi qua mạng"
  short_en: "A service deployed and run on its own, owning one bounded context's data and reached only over the network"
  introduced_in: design.l3.before-extracting-a-module
- term: message-broker
  en: "message broker"
  vi_keep: true
  vi: "message broker"
  short_vi: "Server nhận message từ một chương trình và giữ chúng cho tới khi chương trình khác lấy đi"
  short_en: "A server that accepts messages from one program and keeps them until another program takes them"
  introduced_in: backend.l3.message-broker
- term: message-queue
  en: "message queue"
  vi_keep: false
  vi: "hàng đợi message"
  short_vi: "Nơi trong message broker giữ message theo thứ tự đến, chờ một chương trình nhận lấy"
  short_en: "A place in a message broker that holds messages in arrival order until a program takes them"
  introduced_in: backend.l3.message-broker
- term: rabbitmq
  en: RabbitMQ
  vi_keep: true
  vi: RabbitMQ
  short_vi: "Message broker mã nguồn mở mà Đơn Hàng dùng từ stage-3 để các service gửi message cho nhau"
  short_en: "The open-source message broker Đơn Hàng's services use to send each other messages from stage-3"
  introduced_in: backend.l3.message-broker
- term: rabbitmq-exchange
  en: "exchange (RabbitMQ)"
  vi_keep: true
  vi: exchange
  short_vi: "Nơi publisher gửi message tới trong RabbitMQ; nó chép message sang các queue có binding khớp"
  short_en: "Where a publisher sends messages in RabbitMQ; it copies each one to the queues whose bindings match"
  introduced_in: backend.l3.exchanges-and-bindings
- term: rabbitmq-binding
  en: "binding (RabbitMQ)"
  vi_keep: true
  vi: binding
  short_vi: "Quy tắc nối một queue với một exchange, cho biết queue nhận những message nào"
  short_en: "A rule linking a queue to an exchange, saying which messages the queue receives"
  introduced_in: backend.l3.exchanges-and-bindings
- term: routing-key
  en: "routing key"
  vi_keep: true
  vi: "routing key"
  short_vi: "Chuỗi publisher gắn vào message, được exchange so với binding để chọn queue, như order.placed"
  short_en: "A string the publisher attaches to a message, matched against bindings to pick queues, such as order.placed"
  introduced_in: backend.l3.exchanges-and-bindings
- term: publish-subscribe
  en: publish/subscribe
  vi_keep: true
  vi: publish/subscribe
  short_vi: "Cách gửi message mà bên gửi không biết ai nhận; mỗi bên đăng ký nhận được một bản riêng"
  short_en: "Sending messages without knowing the receivers; every subscriber gets its own copy"
  introduced_in: backend.l3.exchanges-and-bindings
- term: dual-write
  en: "dual write"
  vi_keep: true
  vi: "dual write"
  short_vi: "Một thao tác phải ghi vào hai hệ thống, như database và message broker, mà không transaction nào bao cả hai"
  short_en: "One operation writing to two systems, such as a database and a broker, with no transaction covering both"
  introduced_in: backend.l3.dual-write
- term: outbox
  en: outbox
  vi_keep: true
  vi: outbox
  short_vi: "Bảng trong database của bên gửi, lưu message cùng transaction với thay đổi, để publish sau"
  short_en: "A table in the sender's database where a message is saved with the change it describes, to publish later"
  introduced_in: backend.l3.outbox-pattern
- term: publisher-confirm
  en: "publisher confirm"
  vi_keep: true
  vi: "publisher confirm"
  short_vi: "Lời RabbitMQ báo cho bên publish rằng nó đã nhận trách nhiệm giữ một message"
  short_en: "RabbitMQ's answer telling the publisher it has taken responsibility for a message"
  introduced_in: backend.l3.outbox-relay
- term: message-consumer
  en: "message consumer"
  vi_keep: true
  vi: "message consumer"
  short_vi: "Code nhận message từ một queue và xử lý chúng"
  short_en: "Code that receives messages from a queue and handles them"
  introduced_in: backend.l3.consumer-acknowledgements
- term: idempotent-consumer
  en: "idempotent consumer"
  vi_keep: true
  vi: "idempotent consumer"
  short_vi: "Consumer nhận lại một message đã xử lý mà không làm lại việc của nó"
  short_en: "A consumer that receives a message it already handled without doing its work again"
  introduced_in: backend.l3.idempotent-consumer
- term: inbox
  en: "inbox (messaging)"
  vi_keep: true
  vi: inbox
  short_vi: "Bảng của bên nhận ghi id các message đã xử lý, lưu cùng transaction với việc message gây ra"
  short_en: "A receiver's table of handled message ids, saved in the same transaction as the work they caused"
  introduced_in: backend.l3.idempotent-consumer
- term: poison-message
  en: "poison message"
  vi_keep: true
  vi: "poison message"
  short_vi: "Message mà consumer không bao giờ xử lý được, lần giao nào cũng lỗi"
  short_en: "A message the consumer can never handle, failing on every delivery"
  introduced_in: backend.l3.dead-letter-queue
- term: dead-letter-queue
  en: "dead-letter queue"
  vi_keep: true
  vi: "dead-letter queue"
  short_vi: "Queue nhận các message mà queue khác bỏ cuộc, để người xem xét sau"
  short_en: "A queue that receives the messages another queue gives up on, for a person to inspect"
  introduced_in: backend.l3.dead-letter-queue
- term: distributed-transaction
  en: "distributed transaction"
  vi_keep: false
  vi: "giao dịch phân tán"
  short_vi: "Một giao dịch trải trên nhiều database hay hệ thống: tất cả cùng lưu hoặc cùng hủy"
  short_en: "One transaction over several databases or systems: all of them commit, or all roll back"
  introduced_in: backend.l3.two-phase-commit
- term: two-phase-commit
  en: "two-phase commit (2PC)"
  vi_keep: true
  vi: "two-phase commit (2PC)"
  short_vi: "Cách làm giao dịch phân tán: coordinator bảo mọi bên chuẩn bị, rồi chỉ cho commit khi tất cả đã chuẩn bị xong"
  short_en: "A way to run a distributed transaction: a coordinator has every party prepare, then lets all commit only if all prepared"
  introduced_in: backend.l3.two-phase-commit
- term: saga
  en: saga
  vi_keep: true
  vi: saga
  short_vi: "Chuỗi transaction cục bộ ở nhiều service, mỗi bước lưu thay đổi rồi gửi message khởi động bước kế"
  short_en: "A chain of local transactions in several services; each step saves its change and sends a message that starts the next"
  introduced_in: backend.l3.saga
- term: strong-consistency
  en: "strong consistency"
  vi_keep: true
  vi: "strong consistency"
  short_vi: "Mọi lần đọc bắt đầu sau khi một thay đổi đã lưu đều thấy thay đổi đó"
  short_en: "Every read that starts after a change is saved sees that change"
  introduced_in: backend.l3.eventual-consistency
- term: eventual-consistency
  en: "eventual consistency"
  vi_keep: true
  vi: "eventual consistency"
  short_vi: "Các bản dữ liệu có thể lệch nhau một lúc, nhưng khớp lại khi mọi thay đổi đã được xử lý; không hứa thời hạn"
  short_en: "Copies of data may disagree for a while but agree once every change has been handled; no time limit is promised"
  introduced_in: backend.l3.eventual-consistency
- term: compensating-action
  en: "compensating action"
  vi_keep: false
  vi: "hành động bù"
  short_vi: "Một thay đổi mới hủy tác dụng nghiệp vụ của một bước saga đã lưu, thay cho rollback"
  short_en: "A new change that undoes, for the business, a saga step already committed, in place of a rollback"
  introduced_in: backend.l3.compensating-action
- term: saga-choreography
  en: "choreography (saga)"
  vi_keep: true
  vi: "choreography (saga)"
  short_vi: "Cách chạy saga không có bên điều phối: mỗi service tự phản ứng với message của service khác"
  short_en: "Running a saga with no coordinator: each service reacts to the other services' messages"
  introduced_in: backend.l3.choreography-vs-orchestration
- term: saga-orchestration
  en: "orchestration (saga)"
  vi_keep: true
  vi: "orchestration (saga)"
  short_vi: "Cách chạy saga có một orchestrator giữ trạng thái, gửi lệnh cho từng service và chọn bước tiếp theo"
  short_en: "Running a saga with one orchestrator that keeps its state, commands each service and picks the next step"
  introduced_in: backend.l3.choreography-vs-orchestration
- term: cqrs
  en: CQRS
  vi_keep: true
  vi: CQRS
  short_vi: "Tách phần code ghi dữ liệu khỏi phần code đọc dữ liệu, để mỗi bên có hình dạng hợp với việc của nó"
  short_en: "Separating the code that changes data from the code that reads it, so each side takes the shape its job needs"
  introduced_in: design.l3.cqrs
- term: read-model
  en: "read model"
  vi_keep: true
  vi: "read model"
  short_vi: "Dữ liệu lưu sẵn theo đúng hình dạng một truy vấn cần, được cập nhật từ các thay đổi của phía ghi"
  short_en: "Data stored in the shape one query needs, kept up to date from the write side's changes"
  introduced_in: design.l3.read-model
- term: event-sourcing
  en: "event sourcing"
  vi_keep: true
  vi: "event sourcing"
  short_vi: "Lưu một aggregate dưới dạng danh sách các event đã xảy ra với nó; trạng thái hiện tại được tính lại từ các event đó"
  short_en: "Storing an aggregate as the list of events that happened to it; its current state is computed from them"
  introduced_in: design.l3.event-sourcing
- term: event-stream
  en: "event stream"
  vi_keep: true
  vi: "event stream"
  short_vi: "Các event của một aggregate theo đúng thứ tự, mỗi event mang số version kế tiếp"
  short_en: "One aggregate's events in order, each carrying the next version number"
  introduced_in: design.l3.event-sourcing
- term: event-store
  en: "event store"
  vi_keep: true
  vi: "event store"
  short_vi: "Nơi lưu các event stream, chỉ cho nối thêm event vào cuối, không sửa hay xóa event đã lưu"
  short_en: "Storage for event streams that only lets events be appended, never changed or deleted"
  introduced_in: design.l3.event-sourcing
- term: event-replay
  en: "event replay"
  vi_keep: true
  vi: "event replay"
  short_vi: "Áp lại các event đã lưu theo thứ tự để dựng lại trạng thái từ chúng"
  short_en: "Applying stored events again, in order, to rebuild state from them"
  introduced_in: design.l3.rebuilding-state-from-events
- term: event-projection
  en: "event projection"
  vi_keep: true
  vi: "event projection"
  short_vi: "Code đọc các event theo thứ tự và dựng từ chúng một read model; xóa đi rồi dựng lại được"
  short_en: "Code that reads events in order and builds a read model from them; it can be thrown away and rebuilt"
  introduced_in: design.l3.event-projections
- term: event-snapshot
  en: "snapshot (event sourcing)"
  vi_keep: true
  vi: "snapshot (event sourcing)"
  short_vi: "Trạng thái của một aggregate tại một version, lưu lại để lần nạp sau chỉ cần áp các event sau đó"
  short_en: "An aggregate's state at one version, saved so later loads apply only the events after it"
  introduced_in: design.l3.snapshots
- term: observability
  en: observability
  vi_keep: true
  vi: observability
  short_vi: "Mức độ có thể biết chuyện gì đã xảy ra bên trong hệ thống đang chạy chỉ từ dữ liệu nó gửi ra"
  short_en: "How well you can tell what happened inside a running system from the data it sends out"
  introduced_in: backend.l3.observability
- term: telemetry
  en: telemetry
  vi_keep: true
  vi: telemetry
  short_vi: "Dữ liệu một chương trình gửi ra về chính công việc của nó: log, metric và trace"
  short_en: "Data a program sends out about its own work: logs, metrics and traces"
  introduced_in: backend.l3.observability
- term: distributed-trace
  en: "trace (distributed tracing)"
  vi_keep: true
  vi: trace
  short_vi: "Bản ghi một việc, như một request, qua mọi process nó đi tới; mọi span trong đó có chung trace id"
  short_en: "A record of one piece of work across every process it reaches; all its spans share one trace id"
  introduced_in: backend.l3.traces-and-spans
  aliases: ["distributed tracing"]
- term: trace-span
  en: "span (tracing)"
  vi_keep: true
  vi: span
  short_vi: "Một thao tác có thời gian trong trace, có tên, thời điểm bắt đầu, thời lượng và span cha"
  short_en: "One timed operation in a trace, with a name, start time, duration and parent span"
  introduced_in: backend.l3.traces-and-spans
- term: tempo
  en: Tempo
  vi_keep: true
  vi: Tempo
  short_vi: "Kho lưu trace; Grafana truy vấn nó như một data source, cạnh Prometheus và Loki"
  short_en: "A trace store that Grafana queries as a data source, next to Prometheus and Loki"
  introduced_in: backend.l3.traces-and-spans
- term: opentelemetry
  en: OpenTelemetry
  vi_keep: true
  vi: OpenTelemetry
  short_vi: "Chuẩn mở kèm thư viện để tạo và gửi telemetry: API cho code gọi, SDK thu và xuất, giao thức OTLP"
  short_en: "An open standard with libraries for producing and sending telemetry: an API, an SDK and OTLP"
  introduced_in: backend.l3.opentelemetry-sdk
  aliases: [OTel]
- term: instrumentation
  en: instrumentation
  vi_keep: true
  vi: instrumentation
  short_vi: "Code tạo span hoặc số đo cho một thư viện, để code dùng thư viện đó không phải tự viết"
  short_en: "Code that creates spans or measurements for a library, so the code using it need not"
  introduced_in: backend.l3.opentelemetry-sdk
- term: otlp
  en: "OTLP (OpenTelemetry Protocol)"
  vi_keep: true
  vi: OTLP
  short_vi: "Giao thức của OpenTelemetry để gửi telemetry từ chương trình tới nơi nhận"
  short_en: "OpenTelemetry's protocol for sending telemetry from a program to a receiver"
  introduced_in: backend.l3.opentelemetry-sdk
- term: trace-context
  en: "trace context"
  vi_keep: true
  vi: "trace context"
  short_vi: "Trace id và span id hiện tại, được chuyển sang process kế tiếp, ví dụ trong header traceparent"
  short_en: "The trace id and current span id, passed to the next process, e.g. in the traceparent header"
  introduced_in: backend.l3.trace-context-propagation
- term: context-propagation
  en: "context propagation"
  vi_keep: false
  vi: "truyền ngữ cảnh trace"
  short_vi: "Chuyển trace context từ process này sang process kế tiếp để span của bên nhận nhập vào cùng trace"
  short_en: "Passing the trace context to the next process so the receiver's spans join the same trace"
  introduced_in: backend.l3.trace-context-propagation
- term: correlation-id
  en: "correlation id"
  vi_keep: true
  vi: "correlation id"
  short_vi: "Mã mà mọi bản ghi của cùng một việc mang theo, để gom chúng lại sau; có trace thì trace id làm việc này"
  short_en: "An id every record of one piece of work carries so they can be gathered; with tracing, the trace id"
  introduced_in: backend.l3.trace-ids-in-logs
- term: trace-sampling
  en: "sampling (tracing)"
  vi_keep: false
  vi: "lấy mẫu trace"
  short_vi: "Chỉ giữ lại một phần trace để giảm chi phí; head sampling quyết ngay khi trace bắt đầu"
  short_en: "Keeping only some traces to cut cost; head sampling decides when the trace starts"
  introduced_in: backend.l3.trace-sampling
  aliases: ["head sampling"]
- term: cascading-failure
  en: "cascading failure"
  vi_keep: true
  vi: "cascading failure"
  short_vi: "Lỗi lan dây chuyền: một phụ thuộc chậm hay hỏng làm cạn tài nguyên chung, kéo cả phần không dùng nó hỏng theo"
  short_en: "A failure that spreads: one slow or broken dependency uses up shared capacity until unrelated work fails too"
  introduced_in: backend.l3.slow-dependencies
- term: graceful-degradation
  en: "graceful degradation"
  vi_keep: true
  vi: "graceful degradation"
  short_vi: "Khi một phụ thuộc hỏng, hệ thống giữ chức năng chính và chỉ mất phần cần phụ thuộc đó, theo cách đã chọn trước"
  short_en: "When a dependency fails, keeping the main functions and losing only what needs it, in a way chosen in advance"
  introduced_in: backend.l3.graceful-degradation
- term: jitter
  en: jitter
  vi_keep: true
  vi: jitter
  short_vi: "Phần ngẫu nhiên thêm vào thời gian chờ trước khi thử lại, để các lần thử lại không đến cùng lúc"
  short_en: "A random part added to the wait before a retry, so retries do not arrive at the same moment"
  introduced_in: backend.l3.retry-jitter
- term: resilience-pipeline
  en: "resilience pipeline"
  vi_keep: true
  vi: "resilience pipeline"
  short_vi: "Chuỗi chiến lược như timeout, retry, circuit breaker mà mọi lời gọi tới một phụ thuộc đều đi qua"
  short_en: "A chain of strategies, such as timeout, retry or circuit breaker, that every call to a dependency passes through"
  introduced_in: backend.l3.resilience-pipeline
- term: circuit-breaker
  en: "circuit breaker"
  vi_keep: true
  vi: "circuit breaker"
  short_vi: "Cơ chế ngừng gọi một phụ thuộc trong một lúc khi quá nhiều lời gọi tới nó thất bại, rồi gọi thử để mở lại"
  short_en: "A mechanism that stops calling a dependency for a while once too many calls fail, then tries one call to resume"
  introduced_in: backend.l3.circuit-breaker
- term: rate-limiting
  en: "rate limiting"
  vi_keep: true
  vi: "rate limiting"
  short_vi: "Giới hạn số request một client được gửi trong một khoảng thời gian; quá giới hạn thì bị từ chối"
  short_en: "Capping how many requests a client may send in a period; requests over the cap are rejected"
  introduced_in: backend.l3.rate-limiting
- term: bulkhead
  en: bulkhead
  vi_keep: true
  vi: bulkhead
  short_vi: "Chia tài nguyên chung thành các phần riêng để một loại việc quá tải chỉ làm đầy phần của nó"
  short_en: "Splitting shared capacity into separate parts so an overload of one kind of work fills only its own part"
  introduced_in: backend.l3.bulkhead
- term: tenant
  en: tenant
  vi_keep: true
  vi: tenant
  short_vi: "Một tổ chức dùng chung một hệ thống như của riêng mình, ví dụ một cửa hàng trên nền tảng bán hàng"
  short_en: "One organisation that uses a shared system as if it were its own, such as one shop on a selling platform"
  introduced_in: backend.l3.multi-tenancy
- term: multi-tenancy
  en: multi-tenancy
  vi_keep: true
  vi: multi-tenancy
  short_vi: "Một hệ thống đang chạy (code và database) phục vụ nhiều tenant cùng lúc"
  short_en: "One running system, code and databases, serving many tenants at once"
  introduced_in: backend.l3.multi-tenancy
- term: tenant-isolation
  en: "tenant isolation"
  vi_keep: false
