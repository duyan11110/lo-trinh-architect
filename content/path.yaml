# path.yaml — thứ tự main path của toàn khóa học, theo giai đoạn → module.
# Module ghi dạng <track>/<module-id>. Bài trong module theo thứ tự trong track.yaml.
# Giai đoạn 0 đã chốt (khớp content/tracks/foundation/track.yaml). Giai đoạn 1–4 là dự kiến từ brainstorm v0.3, chốt dần khi outline.

stages:
  - stage: 0
    title: { vi: "Nền tảng", en: "Foundations" }
    gate: gate0
    outcome:
      vi: "Giải thích được điều gì xảy ra từ lúc gõ URL đến lúc trang hiện ra; viết được truy vấn JOIN; dùng Git branch, merge, rebase không sợ; đọc và debug code người khác có phương pháp."
      en: "Explain what happens from typing a URL to seeing a page; write a JOIN; branch, merge and rebase without fear; read and debug someone else's code methodically."
    modules:
      - foundation/computer
      - foundation/terminal
      - foundation/network
      - foundation/http
      - foundation/data-sql
      - foundation/oop-ds
      - foundation/clean-code
      - foundation/git
      - foundation/debugging
      - foundation/craft
      - management/team-basics

  - stage: 1
    title: { vi: "Làm được việc", en: "Working" }
    gate: gate1
    outcome:
      vi: "Xây được một API có DB, một client gọi nó, chạy trong Docker; đọc một PR 300 dòng và nhận xét được về tầng, phụ thuộc, test."
      en: "Build an API with a DB and a client, run it in Docker; review a 300-line PR for layering, dependencies and tests."
    modules:
      - backend/web-server
      - backend/rest-api
      - backend/orm-efcore
      - backend/validation-errors-logging
      - design/solid
      - design/layered
      - design/dependency-injection
      - design/unit-testing
      - backend/auth-basics
      - frontend/web-foundations
      - frontend/flutter-foundations
      - frontend/calling-apis
      - devops/deploy-basics
      - devops/docker
      - devops/config-and-secrets
      - management/stories-and-estimation
      - management/code-review

  - stage: 2
    title: { vi: "Vững nghề", en: "Solid" }
    gate: gate2
    outcome:
      vi: "Deploy hệ thống ví dụ lên cluster qua pipeline, có dashboard và log; giải thích được vì sao cache làm dữ liệu cũ."
      en: "Deploy the example system to a cluster through a pipeline with dashboards and logs; explain why a cache serves stale data."
    modules:
      - backend/api-design
      - backend/oauth-and-authz
      - backend/caching
      - backend/background-jobs
      - backend/indexes-and-plans
      - design/gof-patterns
      - design/clean-hexagonal
      - design/domain-model
      - design/integration-testing
      - frontend/state-and-routing
      - frontend/forms-i18n-theming
      - devops/ci-cd
      - devops/release
      - devops/monitoring-basics
      - k8s/why-and-architecture
      - k8s/workloads
      - k8s/config-and-probes
      - management/planning-and-risk
      - management/technical-writing

  - stage: 3
    title: { vi: "Senior", en: "Senior" }
    gate: gate3
    outcome:
      vi: "Viết một ADR cho việc tách một module thành service riêng, nêu 3 phương án và lý do chọn."
      en: "Write an ADR for extracting a module into a service, with three options and a justified choice."
    modules:
      - design/ddd-tactical
      - design/ddd-strategic
      - design/modular-monolith
      - backend/messaging
      - backend/sagas-and-consistency
      - design/cqrs-event-sourcing
      - backend/observability
      - backend/resilience
      - backend/multitenancy-and-sharding
      - frontend/performance-offline
      - frontend/design-system
      - devops/iac
      - devops/gitops
      - devops/secrets-backup-dr
      - devops/supply-chain
      - k8s/ingress-helm
      - k8s/state-and-storage
      - k8s/security-and-policy
      - k8s/networking-deep
      - k8s/bare-metal
      - k8s/operators-and-cluster-lifecycle
      - management/tech-debt-and-adr
      - management/build-vs-buy-tco

  - stage: 4
    title: { vi: "Architect", en: "Architect" }
    gate: gate4
    outcome:
      vi: "Thiết kế hệ thống ký số tài liệu cho ngân hàng từ yêu cầu đến sơ đồ triển khai, trả lời được câu hỏi phản biện."
      en: "Design a bank document-signing system from requirements to deployment diagram and defend it under challenge."
    modules:
      - design/choosing-architecture
      - design/evolutionary-and-tradeoffs
      - backend/consistency-and-ownership
      - backend/security-architecture
      - backend/capacity-and-slo
      - frontend/stack-and-boundaries
      - devops/platform-and-release-strategy
      - devops/incidents
      - k8s/multi-cluster-and-mesh
      - k8s/managed-vs-selfhosted
      - management/governance-and-strategy
      - management/teams-and-leadership
      - sysdesign/framework
      - sysdesign/problems
