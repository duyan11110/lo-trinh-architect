  - { id: foundation.oop.encapsulation, title: { vi: "Đóng gói", en: "Encapsulation" } }
  - { id: foundation.oop.polymorphism,  title: { vi: "Đa hình", en: "Polymorphism" }, prereqs: [foundation.oop.encapsulation] }
