# Track 0 — Nền tảng & kỹ năng nghề. Toàn bộ thuộc Giai đoạn 0, example_tag stage-0.
# Đây là outline ĐẦY ĐỦ để bạn biên tập trước khi sinh bài. Mỗi lesson: outline = hợp đồng nội dung, misconceptions = ngộ nhận thật.
# Quy ước file repo ví dụ ở stage-0: db/, www/, scripts/, samples/DonHang.Samples/Samples/<Module>/, git-playground/.

id: foundation
title: { vi: "Nền tảng & kỹ năng nghề", en: "Foundations & craft" }
description:
  vi: "Những thứ trường không dạy và công ty giả định bạn đã biết: máy tính, terminal, mạng, HTTP, SQL, OOP đúng nghĩa, clean code, Git, debug và cách làm nghề."
  en: "What school skips and employers assume: computers, terminal, networking, HTTP, SQL, real OOP, clean code, Git, debugging and the craft of the job."

skills:
  - { id: foundation.os.process,        title: { vi: "Process và vòng đời chương trình", en: "Processes and program lifecycle" } }
  - { id: foundation.os.memory,         title: { vi: "Bộ nhớ: stack, heap, GC", en: "Memory: stack, heap, GC" }, prereqs: [foundation.os.process] }
  - { id: foundation.os.filesystem,     title: { vi: "File system và quyền", en: "File system and permissions" } }
  - { id: foundation.os.env,            title: { vi: "Biến môi trường và cấu hình", en: "Environment variables and configuration" }, prereqs: [foundation.os.process] }
  - { id: foundation.concurrency.basics, title: { vi: "Thread và async cơ bản", en: "Threads and async basics" }, prereqs: [foundation.os.process] }
  - { id: foundation.shell.navigation,  title: { vi: "Điều hướng và thao tác file trong shell", en: "Shell navigation and file operations" }, prereqs: [foundation.os.filesystem] }
  - { id: foundation.shell.pipes,       title: { vi: "Pipe, redirect, filter", en: "Pipes, redirects, filters" }, prereqs: [foundation.shell.navigation] }
  - { id: foundation.shell.remote,      title: { vi: "SSH và làm việc trên máy khác", en: "SSH and remote work" }, prereqs: [foundation.shell.navigation] }
  - { id: foundation.net.addressing,    title: { vi: "IP, port, localhost", en: "IP, ports, localhost" }, prereqs: [foundation.os.process] }
  - { id: foundation.net.dns,           title: { vi: "DNS", en: "DNS" }, prereqs: [foundation.net.addressing] }
  - { id: foundation.net.transport,     title: { vi: "TCP/UDP và kết nối", en: "TCP/UDP and connections" }, prereqs: [foundation.net.addressing] }
  - { id: foundation.net.tls,           title: { vi: "TLS và HTTPS", en: "TLS and HTTPS" }, prereqs: [foundation.net.transport] }
  - { id: foundation.http.message,      title: { vi: "Cấu trúc request/response", en: "Request/response structure" }, prereqs: [foundation.net.transport] }
  - { id: foundation.http.methods,      title: { vi: "HTTP method và ngữ nghĩa", en: "HTTP methods and semantics" }, prereqs: [foundation.http.message] }
  - { id: foundation.http.status,       title: { vi: "Status code", en: "Status codes" }, prereqs: [foundation.http.message] }
  - { id: foundation.http.state,        title: { vi: "Cookie và trạng thái", en: "Cookies and state" }, prereqs: [foundation.http.message] }
  - { id: foundation.http.caching,      title: { vi: "Cache HTTP", en: "HTTP caching" }, prereqs: [foundation.http.message] }
  - { id: foundation.data.encoding,     title: { vi: "Encoding và JSON", en: "Encoding and JSON" } }
  - { id: foundation.data.time,         title: { vi: "Thời gian và múi giờ", en: "Time and time zones" } }
  - { id: foundation.sql.model,         title: { vi: "Mô hình quan hệ", en: "Relational model" } }
