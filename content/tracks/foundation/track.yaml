  - { id: foundation.debug.tools,       title: { vi: "Công cụ debug", en: "Debugging tools" }, prereqs: [foundation.debug.method] }
  - { id: foundation.craft.docs,        title: { vi: "Đọc tài liệu kỹ thuật", en: "Reading technical documentation" } }
  - { id: foundation.craft.questions,   title: { vi: "Hỏi và báo cáo", en: "Asking and reporting" } }
