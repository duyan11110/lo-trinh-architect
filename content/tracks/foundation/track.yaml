levels:
  - level: 1
    title: { vi: "Foundation", en: "Foundation" }
    modules:

      # ───────────────────────── MODULE 1: computer ─────────────────────────
      - id: computer
        title: { vi: "Máy tính chạy chương trình như thế nào", en: "How a computer runs your program" }
        stage: 0
        summary: { vi: "Biết chương trình của mình là một process có bộ nhớ, đọc file, nhận cấu hình và chạy song song ra sao.", en: "Know your program as a process with memory, files, configuration and concurrency." }
        lessons:
          - id: foundation.l1.program-to-process
            title: { vi: "Từ file .exe đến một process đang chạy", en: "From a compiled file to a running process" }
            main_path: true
            duration_min: 10
            skills: [foundation.os.process]
            prereqs: []
            related: [foundation.l1.ip-and-ports]
            vocab: [process]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Computer/HelloProcess.cs, scripts/computer/list-processes.sh]
            outline:
              - "A compiled program is a file on disk; running it asks the OS to create a process with its own memory, its own flow of execution and an id."
              - "Several processes of the same program can run at once and do not share memory."
              - "A process ends when its main function returns, when it crashes, or when the OS kills it; the exit code reports which."
              - "You can see processes and their ids with a system tool, and a running program is what the API server will be later."
            misconceptions:
              - "Running my program twice makes the second run see the variables of the first."
              - "If the program prints nothing, it is not running."
            depth_notes: "Không nói về thread, memory layout, container — các bài sau trong module."

          - id: foundation.l1.memory-stack-heap
            title: { vi: "Biến của bạn nằm ở đâu: stack, heap và GC", en: "Where your variables live: stack, heap and the GC" }
            main_path: true
            duration_min: 12
            skills: [foundation.os.memory]
            prereqs: [foundation.l1.program-to-process]
            related: []
            vocab: [stack, heap, garbage-collector]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Computer/StackHeap.cs]
            outline:
              - "Local variables and call frames live on the stack and disappear when the method returns."
              - "Objects created with new live on the heap and outlive the method that created them, as long as something references them."
              - "In .NET the garbage collector reclaims heap objects that nothing references; you do not free memory by hand."
              - "Value types and reference types differ in what is copied on assignment, which explains many 'why did my object change' bugs."
            misconceptions:
              - "Assigning an object to a new variable copies the object."
              - "Setting a variable to null frees the memory immediately."
            depth_notes: "Không nói về GC generations, IDisposable, span — để backend/design L2."

          - id: foundation.l1.files-and-permissions
            title: { vi: "File, thư mục, đường dẫn và quyền", en: "Files, folders, paths and permissions" }
            main_path: true
            duration_min: 10
            skills: [foundation.os.filesystem]
            prereqs: [foundation.l1.program-to-process]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Computer/ReadConfigFile.cs, scripts/computer/permissions.sh]
            outline:
              - "A path is either absolute or relative to the process's working directory, and the working directory is not the folder the executable is in."
              - "Every file and folder has an owner and read/write/execute permissions; a process runs with a user's permissions."
              - "The most common 'file not found' at work is a relative path resolved from an unexpected working directory."
              - "Line endings and the way text is stored as bytes differ between systems, which matters when files move between Windows and Linux."
            misconceptions:
              - "A relative path is relative to where my source file is."
              - "If I can open the file in my editor, my program can open it too."
            depth_notes: "Không đi vào symlink, mount, quyền chi tiết của Linux (chmod bits) — module terminal nhắc lại ở mức lệnh."

          - id: foundation.l1.env-and-config
            title: { vi: "Biến môi trường: cấu hình đi vào chương trình bằng đường nào", en: "Environment variables: how configuration reaches a program" }
            main_path: true
            duration_min: 10
            skills: [foundation.os.env]
            prereqs: [foundation.l1.program-to-process]
            related: [devops.l1.config-and-env]
            vocab: [environment-variable]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Computer/ReadEnv.cs, scripts/computer/env-demo.sh]
            outline:
              - "An environment variable is a name–value pair the OS hands to a process when it starts; the process reads it, it does not 'watch' it."
              - "Changing a variable in one terminal does not affect processes already running or other terminals."
              - "Programs read configuration from files, environment variables and command-line arguments, and later lessons will show why secrets go in the environment, not in files in Git."
              - "The same program behaves differently in different environments only because its inputs differ, not because its code differs."
            misconceptions:
              - "If I set an environment variable, every running program sees the new value."
              - "Configuration is something the program contains."
            depth_notes: "Không nói về appsettings.json, layered configuration của .NET — backend L1."

          - id: foundation.l1.threads-and-async-intro
            title: { vi: "Một process làm nhiều việc cùng lúc: thread và async", en: "One process, many things at once: threads and async" }
            main_path: true
            duration_min: 14
            skills: [foundation.concurrency.basics]
            prereqs: [foundation.l1.program-to-process, foundation.l1.memory-stack-heap]
            related: [backend.l1.request-lifecycle]
            vocab: [thread, async-await]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Computer/ThreadsVsAsync.cs]
            outline:
              - "A thread is an execution path inside a process; threads of the same process share the heap, so two threads can read and write the same object."
              - "Waiting for a file, a network reply or a database is time the CPU does nothing; async/await lets the thread do other work while waiting."
              - "async/await does not create threads; it releases the thread during the wait and resumes afterwards, possibly on another thread."
              - "Most 'my app freezes' and 'my counter is wrong' bugs at work come from blocking on a wait or from two threads touching one object."
            misconceptions:
              - "async makes my code run in parallel on another thread."
              - "Adding await makes the method faster."
            depth_notes: "Không nói về Task scheduling, lock, ConfigureAwait, thread pool sizing — backend L2/L3."

      # ───────────────────────── MODULE 2: terminal ─────────────────────────
      - id: terminal
        title: { vi: "Terminal và Linux cho developer", en: "Terminal and Linux for developers" }
        stage: 0
        summary: { vi: "Tự tin mở terminal, đi tới bất kỳ đâu, xem, tìm, nối lệnh và làm việc trên máy khác qua SSH.", en: "Open a terminal with confidence, move anywhere, inspect, search, chain commands, and work on remote machines over SSH." }
        lessons:
          - id: foundation.l1.terminal-basics
            title: { vi: "Shell là gì và vì sao dev nào cũng cần", en: "What a shell is and why every developer needs one" }
            main_path: true
            duration_min: 10
            skills: [foundation.shell.navigation]
            prereqs: [foundation.l1.files-and-permissions]
            related: []
            vocab: [shell]
            example_tag: stage-0
            example_files: [scripts/terminal/tour.sh]
            outline:
              - "A shell is a program that reads a line, runs a program named by the first word, passes the rest as arguments, and shows the output."
              - "pwd, ls, cd, cat, mkdir, cp, mv, rm are enough to move and inspect; every server you will touch has them."
              - "Tab completion and history are how experienced people type fast; typing full paths by hand is the sign of a beginner."
              - "The shell on your laptop and the shell inside a server or container behave the same, which is why this matters for deployment later."
            misconceptions:
              - "The terminal is a 'hacker' tool; a GUI can do everything it does."
              - "Commands are part of the terminal app rather than separate programs."
            depth_notes: "Không dạy scripting, biến shell, vòng lặp — bài pipes và bài scripts sau."

          - id: foundation.l1.pipes-and-filters
            title: { vi: "Nối lệnh: pipe, redirect và grep", en: "Chaining commands: pipes, redirects and grep" }
            main_path: true
            duration_min: 12
            skills: [foundation.shell.pipes]
            prereqs: [foundation.l1.terminal-basics]
            related: []
            vocab: [pipe]
            example_tag: stage-0
            example_files: [scripts/terminal/pipes.sh, scripts/terminal/find-errors-in-log.sh]
            outline:
              - "Every program has standard input, standard output and standard error; a pipe connects one program's output to the next's input."
              - "grep, sort, uniq, head, tail, wc are small filters that become powerful when chained."
              - "> writes output to a file, >> appends, 2> captures errors separately; mixing them up loses data silently."
              - "Finding the error lines in a large log with grep and tail is the first thing you do in production, before any tool."
            misconceptions:
              - "The pipe runs the second command after the first has finished."
              - "Errors and normal output go to the same place."
            depth_notes: "Không dạy awk/sed nâng cao, regex đầy đủ — đủ grep -i, -n, -r, -E cơ bản."

          - id: foundation.l1.shell-scripts
            title: { vi: "Một script shell nhỏ: biến, tham số, exit code", en: "A small shell script: variables, arguments, exit codes" }
            main_path: true
            duration_min: 12
            skills: [foundation.shell.pipes]
            prereqs: [foundation.l1.pipes-and-filters]
            related: [devops.l2.ci-pipeline-anatomy]
            vocab: []
            example_tag: stage-0
            example_files: [scripts/terminal/backup-db.sh]
            outline:
              - "A script is a file of shell commands run top to bottom; the first line names the interpreter."
              - "Every command returns an exit code; 0 means success, anything else failure, and set -e stops the script at the first failure."
              - "$1, $2 are arguments; quoting variables prevents surprises with spaces in paths."
              - "CI pipelines and deployment jobs later are scripts like this one, so reading them starts here."
            misconceptions:
              - "A script keeps going after a command fails, so the last line ran means everything worked."
              - "Exit codes are only for programs I write in C#."
            depth_notes: "Không dạy if/for/function chi tiết; chỉ đọc hiểu một script có sẵn."

          - id: foundation.l1.ssh-and-remote
            title: { vi: "SSH: làm việc trên một máy ở nơi khác", en: "SSH: working on a machine somewhere else" }
            main_path: true
            duration_min: 10
            skills: [foundation.shell.remote]
            prereqs: [foundation.l1.terminal-basics]
            related: [foundation.l1.tls-and-https, devops.l1.what-is-deploy]
            vocab: []
            example_tag: stage-0
            example_files: [scripts/terminal/ssh-into-lab.sh]
            outline:
              - "SSH gives you a shell on another machine over an encrypted connection; what you type runs there, not on your laptop."
              - "A key pair replaces a password: the public key sits on the server, the private key never leaves your machine."
              - "scp/rsync copy files across; the same idea powers deployment before containers."
              - "Being 'on the server' explains most 'works on my machine' differences: different files, environment and permissions."
            misconceptions:
              - "The private key is what I upload to the server."
              - "A command run over SSH uses my laptop's files."
            depth_notes: "Không nói về ssh config, agent forwarding, bastion — devops L1/L3."

      # ───────────────────────── MODULE 3: network ─────────────────────────
      - id: network
        title: { vi: "Mạng: từ localhost đến HTTPS", en: "Networking: from localhost to HTTPS" }
        stage: 0
        summary: { vi: "Hiểu địa chỉ, port, tên miền, kết nối và mã hóa đủ để đọc lỗi kết nối và cấu hình một service.", en: "Understand addresses, ports, names, connections and encryption well enough to read a connection error and configure a service." }
        lessons:
          - id: foundation.l1.ip-and-ports
            title: { vi: "Địa chỉ IP, port và localhost", en: "IP addresses, ports and localhost" }
            main_path: true
            duration_min: 12
            skills: [foundation.net.addressing]
            prereqs: [foundation.l1.program-to-process]
            related: []
            vocab: [ip-address, port]
            example_tag: stage-0
            example_files: [scripts/network/who-listens.sh, scripts/network/two-servers.sh]
            outline:
              - "An IP address identifies a machine on a network; a port number identifies which process on that machine should receive the data."
              - "A process listens on a port; only one process can listen on a given port at a time, which is what 'address already in use' means."
              - "localhost (127.0.0.1) always means 'this machine', so localhost on the lab box you SSH into later is that box, not your laptop."
              - "Private addresses (10.x, 192.168.x) are not reachable from the internet, which is why your laptop's server is invisible to a friend."
            misconceptions:
              - "localhost is the same machine everywhere, whichever machine runs the command."
              - "A port belongs to a program permanently."
            depth_notes: "Không nói về subnet mask, NAT chi tiết, IPv6 — chỉ nhắc IPv6 tồn tại."

          - id: foundation.l1.dns
            title: { vi: "DNS: tên miền biến thành địa chỉ như thế nào", en: "DNS: how a name becomes an address" }
            main_path: true
            duration_min: 10
            skills: [foundation.net.dns]
            prereqs: [foundation.l1.ip-and-ports]
            related: [k8s.l1.service-and-dns]
            vocab: [dns]
            example_tag: stage-0
            example_files: [scripts/network/resolve.sh]
            outline:
              - "DNS translates a name to an IP address through a chain of resolvers, and each resolver remembers the answer for a while (a time-to-live)."
              - "A name can point to several addresses, and several names can point to one address; the name is not the machine."
              - "The hosts file on your machine overrides DNS, which is how developers point a real name at localhost."
              - "That remembering explains why a DNS change takes time to be seen and why 'it works for me but not for you' happens after a change."
            misconceptions:
              - "Changing a DNS record takes effect everywhere immediately."
              - "One domain name equals one server."
            depth_notes: "Không nói về record types ngoài A/CNAME, DNSSEC, split-horizon."

          - id: foundation.l1.tcp-vs-udp
            title: { vi: "Kết nối là gì: TCP, UDP và handshake", en: "What a connection is: TCP, UDP and the handshake" }
            main_path: true
            duration_min: 12
            skills: [foundation.net.transport]
            prereqs: [foundation.l1.ip-and-ports]
            related: []
            vocab: [tcp]
            example_tag: stage-0
            example_files: [scripts/network/tcp-connect.sh]
            outline:
              - "TCP delivers bytes reliably and in order over a connection that both sides set up first; UDP sends packets without a connection and without guarantees."
              - "A connection is identified by two address:port pairs, so one server port can serve thousands of connections."
              - "Connection refused means nothing listens on that port; timeout means packets never came back, usually a firewall or wrong address."
              - "HTTP rides on TCP; the next lesson shows how encryption is added on top of this same handshake."
            misconceptions:
              - "Connection refused and timeout are the same problem."
              - "Only one client can connect to a port at a time."
            depth_notes: "Không nói về congestion control, window, keep-alive tuning."

          - id: foundation.l1.tls-and-https
            title: { vi: "TLS và HTTPS: chữ S bảo vệ cái gì", en: "TLS and HTTPS: what the S protects" }
            main_path: true
            duration_min: 12
            skills: [foundation.net.tls]
            prereqs: [foundation.l1.tcp-vs-udp, foundation.l1.dns]
            related: [devops.l1.reverse-proxy-and-tls, backend.l4.pki-and-signing]
            vocab: [tls]
            example_tag: stage-0
            example_files: [scripts/network/inspect-cert.sh, Caddyfile]
            outline:
              - "TLS encrypts the bytes between client and server and lets the client check that the server is who the name says."
              - "A certificate binds a name to a public key and is signed by an authority the client already trusts; that is what the browser's padlock checks."
              - "HTTPS hides what you send and which page you asked for from the network, but not the destination name; it does not make the server itself safe."
              - "Expired or mismatched certificates are one of the most common production incidents, and the error messages name exactly which check failed."
            misconceptions:
              - "HTTPS means the website is trustworthy."
              - "Encryption hides everything, including which site I visit."
            depth_notes: "Không đi vào cipher suites, mTLS, HSM — devops L3, backend L4."

      # ───────────────────────── MODULE 4: http ─────────────────────────
      - id: http
        title: { vi: "HTTP từ đầu đến cuối", en: "HTTP end to end" }
        stage: 0
        summary: { vi: "Đọc và viết một request/response bằng tay, biết method, status, header, cookie và cache nghĩa là gì — xương sống của mọi thứ backend/frontend sau này.", en: "Read and write a request/response by hand; know methods, status codes, headers, cookies and caching — the backbone of everything backend and frontend later." }
        lessons:
          - id: foundation.l1.url-to-page
            title: { vi: "Từ lúc gõ URL đến lúc trang hiện ra", en: "From typing a URL to seeing the page" }
            main_path: true
            duration_min: 12
            skills: [foundation.http.message, foundation.net.dns]
            prereqs: [foundation.l1.dns, foundation.l1.tcp-vs-udp, foundation.l1.tls-and-https]
            related: [backend.l1.request-lifecycle, frontend.l1.browser-rendering]
            vocab: [request, response]
            example_tag: stage-0
            example_files: [scripts/http/trace-request.sh, www/index.html]
            outline:
              - "The browser resolves the name, opens a TCP connection, performs a TLS handshake, sends an HTTP request, receives a response and renders it — in that order (request and response are named here; their anatomy is the next lesson)."
              - "Each step can fail separately, and the browser's error names the step, which tells you where to look."
              - "One page triggers many requests (HTML, then CSS, images, scripts, API calls), each a separate request/response."
              - "The developer tools' network tab shows every one of these, and reading it is a daily skill."
            misconceptions:
              - "Loading a page is one request."
              - "If the page is slow, the server is slow."
            depth_notes: "Bài tổng quan; cấu trúc message, method, status là các bài sau. Không nói về rendering, HTTP/2."

          - id: foundation.l1.http-request-response
            title: { vi: "Cấu trúc một request và một response", en: "The anatomy of a request and a response" }
            main_path: true
            duration_min: 12
            skills: [foundation.http.message]
            prereqs: [foundation.l1.url-to-page]
            related: [backend.l1.request-lifecycle, frontend.l1.calling-an-api]
            vocab: [header, status-code]
            example_tag: stage-0
            example_files: [scripts/http/raw-request.sh, www/index.html]
            outline:
              - "A request is text: a start line with method, path and version; header lines; a blank line; an optional body."
              - "A response is text: a status line with a three-digit code; header lines; a blank line; an optional body."
              - "Headers carry metadata such as content type, length, caching and authentication; the body carries the data."
              - "Because both are plain text, you can send a request by hand and read the answer, which is the fastest way to debug an API."
            misconceptions:
              - "The request body is where the URL parameters go."
              - "A response always has a body."
            depth_notes: "Không liệt kê method/status chi tiết — hai bài sau. Không nói về chunked, HTTP/2 framing."

          - id: foundation.l1.http-methods
            title: { vi: "GET, POST, PUT, PATCH, DELETE: động từ có ý nghĩa", en: "GET, POST, PUT, PATCH, DELETE: verbs with meaning" }
            main_path: true
            duration_min: 12
            skills: [foundation.http.methods]
            prereqs: [foundation.l1.http-request-response]
            related: [backend.l1.rest-resources, backend.l2.idempotent-endpoints]
            vocab: [http-method, idempotent]
            example_tag: stage-0
            example_files: [scripts/http/methods.sh]
            outline:
              - "The method tells the server what kind of action the client intends; the server enforces the meaning, the protocol only defines it."
              - "GET reads and must not change anything; POST creates or triggers; PUT replaces whole; PATCH changes part; DELETE removes."
              - "GET, PUT and DELETE are idempotent — repeating them has the same effect as doing them once — while POST is not, which is why browsers warn before resubmitting a form."
              - "Choosing the wrong method is not a style issue: intermediaries, retries and browsers behave differently by method."
            misconceptions:
              - "GET and POST are interchangeable; POST is just for 'sending data'."
              - "Idempotent means the response is the same every time."
            depth_notes: "Không nói về HEAD/OPTIONS/CORS, safe vs idempotent chi tiết ngoài mức nêu, REST resource design — backend L1."

          - id: foundation.l1.http-status-codes
            title: { vi: "Status code: server đang nói gì với bạn", en: "Status codes: what the server is telling you" }
            main_path: true
            duration_min: 10
            skills: [foundation.http.status]
            prereqs: [foundation.l1.http-request-response]
            related: [backend.l1.errors-and-problem-details]
            vocab: []
            example_tag: stage-0
            example_files: [scripts/http/status-codes.sh]
            outline:
              - "The first digit says who should act: 2xx done, 3xx go elsewhere, 4xx the client's request is wrong, 5xx the server failed."
              - "200, 201, 204, 301/302, 304, 400, 401, 403, 404, 409, 500, 502, 503 cover almost everything you will meet, and each has a precise meaning."
              - "401 means 'who are you', 403 means 'I know who you are and no'; 404 can be a deliberate 403."
              - "A 5xx from a proxy (502/503) usually means the app behind it is down or slow, not that the proxy is broken."
            misconceptions:
              - "A 404 means the server is down."
              - "A 200 means the operation succeeded, whatever the body says."
            depth_notes: "Không dạy toàn bộ bảng status; không nói về RFC 9457 problem details — backend L2."

          - id: foundation.l1.cookies-and-state
            title: { vi: "HTTP không nhớ gì: cookie và trạng thái", en: "HTTP remembers nothing: cookies and state" }
            main_path: true
            duration_min: 12
            skills: [foundation.http.state]
            prereqs: [foundation.l1.http-request-response]
            related: [backend.l1.sessions-vs-tokens]
            vocab: [cookie]
            example_tag: stage-0
            example_files: [scripts/http/cookie-roundtrip.sh, www/login.html]
            outline:
              - "Each request stands alone; the server does not know two requests came from the same person unless the client says so."
              - "A cookie is a small value the server sets in a response header and the browser sends back automatically in later requests to the same site."
              - "Cookies carry an identifier, not the data: the server keeps the state and the cookie is the key to it."
              - "Attributes such as HttpOnly, Secure and SameSite decide who can read the cookie and when it is sent, which is where many security bugs live."
            misconceptions:
              - "The server remembers me between requests by itself."
              - "The cookie stores my login data."
            depth_notes: "Không nói về JWT, session store, OAuth — backend L1/L2."

          - id: foundation.l1.http-caching
            title: { vi: "Cache HTTP: vì sao bạn thấy dữ liệu cũ", en: "HTTP caching: why you see stale data" }
            main_path: true
            duration_min: 12
            skills: [foundation.http.caching]
            prereqs: [foundation.l1.http-methods, foundation.l1.http-status-codes]
            related: [backend.l2.cache-aside]
            vocab: [cache]
            example_tag: stage-0
            example_files: [scripts/http/cache-headers.sh, Caddyfile]
            outline:
              - "A cache keeps a copy of a response so the next identical GET can be served without asking the origin; caches exist in the browser, in proxies and in the server."
              - "Cache-Control tells caches how long a response may be reused; ETag and 304 let a client ask 'has it changed' cheaply."
              - "Only GET responses are normally cached, which is one reason method choice matters."
              - "The trade of every cache is speed against staleness, and 'I updated it but still see the old value' is the symptom of that trade."
            misconceptions:
              - "Refreshing the page always fetches fresh data from the server."
              - "Caching is something only the server does."
            depth_notes: "Không nói về CDN, Vary, cache trong ứng dụng (Redis) — backend L2, devops L3."

          - id: foundation.l1.json-and-encoding
            title: { vi: "JSON và encoding: dữ liệu đi qua dây như thế nào", en: "JSON and encoding: how data travels over the wire" }
            main_path: true
            duration_min: 10
            skills: [foundation.data.encoding]
            prereqs: [foundation.l1.http-request-response]
            related: [backend.l1.dtos-and-serialization]
            vocab: [json, encoding]
            example_tag: stage-0
            example_files: [scripts/http/post-json.sh, samples/DonHang.Samples/Samples/Http/JsonRoundTrip.cs]
            outline:
              - "JSON is text with objects, arrays, strings, numbers, booleans and null; it has no dates, no comments and no integer/decimal distinction."
              - "Text becomes bytes through an encoding; UTF-8 is the default everywhere that matters, and a wrong encoding shows as garbled Vietnamese."
              - "Content-Type tells the receiver how to read the body; a mismatch is a frequent cause of 400 and 415."
              - "Serialization turns objects into JSON and back, and naming conventions (camelCase vs PascalCase) must agree on both sides."
            misconceptions:
              - "JSON has a date type."
              - "If the text looks right in my editor, it is UTF-8."
            depth_notes: "Không nói về System.Text.Json options, versioning DTO — backend L1."

          - id: foundation.l1.time-and-timezones
            title: { vi: "Thời gian, múi giờ và UTC", en: "Time, time zones and UTC" }
            main_path: false
            duration_min: 10
            skills: [foundation.data.time]
            prereqs: [foundation.l1.json-and-encoding]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Http/TimeDemo.cs, db/queries/orders-by-day.sql]
            outline:
              - "An instant is the same everywhere; a local time needs a zone to mean anything; storing local times without zones is a classic data corruption."
              - "Store and transmit instants in UTC using ISO 8601 with an offset; convert to Vietnam time only at the edge, for display."
              - "Order dates grouped 'by day' depend on which zone defines 'day', and reports that disagree by a few hours are usually this."
              - "Daylight saving does not apply in Vietnam, but your servers, libraries and customers may live where it does."
            misconceptions:
              - "DateTime.Now is fine to store in the database."
              - "Vietnam has no time zone problems because it has no daylight saving."
            depth_notes: "Không nói về NodaTime, DateTimeOffset chi tiết, lịch."

      # ───────────────────────── MODULE 5: data-sql ─────────────────────────
      - id: data-sql
        title: { vi: "Dữ liệu và SQL", en: "Data and SQL" }
        stage: 0
        summary: { vi: "Mô hình hóa dữ liệu thành bảng, đọc và viết truy vấn có JOIN và GROUP BY, hiểu index và transaction ở mức nguyên lý.", en: "Model data as tables, read and write queries with JOIN and GROUP BY, understand indexes and transactions in principle." }
        lessons:
          - id: foundation.l1.tables-keys-relations
            title: { vi: "Bảng, khóa và quan hệ: mô hình hóa Đơn Hàng", en: "Tables, keys and relationships: modelling Đơn Hàng" }
            main_path: true
            duration_min: 14
            skills: [foundation.sql.model]
            prereqs: []
            related: [backend.l1.efcore-mapping]
            vocab: [primary-key, foreign-key]
            example_tag: stage-0
            example_files: [db/schema.sql]
            outline:
              - "A table holds rows of one kind of thing; each row has a primary key that identifies it and never changes."
              - "A foreign key in one table references the primary key of another, and that is how 'an order has items' is stored."
              - "One-to-many is a foreign key on the many side; many-to-many needs a joining table; the schema of Đơn Hàng shows both."
              - "Normalisation means storing each fact once so it cannot disagree with itself; the customer's name lives in customers, not in every order."
            misconceptions:
              - "I should store the customer's name in the order so I can show it quickly."
              - "The primary key should be something meaningful, like the phone number."
            depth_notes: "Không nói về normal forms 1NF–3NF chính thức, ORM."

          - id: foundation.l1.sql-select
            title: { vi: "SELECT: hỏi đúng câu", en: "SELECT: asking the right question" }
            main_path: true
            duration_min: 12
            skills: [foundation.sql.query]
            prereqs: [foundation.l1.tables-keys-relations]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [db/queries/select-basics.sql, scripts/sql/run-query.sh]
            outline:
              - "SELECT names columns, FROM names the table, WHERE filters rows, ORDER BY sorts, LIMIT cuts; the database decides how, you say what."
              - "NULL is 'unknown', not zero or empty: comparisons with NULL are never true, which explains rows that vanish from results."
              - "Filtering happens before sorting and limiting, so LIMIT without ORDER BY returns an arbitrary subset."
              - "psql or any client shows the result as a table, and reading the row count is the first sanity check of any query."
            misconceptions:
              - "WHERE price <> NULL finds rows with a price."
              - "LIMIT 10 gives the first 10 rows that were inserted."
            depth_notes: "Không nói về subquery, CTE, window — bài join/aggregate và backend L2."

          - id: foundation.l1.sql-join
            title: { vi: "JOIN: ghép các bảng lại", en: "JOIN: putting tables back together" }
            main_path: true
            duration_min: 14
            skills: [foundation.sql.join]
            prereqs: [foundation.l1.sql-select]
            related: [backend.l1.efcore-n-plus-one]
            vocab: [join]
            example_tag: stage-0
            example_files: [db/queries/join-orders-customers.sql, db/queries/left-join-customers-without-orders.sql]
            outline:
              - "A JOIN pairs rows from two tables where a condition holds, usually foreign key equals primary key."
              - "INNER JOIN keeps only pairs that match; LEFT JOIN keeps every row of the left table, with NULLs where nothing matched — which is how you find customers without orders."
              - "Joining through a one-to-many multiplies rows, so counting after a join counts items, not orders, unless you group."
              - "A missing or wrong join condition silently produces a cross product, and the row count explodes; check counts."
            misconceptions:
              - "LEFT JOIN and INNER JOIN give the same rows, just in a different order."
              - "Joining tables makes the query return one row per order."
            depth_notes: "Không nói về RIGHT/FULL JOIN chi tiết, self join, join algorithms."

          - id: foundation.l1.sql-group-by
            title: { vi: "GROUP BY và hàm tổng hợp: từ dòng thành con số", en: "GROUP BY and aggregates: from rows to numbers" }
            main_path: true
            duration_min: 12
            skills: [foundation.sql.aggregate]
            prereqs: [foundation.l1.sql-join]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [db/queries/revenue-by-customer.sql]
            outline:
              - "COUNT, SUM, AVG, MIN, MAX collapse many rows into one value; GROUP BY chooses what 'many' means."
              - "Every selected column is either in GROUP BY or inside an aggregate; the database rejects anything else because it would be ambiguous."
              - "WHERE filters rows before grouping; HAVING filters groups after; mixing them up gives wrong totals or errors."
              - "COUNT(*) counts rows, COUNT(column) skips NULLs — the difference is exactly the customers-without-orders case."
            misconceptions:
              - "I can SELECT any column when I use GROUP BY."
              - "HAVING is just another way to write WHERE."
            depth_notes: "Không nói về window functions, ROLLUP."

          - id: foundation.l1.sql-write
            title: { vi: "INSERT, UPDATE, DELETE: thay đổi dữ liệu có chủ đích", en: "INSERT, UPDATE, DELETE: changing data on purpose" }
            main_path: true
            duration_min: 10
            skills: [foundation.sql.write]
            prereqs: [foundation.l1.sql-select]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [db/queries/write-basics.sql, db/seed.sql]
            outline:
              - "INSERT adds rows, UPDATE changes rows matching WHERE, DELETE removes rows matching WHERE; without WHERE, UPDATE and DELETE touch every row."
              - "Foreign keys stop you from deleting a customer who has orders unless the schema says what to do; the error is a feature."
              - "RETURNING (PostgreSQL) gives back the generated id, which is how an application learns the new order's number."
              - "Run the SELECT with the same WHERE first to see what you are about to change; that habit prevents most data accidents."
            misconceptions:
              - "DELETE with a wrong WHERE just deletes nothing."
              - "The database will ask me to confirm before deleting many rows."
            depth_notes: "Không nói về upsert, bulk load, cascade options chi tiết."

          - id: foundation.l1.sql-index-intro
            title: { vi: "Index: vì sao truy vấn này nhanh, truy vấn kia chậm", en: "Indexes: why this query is fast and that one slow" }
            main_path: true
            duration_min: 12
            skills: [foundation.sql.index]
            prereqs: [foundation.l1.sql-select]
            related: [backend.l2.indexes-and-plans]
            vocab: [index]
            example_tag: stage-0
            example_files: [db/queries/index-demo.sql, scripts/sql/explain.sh]
            outline:
              - "Without an index the database reads every row to answer a WHERE; an index is a sorted side structure that lets it jump to matching rows."
              - "Primary keys and foreign keys are the usual index candidates; a column you filter or join on often is a candidate."
              - "An index costs disk and slows every write, so 'index everything' is wrong; EXPLAIN shows whether an index was used."
              - "An index on a column does not help a query that applies a function to that column or searches its middle with LIKE '%x%'."
            misconceptions:
              - "Adding an index always makes queries faster."
              - "The database automatically indexes the columns I search."
            depth_notes: "Không nói về composite index, index types, query planner chi tiết — backend L2."

          - id: foundation.l1.transaction-intro
            title: { vi: "Transaction: hoặc tất cả, hoặc không gì cả", en: "Transactions: all or nothing" }
            main_path: true
            duration_min: 12
            skills: [foundation.sql.transaction]
            prereqs: [foundation.l1.sql-write]
            related: [backend.l2.transactions-in-practice, design.l3.outbox-pattern]
            vocab: [transaction]
            example_tag: stage-0
            example_files: [db/queries/transaction-place-order.sql]
            outline:
              - "Placing an order writes to orders and order_items; if the second write fails, the first must not remain — a transaction groups them so both happen or neither does."
              - "`BEGIN` starts, `COMMIT` makes changes visible and durable, `ROLLBACK` discards; until `COMMIT` other connections do not see the changes."
              - "A transaction that stays open holds locks and blocks others, so keep them short and never wait for a user inside one."
              - "The four letters ACID name the guarantees; the one that matters most day to day is atomicity."
            misconceptions:
              - "Each SQL statement is independent, so a failure halfway leaves a consistent database."
              - "A transaction makes my code run faster."
            depth_notes: "Không nói về isolation levels, deadlock, distributed transactions — backend L2/L3."

      # ───────────────────────── MODULE 6: oop-ds ─────────────────────────
      - id: oop-ds
        title: { vi: "OOP đúng nghĩa, collection và độ phức tạp", en: "Real OOP, collections and complexity" }
        stage: 0
        summary: { vi: "Dùng đóng gói, đa hình, interface vì lý do thật; chọn đúng collection; ước lượng thô chi phí thuật toán.", en: "Use encapsulation, polymorphism and interfaces for real reasons; pick the right collection; estimate algorithmic cost roughly." }
        lessons:
          - id: foundation.l1.oop-encapsulation
            title: { vi: "Đóng gói: vì sao không để ai sửa trạng thái tùy ý", en: "Encapsulation: why nobody gets to change state freely" }
            main_path: true
            duration_min: 12
            skills: [foundation.oop.encapsulation]
            prereqs: [foundation.l1.memory-stack-heap]
            related: [design.l1.solid-srp, design.l3.aggregates-and-invariants]
            vocab: [encapsulation]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Oop/OrderEncapsulated.cs, samples/DonHang.Samples/Samples/Oop/OrderExposed.cs]
            outline:
              - "An object that exposes its fields lets any code put it into an impossible state, such as an order with a negative total."
              - "Encapsulation keeps state private and changes it only through methods that check rules, so the rule lives in one place."
              - "A public setter is not encapsulation; the question is who is allowed to decide, not whether the syntax is a property."
              - "The payoff is that bugs about 'how did this object get like this' become impossible instead of hard to find."
            misconceptions:
              - "Making fields private and adding public getters and setters for all of them is encapsulation."
              - "Encapsulation is about hiding code from other developers."
            depth_notes: "Không nói về immutability, records, value objects — design L3."

          - id: foundation.l1.oop-polymorphism
            title: { vi: "Đa hình: một lời gọi, nhiều hành vi", en: "Polymorphism: one call, many behaviours" }
            main_path: true
            duration_min: 12
            skills: [foundation.oop.polymorphism]
            prereqs: [foundation.l1.oop-encapsulation]
            related: [design.l2.strategy-pattern]
            vocab: [polymorphism]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Oop/ShippingFee.cs]
            outline:
              - "When code calls a method through a base type, the method that runs depends on the object's actual type at runtime."
              - "This replaces a growing switch over 'kind of thing' with one class per kind, each owning its behaviour."
              - "Adding a new kind then means adding a class, not editing every switch — which is the whole point."
              - "Polymorphism has a cost in indirection and in how many files you must read, so a switch over three stable cases is fine."
            misconceptions:
              - "Polymorphism is method overloading."
              - "Inheritance is the only way to get polymorphism."
            depth_notes: "Không nói về Open/Closed chính thức, Strategy pattern tên gọi — design L1/L2."

          - id: foundation.l1.oop-interface-vs-abstract
            title: { vi: "Interface và abstract class: hợp đồng khác với khung", en: "Interfaces and abstract classes: a contract is not a skeleton" }
            main_path: true
            duration_min: 12
            skills: [foundation.oop.interface]
            prereqs: [foundation.l1.oop-polymorphism]
            related: [design.l1.dependency-injection-intro, design.l1.test-doubles]
            vocab: [interface]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Oop/INotifier.cs, samples/DonHang.Samples/Samples/Oop/NotifierBase.cs]
            outline:
              - "An interface lists what a type can do with no implementation; a class can implement many interfaces."
              - "An abstract class shares implementation and state among related classes; a class can inherit only one."
              - "Depending on an interface lets you swap the real thing for a fake in tests and for another implementation in production — the reason interfaces appear everywhere in real code."
              - "An interface with one implementation is not automatically wrong, but it needs a reason; the reason is usually testing or a boundary."
            misconceptions:
              - "Every class needs an interface."
              - "Abstract class and interface are interchangeable ways to 'do abstraction'."
            depth_notes: "Không nói về DI container, mocking framework — design L1."

          - id: foundation.l1.collections-in-practice
            title: { vi: "List, Dictionary, HashSet: chọn theo câu hỏi bạn sẽ hỏi", en: "List, Dictionary, HashSet: choose by the question you will ask" }
            main_path: true
            duration_min: 12
            skills: [foundation.ds.collections]
            prereqs: [foundation.l1.memory-stack-heap]
            related: []
            vocab: [hash-map]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Data/CollectionsChoice.cs]
            outline:
              - "A list keeps order and allows duplicates; a hash map finds by key almost instantly; a set answers 'is it here' and forbids duplicates."
              - "Choose by the operation you will do most: iterate in order → list; look up by id → dictionary; membership → set."
              - "Searching a list by id inside a loop is the most common accidental slowness in junior code; a dictionary built once fixes it."
              - "Keys in a hash map must not change while stored, and equality must be defined for your own types."
            misconceptions:
              - "List is fine for everything if the data is small — and data stays small."
              - "Dictionary keeps items in insertion order by contract."
            depth_notes: "Không nói về LINQ nâng cao, immutable collections, span."

          - id: foundation.l1.complexity-intro
            title: { vi: "Big-O thực dụng: ước lượng trước khi đo", en: "Practical Big-O: estimate before you measure" }
            main_path: true
            duration_min: 12
            skills: [foundation.ds.complexity]
            prereqs: [foundation.l1.collections-in-practice, foundation.l1.sql-index-intro]
            related: []
            vocab: [big-o]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Data/NestedLoops.cs]
            outline:
              - "Big-O describes how work grows with input size: constant, logarithmic, linear, n log n, quadratic."
              - "A loop inside a loop over the same data is quadratic; 1.000 orders become a million steps, which is where 'it was fast in testing' comes from."
              - "A dictionary lookup is constant, a sorted search is logarithmic, scanning is linear — the same shapes as a database index versus a table scan."
              - "Estimate first, then measure; Big-O ignores constants, so measuring still matters when the estimate says two options are close."
            misconceptions:
              - "Big-O tells me how many milliseconds the code takes."
              - "Nested loops are always a problem."
            depth_notes: "Không dạy thuật toán sắp xếp/đồ thị; không nói về amortized, space complexity chi tiết."

          - id: foundation.l1.async-in-csharp
            title: { vi: "async/await trong C#: đọc đúng một hàm async", en: "async/await in C#: reading an async method correctly" }
            main_path: true
            duration_min: 12
            skills: [foundation.concurrency.basics]
            prereqs: [foundation.l1.threads-and-async-intro, foundation.l1.oop-interface-vs-abstract]
            related: [backend.l1.request-lifecycle]
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Data/LoadOrdersAsync.cs]
            outline:
              - "An async method returns a Task that represents work in progress; await pauses the method until it completes and gives back the result."
              - "Calling an async method without await starts the work and continues immediately — usually a bug, sometimes intended."
              - "Blocking on a Task with .Result or .Wait() inside async code is how applications freeze."
              - "Exceptions thrown inside an async method surface at the await, not at the call."
            misconceptions:
              - "Forgetting await just makes the method synchronous."
              - "Task.Result is a convenient shortcut when I need the value now."
            depth_notes: "Không nói về ConfigureAwait, ValueTask, cancellation — backend L2."

      # ───────────────────────── MODULE 7: clean-code ─────────────────────────
      - id: clean-code
        title: { vi: "Clean code và đọc code người khác", en: "Clean code and reading other people's code" }
        stage: 0
        summary: { vi: "Viết code người khác đọc được, nhận ra code smell, và đọc một codebase lạ có phương pháp.", en: "Write code others can read, recognise smells, and read an unfamiliar codebase methodically." }
        lessons:
          - id: foundation.l1.naming
            title: { vi: "Đặt tên: tên tốt là tài liệu miễn phí", en: "Naming: a good name is free documentation" }
            main_path: true
            duration_min: 10
            skills: [foundation.code.naming]
            prereqs: []
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Clean/NamingBefore.cs, samples/DonHang.Samples/Samples/Clean/NamingAfter.cs]
            outline:
              - "A name should say what a thing is or does in the domain's words, so the reader does not need to open it."
              - "Booleans read as questions, methods as verbs, collections as plurals; abbreviations and type prefixes hide meaning."
              - "A name that needs a comment is a name to change; a long precise name beats a short vague one."
              - "Consistency across the codebase matters more than any single rule: use the team's words for the team's things."
            misconceptions:
              - "Short names are cleaner."
              - "A comment can make up for a bad name."
            depth_notes: "Không đi vào naming conventions của C# chi tiết ngoài mức nhắc PascalCase/camelCase."

          - id: foundation.l1.small-functions
            title: { vi: "Hàm nhỏ làm một việc", en: "Small functions that do one thing" }
            main_path: true
            duration_min: 12
            skills: [foundation.code.functions]
            prereqs: [foundation.l1.naming]
            related: [design.l1.solid-srp]
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Clean/PlaceOrderLong.cs, samples/DonHang.Samples/Samples/Clean/PlaceOrderSplit.cs]
            outline:
              - "A function that does one thing can be named honestly, tested alone and reused; a 200-line function cannot."
              - "Extracting a block into a named function is the safest structural change there is, and the name you choose tells you whether the block was one thing."
              - "Fewer parameters and no hidden inputs (globals, static state) make a function predictable."
              - "Early returns for guard clauses flatten nesting, and flat code is what juniors and seniors alike read fastest."
            misconceptions:
              - "Splitting code into functions makes it slower and harder to follow because you jump around."
              - "A function is 'one thing' if it has one loop."
            depth_notes: "Không nói về SRP chính thức, cyclomatic complexity, pure functions."

          - id: foundation.l1.code-smells-basic
            title: { vi: "Code smell và refactoring an toàn", en: "Code smells and safe refactoring" }
            main_path: true
            duration_min: 12
            skills: [foundation.code.smells]
            prereqs: [foundation.l1.small-functions]
            related: [design.l1.unit-test-first-look]
            vocab: [code-smell, refactoring]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Clean/Smells.cs]
            outline:
              - "A smell is a surface sign — duplicated code, long parameter lists, comments explaining what, magic numbers, deep nesting — that points at a deeper design problem."
              - "Refactoring changes structure without changing behaviour, in steps small enough that each is obviously safe."
              - "Tests are what make refactoring safe; without them, refactor only what you can verify by hand, and do it in tiny steps."
              - "Refactor when you are about to change the code anyway, not as a separate project."
            misconceptions:
              - "Refactoring means rewriting the module properly."
              - "If it works, touching it is only risk."
            depth_notes: "Không dạy catalog refactoring đầy đủ; 5 smell, 3 refactoring."

          - id: foundation.l1.reading-code
            title: { vi: "Đọc một codebase lạ có phương pháp", en: "Reading an unfamiliar codebase methodically" }
            main_path: true
            duration_min: 12
            skills: [foundation.code.reading]
            prereqs: [foundation.l1.naming, foundation.l1.pipes-and-filters]
            related: [management.l1.code-review-basics]
            vocab: []
            example_tag: stage-0
            example_files: [docs/clean-code/reading-order.md, scripts/craft/map-codebase.sh]
            outline:
              - "Start from the entry point and the folder structure, not from the file someone pointed you at; find where input enters and where output leaves."
              - "Follow one request or one command end to end before reading anything in depth; write the path down as a list of files."
              - "grep for a string you saw on screen is the fastest way from behaviour to code."
              - "Read tests to learn intended behaviour; read the Git history of a file to learn why it looks strange."
            misconceptions:
              - "I need to understand the whole codebase before I can change anything."
              - "The best way to learn a codebase is to read it top to bottom."
            depth_notes: "Không nói về kiến trúc, tầng — design L1."

  - level: 2
    title: { vi: "Kỹ năng nghề", en: "Craft" }
    modules:

      # ───────────────────────── MODULE 8: git ─────────────────────────
      - id: git
        title: { vi: "Git thật sự", en: "Git for real" }
        stage: 0
        summary: { vi: "Hiểu Git là đồ thị commit, dùng branch/merge/rebase có chủ đích, giải quyết conflict bình tĩnh, và tìm lại được mọi thứ.", en: "See Git as a commit graph, branch/merge/rebase on purpose, resolve conflicts calmly, and recover anything." }
        lessons:
          - id: foundation.l2.git-mental-model
            title: { vi: "Git là một đồ thị commit, không phải một dãy phiên bản", en: "Git is a graph of commits, not a list of versions" }
            main_path: true
            duration_min: 12
            skills: [foundation.git.model]
            prereqs: [foundation.l1.terminal-basics]
            related: []
            vocab: [commit]
            example_tag: stage-0
            example_files: [git-playground/build-history.sh, scripts/git/inspect-commit.sh]
            outline:
              - "A commit is a snapshot of every file plus metadata and a pointer to its parent; the history is a graph of these pointers."
              - "The working directory, the staging area and the repository are three places; add moves changes to staging, commit moves them to the repository."
              - "A commit's id is a hash of its content and parent, so the same change made twice is two commits, and history cannot be edited in place."
              - "git status and git log --oneline --graph are the two commands to run before anything else, every time."
            misconceptions:
              - "Git stores diffs, so commits are 'changes'."
              - "Committing sends my code to the server."
            depth_notes: "Không nói về remote, push/pull chi tiết — bài branches."

          - id: foundation.l2.git-branches
            title: { vi: "Branch là con trỏ; remote là bản sao", en: "A branch is a pointer; a remote is a copy" }
            main_path: true
            duration_min: 12
            skills: [foundation.git.branching]
            prereqs: [foundation.l2.git-mental-model]
            related: []
            vocab: [branch]
            example_tag: stage-0
            example_files: [git-playground/build-history.sh, scripts/git/branches.sh]
            outline:
              - "A branch is a movable name pointing at a commit; creating one copies nothing, and HEAD says which branch you are on."
              - "A remote is another repository; origin/main is your last known copy of the server's main, and fetch updates that copy without touching your work."
              - "push sends your commits and moves the remote branch; pull is fetch followed by bringing the fetched commits into your branch (the next lesson names the two ways), and knowing that removes most confusion."
              - "Feature branches let several people change the same project; the branch is cheap, bringing branches back together is where care is needed."
            misconceptions:
              - "Creating a branch duplicates the project files."
              - "origin/main is always the current state of the server."
            depth_notes: "Không nói về branching strategies (git flow, trunk) — management L1/devops L2."

          - id: foundation.l2.git-merge-vs-rebase
            title: { vi: "Merge và rebase: hai cách gộp, hai lịch sử", en: "Merge and rebase: two ways to combine, two histories" }
            main_path: true
            duration_min: 14
            skills: [foundation.git.branching, foundation.git.history]
            prereqs: [foundation.l2.git-branches]
            related: []
            vocab: [merge, rebase]
            example_tag: stage-0
            example_files: [scripts/git/merge-demo.sh, scripts/git/rebase-demo.sh]
            outline:
              - "Merge creates one commit with two parents and keeps both histories as they were; rebase copies your commits onto a new base and gives a straight line."
              - "Rebased commits are new commits with new ids, so rebasing a branch others already have breaks their history — never rebase shared branches."
              - "Fast-forward is a merge with nothing to merge: the pointer simply moves."
              - "Teams choose merge or rebase for readability of history; either is fine when everyone follows the same rule."
            misconceptions:
              - "Rebase is a safer version of merge."
              - "Rebase 'moves' my commits, so they are the same commits."
            depth_notes: "Không nói về interactive rebase, squash chi tiết — bài history."

          - id: foundation.l2.git-conflicts
            title: { vi: "Conflict: Git dừng lại và hỏi bạn", en: "Conflicts: Git stops and asks you" }
            main_path: true
            duration_min: 12
            skills: [foundation.git.conflicts]
            prereqs: [foundation.l2.git-merge-vs-rebase]
            related: []
            vocab: [conflict]
            example_tag: stage-0
            example_files: [scripts/git/conflict-demo.sh]
            outline:
              - "A conflict happens when both sides changed the same region since the common ancestor; Git cannot choose, so it marks the file and waits."
              - "The markers show 'ours', 'theirs' and (with a setting) the base; resolving means writing the correct final text, not picking a side blindly."
              - "After editing, add the file and continue the merge or rebase; abort is always available and returns you to before."
              - "Small, frequent merges make conflicts small; a branch left for weeks produces the conflicts people fear."
            misconceptions:
              - "A conflict means someone made a mistake."
              - "Choosing 'accept theirs' for the whole file is a resolution."
            depth_notes: "Không nói về merge tools, rerere."

          - id: foundation.l2.git-history-and-recovery
            title: { vi: "Đọc, sửa và cứu lịch sử: log, blame, reset, reflog", en: "Reading, rewriting and recovering history: log, blame, reset, reflog" }
            main_path: true
            duration_min: 14
            skills: [foundation.git.history]
            prereqs: [foundation.l2.git-merge-vs-rebase]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [scripts/git/blame-and-log.sh, scripts/git/recover-with-reflog.sh]
            outline:
              - "log with paths and blame answer 'when and why did this line change', which is often faster than asking a person."
              - "reset moves a branch pointer (soft/mixed/hard decide what happens to staging and files); revert adds a new commit that undoes another — use revert on shared history."
              - "reflog records where HEAD has been, so a 'lost' commit after a bad reset or rebase is almost always recoverable."
              - "Amending and squashing rewrite local history before sharing; after sharing, add commits instead."
            misconceptions:
              - "git reset --hard deletes my commits forever."
              - "Revert and reset are the same thing."
            depth_notes: "Không nói về bisect (bài debugging), filter-repo, submodules."

          - id: foundation.l2.good-commits
            title: { vi: "Commit tốt: nhỏ, một ý, thông điệp nói vì sao", en: "Good commits: small, single-purpose, message says why" }
            main_path: true
            duration_min: 10
            skills: [foundation.git.model]
            prereqs: [foundation.l2.git-mental-model]
            related: [management.l1.code-review-basics]
            vocab: []
            example_tag: stage-0
            example_files: [docs/git/commit-message-examples.md, scripts/git/stage-partial.sh]
            outline:
              - "A commit should be one logical change that could be reverted alone; 'fix stuff' commits make history useless."
              - "The message's first line says what in ≤ 50 characters; the body says why and what alternatives were rejected — the diff already says how."
              - "Staging parts of a file lets you split one work session into clean commits."
              - "Reviewers, blame and bisect all work per commit, so commit quality is review quality."
            misconceptions:
              - "Commit messages do not matter because the code is what counts."
              - "One commit per day is a reasonable rhythm."
            depth_notes: "Không áp đặt Conventional Commits; nhắc là một quy ước phổ biến."

      # ───────────────────────── MODULE 9: debugging ─────────────────────────
      - id: debugging
        title: { vi: "Debug có phương pháp", en: "Methodical debugging" }
        stage: 0
        summary: { vi: "Biến 'nó không chạy' thành một quy trình: tái hiện, thu hẹp, giả thuyết, kiểm chứng — với debugger, log và bisect.", en: "Turn 'it does not work' into a process: reproduce, narrow, hypothesise, verify — with the debugger, logs and bisect." }
        lessons:
          - id: foundation.l2.debugging-method
            title: { vi: "Tái hiện, thu hẹp, giả thuyết, kiểm chứng", en: "Reproduce, narrow, hypothesise, verify" }
            main_path: true
            duration_min: 12
            skills: [foundation.debug.method]
            prereqs: [foundation.l1.reading-code]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Debug/WrongTotal.cs]
            outline:
              - "A bug you cannot reproduce on demand cannot be fixed with confidence; the first job is a minimal reliable reproduction."
              - "Narrowing means finding the smallest input and the earliest point where reality diverges from expectation, by halving."
              - "State one hypothesis at a time and design a check that would disprove it; changing code before that is guessing."
              - "Write down what you tried; the notes are what you paste into the report you file or the question you ask a senior."
            misconceptions:
              - "Debugging is reading the code until you see the bug."
              - "If I change something and it works, the bug is fixed."
            depth_notes: "Không nói về debugger/log/bisect — hai bài sau."

          - id: foundation.l2.reading-stack-traces
            title: { vi: "Đọc stack trace và thông báo lỗi", en: "Reading stack traces and error messages" }
            main_path: true
            duration_min: 10
            skills: [foundation.debug.method]
            prereqs: [foundation.l2.debugging-method]
            related: []
            vocab: [stack-trace]
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Debug/ThrowsDeep.cs, scripts/debug/run-throws-deep.sh]
            outline:
              - "A stack trace lists the calls that were active when the exception was thrown, innermost first; the first frame in your own code is where to look."
              - "The exception type and message are the most precise description of the failure you will get; read them fully before searching the web."
              - "Inner exceptions carry the original cause when one exception wraps another."
              - "Line numbers point at the statement, not always the expression; a NullReferenceException names the line, not which thing was null."
            misconceptions:
              - "The top line of the stack trace is where the bug is."
              - "The error message is generic noise; the real information is somewhere else."
            depth_notes: "Không nói về symbols/PDB, async stack traces chi tiết."

          - id: foundation.l2.debugger-and-logging
            title: { vi: "Debugger và log: nhìn vào bên trong lúc chạy", en: "Debugger and logs: seeing inside while it runs" }
            main_path: true
            duration_min: 12
            skills: [foundation.debug.tools]
            prereqs: [foundation.l2.reading-stack-traces]
            related: [backend.l1.structured-logging]
            vocab: []
            example_tag: stage-0
            example_files: [samples/DonHang.Samples/Samples/Debug/WrongTotal.cs, samples/DonHang.Samples/Samples/Debug/LoggingDemo.cs]
            outline:
              - "A breakpoint pauses the program so you can inspect variables and step line by line; conditional breakpoints stop only when your hypothesis is testable."
              - "Logging is the debugger for places you cannot attach to — other machines, production, last night; log inputs and decisions, not 'here'."
              - "Print debugging is fine when it is fast and removed afterwards; leaving it in is how log files become useless."
              - "Watching the value change at the exact line is evidence; reading the code and 'seeing' it is not."
            misconceptions:
              - "Real developers do not use the debugger; they read the code."
              - "More logging is always better."
            depth_notes: "Không nói về structured logging, log levels chi tiết — backend L1."

          - id: foundation.l2.git-bisect
            title: { vi: "git bisect: tìm commit gây lỗi bằng chia đôi", en: "git bisect: find the breaking commit by halving" }
            main_path: false
            duration_min: 10
            skills: [foundation.debug.tools, foundation.git.history]
            prereqs: [foundation.l2.debugging-method, foundation.l2.git-history-and-recovery]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [scripts/git/bisect-demo.sh]
            outline:
              - "When something worked at one commit and fails at another, bisect checks out the midpoint repeatedly and finds the first bad commit in log₂(n) steps."
              - "It needs a reliable pass/fail check, which is why reproduction comes first."
              - "The result is a commit, and the commit's diff and message usually explain the bug directly."
              - "Small commits make bisect precise; one giant commit makes it point at everything."
            misconceptions:
              - "I need to know roughly where the bug is before bisect helps."
              - "Bisect is only for huge projects."
            depth_notes: "Không nói về bisect run tự động."

      # ───────────────────────── MODULE 10: craft ─────────────────────────
      - id: craft
        title: { vi: "Làm nghề: tài liệu, câu hỏi, bug report, AI", en: "The craft: docs, questions, bug reports, AI" }
        stage: 0
        summary: { vi: "Đọc tài liệu tiếng Anh có mục đích, hỏi câu hỏi tốt, viết bug report người khác tái hiện được, và dùng AI assistant mà không bị nó dắt.", en: "Read English docs with purpose, ask good questions, write reproducible bug reports, and use AI assistants without being led astray." }
        lessons:
          - id: foundation.l2.reading-docs
            title: { vi: "Đọc tài liệu kỹ thuật tiếng Anh có mục đích", en: "Reading English technical documentation with purpose" }
            main_path: true
            duration_min: 10
            skills: [foundation.craft.docs]
            prereqs: []
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [docs/craft/doc-reading-checklist.md]
            outline:
              - "Documentation has shapes — tutorial, how-to, reference, explanation — and you read each differently; a reference is searched, not read."
              - "Read the official docs for the pinned version before any blog; check the page's version selector first."
              - "Technical English is a small vocabulary used precisely; learn the 200 words that recur and read the sentence structure, not word by word."
              - "When a doc contradicts what you see, the doc's version, your version or your assumption is wrong — find which."
            misconceptions:
              - "Official docs are harder than blog posts, so start with blogs."
              - "If my English is weak, machine translation of the docs is enough."
            depth_notes: "Không dạy tiếng Anh; chỉ chiến lược đọc."

          - id: foundation.l2.asking-good-questions
            title: { vi: "Hỏi một câu hỏi tốt", en: "Asking a good question" }
            main_path: true
            duration_min: 10
            skills: [foundation.craft.questions]
            prereqs: [foundation.l2.debugging-method]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [docs/craft/question-template.md]
            outline:
              - "A good question states the goal, what you tried, what you expected, what happened, and the exact error — in that order."
              - "Writing the question often answers it, because it forces the narrowing you skipped."
              - "Ask early enough to not waste a day, late enough to have tried; a common team rule is a time box."
              - "Say what you will do next if nobody answers; that turns a question into a decision the team can react to."
            misconceptions:
              - "Asking questions makes me look incompetent."
              - "A screenshot of the error is a sufficient question."
            depth_notes: "Không nói về giao tiếp với khách hàng — management."

          - id: foundation.l2.writing-bug-reports
            title: { vi: "Viết bug report người khác tái hiện được", en: "Writing a bug report others can reproduce" }
            main_path: true
            duration_min: 10
            skills: [foundation.craft.questions]
            prereqs: [foundation.l2.asking-good-questions]
            related: [management.l1.user-story-and-ac]
            vocab: [bug-report]
            example_tag: stage-0
            example_files: [docs/craft/bug-report-template.md]
            outline:
              - "A bug report contains steps to reproduce, expected result, actual result, environment and version, and evidence such as logs or a screenshot."
              - "One bug per report; a report with three problems gets zero fixed."
              - "Severity describes impact on users, priority describes when to fix; they are different fields decided by different people."
              - "The best reports include the smallest reproduction and the suspected cause, clearly marked as a suspicion."
            misconceptions:
              - "'It doesn't work' plus a screenshot is a bug report."
              - "I should not report a bug unless I know the cause."
            depth_notes: "Không nói về công cụ (Jira) chi tiết."

          - id: foundation.l2.using-ai-assistants
            title: { vi: "Dùng AI coding assistant đúng cách", en: "Using AI coding assistants well" }
            main_path: true
            duration_min: 12
            skills: [foundation.craft.ai]
            prereqs: [foundation.l2.reading-docs, foundation.l2.debugging-method]
            related: []
            vocab: []
            example_tag: stage-0
            example_files: [docs/craft/ai-prompt-examples.md]
            outline:
              - "An assistant produces plausible text, not verified facts; treat its output as a draft from a confident colleague who may be wrong."
              - "Give it context (version, error, code, goal) and ask for reasoning; ask it to point to the doc so you can check."
              - "Use it to explain unfamiliar code, generate tests and boilerplate, and rubber-duck; do not paste its code without reading every line."
              - "You are responsible for what you commit; 'the AI wrote it' is not a defence in review."
            misconceptions:
              - "If the assistant is confident, it is probably right."
              - "Using AI means I do not need to understand the code."
            depth_notes: "Không nói về công cụ cụ thể, prompt engineering nâng cao."
