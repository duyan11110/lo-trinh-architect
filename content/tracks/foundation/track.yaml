  - { id: foundation.code.functions,    title: { vi: "Hàm nhỏ, một việc", en: "Small single-purpose functions" }, prereqs: [foundation.code.naming] }
  - { id: foundation.code.smells,       title: { vi: "Code smell và refactoring cơ bản", en: "Code smells and basic refactoring" }, prereqs: [foundation.code.functions] }
  - { id: foundation.code.reading,      title: { vi: "Đọc code người khác", en: "Reading other people's code" } }
