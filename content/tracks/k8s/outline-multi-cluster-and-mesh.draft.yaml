skills:
  - id: k8s.tenancy.shared-cluster
    title: { vi: "Chia một cluster cho nhiều nhóm bằng namespace và quota", en: "Sharing a cluster between teams with namespaces and quotas" }
    prereqs: [k8s.security.access, k8s.config.resources, k8s.security.network-policy, backend.tenancy.isolation]
  - id: k8s.multicluster.boundaries
    title: { vi: "Khi nào cần thêm một cluster", en: "When to add another cluster" }
    prereqs: [k8s.tenancy.shared-cluster, k8s.lifecycle.maintenance, design.architecture.drivers]
  - id: k8s.multicluster.fleet-gitops
    title: { vi: "Triển khai lên nhiều cluster từ một Argo CD", en: "Deploying to many clusters from one Argo CD" }
    prereqs: [k8s.multicluster.boundaries, devops.gitops.sync, k8s.security.access]
  - id: k8s.multicluster.failover
    title: { vi: "Failover giữa các cluster và giữa các region", en: "Failing over between clusters and regions" }
    prereqs: [k8s.multicluster.fleet-gitops, k8s.bare-metal.high-availability, backend.data.replication, devops.dr.recovery]
  - id: k8s.mesh.mutual-tls
    title: { vi: "Mutual TLS giữa các service", en: "Mutual TLS between services" }
    prereqs: [k8s.traffic.tls, k8s.extending.custom-resources, backend.security.layered-controls]
  - id: k8s.mesh.service-mesh
    title: { vi: "Service mesh: nó làm gì và khi nào đáng dùng", en: "Service meshes: what they do and when they pay off" }
    prereqs: [k8s.mesh.mutual-tls, backend.resilience.call-policies, backend.observability.tracing, management.decisions.records]

module:
  id: multi-cluster-and-mesh
  title: { vi: "Nhiều cluster, failover giữa region và service mesh", en: "Many clusters, failover between regions and service meshes" }
  stage: 4
  summary:
    vi: "Biết namespace chia được gì trong một cluster và khi nào thêm cluster đáng cái giá của nó, triển khai lên nhiều cluster từ một Argo CD, chuyển traffic giữa hai cluster khi một bên hỏng và hiểu dữ liệu quyết định mất gì (ADR 0020), bảo vệ lời gọi giữa service bằng mutual TLS, tự làm rồi qua sidecar, trước khi quyết trong ADR 0021 service mesh có đáng dùng không."
    en: "Know what namespaces can share in one cluster and when another cluster is worth its cost, deploy to several clusters from one Argo CD, move traffic between two clusters when one fails knowing the data decides what is lost (ADR 0020), and secure calls between services with mutual TLS, by hand and through a sidecar, before deciding in ADR 0021 whether a service mesh pays off."
  lessons:
    - id: k8s.l4.sharing-a-cluster
      title:
        vi: "Namespace chia một cluster cho nhiều nhóm, nhưng control plane vẫn là của chung"
        en: "Namespaces share a cluster between teams, never its control plane"
      main_path: true
      duration_min: 14
      skills: [k8s.tenancy.shared-cluster]
      prereqs:
        - k8s.l3.roles-and-role-bindings
        - k8s.l1.requests-and-limits
        - k8s.l3.network-policies
        - backend.l3.multi-tenancy
      related:
        - k8s.l1.namespaces
        - k8s.l3.pod-security-admission
        - k8s.l3.custom-resources
        - design.l4.one-deployment-for-all-shops
      vocab: [resource-quota, limit-range]
      example_tag: stage-4
      example_files:
        - deploy/k8s/lessons/team-quota.yaml
        - deploy/k8s/lessons/team-limit-range.yaml
        - scripts/k8s/team-quota.sh
      outline:
        - "Each namespace can get its own RoleBindings, NetworkPolicies and Pod Security level, so several teams can share one cluster with separate rights, connections and rules."
        - "A ResourceQuota caps what all Pods of one namespace may claim together, such as the sum of their CPU and memory requests and the number of Pods; the API server refuses a Pod that would go over it."
        - "`team-quota.sh` scales a Deployment in `tenancy-lessons` past `team-quota.yaml`: the extra Pods are never created, and the ReplicaSet's events show the refusal with `exceeded quota`."
        - "Once a quota covers CPU or memory requests, a Pod that sets none is refused; a LimitRange such as `team-limit-range.yaml` gives such Pods default requests and limits instead."
        - "Namespaces do not divide the nodes' kernel, the control plane or cluster-wide objects such as CRDs, so one team's CRD upgrade or an overloaded API server affects every team."
        - "Namespaces fit teams of one company that trust each other; tenants that must neither affect nor see each other need separate clusters, the question of the next lesson."
      misconceptions:
        - "A namespace is a small separate cluster with resources of its own."
        - "A ResourceQuota slows a namespace down once its Pods use too much CPU."
        - "Each of Đơn Hàng's shops should get its own namespace to keep their data apart."
      depth_notes: "Không dạy quota đếm object, scope của quota, API Priority and Fairness, namespace phân cấp, virtual cluster, runtime cách ly kernel. Cửa hàng là tenant trong ứng dụng (ADR 0012), không phải namespace. Không dạy lại RBAC, request/limit — k8s.l3.roles-and-role-bindings, k8s.l1.requests-and-limits."

    - id: k8s.l4.why-more-than-one-cluster
      title:
        vi: "Thêm cluster chỉ đáng khi cần một ranh giới mà một cluster không giữ được"
        en: "A second cluster pays off for a boundary one cluster cannot hold"
      main_path: true
      duration_min: 13
      skills: [k8s.multicluster.boundaries]
      prereqs:
        - k8s.l4.sharing-a-cluster
        - k8s.l3.cluster-upgrades
        - devops.l3.one-state-per-environment
        - design.l4.architectural-drivers
      related:
        - k8s.l3.admission-policies
        - devops.l3.sealed-secrets
        - management.l3.self-hosting-costs
        - k8s.l3.control-plane-ha
      vocab: [multi-cluster]
      example_tag: stage-3
      example_files:
        - deploy/tofu/envs/staging/cluster/main.tf
        - deploy/tofu/envs/production/cluster/main.tf
        - deploy/sealed-secrets/controller.yaml
        - docs/team/self-run-components.md
      outline:
        - "Everything in one cluster shares its control plane, etcd, network plugin and cluster-wide objects, so a failed upgrade or a broken admission webhook can stop work in every namespace at once."
        - "Đơn Hàng already plans two clusters: OpenTofu builds production as `donhang-production` from the same module as staging, so nothing tried on staging, from a Kubernetes upgrade to a new CRD, reaches customers."
        - "Other reasons to add a cluster are a second site that keeps serving when the first is lost, customers whose rules demand machines of their own, and the limits the Kubernetes project documents for one cluster's size."
        - "Multi-cluster means running one system on several clusters, and each needs its own platform: Argo CD, Traefik, cert-manager and a Sealed Secrets controller, each with its own upgrades."
        - "Each Sealed Secrets controller has its own sealing key, so a SealedSecret sealed for staging cannot be opened in production; unless the clusters share a key, every secret is sealed once per cluster."
        - "Clusters are chosen by driver: environments and tenants that need hard isolation justify one each, while giving each team of one company its own cluster usually costs more than namespaces."
      misconceptions:
        - "More clusters always means higher availability."
        - "Teams of the same company each need their own cluster to stop getting in each other's way."
        - "A SealedSecret committed once works on every cluster that syncs the repository."
      depth_notes: "Không nêu con số giới hạn kích thước cluster, công cụ quản lý fleet/Cluster API, một cluster cho mỗi cửa hàng (ADR 0012 đã chốt), managed vs tự vận hành (k8s/managed-vs-selfhosted). Triển khai lên nhiều cluster — bài sau. Không dạy lại nâng cấp cluster — k8s.l3.cluster-upgrades."

    - id: k8s.l4.one-argo-cd-many-clusters
      title:
        vi: "ApplicationSet đưa một mẫu Application lên mọi cluster đã đăng ký"
        en: "An ApplicationSet deploys one template to every registered cluster"
      main_path: true
      duration_min: 15
      skills: [k8s.multicluster.fleet-gitops]
      prereqs:
        - k8s.l4.why-more-than-one-cluster
        - devops.l3.argo-cd-applications
        - k8s.l3.cluster-roles
        - k8s.l2.config-repo-overlays
      related:
        - devops.l3.promoting-between-environments
        - devops.l3.synced-versus-healthy
        - k8s.l1.kubectl-and-the-api-server
        - backend.l4.shared-credentials
      vocab: [argocd-applicationset]
      example_tag: stage-4
      example_files:
        - scripts/k8s/regions-up.sh
        - deploy/gitops/lessons/regions-appset.yaml
        - deploy/gitops/config-repo/platform/regions/echo-region.yaml
        - scripts/k8s/applicationset.sh
      outline:
        - "`regions-up.sh` creates two one-node kind clusters, `donhang-north` and `donhang-south`, as stand-ins for two regions; one kubeconfig in `secrets/` holds a context for each, and `--context` picks the cluster per command."
        - "Argo CD in `donhang-staging` deploys to another cluster once a Secret in `argocd` labelled `argocd.argoproj.io/secret-type: cluster` gives that cluster's API server address and credentials; `applicationset.sh` makes one per region."
        - "An ApplicationSet holds an Application template and generators; its controller, part of Argo CD's install, creates one Application for each set of parameters the generators produce."
        - "The cluster generator in `regions-appset.yaml` yields one set per registered cluster whose Secret carries the selected label, so each region gets an Application deploying `platform/regions/`, and staging gets none."
        - "One commit to `platform/regions/` reaches both regions at their next sync, a mistake included; letting one region go first needs a separate path or revision per region in the template."
        - "Argo CD now holds credentials that can change every registered cluster, so its blast radius, and that of write access to the config repository, covers all regions at once."
      misconceptions:
        - "Deploying to several clusters means running one Argo CD inside each of them."
        - "An ApplicationSet is a larger Application that deploys to many clusters by itself."
        - "With one template for all regions, a bad change can break only one region at a time."
      depth_notes: "Không dạy generator khác (list, git, matrix), progressive sync, AppProject, `argocd cluster add`, so sánh Argo CD trung tâm với mỗi cluster một Argo CD, service discovery giữa cluster. Script xóa ApplicationSet và Secret cluster ở cuối. Không dạy lại Application — devops.l3.argo-cd-applications."

    - id: k8s.l4.failover-between-clusters
      title:
        vi: "Một điểm vào đứng trước hai cluster chuyển traffic khi một bên hỏng"
        en: "An entry in front of both clusters moves traffic when one fails"
      main_path: true
      duration_min: 15
      skills: [k8s.multicluster.failover]
      prereqs:
        - k8s.l4.one-argo-cd-many-clusters
        - k8s.l3.highly-available-entry-point
        - k8s.l3.metallb-layer2-mode
        - k8s.l1.readiness-probes
      related:
        - k8s.l3.service-types
        - devops.l1.reverse-proxy-basics
        - devops.l3.rpo-and-rto
        - backend.l4.cap-theorem
      vocab: [active-passive, active-active]
      example_tag: stage-4
      example_files:
        - deploy/k8s/regions/global-entry.Caddyfile
        - scripts/k8s/failover.sh
        - deploy/gitops/config-repo/platform/regions/echo-region.yaml
      outline:
        - "Two clusters running the same Pods do not fail over by themselves: clients reach the system through one name or address, and something in front must send them to a cluster that works."
        - "`failover.sh` starts `donhang-global-entry`, a Caddy container on the `kind` network whose `reverse_proxy` lists north before south with `lb_policy first` and an active health check on each."
        - "Active-passive means one cluster serves all traffic while the other waits ready; with `lb_policy first`, every answer comes from north as long as its health check passes."
        - "When the script pauses north's node, calls hang or fail until a health check marks north down; from then on south answers every call, with no change made to either cluster."
        - "When north passes its checks again, `first` sends traffic back to it at once; teams often make failing back a manual step so that a region that keeps failing does not bounce customers."
        - "Active-active means every cluster serves traffic at once, as `lb_policy round_robin` does here for stateless Pods; the lab's one entry container is a single point of failure that real setups spread over sites, often with DNS."
      misconceptions:
        - "If both clusters run the app, traffic moves to the healthy one automatically."
        - "Failover switches traffic instantly, so no call fails while it happens."
        - "Active-active is always better than active-passive because nothing sits idle."
      depth_notes: "Không dạy DNS có kiểm tra sức khỏe, anycast, sản phẩm load balancer toàn cầu, service discovery giữa cluster, chỉnh thời gian health check. Dữ liệu khi failover — bài sau. Không dạy lại HA trong một cluster — k8s.l3.highly-available-entry-point. `failover.sh` không cần staging."

    - id: k8s.l4.data-decides-failover
      title:
        vi: "Traffic chuyển trong vài giây; dữ liệu mới quyết định mất những gì"
        en: "Traffic fails over in seconds; the data decides what is lost"
      main_path: true
      duration_min: 15
      skills: [k8s.multicluster.failover]
      prereqs:
        - k8s.l4.failover-between-clusters
        - backend.l3.read-replicas
        - devops.l3.disaster-recovery-drill
        - backend.l4.pacelc
      related:
        - devops.l3.rpo-and-rto
        - backend.l4.cap-theorem
        - devops.l3.point-in-time-recovery
        - backend.l4.service-level-objectives
        - management.l3.architecture-decision-record
      vocab: [split-brain]
      example_tag: stage-4
      example_files:
        - scripts/backend/promote-replica.sh
        - db/replica/start.sh
        - docs/adr/0020-mot-region-phuc-hoi-tu-ban-sao-luu.md
      outline:
        - "Pods come back in another region from the config repository, but orders exist only in the database, so a failover is only as good as the copy of the data waiting in the other region."
        - "A standby fed by asynchronous replication, as `db-replica` is, lags its primary: commits the primary confirmed but had not yet sent are lost when the standby takes over, so RPO is the lag at that moment."
        - "`promote-replica.sh` promotes `db-replica` with `pg_promote()` while `db` still runs: both then accept a different price for product 1 and disagree, two primaries at once, which is called split brain."
        - "A standby is promoted only after the old primary is stopped or cut off from every client, since a region that looks dead from outside may still be taking orders."
        - "Synchronous replication to another region keeps RPO at zero but makes every commit wait for a round trip between regions, the trade between latency and consistency that PACELC describes."
        - "ADR `0020` keeps Đơn Hàng in one region and recovers in a second one from backups copied there, by the DR drill's steps; it is reopened when a contract asks for an RTO or RPO this cannot meet."
      misconceptions:
        - "Once traffic moves to the second region, every order made before the failure is there too."
        - "Promoting the standby is safe as soon as the primary stops answering health checks."
        - "Running both regions active-active only needs a load balancer in front of them."
      depth_notes: "Không dạy cấu hình `synchronous_commit`, failover tự động bằng operator, database ghi nhiều nơi, chia đơn theo region. `promote-replica.sh` chạy trong Compose (profile `replica`). Không dạy lại replica, DR drill — backend.l3.read-replicas, devops.l3.disaster-recovery-drill."

    - id: k8s.l4.mutual-tls
      title:
        vi: "Với mutual TLS, cả hai đầu của một lời gọi chứng minh mình là ai"
        en: "With mutual TLS, both ends of a call prove who they are"
      main_path: true
      duration_min: 15
      skills: [k8s.mesh.mutual-tls]
      prereqs:
        - k8s.l3.cert-manager
        - backend.l4.pki-and-signing
        - backend.l4.api-gateway
      related:
        - k8s.l2.tls-at-the-gateway
        - backend.l4.threat-modeling
        - k8s.l3.network-policies
        - foundation.l1.tls-and-https
      vocab: [mutual-tls]
      example_tag: stage-4
      example_files:
        - deploy/k8s/lessons/mtls-certificates.yaml
        - deploy/k8s/lessons/echo-mtls.yaml
        - scripts/k8s/mutual-tls.sh
        - docs/design/threat-model.md
      outline:
        - "Finding P5 of `threat-model.md` accepts that the Gateway calls the api Pods over plain HTTP: NetworkPolicies decide who may connect, but the bytes cross the node network unencrypted and the api knows a caller only by its address."
        - "In ordinary TLS only the server shows a certificate; with mutual TLS (mTLS) the server also asks the client for one and checks it against a CA it trusts, so each end knows the other's name before any request."
        - "`mtls-certificates.yaml` has cert-manager issue, from the lab CA, a server certificate for `echo-mtls` and a client certificate for a caller named `gateway-client`, each kept in its own Secret."
        - "`echo-mtls.yaml` runs Caddy with the server certificate and `client_auth` set to `require_and_verify` against the lab CA; `mutual-tls.sh` calls it with no client certificate, then with one from another CA, and both handshakes fail."
        - "With `gateway-client`'s certificate the call succeeds, and the server reads the caller's name from that certificate, an identity that does not depend on the caller's address."
        - "Every workload now needs a key and a certificate that are renewed before they expire and trusted by its peers; cert-manager automates both, but which names may call which still has to be decided."
      misconceptions:
        - "A NetworkPolicy that lets only the Gateway connect already proves every request came from the Gateway."
        - "Mutual TLS is ordinary HTTPS with a stronger cipher."
        - "Once both sides have certificates, nothing about them needs looking after."
      depth_notes: "Không dạy SPIFFE, thu hồi chứng chỉ, trust-manager, chứng chỉ client cho người dùng trình duyệt, TLS từ Gateway tới backend (BackendTLSPolicy). Lab trên `donhang`, namespace `mesh-lessons`. Không dạy lại cert-manager, chuỗi chứng chỉ — k8s.l3.cert-manager, backend.l4.pki-and-signing."

    - id: k8s.l4.sidecar-proxies
      title:
        vi: "Service mesh đặt một proxy cạnh mỗi ứng dụng để lo các lời gọi của nó"
        en: "A service mesh puts a proxy beside every app to handle its calls"
      main_path: true
      duration_min: 15
      skills: [k8s.mesh.service-mesh]
      prereqs:
        - k8s.l4.mutual-tls
        - k8s.l3.pod-network-model
        - k8s.l3.service-accounts
        - backend.l3.resilience-pipeline
      related:
        - backend.l3.traces-and-spans
        - devops.l4.canary-release
        - k8s.l3.operator-pattern
        - k8s.l3.admission-policies
      vocab: [sidecar-container, service-mesh]
      example_tag: stage-4
      example_files:
        - deploy/k8s/lessons/echo-mtls-sidecar.yaml
        - deploy/k8s/lessons/mtls-client-sidecar.yaml
        - scripts/k8s/sidecar-proxy.sh
      outline:
        - "A sidecar container runs beside the app container in the same Pod; Kubernetes 1.34 marks one by listing it under `initContainers` with `restartPolicy: Always`, so it starts before the app and keeps running beside it."
        - "In `echo-mtls-sidecar.yaml` the echo container answers plain HTTP on `localhost` only; a Caddy sidecar in the same Pod accepts mTLS on port 8443 and forwards to it, and the echo container is unchanged."
        - "In `mtls-client-sidecar.yaml` the caller sends plain HTTP to its own sidecar on `localhost`, which opens the mTLS connection with the client certificate; `sidecar-proxy.sh` shows the call succeed while neither app container holds a key."
        - "A service mesh automates this for every Pod: its controllers add the proxy to each Pod, give each workload a certificate, usually named after its ServiceAccount, renew it, and configure every proxy from objects in the API server."
        - "Since every call passes through proxies, a mesh can also retry, time out, split calls between versions by weight or header and record each call, work Đơn Hàng's services do today in their own code."
        - "Some meshes run one proxy per node instead of one per Pod, trading the memory of many sidecars for a shared component on each node."
      misconceptions:
        - "Adding a service mesh means changing every service's code to call the mesh."
        - "A sidecar is just a second app container, and Kubernetes starts both in no particular order."
        - "A service mesh replaces Kubernetes Services and their DNS names."
      depth_notes: "Không nêu tên hay cài sản phẩm mesh nào (chưa có trong versions.yaml), không dạy chèn sidecar tự động bằng mutating webhook, cấu hình retry/chia traffic của mesh, giữ một khách trên một phiên bản, mesh giữa nhiều cluster. Có nên dùng mesh — bài sau. Lab trên `donhang`, namespace `mesh-lessons`."

    - id: k8s.l4.when-a-mesh-pays-off
      title:
        vi: "Đơn Hàng chưa dùng service mesh khi cái giá của nó chưa mua được thứ còn thiếu"
        en: "Đơn Hàng skips a service mesh until its cost buys something missing"
      main_path: true
      duration_min: 14
      skills: [k8s.mesh.service-mesh]
      prereqs:
        - k8s.l4.sidecar-proxies
        - management.l3.self-hosting-costs
        - backend.l4.api-gateway
        - management.l3.weighing-options-in-an-adr
      related:
        - backend.l4.threat-modeling
        - devops.l4.release-strategy-per-component
        - design.l4.over-abstraction
        - k8s.l3.network-policies
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/adr/0021-chua-dung-service-mesh.md
        - docs/design/threat-model.md
        - docs/team/self-run-components.md
      outline:
        - "A mesh adds a proxy to every Pod, costing memory and CPU on each and an extra hop on every call, and its controllers become one more platform component to upgrade and to understand when it breaks."
        - "Because its proxies sit in every call path, one wrong mesh setting or a failed mesh upgrade can break calls between all services at once."
        - "ADR `0021` maps each mesh feature to what Đơn Hàng already has: NetworkPolicies for who connects, token checks in each service, resilience pipelines, OpenTelemetry traces and HTTPRoute weights for canaries."
        - "Encryption and proof of the caller's identity inside the cluster are the gaps left, so ADR `0021` declines a mesh for now and keeps finding P5 of `threat-model.md` accepted."
        - "The ADR reopens the choice when a contract requires encryption inside the cluster, when services come from several teams or languages, or when services start calling across clusters."
        - "For a company with many services in many languages a mesh is often cheaper than building mTLS, retries and per-call metrics into every codebase; with three .NET services and one team, Đơn Hàng is not there yet."
      misconceptions:
        - "Every production Kubernetes cluster should run a service mesh."
        - "A service mesh is the only way to encrypt traffic between Pods."
        - "Without a mesh, services have no retries, timeouts or per-call metrics."
      depth_notes: "Không so sánh hay nêu tên sản phẩm mesh, không đo chi phí bằng số (chưa có metrics-server), không quyết lại ADR 0012, 0019. Không dạy lại mTLS, sidecar — k8s.l4.mutual-tls, k8s.l4.sidecar-proxies; cân nhắc phương án trong ADR — management.l3.weighing-options-in-an-adr."

glossary_additions:
  - term: resource-quota
    en: "ResourceQuota"
    vi_keep: true
    vi: "ResourceQuota"
    short_vi: "Object giới hạn tổng request và số Pod mà mọi Pod của một namespace được xin; vượt thì API server từ chối"
    short_en: "An object capping the total requests and Pod count of one namespace; the API server refuses what goes over"
    introduced_in: k8s.l4.sharing-a-cluster
  - term: limit-range
    en: "LimitRange"
    vi_keep: true
    vi: "LimitRange"
    short_vi: "Object đặt request/limit mặc định và mức cho phép cho từng container trong một namespace"
    short_en: "An object setting default and allowed requests and limits per container in one namespace"
    introduced_in: k8s.l4.sharing-a-cluster
  - term: multi-cluster
    en: "multi-cluster"
    vi_keep: true
    vi: "multi-cluster"
    short_vi: "Chạy cùng một hệ thống trên nhiều cluster, mỗi cluster có control plane và nền tảng riêng"
    short_en: "Running one system on several clusters, each with its own control plane and platform"
    introduced_in: k8s.l4.why-more-than-one-cluster
  - term: argocd-applicationset
    en: "ApplicationSet (Argo CD)"
    vi_keep: true
    vi: "ApplicationSet (Argo CD)"
    short_vi: "Mẫu Application cùng generator; controller sinh một Application cho mỗi bộ tham số, như mỗi cluster đã đăng ký"
    short_en: "An Application template plus generators; its controller creates one Application per parameter set, such as per cluster"
    introduced_in: k8s.l4.one-argo-cd-many-clusters
    aliases: [ApplicationSet]
  - term: active-passive
    en: "active-passive"
    vi_keep: true
    vi: "active-passive"
    short_vi: "Một nơi phục vụ toàn bộ traffic, nơi kia chờ sẵn và chỉ nhận khi nơi đầu hỏng"
    short_en: "One site serves all traffic while another waits ready, taking over only when the first fails"
    introduced_in: k8s.l4.failover-between-clusters
  - term: active-active
    en: "active-active"
    vi_keep: true
    vi: "active-active"
    short_vi: "Mọi nơi cùng phục vụ traffic một lúc; mất một nơi thì các nơi còn lại gánh phần của nó"
    short_en: "Every site serves traffic at once; when one is lost, the others take its share"
    introduced_in: k8s.l4.failover-between-clusters
  - term: split-brain
    en: "split brain"
    vi_keep: true
    vi: "split brain"
    short_vi: "Hai bản cùng nhận ghi vì mỗi bên tưởng mình là primary, nên dữ liệu rẽ thành hai bản khác nhau"
    short_en: "Two copies both accept writes, each acting as the primary, so the data splits into two versions"
    introduced_in: k8s.l4.data-decides-failover
  - term: mutual-tls
    en: "mutual TLS (mTLS)"
    vi_keep: true
    vi: "mutual TLS (mTLS)"
    short_vi: "TLS trong đó client cũng trình chứng chỉ và server kiểm nó, nên hai bên biết danh tính của nhau"
    short_en: "TLS in which the client also shows a certificate that the server checks, so each side knows the other"
    introduced_in: k8s.l4.mutual-tls
    aliases: [mTLS]
  - term: sidecar-container
    en: "sidecar container"
    vi_keep: true
    vi: "sidecar container"
    short_vi: "Container phụ chạy cạnh container ứng dụng trong cùng Pod, khởi động trước và chạy suốt đời Pod"
    short_en: "A helper container beside the app container in the same Pod, started first and kept running"
    introduced_in: k8s.l4.sidecar-proxies
    aliases: [sidecar]
  - term: service-mesh
    en: "service mesh"
    vi_keep: true
    vi: "service mesh"
    short_vi: "Hạ tầng đặt proxy cạnh mỗi service để lo mTLS, retry, chia traffic và đo từng lời gọi mà không sửa code"
    short_en: "Infrastructure putting a proxy beside every service for mTLS, retries, traffic splits and per-call metrics"
    introduced_in: k8s.l4.sidecar-proxies

repo_changes_needed:
  - lesson: k8s.l4.sharing-a-cluster
    need: "Hai manifest bài học trên cluster `donhang`, namespace `tenancy-lessons`: `team-quota.yaml` (Namespace + ResourceQuota `team-quota` giới hạn `requests.cpu`, `requests.memory`, `pods` + Deployment `web` image `caddy:2.10.0` có request nhỏ) và `team-limit-range.yaml` (LimitRange cho request/limit mặc định của container); script host `team-quota.sh`: apply quota, scale `web` vượt quota rồi in event của ReplicaSet có `exceeded quota`, tạo một Pod không request bị từ chối, apply LimitRange rồi Pod đó được nhận với request mặc định, in `kubectl describe resourcequota`, xóa namespace ở cuối. Capture khác outline (event, thông báo từ chối) thì DỪNG, sửa outline."
    suggested_path: "deploy/k8s/lessons/team-quota.yaml, deploy/k8s/lessons/team-limit-range.yaml, scripts/k8s/team-quota.sh"
  - lesson: k8s.l4.one-argo-cd-many-clusters
    need: "`scripts/lib/regions.sh` + `scripts/k8s/regions-up.sh` (tạo `donhang-north` và `donhang-south`, mỗi cluster một node, cùng node image ghim trong `kind-config.yaml`, cả hai context `kind-donhang-north`/`kind-donhang-south` trong một file `secrets/regions.kubeconfig`, không đụng `~/.kube/config`) và `scripts/k8s/regions-down.sh` (xóa cả hai, xóa file kubeconfig); `deploy/gitops/config-repo/platform/regions/echo-region.yaml` (Namespace `regions`, Deployment Caddy 2.10 trả về tên node lấy từ downward API — tên node cho biết cluster, NodePort Service với `nodePort` cố định); `deploy/gitops/lessons/regions-appset.yaml` (ApplicationSet, cluster generator chọn Secret có nhãn riêng của lab, template trỏ `platform/regions` trên Gitea trong staging, automated sync); script host `applicationset.sh`: gọi `regions-up.sh` nếu thiếu, tạo Secret cluster trong `argocd` của `donhang-staging` cho mỗi region từ kubeconfig (địa chỉ trong mạng `kind`), commit `platform/regions/` vào repo cấu hình, apply ApplicationSet, đợi 2 Application Synced/Healthy, gọi echo-region ở mỗi cluster, commit một thay đổi chữ trả về và thấy cả hai region đổi, cuối cùng xóa ApplicationSet, Secret cluster và thư mục `platform/regions/` khỏi repo cấu hình. Không Secret cluster nào vào Git."
    suggested_path: "scripts/lib/regions.sh, scripts/k8s/regions-up.sh, scripts/k8s/regions-down.sh, scripts/k8s/applicationset.sh, deploy/gitops/config-repo/platform/regions/echo-region.yaml, deploy/gitops/lessons/regions-appset.yaml"
  - lesson: k8s.l4.failover-between-clusters
    need: "`deploy/k8s/regions/global-entry.Caddyfile` (Caddy 2.10: `reverse_proxy` tới NodePort của `donhang-north` rồi `donhang-south` theo tên container trên mạng `kind`, `lb_policy first`, health check chủ động `health_uri`/`health_interval`/`health_timeout`; một site thứ hai hoặc biến môi trường cho `lb_policy round_robin`); script host `failover.sh`: không cần staging — apply `echo-region.yaml` bằng kubectl lên hai cluster nếu chưa chạy, khởi động container `donhang-global-entry` trên mạng `kind`, gọi lặp qua entry (từ `donhang-lb-client` hoặc cổng publish ra 127.0.0.1), in cluster trả lời; `docker pause` node của north, in lời gọi treo/lỗi rồi chuyển sang south; `docker unpause`, in traffic quay lại north; chế độ round_robin in cả hai cùng trả lời; xóa container entry ở cuối. Capture khác outline (vd không lời gọi nào lỗi/treo) thì DỪNG, sửa outline mục 4, không đổi cách giả lập hỏng."
    suggested_path: "deploy/k8s/regions/global-entry.Caddyfile, scripts/k8s/failover.sh"
  - lesson: k8s.l4.data-decides-failover
    need: "`scripts/backend/promote-replica.sh` theo mẫu `replica-lag.sh` (host khởi động `db-replica` mới từ profile `replica`, phần truy vấn chạy trong lab box): in `pg_is_in_recovery()` = true, chạy `SELECT pg_promote()`, in lại = false; `UPDATE` giá product 1 thành hai giá khác nhau trên `db` và `db-replica`, cả hai nhận; đọc lại thấy hai bản khác nhau; trả giá cũ trên `db`, xóa `db-replica` và volume của nó ở cuối; thêm vào capture `--all`. `docs/adr/0020-mot-region-phuc-hoi-tu-ban-sao-luu.md` + dòng trong `docs/adr/README.md` (tiếng Việt, mục `### `, không `## `/`**`; Đã chấp nhận; bối cảnh: SLO trong `slo.md`, một PostgreSQL primary, DR drill và WAL archive đã có; 3 phương án: A một region, phục hồi ở region thứ hai từ bản sao lưu và WAL được sao chép sang đó theo các bước DR drill (chọn); B standby ấm: cluster thứ hai do Argo CD đồng bộ + replica PostgreSQL bất đồng bộ, failover thủ công sau khi cắt primary cũ; C active-active: cần mỗi đơn có region riêng hoặc database ghi nhiều nơi, không hợp một primary; hệ quả: RTO/RPO theo số đo DR drill và tần suất sao chép, khoảng trống hiện tại là bản sao lưu chưa được sao ra ngoài — ghi là việc cần làm, không làm ở stage-4; điều kiện mở lại: hợp đồng/SLA đòi RTO hoặc RPO thấp hơn, dữ liệu cửa hàng phải nằm ở một vùng; không tên nhà cung cấp, không số liệu thị trường)."
    suggested_path: "scripts/backend/promote-replica.sh, docs/adr/0020-mot-region-phuc-hoi-tu-ban-sao-luu.md, docs/adr/README.md"
  - lesson: k8s.l4.mutual-tls
    need: "Trên `donhang`, namespace `mesh-lessons`: `deploy/k8s/lessons/mtls-certificates.yaml` (Issuer `lab-ca` dùng Secret CA của lab như `lab-ca-issuer.yaml`; Certificate server cho `echo-mtls` với dnsNames tên Service trong cluster; Certificate client `gateway-client` với usage client auth; mỗi cái một Secret); `deploy/k8s/lessons/echo-mtls.yaml` (Deployment + Service Caddy 2.10 nghe HTTPS 8443 với chứng chỉ server, `client_auth` `mode require_and_verify` tin CA của lab, trả về tên lấy từ chứng chỉ client); script host `mutual-tls.sh`: cài cert-manager nếu thiếu (`cert-manager-install.sh`), tạo Secret CA từ `secrets/lab-ca.*`, đợi Certificate Ready, gọi `echo-mtls` 3 lần — không chứng chỉ client (handshake lỗi), chứng chỉ ký bởi một CA tạm sinh trong script (handshake lỗi), chứng chỉ `gateway-client` (trả lời kèm tên client) — bằng công cụ đã có trong lab (openssl/curl trên host qua `kubectl port-forward` hoặc Pod Caddy), không thêm image ngoài versions.yaml; xóa namespace ở cuối."
    suggested_path: "deploy/k8s/lessons/mtls-certificates.yaml, deploy/k8s/lessons/echo-mtls.yaml, scripts/k8s/mutual-tls.sh"
  - lesson: k8s.l4.sidecar-proxies
    need: "Trên `donhang`, namespace `mesh-lessons`: `deploy/k8s/lessons/echo-mtls-sidecar.yaml` (container echo Caddy chỉ nghe HTTP trên `127.0.0.1:8080`; sidecar Caddy khai trong `initContainers` với `restartPolicy: Always`, nghe mTLS 8443 bằng chứng chỉ server từ `mtls-certificates.yaml`, `reverse_proxy` tới localhost:8080); `deploy/k8s/lessons/mtls-client-sidecar.yaml` (container gọi + sidecar Caddy nghe HTTP trên localhost, `reverse_proxy` HTTPS tới echo với `tls_client_auth` chứng chỉ `gateway-client` và `tls_trust_pool` CA của lab); script host `sidecar-proxy.sh`: in container và init container của hai Pod, gọi từ container gọi tới localhost và nhận trả lời, gọi thẳng cổng 8443 không chứng chỉ bị từ chối, cho thấy không có file khóa trong hai container ứng dụng; xóa namespace ở cuối."
    suggested_path: "deploy/k8s/lessons/echo-mtls-sidecar.yaml, deploy/k8s/lessons/mtls-client-sidecar.yaml, scripts/k8s/sidecar-proxy.sh"
  - lesson: k8s.l4.when-a-mesh-pays-off
    need: "`docs/adr/0021-chua-dung-service-mesh.md` + dòng trong `docs/adr/README.md` (tiếng Việt, mục `### `, không `## `/`**`; Đã chấp nhận; bối cảnh: phát hiện P5 của `threat-model.md`, ba service .NET, một nhóm; bảng tính năng mesh → thứ Đơn Hàng đã có (NetworkPolicy, kiểm token bằng `AddJwtBearer` ở từng service, resilience pipeline, trace OpenTelemetry, trọng số HTTPRoute cho canary theo ADR 0019) và hai khoảng trống: mã hóa và danh tính bên gọi trong cluster; 3 phương án: A chưa dùng mesh, giữ P5 chấp nhận (chọn); B cài mesh chỉ để mTLS; C chỉ mã hóa chặng Gateway → api bằng chứng chỉ cert-manager ở phía api; chi phí của B: proxy mỗi Pod, thêm chặng, thành phần nền tảng phải nâng cấp, hỏng cấu hình mesh ảnh hưởng mọi lời gọi; điều kiện mở lại: hợp đồng đòi mã hóa trong cluster (C là bước đầu nếu chỉ cần mã hóa), nhiều nhóm/ngôn ngữ, gọi giữa cluster; không tên sản phẩm mesh). Sửa đúng dòng P5 trong `docs/design/threat-model.md` để trỏ ADR 0021 (vẫn chấp nhận), không đổi dòng khác; làm sau khi module backend/security-architecture đã tạo file đó. ADR GĐ4 tiếp theo đánh từ 0022."
    suggested_path: "docs/adr/0021-chua-dung-service-mesh.md, docs/adr/README.md, docs/design/threat-model.md"
  - lesson: k8s.l4.one-argo-cd-many-clusters
    need: "STAGE.md stage-4: thêm `team-quota.sh`, `mutual-tls.sh`, `sidecar-proxy.sh` (trên `donhang`) và `applicationset.sh`, `failover.sh` (trên `donhang-staging` + hai cluster region) vào chế độ capture `--k8s-host`, `promote-replica.sh` vào `--all`; mục cluster ghi `donhang-north`/`donhang-south` (một node mỗi cái, đo RAM thật khi capture, kubeconfig trong `secrets/`, `regions-down.sh` xóa) và khuyến nghị bộ nhớ Docker nếu chạy cùng staging; thêm các file mới vào bảng file → bài."
    suggested_path: "STAGE.md"

open_questions:
  - "Không có khóa versions.yaml cho sản phẩm service mesh (Istio, Linkerd, Cilium...). Đề xuất: KHÔNG thêm khóa; mesh được dạy bằng cái nó làm — Caddy 2.10 (khóa `caddy`) làm sidecar mTLS, cert-manager 1.20 (khóa `cert_manager`) cấp chứng chỉ, sidecar gốc của Kubernetes 1.34 — và không nêu tên sản phẩm nào. Phương án dự phòng nếu chủ muốn cài mesh thật: thêm khóa cho một mesh chạy proxy theo node (nhẹ hơn trên kind), thay lab của k8s.l4.sidecar-proxies bằng cài mesh đó trên `donhang`, giữ nguyên số bài và hai bài mTLS/ADR."
  - "Số ADR: module này dùng 0020 (một region, phục hồi ở region khác từ bản sao lưu) và 0021 (chưa dùng service mesh). Đề xuất: ADR GĐ4 tiếp theo (k8s/managed-vs-selfhosted trở đi) đánh từ 0022."
  - "Nội dung ADR 0020. Đề xuất: chấp nhận phương án A (một region, phục hồi ở region thứ hai từ bản sao lưu + WAL sao chép sang đó theo DR drill), từ chối B (standby ấm) vì gấp đôi nền tảng cho SLO 99,5% hiện tại và C (active-active) vì một PostgreSQL primary; ghi khoảng trống 'bản sao lưu chưa ra khỏi máy' là việc cần làm, không code ở stage-4. Nếu chủ muốn B, bài k8s.l4.data-decides-failover chỉ đổi mục outline 6."
  - "Nội dung ADR 0021. Đề xuất: chấp nhận A (chưa dùng mesh, P5 vẫn chấp nhận) với 3 điều kiện mở lại; C (mã hóa riêng chặng Gateway → api) ghi là bước đầu khi có yêu cầu mã hóa, không làm ở stage-4. Staging và base Kustomize không đổi; NetworkPolicy, `Program.cs` không đổi."
  - "Lab nhiều cluster nặng trên laptop. Đề xuất: `donhang-north`/`donhang-south` mỗi cái một node, chỉ chạy echo-region (Caddy); hub là Argo CD có sẵn trong `donhang-staging` (không thêm Argo CD); `failover.sh` không cần staging; STAGE.md ghi RAM đo được và gợi ý xóa `donhang` (`cluster-down.sh`) trước nếu Docker dưới mức khuyến nghị. Tên cluster, file, nhãn Secret là đề xuất — `/repo-stage 4` đổi thì sửa `example_files`/outline trước khi sinh bài."
  - "Chuyển hướng depth_notes hoãn tới GĐ4: mTLS/mã hóa giữa Pod, service mesh (k8s.l2.tls-at-the-gateway, k8s.l3.network-policies, egress-policies, debugging-pod-networking, backend.l4.api-gateway) → k8s.l4.mutual-tls, sidecar-proxies, when-a-mesh-pays-off; multi-region/failover giữa cluster (devops.l4.release-strategy-per-component, devops GĐ3, backend read-replicas/read-routing) → failover-between-clusters, data-decides-failover; nhiều cluster trong kubeconfig (k8s.l1.kubectl-and-the-api-server), ApplicationSet/một Argo CD nhiều cluster (k8s.l2.charts-through-argo-cd, config-repo-overlays, devops gitops) → one-argo-cd-many-clusters; ResourceQuota/LimitRange và tách team bằng namespace (k8s.l1.requests-and-limits, k8s.l1.namespaces) → sharing-a-cluster. Đề xuất đẩy sang k8s/managed-vs-selfhosted: autoscaling/metrics-server, chi phí và capacity cluster, encryption trên managed cluster, KMS v2, nơi đặt HSM, nâng cấp managed cluster, migration/anti-pattern, review checklist cluster. Không dạy ở đâu (khoảng trống chấp nhận): chia canary theo header/cookie và giữ khách trên một phiên bản (chỉ một câu trong sidecar-proxies), federation/service discovery giữa cluster, AdminNetworkPolicy, egress gateway, policy engine."
  - "Tên `region` trong bài chỉ là vai trò của hai cluster kind trên cùng một máy; bài nói rõ lab không có độ trễ hay mạng giữa vùng thật, nên số liệu thời gian failover của lab không đại diện cho production. Đề xuất: chấp nhận, ghi trong depth/claims của bài."
