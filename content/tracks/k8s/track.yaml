levels:
- level: 1
  title:
    vi: "Level 1"
    en: "Level 1"
  modules:
  - id: why-and-architecture
    title:
      vi: "Vì sao Kubernetes, và một cluster gồm những gì"
      en: "Why Kubernetes, and what a cluster is made of"
    stage: 2
    summary:
      vi: "Giải thích được Kubernetes giải quyết điều gì mà Compose không làm, đọc được cluster kind của Đơn Hàng (node, control plane), và chạy một Pod bằng manifest với kubectl apply."
      en: "Explain what Kubernetes solves that Compose does not, read Đơn Hàng's kind cluster (nodes, control plane), and run a Pod from a manifest with kubectl apply."
    lessons:
    - id: k8s.l1.why-an-orchestrator
      title:
        vi: "Compose lo một máy, orchestrator lo cả nhóm máy"
        en: "Compose runs one machine; an orchestrator runs many"
      main_path: true
      duration_min: 12
      skills: [k8s.basics.orchestration]
      prereqs:
      - devops.l1.compose-for-the-api
      - devops.l2.deployment-environments
      - devops.l2.container-registry
      related: []
      vocab: [container-orchestrator, kubernetes]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "`docker compose up` starts every service in `docker-compose.yml` on the one Docker engine it talks to; if that machine stops, every Đơn Hàng service stops with it."
      - "Compose cannot move a container to another machine or spread copies of `api` over several machines; each machine would need its own Compose run, started and watched by a person."
      - "A container orchestrator runs containers across a group of machines: you declare what should run, it chooses the machines and keeps it running, starting replacements when containers or machines fail."
      - "Kubernetes is the container orchestrator this track uses; it runs the same kind of images Docker builds, so Đơn Hàng's images need no change to run on it."
      - "Kubernetes adds parts to learn and to run; when one small service on one machine is enough, Compose can stay, and the orchestrator pays off once several machines or copies must be kept running."
      misconceptions:
      - "Compose already restarts crashed containers, so it does the same job as Kubernetes."
      - "Kubernetes replaces Docker, so images have to be built differently to run on it."
      - "Any app that runs in containers should run on Kubernetes."
      depth_notes: "Không so sánh Swarm, Nomad hay managed cluster (k8s GĐ4); không nói kiến trúc cluster — bài sau; không nói autoscaling (k8s GĐ3). Chỉ vấn đề một máy và ý tưởng orchestrator."
    - id: k8s.l1.cluster-nodes-and-control-plane
      title:
        vi: "Cluster: node chạy container, control plane ra quyết định"
        en: "A cluster: nodes run containers, a control plane decides"
      main_path: true
      duration_min: 13
      skills: [k8s.basics.cluster-architecture]
      prereqs: [k8s.l1.why-an-orchestrator, devops.l1.image-vs-container]
      related: []
      vocab: [cluster, k8s-node, control-plane]
      example_tag: stage-2
      example_files: [deploy/k8s/kind-config.yaml, scripts/k8s/cluster-up.sh]
      outline:
      - "A Kubernetes cluster is a set of machines called nodes, where containers run, plus a control plane that stores the cluster's state and decides what runs on which node."
      - "Worker nodes run the applications' containers; adding a worker node adds room to run more, without changing what the control plane does."
      - "kind, the tool Đơn Hàng's lab uses, runs each node as a Docker container on your machine, so a cluster with several nodes fits on one laptop; in a real cluster each node is its own machine."
      - "`deploy/k8s/kind-config.yaml` declares one control-plane node and two worker nodes, and pins the node image to the Kubernetes version this course teaches."
      - "`scripts/k8s/cluster-up.sh` creates the cluster named `donhang` from that file; it runs on your own machine, beside Docker, not inside the lab box."
      misconceptions:
      - "The control plane is where my application's containers run."
      - "A node is one container of my app."
      - "Because kind's nodes are Docker containers, what runs inside is not really Kubernetes."
      depth_notes: "Không nói từng thành phần control plane (API server, etcd, scheduler, kubelet) — bài control-plane-components; không nói control plane nhiều node, dựng cluster bằng kubeadm (k8s GĐ3), managed cluster (GĐ4)."
    - id: k8s.l1.kubectl-and-the-api-server
      title:
        vi: "Mỗi lệnh kubectl đọc hay thay đổi cluster là một request tới API server"
        en: "Every kubectl command that reads or changes the cluster is a request to the API server"
      main_path: true
      duration_min: 12
      skills: [k8s.basics.kubectl]
      prereqs: [k8s.l1.cluster-nodes-and-control-plane, foundation.l1.http-request-response]
      related: []
      vocab: [api-server, kubectl, kubeconfig]
      example_tag: stage-2
      example_files: [scripts/k8s/get-nodes.sh]
      outline:
      - "The API server is the control plane's front door: every read or change to the cluster, whether from a person or from the cluster's own parts, is an HTTPS request to it."
      - "kubectl is the command-line client of that API; `kubectl get nodes` asks the API server for the cluster's nodes and prints them as a table."
      - "kubectl reads the API server's address and credentials from a kubeconfig file; creating the `donhang` cluster with kind adds a context named `kind-donhang` there and makes it current."
      - "For Đơn Hàng's cluster, `kubectl get nodes` lists the three nodes that `kind-config.yaml` declares, with each node's role and Kubernetes version."
      misconceptions:
      - "kubectl logs in to each node and runs commands there."
      - "kubectl only works on the machine where the cluster runs."
      - "The kubeconfig file holds a copy of the cluster's data."
      depth_notes: "Không nói xác thực và RBAC của API server (k8s GĐ3), cấu trúc đầy đủ kubeconfig, làm việc với nhiều cluster (GĐ4), plugin kubectl. Chỉ context hiện tại và get nodes."
    - id: k8s.l1.pods
      title:
        vi: "Kubernetes chạy Pod, không chạy container trần"
        en: "Kubernetes runs Pods, not bare containers"
      main_path: true
      duration_min: 12
      skills: [k8s.basics.pods]
      prereqs: [k8s.l1.kubectl-and-the-api-server, devops.l1.docker-networks]
      related: [k8s.l1.service-and-dns]
      vocab: [pod]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/web-pod.yaml]
      outline:
      - "A Pod is the smallest unit Kubernetes schedules: one or more containers that always run together on the same node."
      - "Containers in one Pod share one IP address and reach each other on `localhost`; each Pod gets its own IP address inside the cluster."
      - "`deploy/k8s/lessons/web-pod.yaml` describes a Pod named `web` with one container from `caddy:2.10.0`, the image the `web` service in `docker-compose.yml` already uses."
      - "Most Pods hold one container; a second container belongs in the same Pod only when it must share that Pod's network or files, not to group an app with its database."
      misconceptions:
      - "A Pod is just Kubernetes' name for a container."
      - "The api and its database should share one Pod so they can talk over localhost."
      - "Each container in a Pod gets its own IP address, like each service in Compose."
      depth_notes: "Không nói init/sidecar container, volume trong Pod, request/limit (k8s/config-and-probes). Pod không được tạo lại, Deployment — k8s/workloads; địa chỉ ổn định, Service — k8s.l1.service-and-dns."
    - id: k8s.l1.manifests-and-kubectl-apply
      title:
        vi: "Manifest khai báo điều bạn muốn, kubectl apply gửi nó đi"
        en: "A manifest declares what you want; kubectl apply submits it"
      main_path: true
      duration_min: 13
      skills: [k8s.basics.kubectl, k8s.basics.pods]
      prereqs: [k8s.l1.pods, devops.l1.compose-for-the-api]
      related: []
      vocab: [manifest, desired-state]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/web-pod.yaml, scripts/k8s/apply-web-pod.sh]
      outline:
      - "A manifest is a YAML file declaring Kubernetes objects: `apiVersion` and `kind` say what type of object it is, `metadata` names it, and `spec` holds the desired state."
      - "`kubectl apply -f` sends the manifest to the API server and returns once the API server has stored it, before the Pod's container is necessarily running."
      - "Applying the same unchanged manifest again reports `unchanged` and creates nothing new; the file, not a list of commands someone typed, records what should run."
      - "To change what runs, you edit the manifest and apply it again: the file states the result and Kubernetes works out the steps, though some fields of a Pod cannot change once it exists."
      - "Đơn Hàng keeps its manifests in Git under `deploy/k8s/`, so a change to what runs in the cluster is a reviewed commit like any code change."
      misconceptions:
      - "When `kubectl apply` returns without an error, the app is already up and running."
      - "Running `kubectl apply` twice on the same file creates two Pods."
      - "A manifest is a script that Kubernetes runs from top to bottom."
      depth_notes: "Không nói server-side apply, field manager, kubectl diff, xóa object bằng prune; không nói field nào của Pod đổi được tại chỗ; Kustomize, Helm (k8s GĐ3)."
    - id: k8s.l1.namespaces
      title:
        vi: "Namespace chia một cluster thành nhiều vùng tên"
        en: "Namespaces split one cluster into separate sets of names"
      main_path: true
      duration_min: 11
      skills: [k8s.basics.kubectl]
      prereqs: [k8s.l1.manifests-and-kubectl-apply]
      related: []
      vocab: [k8s-namespace]
      example_tag: stage-2
      example_files: [deploy/k8s/namespace.yaml, scripts/k8s/namespaces.sh]
      outline:
      - "A Kubernetes namespace groups objects inside one cluster; two objects of the same kind may share a name only when they are in different namespaces."
      - "A kubectl command without `-n` works in the namespace of the current kubeconfig context, `default` in a new kind cluster; that is where the `web` Pod went."
      - "Đơn Hàng's own objects live in the namespace `donhang` that `deploy/k8s/namespace.yaml` declares; Kubernetes keeps its own components in `kube-system`."
      - "Some objects belong to no namespace, such as nodes and the namespaces themselves."
      - "A namespace alone does not stop Pods in different namespaces from reaching each other over the network, and does not limit who may change what; those need separate rules."
      misconceptions:
      - "A namespace is a smaller cluster with its own nodes."
      - "Putting the app in its own namespace isolates it from everything else in the cluster."
      - "`kubectl get pods` shows every Pod in the cluster."
      depth_notes: "Không nói ResourceQuota, RBAC, NetworkPolicy (k8s GĐ3); không nói tách môi trường hay team bằng namespace (GĐ4). Label và selector — k8s/workloads."
    - id: k8s.l1.control-plane-components
      title:
        vi: "Từ kubectl apply tới container đang chạy: ai làm việc gì"
        en: "From kubectl apply to a running container: who does what"
      main_path: true
      duration_min: 15
      skills: [k8s.basics.cluster-architecture]
      prereqs: [k8s.l1.namespaces, backend.l2.redis-key-value-store]
      related: []
      vocab: [etcd, kube-scheduler, kubelet, control-loop]
      example_tag: stage-2
      example_files: [scripts/k8s/control-plane.sh]
      outline:
      - "The API server stores every object it accepts in etcd, a key-value store holding the cluster's state; the other components read and change that state only through the API server."
      - "kube-scheduler watches for Pods that have no node yet and assigns each one to a node; it decides where a Pod runs but starts nothing itself."
      - "The kubelet on each node watches for Pods assigned to its node, has their containers started, and reports their status back to the API server."
      - "Kubernetes' components work as control loops: compare the desired state stored through the API server with what actually exists, act to close the gap, and repeat."
      - "In Đơn Hàng's kind cluster, `kubectl get pods -n kube-system` shows the API server, etcd and kube-scheduler themselves running as Pods on the control-plane node."
      - "`kubectl get pod web -o wide` shows which worker node kube-scheduler chose for `web`."
      misconceptions:
      - "`kubectl apply` tells a node to start the container directly."
      - "The scheduler starts the containers on the node it picks."
      - "etcd is where Kubernetes keeps my application's data."
      depth_notes: "Không nói kube-controller-manager chi tiết, cloud-controller-manager, kube-proxy, CNI, container runtime, backup etcd (k8s GĐ3), cách scheduler chấm điểm node. Controller tạo lại Pod — k8s/workloads."
  - id: workloads
    title:
      vi: "Giữ ứng dụng chạy: Deployment, Service, cập nhật và quay lui"
      en: "Keeping apps running: Deployments, Services, updates and rollbacks"
    stage: 2
    summary:
      vi: "Chạy được nhiều bản của một ứng dụng bằng Deployment, cho chúng một tên ổn định bằng Service, deploy image api từ ghcr.io theo tag cố định, cập nhật dần và quay lui khi bản mới hỏng."
      en: "Run several copies of an app with a Deployment, give them a stable name with a Service, deploy the api image from ghcr.io by a fixed tag, update it gradually and roll back when a new version breaks."
    lessons:
    - id: k8s.l1.labels
      title:
        vi: "Label đánh dấu object, selector tìm object theo label"
        en: "Labels tag objects so selectors can find them"
      main_path: true
      duration_min: 11
      skills: [k8s.workloads.labels]
      prereqs: [k8s.l1.namespaces]
      related: []
      vocab: [k8s-label, label-selector]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/labelled-pods.yaml, scripts/k8s/labels.sh]
      outline:
      - "A label is a key–value pair in an object's `metadata.labels`, such as `app: web`; unlike a name, the same label may sit on many objects."
      - "A label selector picks objects by their labels: `kubectl get pods -n donhang -l app=web` lists only the Pods whose `app` label equals `web`."
      - "A selector with several comma-separated conditions matches only the objects that satisfy all of them."
      - "Keys you choose, such as `app`, mean nothing to Kubernetes by themselves; they matter once an object uses a selector to decide which Pods it works with."
      misconceptions:
      - "A label is just another name, so two Pods cannot carry the same one."
      - "Kubernetes knows what `app: web` means and treats those Pods specially."
      - "`-l app=web` searches the Pods' names for the text `web`."
      depth_notes: "Không nói selector dạng tập hợp (in, notin, exists), annotation, label khuyến nghị app.kubernetes.io/*, label Kubernetes tự gắn cho node. ReplicaSet, Service dùng selector — các bài sau trong module."
    - id: k8s.l1.replicasets
      title:
        vi: "ReplicaSet thay Pod bị mất, Pod đơn lẻ mất là mất hẳn"
        en: "A ReplicaSet replaces lost Pods; a bare Pod stays gone"
      main_path: true
      duration_min: 13
      skills: [k8s.workloads.replication]
      prereqs: [k8s.l1.labels, k8s.l1.control-plane-components]
      related: []
      vocab: [replicaset, pod-template]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/web-replicaset.yaml, scripts/k8s/replicaset.sh]
      outline:
      - "A Pod created on its own is not recreated: after `kubectl delete pod`, it is gone until someone applies its manifest again."
      - "A ReplicaSet declares `replicas`, a label selector and a Pod template, and creates Pods from the template until the number of matching Pods equals `replicas`."
      - "The labels in the Pod template must match the ReplicaSet's selector; the API server rejects a manifest where they do not."
      - "When one of its Pods is deleted, the ReplicaSet's control loop sees fewer Pods than `replicas` and creates a replacement, with a new name and a new IP address."
      - "Changing `replicas` and applying again adds or removes Pods, but changing only the Pod template leaves the Pods that already run untouched."
      misconceptions:
      - "Kubernetes always brings back a deleted Pod, even one I created on its own."
      - "The replacement is the same Pod started again, with the same name and IP address."
      - "Changing the image in a ReplicaSet's Pod template updates the Pods it already runs."
      depth_notes: "Không nói Deployment (bài sau), node hỏng và eviction, ownerReferences, ReplicaSet nhận Pod mồ côi, kubectl scale. Container tự khởi động lại trong Pod, probe — k8s/config-and-probes."
    - id: k8s.l1.deployments
      title:
        vi: "Bạn viết Deployment, Deployment lo ReplicaSet"
        en: "You write a Deployment; it manages the ReplicaSet for you"
      main_path: true
      duration_min: 12
      skills: [k8s.workloads.replication]
      prereqs: [k8s.l1.replicasets]
      related: []
      vocab: [k8s-deployment]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/web-deployment.yaml, scripts/k8s/deployment.sh]
      outline:
      - "A Deployment declares `replicas`, a selector and a Pod template like a ReplicaSet, then creates a ReplicaSet that creates the Pods; you do not write that ReplicaSet."
      - "`deploy/k8s/lessons/web-deployment.yaml` runs three replicas of `caddy:2.10.0`, labelled `app: web`, in the namespace `donhang`."
      - "The names show who owns what: the ReplicaSet is named after the Deployment plus a hash of the Pod template, each Pod after that ReplicaSet plus a random suffix."
      - "Changing only `replicas` and applying again scales the existing ReplicaSet without replacing any running Pod."
      - "A deleted Pod of the Deployment is replaced by its ReplicaSet; deleting the Deployment deletes its ReplicaSet and Pods as well."
      misconceptions:
      - "A Deployment runs the Pods itself, so no ReplicaSet is involved."
      - "For each app I should write both a ReplicaSet and a Deployment."
      - "Scaling from 3 to 5 replicas restarts the three Pods that already run."
      depth_notes: "Không nói đổi Pod template, rolling update (bài rolling-updates); không nói StatefulSet, DaemonSet, Job, autoscaling (GĐ3); request/limit, probe — k8s/config-and-probes."
    - id: k8s.l1.services
      title:
        vi: "Service cho một nhóm Pod luôn đổi một địa chỉ cố định"
        en: "A Service gives a changing set of Pods one stable address"
      main_path: true
      duration_min: 13
      skills: [k8s.workloads.services]
      prereqs: [k8s.l1.deployments, devops.l1.docker-networks]
      related: []
      vocab: [k8s-service]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/web-service.yaml, scripts/k8s/service.sh]
      outline:
      - "Pod IP addresses do not last: a replacement Pod gets a new one, so a client that stored a Pod's IP address loses its target when that Pod is replaced."
      - "A Service selects Pods by label and gets one virtual IP address, its cluster IP, that stays the same for as long as the Service exists."
      - "A connection to the Service's IP address and `port` is forwarded to `targetPort` on one of the Pods its selector matches; connections are spread across those Pods."
      - "The set of Pod addresses behind a Service follows its selector: it changes as Pods are replaced or scaled, while the cluster IP does not."
      - "A Service with no `type` is of type `ClusterIP`: its address can be reached only from inside the cluster."
      misconceptions:
      - "A Kubernetes Service runs containers, like a service in `docker-compose.yml`."
      - "Clients should look up the Pods' IP addresses and call them directly."
      - "A Service's IP address changes whenever its Pods are replaced."
      depth_notes: "Không nói NodePort, LoadBalancer (k8s.l3.service-types), Ingress (k8s/ingress-helm), port-forward, kube-proxy và cách chuyển tiếp (networking-deep GĐ3), headless Service, session affinity. Pod chưa ready — k8s/config-and-probes; tên DNS — bài sau."
    - id: k8s.l1.service-and-dns
      title:
        vi: "Pod gọi Service bằng tên nhờ DNS của cluster"
        en: "Pods reach a Service by name through the cluster's DNS"
      main_path: true
      duration_min: 12
      skills: [k8s.workloads.services]
      prereqs: [k8s.l1.services, foundation.l1.dns]
      related: [devops.l1.docker-networks]
      vocab: [cluster-dns]
      example_tag: stage-2
      example_files: [scripts/k8s/service-dns.sh]
      outline:
      - "The cluster runs its own DNS server as Pods in `kube-system`, and each Pod's `/etc/resolv.conf` names it as the resolver, so Pods look up names there first."
      - "Each Service gets the DNS name `<service>.<namespace>.svc.cluster.local`, which resolves to its cluster IP; in Đơn Hàng's cluster that is `web.donhang.svc.cluster.local`."
      - "A Pod in `donhang` can use the short name `web` because its `/etc/resolv.conf` lists search domains starting with `donhang.svc.cluster.local`; from another namespace, `web.donhang` works."
      - "The name stays valid while the Pods behind the Service are replaced, so a client configured with `web` never needs a Pod IP, as the service name did on a Compose network."
      misconceptions:
      - "A Pod can find a Service by name only when both are in the same namespace."
      - "A Service's DNS name resolves to the IP address of one of its Pods."
      - "Service names like `web.donhang.svc.cluster.local` also work from the browser on my laptop."
      depth_notes: "Không nói cấu hình CoreDNS, dnsPolicy và ndots (k8s/networking-deep GĐ3), headless Service (k8s/state-and-storage GĐ3); bản ghi SRV, tên DNS của Pod, ExternalName không dạy ở GĐ3."
    - id: k8s.l1.deploying-an-image-tag
      title:
        vi: "Deploy api từ registry theo một tag cố định, không dùng latest"
        en: "Deploying the api from the registry by a fixed tag, never latest"
      main_path: true
      duration_min: 13
      skills: [k8s.workloads.rollouts]
      prereqs: [k8s.l1.deployments, devops.l2.tagging-images-by-commit, devops.l2.image-tags-and-digests]
      related: [devops.l2.cutting-a-release]
      vocab: [image-pull-policy]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/api-deployment.yaml, scripts/k8s/deploy-api.sh]
      outline:
      - "`deploy/k8s/lessons/api-deployment.yaml` runs two replicas of `ghcr.io/duyan11110/donhang-api` with a `sha-` tag naming the commit CI built it from; nothing is built on the cluster."
      - "The node a Pod lands on pulls the image from the registry itself; Đơn Hàng's package on GitHub Container Registry is public, so pulling needs no credentials."
      - "When `imagePullPolicy` is not set and the tag is not `latest`, it defaults to `IfNotPresent`: a node that already has an image under that tag does not pull it again."
      - "With the tag `latest` or no tag, the default becomes `Always` and the manifest no longer says which build runs; Đơn Hàng's manifests never use `latest`."
      - "This Deployment gives the api only settings that are not secret, enough for it to start; requests that need the database fail until k8s/config-and-probes supplies the rest."
      misconceptions:
      - "The cluster builds the image from the Dockerfile in the repository."
      - "Using `latest` is fine because it always gives the newest build."
      - "Pushing a new image under the same tag updates the Pods that already run that tag."
      depth_notes: "Không nói imagePullSecret, ConfigMap/Secret (k8s/config-and-probes), ghim image bằng digest trong manifest, ký/quét image (devops/supply-chain GĐ3), deploy từ pipeline/GitOps (GĐ3). Đổi tag, rolling update — bài sau."
    - id: k8s.l1.rolling-updates
      title:
        vi: "Đổi image thì Pod được thay dần từng ít một"
        en: "A new image tag replaces Pods a few at a time"
      main_path: true
      duration_min: 14
      skills: [k8s.workloads.rollouts]
      prereqs: [k8s.l1.deploying-an-image-tag]
      related: []
      vocab: [rolling-update]
      example_tag: stage-2
      example_files:
      - deploy/k8s/lessons/api-deployment.yaml
      - deploy/k8s/lessons/api-deployment-1.0.0.yaml
      - scripts/k8s/rolling-update.sh
      outline:
      - "Any change to a Deployment's Pod template, such as a new image tag, makes the Deployment create a new ReplicaSet and move the Pods over to it; changing only `replicas` does not."
      - "With the default strategy, `RollingUpdate`, the new ReplicaSet is scaled up while the old one is scaled down, so Pods of both versions run side by side for a while."
      - "By default `maxSurge` and `maxUnavailable` are both 25%: during the update at most about a quarter more Pods than `replicas` exist, and at most about a quarter fewer are available."
      - "`kubectl rollout status` waits until the update has finished; afterwards `kubectl get replicasets -n donhang` still shows the old ReplicaSet, scaled to 0."
      - "Without a readiness check, a new Pod counts as available once its container runs, so the update moves on even if the new api cannot serve requests yet."
      misconceptions:
      - "Updating the image stops every old Pod first and then starts the new ones."
      - "The Deployment changes the image inside the Pods that already run."
      - "When `kubectl apply` returns, the new version is already serving every request."
      depth_notes: "Không nói strategy Recreate chi tiết, cách làm tròn maxSurge/maxUnavailable, minReadySeconds, pause/resume, blue-green, canary (devops GĐ4). Readiness probe — k8s/config-and-probes; quay lui — bài sau."
    - id: k8s.l1.rollbacks
      title:
        vi: "kubectl rollout undo đưa ReplicaSet cũ trở lại"
        en: "kubectl rollout undo brings the previous ReplicaSet back"
      main_path: true
      duration_min: 13
      skills: [k8s.workloads.rollouts]
      prereqs: [k8s.l1.rolling-updates]
      related: []
      vocab: [rollout-history]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/api-deployment-bad-tag.yaml, scripts/k8s/rollback.sh]
      outline:
      - "A Deployment keeps its old ReplicaSets, scaled to 0, as numbered revisions, up to `revisionHistoryLimit` (10 by default); `kubectl rollout history` lists them."
      - "A tag that does not exist in the registry leaves the new Pod in `ErrImagePull` or `ImagePullBackOff`; with two replicas and default limits, both old api Pods keep running."
      - "Kubernetes does not roll back on its own: a stuck update is only reported as not progressing, and it stays stuck until someone acts."
      - "`kubectl rollout undo` makes the previous revision's Pod template current again: its ReplicaSet becomes current, scaled back up if it was at 0, and the bad one goes to 0."
      - "After an undo the cluster no longer matches the manifest in Git; unless the manifest is fixed and applied, the next apply brings the bad tag back."
      misconceptions:
      - "Kubernetes rolls back by itself when the new Pods fail."
      - "Rolling back also reverts the manifest file in Git."
      - "A rollback has to rebuild the old image."
      depth_notes: "Không nói --to-revision, progressDeadlineSeconds chi tiết, rollback tự động (devops GĐ4), rollback migration DB, GitOps (devops/gitops GĐ3)."
  - id: config-and-probes
    title:
      vi: "Cấu hình, secret, probe và tài nguyên: chạy Đơn Hàng thật trên cluster"
      en: "Config, secrets, probes and resources: running Đơn Hàng for real on a cluster"
    stage: 2
    summary:
      vi: "Đưa cấu hình và secret vào Pod bằng ConfigMap và Secret, deploy cả backend Đơn Hàng lên cluster kind, rồi cho Kubernetes biết khi nào api còn sống, khi nào sẵn sàng và cần bao nhiêu tài nguyên."
      en: "Give Pods their settings and secrets with ConfigMaps and Secrets, deploy the whole Đơn Hàng backend to the kind cluster, then tell Kubernetes when the api is alive, when it is ready and what resources it needs."
    lessons:
    - id: k8s.l1.configmaps
      title:
        vi: "ConfigMap giữ cấu hình của api bên ngoài image"
        en: "A ConfigMap keeps the api's settings outside the image"
      main_path: true
      duration_min: 13
      skills: [k8s.config.configmaps-and-secrets]
      prereqs: [k8s.l1.rolling-updates, devops.l1.config-and-env, devops.l1.twelve-factor-config]
      related: [k8s.l1.deploying-an-image-tag]
      vocab: [configmap]
      example_tag: stage-2
      example_files: [deploy/k8s/api-configmap.yaml, deploy/k8s/api.yaml, scripts/k8s/configmap.sh]
      outline:
      - "A ConfigMap is a Kubernetes object that stores settings that are not secret as key–value pairs under `data`, apart from any Pod or image."
      - "`deploy/k8s/api-configmap.yaml` holds the api's settings that are not secret, such as where Redis and Keycloak are, under the environment variable names the api already reads in Compose."
      - "The api Deployment's Pod template turns every key of that ConfigMap into an environment variable with `envFrom`, so the same image runs with the cluster's values."
      - "Environment variables are fixed when a container starts: after the ConfigMap changes, running api Pods keep the old values until they are replaced, for example by `kubectl rollout restart`."
      - "Applying a changed ConfigMap does not change the Deployment's Pod template, so on its own it starts no rolling update."
      misconceptions:
      - "Once I apply a new ConfigMap, the running api Pods pick up the new values at once."
      - "A ConfigMap is a file that gets copied into the image when it is built."
      - "Nobody can read what is in a ConfigMap, so the database password can go there too."
      depth_notes: "Không nói Secret (bài sau), ConfigMap dạng file (bài configmap-files), ConfigMap immutable, giới hạn kích thước, `kubectl create configmap`, configMapGenerator của Kustomize (GĐ3), cú pháp `$(VAR)` trong env, thứ tự ưu tiên giữa env và envFrom."
    - id: k8s.l1.secrets
      title:
        vi: "Secret của Kubernetes tách mật khẩu ra, nhưng không mã hóa"
        en: "A Kubernetes Secret keeps passwords apart but does not encrypt them"
      main_path: true
      duration_min: 14
      skills: [k8s.config.configmaps-and-secrets]
      prereqs: [k8s.l1.configmaps, devops.l1.secrets-vs-config, k8s.l1.control-plane-components]
      related: []
      vocab: [k8s-secret]
      example_tag: stage-2
      example_files: [scripts/k8s/secrets.sh, deploy/k8s/api.yaml, scripts/dev-secrets.sh]
      outline:
      - "A Kubernetes Secret is an object like a ConfigMap meant for secret values; a Pod reads one of its keys as an environment variable with `secretKeyRef`, as the api does for its database connection string."
      - "Values under a Secret's `data` are base64-encoded: that is an encoding anyone can reverse with `base64 -d`, not encryption."
      - "By default the API server stores Secrets in etcd without encrypting them; encrypting them at rest is something a cluster administrator has to configure."
      - "`kubectl describe secret` prints only each key's size, but anyone allowed to read the Secret through the API server can print its values and decode them."
      - "Đơn Hàng commits no Secret manifest: `scripts/k8s/secrets.sh` creates its Secrets in `donhang` from the gitignored `.env` that `scripts/dev-secrets.sh` writes."
      misconceptions:
      - "Secret values are encrypted, since they look like random text in the YAML."
      - "A Secret manifest is safe to commit to Git because its values are encoded."
      - "Once a value is in a Secret, nobody with kubectl access can see it."
      depth_notes: "Không nói RBAC giới hạn quyền đọc Secret, encryption at rest (k8s/operators-and-cluster-lifecycle GĐ3), Vault/SOPS/Sealed Secrets/External Secrets (devops/secrets-backup-dr GĐ3), imagePullSecret, Secret dạng file, `stringData`, type khác `Opaque`, xoay vòng mật khẩu."
    - id: k8s.l1.configmap-files
      title:
        vi: "ConfigMap cũng có thể thành file bên trong container"
        en: "A ConfigMap can also appear as files inside a container"
      main_path: true
      duration_min: 13
      skills: [k8s.config.configmaps-and-secrets]
      prereqs: [k8s.l1.secrets, devops.l1.volumes]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [deploy/k8s/db.yaml, scripts/k8s/deploy.sh, scripts/k8s/configmap-files.sh]
      outline:
      - "In Compose, `db` gets its init scripts from `db/` through bind mounts of your disk; a node has no copy of your repository, so files a container needs must reach it through the API server."
      - "A ConfigMap listed under a Pod's `volumes` and mounted with `volumeMounts` shows each of its keys as a file named after the key, holding that key's value."
      - "`scripts/k8s/deploy.sh` builds the ConfigMap `db-init` from `db/schema.sql`, `db/seed.sql` and `db/migrations-baseline.sql`, and the `db` Pod mounts it at `/docker-entrypoint-initdb.d`, where the PostgreSQL image looks for scripts."
      - "The PostgreSQL image runs those scripts only when its data directory is empty, the same rule that applied to the `db` container in Compose."
      - "Mounting a ConfigMap on a folder shows only the ConfigMap's files there; whatever the image had in that folder is hidden."
      misconceptions:
      - "Kubernetes can mount a folder from my laptop into a Pod, the way Compose does."
      - "A ConfigMap can only hold short values like an address, not a whole SQL file."
      - "Mounting a ConfigMap on a folder adds its files next to the ones already there."
      depth_notes: "Không nói subPath, items/đổi tên file, defaultMode, binaryData, giới hạn kích thước, file được cập nhật khi ConfigMap đổi, PersistentVolume (k8s/state-and-storage GĐ3). emptyDir của db — bài deploying-don-hang."
    - id: k8s.l1.deploying-don-hang
      title:
        vi: "Deploy cả backend Đơn Hàng lên cluster"
        en: "Deploying the whole Đơn Hàng backend to the cluster"
      main_path: true
      duration_min: 15
      skills: [k8s.config.running-the-system]
      prereqs: [k8s.l1.configmap-files, k8s.l1.service-and-dns, devops.l2.migrations-in-the-pipeline]
      related: [k8s.l1.deploying-an-image-tag]
      vocab: []
      example_tag: stage-2
      example_files:
      - scripts/k8s/deploy.sh
      - deploy/k8s/migrate/migrate-pod.yaml
      - deploy/k8s/db.yaml
      - scripts/k8s/smoke-test.sh
      outline:
      - "`scripts/k8s/deploy.sh` brings up the backend in `donhang` in order: namespace, Secrets from `.env`, ConfigMaps, PostgreSQL, Redis, Keycloak and Mailpit with their Services, the migration, then the api."
      - "PostgreSQL, Redis, Keycloak and Mailpit run from the images Compose uses, each as a Deployment with one replica and a Service whose name, such as `db`, is the host the api already uses."
      - "The schema is migrated once per deploy by a Pod with `restartPolicy: Never` that runs the migration bundle from `donhang-migrate` at the api's tag; the script applies the api only after it succeeds."
      - "PostgreSQL keeps its data in an `emptyDir` volume, which survives a container restart but is deleted with its Pod; a replacement `db` Pod starts empty and runs the three init scripts again."
      - "Nothing outside the cluster reaches the api yet: `scripts/k8s/smoke-test.sh` calls `GET /api/v1/products` through the `api` Service from a temporary Pod inside the cluster."
      misconceptions:
      - "Running PostgreSQL as a Deployment keeps its data safe, since the Deployment brings the Pod back."
      - "Each api replica should apply the migrations when it starts."
      - "Once every Pod shows Running, the app is reachable from my browser."
      depth_notes: "Không nói StatefulSet, PersistentVolume (k8s/state-and-storage GĐ3), Job (GĐ3), Ingress và truy cập từ ngoài cluster (k8s/ingress-helm GĐ3), Prometheus/Loki trong cluster, Keycloak production mode, deploy từ pipeline (GĐ3). Probe, request/limit trong api.yaml — các bài sau."
    - id: k8s.l1.health-endpoints
      title:
        vi: "Health endpoint: api tự báo trạng thái của mình qua HTTP"
        en: "Health endpoints let the api report its own state over HTTP"
      main_path: true
      duration_min: 13
      skills: [k8s.config.probes]
      prereqs: [k8s.l1.deploying-don-hang, backend.l1.middleware-pipeline, backend.l2.cache-aside]
      related: [devops.l1.compose-for-the-api]
      vocab: [health-check]
      example_tag: stage-2
      example_files: [DonHang.Api/Program.cs, scripts/k8s/health.sh]
      outline:
      - "At stage-2, `Program.cs` registers health checks with `AddHealthChecks()` and maps two endpoints with `MapHealthChecks`: `/health/live` and `/health/ready`."
      - "A health check endpoint answers `200` with the text `Healthy` when every check it runs passes, and `503` with `Unhealthy` when one fails; `scripts/k8s/health.sh` shows only a `503`'s status line, as its `wget` drops non-`2xx` bodies."
      - "`/health/ready` runs the check that `AddDbContextCheck<DonHangDbContext>()` adds, which asks EF Core whether it can connect to PostgreSQL."
      - "Redis is left out of `/health/ready` because the api still answers from PostgreSQL when Redis fails."
      - "`/health/live` runs no checks, so it answers `Healthy` whenever the process can still handle HTTP requests; a database outage does not change its answer."
      - "Nothing publishes these endpoints outside the cluster; `scripts/k8s/health.sh` calls both from a temporary Pod through the `api` Service."
      misconceptions:
      - "If the api process is running, it can serve requests."
      - "A health endpoint should check everything the api talks to, Redis included."
      - "`/health/live` should also check the database, to be safe."
      depth_notes: "Không nói probe của Kubernetes (hai bài sau), trạng thái Degraded, ResponseWriter/JSON, health check tự viết (IHealthCheck), gói AspNetCore.HealthChecks.* bên thứ ba, bảo vệ endpoint bằng xác thực, lọc log/metric cho request health."
    - id: k8s.l1.liveness-probes
      title:
        vi: "Liveness probe hỏng thì container bị khởi động lại"
        en: "A failing liveness probe gets the container restarted"
      main_path: true
      duration_min: 13
      skills: [k8s.config.probes]
      prereqs: [k8s.l1.health-endpoints, k8s.l1.replicasets]
      related: []
      vocab: [probe, liveness-probe]
      example_tag: stage-2
      example_files: [deploy/k8s/lessons/web-liveness-pod.yaml, scripts/k8s/liveness.sh, deploy/k8s/api.yaml]
      outline:
      - "When a container exits, the kubelet by default starts it again in the same Pod, with the same name and IP address, and the Pod's `RESTARTS` count goes up."
      - "A container that keeps crashing shows `CrashLoopBackOff`: after the first few restarts the kubelet waits before each new one, and the wait grows each time."
      - "A probe is a check the kubelet runs against a container on a schedule; an `httpGet` probe counts any status code from 200 to 399 as success."
      - "A liveness probe catches a process that runs but no longer works: after `failureThreshold` failures in a row, 3 by default, the kubelet kills the container and it is restarted."
      - "`deploy/k8s/lessons/web-liveness-pod.yaml` points a liveness probe at a path Caddy answers with `404`, so `kubectl get pod` shows the restart count climbing."
      - "The api's liveness probe calls `/health/live`, which ignores PostgreSQL: a database outage would otherwise restart every api container without fixing anything."
      misconceptions:
      - "A failing liveness probe makes Kubernetes create a new Pod, maybe on another node."
      - "Without a liveness probe, Kubernetes never restarts a crashed container."
      - "The liveness probe should fail whenever the database is down."
      depth_notes: "Không nói startup probe, probe exec/tcpSocket/grpc, initialDelaySeconds/periodSeconds/timeoutSeconds chi tiết, thời gian back-off cụ thể, restartPolicy khác Always, terminationGracePeriodSeconds. Readiness — bài sau."
    - id: k8s.l1.readiness-probes
      title:
        vi: "Readiness probe hỏng thì Pod bị rút khỏi Service"
        en: "A failing readiness probe takes a Pod out of its Service"
      main_path: true
      duration_min: 14
      skills: [k8s.config.probes]
      prereqs: [k8s.l1.liveness-probes, k8s.l1.services, k8s.l1.rolling-updates]
      related: [k8s.l1.rollbacks]
      vocab: [readiness-probe]
      example_tag: stage-2
      example_files: [deploy/k8s/api.yaml, deploy/k8s/lessons/api-unready.yaml, scripts/k8s/readiness.sh]
      outline:
      - "A readiness probe decides whether a Pod may receive traffic: while it fails, the Pod shows `0/1` under `READY` and its Service sends it no connections, but its container is not restarted."
      - "A container with no readiness probe counts as ready as soon as it runs, which is why the rolling update in k8s/workloads moved on before the new api could serve."
      - "The api's readiness probe calls `/health/ready`, so an api Pod that cannot reach PostgreSQL stops getting requests while its liveness probe keeps passing."
      - "`deploy/k8s/lessons/api-unready.yaml` gives the api a database host that does not exist: its new Pod keeps running, never becomes ready, and its restart count stays at 0."
      - "During a rolling update a new Pod counts as available only once it is ready, so the update with that manifest never finishes and both old api Pods keep serving."
      misconceptions:
      - "A failing readiness probe restarts the container, just like a liveness probe."
      - "A Pod whose container is running is ready to receive requests."
      - "Liveness and readiness probes should call the same endpoint."
      depth_notes: "Không nói EndpointSlice, minReadySeconds, readiness gate, startup probe, graceful shutdown/preStop, probe exec của `db` (chỉ có trong manifest), rollback tự động (devops GĐ4)."
    - id: k8s.l1.requests-and-limits
      title:
        vi: "Request quyết định Pod đặt ở đâu, limit chặn mức container được dùng"
        en: "Requests decide where a Pod fits; limits cap what it may use"
      main_path: true
      duration_min: 14
      skills: [k8s.config.resources]
      prereqs: [k8s.l1.readiness-probes, k8s.l1.control-plane-components, foundation.l1.memory-stack-heap]
      related: []
      vocab: [resource-request, resource-limit]
      example_tag: stage-2
      example_files: [deploy/k8s/api.yaml, deploy/k8s/lessons/oversized-pod.yaml, scripts/k8s/resources.sh]
      outline:
      - "A resource request is the CPU and memory a container asks for: kube-scheduler puts a Pod only on a node whose unreserved capacity covers the requests of all its containers."
      - "CPU is counted in cores, so `250m` is a quarter of a core; memory is counted in bytes, so `256Mi` is 256 mebibytes."
      - "`deploy/k8s/lessons/oversized-pod.yaml` requests more CPU than any node of the kind cluster has, so the Pod stays `Pending` and its events say that no node fits."
      - "A request is a reservation, not a measurement: a container may use less than it requested, or more as long as it stays under its limit."
      - "A resource limit is the most a container may use: above its CPU limit it is slowed down; above its memory limit a process in it can be killed, shown as `OOMKilled`."
      - "`deploy/k8s/api.yaml` sets requests and limits for the api container, so the scheduler reserves room for each api Pod and none can take all of a node's memory."
      misconceptions:
      - "The request is the most a container is allowed to use."
      - "A container that uses more CPU than its limit gets killed."
      - "A Pod stuck in `Pending` means its image could not be pulled."
      depth_notes: "Không nói QoS class, eviction khi node thiếu tài nguyên, LimitRange/ResourceQuota (k8s L4 multi-tenant GĐ4), autoscaling và đo usage bằng metrics-server (GĐ3), tranh luận có nên đặt CPU limit, cách .NET GC đọc memory limit, resources cấp Pod."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: ingress-helm
    title:
      vi: "Helm, Ingress, Gateway API và Kustomize"
      en: "Helm, Ingress, Gateway API and Kustomize"
    stage: 3
    summary:
      vi: "Đọc và render Helm chart, quản lý release, cài phần mềm bên thứ ba từ chart đã ghim qua Argo CD, đưa request từ ngoài vào Đơn Hàng bằng Ingress rồi Gateway API có HTTPS, và chuyển repo cấu hình sang một base với overlay Kustomize cho từng môi trường."
      en: "Read and render Helm charts, manage releases, install third-party software from a pinned chart through Argo CD, route outside requests into Đơn Hàng with Ingress and then Gateway API over HTTPS, and move the config repository to one base with a Kustomize overlay per environment."
    lessons:
    - id: k8s.l2.helm-charts
      title:
        vi: "Helm chart sinh manifest từ template và values"
        en: "A Helm chart renders manifests from templates and values"
      main_path: true
      duration_min: 14
      skills: [k8s.packaging.helm]
      prereqs:
      - k8s.l1.deploying-don-hang
      - devops.l3.promoting-between-environments
      - k8s.l1.manifests-and-kubectl-apply
      related: [devops.l3.tofu-modules]
      vocab: [helm, helm-chart, values-file]
      example_tag: stage-3
      example_files:
      - deploy/helm/lessons/web/Chart.yaml
      - deploy/helm/lessons/web/values.yaml
      - deploy/helm/lessons/web/templates/deployment.yaml
      - scripts/k8s/helm-template.sh
      outline:
      - "Helm is a package manager for Kubernetes; a Helm chart is a folder holding `Chart.yaml` (the chart's name and version), `values.yaml` and a `templates/` folder of manifests with placeholders."
      - "`deploy/helm/lessons/web/templates/deployment.yaml` writes the replica count and the image tag as `{{ .Values.replicas }}` and `{{ .Values.image.tag }}` instead of fixed values."
      - "`values.yaml` holds the chart's defaults; a values file passed with `-f` overrides the keys it sets, and `--set` overrides both, so one chart can serve several environments."
      - "`helm template` renders a chart into plain manifests on your machine without contacting any cluster, so you can read and diff exactly what would be applied."
      - "Templates are text with placeholders, not YAML: a change to a template can produce invalid or unexpected manifests, and only the rendered output shows it."
      misconceptions:
      - "Seniors often assume a Helm chart is a kind of container image, or contains one."
      - "Seniors often assume rendering a chart needs a connection to a cluster."
      - "Seniors often assume values passed with `--set` are written back into the chart's `values.yaml`."
      depth_notes: "Không dạy release/upgrade/rollback (bài sau), chart dependency, `_helpers.tpl`, hàm template (`include`, Sprig), schema cho values, chart repository/OCI. Đơn Hàng không viết chart cho chính nó — k8s.l2.config-repo-overlays nêu lý do."
    - id: k8s.l2.helm-releases
      title:
        vi: "Mỗi lần helm upgrade thành một revision của release, quay lui được"
        en: "Each helm upgrade becomes a release revision you can roll back"
      main_path: true
      duration_min: 13
      skills: [k8s.packaging.helm]
      prereqs: [k8s.l2.helm-charts, k8s.l1.rollbacks]
      related: [devops.l3.rollback-by-revert]
      vocab: [helm-release]
      example_tag: stage-3
      example_files: [scripts/k8s/helm-release.sh, deploy/helm/lessons/web/values.yaml]
      outline:
      - "`helm install` renders a chart with your values and applies the result as a Helm release: a name in one namespace, here `web` in `helm-lessons`, whose objects Helm tracks together."
      - "Every `helm upgrade` of that release applies the newly rendered manifests and records a new numbered revision; `helm history` lists the revisions with their status."
      - "Helm keeps each revision's rendered manifests and values in a Secret in the release's namespace, so the release's history lives in the cluster, not on the machine that ran Helm."
      - "`helm rollback web 1` applies revision 1's manifests again as a new revision, 3, and keeps revision 2 in the history; like `kubectl rollout undo`, it changes the cluster, not your files."
      - "`helm uninstall` deletes every object of the release and, by default, its history Secrets too."
      misconceptions:
      - "Seniors often assume `helm rollback` deletes the bad revision from the history."
      - "Seniors often assume Helm keeps track of releases on the laptop that ran `helm install`."
      - "Seniors often assume a release and a chart version are the same thing."
      depth_notes: "Không dạy --atomic/--wait, hook của Helm, --reuse-values/--reset-values, cách Helm tính thay đổi khi upgrade, driver lưu trữ khác Secret. Helm trong Argo CD — bài sau. Không dạy lại rollout undo — k8s.l1.rollbacks."
    - id: k8s.l2.charts-through-argo-cd
      title:
        vi: "Argo CD tự cài chart đã ghim phiên bản, nên Helm không có release"
        en: "Argo CD installs a pinned chart itself, so Helm keeps no release"
      main_path: true
      duration_min: 14
      skills: [k8s.packaging.helm, devops.gitops.sync]
      prereqs: [k8s.l2.helm-releases, devops.l3.self-heal, devops.l3.argo-cd-applications]
      related: [devops.l3.pinning-by-content, devops.l3.automated-dependency-updates]
      vocab: []
      example_tag: stage-3
      example_files: [deploy/gitops/config-repo/apps/traefik.yaml, scripts/k8s/traefik-install.sh]
      outline:
      - "Traefik, the program that will route outside requests into Đơn Hàng's cluster, is installed from the chart its own project publishes, not from manifests Đơn Hàng writes."
      - "`apps/traefik.yaml` is an Application whose source is a chart repository, a chart name and an exact chart version; the chart version is not the Traefik version it installs (`appVersion`)."
      - "The Application holds only the values Đơn Hàng changes; `helm show values` at the pinned chart version lists every key the chart accepts, with its default."
      - "Argo CD renders the chart itself, as `helm template` does, and syncs the result like a folder of manifests: `helm list -A` shows no release, and going back means reverting the commit."
      - "A new chart version can change many objects at once; `traefik-install.sh` renders the pinned version and the next one with `helm template` and diffs them, as a review would before the commit."
      misconceptions:
      - "Seniors often assume a chart that Argo CD installed can still be upgraded or rolled back with the `helm` command."
      - "Seniors often assume copying the chart's whole `values.yaml` into the repository is the safest way to configure it."
      - "Seniors often assume the chart version tells you which version of the software runs."
      depth_notes: "Không dạy multi-source/`$values`, ApplicationSet, Helm hook trong Argo CD, CRD đi kèm chart và nâng cấp CRD (k8s/operators-and-cluster-lifecycle), cấu hình Traefik ngoài phần routing. Traefik làm gì — hai bài sau. Không dạy lại sync — devops.l3.synced-versus-healthy."
    - id: k8s.l2.ingress
      title:
        vi: "Ingress chỉ là luật định tuyến; phải có controller mới chạy"
        en: "An Ingress lists routing rules that only a controller carries out"
      main_path: true
      duration_min: 14
      skills: [k8s.traffic.routing]
      prereqs: [k8s.l2.charts-through-argo-cd, k8s.l1.service-and-dns, devops.l1.reverse-proxy-basics]
      related: [k8s.l1.services]
      vocab: [k8s-ingress, ingress-controller]
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/api-ingress.yaml, scripts/k8s/ingress.sh]
      outline:
      - "A Service without a `type` is reachable only inside the cluster, so something must accept requests from outside and forward them, the job Caddy does in front of the api in Compose."
      - "An Ingress is a Kubernetes object listing HTTP rules: a host and a path, matched as `Prefix` or `Exact`, each leading to a Service and a port."
      - "An Ingress does nothing on its own: an Ingress controller, here Traefik's Pods, watches Ingress objects and works as a reverse proxy that applies their rules."
      - "`ingressClassName: traefik` names the controller that should act on the Ingress; anything beyond the basic rules is set with annotations that each controller defines in its own way."
      - "`ingress.sh` calls Traefik from your machine before and after applying `api-ingress.yaml`: Traefik answers `404` until the rule exists, then forwards `/api/v1/products` to the api Service."
      - "Requests from your machine reach Traefik because the staging node publishes ports on it; on a cloud, the controller's Service of type `LoadBalancer` would get an outside address instead."
      misconceptions:
      - "Seniors often assume creating an Ingress is enough for Kubernetes to start routing traffic."
      - "Seniors often assume an Ingress replaces the Service, so the api no longer needs one."
      - "Seniors often assume an Ingress with annotations behaves the same on any controller."
      depth_notes: "Không dạy annotation cụ thể của controller, defaultBackend, IngressClass mặc định, LoadBalancer trên máy thật/MetalLB (k8s/bare-metal), Ingress HA. TLS — k8s.l2.tls-at-the-gateway. Ingress này chỉ là manifest minh họa, không vào repo cấu hình."
    - id: k8s.l2.gateway-api
      title:
        vi: "Gateway API tách điểm vào cluster khỏi các route"
        en: "Gateway API splits the entry point from the routes"
      main_path: true
      duration_min: 15
      skills: [k8s.traffic.routing]
      prereqs: [k8s.l2.ingress]
      related: [backend.l2.api-versioning, devops.l3.argo-cd-applications]
      vocab: [gateway-api, k8s-gateway, httproute]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo/platform/edge/gateway.yaml
      - deploy/gitops/config-repo/platform/edge/httproutes.yaml
      - deploy/gitops/config-repo/apps/edge-staging.yaml
      - scripts/k8s/gateway.sh
      outline:
      - "The Ingress API is frozen: it stays available but gets no new features, and the Kubernetes project recommends Gateway API instead, so Đơn Hàng routes its own traffic with Gateway API."
      - "Gateway API is not built into Kubernetes: its kinds of objects are added by installing them, here together with Traefik, which implements both Ingress and Gateway API."
      - "A `GatewayClass` names the controller; a Gateway asks it for listeners, each a port, a protocol and an optional hostname; an HTTPRoute attaches to a Gateway through `parentRefs`."
      - "The split follows roles: whoever runs the platform owns the Gateway, and each team writes HTTPRoutes for its own Services without editing the shared entry point."
      - "Đơn Hàng's HTTPRoutes send `/api/v1`, `/api/v2` and `/openapi` to the api Service and Keycloak's host to the keycloak Service, the routes Caddy holds in Compose."
      - "Splitting traffic between backends by weight and matching on headers are part of the HTTPRoute standard; with Ingress they depend on each controller's own annotations."
      misconceptions:
      - "Seniors often assume Gateway API is a separate gateway product that replaces the Ingress controller."
      - "Seniors often assume Ingress is deprecated and will be removed from Kubernetes."
      - "Seniors often assume an HTTPRoute routes traffic on its own, without a Gateway to attach to."
      depth_notes: "Không dạy ReferenceGrant, allowedRoutes giữa namespace, GRPCRoute/TLSRoute, filter ngoài redirect, chia traffic để canary (devops GĐ4), công cụ chuyển Ingress sang Gateway API. HTTPS — bài sau."
    - id: k8s.l2.tls-at-the-gateway
      title:
        vi: "HTTPS kết thúc ở Gateway bằng chứng chỉ giữ trong một Secret"
        en: "HTTPS ends at the Gateway with a certificate kept in a Secret"
      main_path: true
      duration_min: 15
      skills: [k8s.traffic.tls]
      prereqs:
      - k8s.l2.gateway-api
      - devops.l3.sealed-secrets
      - devops.l1.reverse-proxy-and-tls
      - backend.l2.validating-provider-tokens
      related: [foundation.l1.tls-and-https]
      vocab: []
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo/platform/edge/gateway.yaml
      - scripts/dev-secrets.sh
      - scripts/devops/seal-secrets.sh
      - scripts/k8s/gateway-tls.sh
      outline:
      - "An HTTPS listener with `tls.mode: Terminate` decrypts requests at the Gateway with the certificate and key in the Secret its `certificateRefs` names; the api Pods behind it get plain HTTP."
      - "That Secret has type `kubernetes.io/tls` with the keys `tls.crt` and `tls.key`; since it holds a private key, it reaches the config repository only as a SealedSecret."
      - "In the lab `dev-secrets.sh` creates your own certificate authority in `secrets/` and signs a certificate for Đơn Hàng's hosts with it; `curl --cacert` trusts it, a browser only once told to."
      - "An HTTPRoute with a `RequestRedirect` filter on the plain HTTP listener answers every request there with a redirect to the HTTPS address."
      - "Keycloak writes its public address into every token as the issuer, so staging's `KC_HOSTNAME` and the api's `Keycloak__Authority` both change to the HTTPS address behind the Gateway."
      - "Nothing renews this certificate: once it expires, clients refuse the connection, which is why real clusters let a controller issue and renew certificates."
      misconceptions:
      - "Seniors often assume the hop from the Gateway to the api Pods is encrypted too, because the client used HTTPS."
      - "Seniors often assume a TLS Secret is safe to commit because certificates are public anyway."
      - "Seniors often assume moving Keycloak behind a new address needs no change on the api's side."
      depth_notes: "Không dạy cert-manager và gia hạn tự động (k8s/operators-and-cluster-lifecycle), mã hóa giữa các Pod/mTLS (service mesh GĐ4), TLS passthrough, Secret ở namespace khác, HSTS, DonHang.App trên trình duyệt qua Gateway. Không dạy lại TLS — foundation.l1.tls-and-https."
    - id: k8s.l2.kustomize-overlays
      title:
        vi: "Overlay của Kustomize vá một base dùng chung cho từng môi trường"
        en: "A Kustomize overlay patches a shared base for one environment"
      main_path: true
      duration_min: 15
      skills: [k8s.packaging.kustomize]
      prereqs: [k8s.l2.helm-charts, devops.l3.promoting-between-environments, k8s.l1.configmaps]
      related: [devops.l3.tofu-modules]
      vocab: [kustomize, kustomize-overlay]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo-kustomize/base/kustomization.yaml
      - deploy/gitops/config-repo-kustomize/envs/staging/kustomization.yaml
      - deploy/gitops/config-repo-kustomize/envs/production/kustomization.yaml
      - scripts/k8s/kustomize-render.sh
      outline:
      - "Kustomize builds manifests from plain YAML without placeholders: a `kustomization.yaml` lists what to include, and `kubectl kustomize` prints the result, since kubectl has Kustomize built in."
      - "Đơn Hàng's base holds every manifest once; each overlay, `envs/staging` and `envs/production`, lists the base as a resource and adds only what differs."
      - "A patch in an overlay names an object by kind and name and gives only the fields to change, such as the api's `replicas`; everything else comes from the base unchanged."
      - "The `images` field sets an image's tag or digest everywhere that image appears in the rendered output, so an overlay sets the api's and the migration's image in one place."
      - "`configMapGenerator` builds the api's ConfigMap with a hash of its content in the name and updates every reference, so a changed value changes the Pod template and rolls the Pods."
      - "`kustomize-render.sh` renders both overlays and diffs the output, showing exactly what separates staging from production."
      misconceptions:
      - "Seniors often assume varying manifests per environment needs a template language like Helm's."
      - "Seniors often assume an overlay is a full copy of the base with some values edited."
      - "Seniors often assume the hash in a generated ConfigMap's name is noise that is better turned off."
      depth_notes: "Không dạy component, replacements, namePrefix/namespace của Kustomize, helmCharts trong Kustomize, secretGenerator (Secret đến từ SealedSecret), `kustomize edit`. Chuyển repo cấu hình đang chạy — bài sau."
    - id: k8s.l2.config-repo-overlays
      title:
        vi: "Chuyển repo cấu hình sang một base và overlay cho từng môi trường"
        en: "Moving the config repository to a base and per-environment overlays"
      main_path: true
      duration_min: 14
      skills: [k8s.packaging.kustomize, devops.gitops.change-flow]
      prereqs: [k8s.l2.kustomize-overlays, k8s.l2.charts-through-argo-cd, devops.l3.verifying-before-deploy]
      related: [devops.l3.promoting-between-environments, devops.l3.argo-cd-applications]
      vocab: []
      example_tag: stage-3
      example_files:
      - scripts/k8s/kustomize-config-repo.sh
      - deploy/gitops/config-repo-kustomize/envs/production/kustomization.yaml
      - ".github/workflows/ci.yml"
      outline:
      - "Argo CD renders a folder with Kustomize when it finds a `kustomization.yaml` there, so the Application for `envs/staging` needs no change when that folder becomes an overlay."
      - "`kustomize-config-repo.sh` commits the conversion; Argo CD then finds a difference only in the api's ConfigMap, now generated with a hash, and the api Pods roll once."
      - "Promotion becomes one change to the `images` entry of `envs/production/kustomization.yaml`, which can name the verified digest just as `api.yaml` did before."
      - "A change meant for every environment, such as a new probe, is made once in the base; by the same token, one wrong change to the base reaches every environment at its next sync."
      - "CI renders every overlay and checks the output with kubeconform, since a mistake in the base or in a patch shows only in the rendered manifests."
      - "Đơn Hàng keeps overlays for its own manifests and charts for software others maintain; a team that installs its app many times with many settings may ship it as a chart instead."
      misconceptions:
      - "Seniors often assume switching to Kustomize means changing every Argo CD Application to point at a new tool."
      - "Seniors often assume overlays remove every way for environments to drift apart."
      - "Seniors often assume a team has to pick Helm or Kustomize for everything in its cluster."
      depth_notes: "Không dạy ApplicationSet sinh Application cho mỗi overlay, Kustomize render Helm chart, nhiều cluster (GĐ4). Không dạy lại promotion — devops.l3.promoting-between-environments; xác minh image — devops.l3.verifying-before-deploy."
  - id: state-and-storage
    title:
      vi: "Dữ liệu bền trên Kubernetes: volume, StatefulSet và sao lưu"
      en: "Durable data on Kubernetes: volumes, StatefulSets and backups"
    stage: 3
    summary:
      vi: "Cho database và RabbitMQ của staging dữ liệu sống qua việc Pod bị thay bằng PersistentVolumeClaim và StatefulSet, biết giới hạn của volume trên kind, sao lưu theo lịch bằng CronJob và cân nhắc chạy database trong cluster hay dùng dịch vụ managed."
      en: "Give staging's database and RabbitMQ data that survives Pod replacement with PersistentVolumeClaims and StatefulSets, know the limits of kind's volumes, back up on a schedule with a CronJob, and weigh running a database in the cluster against a managed one."
    lessons:
    - id: k8s.l2.persistent-volume-claims
      title:
        vi: "PersistentVolumeClaim giữ dữ liệu khi Pod bị thay"
        en: "A PersistentVolumeClaim keeps data when its Pod is replaced"
      main_path: true
      duration_min: 14
      skills: [k8s.storage.volumes]
      prereqs: [k8s.l1.deploying-don-hang, k8s.l1.configmap-files, devops.l1.volumes]
      related: [devops.l3.rpo-and-rto]
      vocab: [persistent-volume, persistent-volume-claim]
      example_tag: stage-3
      example_files:
      - deploy/k8s/db.yaml
      - deploy/k8s/lessons/data-pvc.yaml
      - deploy/k8s/lessons/data-writer-pod.yaml
      - scripts/k8s/pvc.sh
      outline:
      - "An `emptyDir` volume is created with its Pod and deleted with it, which is why a replacement `db` Pod from `deploy/k8s/db.yaml` starts with an empty database."
      - "A PersistentVolume is a piece of storage the cluster knows about; a PersistentVolumeClaim asks for storage of a size and an access mode, and Kubernetes binds it to one PersistentVolume."
      - "A Pod uses a claim by naming it under `volumes` with `persistentVolumeClaim`; the Pod can be deleted and replaced while the claim and the data on its volume stay."
      - "`pvc.sh` writes a file through one Pod, deletes that Pod, then reads the same file from a new Pod that mounts the same claim."
      - "The access mode `ReadWriteOnce` lets one node at a time mount the volume read-write, not one Pod: several Pods on that node can share it."
      misconceptions:
      - "Seniors often assume a volume declared inside a Pod keeps its data after the Pod is deleted."
      - "Seniors often assume `ReadWriteOnce` means only one Pod can ever use the volume."
      - "Seniors often assume a PersistentVolumeClaim is the storage itself rather than a request for it."
      depth_notes: "Không dạy StorageClass và PV được tạo ra sao (bài sau), reclaim policy (k8s.l2.reclaim-policy), ReadWriteMany/ReadWriteOncePod, volumeMode Block, mở rộng dung lượng, PV tạo tay. Lab chạy trên cluster `donhang` 3 node, namespace `storage-lessons`. Không dạy lại volume — devops.l1.volumes."
    - id: k8s.l2.storage-classes
      title:
        vi: "StorageClass tạo volume khi cần; volume của kind nằm trên một node"
        en: "A StorageClass creates volumes on demand; kind's stay on one node"
      main_path: true
      duration_min: 14
      skills: [k8s.storage.volumes]
      prereqs:
      - k8s.l2.persistent-volume-claims
      - k8s.l1.control-plane-components
      - k8s.l1.cluster-nodes-and-control-plane
      related: [devops.l3.disaster-recovery-drill]
      vocab: [storage-class, dynamic-provisioning]
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/data-pvc.yaml, scripts/k8s/storage-class.sh]
      outline:
      - "A StorageClass names a provisioner, a component that creates a PersistentVolume when a claim asks for one; with this dynamic provisioning nobody creates volumes ahead of time."
      - "A claim without `storageClassName` gets the cluster's default StorageClass; in a kind cluster that is `standard`, whose provisioner keeps each volume in a folder on one node."
      - "`standard` binds a claim only once a Pod using it has been scheduled, so the volume is created on the node kube-scheduler chose for that Pod."
      - "The PersistentVolume records its node, so every later Pod using the claim must run there; `storage-class.sh` marks that node unschedulable and the next Pod stays `Pending`."
      - "kind's volumes are not copied to another node or out of the cluster: losing the node or deleting the cluster loses the data; replicated storage needs a different provisioner."
      misconceptions:
      - "Seniors often assume a volume in a kind cluster lives on the laptop's disk and survives deleting the cluster."
      - "Seniors often assume a Pod with a persistent volume can be moved to any node, like a Pod without one."
      - "Seniors often assume every cluster's default StorageClass behaves the way kind's does."
      depth_notes: "Không dạy CSI, Longhorn/Rook-Ceph và lưu trữ nhân bản giữa node (k8s/bare-metal), volume snapshot, mở rộng volume, tham số riêng của provisioner, cách scheduler chọn node. Reclaim policy — bài sau."
    - id: k8s.l2.reclaim-policy
      title:
        vi: "Xóa claim là xóa dữ liệu, trừ khi reclaim policy giữ lại"
        en: "Deleting a claim deletes its data unless the policy retains it"
      main_path: true
      duration_min: 13
      skills: [k8s.storage.volumes]
      prereqs: [k8s.l2.storage-classes, devops.l3.self-heal, k8s.l1.namespaces]
      related: [devops.l3.restore-testing]
      vocab: [reclaim-policy]
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/retain-storageclass.yaml, scripts/k8s/reclaim-policy.sh]
      outline:
      - "A PersistentVolume's reclaim policy decides what happens to it when its claim is deleted; a dynamically provisioned volume takes the policy of its StorageClass, `Delete` for kind's `standard`."
      - "With `Delete`, deleting the claim deletes the PersistentVolume and the data on it; deleting a namespace deletes the claims in it, so their data goes too."
      - "With `Retain`, the PersistentVolume and its data stay after the claim is deleted, shown as `Released`, and no new claim is bound to it until someone deals with it by hand."
      - "`reclaim-policy.sh` deletes one claim from `standard` and one from a StorageClass with `Retain`, then lists the PersistentVolumes that are left."
      - "Under Argo CD with prune on, removing a claim's manifest from the config repository deletes the claim, and with `Delete` its data, in one commit."
      misconceptions:
      - "Seniors often assume deleting a namespace leaves its volumes' data behind for later."
      - "Seniors often assume a `Released` volume is bound again automatically to the next claim that asks."
      - "Seniors often assume a `Retain` policy is as good as a backup."
      depth_notes: "Không dạy cách dọn PV Released để dùng lại (claimRef), finalizer bảo vệ PVC đang dùng, policy Recycle. Claim của StatefulSet — k8s.l2.statefulsets; sao lưu — k8s.l2.scheduled-backups."
    - id: k8s.l2.statefulsets
      title:
        vi: "StatefulSet đưa Pod trở lại với tên cũ trên volume cũ"
        en: "A StatefulSet brings a Pod back under its old name on its old volume"
      main_path: true
      duration_min: 15
      skills: [k8s.storage.stateful-workloads]
      prereqs: [k8s.l2.reclaim-policy, k8s.l1.deployments, k8s.l2.config-repo-overlays]
      related: [backend.l3.read-replicas]
      vocab: [statefulset]
      example_tag: stage-3
      example_files: [deploy/gitops/config-repo-kustomize/base/db.yaml, scripts/k8s/statefulset-db.sh]
      outline:
      - "A StatefulSet runs Pods from a template like a Deployment but names them by number, `db-0`, `db-1`; a replacement for `db-0` is again called `db-0`, though it gets a new IP address."
      - "Its `volumeClaimTemplates` create one claim per Pod, named after the template and the Pod, such as `data-db-0`, and a replacement Pod mounts the claim of the Pod it replaces."
      - "By default a StatefulSet creates its Pods in order, starting the next only once the one before is running and ready, and removes them in reverse order when scaled down."
      - "Deleting the StatefulSet or scaling it down leaves its claims and their data in place by default, so scaling back up finds the data again."
      - "Staging's `db` becomes a StatefulSet with one replica in the base; `statefulset-db.sh` deletes `db-0` and finds the seeded orders still there when it returns."
      - "Two replicas do not make a replicated database: `db-1` would be a second, empty PostgreSQL server that receives nothing from `db-0`."
      misconceptions:
      - "Seniors often assume a StatefulSet with two replicas gives PostgreSQL a standby that takes over."
      - "Seniors often assume deleting a StatefulSet also deletes the data of its Pods."
      - "Seniors often assume `db-0` keeps its IP address, since it keeps its name."
      depth_notes: "Không dạy podManagementPolicy Parallel, updateStrategy/partition, persistentVolumeClaimRetentionPolicy, minReadySeconds. `serviceName` và headless Service — bài sau; nhân bản PostgreSQL thật (operator — k8s/operators-and-cluster-lifecycle)."
    - id: k8s.l2.headless-services
      title:
        vi: "Headless Service cho mỗi Pod của StatefulSet một tên DNS riêng"
        en: "A headless Service gives each StatefulSet Pod its own DNS name"
      main_path: true
      duration_min: 14
      skills: [k8s.storage.stateful-workloads]
      prereqs: [k8s.l2.statefulsets, k8s.l1.service-and-dns, backend.l3.message-broker]
      related: [backend.l3.read-replicas]
      vocab: [headless-service]
      example_tag: stage-3
      example_files: [deploy/gitops/config-repo-kustomize/base/rabbitmq.yaml, scripts/k8s/headless-dns.sh]
      outline:
      - "A Service with `clusterIP: None` is headless: it gets no virtual IP address, and its DNS name resolves to the IP addresses of its ready Pods instead."
      - "A StatefulSet's `serviceName` names a headless Service; each of its Pods then gets a DNS name of the form `<pod>.<service>.<namespace>.svc.cluster.local`, such as `rabbitmq-0.rabbitmq-headless.donhang.svc.cluster.local`."
      - "`headless-dns.sh` deletes `rabbitmq-0`: the Pod's DNS name stays the same and now resolves to the replacement's new IP address."
      - "A normal Service fits clients that may use any Pod, as the api uses `rabbitmq`; members of a replicated database or a RabbitMQ cluster must reach one particular member, which needs a name per Pod."
      - "RabbitMQ keeps its data in a folder named after its node name; `rabbitmq.yaml` builds that name from the Pod's DNS name, so a replacement Pod finds the queues it had."
      misconceptions:
      - "Seniors often assume a headless Service spreads connections across its Pods like any other Service."
      - "Seniors often assume a StatefulSet Pod keeps its IP address because it keeps its name."
      - "Seniors often assume clients should call `rabbitmq-0` by name even when any Pod would do."
      depth_notes: "Không dạy cluster RabbitMQ nhiều node, quorum queue nhân bản, cấu hình CoreDNS (k8s/networking-deep); bản ghi SRV, publishNotReadyAddresses không dạy ở GĐ3. Không dạy lại DNS của Service — k8s.l1.service-and-dns."
    - id: k8s.l2.staging-keeps-its-data
      title:
        vi: "Dữ liệu của staging giờ sống qua việc Pod bị thay"
        en: "Staging's data now survives a Pod being replaced"
      main_path: true
      duration_min: 15
      skills: [k8s.storage.stateful-workloads, k8s.packaging.kustomize]
      prereqs:
      - k8s.l2.headless-services
      - backend.l3.payments-service
      - devops.l3.ordering-a-sync
      - k8s.l2.gateway-api
      related: [backend.l3.outbox-relay, devops.l3.disaster-recovery-drill]
      vocab: []
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo-kustomize/base/kustomization.yaml
      - deploy/gitops/config-repo-kustomize/base/payments.yaml
      - deploy/gitops/config-repo/platform/edge/httproutes.yaml
      - scripts/k8s/stateful-staging.sh
      outline:
      - "`stateful-staging.sh` commits this module's base files: `db` and `rabbitmq` as StatefulSets with claims, and Deployments for `notifications`, `payments` and `fake-gateway`."
      - "`notifications` and `payments` each migrate their own database with a hook in wave 1, as the api does, before their Deployments are applied in wave 2."
      - "The HTTPRoute sends `/api/v1/refunds` to the `payments` Service, because Payments, not the api, answers that path, as Caddy routes it in Compose."
      - "Switching `db` from a Deployment with `emptyDir` to a StatefulSet starts once from an empty claim, so the init scripts seed it; after that a sync or a restart no longer reseeds."
      - "With `notifications` scaled to 0, the script places an order, deletes `db-0` and `rabbitmq-0`, and finds the order and its waiting message after both Pods return."
      - "The claims still live on staging's single node: deleting the cluster, as `dr-drill.sh` does, loses them, so the drill still starts from seed data."
      misconceptions:
      - "Seniors often assume a sync from Git can wipe and reseed the database once it has a claim."
      - "Seniors often assume persistent claims protect staging's data from losing the whole cluster."
      - "Seniors often assume the api must forward refund requests to Payments, since the path starts with `/api/v1`."
      depth_notes: "Không dạy Keycloak dùng PostgreSQL trên staging (staging giữ start-dev), Tempo/monitoring trong cluster, autoscaling, NetworkPolicy (k8s/security-and-policy). Không dạy lại hook và wave — devops.l3.ordering-a-sync; outbox, saga — backend GĐ3."
    - id: k8s.l2.scheduled-backups
      title:
        vi: "CronJob sao lưu database của staging theo lịch"
        en: "A CronJob backs up staging's database on a schedule"
      main_path: true
      duration_min: 15
      skills: [k8s.storage.data-operations]
      prereqs: [k8s.l2.staging-keeps-its-data, devops.l3.logical-backups, devops.l3.restore-testing]
      related: [devops.l3.rpo-and-rto, devops.l3.ordering-a-sync]
      vocab: [k8s-job, cronjob]
      example_tag: stage-3
      example_files: [deploy/gitops/config-repo-kustomize/base/db-backup.yaml, scripts/k8s/db-backup.sh]
      outline:
      - "A Job runs a Pod until it exits successfully, retrying a failed run up to `backoffLimit` times; unlike a Deployment, it does not start the Pod again after it succeeds."
      - "A CronJob creates a new Job each time its cron `schedule` comes round; `db-backup` runs `pg_dump -Fc` for `donhang`, `donhang_notifications` and `donhang_payments` into the claim `db-backups`."
      - "`concurrencyPolicy: Forbid` skips a run while the previous Job is still running, so two backups never write to the claim at once."
      - "`db-backup.sh` starts a Job from the CronJob at once with `kubectl create job --from`, waits for it, then copies the new dumps to `backups/staging/` on your machine."
      - "The claim `db-backups` sits on the same node as `data-db-0` and fails with it; a backup counts only once it is copied off the cluster and a restore of it has been tested."
      - "A failed run shows only as a failed Job in `kubectl get jobs`; nobody hears of it unless something watches for it."
      misconceptions:
      - "Seniors often assume a backup written to a volume in the cluster survives losing the cluster."
      - "Seniors often assume a CronJob keeps retrying a failed backup until it works."
      - "Seniors often assume a Job starts its Pod again after it succeeds, as a Deployment would."
      depth_notes: "Không dạy volume snapshot (k8s/bare-metal), Velero, backup etcd (k8s/operators-and-cluster-lifecycle), timeZone, startingDeadlineSeconds, completions/parallelism, alert khi Job lỗi (GĐ4). Migration vẫn là hook Pod. Không dạy lại pg_dump — devops.l3.logical-backups."
    - id: k8s.l2.database-in-the-cluster
      title:
        vi: "Chạy PostgreSQL trong cluster thì việc vận hành nó là của bạn"
        en: "Running PostgreSQL in the cluster makes running it your job"
      main_path: true
      duration_min: 13
      skills: [k8s.storage.data-operations]
      prereqs:
      - k8s.l2.scheduled-backups
      - devops.l3.point-in-time-recovery
      - devops.l3.disaster-recovery-drill
      - backend.l3.read-replicas
      related: [devops.l3.rpo-and-rto]
      vocab: [managed-database]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo-kustomize/base/db.yaml
      - deploy/gitops/config-repo-kustomize/base/redis.yaml
      - deploy/gitops/config-repo-kustomize/base/db-backup.yaml
      outline:
      - "A StatefulSet gives PostgreSQL a stable name and its own volume, nothing more: replicas, switching to a standby, point-in-time recovery and version upgrades stay work someone builds and practises."
      - "A managed database is a database server that a provider runs for you outside the cluster, with backups and a standby offered as settings; apps in the cluster reach it by address like any outside server."
      - "A managed database trades control for less work: the provider decides some server settings and when maintenance happens, and the data lives on the provider's machines."
      - "A managed database usually fits a team on a cloud with nobody to run databases; running one in the cluster fits when no such service exists, such as on a bank's own machines, or data must stay on them."
      - "Đơn Hàng's staging runs PostgreSQL and RabbitMQ in the cluster because the lab has no cloud account and both hold the only copy of some data; Redis stays a Deployment without a claim, as it holds only copies."
      misconceptions:
      - "Seniors often assume moving PostgreSQL to a StatefulSet keeps it running when its node fails."
      - "Seniors often assume databases must never run inside Kubernetes."
      - "Seniors often assume a managed database removes the need to test restores."
      depth_notes: "Không nêu tên dịch vụ cloud hay so giá (không có trong versions.yaml), operator PostgreSQL (k8s/operators-and-cluster-lifecycle), managed vs self-hosted cho cả cluster (k8s/managed-vs-selfhosted GĐ4), viết ADR (GĐ4)."
- level: 3
  title:
    vi: "Level 3"
    en: "Level 3"
  modules:
  - id: security-and-policy
    title:
      vi: "Bảo mật và chính sách: ai được làm gì, cái gì được chạy"
      en: "Security and policy: who may do what, and what may run"
    stage: 3
    summary:
      vi: "Đọc và cấp quyền trên API server bằng Role, ClusterRole và ServiceAccount theo nguyên tắc quyền tối thiểu, cho Pod của Đơn Hàng chạy không phải root dưới Pod Security admission, chặn kết nối không cần thiết bằng NetworkPolicy, và thêm luật riêng bằng ValidatingAdmissionPolicy — biết luật đó không thay được việc kiểm chữ ký."
      en: "Grant and read rights on the API server with Roles, ClusterRoles and ServiceAccounts under least privilege, run Đơn Hàng's Pods as non-root under Pod Security admission, block needless connections with NetworkPolicies, and add your own rule with a ValidatingAdmissionPolicy, knowing it cannot replace a signature check."
    lessons:
    - id: k8s.l3.api-request-checks
      title:
        vi: "Mọi request tới API server qua xác thực, phân quyền rồi admission"
        en: "Every API request is authenticated, authorized, then admitted"
      main_path: true
      duration_min: 12
      skills: [k8s.security.access]
      prereqs:
      - k8s.l1.kubectl-and-the-api-server
      - k8s.l1.control-plane-components
      - backend.l1.protecting-an-endpoint
      related: [backend.l2.role-based-access, backend.l1.validating-a-jwt]
      vocab: [admission-controller]
      example_tag: stage-3
      example_files: [scripts/k8s/api-request-checks.sh]
      outline:
      - "Every request to the API server passes three checks in order: authentication finds out who sent it, authorization decides whether that caller may do this action, and admission controllers inspect the object before etcd stores it."
      - "Kubernetes keeps no user accounts: a person is whoever a certificate or token the API server trusts names; `kubectl auth whoami` prints the user and groups that kind's kubeconfig signs you in as."
      - "Credentials the API server cannot verify get `401 Unauthorized`; a known caller without permission gets `403 Forbidden`, which kubectl prints as `Error from server (Forbidden)`."
      - "`kubectl auth can-i` asks only the authorization step and changes nothing; with `--as` an administrator asks on behalf of another user, as `api-request-checks.sh` does for a user `junior-dev`."
      - "Authorization sees only who, which verb, which kind of object and which namespace; checks on the object's content, such as which image a Pod runs, belong to admission controllers."
      misconceptions:
      - "Seniors often assume Kubernetes keeps a list of users that an administrator adds people to."
      - "Seniors often assume anyone who can reach the API server's address can change the cluster."
      - "Seniors often assume authorization can look inside an object, such as refusing Pods that run a certain image."
      depth_notes: "Không dạy cấp chứng chỉ hay OIDC cho người dùng thật, cấu hình authenticator, webhook authorization, audit log, danh sách admission plugin. Role/RoleBinding — bài sau; admission tự viết — k8s.l3.admission-policies."
    - id: k8s.l3.roles-and-role-bindings
      title:
        vi: "Role liệt kê việc được làm; RoleBinding trao nó cho một người"
        en: "A Role lists allowed actions; a RoleBinding gives them to someone"
      main_path: true
      duration_min: 15
      skills: [k8s.security.access]
      prereqs: [k8s.l3.api-request-checks, k8s.l1.secrets, k8s.l1.namespaces, backend.l2.role-based-access]
      related: [devops.l3.secrets-and-gitops, devops.l3.sealed-secrets]
      vocab: [k8s-role, role-binding, least-privilege]
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/pod-reader-role.yaml, scripts/k8s/rbac-role.sh]
      outline:
      - "A Role is a list of rules, each naming API groups, kinds of objects and verbs such as `get`, `list` and `delete`; it allows those actions in its own namespace only."
      - "A RoleBinding gives a Role to users or groups in the same namespace; RBAC rules only allow, so a caller may do whatever any of its bindings allows, and no rule can deny."
      - "`rbac-role.sh` binds `pod-reader` to `junior-dev` in `security-lessons`: `kubectl auth can-i` answers yes for listing Pods there, no in `donhang`, and no for Secrets or for deleting Pods."
      - "Permission to `list` or `watch` Secrets returns their values, not only their names, and permission to create Pods in a namespace lets someone mount any Secret there, so both amount to reading Secrets."
      - "Encrypting Secrets at rest protects copies of etcd's data, such as a backup; it does nothing against a caller whom RBAC allows to read a Secret through the API server."
      - "Least privilege means each person or program gets only the actions its work needs, only in the namespaces where it does that work, and nothing granted just in case."
      misconceptions:
      - "Seniors often assume a Role can deny one action to someone whom another binding allows."
      - "Seniors often assume permission to list Secrets shows only their names."
      - "Seniors often assume encrypting Secrets at rest hides them from anyone using kubectl."
      - "Seniors often assume someone who cannot read Secrets cannot get at them through a Pod they create."
      depth_notes: "Không dạy ClusterRole (k8s.l3.cluster-roles), aggregated ClusterRole, verb escalate/bind/impersonate, resourceNames, cách bật encryption at rest (k8s/operators-and-cluster-lifecycle). ServiceAccount làm subject — bài sau."
    - id: k8s.l3.service-accounts
      title:
        vi: "Pod gọi API server dưới danh tính ServiceAccount của nó"
        en: "A Pod calls the API server as its ServiceAccount"
      main_path: true
      duration_min: 13
      skills: [k8s.security.access]
      prereqs: [k8s.l3.roles-and-role-bindings, k8s.l1.configmap-files, k8s.l2.config-repo-overlays]
      related: [backend.l2.validating-provider-tokens]
      vocab: [service-account]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/token-pods.yaml
      - scripts/k8s/service-accounts.sh
      - deploy/gitops/config-repo-kustomize/base/api.yaml
      outline:
      - "A ServiceAccount is an identity for programs, kept as an object in a namespace; every namespace has one named `default`, and a Pod that names no ServiceAccount runs as it."
      - "Unless told otherwise, Kubernetes mounts a token for the Pod's ServiceAccount as a file under `/var/run/secrets/kubernetes.io/serviceaccount/`, and the kubelet replaces it before it expires."
      - "In RBAC a ServiceAccount is the user `system:serviceaccount:<namespace>:<name>` and can do only what bindings give it; `service-accounts.sh` checks `default` in `security-lessons` with `kubectl auth can-i --as`."
      - "Anyone who reads that token file, such as an attacker who takes over the container, can call the API server with the ServiceAccount's rights."
      - "The api, Notifications and Payments never call the API server, so staging's base sets `automountServiceAccountToken: false` on their Pods and `service-accounts.sh` finds no token file in an api Pod."
      misconceptions:
      - "Seniors often assume a Pod has no identity on the API server unless someone gives it a ServiceAccount."
      - "Seniors often assume the `default` ServiceAccount may read everything in its namespace."
      - "Seniors often assume a token mounted into a Pod is harmless when the application never uses it."
      depth_notes: "Không dạy TokenRequest API, audience, token cho dịch vụ ngoài cluster, imagePullSecrets trên ServiceAccount, workload identity của cloud. ClusterRole cho ServiceAccount của Argo CD — bài sau."
    - id: k8s.l3.cluster-roles
      title:
        vi: "ClusterRole phủ cả cluster, và Argo CD giữ cái rộng nhất"
        en: "A ClusterRole spans the cluster, and Argo CD holds the widest one"
      main_path: true
      duration_min: 14
      skills: [k8s.security.access]
      prereqs: [k8s.l3.service-accounts, devops.l3.self-heal, devops.l3.verifying-before-deploy]
      related: [devops.l3.argo-cd-applications, devops.l3.deploying-by-commit]
      vocab: [cluster-role, cluster-role-binding]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/junior-view-binding.yaml
      - scripts/k8s/cluster-roles.sh
      - deploy/argocd/install.yaml
      outline:
      - "A ClusterRole is a Role without a namespace: it can cover cluster-wide kinds such as nodes and namespaces, and one ClusterRole can be reused in many namespaces."
      - "A RoleBinding that names a ClusterRole grants it in that binding's namespace only; a ClusterRoleBinding grants it in every namespace at once."
      - "The built-in ClusterRole `view` reads most objects in a namespace but not Secrets, and `cluster-admin` allows every action; `cluster-roles.sh` binds `view` to `junior-dev` in staging's `donhang`."
      - "Argo CD's `argocd-application-controller` ServiceAccount is bound to a ClusterRole that allows every verb on every kind, so Argo CD can create any object the config repository holds."
      - "Under GitOps, write access to the config repository is therefore as powerful as `cluster-admin`; people who only need to look get `view`, and changes reach the cluster through reviewed commits."
      misconceptions:
      - "Seniors often assume a RoleBinding to a ClusterRole grants it across the whole cluster."
      - "Seniors often assume the built-in `view` role lets someone read Secrets."
      - "Seniors often assume that limiting people's kubectl rights limits what reaches the cluster under GitOps."
      depth_notes: "Không dạy RBAC riêng của Argo CD (AppProject, argocd-rbac-cm), thu hẹp quyền controller theo namespace, aggregated ClusterRole, đăng nhập người thật vào staging, bảo vệ nhánh repo cấu hình (GĐ4)."
    - id: k8s.l3.security-context
      title:
        vi: "securityContext cho container chạy không phải root, ít quyền hơn"
        en: "A securityContext runs the container as non-root with fewer powers"
      main_path: true
      duration_min: 15
      skills: [k8s.security.workload-hardening]
      prereqs:
      - k8s.l1.deploying-don-hang
      - devops.l1.multi-stage-builds
      - foundation.l1.files-and-permissions
      - k8s.l3.service-accounts
      related: [devops.l3.software-supply-chain]
      vocab: [security-context]
      example_tag: stage-3
      example_files:
      - DonHang.Api/Dockerfile
      - deploy/gitops/config-repo-kustomize/base/api.yaml
      - deploy/k8s/lessons/root-caddy-pod.yaml
      - scripts/k8s/security-context.sh
      outline:
      - "A container runs as the user its image names, or as root when the image names none; until this module the api image named none, so the api ran as root."
      - "The .NET images include a non-root user whose numeric ID is in the variable `APP_UID`; the api's Dockerfile now switches to it with `USER $APP_UID`, and `security-context.sh` runs `id` in an api Pod."
      - "A `securityContext` on a Pod or a container sets how its process runs; with `runAsNonRoot: true` the kubelet refuses to start a container that would run as root, and the Pod shows `CreateContainerConfigError`."
      - "The kubelet can check only a numeric user: an image whose `USER` is a name, such as `app`, fails `runAsNonRoot` unless `runAsUser` gives the number."
      - "`allowPrivilegeEscalation: false`, dropping `ALL` capabilities and `seccompProfile: RuntimeDefault` remove kernel powers the process does not need; staging's base sets them with `runAsNonRoot` for the .NET services."
      misconceptions:
      - "Seniors often assume a process running as root inside a container cannot hurt anything outside it."
      - "Seniors often assume `runAsNonRoot: true` switches the container to some non-root user by itself."
      - "Seniors often assume an image that runs as a named non-root user always passes `runAsNonRoot`."
      depth_notes: "Không dạy user namespaces, AppArmor/SELinux, profile seccomp tự viết, fsGroup và quyền trên volume, readOnlyRootFilesystem chi tiết. Ép cả namespace theo một mức — bài sau. Không dạy lại Dockerfile — devops.l1.multi-stage-builds."
    - id: k8s.l3.pod-security-admission
      title:
        vi: "Pod Security admission áp một mức bảo mật cho cả namespace"
        en: "Pod Security admission enforces one security level per namespace"
      main_path: true
      duration_min: 15
      skills: [k8s.security.workload-hardening]
      prereqs:
      - k8s.l3.security-context
      - k8s.l3.api-request-checks
      - k8s.l1.replicasets
      - devops.l3.one-state-per-environment
      related: [devops.l3.tofu-modules]
      vocab: [pod-security-standards, pod-security-admission]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/restricted-namespace.yaml
      - scripts/k8s/pod-security.sh
      - deploy/tofu/modules/donhang-platform/main.tf
      outline:
      - "The Pod Security Standards define three levels: `privileged` allows everything, `baseline` blocks known privilege escalations such as `privileged: true`, and `restricted` also requires settings like those of the previous lesson."
      - "Pod Security admission, built into the API server, reads labels `pod-security.kubernetes.io/<mode>: <level>` on a namespace; `enforce` rejects violating Pods, `warn` returns a warning to the client, `audit` records it."
      - "`enforce` checks Pods, not the Deployments that create them: a violating Deployment is accepted, its ReplicaSet's Pods are refused, and the reason shows only in the ReplicaSet's events."
      - "`pod-security.sh` applies a Pod without a securityContext to the `restricted` namespace `pod-security-lessons` and gets a message listing each failed check; the same template in a Deployment produces no Pods."
      - "Adding `--dry-run=server` to `kubectl label` on an existing namespace lists the running Pods that would violate a level without enforcing it; `pod-security.sh` runs it on staging's `donhang`."
      - "Staging's `donhang` gets its labels from the OpenTofu module `donhang-platform`: `enforce` at the strictest level that all its Pods pass, `warn` and `audit` at `restricted`."
      misconceptions:
      - "Seniors often assume `kubectl apply` fails when a Deployment breaks the namespace's Pod Security level."
      - "Seniors often assume Pod Security admission changes Pods so that they pass."
      - "Seniors often assume labelling a namespace `restricted` stops the Pods already running there."
      depth_notes: "Không dạy AdmissionConfiguration của API server (mặc định, exemptions), PodSecurityPolicy, nhãn `enforce-version`, từng kiểm tra của từng mức. Luật riêng của Đơn Hàng — k8s.l3.admission-policies."
    - id: k8s.l3.network-policies
      title:
        vi: "NetworkPolicy biến kết nối tự do giữa Pod thành danh sách cho phép"
        en: "A NetworkPolicy turns open Pod traffic into an allow list"
      main_path: true
      duration_min: 15
      skills: [k8s.security.network-policy]
      prereqs: [k8s.l1.service-and-dns, k8s.l1.labels, k8s.l2.staging-keeps-its-data, k8s.l2.gateway-api]
      related: [k8s.l1.readiness-probes]
      vocab: [network-policy]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo-kustomize/base/network-policies.yaml
      - scripts/k8s/network-policy.sh
      outline:
      - "Without NetworkPolicies any Pod can open connections to any other Pod in the cluster, across namespaces: `network-policy.sh` connects from a Pod in `security-lessons` to staging's `db` on port 5432."
      - "A NetworkPolicy selects Pods by label; once any policy selects a Pod for ingress, only connections that some policy allows reach it, and policies can only add allowed connections."
      - "The cluster's network plugin carries NetworkPolicies out; with a plugin that lacks support the API server accepts them and nothing is blocked. kind's default plugin, kindnet, enforces them in kind 0.33."
      - "Staging's base adds one policy that selects every Pod in `donhang` with no ingress rules, isolating them all, then one policy per service naming the Pods or namespaces allowed to connect to it."
      - "After the commit the same connection to `db` from `security-lessons` fails while the api still reaches `db`; the kubelet's probes keep working because traffic from a Pod's own node is always allowed."
      misconceptions:
      - "Seniors often assume Pods in different namespaces cannot reach each other by default."
      - "Seniors often assume a NetworkPolicy the API server accepted is being enforced."
      - "Seniors often assume one NetworkPolicy can block a connection that another policy allows."
      depth_notes: "Không dạy policy egress (phải mở DNS), ipBlock, cách network plugin thực thi và CNI (k8s/networking-deep), AdminNetworkPolicy, mã hóa traffic giữa Pod, service mesh (GĐ4)."
    - id: k8s.l3.admission-policies
      title:
        vi: "ValidatingAdmissionPolicy thêm luật riêng của bạn vào API server"
        en: "A ValidatingAdmissionPolicy adds your own rule to the API server"
      main_path: true
      duration_min: 15
      skills: [k8s.security.admission-policy]
      prereqs: [k8s.l3.pod-security-admission, k8s.l3.cluster-roles, devops.l3.verifying-before-deploy]
      related: [devops.l3.signing-images, devops.l3.pinning-by-content]
      vocab: [validating-admission-policy, cel, admission-webhook]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo/platform/policies/require-image-digest.yaml
      - deploy/gitops/config-repo/apps/policies-staging.yaml
      - scripts/k8s/admission-policy.sh
      outline:
      - "A ValidatingAdmissionPolicy holds checks written in CEL that the API server itself evaluates; a ValidatingAdmissionPolicyBinding chooses where it applies and whether a failure denies, warns or only audits."
      - "Đơn Hàng's policy `require-image-digest` rejects Pods in `donhang` whose image from `ghcr.io/duyan11110/` lacks `@sha256:`, the form `deploy-verified.sh` commits, so a tag that moves cannot reach staging."
      - "`admission-policy.sh` binds the policy with `Warn` first to list existing Pods that would fail, then with `Deny`, and shows a Pod that names the api image by tag only being refused."
      - "CEL sees only the request and the object, never the registry, so the policy cannot tell whether a digest was signed: a digest committed without `deploy-verified.sh` still passes."
      - "Checking signatures at admission needs an admission webhook, a server the API server calls during admission, run by a policy engine; Đơn Hàng installs none, so signatures are still checked on the commit path."
      - "A webhook adds a dependency: with `failurePolicy: Fail` its outage blocks every Pod it covers, even during recovery; with `Ignore`, unchecked Pods get through while it is down."
      misconceptions:
      - "Seniors often assume a custom admission rule always needs a policy engine installed in the cluster."
      - "Seniors often assume that requiring digests means every running image was verified."
      - "Seniors often assume a policy that blocks bad Pods costs nothing when it fails."
      depth_notes: "Không nêu tên/cài policy engine (Kyverno, Gatekeeper chưa có trong versions.yaml), MutatingAdmissionPolicy, paramKind, matchConditions, viết webhook. CEL chỉ ở mức đọc biểu thức trong bài. Không dạy lại ký và xác minh — devops/supply-chain."
  - id: networking-deep
    title:
      vi: "Mạng bên trong cluster: Pod, Service, DNS và egress"
      en: "Networking inside the cluster: Pods, Services, DNS and egress"
    stage: 3
    summary:
      vi: "Giải thích được Pod nhận địa chỉ và gọi Pod ở node khác ra sao, kube-proxy và CoreDNS làm Service và tên chạy thế nào, mở Service ra ngoài cluster và biết giới hạn của kind, chặn kết nối đi ra của Pod mà không làm hỏng DNS, và gỡ lỗi một kết nối hỏng từng bước."
      en: "Explain how a Pod gets its address and reaches Pods on other nodes, how kube-proxy and CoreDNS make Services and names work, open a Service outside the cluster knowing kind's limits, limit Pods' outgoing connections without breaking DNS, and debug a broken connection step by step."
    lessons:
    - id: k8s.l3.pod-network-model
      title:
        vi: "Mỗi Pod một địa chỉ IP, gọi thẳng được từ mọi node"
        en: "Every Pod gets its own IP address, reachable from every node"
      main_path: true
      duration_min: 13
      skills: [k8s.networking.pod-network]
      prereqs: [k8s.l1.services, k8s.l1.cluster-nodes-and-control-plane, devops.l1.docker-networks]
      related: [foundation.l1.ip-and-ports, k8s.l3.network-policies]
      vocab: [pod-network]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/echo-ip.yaml
      - deploy/k8s/lessons/two-container-pod.yaml
      - scripts/k8s/pod-network.sh
      outline:
      - "Kubernetes states the rules of its network model but does not carry them out itself: every Pod gets its own IP address, and every Pod can connect to every other Pod's address, on any node."
      - "No address is rewritten between Pods: `pod-network.sh` calls `echo-ip` Pods on another node by Pod IP address, and each one answers with the caller's own Pod IP address."
      - "Each node owns a range of Pod addresses, shown as `spec.podCIDR` on the node, and a new Pod gets a free address from the range of the node it was scheduled to."
      - "All containers of one Pod share its IP address and its ports: `two-container-pod.yaml` has one container reach the other on `localhost`, and two of them cannot listen on the same port."
      - "In Compose only containers on the same Docker network reach each other; the Pod network is one flat network for the whole cluster, open between all Pods until NetworkPolicies limit it."
      misconceptions:
      - "Seniors often assume a Pod on one node can reach a Pod on another node only through a Service."
      - "Seniors often assume a Pod sees connections from other Pods as coming from their node's IP address."
      - "Seniors often assume two containers in one Pod each get their own IP address, like two Compose services."
      depth_notes: "Không dạy plugin nối Pod vào mạng (bài sau), hostNetwork, IPv6/dual-stack, ai cấp dải địa chỉ cho node, IP của Service (k8s.l3.kube-proxy). Lab trên cluster `donhang` 3 node, namespace `network-lessons`. Không dạy lại Docker network — devops.l1.docker-networks."
    - id: k8s.l3.cni-plugins
      title:
        vi: "CNI plugin, không phải Kubernetes, nối từng Pod vào mạng"
        en: "A CNI plugin, not Kubernetes, connects each Pod to the network"
      main_path: true
      duration_min: 13
      skills: [k8s.networking.pod-network]
      prereqs: [k8s.l3.pod-network-model, k8s.l1.control-plane-components, k8s.l3.network-policies]
      related: [k8s.l1.cluster-nodes-and-control-plane]
      vocab: [cni-plugin]
      example_tag: stage-3
      example_files: [scripts/k8s/cni.sh]
      outline:
      - "Kubernetes ships no Pod networking: when the kubelet starts a Pod, the container runtime calls a CNI plugin, which gives the Pod its address and connects it to the node."
      - "A cluster without a CNI plugin leaves its nodes `NotReady`, so every way of building a cluster installs one; kind installs its own plugin, kindnet."
      - "kindnet runs one Pod on every node in `kube-system`; `cni.sh` lists them and prints a node's routes: one per other node's Pod range, pointing at that node's address."
      - "Plain routes are enough for kind because its nodes are containers on one Docker network; plugins for nodes on separate networks wrap Pod traffic inside packets sent between node addresses."
      - "The plugin is chosen when the cluster is built and decides how Pod traffic travels and whether NetworkPolicies are enforced, so it is a decision about the cluster, not about one application."
      misconceptions:
      - "Seniors often assume Kubernetes itself assigns Pod IP addresses and moves packets between nodes."
      - "Seniors often assume kindnet's Pods forward every packet between nodes themselves."
      - "Seniors often assume every cluster connects Pods the same way, so what they see on kind holds everywhere."
      depth_notes: "Không nêu tên hay so sánh plugin khác (chưa có trong versions.yaml), file cấu hình CNI trên node, IPAM, MTU, đổi plugin trên cluster đang chạy, cách kindnet thực thi NetworkPolicy. eBPF — k8s.l3.kube-proxy."
    - id: k8s.l3.kube-proxy
      title:
        vi: "kube-proxy biến mỗi Service thành luật chuyển kết nối trên mọi node"
        en: "kube-proxy turns each Service into packet rules on every node"
      main_path: true
      duration_min: 15
      skills: [k8s.networking.service-internals]
      prereqs: [k8s.l3.cni-plugins, k8s.l1.readiness-probes, k8s.l2.headless-services]
      related: [k8s.l1.services, backend.l3.message-broker]
      vocab: [kube-proxy, endpoint-slice, ebpf]
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/echo-ip.yaml, scripts/k8s/kube-proxy.sh]
      outline:
      - "A cluster IP belongs to no Pod and no network card: kube-proxy, running on every node, watches Services and EndpointSlices and writes rules that redirect connections to it."
      - "An EndpointSlice lists the addresses of a Service's Pods and whether each is ready; the control plane keeps it in step with the selector, and only ready addresses get new connections."
      - "In Đơn Hàng's kind cluster kube-proxy runs in `iptables` mode: `kube-proxy.sh` prints the rules for `echo-ip`, one entry per Pod, one of which is picked at random when a connection opens."
      - "The Pod is chosen once per connection, not per request: a client that keeps one connection open, as HTTP keep-alive does, sends all its requests to the same Pod."
      - "A headless Service gets no such rules because it has no cluster IP; its clients get Pod addresses from DNS and connect to them directly."
      - "kube-proxy has other modes, and some CNI plugins replace it with eBPF programs in the kernel; clients of a Service see the same behaviour either way."
      misconceptions:
      - "Seniors often assume a Service is a proxy process that every request passes through."
      - "Seniors often assume a Service spreads each HTTP request across its Pods."
      - "Seniors often assume a Service's cluster IP is assigned to some machine or Pod in the cluster."
      depth_notes: "Không dạy chi tiết chuỗi iptables, mode nftables/IPVS, session affinity, topology/traffic distribution, conntrack, endpoint đang terminating. NodePort/LoadBalancer — bài sau. Không dạy lại readiness — k8s.l1.readiness-probes."
    - id: k8s.l3.service-types
      title:
        vi: "NodePort và LoadBalancer mở Service ra ngoài cluster ra sao"
        en: "How NodePort and LoadBalancer Services open a Service to the outside"
      main_path: true
      duration_min: 14
      skills: [k8s.networking.service-internals]
      prereqs: [k8s.l3.kube-proxy, k8s.l2.ingress]
      related: [k8s.l2.gateway-api]
      vocab: [nodeport-service, loadbalancer-service]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/echo-nodeport.yaml
      - deploy/k8s/lessons/echo-loadbalancer.yaml
      - scripts/k8s/service-types.sh
      outline:
      - "A NodePort Service is a ClusterIP Service plus one port opened on every node; kube-proxy forwards a connection to that port on any node to one of the Service's Pods."
      - "Unless `nodePort` is set, Kubernetes picks the port from a range, 30000–32767 by default; `service-types.sh` calls the control-plane node, which runs no `echo-ip` Pod, on that port and gets an answer."
      - "A LoadBalancer Service is a NodePort Service that also asks a controller outside Kubernetes's core, usually the cloud provider's, for a load balancer with an outside address that sends traffic to the nodes."
      - "kind has no such controller, so the LoadBalancer Service's `EXTERNAL-IP` stays `<pending>`; the Service still works through its cluster IP and its node port."
      - "A cluster outside a cloud needs its own component to hand out those addresses; Đơn Hàng's lab reaches its Gateway through ports the staging node publishes to your machine instead."
      misconceptions:
      - "Seniors often assume a node port is opened only on the nodes where the Service's Pods run."
      - "Seniors often assume creating a LoadBalancer Service gets an outside address on any cluster."
      - "Seniors often assume a LoadBalancer Service replaces the cluster IP and node port instead of adding to them."
      depth_notes: "Không dạy MetalLB và địa chỉ cho LoadBalancer trên máy thật (k8s/bare-metal), cloud-provider-kind, externalTrafficPolicy và giữ IP client, ExternalName, externalIPs, health check của load balancer cloud. Không dạy lại Ingress — k8s.l2.ingress."
    - id: k8s.l3.coredns
      title:
        vi: "CoreDNS trả lời tên trong cluster từ API, chuyển tiếp mọi tên khác"
        en: "CoreDNS answers cluster names from the API and forwards the rest"
      main_path: true
      duration_min: 14
      skills: [k8s.networking.dns]
      prereqs: [k8s.l1.service-and-dns, k8s.l3.kube-proxy, k8s.l1.configmaps]
      related: [k8s.l2.headless-services, foundation.l1.dns]
      vocab: [coredns]
      example_tag: stage-3
      example_files: [scripts/k8s/coredns.sh]
      outline:
      - "The cluster DNS server is CoreDNS, running as Pods in `kube-system` behind the Service `kube-dns`, whose address every Pod's `/etc/resolv.conf` names."
      - "CoreDNS reads its configuration, the Corefile, from the ConfigMap `coredns`; each line in a server block turns on one plugin, and `coredns.sh` prints the Corefile of kind's cluster."
      - "The `kubernetes` plugin answers names under `cluster.local` from the Services and EndpointSlices it watches through the API server, so a new Service resolves without anyone editing DNS records."
      - "The `forward` plugin sends every other name to the resolvers in the node's own `/etc/resolv.conf`, and the `cache` plugin keeps answers for a while."
      - "Every Pod depends on these few CoreDNS Pods: `coredns.sh` scales them to zero, and lookups from a test Pod fail while a connection to a Pod IP address still works."
      misconceptions:
      - "Seniors often assume Kubernetes writes a DNS record into a zone file whenever a Service is created."
      - "Seniors often assume Pods resolve outside names through the node directly, not through CoreDNS."
      - "Seniors often assume a cluster keeps working normally while its DNS Pods are down, since Services have fixed IP addresses."
      depth_notes: "Không dạy viết plugin, stub domain/rewrite, NodeLocal DNSCache, bản ghi SRV, tên DNS của Pod, ExternalName, tự scale CoreDNS. ndots và dnsPolicy — bài sau. Không dạy lại tên của Service — k8s.l1.service-and-dns."
    - id: k8s.l3.dns-search-and-ndots
      title:
        vi: "ndots khiến tên bên ngoài phải thử hết search domain trước"
        en: "ndots makes outside names try every search domain first"
      main_path: true
      duration_min: 13
      skills: [k8s.networking.dns]
      prereqs: [k8s.l3.coredns]
      related: [k8s.l1.service-and-dns]
      vocab: [ndots]
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/dns-config-pod.yaml, scripts/k8s/dns-search.sh]
      outline:
      - "With the default `dnsPolicy: ClusterFirst`, the kubelet writes the cluster's search domains and `options ndots:5` into each Pod's `/etc/resolv.conf`."
      - "A name with fewer dots than `ndots` is tried with each search domain appended before it is tried as written, so a lookup of an outside name such as `example.com` starts with failed queries."
      - "`dns-search.sh` turns on CoreDNS's `log` plugin and shows the queries one lookup of an outside name produces, then the single query for the same name written with a final dot."
      - "A final dot or a lower `ndots` in the Pod's `dnsConfig`, as in `dns-config-pod.yaml`, avoids the extra queries; for Services in the same namespace, the short name stays the simplest choice."
      - "`dnsPolicy: Default` is not the default: it gives the Pod the node's resolver settings, so names of Services stop resolving inside that Pod."
      misconceptions:
      - "Seniors often assume looking up an outside name from a Pod sends exactly one DNS query."
      - "Seniors often assume `dnsPolicy: Default` is the policy a Pod gets when none is set."
      - "Seniors often assume extra DNS queries cost nothing because CoreDNS caches the answers."
      depth_notes: "Không dạy dnsPolicy None/ClusterFirstWithHostNet chi tiết, hostNetwork, khác biệt giữa các thư viện tra tên (glibc, musl), timeout/attempts, NodeLocal DNSCache. Bật log CoreDNS chỉ trên cluster `donhang`, không trên staging."
    - id: k8s.l3.egress-policies
      title:
        vi: "Policy chặn kết nối đi ra phải chừa DNS, nếu không mọi tên đều hỏng"
        en: "An egress policy must allow DNS, or every name lookup fails"
      main_path: true
      duration_min: 15
      skills: [k8s.security.network-policy, k8s.networking.dns]
      prereqs: [k8s.l3.network-policies, k8s.l3.coredns, k8s.l3.kube-proxy, k8s.l2.config-repo-overlays]
      related: [k8s.l3.dns-search-and-ndots]
      vocab: []
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/deny-egress.yaml
      - deploy/k8s/lessons/allow-dns-egress.yaml
      - deploy/gitops/config-repo-kustomize/base/egress-policies.yaml
      - scripts/k8s/egress-policy.sh
      outline:
      - "A NetworkPolicy that lists `Egress` in `policyTypes` isolates its Pods' outgoing connections: once selected, a Pod can open only connections that some egress rule allows."
      - "Blocking all outgoing connections blocks DNS too: after `deny-egress.yaml`, a Pod in `network-lessons` can no longer resolve `echo-ip`, because it cannot reach CoreDNS."
      - "`allow-dns-egress.yaml` allows UDP and TCP port 53 to Pods labelled `k8s-app: kube-dns` in the namespace whose `kubernetes.io/metadata.name` label is `kube-system`."
      - "Egress rules see a connection after kube-proxy has replaced the cluster IP, so a rule names the target Pods by label and their `targetPort`, not the Service's address and port."
      - "Staging's base adds a deny-all egress policy for `donhang` and one policy per service listing what it calls, such as the api to `db`, `redis` and `rabbitmq`; `egress-policy.sh` checks the api still answers."
      - "Egress policies cover only connections that Pods open: the kubelet pulls images and runs probes from the node itself, so neither is blocked."
      misconceptions:
      - "Seniors often assume a deny-all egress policy still lets Pods resolve names, because DNS is part of the cluster."
      - "Seniors often assume an egress rule for a Service's cluster IP and port allows connections through that Service."
      - "Seniors often assume an egress policy on a Pod stops its node from pulling the Pod's image."
      depth_notes: "Không dạy ipBlock và egress ra internet, policy theo tên miền, AdminNetworkPolicy, egress gateway, service mesh (GĐ4). Không dạy lại policy cho kết nối đi vào — k8s.l3.network-policies."
    - id: k8s.l3.debugging-pod-networking
      title:
        vi: "Gỡ lỗi kết nối hỏng từ chính Pod gọi, từng bước một"
        en: "Debug a failed connection from the calling Pod, step by step"
      main_path: true
      duration_min: 15
      skills: [k8s.networking.troubleshooting]
      prereqs:
      - k8s.l3.egress-policies
      - k8s.l3.dns-search-and-ndots
      - k8s.l3.kube-proxy
      - foundation.l1.tcp-vs-udp
      related: [k8s.l1.readiness-probes, k8s.l1.labels]
      vocab: []
      example_tag: stage-3
      example_files: [deploy/k8s/lessons/broken-echo.yaml, scripts/k8s/network-debug.sh]
      outline:
      - "The error shows where it failed: a name that does not resolve points at DNS, `connection refused` means nothing accepted the connection, and a timeout means packets were dropped, often by a NetworkPolicy."
      - "kube-proxy refuses connections to a Service with no ready endpoints, so an empty `kubectl get endpointslices -l kubernetes.io/service-name=<name>` means a selector or readiness problem."
      - "Connecting to a Pod's IP address and `targetPort` directly skips the Service: if that works while the cluster IP fails, the Service's selector or ports are wrong."
      - "NetworkPolicies select Pods by label, so a test from your own Pod proves little; `kubectl debug` adds a temporary container with tools to the failing Pod, sharing its network and its policies."
      - "`network-debug.sh` breaks `echo-ip` three ways in `network-lessons`, with a selector typo, a wrong `targetPort` and an egress policy without DNS, and finds each one with these steps."
      misconceptions:
      - "Seniors often assume a timeout and `connection refused` from a Service mean the same failure."
      - "Seniors often assume a test from any Pod shows what the failing Pod experiences."
      - "Seniors often assume a Service with no matching Pods accepts connections and then hangs."
      depth_notes: "Không dạy tcpdump, đọc iptables/conntrack chi tiết, `kubectl debug node`, image công cụ mạng ngoài versions.yaml, service mesh (GĐ4). Không dạy lại refused/timeout của TCP — foundation.l1.tcp-vs-udp."
  - id: bare-metal
    title:
      vi: "Cluster trên máy tự vận hành: địa chỉ, điểm vào và lưu trữ"
      en: "Clusters on your own machines: addresses, entry points and storage"
    stage: 3
    summary:
      vi: "Cấp địa chỉ thật cho LoadBalancer Service bằng MetalLB ở layer 2 và hiểu failover của nó, giữ IP client khi cần, chạy điểm vào và control plane sống qua việc mất một node, và biết lưu trữ nhân bản giữa node đổi được gì so với volume của kind."
      en: "Give LoadBalancer Services real addresses with MetalLB in layer 2 mode and understand its failover, keep client addresses when needed, keep the entry point and the control plane running when a node fails, and know what storage replicated across nodes changes compared with kind's volumes."
    lessons:
    - id: k8s.l3.clusters-without-a-cloud
      title:
        vi: "Không có cloud thì không ai cấp địa chỉ ngoài hay ổ đĩa mạng"
        en: "Without a cloud, nobody hands out outside addresses or network disks"
      main_path: true
      duration_min: 12
      skills: [k8s.bare-metal.load-balancing, k8s.bare-metal.replicated-storage]
      prereqs: [k8s.l3.service-types, k8s.l2.storage-classes, k8s.l3.cni-plugins]
      related: [k8s.l2.database-in-the-cluster, k8s.l1.cluster-nodes-and-control-plane]
      vocab: [bare-metal-cluster]
      example_tag: stage-3
      example_files: [deploy/k8s/kind-config.yaml, deploy/k8s/lessons/echo-loadbalancer.yaml]
      outline:
      - "On a cloud, the provider's own controller gives each LoadBalancer Service an outside address, and its storage service creates disks that a Pod can take with it to another node."
      - "A bare-metal cluster runs on machines you run yourself, physical or virtual, without that provider: neither job is done until you install components that do it inside the cluster."
      - "kind shows both gaps: `echo-loadbalancer` stays `<pending>`, and a `standard` volume stays on the node that created it, the limits met in k8s.l3.service-types and k8s.l2.storage-classes."
      - "kind's node containers share one Docker network named `kind`, which plays the part of the network your own machines would share; the components in this module work on that network."
      - "Whatever replaces the cloud's part becomes your team's to run: its upgrades, its failures and its capacity, next to the cluster's own."
      misconceptions:
      - "Seniors often assume Kubernetes itself hands out outside addresses and network disks, and a cloud only supplies the machines."
      - "Seniors often assume LoadBalancer Services cannot be used at all outside a cloud."
      - "Seniors often assume a cluster that works on a cloud behaves the same when moved to a bank's own machines."
      depth_notes: "Không dạy dựng cluster bằng kubeadm hay distro nhẹ, nâng cấp node (k8s/operators-and-cluster-lifecycle), managed vs tự vận hành (GĐ4), nêu tên dịch vụ cloud. Bài chỉ nêu khoảng trống; từng thành phần — các bài sau."
    - id: k8s.l3.metallb-address-pools
      title:
        vi: "MetalLB cấp địa chỉ cho LoadBalancer Service từ dải bạn giữ"
        en: "MetalLB gives LoadBalancer Services addresses from a pool you own"
      main_path: true
      duration_min: 14
      skills: [k8s.bare-metal.load-balancing]
      prereqs: [k8s.l3.clusters-without-a-cloud, k8s.l3.service-types, devops.l1.docker-networks]
      related: [k8s.l2.ingress, foundation.l1.ip-and-ports]
      vocab: [metallb]
      example_tag: stage-3
      example_files:
      - scripts/k8s/metallb-install.sh
      - deploy/k8s/lessons/metallb-pool.yaml
      - scripts/k8s/metallb-pool.sh
      outline:
      - "MetalLB runs inside the cluster as a controller, which picks an address for each LoadBalancer Service, and a speaker Pod on every node, which makes the network deliver that address to a node."
      - "`metallb-install.sh` applies a pinned copy of the manifest MetalLB's project publishes and waits until the controller and every speaker are ready."
      - "An `IPAddressPool` lists the addresses MetalLB may hand out; they must sit on the nodes' own network and be used by nothing else, which on a real network means reserving them."
      - "`metallb-pool.sh` fills `metallb-pool.yaml` with a range from the subnet of Docker's `kind` network and applies it with an `L2Advertisement` naming the pool, which tells the speakers to announce it."
      - "With the pool in place, `echo-loadbalancer` gets an `EXTERNAL-IP` from it instead of `<pending>`, and keeps its cluster IP and its node port."
      - "Docker Desktop does not route your machine to the `kind` network, so the script calls that address from a container attached to it; on a real network, any machine on it could."
      misconceptions:
      - "Seniors often assume MetalLB is a load balancer that every request passes through, like a cloud's."
      - "Seniors often assume MetalLB finds free addresses on the network by itself."
      - "Seniors often assume a LoadBalancer address is reachable from anywhere, like a public cloud address."
      depth_notes: "Không dạy nhiều pool và chọn pool theo annotation, IPv6, cài MetalLB qua Argo CD, Service chia sẻ một địa chỉ. Layer 2 và failover — bài sau. Staging giữ cổng publish ra host (k8s.l2.ingress), không cài MetalLB. Lab trên `donhang`."
    - id: k8s.l3.metallb-layer2-mode
      title:
        vi: "Ở layer 2, mọi traffic của một địa chỉ đi vào qua đúng một node"
        en: "In layer 2 mode, one node receives all traffic for an address"
      main_path: true
      duration_min: 15
      skills: [k8s.bare-metal.load-balancing]
      prereqs: [k8s.l3.metallb-address-pools, k8s.l3.kube-proxy]
      related: [k8s.l3.pod-network-model, backend.l3.graceful-degradation]
      vocab: [arp, failover]
      example_tag: stage-3
      example_files: [scripts/k8s/metallb-l2.sh]
      outline:
      - "On one network, a machine finds who holds an IP address with ARP: it asks every machine on the network, and the holder answers with its hardware (MAC) address, where traffic is then sent."
      - "In layer 2 mode the speakers choose one node per Service address, and only that node's speaker answers ARP for it; the address is set on no network card."
      - "All traffic to the address enters through that node, and kube-proxy there forwards each connection to a Pod on any node, so load spreads over Pods but never over several nodes' network links."
      - "`metallb-l2.sh` shows which node announces `echo-loadbalancer`'s address and the hardware address a client container learned for it, then pauses that node's container."
      - "The other speakers notice the node has stopped answering and another node takes over the address; connections fail until it does, which makes layer 2 mode a failover, not load balancing."
      - "MetalLB's other mode announces addresses to the network's routers, which can spread traffic over several nodes; the lab has no such router, so the module uses layer 2 mode only."
      misconceptions:
      - "Seniors often assume layer 2 mode spreads incoming traffic across all the nodes."
      - "Seniors often assume the address moves to another node instantly, with no failed connections."
      - "Seniors often assume MetalLB adds the address to a network card of the chosen node."
      depth_notes: "Không dạy mode dùng router và cấu hình router, IPv6, chỉnh thời gian phát hiện node chết, giới hạn node announce theo selector, chế độ IPVS của kube-proxy. externalTrafficPolicy — bài sau. Node lỗi giả lập bằng `docker pause`."
    - id: k8s.l3.external-traffic-policy
      title:
        vi: "externalTrafficPolicy: Local giữ IP client nhưng bỏ qua node không có Pod"
        en: "externalTrafficPolicy: Local keeps client IPs but skips some nodes"
      main_path: true
      duration_min: 14
      skills: [k8s.bare-metal.load-balancing]
      prereqs: [k8s.l3.metallb-layer2-mode, k8s.l3.pod-network-model]
      related: [backend.l3.rate-limiting, backend.l1.structured-logging]
      vocab: [external-traffic-policy]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/echo-loadbalancer.yaml
      - deploy/k8s/lessons/echo-loadbalancer-local.yaml
      - scripts/k8s/external-traffic-policy.sh
      outline:
      - "With the default `externalTrafficPolicy: Cluster`, the receiving node may forward outside traffic to a Pod on another node and replaces the source address with its own, so `echo-ip` reports a node's address."
      - "With `externalTrafficPolicy: Local`, a node sends outside traffic only to the Service's Pods on that same node and keeps the source address, so `echo-ip` reports the client container's address."
      - "A node with no ready Pod of a `Local` Service has nowhere to send its traffic, so MetalLB's speakers announce the address only from nodes that run a ready Pod of it."
      - "`external-traffic-policy.sh` calls `echo-loadbalancer` and `echo-loadbalancer-local` from the client container and prints the address `echo-ip` reports for each."
      - "With `Local` in layer 2 mode only the Pods on the announcing node get traffic, so a Service whose Pods run on several nodes no longer spreads its load over all of them."
      - "Choose `Local` when the application must see clients' addresses, such as for logs or limits per client, and run Pods on several nodes; otherwise `Cluster` spreads load more evenly."
      misconceptions:
      - "Seniors often assume Pods always see the real address of a client outside the cluster."
      - "Seniors often assume `Local` only makes traffic faster, with no downside."
      - "Seniors often assume any node can still accept traffic for a `Local` Service, even with none of its Pods."
      depth_notes: "Không dạy internalTrafficPolicy, healthCheckNodePort, header X-Forwarded-For và PROXY protocol ở gateway, topology-aware routing. Lab trên `donhang`, namespace `network-lessons`. Không dạy lại kube-proxy — k8s.l3.kube-proxy."
    - id: k8s.l3.highly-available-entry-point
      title:
        vi: "Điểm vào sống qua việc mất một node chỉ khi có bản sao ở node khác"
        en: "The entry point survives a node failure only with replicas elsewhere"
      main_path: true
      duration_min: 15
      skills: [k8s.bare-metal.high-availability]
      prereqs: [k8s.l3.external-traffic-policy, k8s.l2.ingress, k8s.l2.helm-releases, k8s.l1.deployments]
      related: [k8s.l2.charts-through-argo-cd, k8s.l2.gateway-api, backend.l3.graceful-degradation]
      vocab: [single-point-of-failure, high-availability, topology-spread-constraint]
      example_tag: stage-3
      example_files:
      - deploy/k8s/lessons/traefik-ha-values.yaml
      - deploy/k8s/lessons/echo-ingress.yaml
      - scripts/k8s/traefik-ha.sh
      outline:
      - "A single point of failure is a part whose failure alone stops the system: behind MetalLB, an Ingress controller with one Pod is one, since losing its node stops all outside traffic."
      - "High availability means removing such parts: here, two or more controller Pods on different nodes behind one address that layer 2 mode moves when a node fails."
      - "A Deployment with two replicas may place both on one node; a topology spread constraint on `kubernetes.io/hostname` with `maxSkew: 1` and `DoNotSchedule` keeps them on different nodes."
      - "`traefik-ha.sh` installs Traefik on `donhang` from the chart version staging pins, with `traefik-ha-values.yaml`: two spread replicas and a LoadBalancer Service, then applies `echo-ingress.yaml`."
      - "The script pauses one worker while calling the address in a loop: some calls fail until MetalLB moves the address and the control plane marks that node's Pods not ready, then all succeed."
      - "Each replica must carry the whole load alone while the other is down, so its resource requests are sized for all the traffic, not for half of it."
      misconceptions:
      - "Seniors often assume a Deployment with two replicas always runs them on two different nodes."
      - "Seniors often assume a highly available entry point means no request fails when a node dies."
      - "Seniors often assume MetalLB alone makes the entry point highly available."
      depth_notes: "Không dạy PodDisruptionBudget và drain node (k8s/operators-and-cluster-lifecycle), pod anti-affinity, taint, HPA, nhiều zone. Staging một node giữ một replica Traefik; không sửa `apps/traefik.yaml`. Không dạy lại Ingress — k8s.l2.ingress."
    - id: k8s.l3.csi-drivers
      title:
        vi: "CSI driver cho một hệ lưu trữ cắm vào mọi cluster Kubernetes"
        en: "A CSI driver lets a storage system plug into any cluster"
      main_path: true
      duration_min: 13
      skills: [k8s.bare-metal.replicated-storage]
      prereqs: [k8s.l3.clusters-without-a-cloud, k8s.l2.storage-classes, k8s.l2.scheduled-backups]
      related: [k8s.l2.reclaim-policy, k8s.l3.cni-plugins]
      vocab: [csi-driver, volume-snapshot]
      example_tag: stage-3
      example_files: [scripts/k8s/csi.sh]
      outline:
      - "The Container Storage Interface (CSI) is the standard way for a storage system to plug into Kubernetes: its vendor ships a CSI driver, and any cluster can use it without changing Kubernetes."
      - "A CSI driver runs as Pods in the cluster: a controller part creates and deletes volumes in the storage system, and a part on every node makes them available to the Pods there."
      - "A StorageClass names its driver as `provisioner`; `csi.sh` shows that kind's `standard` uses `rancher.io/local-path`, which is not a CSI driver, and that `kubectl get csidrivers` lists none."
      - "A replicated storage system for your own machines, read in the next lesson, installs its own CSI driver and a StorageClass naming it; claims then ask for it as they asked for `standard`."
      - "Where a CSI driver supports it, a volume snapshot records a volume's content at one moment and can fill a new claim; it stays in the same storage system, so it is not a backup off the cluster."
      misconceptions:
      - "Seniors often assume every StorageClass provisioner is a CSI driver."
      - "Seniors often assume a volume snapshot is as good as a backup."
      - "Seniors often assume adding a new storage system means changing or rebuilding Kubernetes."
      depth_notes: "Không dạy viết CSI driver, sidecar CSI, VolumeSnapshotClass và cài snapshot controller, mở rộng volume, volume CSI tạm. Lab chỉ chạy `csi.sh` trên kind; hệ lưu trữ cụ thể — bài sau. Rook-Ceph không dạy (chưa có trong versions.yaml)."
    - id: k8s.l3.replicated-volumes
      title:
        vi: "Longhorn giữ bản sao của mỗi volume trên nhiều node"
        en: "Longhorn keeps copies of each volume on several nodes"
      main_path: true
      duration_min: 14
      skills: [k8s.bare-metal.replicated-storage]
      prereqs: [k8s.l3.csi-drivers, k8s.l2.database-in-the-cluster, backend.l3.read-replicas]
      related: [k8s.l2.statefulsets, k8s.l2.staging-keeps-its-data, devops.l3.rpo-and-rto]
      vocab: [longhorn]
      example_tag: stage-3
      example_files: [deploy/k8s/bare-metal/longhorn-storageclass.yaml]
      outline:
      - "Longhorn turns disk space on the cluster's own nodes into volumes; each volume keeps a copy, called a replica, on several nodes, as many as `numberOfReplicas` in its StorageClass says."
      - "A write goes to every healthy replica over the network before it counts as done, so a volume survives losing a node, at the cost of slower writes than a local disk."
      - "When a Pod's node fails, the Pod can start on another node and use the same volume there, which kind's `standard` class cannot do; Longhorn then rebuilds the missing replica on a healthy node."
      - "Longhorn needs software installed on every node, an iSCSI initiator for its default data engine, which the lab's kind nodes lack, so this lesson reads `longhorn-storageclass.yaml` without installing it."
      - "A PostgreSQL that already streams its changes to a standby gains little from replicated volumes underneath; they fit stores that keep one copy, like Đơn Hàng's `db` and `rabbitmq` claims."
      - "All replicas live in the same cluster: deleting the volume, a bad write or losing the cluster reaches every copy, so backups off the cluster are still needed."
      misconceptions:
      - "Seniors often assume a replicated volume makes backups unnecessary."
      - "Seniors often assume a volume replicated over the network writes as fast as a local disk."
      - "Seniors often assume a database with its own replication should also sit on replicated volumes."
      depth_notes: "Không cài Longhorn trong lab (chỉ đọc manifest), không dạy UI, backup target, data locality, data engine v2, ReadWriteMany, Rook-Ceph. Staging vẫn dùng `standard`. Không dạy lại StatefulSet — k8s.l2.statefulsets."
    - id: k8s.l3.control-plane-ha
      title:
        vi: "Control plane HA cần quá nửa số member etcd còn sống"
        en: "A highly available control plane needs a majority of etcd members"
      main_path: true
      duration_min: 15
      skills: [k8s.bare-metal.high-availability]
      prereqs:
      - k8s.l3.highly-available-entry-point
      - k8s.l1.control-plane-components
      - k8s.l1.kubectl-and-the-api-server
      - k8s.l3.service-types
      related: [k8s.l3.metallb-layer2-mode, k8s.l1.cluster-nodes-and-control-plane]
      vocab: [etcd-quorum]
      example_tag: stage-3
      example_files: [deploy/k8s/kind-ha-config.yaml, scripts/k8s/control-plane-ha.sh]
      outline:
      - "With its only control-plane node paused, a cluster keeps running its Pods but nothing can change: `control-plane-ha.sh` shows `kubectl` failing while `echo-ip` still answers on its node port."
      - "A highly available control plane runs the API server, etcd and the other control-plane components on several nodes; kind builds one with three from `kind-ha-config.yaml`, as the cluster `donhang-ha`."
      - "Clients reach the API servers through one address in front of them: kind adds a load balancer container and writes its address into the kubeconfig; on your own machines you provide that address."
      - "etcd accepts a change only once a quorum, a majority of its members, has it; with one of three control-plane nodes paused, `kubectl get nodes` still works."
      - "Pausing a second control-plane node leaves no majority, and `kubectl` requests fail even though one API server is still running."
      - "Four members need three for a majority, so they survive only one failure, as three do; this is why control planes run an odd number of nodes."
      misconceptions:
      - "Seniors often assume the applications stop when the control plane goes down."
      - "Seniors often assume the control plane keeps working as long as any one API server is up."
      - "Seniors often assume four control-plane nodes survive more failures than three."
      depth_notes: "Không dạy dựng control plane bằng kubeadm, thêm/bớt member etcd, backup/restore etcd, nâng cấp (k8s/operators-and-cluster-lifecycle), etcd tách khỏi control plane, công cụ địa chỉ ảo cho API server. Script xóa `donhang-ha` ở cuối."
