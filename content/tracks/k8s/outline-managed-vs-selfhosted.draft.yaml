    need: "`docs/design/cluster-migration-plan.md` chỉ kế hoạch (tiếng Việt, `### `): dựng cluster managed cạnh cluster cũ, Argo CD đồng bộ từ config repo, không mang etcd snapshot; bảng thứ khác nhau theo cluster kèm file phải sửa (SealedSecret niêm lại, tên StorageClass, địa chỉ Gateway); dữ liệu: base backup + WAL, dừng ghi ngắn, xả queue RabbitMQ, đổi traffic; giữ cluster cũ để quay lại; thành phần tự chạy giữ nguyên, đổi sang managed sau, mỗi release một thứ; diễn tập trên staging để đo thời gian; thời gian ghi \"giả định\"."
    suggested_path: "docs/design/cluster-migration-plan.md"
  - lesson: k8s.l4.cluster-review-checklist
    need: "`docs/design/cluster-review-checklist.md` (tiếng Việt, `### `): nhóm câu hỏi workload và tài nguyên / cô lập và quyền / dữ liệu và sao lưu / nâng cấp và add-on / chi phí / cách thay đổi tới cluster; mỗi câu trỏ phép kiểm (admission policy digest, nhãn Pod Security, kubeconform trong CI, template golden path) hoặc ADR (0019–0023); lỗi thường gặp viết thành câu hỏi; khi nào cần review; ví dụ mẫu: cho HPA scale api ở production (bỏ `replicas` khỏi Git, `maxReplicas` theo `max_connections` của `capacity-plan.md`, PodDisruptionBudget khi nâng cấp node) — chỉ là đề xuất, không đổi manifest. Viết sau ADR 0021–0023 và `backend-review-checklist.md`, trước `fitness-functions.md`."
