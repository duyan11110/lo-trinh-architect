open_questions:
  - "Khóa versions.yaml cho metrics-server: không có khóa nào hiện tại. Đề xuất chủ thêm `infra.metrics_server` (version = minor của bản manifest `/repo-stage 4` ghim; check `kubectl get deploy metrics-server -n kube-system -o jsonpath='{..image}'`; docs kho kubernetes-sigs/metrics-server). HPA và cluster autoscaler là phần của Kubernetes/khái niệm, đi theo khóa `kubernetes`. Phương án lùi nếu không thêm: bài HPA chỉ cho thấy target `<unknown>` và event thiếu metrics API, bỏ phần scale theo tải; `node-capacity.sh` vẫn chạy (dùng `minReplicas`, không cần metrics); bài chi phí chỉ so request với allocatable, bỏ cột mức dùng."
  - "Số ADR: đề xuất ADR 0022 = production chạy trên Kubernetes managed (từ chối máy riêng và multi-cloud), ADR 0023 = khóa ký hóa đơn trong dịch vụ HSM của nhà cung cấp (trả lời câu ADR 0015 để lại); ADR GĐ4 tiếp theo đánh từ 0024. `sysdesign/problems` (ký tài liệu ngân hàng) có thể chọn máy riêng/HSM riêng cho khách ngân hàng bằng điều kiện mở lại ghi trong 0022, không quyết lại 0022/0023."
  - "Lab: HPA và node-capacity chạy trên `donhang` (namespace `autoscale-lessons`); staging chỉ thêm metrics-server qua Argo CD, KHÔNG thêm HPA cho api (giữ 2 replica để capture canary/blue-green/capacity không đổi); ví dụ HPA cho api trong checklist chỉ là đề xuất trên giấy. kind không thêm node và không có KMS: cluster autoscaler và KMS v2 chỉ dạy bằng lời (claim kiểm bằng docs Kubernetes)."
  - "Chi phí telemetry / thiết kế theo chi phí (capacity-and-slo chuyển sang): ở đây chỉ là một đòn bẩy trong `cluster-cost.md`; chọn tỉ lệ trace sampling, thời gian giữ log/metric theo SLO → `sysdesign/problems`."
  - "Khoảng trống chấp nhận (không module nào dạy): VPA, PriorityClass/preemption, spot node, autoscaling theo sự kiện, Cluster API, Velero, developer portal. docs/00 xếp HPA ở L2 nhưng chưa bài nào dạy — dạy ở đây (L4)."
  - "Tên file, tên `cpu-echo`, namespace `autoscale-lessons` là đề xuất; `/repo-stage 4` đổi thì sửa `example_files` trước khi sinh bài. Capture `autoscale.sh`/`node-capacity.sh`/`requests-vs-usage.sh` khác outline → DỪNG sửa outline, không đổi giới hạn `Program.cs` hay request của staging."
