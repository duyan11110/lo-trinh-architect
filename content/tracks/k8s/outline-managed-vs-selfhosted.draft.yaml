repo_changes_needed:
  - lesson: k8s.l4.horizontal-pod-autoscaler
    need: "metrics-server cho cluster `donhang`: bản manifest phát hành chính thức ghim đúng phiên bản (khóa `metrics_server` mới, xem open_questions) kèm cờ cần để đọc kubelet của kind, có comment ghi rõ cờ đó chỉ dành cho lab; script cài trên host áp manifest, chờ Deployment `Available`, in `kubectl top nodes`."
    suggested_path: "deploy/metrics-server/components.yaml, scripts/k8s/metrics-server-install.sh"
  - lesson: k8s.l4.horizontal-pod-autoscaler
    need: "Namespace `autoscale-lessons` trên `donhang`: Deployment + Service `cpu-echo` (chỉ dùng image đã ghim trong repo, CPU request nhỏ, mức CPU dùng tăng theo số request gửi tới); HPA `autoscaling/v2` cho `cpu-echo` (min 1, CPU 50% của request, `behavior.scaleDown.stabilizationWindowSeconds: 30`); `autoscale.sh` chạy trên host: gửi tải từ một Pod trong cluster, in `kubectl get hpa` tới khi replicas > 1, dừng tải, đợi về 1, in event `SuccessfulRescale`. Capture khác outline (không tăng hoặc không giảm) → DỪNG sửa outline."
    suggested_path: "deploy/k8s/lessons/cpu-echo.yaml, deploy/k8s/lessons/cpu-echo-hpa.yaml, scripts/k8s/autoscale.sh"
  - lesson: k8s.l4.node-autoscaling
    need: "`node-capacity.sh` trên `donhang`: đặt request CPU của `cpu-echo` thành một phần lớn allocatable của worker (script tính từ node) rồi nâng `minReplicas` của HPA để tổng request vượt hai worker; in số Pod Running/Pending (không phụ thuộc số CPU của máy học viên) và event `FailedScheduling` của một Pod Pending; khôi phục và xóa namespace ở cuối."
    suggested_path: "scripts/k8s/node-capacity.sh"
  - lesson: k8s.l4.requests-drive-cluster-cost
    need: "metrics-server trên `donhang-staging` qua Argo CD: Application `apps/metrics-server.yaml` trỏ `platform/metrics-server/` (cùng manifest ghim với `deploy/metrics-server/components.yaml`), áp như các Application platform khác; `requests-vs-usage.sh` chạy trên host chỉ đọc: mỗi Pod request CPU/memory cạnh mức dùng hiện tại, node allocatable cạnh tổng request; mức dùng in theo nhóm ổn định giữa các lần chạy (vd dưới 1/4 request, 1/4–1, vượt request). Đo RAM, ghi vào STAGE.md."
    suggested_path: "deploy/gitops/config-repo/apps/metrics-server.yaml, deploy/gitops/config-repo/platform/metrics-server/kustomization.yaml, scripts/k8s/requests-vs-usage.sh"
  - lesson: k8s.l4.requests-drive-cluster-cost
    need: "`docs/design/cluster-cost.md` (tiếng Việt, mục `### `, không `## `/`**`): mô hình chi phí bằng số node và giờ công, số ghi \"giả định\", không tiền thật; bảng request đang đặt và mức dùng đo được của từng workload staging với request đề xuất (không đổi manifest); phần nền tảng cố định mỗi cluster (Argo CD, Git server, Traefik, Sealed Secrets, Prometheus, metrics-server); đòn bẩy: request, `minReplicas` của HPA, môi trường tắt ngoài giờ, thời gian giữ telemetry và tỉ lệ sampling (chi tiết để sysdesign/problems)."
    suggested_path: "docs/design/cluster-cost.md"
  - lesson: k8s.l4.choosing-managed-kubernetes
    need: "`docs/adr/0022-production-tren-kubernetes-managed.md` + dòng trong `docs/adr/README.md` (Đã chấp nhận; 3 phương án: máy riêng với kubeadm, MetalLB, Longhorn / Kubernetes managed của một nhà cung cấp / multi-cloud hai nhà cung cấp; bảng giờ công và phí ghi \"giả định\"; chọn managed; liệt kê chỗ gắn với nhà cung cấp: StorageClass, load balancer của Gateway, key service, mã OpenTofu của cluster; cái chuyển nguyên: manifest, Kustomize, Argo CD; điều kiện mở lại: hợp đồng đòi máy riêng hoặc dữ liệu ở nơi xác định, phí vượt giả định; không tên nhà cung cấp; database và các thành phần khác giữ theo `self-run-components.md`; không code cluster managed)."
    suggested_path: "docs/adr/0022-production-tren-kubernetes-managed.md"
  - lesson: k8s.l4.keys-stay-in-the-key-service
    need: "`docs/adr/0023-khoa-ky-hoa-don-trong-hsm-cua-nha-cung-cap.md` + dòng README ADR + một dòng trỏ tới ADR 0023 trong ADR 0015 ở chỗ nói HSM chạy ở đâu (Đã chấp nhận; phương án: HSM riêng / dịch vụ HSM của nhà cung cấp / khóa phần mềm trong key service; chọn dịch vụ HSM; chỉ ServiceAccount của Payments được phép ký; hệ quả khi rời nhà cung cấp: khóa và chứng chỉ mới, hóa đơn cũ vẫn kiểm bằng public key; Secrets của cluster mã hóa bằng khóa của key service; không tên sản phẩm)."
    suggested_path: "docs/adr/0023-khoa-ky-hoa-don-trong-hsm-cua-nha-cung-cap.md"
