  modules:
  - id: team-basics
    title:
      vi: "Làm việc trong một team phần mềm"
      en: "Working in a software team"
    stage: 0
    summary:
      vi: "Hiểu vì sao team làm việc theo sprint, story là gì, 'xong' nghĩa là gì, và cách nhận/cho code review, họp hiệu quả."
      en: "Understand why teams work in sprints, what a story is, what 'done' means, and how to give and receive code review and run useful meetings."
    lessons:
    - id: management.l1.how-software-gets-made
      title:
        vi: "Phần mềm được làm ra như thế nào: từ ý tưởng đến người dùng"
        en: "How software gets made: from idea to user"
      main_path: true
      duration_min: 10
      skills: [management.process.sdlc]
      prereqs: []
      related: [devops.l1.what-is-deploy]
      vocab: []
      example_tag: stage-0
      example_files: [docs/team/lifecycle-example.md]
      outline:
      - "Every piece of software goes through gathering needs, designing, building, testing, releasing and operating, whatever the method is called."
      - "Methods differ in how big each loop is: a waterfall does each step once for everything; iterative methods do all steps for a small slice, repeatedly."
      - "Small loops reduce the cost of being wrong, which is the whole argument for agile methods, not 'less documentation'."
      - "As a junior you mostly see build and test; knowing the other steps exist tells you where your task came from and where it goes."
      misconceptions: ["Agile means no planning and no documents.", "Testing is a phase after development."]
      depth_notes: "Không đi vào Scrum chi tiết — bài sau. Không nói về DevOps culture — devops L4."
    - id: management.l1.scrum-from-junior-seat
      title:
        vi: "Scrum nhìn từ ghế junior"
        en: "Scrum from the junior's seat"
      main_path: true
      duration_min: 12
      skills: [management.process.scrum]
      prereqs: [management.l1.how-software-gets-made]
      related: []
      vocab: [sprint]
      example_tag: stage-0
      example_files: [docs/team/sprint-example.md]
      outline:
      - "A sprint is a fixed time box in which the team commits to a goal and delivers a usable increment; the length does not change to fit the work."
      - "Three roles (product owner, scrum master, developers), five events (sprint, planning, daily, review, retrospective) and three artifacts (product backlog, sprint backlog, increment) — and what each one asks of you specifically."
      - "The daily is for the team to re-plan the day, not to report to a manager; say what is blocked, not what you did."
      - "Most teams run a modified Scrum; knowing the reference version lets you tell a sensible adaptation from a broken one."
      misconceptions: ["The daily standup is where I prove I worked yesterday.", "The scrum master is my manager."]
      depth_notes: "Không nói về scaling frameworks, Kanban chi tiết (nhắc một câu)."
    - id: management.l1.user-story-and-ac
      title:
        vi: "User story, tiêu chí chấp nhận và Definition of Done"
        en: "User stories, acceptance criteria and the Definition of Done"
      main_path: true
      duration_min: 12
      skills: [management.process.stories]
      prereqs: [management.l1.scrum-from-junior-seat]
      related: [foundation.l2.writing-bug-reports, design.l1.unit-test-first-look]
      vocab: [user-story, acceptance-criteria, definition-of-done]
      example_tag: stage-0
      example_files: [docs/team/story-example.md]
      outline:
      - "A user story states who wants what and why, in one sentence; it is a promise of a conversation, not a specification."
      - "Acceptance criteria are checkable statements that make the story testable; a story without them cannot be estimated or finished."
      - "Definition of Done is the team's shared checklist for every story (reviewed, tested, deployed to an environment…); 'works on my machine' fails it."
      - "When a story is unclear, the junior's job is to ask for the criteria before coding, not to guess and hope."
      misconceptions:
      - "A story is done when my code works."
      - "Acceptance criteria are written by testers after development."
      depth_notes: "Không nói về ước lượng story point — bài sau (GĐ1)."
    - id: management.l1.code-review-basics
      title:
        vi: "Code review: nhận và cho nhận xét"
        en: "Code review: receiving and giving feedback"
      main_path: true
      duration_min: 12
      skills: [management.process.review]
      prereqs: [foundation.l2.good-commits, foundation.l1.reading-code]
      related: [design.l1.solid-srp]
      vocab: [code-review, pull-request]
      example_tag: stage-0
      example_files: [docs/team/review-comments-examples.md]
      outline:
      - "A pull request proposes merging a branch; review is another person reading the diff to find defects, share knowledge and keep the codebase consistent."
      - "As the author: small PRs, a description that says why, respond to every comment, and separate 'fixed' from 'disagree, because'."
      - "As the reviewer: comment on the code not the person, ask questions before asserting, distinguish must-fix from suggestion, and approve when it is good enough, not perfect."
      - "Review is the fastest way a junior learns the team's standards; reading others' PRs is as valuable as receiving review."
      misconceptions:
      - "Many comments on my PR mean I did badly."
      - "As a junior I have nothing to say in reviewing a senior's code."
      depth_notes: "Không nói về review checklist kiến trúc — design L1/L2."
    - id: management.l1.meetings-and-communication
      title:
        vi: "Họp có ích và giao tiếp bằng văn bản"
        en: "Useful meetings and written communication"
      main_path: true
      duration_min: 10
      skills: [management.process.meetings]
      prereqs: [management.l1.scrum-from-junior-seat]
      related: [foundation.l2.asking-good-questions]
      vocab: []
      example_tag: stage-0
      example_files: [docs/team/meeting-notes-example.md]
      outline:
      - "A meeting needs a purpose, a decision or output, and someone writing it down; otherwise it is a conversation, which is fine but shorter."
      - "Written communication (chat, tickets, PR descriptions) outlives the meeting and is what the next person reads; write for them."
      - "Status updates state facts, blockers and next step in three lines; problems are raised early with options, not late with apologies."
      - "Disagreeing is expected; do it about the work, with a reason, and accept the decision once made."
      misconceptions:
      - "Juniors should stay quiet in meetings until asked."
      - "If I mention a problem, I will be blamed for it."
      depth_notes: "Không nói về stakeholder management, thuyết trình — management L2/L4."
  - id: stories-and-estimation
    title:
      vi: "Kanban và ước lượng cơ bản"
      en: "Kanban and basic estimation"
    stage: 1
    summary:
      vi: "So sánh được Kanban với Scrum đã biết, và ước lượng tương đối bằng story point thay vì đoán giờ."
      en: "Compare Kanban with the Scrum already known, and estimate relative size with story points instead of guessing hours."
    lessons:
    - id: management.l1.kanban-vs-scrum
      title:
        vi: "Kanban: dòng chảy liên tục, không sprint cố định"
        en: "Kanban: continuous flow, no fixed sprint"
      main_path: true
      duration_min: 12
      skills: [management.process.kanban]
      prereqs: [management.l1.scrum-from-junior-seat]
      related: []
      vocab: [kanban]
      example_tag: stage-1
      example_files: [docs/team/kanban-board-example.md]
      outline:
      - "Kanban tracks work as a continuous flow across board columns (To Do, In Progress, Done); unlike Scrum, it has no fixed-length sprint and no sprint goal — work moves whenever it's ready, not in a batch every two weeks."
      - "A Kanban board shows the current state of everything in progress at a glance; a Scrum board resets each sprint, and its story shows only that sprint's slice."
      - "Many teams run something in between — Scrum's roles and events with a Kanban-style board — because the two aren't mutually exclusive, just different defaults for when work moves."
      misconceptions:
      - "Kanban is just Scrum without a name for the roles."
      - "A team using a board with columns is automatically doing Kanban."
      depth_notes: "Không nói scaled Kanban hay class of service — ngoài phạm vi GĐ1. Chỉ so sánh cơ bản với Scrum đã biết."
    - id: management.l1.wip-limits
      title:
        vi: "WIP limit: cột đầy thì phải xong bớt trước"
        en: "WIP limits: a full column means finish something first"
      main_path: true
      duration_min: 12
      skills: [management.process.kanban]
      prereqs: [management.l1.kanban-vs-scrum]
      related: []
      vocab: [wip-limit]
      example_tag: stage-1
      example_files: [docs/team/kanban-board-example.md]
      outline:
      - "A WIP limit caps how many items can sit in one column (like 'In Progress') at once; once a column is full, nobody starts new work there until something moves out."
      - "A WIP limit forces finishing over starting: someone wanting to pick up new work when 'In Progress' is full has to help finish something already there instead."
      - "Work sitting half-done across many columns is not visible as a problem without a WIP limit; the limit turns 'too much in progress' into something the board itself shows."
      misconceptions:
      - "A WIP limit just slows the team down by capping how much work they can do."
      - "WIP limits are a suggestion, not something the board actually enforces by structure."
      depth_notes: "Không nói cumulative flow diagram hay đo lead time chi tiết — ngoài phạm vi GĐ1. Chỉ ý tưởng WIP limit."
    - id: management.l1.why-estimate
      title:
        vi: "Vì sao ước lượng: lập kế hoạch, không phải hứa hẹn"
        en: "Why estimate: for planning, not for a promise"
      main_path: true
      duration_min: 10
      skills: [management.process.estimation]
      prereqs: [management.l1.wip-limits, management.l1.user-story-and-ac]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: []
      outline:
      - "A team estimates so it can plan how much work reasonably fits in a sprint, or how long a larger piece of work will roughly take — not to produce a number someone else will hold it to exactly."
      - "An estimate is made with the information available before the work starts; it's expected to be wrong sometimes, in both directions, not a sign the team did something wrong."
      - "A story without an estimate can still be worked on, but a team can't plan a sprint's worth of stories without knowing roughly how big each one is relative to the others."
      misconceptions:
      - "The point of estimating is to give management an exact deadline to hold the team to."
      - "A good team's estimates are always right; being wrong means the estimate was done badly."
      depth_notes: "Không nói three-point estimation hay buffer — module planning-and-risk GĐ2. Chỉ vì sao ước lượng, chưa nói cách ước lượng."
    - id: management.l1.relative-estimation
      title:
        vi: "Story point: kích cỡ tương đối, không phải giờ"
        en: "Story points: relative size, not hours"
      main_path: true
      duration_min: 13
      skills: [management.process.estimation]
      prereqs: [management.l1.why-estimate]
      related: []
      vocab: [story-point]
      example_tag: stage-0
      example_files: [docs/team/sprint-example.md]
      outline:
      - "A story point estimates size relative to other stories, not hours or days: a story worth 3 points is expected to take roughly three times the effort of one worth 1, whatever 'effort' means to that team."
      - "Sprint 14's backlog (already seen) sizes each piece of work with a plain number in its 'Ước lượng' column — the Guide leaves it to a team to decide how the work itself gets written down, and story points are one common way teams do it."
      - "Comparing two stories' relative size — is this bigger than one I already know — is usually easier and more consistent than guessing either one's size in hours directly."
      misconceptions:
      - "A story point maps to a fixed number of hours, the same for every team."
      - "Story points are part of the Scrum Guide's own rules for how a Sprint Backlog must be estimated."
      depth_notes: "Không nói kỹ thuật ước lượng cụ thể (Planning Poker) — ngoài phạm vi GĐ1. Không nói velocity — module planning-and-risk GĐ2."
    - id: management.l1.estimates-are-not-commitments
      title:
        vi: "Ước lượng không phải cam kết"
        en: "An estimate is not a commitment"
      main_path: true
      duration_min: 11
      skills: [management.process.estimation]
      prereqs: [management.l1.relative-estimation]
      related: []
      vocab: []
      example_tag: stage-0
      example_files: [docs/team/sprint-example.md]
      outline:
      - "Sprint 14's 'Ngừng gửi thông báo' item, estimated at 2 points, carried into the next sprint unfinished — the estimate wasn't wrong because of that; work sometimes takes longer than expected, and that's what not finishing means."
      - "Treating an estimate as a promise pushes people to pad later ones, or call something 'done' when it isn't — the retro's two-reader rule for anything over 3 points came from a real problem, not from doubting estimates."
      - "An estimate answers 'how big does this look before starting'; only the retrospective, after the work is actually done, can say how it compared to reality."
      misconceptions:
      - "An estimate a team gives becomes a deadline they're expected to hit."
      - "If an item doesn't finish in the sprint it was estimated for, the original estimate must have been wrong."
      depth_notes: "Không nói velocity hay buffer — module planning-and-risk GĐ2. Chỉ đúng một điểm: estimate không phải cam kết."
  - id: code-review
    title:
      vi: "Review một PR 300 dòng: tầng, phụ thuộc, test"
      en: "Reviewing a 300-line PR: layers, dependencies, tests"
    stage: 1
    summary:
      vi: "Đọc một PR thật của Đơn Hàng và nhận xét đúng về tầng sai chỗ, phụ thuộc chặt, và test thiếu — đúng cổng của Giai đoạn 1."
      en: "Read a real Đơn Hàng PR and comment correctly on misplaced layers, tight dependencies, and missing tests — the Giai đoạn 1 gate."
    lessons:
    - id: management.l1.reviewing-for-layers
      title:
        vi: "Code có nằm đúng tầng của nó không"
        en: "Is the code in the layer it belongs to"
      main_path: true
      duration_min: 13
      skills: [management.review.layers]
      prereqs: [management.l1.code-review-basics, design.l1.the-controller-layer]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/AuthController.cs, DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "Reviewing for layers means checking a diff's new code stayed where it belongs: a controller with a database query, or a service with an `Authorization` check, is a violation worth a comment even if it works."
      - "Business logic added to an endpoint instead of its service, or query logic added to a repository method instead of its service, breaks the one-reason-to-change guarantee the layered module built, quietly, one PR at a time."
      - "Catching a layer violation in review is cheaper than finding it later: at review time it's a comment, after merge it's logic other PRs may already build on."
      misconceptions:
      - "As long as a PR's tests pass, which layer the new code ended up in doesn't matter."
      - "Pointing out a layer violation in review is being pedantic if the code is otherwise correct."
      depth_notes: "Không nói lại nghi thức nhận xét (bắt buộc sửa/gợi ý/câu hỏi) — đã dạy đủ ở code-review-basics. Chỉ tiêu chí 'đúng tầng'."
    - id: management.l1.reviewing-for-dependencies
      title:
        vi: "Class này phụ thuộc gì, và phụ thuộc thế nào"
        en: "What does this class depend on, and how"
      main_path: true
      duration_min: 13
      skills: [management.review.dependencies]
      prereqs: [management.l1.reviewing-for-layers, design.l1.solid-dip]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Design/OrderNotifications.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Api/Controllers/AuthController.cs
      - DonHang.Api/Controllers/OrdersController.cs
      outline:
      - "Reviewing for dependencies means checking what a new class takes as a constructor parameter versus what it reaches for directly — a service creating its own repository undoes the dependency-injection module's whole point."
      - "A class added with many constructor parameters is worth a comment even without a rule against it — SRP predicts a class doing that much has more than one reason to change, and the constructor is where that shows up first."
      - "A PR that reaches into another module's internal details instead of its public interface is tightening a coupling review can catch before it spreads further."
      misconceptions:
      - "Counting constructor parameters is a style nitpick, not a real design concern."
      - "A dependency issue in new code isn't worth commenting on unless it's already causing a bug."
      depth_notes: "Không nói công cụ vẽ dependency graph tự động — ngoài phạm vi GĐ1. Chỉ đọc bằng mắt qua constructor và import."
    - id: management.l1.reviewing-for-tests
      title:
        vi: "Test này có thật sự kiểm hành vi mới không"
        en: "Does this test actually check the new behavior"
      main_path: true
      duration_min: 13
      skills: [management.review.tests]
      prereqs: [management.l1.reviewing-for-dependencies, design.l1.what-makes-a-good-unit-test]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - DonHang.Domain/OrderService.cs
      - DonHang.Tests/Services/OrderServiceTests.cs
      - docs/team/story-example.md
      outline:
      - "Reviewing for tests means checking that a PR's tests exercise its new behavior, not just that some test file changed — a test that never fails even when the new code is wrong isn't covering anything."
      - "New logic with no corresponding test, or a test that only repeats what a fake already returns, is worth asking about before the PR merges, not after a bug report."
      - "A test added for a fixed bug should fail against the old code and pass against the new one; without checking that, it might be passing for an unrelated reason."
      misconceptions:
      - "A PR that touches a test file has adequate test coverage for what it changed."
      - "Asking an author to add a test is optional feedback, less important than catching an actual bug."
      depth_notes: "Không nói code coverage percentage hay công cụ đo coverage — đã né ở what-makes-a-good-unit-test, giữ nguyên ở đây. Chỉ đọc test có thật sự kiểm đúng hành vi không."
    - id: management.l1.reading-a-300-line-pr
      title:
        vi: "Đọc một PR 300 dòng: đơn shipped bị hủy nhầm"
        en: "Reading a 300-line PR: a shipped order gets cancelled by mistake"
      main_path: true
      duration_min: 15
      skills: [management.review.synthesis]
      prereqs: [management.l1.reviewing-for-tests]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - docs/team/review-comments-examples.md
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Tests/Services/OrderServiceTests.cs
      outline:
      - "A large diff reads better in an order that isn't top-to-bottom by file: tests first (they say what the author believes the change should do), then the layer closest to the described behavior, then everything else."
      - "The order-cancellation PR — the one `review-comments-examples.md` already quoted a comment from — touches the controller, the service, and a test; reading it in that order surfaces the missing 'already shipped' check first."
      - "300 lines reviewed in fifteen minutes with no comments usually means skimming, not reading — the checklist from this module's earlier lessons is what turns a skim into an actual review."
      misconceptions:
      - "A bigger PR just needs more time spent reading top to bottom, in the order the diff shows it."
      - "Approving quickly is a sign of trusting the author, and asking questions is a sign of not trusting them."
      depth_notes: "Không nói tính năng công cụ review (draft PR, suggested changes) — ngoài phạm vi. Bài tổng hợp — không khái niệm mới, chỉ áp ba bài trước vào một PR thật."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: planning-and-risk
    title:
      vi: "Lập kế hoạch, rủi ro và bên liên quan"
      en: "Planning, risk and stakeholders"
    stage: 2
    summary:
      vi: "Dự báo một khối việc bằng khoảng velocity và ước lượng ba điểm, giữ buffer và phạm vi minh bạch, ghi rủi ro vào sổ và báo kế hoạch cho đúng người."
      en: "Forecast a body of work with a velocity range and three-point estimates, keep buffer and scope visible, log risks, and report the plan to the right people."
    lessons:
    - id: management.l2.velocity
      title:
        vi: "Velocity: số điểm đã xong mỗi sprint, không phải đã nhận"
        en: "Velocity: points finished per sprint, not points planned"
      main_path: true
      duration_min: 12
      skills: [management.planning.forecasting]
      prereqs: [management.l1.estimates-are-not-commitments]
      related: []
      vocab: [velocity]
      example_tag: stage-1
      example_files: [docs/team/sprint-example.md]
      outline:
      - "Velocity is the total story points of the items a team finished in one sprint; an item that did not meet the Definition of Done counts zero, however much of it was written."
      - "Sprint 14 planned 11 points but its velocity is 9: the 2-point 'Ngừng gửi thông báo' item was unfinished and carried over, so its points count in the sprint that finishes it."
      - "Velocity is not part of the Scrum Guide; it is a common practice teams add. The Guide says only that knowing past performance makes Developers more confident in their Sprint forecast."
      - "Velocity compares a team only with its own past: story points are relative to that team's stories, so two teams' velocities are measured in different units."
      misconceptions:
      - "Velocity counts every point we worked on during the sprint, finished or not."
      - "A team with a higher velocity than ours is simply more productive."
      - "Velocity is one of the things the Scrum Guide requires a team to track."
      depth_notes: "Chỉ định nghĩa velocity trên một sprint. Không dùng velocity để dự báo nhiều sprint — bài forecasting-with-velocity. Không dạy lại story point (relative-estimation GĐ1). Không burndown/burnup chart."
    - id: management.l2.forecasting-with-velocity
      title:
        vi: "Dự báo bằng một khoảng velocity, không phải một con số"
        en: "Forecasting with a velocity range, not a single number"
      main_path: true
      duration_min: 13
      skills: [management.planning.forecasting]
      prereqs: [management.l2.velocity]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [docs/team/velocity-history.md]
      outline:
      - "Velocity varies from sprint to sprint, so a forecast uses several recent sprints rather than the last one alone."
      - "Dividing the remaining points by the lowest and the highest velocity of recent sprints with the usual number of people gives a range of sprints; that range is a more honest answer to 'when' than any single date."
      - "When fewer people are available in the next sprint, for leave or other duties, the team selects less than its usual velocity instead of expecting the same number."
      - "A forecast is redone every sprint as velocity and the remaining work change; an old forecast kept unchanged turns quietly into a promise."
      misconceptions:
      - "Our average velocity times the number of sprints left gives the exact release date."
      - "If someone is on leave, the rest of the team should still hit the usual velocity."
      - "Once we give a forecast, changing it later means we planned badly."
      depth_notes: "Không nói dự báo xác suất (Monte Carlo), burnup chart, hay lead time/cycle time. Không release planning/roadmap — management L3 GĐ3. Việc chưa có lịch sử để so — bài three-point-estimation."
    - id: management.l2.three-point-estimation
      title:
        vi: "Ước lượng ba điểm cho việc đội chưa từng làm"
        en: "Three-point estimates for work the team has never done"
      main_path: true
      duration_min: 13
      skills: [management.planning.uncertainty]
      prereqs: [management.l2.forecasting-with-velocity]
      related: []
      vocab: [three-point-estimation]
      example_tag: stage-2
      example_files: [docs/team/refund-plan-example.md]
      outline:
      - "A three-point estimate gives an optimistic, a most likely and a pessimistic value for the same piece of work, instead of one number."
      - "The gap between the optimistic and the pessimistic value shows how uncertain the work is; a wide gap is information for planning, not a sign of a bad estimate."
      - "One common way to combine the three values is the weighted average (O + 4M + P) / 6, which leans toward the most likely value but moves toward a long pessimistic tail."
      - "In the refund plan, the team uses three points for the work it has no history to compare with, and story points for work similar to what it has already finished."
      misconceptions:
      - "The pessimistic value is just padding people add to protect themselves."
      - "Three-point estimation replaces story points for everything."
      - "The most likely value is the one we should give as the deadline."
      depth_notes: "Không dạy phân phối xác suất, độ lệch chuẩn hay đường găng (critical path). Không dạy lại vì sao ước lượng (why-estimate GĐ1). Cách giữ phần chênh lệch trong kế hoạch — bài schedule-buffer."
    - id: management.l2.schedule-buffer
      title:
        vi: "Buffer: một dòng thời gian dự phòng ai cũng thấy"
        en: "A schedule buffer is one visible line, not hidden padding"
      main_path: true
      duration_min: 12
      skills: [management.planning.uncertainty]
      prereqs: [management.l2.three-point-estimation]
      related: []
      vocab: [schedule-buffer]
      example_tag: stage-2
      example_files: [docs/team/refund-plan-example.md]
      outline:
      - "A schedule buffer is time added to a plan on purpose to absorb the uncertainty the estimates already show, written as its own line rather than spread inside each task."
      - "Padding hidden inside every task tends to get used up by that task; one shared buffer stays visible, so everyone can see how much of it the work has consumed."
      - "The refund plan sizes its buffer from the gap between the most likely and the pessimistic values, so wider uncertainty gets a bigger buffer."
      - "A buffer covers the uncertainty of the planned work; it is not room for new work, which changes the plan itself."
      misconceptions:
      - "Adding a buffer means the team doesn't trust its own estimates."
      - "It's safer to add a little extra time to each of my tasks than to show one buffer."
      - "If there is buffer left, we can use it to fit in the extra feature someone asked for."
      depth_notes: "Không dạy công thức buffer của một phương pháp cụ thể (critical chain) hay theo dõi fever chart. Công việc mới xin thêm vào kế hoạch — bài scope-change. Rủi ro cụ thể có tên — bài risk-register."
    - id: management.l2.scope-change
      title:
        vi: "Thêm việc thì phải đổi lại một thứ khác"
        en: "Adding work means giving something else up"
      main_path: true
      duration_min: 12
      skills: [management.planning.scope]
      prereqs: [management.l2.schedule-buffer, management.l1.meetings-and-communication]
      related: []
      vocab: [scope-creep]
      example_tag: stage-1
      example_files: [docs/team/meeting-notes-example.md, docs/team/lifecycle-example.md]
      outline:
      - "Scope is the set of work a plan covers; when work is added, something must give: another item moves out, the forecast moves, or the addition waits for a later plan."
      - "The 2020 Scrum Guide says no change is made that would endanger the Sprint Goal, while scope may be clarified and renegotiated with the Product Owner as more is learned."
      - "The meeting notes keep refunds out of the current sprint: the app offers no way to cancel a paid order, though the API's cancel endpoint still allows it, and refunds become a later story; a scope decision, with its reason."
      - "Scope creep is work added a little at a time without trading anything back; each addition looks cheap, and together they break the forecast."
      misconceptions:
      - "A small extra request is quicker to just do than to take to the product owner."
      - "In Scrum, nothing about the sprint's work may change once the sprint starts."
      - "Narrowing what a feature does is admitting the team failed."
      depth_notes: "Không nói hợp đồng, change request có phí hay SLA — management L3 GĐ3. Không nói tài liệu yêu cầu — module technical-writing. Không dạy lại sprint goal/Scrum (scrum-from-junior-seat GĐ0)."
    - id: management.l2.risk-register
      title:
        vi: "Sổ rủi ro: viết ra điều có thể làm hỏng kế hoạch"
        en: "A risk register writes down what could break the plan"
      main_path: true
      duration_min: 12
      skills: [management.planning.risk]
      prereqs: [management.l2.scope-change]
      related: []
      vocab: [risk-register]
      example_tag: stage-2
      example_files: [docs/team/risk-register-example.md]
      outline:
      - "A risk is something that has not happened yet and may not happen, but would hurt the plan if it did; a problem that has already happened is an issue to fix, not a risk."
      - "A risk register lists each risk with how likely it is, how much it would hurt, who watches it, and what the team will do about it."
      - "Rating likelihood and impact, even as low, medium or high, lets the team spend its attention on the few risks that are both likely and costly."
      - "The register is reviewed on a regular rhythm, such as each sprint planning; a list written once at the start and never opened again protects nothing."
      misconceptions:
      - "Writing risks down is pessimism; a good team just deals with problems when they come."
      - "Every risk on the list needs the same amount of attention."
      - "A delay we already have is a risk we should add to the register."
      depth_notes: "Chỉ sổ rủi ro và cách xếp hạng. Cách xử lý từng rủi ro — bài risk-responses. Không định lượng rủi ro bằng tiền hay mô phỏng; rủi ro vận hành hệ thống (incident) — devops L4 GĐ4."
    - id: management.l2.risk-responses
      title:
        vi: "Mỗi rủi ro cần một cách xử lý và một người theo dõi"
        en: "Every risk needs a response and an owner"
      main_path: true
      duration_min: 12
      skills: [management.planning.risk]
      prereqs: [management.l2.risk-register]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [docs/team/risk-register-example.md]
      outline:
      - "Common responses to a risk are avoiding it by changing the plan, reducing its likelihood or impact, transferring it to someone better placed to carry it, and accepting it."
      - "Accepting a risk is a valid response when reducing it costs more than it would hurt, provided the decision is written down rather than left unspoken."
      - "Each risk has one owner who watches for its warning sign; a risk everyone owns is a risk nobody checks."
      - "In the refund register, a response is concrete work, such as trying the payment gateway's test environment in the first week, not a wish like 'be careful'."
      misconceptions:
      - "Accepting a risk means we just ignore it."
      - "The team lead is the owner of every risk."
      - "'Be careful with X' counts as a response to a risk."
      depth_notes: "Không nói bảo hiểm, điều khoản hợp đồng chuyển rủi ro hay kế hoạch dự phòng thảm họa (DR) — L3/devops GĐ3. Không escalation theo khung quản lý dự án cụ thể."
    - id: management.l2.stakeholder-communication
      title:
        vi: "Cùng một kế hoạch, mỗi bên liên quan cần biết một phần khác"
        en: "One plan, different news for each stakeholder"
      main_path: true
      duration_min: 13
      skills: [management.communication.stakeholders]
      prereqs:
      - management.l2.risk-responses
      - management.l2.forecasting-with-velocity
      - management.l1.meetings-and-communication
      related: [management.l1.how-software-gets-made]
      vocab: [stakeholder]
      example_tag: stage-2
      example_files: [docs/team/stakeholder-update-example.md]
      outline:
      - "A stakeholder is anyone affected by the work or able to affect it, including people outside the team such as customer care, accounting, or the payment gateway's provider."
      - "Stakeholders care about different parts of one plan: customer care needs to know when calls will drop, accounting needs to know what changes in reconciliation."
      - "An update to stakeholders gives the forecast as a range, the risks that could move it, and what the team needs from them, in words they use rather than the team's."
      - "Stakeholders hear about a change to the forecast from the team, as soon as the team knows, rather than discovering it on the day of the old date."
      misconceptions:
      - "Talking to stakeholders is the product owner's job, not something a developer needs to think about."
      - "Stakeholders want as much detail as possible, so I send everyone the full sprint board."
      - "It's better to wait until we're sure the date slips before telling anyone."
      depth_notes: "Không dạy lại họp/cập nhật trạng thái ba dòng (meetings-and-communication GĐ0). Không thuyết trình cho lãnh đạo — management L4 GĐ4. Không viết tài liệu kỹ thuật — module technical-writing."
  - id: technical-writing
    title:
      vi: "Viết tài liệu kỹ thuật"
      en: "Technical writing"
    stage: 2
    summary:
      vi: "Viết tài liệu cho một người đọc cụ thể với kết luận ở đầu, giữ README và tài liệu cùng code, và viết tài liệu yêu cầu rồi design doc cho luồng hoàn tiền."
      en: "Write for a specific reader with the answer first, keep the README and other docs with the code, and write the requirements and a design doc for the refund flow."
    lessons:
    - id: management.l2.writing-for-a-reader
      title:
        vi: "Viết cho một người đọc cụ thể, cần làm một việc cụ thể"
        en: "Write for one reader who has one job to do"
      main_path: true
      duration_min: 12
      skills: [management.writing.basics]
      prereqs: [management.l2.stakeholder-communication, foundation.l2.reading-docs]
      related: [foundation.l2.asking-good-questions, foundation.l2.writing-bug-reports]
      vocab: []
      example_tag: stage-1
      example_files: [STAGE.md, DonHang.App/README.md]
      outline:
      - "A technical document is written for a named reader who must be able to do something after reading it; without that reader in mind, a document tends to list everything the writer knows."
      - "`STAGE.md` is written for someone preparing lessons: its last table maps each new place in the repository to what a lesson can learn from it."
      - "`DonHang.App/README.md` is still the text Flutter's project template generated: it says the folder is a new Flutter project and tells a reader nothing about this app."
      - "Before writing, state in one sentence who the reader is and what they should be able to do afterwards; content that does not serve that goes to another document or is cut."
      misconceptions:
      - "A good document covers everything about the topic, so no reader ever misses anything."
      - "Technical writing should use as many technical terms as possible, because that makes it precise."
      - "If the code is clean, nobody needs a document to understand it."
      depth_notes: "Chỉ người đọc và mục đích. Thứ tự trình bày — bài answer-first. Không dạy lại các dạng tài liệu khi đọc (reading-docs GĐ0) hay cập nhật cho bên liên quan (stakeholder-communication). Không dạy ngữ pháp tiếng Anh."
    - id: management.l2.answer-first
      title:
        vi: "Kết luận đặt ở đầu, lý do theo sau"
        en: "Put the answer first and the reasons after it"
      main_path: true
      duration_min: 12
      skills: [management.writing.basics]
      prereqs: [management.l2.writing-for-a-reader, management.l1.meetings-and-communication]
      related: [management.l2.stakeholder-communication]
      vocab: []
      example_tag: stage-1
      example_files: [docs/team/meeting-notes-example.md]
      outline:
      - "A busy reader may stop after the first lines, so a work document opens with its conclusion, decision or request, and the background and reasons follow."
      - "The meeting notes state their purpose at the top and the decision right after it; the reasons, the task table and the open question follow for whoever needs them."
      - "A heading that states something, such as 'Paid orders cannot be cancelled', helps a skimming reader more than a heading that only names a topic, such as 'Discussion'."
      - "Steps to follow go in a numbered list and options being compared go in a table, so the shape of the text matches the shape of the content."
      misconceptions:
      - "A document should build up the background first, so the conclusion makes sense when the reader reaches it."
      - "Starting with the decision makes it look as if we never considered anything else."
      - "Long paragraphs look more thorough than lists and tables."
      depth_notes: "Không dạy lại cập nhật trạng thái ba dòng (meetings-and-communication GĐ0). Không dạy quy tắc trình bày của một bộ style guide cụ thể hay cú pháp Markdown. Không vẽ sơ đồ."
    - id: management.l2.readme
      title:
        vi: "README trả lời: đây là gì, chạy thế nào, đọc gì tiếp"
        en: "A README answers what this is, how to run it, where to go next"
      main_path: true
      duration_min: 12
      skills: [management.writing.repo-docs]
      prereqs: [management.l2.answer-first, devops.l2.changelog]
      related: [backend.l2.openapi-contract]
      vocab: [readme]
      example_tag: stage-2
      example_files: [README.md, DonHang.App/README.md]
      outline:
      - "A README is the file at the top of a repository or folder that a newcomer opens first; it says what the project is, how to run it, and where to read next."
      - "Đơn Hàng's root `README.md` at stage-2 says what the system is in one paragraph, lists the prerequisites, and gives the one command that starts it, `scripts/up.sh`."
      - "Run instructions are exact commands to copy, checked from a fresh clone before merging; steps recalled from the author's own machine can miss something that machine already had."
      - "A README points to deeper documents instead of repeating them: the history is in `CHANGELOG.md`, the state of each tag in `STAGE.md`, the API contract in the OpenAPI document."
      - "`DonHang.App/README.md` is still the template text at stage-2: a README that nobody rewrote is a sign that no one decided who the folder's reader is."
      misconceptions:
      - "The project template already created a README, so that part is done."
      - "The README should explain everything about the project in one file."
      - "I can write the setup steps from memory; I did them once."
      depth_notes: "Không dạy cú pháp Markdown, huy hiệu (badge) hay giao diện của trang web lưu repository. Không dạy lại changelog (devops.l2.changelog) hay OpenAPI (backend.l2.openapi-contract). Giữ tài liệu đúng theo code — bài docs-as-code."
    - id: management.l2.docs-as-code
      title:
        vi: "Tài liệu đổi trong cùng pull request với code nó mô tả"
        en: "Docs change in the same pull request as the code they describe"
      main_path: true
      duration_min: 12
      skills: [management.writing.repo-docs]
      prereqs: [management.l2.readme, management.l1.code-review-basics, management.l1.user-story-and-ac]
      related: [management.l1.reviewing-for-tests]
      vocab: [docs-as-code]
      example_tag: stage-1
      example_files: [STAGE.md, docs/team/story-example.md]
      outline:
      - "Docs as code means keeping documents as plain-text files in the same repository as the code, changed through pull requests and reviewed the same way code is."
      - "A document changed in the same pull request as the behavior it describes stays true; one kept elsewhere and updated later drifts until readers stop trusting it."
      - "`STAGE.md` lives in the Đơn Hàng repository and is rewritten for each tag, including what changed since the previous tag, so each tag's code and its description travel together."
      - "The team's Definition of Done in `story-example.md` includes updating the API documentation, so a story whose docs were not updated is not done."
      - "A reviewer who sees a behavior change without a matching document change can ask for one, the same way they ask for a missing test."
      misconceptions:
      - "Documentation is written once the feature is finished."
      - "Documents belong in a wiki; the repository is only for code."
      - "An outdated document is still better than no document."
      depth_notes: "Không dạy công cụ sinh trang tài liệu hay kiểm tra tài liệu tự động trong CI. Không dạy lại code review (code-review-basics GĐ0) hay Definition of Done (user-story-and-ac GĐ0)."
    - id: management.l2.requirements-document
      title:
        vi: "Tài liệu yêu cầu: vấn đề, mục tiêu, ngoài phạm vi, yêu cầu"
        en: "A requirements document: problem, goals, out of scope, requirements"
      main_path: true
      duration_min: 13
      skills: [management.writing.requirements]
      prereqs: [management.l2.docs-as-code, management.l2.scope-change, management.l1.user-story-and-ac]
      related: [management.l2.risk-register]
      vocab: [requirements-document]
      example_tag: stage-2
      example_files: [docs/team/refund-requirements.md, docs/team/meeting-notes-example.md]
      outline:
      - "A requirements document describes what a piece of work must achieve before anyone designs how: the problem, the goals, what is out of scope, the requirements and the open questions."
      - "It holds what the stories of one feature share, such as the problem, the people affected and the limits, which no single user story has room for."
      - "The refund requirements start from the meeting notes' decision that paid orders cannot be cancelled in the app (the API's cancel endpoint still allows it), and list what is out of scope, such as partial refunds."
      - "Each requirement is a numbered, checkable statement of what the system must do, written like acceptance criteria, and names no class, table or endpoint."
      - "A question nobody can answer yet is written down with the person who will answer it, instead of being guessed."
      misconceptions:
      - "Agile teams use user stories, so they never need a requirements document."
      - "A requirements document should already say which tables and endpoints to use."
      - "What is out of scope is obvious, so it does not need writing down."
      depth_notes: "Chỉ yêu cầu về chức năng; yêu cầu về chất lượng — bài non-functional-requirements. Không dạy mẫu tài liệu của một chuẩn cụ thể, hợp đồng hay SLA (management L3 GĐ3). Không dạy lại user story/tiêu chí chấp nhận (GĐ0)."
    - id: management.l2.non-functional-requirements
      title:
        vi: "Yêu cầu phi chức năng: hệ thống phải tốt đến mức nào"
        en: "Non-functional requirements: how well the system must do it"
      main_path: true
      duration_min: 12
      skills: [management.writing.requirements]
      prereqs: [management.l2.requirements-document]
      related: [backend.l2.work-outside-the-request]
      vocab: [non-functional-requirement]
      example_tag: stage-2
      example_files: [docs/team/refund-requirements.md]
      outline:
      - "A non-functional requirement states how well the system must do something or under what limits, such as how fast it answers, what it does while a service it needs is down, or what it must keep."
      - "A non-functional requirement is useful only when it can be checked: 'refunds are fast' cannot be tested, while a stated time for a stated case can."
      - "The refund requirements ask that a customer's refund request is accepted even while the payment gateway is down, and that every refund is kept with who asked and when, for accounting."
      - "A non-functional requirement can rule out a design: accepting requests while the gateway is down rules out a design that must reach the gateway before answering the customer."
      misconceptions:
      - "Non-functional requirements are optional extras for after the features work."
      - "'The system must be fast and secure' is a good non-functional requirement."
      - "Non-functional requirements are for the operations team, not something developers write."
      depth_notes: "Không dạy danh mục thuộc tính chất lượng của một chuẩn, SLO/SLA (backend/capacity-and-slo GĐ4) hay đo hiệu năng. Chỉ viết yêu cầu sao cho kiểm tra được. Cách thiết kế đáp ứng — bài design-doc."
    - id: management.l2.design-doc
      title:
        vi: "Design doc: viết cách làm ra trước khi làm"
        en: "A design doc: write down how you will build it, before building"
      main_path: true
      duration_min: 14
      skills: [management.writing.design]
      prereqs:
      - management.l2.non-functional-requirements
      - backend.l2.retry-with-backoff
      - backend.l2.idempotent-endpoints
      related: [management.l2.risk-register, backend.l2.work-outside-the-request]
      vocab: [design-doc]
      example_tag: stage-2
      example_files: [docs/design/refund-design.md, docs/team/refund-requirements.md]
      outline:
      - "A design doc describes how the team plans to build something before building it, so others can point out problems while changing the plan still costs only an edit."
      - "It starts from the requirements it answers, then gives the proposed design, what it deliberately leaves out, and its risks and open questions."
      - "The refund design calls the payment gateway from a background job, retried with backoff and sent with an idempotency key, because a request must be accepted while the gateway is down."
