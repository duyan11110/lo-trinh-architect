module:
  id: teams-and-leadership
  title: { vi: "Đội ngũ và lãnh đạo", en: "Teams and leadership" }
  stage: 4
  summary:
    vi: "Lập kế hoạch tăng người cho Đơn Hàng bằng nhiều đội nhỏ theo tải nhận thức, chọn kiểu đội và cách các đội làm việc với nhau theo Team Topologies, để đội xây service cũng vận hành nó với vòng trực bền lâu, giữ văn hóa không đổ lỗi, kèm người mới bằng việc thật và trình bày đề xuất tổ chức đội cho lãnh đạo."
    en: "Plan Đơn Hàng's growth as several small teams sized by cognitive load, choose team types and how teams work together with Team Topologies, let the team that builds a service run it with a sustainable on-call rotation, keep a blameless culture, mentor new people through real work and present the team plan to leadership."
  lessons:
    - id: management.l4.scaling-with-small-teams
      title:
        vi: "Mở rộng bằng cách thêm đội nhỏ, mỗi đội chỉ giữ phần vừa sức mình"
        en: "Grow by adding small teams, each owning what it can keep in mind"
      main_path: true
      duration_min: 14
      skills: [management.teams.scaling]
      prereqs:
        - design.l4.conways-law
        - design.l4.a-thousand-shops
        - management.l4.roadmap
        - devops.l4.golden-path
      related:
        - management.l1.scrum-from-junior-seat
        - management.l4.technical-strategy
        - design.l4.distributed-monolith
        - devops.l4.platform-engineering
      vocab: [cognitive-load]
      example_tag: stage-4
      example_files:
        - docs/team/team-structure.md
        - docs/team/sprint-example.md
        - docs/team/multi-shop-requirements.md
        - docs/team/golden-path.md
      outline:
        - "In a group of n people there are n(n-1)/2 pairs who may need to talk: the seven people in `sprint-example.md` make 21 pairs, and the same team grown to fourteen would make 91."
        - "A team's cognitive load is how much its members must know and keep in mind to change and run everything the team owns; adding people does not lower it, since each still reviews and supports much of the whole."
        - "`team-structure.md` lists what Đơn Hàng's one team owns at stage-4, from the api, Notifications, Payments and the Flutter app to staging's platform and on-call for all of it, and marks parts only one person can change."
        - "For 1,000 shops the plan grows by adding small teams that each own whole parts of the system, sized by cognitive load rather than by the number of services or lines of code."
        - "Because of Conway's law, choosing team boundaries also shapes future system boundaries, so the plan draws them along existing modules and services, such as Ordering and Catalog."
        - "Load can also fall without new people, by owning fewer things or making them simpler to use, as the golden path does for adding a service."
      misconceptions:
        - "Seniors often assume a team that falls behind catches up by adding more developers to it."
        - "Seniors often assume one large team coordinates more easily than several small ones, because everyone hears everything."
        - "Seniors often assume the number of services is a good measure of how much a team can own."
      depth_notes: "Không dạy kiểu đội, cách đội làm việc với nhau — management.l4.team-types, management.l4.team-interaction-modes. Không dạy tuyển dụng, ngân sách, lương. Không dạy lại định luật Conway, golden path — design.l4.conways-law, devops.l4.golden-path."

    - id: management.l4.team-types
      title:
        vi: "Bốn kiểu đội cho mỗi đội một loại việc rõ ràng"
        en: "Four team types give each team one clear kind of job"
      main_path: true
      duration_min: 14
      skills: [management.teams.topologies]
      prereqs:
        - management.l4.scaling-with-small-teams
        - devops.l4.platform-engineering
        - backend.l4.signing-key-custody
        - management.l3.proposing-an-adr
      related:
        - design.l4.conways-law
        - frontend.l4.feature-folders
        - devops.l4.golden-path
        - k8s.l4.keys-stay-in-the-key-service
      vocab: [team-topologies, stream-aligned-team, platform-team, enabling-team, complicated-subsystem-team]
      example_tag: stage-4
      example_files:
        - docs/adr/0025-to-chuc-doi-theo-luong-va-doi-platform.md
        - docs/team/team-structure.md
        - docs/team/platform-capabilities.md
        - docs/adr/0023-khoa-ky-hoa-don-trong-hsm-cua-nha-cung-cap.md
      outline:
        - "Team Topologies, a canonical book on organising software teams, names four team types so that each team's purpose and its relation to other teams are explicit."
        - "A stream-aligned team owns one flow of change for a part of the business, from idea to production; ADR `0025` makes most of Đơn Hàng's future teams this type, one for ordering and one for shops."
        - "A platform team provides internal services that lower stream-aligned teams' cognitive load; Đơn Hàng's would own the capabilities in `platform-capabilities.md` and the golden path."
        - "An enabling team helps other teams gain a skill for a limited time and then steps back; a complicated-subsystem team owns a part that needs rare specialist knowledge."
        - "`team-structure.md` plans no complicated-subsystem team yet: invoice signing in the provider's HSM of ADR `0023` has no code, so the plan names it as the first candidate once it is built."
        - "ADR `0025` rejects teams split by layer, such as front end, back end and operations, because almost every change a shop would notice would then need all three teams."
      misconceptions:
        - "Seniors often assume teams are best split by technical layer, with front end, back end and operations each in their own team."
        - "Seniors often assume an enabling team is a permanent support team that does the hard work for others."
        - "Seniors often assume every specialist area, such as security or databases, deserves a team of its own."
      depth_notes: "Không nêu tên tác giả, năm. Cách các đội làm việc với nhau — management.l4.team-interaction-modes; đội vận hành service — management.l4.teams-run-what-they-build. Không dạy lại platform engineering, HSM — devops.l4.platform-engineering, backend.l4.signing-key-custody."

    - id: management.l4.team-interaction-modes
      title:
        vi: "Cách hai đội làm việc với nhau là một lựa chọn, và nó đổi theo thời gian"
        en: "How two teams work together is a choice that changes over time"
      main_path: true
      duration_min: 13
      skills: [management.teams.topologies]
      prereqs:
        - management.l4.team-types
        - design.l3.module-contracts
        - k8s.l4.moving-to-a-new-cluster
      related:
        - devops.l4.golden-path
        - design.l4.conways-law
        - design.l4.where-boundaries-are-enforced
        - management.l4.lightweight-governance
      vocab: [team-interaction-mode, x-as-a-service]
      example_tag: stage-4
      example_files:
        - docs/team/team-structure.md
        - DonHang.Catalog/ICatalog.cs
        - docs/design/cluster-migration-plan.md
        - docs/team/golden-path.md
      outline:
        - "Team Topologies names three team interaction modes: collaboration, working closely on a shared goal; X-as-a-service, using what another team provides with little discussion; and facilitating, helping another team learn."
        - "Collaboration finds a good boundary quickly but costs both teams' attention, so it is planned for a limited time; X-as-a-service costs little attention but needs a clear, stable offer."
        - "`team-structure.md` has the platform team collaborate with the ordering team during the move in `cluster-migration-plan.md`, then offer the golden path to it as X-as-a-service."
        - "Between the two stream-aligned teams the mode is X-as-a-service through the module contract `ICatalog`: the shops team may change anything behind it without asking, as long as `ICatalog` keeps its shape."
        - "Each team publishes what it offers, how to ask for it and how soon it answers, so a request to another team is a known step rather than a negotiation."
        - "Two teams that must collaborate on almost every change signal a boundary in the wrong place, which is a design question, not a communication problem."
      misconceptions:
        - "Seniors often assume more collaboration between teams is always better."
        - "Seniors often assume X-as-a-service means the providing team does the work for the other team."
        - "Seniors often assume the way two teams work together, once agreed, should stay fixed."
      depth_notes: "Không dạy công cụ nhận yêu cầu giữa các đội. Không dạy lại hợp đồng module, chuyển cluster, golden path — design.l3.module-contracts, k8s.l4.moving-to-a-new-cluster, devops.l4.golden-path."

    - id: management.l4.teams-run-what-they-build
      title:
        vi: "Đội xây service cũng là đội vận hành nó trên production"
        en: "The team that builds a service also runs it in production"
      main_path: true
      duration_min: 13
      skills: [management.teams.operations]
      prereqs:
        - management.l4.team-interaction-modes
        - devops.l4.on-call
        - devops.l4.runbooks
        - backend.l4.service-level-objectives
      related:
        - devops.l4.platform-engineering
        - devops.l4.golden-path
        - devops.l4.delivery-metrics
        - devops.l4.incident-command
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/team-structure.md
        - docs/team/on-call.md
        - docs/design/slo.md
        - docs/adr/0025-to-chuc-doi-theo-luong-va-doi-platform.md
      outline:
        - "DevOps is a way of working in which the people who build a service also deploy it, watch it and answer for it in production, instead of handing it to a separate operations group."
        - "A separate 'DevOps team' that deploys and watches everyone else's services brings that hand-off back: product teams wait in its queue and stop learning how their code behaves in production."
        - "In `team-structure.md` each stream-aligned team owns its services' SLOs, alerts, runbooks and on-call, while the platform team owns the cluster and shared tools and is on call for them."
        - "Running its services stays bearable for a product team because the platform team carries the shared work: teams deploy through the golden path instead of each learning the cluster in depth."
        - "Today one team builds and runs everything, so `on-call.md` has a single rotation; ADR `0025` splits on-call by team only when the new teams form."
      misconceptions:
        - "Seniors often assume DevOps is the name of the team that handles deploys and servers."
        - "Seniors often assume developers should not be on call, since running production is a separate job."
        - "Seniors often assume a platform team is an operations team under a new name that takes tickets."
      depth_notes: "Không dạy lịch sử phong trào DevOps hay SRE như một vai trò. Tổ chức vòng trực — management.l4.sustainable-on-call. Không dạy lại SLO, runbook, trực sự cố — backend.l4.service-level-objectives, devops.l4.runbooks, devops.l4.on-call."

    - id: management.l4.sustainable-on-call
      title:
        vi: "Giữ trực sự cố bền lâu bằng cách đếm gánh nặng từng người mang"
        en: "Keep on-call sustainable by counting the load each person carries"
      main_path: true
      duration_min: 13
      skills: [management.teams.operations]
      prereqs:
        - management.l4.teams-run-what-they-build
        - devops.l4.on-call
        - devops.l4.incident-command
        - devops.l4.alerting-on-symptoms
      related:
        - devops.l4.runbooks
        - management.l2.risk-register
        - devops.l4.burn-rate-alerts
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/on-call-staffing.md
        - docs/team/on-call.md
        - docs/team/incident-response.md
        - docs/design/alerts.md
      outline:
        - "A rotation lasts only if each person is on call rarely enough to rest: `on-call-staffing.md` sets at least five people for a rotation that pages outside working hours, so nobody holds more than one week in five."
        - "Today's single rotation in `on-call.md` has four developers, below that minimum, so until a second team forms it pages outside working hours only for the highest severity in `incident-response.md`."
        - "Fairness is judged by the load each person carried, not by the number of shifts: the document counts each person's pages, night pages and weekend or holiday shifts every month."
        - "After a night page the person on call starts late the next day, and a shift with more than two night pages puts reducing those alerts at the top of the team's next sprint."
        - "These rules apply from the day paging goes live; pay or time off for being on call is set by the company and the law, so the document leaves the amount to them."
      misconceptions:
        - "Seniors often assume the most experienced engineers should take most on-call shifts because they fix problems fastest."
        - "Seniors often assume a rotation is fair as long as everyone has the same number of shifts."
        - "Seniors often assume a hard on-call week is part of the job and needs no follow-up."
      depth_notes: "Không nêu mức lương trực, luật lao động, sản phẩm gửi thông báo. Không dạy lại vòng trực, escalation, nhờn cảnh báo, mức nghiêm trọng — devops.l4.on-call, devops.l4.alerting-on-symptoms, devops.l4.incident-command."

    - id: management.l4.blameless-culture
      title:
        vi: "Văn hóa không đổ lỗi phụ thuộc vào cách lãnh đạo phản ứng với sai sót"
        en: "A blameless culture depends on how leaders react to mistakes"
      main_path: true
      duration_min: 13
      skills: [management.leadership.culture]
      prereqs:
        - devops.l4.blameless-postmortems
        - devops.l4.delivery-metrics
        - management.l4.sustainable-on-call
      related:
        - devops.l4.incident-command
        - management.l3.technical-debt-register
        - management.l1.code-review-basics
      vocab: [psychological-safety]
      example_tag: stage-4
      example_files:
        - docs/team/blameless-culture.md
        - docs/postmortems/0001-doc-san-pham-tra-503.md
        - docs/team/delivery-metrics.md
      outline:
        - "Psychological safety is a team's shared belief that a person can admit a mistake, ask a question or raise a problem without being punished or shamed."
        - "A blameless postmortem template is not enough: if a leader asks who did it after an incident, people learn to hide what they know, and the next postmortem finds less."
        - "`blameless-culture.md` turns the commitment into rules leaders keep in public: postmortems and incident counts are never used to judge a person, and whoever reports a problem first is thanked."
        - "Blameless does not mean no one is responsible: people still own their action items and their part in the review, and a repeated pattern by one person is handled privately, outside the postmortem."
        - "The document watches for signs that safety is slipping, such as fewer near misses reported each quarter or incidents that shops notice before the team does."
      misconceptions:
        - "Seniors often assume a blameless culture means nobody is ever held responsible for anything."
        - "Seniors often assume using a blameless postmortem template is enough to make a team blameless."
        - "Seniors often assume fewer reported problems means the team is making fewer mistakes."
      depth_notes: "Không nêu tên nhà nghiên cứu, năm. Không dạy đánh giá hiệu suất, kỷ luật nhân sự, kỹ thuật tìm nguyên nhân (5 whys, fishbone). Không dạy lại postmortem không đổ lỗi, DORA metrics — devops.l4.blameless-postmortems, devops.l4.delivery-metrics."

    - id: management.l4.mentoring
      title:
        vi: "Mentoring giao việc thật, kèm phần hỗ trợ giảm dần từng bước"
        en: "Mentoring hands over real work with support that shrinks step by step"
      main_path: true
      duration_min: 13
      skills: [management.leadership.mentoring]
      prereqs:
        - management.l4.blameless-culture
        - management.l4.sustainable-on-call
        - management.l1.code-review-basics
        - management.l3.architecture-decision-record
      related:
        - management.l2.readme
        - devops.l4.runbooks
        - management.l1.scrum-from-junior-seat
      vocab: [mentoring]
      example_tag: stage-4
      example_files:
        - docs/team/mentoring-plan.md
        - docs/team/on-call-staffing.md
        - docs/team/review-comments-examples.md
      outline:
        - "Mentoring is an ongoing relationship in which an experienced person helps a less experienced one grow through real work, questions and feedback, rather than by handing over answers."
        - "`mentoring-plan.md` moves a new developer in three steps on real tasks: pairing with the mentor, working alone with a close review, then owning a change end to end through its release."
        - "When the new developer is stuck, the mentor first asks where they have looked and points to a source such as an ADR or a runbook, so the developer learns where answers live."
        - "On-call follows the same steps: one shift shadowing the person on call, one shift on call with a named second person, then a place in the rotation, as `on-call-staffing.md` requires."
        - "The plan gives the mentor fewer sprint tasks while mentoring, because growing someone is work the team plans for, not a favour done after hours."
        - "Mentoring multiplies an architect's reach: decisions explained in ADRs and review comments let others take the next decision without asking."
      misconceptions:
        - "Seniors often assume the fastest way to help a junior is to fix the problem for them."
        - "Seniors often assume mentoring is a weekly chat about careers, separate from the daily work."
        - "Seniors often assume time spent mentoring is time taken away from an architect's real work."
      depth_notes: "Không dạy lộ trình thăng tiến, đánh giá hiệu suất, coaching như một nghề riêng. Không dạy lại code review, ADR — management.l1.code-review-basics, management.l3.architecture-decision-record."

    - id: management.l4.presenting-to-leadership
      title:
        vi: "Trình bày với lãnh đạo: mở đầu bằng quyết định bạn cần họ đưa ra"
        en: "To leadership, open with the decision you need them to take"
      main_path: true
      duration_min: 14
      skills: [management.communication.leadership]
      prereqs:
        - management.l2.answer-first
        - management.l2.stakeholder-communication
        - management.l4.deciding-under-uncertainty
        - management.l4.team-types
      related:
        - management.l4.weighted-scoring-matrix
        - management.l4.roadmap
        - management.l4.technical-strategy
        - management.l2.schedule-buffer
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/leadership-brief-platform-team.md
        - docs/adr/0025-to-chuc-doi-theo-luong-va-doi-platform.md
        - docs/team/team-structure.md
        - docs/team/roadmap.md
      outline:
        - "Leaders weigh many requests with little time for each, so a brief to them opens with the decision asked for, the recommendation and its effect on the business, before any technical detail."
        - "`leadership-brief-platform-team.md` asks to form a platform team before a second product team, and states the effect in business terms: how soon a new shop can open and the risk to the SLOs shops rely on."
        - "It compares the options, including doing nothing, with their cost in people and sprints and what each gives up, so leaders choose instead of approving the only choice shown."
        - "Uncertainty is stated as a range with the signal that would change the plan, because a confident number that later moves costs more trust than a range given up front."
        - "Technical detail moves to an appendix that points to ADR `0025` and `team-structure.md`, and likely hard questions, such as what happens if the answer is no, are prepared with answers."
      misconceptions:
        - "Seniors often assume leaders need the full technical detail before they will trust a recommendation."
        - "Seniors often assume showing only the recommended option makes the strongest case."
        - "Seniors often assume admitting uncertainty in front of leadership looks weak."
      depth_notes: "Không dạy kỹ năng sân khấu, công cụ trình chiếu, ngân sách hay lương. Không dạy lại câu trả lời trước, cập nhật cho stakeholder, quyết định khi chưa chắc — management.l2.answer-first, management.l2.stakeholder-communication, management.l4.deciding-under-uncertainty."

