repo_changes_needed:
  - lesson: management.l4.team-types
    need: "ADR 0025 theo docs/adr/template.md (tiếng Việt, tiêu đề mục '### ', không '## ' hay '**'), trạng thái Chấp nhận: bối cảnh = 1.000 cửa hàng (multi-shop-requirements.md, roadmap.md) cần thêm người mà một đội 7 người đã sở hữu mọi thứ; phương án A một đội lớn hơn, B đội theo tầng (frontend, backend, vận hành), C hai đội theo luồng (Đặt hàng: module Ordering, Payments, Notifications, lib/features/ordering; Cửa hàng: module Catalog, mở cửa hàng mới theo multi-shop-data-rollout.md, lib/features/catalog và auth) cộng một đội platform (OpenTofu, Argo CD, Gateway, Sealed Secrets, Prometheus, admission policy, templates/dotnet-service, vận hành PostgreSQL/RabbitMQ/Keycloak); chọn C, từ chối A (số cặp trao đổi) và B (gần như mọi thay đổi cửa hàng thấy cần cả ba đội); hậu quả: đội platform lập trước đội theo luồng thứ hai, vòng trực tách theo đội khi đội mới thành lập; điều kiện mở lại: hai đội cùng sửa một module trong phần lớn thay đổi, hoặc ký hóa đơn (ADR 0023) được xây; không code; thêm dòng 0025 vào docs/adr/README.md."
    suggested_path: "docs/adr/0025-to-chuc-doi-theo-luong-va-doi-platform.md"
  - lesson: management.l4.scaling-with-small-teams
    need: "team-structure.md tiếng Việt ('### ', không '## '/'**') gồm: '### Đội hôm nay' (một đội: 1 PO, 1 scrum master, 4 lập trình viên, 1 tester, khớp sprint-example.md) với bảng phần sở hữu (api: Ordering + Catalog, Notifications, Payments, DonHang.App, staging + platform theo platform-capabilities.md, CI, trực cho tất cả) và cột 'số người sửa được' đánh dấu phần chỉ một người sửa được (ví dụ OpenTofu/cluster); '### Vì sao không thêm người vào một đội' (n(n-1)/2: 7 người 21 cặp, 14 người 91 cặp); '### Kế hoạch' theo ADR 0025 (ba đội, mỗi đội 5–7 người, số là giả định; đội platform lập trước; ranh giới theo module/service); '### Cách các đội làm việc với nhau' (bảng cặp đội – cách – tới khi nào: platform↔Đặt hàng cộng tác trong lúc chuyển cluster theo cluster-migration-plan.md rồi X-as-a-service qua golden path; platform↔Cửa hàng X-as-a-service, một người platform hỗ trợ học (facilitating) 2 sprint đầu về SLO/alert/runbook; Đặt hàng↔Cửa hàng X-as-a-service qua ICatalog); '### Mỗi đội cung cấp gì' (thứ đội cung cấp, cách gửi yêu cầu, trả lời trong 2 ngày làm việc); '### Ai vận hành gì' (đội theo luồng giữ SLO, alert, runbook, trực cho service của mình; platform trực cho cluster và công cụ chung); không đội hệ con phức tạp (ký hóa đơn ADR 0023 chưa có code, ứng viên đầu tiên); '### Khi nào xem lại'."
    suggested_path: "docs/team/team-structure.md"
  - lesson: management.l4.sustainable-on-call
    need: "on-call-staffing.md tiếng Việt ('### ', không '## '/'**'), viết sau on-call.md và incident-response.md, không mâu thuẫn chúng: vòng trực gọi ngoài giờ cần ít nhất 5 người, ca một tuần (không ai trực quá 1 tuần trong 5); vòng trực hiện tại (theo on-call.md) có 4 lập trình viên nên tới khi có đội thứ hai chỉ gọi ngoài giờ cho mức nghiêm trọng cao nhất của incident-response.md; mỗi tháng đếm theo người: số lần bị gọi, số lần bị gọi ban đêm (22:00–07:00), ca cuối tuần/ngày lễ, ca đổi; sau một đêm bị gọi được bắt đầu muộn hôm sau; ca có hơn 2 lần bị gọi ban đêm → việc giảm các alert đó lên đầu sprint kế; người mới: 1 ca đi theo (shadow), 1 ca trực chính có người thứ hai được chỉ định, rồi vào vòng trực; các quy tắc áp dụng từ ngày paging chạy thật (on-call.md ghi chưa chạy); đền bù trực do công ty và luật quyết, không ghi mức."
    suggested_path: "docs/team/on-call-staffing.md"
  - lesson: management.l4.blameless-culture
    need: "blameless-culture.md tiếng Việt ('### ', không '## '/'**'): '### Điều lãnh đạo cam kết' (postmortem và số sự cố không dùng để đánh giá cá nhân; người báo vấn đề đầu tiên được cảm ơn trước đội; sau sự cố hỏi điều gì đã cho phép, không hỏi ai); '### Trách nhiệm vẫn còn' (mỗi người giữ việc cần làm của mình và phần mình trong buổi review; hành vi lặp lại của một người do quản lý trực tiếp xử lý riêng, ngoài postmortem); '### Số đo đọc theo đội và hệ thống' (trỏ delivery-metrics.md); '### Dấu hiệu đang trượt' (số lần suýt sự cố được báo mỗi quý giảm, sự cố do cửa hàng phát hiện trước đội, postmortem ngắn dần) — xem mỗi quý; nhắc postmortem 0001 làm ví dụ."
    suggested_path: "docs/team/blameless-culture.md"
  - lesson: management.l4.mentoring
    need: "mentoring-plan.md tiếng Việt ('### ', không '## '/'**') cho một lập trình viên mới: '### Tuần đầu' (chạy scripts/up.sh, đọc STAGE.md và docs/adr/README.md, merge một thay đổi nhỏ); '### Ba bậc' (làm cặp với người kèm → tự làm có review kỹ → sở hữu một thay đổi tới khi phát hành, gồm canary và release note); '### Khi người mới bị kẹt' (người kèm hỏi đã xem ở đâu, trỏ tới ADR/runbook trước khi đưa câu trả lời); '### Trực sự cố' (theo on-call-staffing.md); '### Thời gian của người kèm' (người kèm nhận ít việc sprint hơn trong thời gian kèm, đội lập kế hoạch cho việc này); 1-1 30 phút mỗi tuần, phản hồi hai chiều; không lộ trình thăng tiến, không lương."
    suggested_path: "docs/team/mentoring-plan.md"
  - lesson: management.l4.presenting-to-leadership
    need: "leadership-brief-platform-team.md tiếng Việt ('### ', không '## '/'**'), một trang: dòng đầu là đề nghị (lập đội platform trước đội theo luồng thứ hai) và hiệu quả cho kinh doanh (cửa hàng mới mở nhanh hơn, giữ SLO); '### Phương án' (A không làm gì, B thêm người vào một đội, C đề xuất) với chi phí bằng số người và số sprint, không tiền, không lương, và điều mỗi phương án bỏ đi; '### Điều chưa chắc' (khoảng, ví dụ đội platform 3–4 người, giả định; tín hiệu làm đổi kế hoạch); '### Câu hỏi có thể gặp' (gồm 'nếu không đồng ý thì sao') kèm câu trả lời; '### Phụ lục' trỏ ADR 0025, team-structure.md, roadmap.md; không ngày tháng cụ thể."
    suggested_path: "docs/team/leadership-brief-platform-team.md"
  - lesson: management.l4.scaling-with-small-teams
    need: "STAGE.md của stage-4 thêm vào bảng tài liệu team các dòng cho ADR 0025, team-structure.md, on-call-staffing.md, blameless-culture.md, mentoring-plan.md, leadership-brief-platform-team.md; thứ tự trong /repo-stage 4: sau ADR 0022–0024, platform-capabilities.md, golden-path.md, cluster-migration-plan.md, on-call.md, incident-response.md, postmortem 0001, delivery-metrics.md, roadmap.md; ADR 0025 trước team-structure.md, rồi on-call-staffing → blameless-culture → mentoring-plan → leadership brief."
    suggested_path: "STAGE.md"

open_questions:
  - "ADR 0025 = tổ chức hai đội theo luồng (Đặt hàng, Cửa hàng) + một đội platform, từ chối một đội lớn và đội theo tầng; chấp nhận, không code ở stage-4. Đề xuất: đồng ý; ADR GĐ4 tiếp theo từ 0026."
  - "Số chính sách (đội 5–7 người, vòng trực ≥ 5 người ca một tuần, đêm 22:00–07:00, > 2 lần gọi đêm/ca, bắt đầu muộn sau đêm bị gọi, xem mỗi tháng, hỗ trợ học 2 sprint, trả lời yêu cầu trong 2 ngày làm việc, đội platform 3–4 người) là chính sách/giả định của dự án, không phải chuẩn ngành. Đề xuất: giữ; /repo-stage 4 đổi số thì sửa outline scaling-with-small-teams, team-interaction-modes, sustainable-on-call, presenting-to-leadership trước khi sinh bài."
  - "sustainable-on-call và teams-run-what-they-build giả định on-call.md (từ devops/incidents) có MỘT vòng trực gồm 4 lập trình viên. Đề xuất: /repo-stage 4 viết on-call.md như vậy; nếu khác (ví dụ có tester, ≥ 5 người) thì DỪNG, sửa outline 2 bài này, không sửa on-call.md cho khớp."
  - "Term `platform-team` thêm ở đây (devops/platform-and-release-strategy không thêm). Outline devops.l4.platform-engineering (học trước) đã viết 'platform team' → L15 W ở bài đó. Đề xuất: chấp nhận W như tiền lệ weighted-scoring-matrix trong design.l4.reduced-atam; bài đó dùng nghĩa thường, không in đậm."
  - "Không thêm term `devops` (tên track, xuất hiện rất nhiều ở bài trước → L15 W hàng loạt). Đề xuất: bài teams-run-what-they-build giải thích DevOps bằng lời, không vocab."
  - "Team Topologies (bốn kiểu đội, ba cách tương tác, tải nhận thức) và psychological safety là tham chiếu kinh điển → claim `history`, không tên người, không năm. Đề xuất: đồng ý."
  - "Khoảng trống được hoãn tới đây mà không dạy: đánh giá hiệu suất và kỹ thuật tìm nguyên nhân (5 whys, fishbone) từ devops.l4.blameless-postmortems; tuyển dụng, lộ trình thăng tiến, lương, SRE như vai trò. Đề xuất: chấp nhận khoảng trống (nhân sự/HR ngoài phạm vi); nếu cần, module tùy chọn sau V1."
  - "Phân công phần dùng chung chưa rõ trong ADR 0025: lib/design/ và lib/shared/ của DonHang.App, Keycloak (vận hành vs feature auth). Đề xuất: lib/design + lib/shared do đội Đặt hàng giữ (đội kia gửi PR); vận hành Keycloak ở đội platform, lib/features/auth ở đội Cửa hàng."
  - "Tên đội, tên file và đường dẫn `DonHang.Catalog/ICatalog.cs` ở stage-4 là đề xuất/giả định. Đề xuất: /repo-stage 4 đổi thì sửa example_files trước khi sinh bài."
