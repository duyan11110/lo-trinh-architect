module:
  id: governance-and-strategy
  title: { vi: "Governance và chiến lược kỹ thuật", en: "Governance and technical strategy" }
  stage: 4
  summary:
    vi: "Giữ kiến trúc Đơn Hàng đúng hướng bằng nguyên tắc, quyền quyết định và phép kiểm tự động thay cho duyệt từng thay đổi, chấm phương án bằng ma trận có trọng số, quyết khi chưa chắc chắn, thay phần cũ theo strangler fig, viết chiến lược kỹ thuật và roadmap, phát hành cho cửa hàng theo release train và đáp ứng yêu cầu tuân thủ của một khách ngân hàng bằng biện pháp kiểm soát có bằng chứng."
    en: "Keep Đơn Hàng's architecture on course with principles, decision rights and automatic checks instead of approving every change, score options with a weighted matrix, decide under uncertainty, replace old parts with a strangler fig, write a technical strategy and a roadmap, release to shops on a release train, and meet a bank customer's compliance requirements with controls backed by evidence."
  lessons:
    - id: management.l4.lightweight-governance
      title:
        vi: "Governance nhẹ: nói rõ ai quyết gì và để phép kiểm tự động giữ luật"
        en: "Light governance: clear decision rights and automatic checks"
      main_path: true
      duration_min: 14
      skills: [management.governance.lightweight]
      prereqs:
        - management.l3.proposing-an-adr
        - design.l4.mapping-fitness-functions
        - backend.l4.backend-review-checklist
        - k8s.l4.cluster-review-checklist
      related: [design.l4.conways-law, design.l4.over-abstraction, backend.l4.data-ownership, management.l3.superseding-an-adr]
      vocab: [architecture-governance, architecture-principle]
      example_tag: stage-4
      example_files:
        - docs/team/architecture-governance.md
        - docs/adr/README.md
        - docs/design/fitness-functions.md
        - docs/design/backend-review-checklist.md
      outline:
        - "Architecture governance is how an organisation makes sure architecture decisions are taken by the right people, recorded and followed; lightweight governance does it with a few written rules, not an approval step for every change."
        - "An architecture principle is a short rule drawn from the drivers, stated with its reason and what it implies; `architecture-governance.md` lists five, each pointing to the ADR or document it comes from."
        - "Its table of decision rights says which decisions a developer takes in an ordinary pull request, which need an ADR, and whom each ADR must ask, so most changes wait for no extra approval."
        - "Rules a machine can check are left to the checks listed in `fitness-functions.md` and to the review checklists, so a principle holds on every change without a person approving each one."
        - "Breaking a principle is allowed through an ADR that records the exception and when to look at it again, so the rule and its exceptions both stay visible."
      misconceptions:
        - "Seniors often assume governance means a board of architects that approves every design before work starts."
        - "Seniors often assume architecture principles are slogans, so they need no reasons attached."
        - "Seniors often assume a principle that allows exceptions is not worth writing down."
      depth_notes: "Không dạy tổ chức nhiều đội hay Team Topologies — management/teams-and-leadership; không nêu khung governance có tên. Không dạy lại quy trình ADR, fitness function, checklist — management.l3.proposing-an-adr, design.l4.fitness-functions, backend.l4.backend-review-checklist."

    - id: management.l4.weighted-scoring-matrix
      title:
        vi: "Ma trận chấm điểm có trọng số: trọng số là một quyết định, chốt trước"
        en: "A weighted scoring matrix makes the weights a decision of their own"
      main_path: true
      duration_min: 14
      skills: [management.decisions.scoring]
      prereqs:
        - management.l3.evaluating-a-vendor
        - management.l3.total-cost-of-ownership
        - management.l3.vendor-contract-terms
        - design.l4.reduced-atam
      related: [management.l3.weighing-options-in-an-adr, management.l3.build-buy-or-adopt, management.l4.lightweight-governance]
      vocab: [weighted-scoring-matrix]
      example_tag: stage-4
      example_files:
        - docs/team/email-service-evaluation.md
        - docs/adr/0024-dich-vu-gui-email-ben-ngoai.md
        - docs/team/self-run-components.md
      outline:
        - "A weighted scoring matrix scores each option on each criterion, multiplies each score by the criterion's weight and adds the results, so options strong in different places can be compared on one scale."
        - "Knock-out criteria are checked first and carry no weight: `email-service-evaluation.md` drops any option that cannot send over SMTP with TLS, whatever its total would have been."
        - "The weights are agreed and written down before any option is scored, so they cannot be bent afterwards toward an option someone already prefers."
        - "Each score cites its evidence, such as a test send or a contract term, so a reviewer can dispute one score instead of arguing with the total."
        - "A sensitivity check moves each weight within a believable range; the top two services swap places, so the matrix calls them close and ADR `0024` records the reason outside the matrix that decided."
      misconceptions:
        - "Seniors often assume the option with the highest total is the right choice by definition."
        - "Seniors often assume a scoring matrix is objective because it ends in a number."
        - "Seniors often assume weights may be adjusted after scoring when the result looks wrong."
      depth_notes: "Không dạy phương pháp đa tiêu chí có tên hay xác suất. Không nêu tên, giá dịch vụ thật; số là giả định. Không dạy lại tiêu chí loại ngay, TCO, điều khoản hợp đồng, ATAM — management.l3.evaluating-a-vendor, management.l3.total-cost-of-ownership, design.l4.reduced-atam."

    - id: management.l4.deciding-under-uncertainty
      title:
        vi: "Khi chưa chắc chắn, cân nhắc kỹ theo mức khó đảo ngược của quyết định"
        en: "Under uncertainty, match the care to how hard a choice is to undo"
      main_path: true
      duration_min: 13
      skills: [management.decisions.uncertainty]
      prereqs:
        - management.l4.weighted-scoring-matrix
        - management.l4.lightweight-governance
        - design.l4.reduced-atam
        - k8s.l4.when-a-mesh-pays-off
      related: [design.l4.evolutionary-architecture, design.l4.one-deployment-for-all-shops, k8s.l4.choosing-managed-kubernetes, k8s.l4.data-decides-failover]
      vocab: [reversible-decision]
      example_tag: stage-4
      example_files:
        - docs/team/architecture-governance.md
        - docs/adr/0024-dich-vu-gui-email-ben-ngoai.md
        - docs/adr/0021-chua-dung-service-mesh.md
        - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
      outline:
        - "Many architecture decisions must be taken before the facts are in, such as how many shops will join or what a large customer's contract will demand; waiting for certainty usually lets the decision happen by default."
        - "A reversible decision can be undone later at a small cost and deserves a quick choice; a decision that is costly to undo deserves more evidence, or a shape that keeps it reversible."
        - "ADR `0024` is reversible: Notifications keeps sending through MailKit over SMTP, so changing service means changing settings; ADR `0012`, one deployment for every shop, is costly to undo and was reviewed with a reduced ATAM."
        - "A decision under uncertainty states the assumptions it rests on and the signals that would reopen it; ADR `0021` names three, such as a contract that requires encryption inside the cluster."
        - "The table of watched assumptions in `architecture-governance.md` lists each reopen signal, where it would show up and who watches for it, and is read at each quarterly review, so no signal is forgotten."
      misconceptions:
        - "Seniors often assume a careful architect waits until all the facts are known before deciding."
        - "Seniors often assume every architecture decision deserves the same depth of analysis."
        - "Seniors often assume a decision whose assumptions later prove wrong was a bad decision."
      depth_notes: "Không dạy cây quyết định, giá trị kỳ vọng hay ẩn dụ gắn tên người. Không quyết lại ADR 0012, 0020–0022. Không dạy lại thay thế ADR, kiến trúc tiến hóa — management.l3.superseding-an-adr, design.l4.evolutionary-architecture."

    - id: management.l4.strangler-fig
      title:
        vi: "Thay phần cũ từng mảnh một, phía sau những địa chỉ không đổi"
        en: "Replace an old part piece by piece behind the same addresses"
      main_path: true
      duration_min: 13
      skills: [management.strategy.modernization]
      prereqs:
        - design.l4.evolutionary-architecture
        - k8s.l2.gateway-api
        - backend.l3.payments-service
        - management.l3.proposing-an-adr
      related: [k8s.l4.moving-to-a-new-cluster, devops.l4.canary-release, backend.l4.expand-and-contract, design.l4.merging-a-service-back]
      vocab: [strangler-fig]
      example_tag: stage-3
      example_files:
        - Caddyfile
        - deploy/gitops/config-repo/platform/edge/httproutes.yaml
        - docs/adr/0008-xoa-bang-cu-trong-donhang.md
        - docs/team/tech-debt-register.md
      outline:
        - "The strangler fig pattern replaces an old system gradually: a routing layer in front of it sends one piece of the traffic at a time to new code, until nothing reaches the old part and it can be removed."
        - "Đơn Hàng already has the routing layer this needs: Caddy sends requests under `/api/v1/refunds` to Payments and the rest of `/api/v1/` to the api, and the HTTPRoute `api` does the same on staging."
        - "Clients keep calling the same addresses, so a piece can move to the new code, or back, by changing the routing layer alone, with no client release."
        - "Each step leaves the system working and is small enough to undo, which is the alternative to a rewrite from scratch that delivers nothing until the whole new system is finished."
        - "The work ends only when what the old part leaves behind is removed: ADR `0008` plans to dump and drop the tables the API stopped using once Notifications and Payments had their own databases."
      misconceptions:
        - "Seniors often assume replacing a legacy system means a full rewrite and one big switch-over."
        - "Seniors often assume the migration is finished once the new code takes all the traffic."
        - "Seniors often assume clients must change the addresses they call when part of a system moves to a new service."
      depth_notes: "Ở stage-3 không có hệ thống cũ nào đang được thay; bài dùng lớp định tuyến có sẵn. Không dạy đồng bộ dữ liệu cũ–mới, chuyển theo phần trăm — backend.l4.expand-and-contract, devops.l4.canary-release. Không dạy lại reverse proxy, HTTPRoute — devops.l1.reverse-proxy-basics, k8s.l2.gateway-api."

    - id: management.l4.technical-strategy
      title:
        vi: "Chiến lược kỹ thuật nói rõ vấn đề phải giải và những việc sẽ không làm"
        en: "A technical strategy names the problem and what the team won't do"
      main_path: true
      duration_min: 14
      skills: [management.strategy.technical]
      prereqs:
        - management.l4.strangler-fig
        - management.l4.deciding-under-uncertainty
        - design.l4.a-thousand-shops
        - backend.l4.shop-id-rollout
      related: [k8s.l4.choosing-managed-kubernetes, k8s.l4.when-a-mesh-pays-off, design.l4.one-deployment-for-all-shops, backend.l4.shop-data-layout]
      vocab: [technical-strategy]
      example_tag: stage-4
      example_files:
        - docs/team/technical-strategy.md
        - docs/team/multi-shop-requirements.md
        - docs/design/multi-shop-data-rollout.md
        - docs/adr/README.md
      outline:
        - "A technical strategy is a short document that names the main challenge a system faces, the direction chosen to meet it and the few actions that follow, for a stated period."
        - "`technical-strategy.md` starts from a diagnosis: Đơn Hàng must grow from one shop to 1,000, and its weakest points for that are isolation between shops, monitoring in production and backups that never leave one machine."
        - "Its direction ties existing decisions together, one shared deployment with each shop's rows kept apart in shared tables on managed Kubernetes, so ADRs `0012`, `0013` and `0022` read as parts of one plan."
        - "It also says what the team will not do and why: no further split into services, no service mesh, no second cloud and no rewrite from scratch, with old parts replaced by a strangler fig when needed."
        - "Each action names an owner by role and the document that holds it, such as the three releases of `multi-shop-data-rollout.md`; a strategy without actions is a wish, and this one is reviewed every quarter."
      misconceptions:
        - "Seniors often assume a technical strategy is a list of technologies the team wants to adopt."
        - "Seniors often assume listing what the team will not do is negative and better left out."
        - "Seniors often assume a strategy is set once by leadership and then left alone."
      depth_notes: "Không nêu tên sách hay tác giả về chiến lược; không dạy ngân sách năm hay OKR. Xếp việc theo thời gian — management.l4.roadmap. Không quyết lại ADR 0012, 0013, 0021, 0022; không dạy lại các ADR đó — các bài GĐ4 trước."

    - id: management.l4.roadmap
      title:
        vi: "Roadmap xếp kết quả theo tầm xa: việc gần thì rõ, việc xa để ngỏ"
        en: "A roadmap shows outcomes by horizon, firm when near, loose when far"
      main_path: true
      duration_min: 13
      skills: [management.planning.roadmap]
      prereqs:
        - management.l4.technical-strategy
        - management.l2.forecasting-with-velocity
        - design.l4.quantifying-technical-debt
        - management.l2.stakeholder-communication
      related: [management.l1.estimates-are-not-commitments, management.l3.debt-as-a-portfolio, management.l2.schedule-buffer, devops.l4.platform-engineering]
      vocab: [roadmap]
      example_tag: stage-4
      example_files:
        - docs/team/roadmap.md
        - docs/team/technical-strategy.md
        - docs/team/tech-debt-register.md
      outline:
        - "A roadmap shows what a team intends to achieve over the coming periods, written as outcomes such as 'a new shop opens without a deploy', not as features with fixed dates."
        - "`roadmap.md` sorts items into now, next and later: only items now carry a forecast, as a range of sprints from velocity, because uncertainty grows with distance."
        - "Every item names the strategy action it serves, so an item that serves none is questioned before it takes a place."
        - "The roadmap reserves a fixed share of every sprint for items from the debt register and for platform work, so repayment does not have to win a contest against each feature."
        - "It is revised every quarter and whenever the strategy changes, and each moved item is logged with its reason, so stakeholders see a decision rather than a slip."
      misconceptions:
        - "Seniors often assume a roadmap is a release schedule with a date for every feature."
        - "Seniors often assume debt gets repaid in whatever time the features leave over."
        - "Seniors often assume a roadmap, once shared, must not change."
      depth_notes: "Không dạy công cụ vẽ roadmap, OKR hay ngân sách năm. Không dạy lại dự báo bằng velocity, lượng hóa nợ — management.l2.forecasting-with-velocity, design.l4.quantifying-technical-debt. Lịch phát hành cho cửa hàng — management.l4.release-train."

    - id: management.l4.release-train
      title:
        vi: "Release train: đến ngày thì phát hành phần đã sẵn sàng, không chờ ai"
        en: "A release train ships what is ready on fixed dates and never waits"
      main_path: true
      duration_min: 13
      skills: [management.planning.release-train]
      prereqs:
        - management.l4.roadmap
        - devops.l4.feature-flags
        - devops.l4.release-strategy-per-component
        - devops.l2.changelog
      related: [devops.l2.semantic-versioning, devops.l4.delivery-metrics, devops.l4.incident-command, management.l2.stakeholder-communication]
      vocab: [release-train]
      example_tag: stage-4
      example_files:
        - docs/team/release-calendar.md
        - docs/adr/0019-chien-luoc-phat-hanh-theo-thanh-phan.md
        - docs/design/feature-flags.md
        - docs/team/roadmap.md
      outline:
        - "A release train releases changes on fixed, published dates: whatever is ready when the train leaves goes, and anything not ready waits for the next train instead of delaying it."
        - "`release-calendar.md` runs a train at the end of every two-week sprint for changes shops can see; code still reaches production on any day through the canary of ADR `0019`, behind feature flags left off."
        - "Fixed dates let shops prepare: the release note for a train reaches them a set number of working days before it, which is why the train cannot wait for a late change."
        - "Fixes for an incident or a vulnerability do not wait for a train; the calendar says who may release outside it and how shops are told."
        - "A train trades speed for predictability: a finished change may wait up to two weeks to be turned on, which suits changes 1,000 shops must learn about, not internal ones."
      misconceptions:
        - "Seniors often assume a release train means code is deployed only once per train."
        - "Seniors often assume the train should wait for an important feature that is nearly done."
        - "Seniors often assume release trains only make sense for large organisations with many teams."
      depth_notes: "Không dạy release train của một khung phương pháp quy mô lớn có tên. API Đơn Hàng chưa có flag ở stage-4 (chỉ quy ước). Không dạy lại canary, feature flag, changelog — devops.l4.canary-release, devops.l4.feature-flags, devops.l2.changelog."

    - id: management.l4.compliance-controls
      title:
        vi: "Tuân thủ: biến quy định của khách thành biện pháp kiểm soát có bằng chứng"
        en: "Compliance turns a customer's rules into controls with evidence"
      main_path: true
      duration_min: 14
      skills: [management.governance.compliance]
      prereqs:
        - management.l4.lightweight-governance
        - backend.l4.audit-log
        - devops.l3.verifying-before-deploy
        - backend.l4.signing-key-custody
      related: [backend.l4.threat-modeling, devops.l3.build-provenance, devops.l3.restore-testing, k8s.l4.keys-stay-in-the-key-service, k8s.l4.choosing-managed-kubernetes]
      vocab: [compliance, compliance-control, separation-of-duties]
      example_tag: stage-4
      example_files:
        - docs/team/compliance-controls.md
        - docs/design/audit-log.md
        - .github/workflows/ci.yml
        - scripts/devops/gitops-promote.sh
      outline:
        - "Compliance means meeting rules set from outside, by a regulator or a large customer's contract, and being able to show it with evidence rather than only say so."
        - "Each requirement is met by a control, a specific practice or mechanism, and each control needs evidence someone else can inspect; `compliance-controls.md` maps a bank customer's requirements this way."
        - "Separation of duties means no one person can both make a change and approve it; the document notes that in the lab one commit by `gitops-promote.sh` promotes to production, and plans a required second reviewer."
        - "Evidence the pipeline makes on every change, such as SBOMs, scan results, signatures and Git history, costs less and is harder to fake than evidence gathered by hand before an audit."
        - "A missing control is listed as a gap with a plan, such as the audit log that `audit-log.md` only designs, because a gap an auditor finds first costs more trust than one the team stated."
      misconceptions:
        - "Seniors often assume compliance is a document written once for the auditor and then filed away."
        - "Seniors often assume passing an audit proves the system is secure."
        - "Seniors often assume compliance is the legal team's job, not the engineers'."
      depth_notes: "Không nêu luật, chuẩn, chứng nhận, số hiệu quy định (không có khóa versions.yaml); không tư vấn pháp lý. Hệ thống ký số cho ngân hàng — sysdesign/problems. Không dạy lại audit log, SBOM, xác minh image — backend.l4.audit-log, devops.l3.software-bill-of-materials, devops.l3.verifying-before-deploy."

glossary_additions:
  - term: architecture-governance
    en: "architecture governance"
    vi_keep: false
    vi: "quản trị kiến trúc"
    short_vi: "Cách tổ chức bảo đảm quyết định kiến trúc do đúng người đưa ra, được ghi lại và được tuân theo"
    short_en: "How an organisation ensures architecture decisions are made by the right people, recorded and followed"
    introduced_in: management.l4.lightweight-governance
  - term: architecture-principle
    en: "architecture principle"
    vi_keep: false
    vi: "nguyên tắc kiến trúc"
    short_vi: "Một luật ngắn rút từ các yếu tố định hình hệ thống, ghi kèm lý do và hệ quả"
    short_en: "A short rule drawn from the system's drivers, stated with its reason and implications"
    introduced_in: management.l4.lightweight-governance
  - term: weighted-scoring-matrix
    en: "weighted scoring matrix"
    vi_keep: false
    vi: "ma trận chấm điểm có trọng số"
    short_vi: "Bảng chấm điểm từng phương án theo từng tiêu chí, nhân với trọng số rồi cộng lại"
    short_en: "A table that scores each option per criterion, multiplies by the criterion's weight and sums"
    introduced_in: management.l4.weighted-scoring-matrix
    aliases: ["weighted decision matrix"]
  - term: reversible-decision
    en: "reversible decision"
    vi_keep: false
    vi: "quyết định đảo ngược được"
    short_vi: "Quyết định có thể làm lại sau với chi phí nhỏ, nên được chọn nhanh"
    short_en: "A decision that can be undone later at a small cost, so it can be taken quickly"
    introduced_in: management.l4.deciding-under-uncertainty
  - term: strangler-fig
    en: "strangler fig (pattern)"
    vi_keep: true
    vi: "strangler fig"
    short_vi: "Thay hệ thống cũ từng phần: lớp định tuyến chuyển dần từng mảng traffic sang code mới rồi bỏ phần cũ"
    short_en: "Replacing an old system gradually: a routing layer moves traffic piece by piece to new code, then the old part goes"
    introduced_in: management.l4.strangler-fig
    aliases: ["strangler fig"]
  - term: technical-strategy
    en: "technical strategy"
    vi_keep: false
    vi: "chiến lược kỹ thuật"
    short_vi: "Tài liệu ngắn nêu thách thức chính của hệ thống, hướng đi đã chọn và các hành động theo sau"
    short_en: "A short document naming a system's main challenge, the chosen direction and the actions that follow"
    introduced_in: management.l4.technical-strategy
  - term: roadmap
    en: "roadmap"
    vi_keep: true
    vi: "roadmap"
    short_vi: "Kế hoạch các kết quả đội định đạt qua các giai đoạn tới, càng xa càng ít chắc chắn"
    short_en: "A plan of the outcomes a team intends over the coming periods, less certain the further out"
    introduced_in: management.l4.roadmap
  - term: release-train
    en: "release train"
    vi_keep: true
    vi: "release train"
    short_vi: "Phát hành vào những ngày cố định đã công bố; việc chưa xong chờ chuyến sau"
    short_en: "Releasing on fixed, published dates; whatever is not ready waits for the next train"
    introduced_in: management.l4.release-train
  - term: compliance
    en: "compliance"
    vi_keep: false
    vi: "tuân thủ"
    short_vi: "Đáp ứng quy định từ bên ngoài (cơ quan quản lý, hợp đồng của khách) và chứng minh được bằng bằng chứng"
    short_en: "Meeting rules set from outside, by a regulator or a customer's contract, and proving it with evidence"
    introduced_in: management.l4.compliance-controls
  - term: compliance-control
    en: "control (compliance)"
    vi_keep: false
    vi: "biện pháp kiểm soát"
    short_vi: "Một cách làm hay cơ chế cụ thể đáp ứng một yêu cầu tuân thủ, có bằng chứng kiểm tra được"
    short_en: "A specific practice or mechanism that meets a compliance requirement, with evidence that can be checked"
    introduced_in: management.l4.compliance-controls
  - term: separation-of-duties
    en: "separation of duties"
    vi_keep: false
    vi: "tách biệt nhiệm vụ"
