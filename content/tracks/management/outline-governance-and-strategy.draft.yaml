    short_en: "No single person can both make a change and approve that same change"
    introduced_in: management.l4.compliance-controls

repo_changes_needed:
  - lesson: management.l4.lightweight-governance
    need: "Tạo `docs/team/architecture-governance.md` (tiếng Việt, mục `### `, không `## `/`**`) gồm: `### Nguyên tắc kiến trúc` đúng 5 nguyên tắc NT1–NT5, mỗi cái một câu + lý do + hệ quả + nguồn: NT1 mỗi service sở hữu dữ liệu của mình, không đọc/ghi bảng của service khác (`docs/design/data-ownership.md`, ADR 0002, 0003); NT2 service nói chuyện qua message có hợp đồng được test (`OrderMessageContractTests`), không qua project chung chứa domain; NT3 mọi cửa hàng từ một bản triển khai, cô lập nằm trong dữ liệu (ADR 0012, 0013); NT4 mọi thay đổi production đi qua repo cấu hình theo chiến lược phát hành của thành phần (ADR 0019); NT5 không thêm lớp trừu tượng cho nhu cầu chưa có (ADR 0011). `### Ai quyết định gì`: bảng loại quyết định | ví dụ | ai quyết (vai trò) | cần ADR? | phải hỏi ai — thay đổi trong một module/service không đổi hợp đồng (người làm + review PR thường, không ADR); đổi hợp đồng API công khai hoặc message (ADR, hỏi người phụ trách bên đọc); đổi dữ liệu cửa hàng, quyền, khóa, trust boundary (ADR, trưởng nhóm quyết, đối chiếu `threat-model.md`); thêm thành phần tự chạy/vendor/dịch vụ trả phí (ADR + đánh giá như `payment-gateway-evaluation.md`, hỏi product owner); ngoại lệ một nguyên tắc (ADR ghi ngoại lệ + thời điểm xem lại). `### Phép kiểm thay cho duyệt`: trỏ `fitness-functions.md` (chỉ nhắc tên file), `backend-review-checklist.md`, `cluster-review-checklist.md`; một câu: đội không có hội đồng duyệt kiến trúc riêng, quyết định theo `docs/adr/README.md`; khi có nhiều đội thì xem lại bảng. `### Ngoại lệ`: ngoại lệ ghi bằng ADR, liệt kê ở đây kèm hạn xem lại (có thể rỗng). `### Giả định cần theo dõi`: bảng ADR | giả định | tín hiệu mở lại | thấy tín hiệu ở đâu | người theo dõi (vai trò) cho ADR 0012, 0019, 0020, 0021, 0022, 0024 — tín hiệu chép đúng điều kiện mở lại ghi trong từng ADR, không thêm; ADR 0021 đủ ba tín hiệu. `### Xem lại`: mỗi quý, cùng `technical-strategy.md` và `roadmap.md`. Viết sau ADR 0024 và hai checklist; thêm dòng vào STAGE.md (bảng file → bài)."
    suggested_path: "docs/team/architecture-governance.md"
  - lesson: management.l4.weighted-scoring-matrix
    need: "Tạo `docs/team/email-service-evaluation.md` (tiếng Việt, `### `, không `## `/`**`; mọi số giả định, không tên/giá thật): bối cảnh trỏ đoạn 'gửi email cho khách là năng lực còn phải mua' của `self-run-components.md` (file này giữ nguyên); ba phương án 'Dịch vụ A', 'Dịch vụ B' (bên ngoài) và 'Tự chạy máy chủ gửi email'; `### Tiêu chí loại ngay` (gửi qua SMTP có TLS để `MailKitEmailSender` chỉ đổi cấu hình; có môi trường test; xuất được danh sách địa chỉ bị trả lại/chặn) — không ứng viên nào bị loại, hoặc ghi rõ ai bị loại; `### Trọng số, chốt trước khi chấm` (bảng tiêu chí | trọng số | lý do | nguồn YC/rủi ro, tổng 100; ghi product owner và trưởng nhóm chốt trước lần gửi thử): email tới hộp thư khách (đo bằng gửi thử), báo email bị trả lại để Notifications ngừng gửi, TCO 3 năm gồm giờ của đội, điều khoản rời đi/xuất dữ liệu, hỗ trợ khi sự cố; `### Điểm` thang 1–5, mỗi ô có cột bằng chứng, tổng có trọng số; `### Độ nhạy`: đổi từng trọng số ±10 (giữ tổng 100) — A và B đổi chỗ ở ít nhất một trường hợp, tự chạy đứng cuối mọi trường hợp vì giờ vận hành; kết luận 'A và B ngang nhau theo ma trận, quyết ở ADR 0024'."
    suggested_path: "docs/team/email-service-evaluation.md"
  - lesson: management.l4.weighted-scoring-matrix
    need: "Tạo `docs/adr/0024-dich-vu-gui-email-ben-ngoai.md` (Đã chấp nhận, theo `template.md`, mục `### `): bối cảnh production chưa có dịch vụ gửi email; 3 phương án như file đánh giá (trỏ file, không chép ma trận); quyết định chọn Dịch vụ A với lý do ngoài ma trận ghi rõ (điều khoản hợp đồng: báo trước khi đổi API và xuất danh sách chặn mọi lúc); hệ quả: Notifications giữ `MailKitEmailSender`, đổi dịch vụ chỉ là đổi cấu hình SMTP; lab vẫn dùng Mailpit; không đổi code ở stage-4; mục khi nào xem lại (tỉ lệ email tới hộp thư dưới mức giả định, giá vượt TCO giả định, A ngừng hỗ trợ SMTP). Thêm dòng 0024 vào `docs/adr/README.md`. ADR GĐ4 tiếp theo từ 0025."
    suggested_path: "docs/adr/0024-dich-vu-gui-email-ben-ngoai.md"
  - lesson: management.l4.technical-strategy
    need: "Tạo `docs/team/technical-strategy.md` (tiếng Việt, `### `, không `## `/`**`), kỳ hạn một năm, xem lại mỗi quý: `### Chẩn đoán` (từ một cửa hàng lên 1.000 theo `multi-shop-requirements.md`; điểm yếu chính: cô lập giữa cửa hàng chưa có, production chưa có giám sát Prometheus theo `slo.md`, bản sao lưu chưa rời một máy theo ADR 0020; chỉ một đội); `### Hướng đi` (một bản triển khai chung, dữ liệu cửa hàng trong bảng chung, chạy trên Kubernetes managed — ADR 0012, 0013, 0022; thay đổi nhỏ có canary — ADR 0019); `### Không làm` (không tách thêm service — ADR 0012; không service mesh — ADR 0021; không cloud thứ hai — ADR 0022; không viết lại từ đầu, thay phần cũ từng bước sau lớp định tuyến), mỗi dòng có lý do/nguồn; `### Hành động` (bảng hành động | người phụ trách theo vai trò | tài liệu: ba release của `multi-shop-data-rollout.md`, giám sát production, sao lưu sang region thứ hai, dịch vụ gửi email ADR 0024, các khoảng trống của `compliance-controls.md`); `### Xem lại` mỗi quý cùng `roadmap.md`. Thêm dòng STAGE.md."
    suggested_path: "docs/team/technical-strategy.md"
  - lesson: management.l4.roadmap
    need: "Tạo `docs/team/roadmap.md` (tiếng Việt, `### `, không `## `/`**`): `### Bây giờ`, `### Tiếp theo`, `### Sau đó` — mỗi mục là một kết quả (vd 'mở cửa hàng mới không cần deploy') kèm hành động của `technical-strategy.md` nó phục vụ; chỉ mục 'Bây giờ' có dự báo dạng khoảng sprint lấy từ velocity (trỏ `velocity-history.md`), 'Sau đó' không có ngày; release 1 → Bây giờ, release 2 + ADR 0024 → Tiếp theo, release 3 + nhật ký kiểm toán → Sau đó; `### Phần cố định cho nợ và nền tảng`: mỗi sprint dành một phần năm số điểm cho món trong `tech-debt-register.md` (chọn theo ước lượng lãi/gốc) và việc nền tảng, lý do: trả nợ không phải thắng từng tính năng; `### Đã dời` bảng mục | từ → sang | lý do | sprint (ít nhất một dòng); `### Xem lại` mỗi quý và khi chiến lược đổi. Không ngày lịch thật, không tên người. Thêm dòng STAGE.md."
    suggested_path: "docs/team/roadmap.md"
  - lesson: management.l4.release-train
    need: "Tạo `docs/team/release-calendar.md` (tiếng Việt, `### `, không `## `/`**`): `### Chuyến phát hành` mỗi cuối sprint hai tuần, chỉ cho thay đổi cửa hàng thấy được: bật feature flag theo `feature-flags.md`; code vẫn lên production ngày nào cũng được qua canary của ADR 0019 với flag tắt; `### Trước mỗi chuyến` ghi chú phát hành gửi cửa hàng trước 5 ngày làm việc, thay đổi chưa sẵn sàng lúc đó đi chuyến sau, chuyến không chờ; `### Ngoài lịch` sửa sự cố và lỗ hổng không chờ chuyến, ai được phát hành ngoài lịch (theo vai trò, khớp `incident-response.md`) và cách báo cửa hàng; `### Đổi phá vỡ` báo trước ít nhất hai chuyến; `### Cái giá` thay đổi đã xong có thể chờ tới hai tuần mới bật. Ghi rõ stage-4 API chưa có flag, đây là quy ước. Thêm dòng STAGE.md."
    suggested_path: "docs/team/release-calendar.md"
  - lesson: management.l4.compliance-controls
    need: "Tạo `docs/team/compliance-controls.md` (tiếng Việt, `### `, không `## `/`**`; không nêu luật, chuẩn, chứng nhận hay số hiệu quy định): `### Bối cảnh` một khách hàng là chuỗi cửa hàng thuộc một ngân hàng gửi danh sách yêu cầu (viết chung chung, đánh số TT-1…TT-7): thay đổi production có người duyệt khác người làm; truy được ai làm gì với đơn và hoàn tiền; khóa ký hóa đơn không rời thiết bị bảo vệ khóa; sao lưu và thử khôi phục định kỳ có biên bản; biết mọi thành phần phần mềm đang chạy và lỗ hổng đã biết; dữ liệu ở nơi hợp đồng quy định; rà soát quyền truy cập định kỳ. `### Bảng kiểm soát`: yêu cầu | biện pháp kiểm soát | bằng chứng | sinh tự động hay làm tay | khoảng trống + kế hoạch — ghi đúng hiện trạng stage-4: TT-1 trong lab một commit của `gitops-promote.sh` là đủ để lên production (khoảng trống: bắt buộc pull request có người duyệt khác tác giả trên repo cấu hình production), bằng chứng lịch sử Git; TT-2 `audit-log.md` mới là thiết kế (khoảng trống); TT-3 ADR 0015/0023 đã quyết, chưa dựng; TT-4 output `restore-test`/DR drill, bản sao lưu chưa rời máy (ADR 0020); TT-5 SBOM, kết quả quét, chữ ký, attestation do `ci.yml` sinh mỗi build; TT-6 điều kiện mở lại của ADR 0022; TT-7 khoảng trống. `### Nguyên tắc`: bằng chứng do pipeline sinh ưu tiên hơn gom tay; khoảng trống ghi ra, không giấu. Thêm dòng STAGE.md."
    suggested_path: "docs/team/compliance-controls.md"

open_questions:
  - "Chia các mục L4 của track management giữa hai module: ở đây = governance nhẹ, chiến lược kỹ thuật và hiện đại hóa (strangler fig), quyết định trong bất định, ma trận có trọng số, roadmap, release train, tuân thủ ngân hàng/nhà nước; `management/teams-and-leadership` = scaling team, Team Topologies, mentoring, trình bày cho lãnh đạo, tổ chức trực/DevOps/platform team, văn hóa blameless cấp tổ chức. Đề xuất: chấp nhận."
  - "Ma trận chấm điểm có trọng số là bài riêng ở đây (term `weighted-scoring-matrix`, alias 'weighted decision matrix'); outline `design.l4.reduced-atam` (học trước) nhắc cụm này bằng lời nên khi sinh bài đó L15 có thể báo W. Đề xuất: không sửa outline design; người sinh bài `reduced-atam` diễn đạt bằng lời thường (vd 'một bảng cộng điểm có trọng số'), W chấp nhận được."
  - "Tỉ lệ sprint cố định cho trả nợ: không thành bài riêng, là mục outline 4 của `management.l4.roadmap` (một phần năm số điểm mỗi sprint, là chính sách của dự án, không phải số liệu thị trường); `teams-and-leadership` không dạy lại. Đề xuất: chấp nhận."
  - "ADR 0024 = dùng dịch vụ gửi email bên ngoài qua SMTP (Dịch vụ A giả định), đã chấp nhận, không code ở stage-4; ADR GĐ4 tiếp theo từ 0025. Đề xuất: chấp nhận."
  - "Tuân thủ chỉ dạy chung (yêu cầu → biện pháp kiểm soát → bằng chứng → khoảng trống), không luật/chuẩn/chứng nhận/số hiệu quy định vì versions.yaml không có khóa `standards` tương ứng; `sysdesign/problems` (ký số cho ngân hàng) dùng lại 3 term `compliance`, `compliance-control`, `separation-of-duties`, không định nghĩa lại. Đề xuất: chấp nhận, không thêm khóa versions.yaml."
  - "Bài `strangler-fig` dùng `stage-3` (Caddyfile và HTTPRoute `api` đưa `/api/v1/refunds` sang Payments) dù hoàn tiền chưa từng nằm trong api: bài trình bày lớp định tuyến là cơ chế strangler fig cần, không nói đó là một lần chuyển hệ cũ đã xong; Đơn Hàng không có hệ thống cũ cần thay. Đề xuất: chấp nhận; không bịa thêm 'hệ thống cũ' ở stage-4."
  - "Chú thích trong `Caddyfile` stage-3 ('More specific than /api/v1/*, so it wins') đặt trong khối `route`, nơi Caddy xét theo thứ tự viết, nên lý do có thể không đúng dù kết quả đúng (khối refunds đứng trước). Outline không nêu lý do. Đề xuất: reviewer 04 kiểm khi sinh bài; `/repo-stage 4` có thể sửa chú thích (stage-3 giữ nguyên, bài trích stage-3 không trích dòng chú thích đó)."
  - "Mục ngộ nhận viết theo kiểu track management GĐ3 ('Seniors often assume…' ở đầu câu), khác các module GĐ4 khác (câu trần); bài sinh ra bỏ tiền tố dưới tiêu đề mục như bài GĐ3. Đề xuất: chấp nhận để đồng nhất trong track."
  - "Con số chính sách trong các file mới (chuyến phát hành mỗi hai tuần theo sprint, ghi chú gửi trước 5 ngày làm việc, đổi phá vỡ báo trước hai chuyến, một phần năm sprint cho nợ) là chính sách của đội Đơn Hàng, không phải số liệu thị trường. Đề xuất: chấp nhận; `/repo-stage 4` đổi số thì sửa outline `roadmap`/`release-train` trước khi sinh bài."
  - "Các lời hẹn GĐ4 không có id trong track management: 'lập ngân sách cả năm' (`total-cost-of-ownership`), 'quy trình mua sắm, đấu thầu' (`evaluating-a-vendor`) — không dạy (khoảng trống chấp nhận); 'chạy song song hai hệ thống ở quy mô lớn' (`exit-plan`) — phần nguyên tắc trả ở `strangler-fig`, dữ liệu ở `backend.l4.expand-and-contract`; 'quản trị quyết định giữa nhiều đội' (`proposing-an-adr`) — trả ở `lightweight-governance`, chi tiết nhiều đội ở `teams-and-leadership`; 'release planning/roadmap' (`forecasting-with-velocity`) — trả ở `roadmap`, `release-train`. Đề xuất: chấp nhận, không sửa depth_notes cũ (chúng không trỏ id)."
  - "Tên file mới (`architecture-governance.md`, `email-service-evaluation.md`, ADR 0024, `technical-strategy.md`, `roadmap.md`, `release-calendar.md`, `compliance-controls.md`) là đề xuất; `/repo-stage 4` đổi tên thì sửa `example_files` trước khi sinh bài. Thứ tự trong `/repo-stage 4`: sau mọi ADR 0011–0023, hai checklist và `incident-response.md`; ADR 0024 trước `architecture-governance.md`; `technical-strategy.md` trước `roadmap.md` trước `release-calendar.md`; có thể trước `fitness-functions.md` (chỉ nhắc tên file)."
