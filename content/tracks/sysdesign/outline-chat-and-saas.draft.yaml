skills:
  - id: sysdesign.problem.support-chat
    title:
      vi: "Thiết kế chat hỗ trợ real-time giữa khách và nhân viên cửa hàng"
      en: "Designing real-time support chat between customers and shop staff"
    prereqs:
      - sysdesign.review.design-review
      - backend.cache.redis
      - backend.resilience.load-limits
      - backend.capacity.planning
  - id: sysdesign.problem.saas
    title:
      vi: "Thiết kế Đơn Hàng thành nền tảng SaaS cho cửa hàng tự phục vụ"
      en: "Designing Đơn Hàng as a self-service SaaS platform for shops"
    prereqs:
      - sysdesign.review.design-review
      - backend.tenancy.fair-share
      - backend.sagas.steps
