open_questions:
  - "Số ADR: 0028 = đối soát hoàn tiền hằng ngày với báo cáo của cổng; 0029 = ký bảng kê cho ngân hàng kèm dấu thời gian và trạng thái thu hồi; đều 'Đã chấp nhận', chưa xây. Đề xuất: chấp nhận; ADR GĐ4 tiếp theo từ 0030."
  - "Stage-4 không có code đối soát hay ký bảng kê: chỉ 6 tài liệu (2 yêu cầu, 2 ADR, 2 design review), trích code stage-3 có sẵn (`fake-gateway/Program.cs`, `Payment.cs`, `RefundSender.cs`, `GatewayRefundClient.cs`) và hai sample ký đã hẹn (`InvoiceSigning.cs`, `InvoiceCertificates.cs`). Đề xuất: chấp nhận, như tiền lệ multi-shop-and-notifications."
  - "'Báo cáo quyết toán' (settlement report): stage-3 không có file tên như vậy; Cổng A có xuất lịch sử hoàn tiền CSV mọi lúc (T7 của payment-gateway-evaluation.md, bước 3 ADR 0010), lab có `GET /v1/refunds` của fake-gateway. Đề xuất: coi đó là báo cáo của cổng; việc báo cáo của Cổng A có liệt kê idempotency key là giả định trong reconciliation-requirements.md với người xác nhận (lập trình viên làm tích hợp). Nếu chủ muốn bỏ term `settlement-report`, bài 1 nói bằng lời 'báo cáo của cổng' và bỏ mục 3 khỏi vocab."
  - "Phạm vi đối soát chỉ gồm hoàn tiền: Đơn Hàng không có luồng thu tiền (refund-design.md, 'Không làm trong thiết kế này'); hoàn tay đơn chuyển khoản của R4 nằm ngoài cổng nên ngoài phạm vi. Đề xuất: chấp nhận, ghi ở mục phạm vi."
  - "Sửa đơn khi cổng đã hoàn mà dòng `failed` (đơn đã về `paid`): `Order.CompleteRefund()` chỉ nhận đơn `refunding` (Entities.cs stage-3), nên gửi lại `payment.refunded` sẽ thành poison message. Đề xuất: không thiết kế bước sửa ở đây — câu hỏi mở trong reconciliation-design-review.md, người phụ trách theo vai trò (đội Đặt hàng của ADR 0025); không đổi code stage-4."
  - "Vai trò sửa chỗ lệch: nhân viên đề xuất, kế toán duyệt (tách nhiệm vụ). Đề xuất: giả định dự án; đổi thì sửa outline bài 2 và 3."
  - "Ký cho ngân hàng: chứng chỉ do CA ngân hàng chỉ định cấp (giả định), khóa riêng cho ngân hàng trong HSM của nhà cung cấp (giữ ADR 0023), HSM riêng bị từ chối theo lý do ADR 0023, mở lại qua điều kiện 'hợp đồng đòi máy riêng' của ADR 0022. Đề xuất: chấp nhận; không quyết lại 0015/0022/0023."
  - "Tài liệu được ký là 'bảng kê hằng tháng các khoản thanh toán và hoàn tiền của các cửa hàng thuộc ngân hàng' do Payments ký (Payments là chủ dữ liệu tiền và người duy nhất gọi HSM theo ADR 0015). Đề xuất: chấp nhận; nếu chủ muốn tài liệu khác (hợp đồng, hóa đơn), chỉ đổi mục 2 bài 5 và tên ADR 0029."
  - "Nội dung TT-1…TT-7 của compliance-controls.md chưa viết (tài liệu stage-4). Đề xuất: bank-signing-requirements.md trỏ TT-n theo số sau khi compliance-controls.md đã viết, không chép lại; outline chỉ nhắc audit log và separation of duties, hai control mà outline management.l4.compliance-controls đã nêu."
  - "Số giả định của dự án: đối soát mỗi ngày, kết quả trước sáng ngày làm việc kế tiếp, chờ thêm một lần chạy trước khi coi dòng thiếu là lệch, giữ dòng báo cáo bằng thời gian giữ dòng hoàn tiền; bảng kê kiểm được 10 năm, nhiều nhất vài trăm bảng kê mỗi tháng, được chờ ký vài giờ, hạn của ngân hàng. Đề xuất: chấp nhận; `/repo-stage 4` đổi số thì sửa outline trước khi sinh bài."
  - "Không nêu số RFC/chuẩn cho CRL, OCSP, dấu thời gian, đóng dấu lại (quyết định 'compliance chung chung, không chuẩn'); claim về cơ chế là `kind: behaviour` ở mức nguyên lý. Đề xuất: chấp nhận; reviewer 04 kiểm bằng tài liệu .NET về `X509Chain`/`X509RevocationMode` cho câu về sample, phần còn lại có thể `unverified` kind concept (không chặn D1)."
  - "Glossary +7: `reconciliation`, `settlement-report`, `certificate-revocation`, `crl` (vi_keep), `ocsp` (vi_keep), `trusted-timestamp`, `timestamp-authority` (vi_keep, alias TSA). `backend.l3.*`/`backend.l4.data-ownership`/`management.l2.*` (học trước) đã dùng chữ 'reconcile/reconciliation' như lời thường → chấp nhận W L15 như tiền lệ `weighted-scoring-matrix`. Đề xuất: chấp nhận."
