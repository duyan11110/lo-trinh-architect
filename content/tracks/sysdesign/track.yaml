      - docs/design/support-chat-design-review.md
      - docs/adr/0032-chat-ho-tro-qua-websocket-trong-service-rieng.md
      - docs/adr/0013-du-lieu-cua-hang-trong-bang-chung.md
      - docs/adr/0016-gioi-han-tai-theo-cua-hang.md
      outline:
      - "Asked why customers get no alert on their phones, the answer is ADR `0017`: there is no phone build, so an unread reply goes out by email under ADR `0027` until one exists."
      - "Asked whether one shop's staff could read another shop's chats, the answer is that every conversation row carries its shop, taken from the access token and guarded by row-level security as ADR `0013` decides."
      - "Asked what a sale day in one shop does to chat in the others, the review records a risk and a cap on open connections per shop in the style of ADR `0016`, set only after connections are measured."
      - "Asked why chat is not one more module of `DonHang.Api`, the answer is ADR `0032`'s driver: connections held for a long time would share the Pods, limits and canary releases of the process taking orders."
      - "`support-chat-design-review.md` keeps every challenge with its answer, the driver or ADR it traces to, and an owner by role when it stays open."
      misconceptions:
      - "If a reviewer asks for phone notifications, the chat design is unfinished."
      - "Hiding other shops' conversations in the staff screen is enough to keep them apart."
      - "A new service for chat is over-engineering when a module would do."
      depth_notes: "Không quyết lại ADR 0013, 0016, 0017, 0019. Không dựng giới hạn kết nối theo cửa hàng ở stage-4. Không dạy lại trả lời phản biện, giới hạn theo cửa hàng — sysdesign.l4.answering-challenges, backend.l4.per-shop-limits. Bài toán SaaS — sysdesign.l4.saas-requirements."
    - id: sysdesign.l4.saas-requirements
      title:
        vi: "Nền tảng SaaS cho cửa hàng tự đăng ký, tự chọn gói và tự rời đi"
        en: "A SaaS platform lets a shop sign up, pick a plan and leave on its own"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.saas]
      prereqs:
      - sysdesign.l4.support-chat-challenges
      - sysdesign.l4.multi-shop-challenges
      - backend.l4.shop-data-layout
      - design.l4.a-thousand-shops
      related:
      - sysdesign.l4.clarifying-requirements
      - backend.l4.shop-id-rollout
      - devops.l3.point-in-time-recovery
      - management.l4.compliance-controls
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/saas-platform-requirements.md
      - docs/team/multi-shop-requirements.md
      - docs/adr/0013-du-lieu-cua-hang-trong-bang-chung.md
      - docs/design/multi-shop-data-rollout.md
      outline:
      - "The SaaS problem starts from decisions it does not reopen: one shared deployment (ADR `0012`), shared tables (ADR `0013`), per-shop limits (ADR `0016`) and a large shop's own database (ADR `0026`)."
      - "What they leave open is the shop's own path: under ADR `0013` opening a shop is adding a row to `shops`, but nothing says who adds it, what a shop may configure, which plan it is on or how it leaves."
      - "`saas-platform-requirements.md` writes this as scenarios with a measure: a shop signs up and takes its first order within minutes (assumed), sets its name and brand without a deploy, and changes plan itself."
      - "A clarifying question fixes what leaving means: the shop gets an export of its data, its rows are deleted after a grace period (assumed), and copies in backups end only when those backups expire."
      - "The estimate finds sign-ups few per day (assumed), so opening a shop is a correctness problem, not a load problem; the driver that grows is cost, since each plan's price must cover its shops' share."
      - "The ranked drivers are: a shop opens with nobody at Đơn Hàng acting, no shop's settings reach another shop, each plan's cost per shop is known, and a leaving shop's data is gone by a stated date."
      misconceptions:
      - "Multi-tenancy is already designed, so a SaaS platform has nothing left to decide."
      - "Letting shops sign up on their own is mainly a question of load."
      - "Once a shop's rows are deleted, its data is gone everywhere at the same moment."
      depth_notes: "Không quyết lại ADR 0012, 0013, 0016, 0026. Không dạy giá, thanh toán định kỳ, hóa đơn gói, quy định pháp lý về dữ liệu. Không dạy lại multi-tenancy, PITR — backend.l3.multi-tenancy, devops.l3.point-in-time-recovery. Thiết kế — sysdesign.l4.saas-design."
    - id: sysdesign.l4.saas-design
      title:
        vi: "Mở một cửa hàng là chuỗi bước mà bước nào cũng chạy lại được"
        en: "Opening a shop is a chain of steps, each safe to run again"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.saas]
      prereqs:
      - sysdesign.l4.saas-requirements
      - backend.l3.saga
      - backend.l3.safe-to-repeat-saga-steps
      - frontend.l3.brand-themes
      related:
      - sysdesign.l4.deep-dive
      - devops.l4.feature-flags
      - backend.l2.at-least-once-jobs
      - frontend.l3.accessibility-checks
      - backend.l2.role-based-access
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/saas-platform-design-review.md
      - docs/adr/0033-cua-hang-tu-dang-ky-goi-la-du-lieu.md
      - DonHang.App/lib/design/brand.dart
      - keycloak/donhang-realm.json
      outline:
      - "ADR `0033` keeps a shop's plan and settings as data: its row in `shops` names its plan, and a plan is a set of numbers, such as its share under ADR `0016`'s limits, so changing plan needs no deploy."
      - "A plan's features are settings read from the shop's data and kept as long as the plan exists; they are not release flags, which are removed once a feature is fully on."
      - "`brand.dart` ships one constant `Brand`; under ADR `0033` a shop picks by name among brands built into the app and covered by its tests, so no shop's colours escape the contrast checks."
      - "The deep dive is sign-up: create the `shops` row as pending, create the first staff account in Keycloak with the `staff` role and the shop, send a welcome email, then mark the shop active."
      - "The steps span two owners, Đơn Hàng's database and Keycloak, so no single transaction covers them; a background job runs them as a saga keyed by the sign-up's id, and each step first checks if it is done."
      - "A step that keeps failing leaves the shop pending and listed for staff by role, never half open; the welcome email goes through Notifications at least once."
      misconceptions:
      - "Sign-up can be one transaction that writes the shop and its first staff account together."
      - "A feature only for a higher plan is just another feature flag."
      - "Giving each shop its own colours means building a separate copy of the app for each shop."
      depth_notes: "Không có code đăng ký, gói ở stage-4 (chỉ ADR 0033 và tài liệu). Không dạy API quản trị Keycloak, thanh toán, giá gói. Không dạy lại saga, bước lặp an toàn, brand, feature flag — backend.l3.saga, backend.l3.safe-to-repeat-saga-steps, frontend.l3.brand-themes, devops.l4.feature-flags."
    - id: sysdesign.l4.saas-trade-offs
      title:
        vi: "Biết chi phí của từng cửa hàng phải trả bằng telemetry"
        en: "Knowing each shop's cost is paid for in telemetry"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.saas]
      prereqs:
      - sysdesign.l4.saas-design
      - backend.l3.trace-sampling
      - k8s.l4.requests-drive-cluster-cost
      - backend.l4.error-budget
      related:
      - backend.l4.per-shop-limits
      - devops.l2.histograms-and-percentiles
      - design.l4.trade-off-points
      - management.l3.total-cost-of-ownership
      vocab: [usage-metering]
      example_tag: stage-4
      example_files:
      - docs/design/cost-per-shop.md
      - DonHang.Api/Program.cs
      - deploy/monitoring/tempo.yml
      - docs/design/cluster-cost.md
      outline:
      - "Most of a shop's cost is shared: nodes, databases and the platform serve every shop, so cost per shop is shared cost split by measured use, not a bill each shop runs up alone."
      - "Usage metering counts what each tenant uses; `cost-per-shop.md` meters a few counts, such as ADR `0016`'s requests labelled by shop, orders and stored rows per shop and open chat connections."
      - "Each label value adds time series: a shop label on a counter adds one series per shop, but on a histogram one per shop for every bucket, so per-shop detail stays on counters."
      - "Traces grow with traffic, so they are sampled: a trace starting in the api is kept with probability `Telemetry:SampleRatio`, 0.1 unless configured, and SLIs stay exact because they come from metrics."
      - "The ratio and how long traces are kept follow the SLOs: enough failing requests kept to explain an error budget burn, and traces kept longer than the lab's 24 hours, as long as an investigation takes (assumed)."
      - "The trade-off point is detail against cost: finer metering and more traces give fairer plan prices and faster diagnosis, but every series and span is paid for in storage."
      misconceptions:
      - "We can bill each shop for exactly what it costs, as if it ran alone."
      - "Keeping every trace is the only safe choice; sampling hides problems."
      - "Adding a shop label to every metric is free, since it is only one more label."
      depth_notes: "Số là giả định; không giá thật, không tên nhà cung cấp hay công cụ tính phí. Không dạy tail sampling, sampling trong Alloy. Không dạy lại sampling, chi phí cluster, error budget — backend.l3.trace-sampling, k8s.l4.requests-drive-cluster-cost, backend.l4.error-budget."
    - id: sysdesign.l4.saas-challenges
      title:
        vi: "Câu phản biện về nền tảng SaaS được trả lời bằng ADR 0012, 0016, 0022 và 0033"
        en: "SaaS challenges are answered from ADRs 0012, 0016, 0022 and 0033"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.saas]
      prereqs:
      - sysdesign.l4.saas-trade-offs
      - sysdesign.l4.answering-challenges
      - backend.l4.data-ownership
      - k8s.l4.choosing-managed-kubernetes
      related:
      - design.l4.one-deployment-for-all-shops
      - backend.l4.per-shop-limits
      - sysdesign.l4.reporting-design
      - management.l3.superseding-an-adr
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/saas-platform-design-review.md
      - docs/adr/0033-cua-hang-tu-dang-ky-goi-la-du-lieu.md
      - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
      - docs/design/data-ownership.md
      outline:
      - "Asked to give a large customer its own copy of the platform, the answer is ADR `0012`'s reopen condition: a contract that demands one, served without changing how the other shops are served."
      - "Asked whether a shop on the cheapest plan can slow a shop on a higher one, the answer is ADR `0016`: limits cap each shop's share, and a plan changes only the size of that cap, never reserves capacity."
      - "Asked to show a departed shop's data is gone, the answer walks the copies in `data-ownership.md`: rows deleted in each service's database, reporting rows rebuilt, cached copies expired, backups aged out."
      - "Asked why a premium shop does not get a cluster of its own, the answer is ADR `0022` and the platform's fixed cost per cluster, which that shop's plan would have to carry alone."
      - "`saas-platform-design-review.md` keeps every challenge with its answer, the driver or ADR it traces to, and an owner by role when it stays open."
      misconceptions:
      - "A customer who pays more should always get a deployment of its own."
      - "A premium plan means capacity is set aside for that shop alone."
      - "Deleting a shop's rows from the main database is enough to say its data is gone."
      depth_notes: "Không quyết lại ADR 0012, 0013, 0016, 0022, 0026. Không dạy quy định pháp lý về xóa dữ liệu. Không dạy lại trả lời phản biện, chủ dữ liệu, thay thế ADR — sysdesign.l4.answering-challenges, backend.l4.data-ownership, management.l3.superseding-an-adr. Bài kết — sysdesign/architect-daily."
  - id: architect-daily
    title:
      vi: "Kiến trúc sư thật làm gì mỗi ngày"
      en: "What an architect actually does every day"
    stage: 4
    summary:
      vi: "Nhìn mọi kỹ năng của lộ trình trong một tuần làm việc của kiến trúc sư Đơn Hàng — review, ADR, trao đổi, xem lại quyết định cũ, chọn việc không quyết — rồi tự đánh giá mình còn thiếu loại tài liệu nào để biết bước học tiếp theo."
      en: "See every skill of the path at work in one week of Đơn Hàng's architect, from reviews, ADRs and conversations to checking past decisions and choosing what not to decide, then assess which kind of document you cannot yet write alone to choose what to practise next."
    lessons:
    - id: sysdesign.l4.an-architects-week
      title:
        vi: "Một tuần của kiến trúc sư xoay quanh quyết định để người khác thực hiện"
        en: "An architect's week goes to decisions others can carry out"
      main_path: true
      duration_min: 13
      skills: [sysdesign.practice.architect-role]
      prereqs:
      - sysdesign.l4.saas-challenges
      - sysdesign.l4.design-review-doc
      - management.l4.mentoring
      - management.l4.presenting-to-leadership
      related:
      - management.l3.proposing-an-adr
      - backend.l4.backend-review-checklist
      - devops.l4.blameless-postmortems
      - management.l4.roadmap
      - management.l4.lightweight-governance
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/architect-week.md
      - docs/design/design-review-template.md
      - docs/team/mentoring-plan.md
      - docs/adr/README.md
      outline:
      - "`architect-week.md` logs one assumed week of Đơn Hàng's architect, a role that works across the three teams of ADR `0025`, and names for each activity the file or record it leaves behind."
      - "Most of the week goes to reviews and documents: a design review, comments on a proposed ADR, a pull request checked against a review checklist, a postmortem read and a roadmap check."
      - "Writing code is a small share of the week, assumed, kept for work that tests a decision, such as pairing on a fitness function, because an architect far from the code loses sight of what decisions cost."
      - "Each activity ends in a recorded output, such as an ADR, an answered review question or a risk with an owner, so the decision outlives the meeting and the next person finds it without asking."
      - "The audience changes through the week: developers get the reason behind a rule, the product owner gets trade-offs as outcomes, and leadership gets the decision asked of them first."
      - "Every activity in the log was taught earlier in the path; the week shows how they fit together, not how to do any one of them."
      misconceptions:
      - "An architect spends most of the day drawing diagrams of the system."
      - "Once you become the architect, you stop writing code completely."
      - "A decision agreed in a meeting is done; writing it down afterwards is just paperwork."
      - "The architect talks mostly to developers; talking to leadership is the manager's job."
      depth_notes: "Không dạy lại design review, đề xuất ADR, mentoring, brief lãnh đạo, postmortem — sysdesign.l4.design-review-doc, management.l3.proposing-an-adr, management.l4.mentoring, management.l4.presenting-to-leadership. Không nói lương, chức danh, lộ trình thăng tiến."
    - id: sysdesign.l4.architecture-health-review
      title:
        vi: "Mỗi quý xem lại sức khỏe kiến trúc để biết quyết định cũ còn đúng"
        en: "A quarterly health review checks that past decisions still hold"
      main_path: true
      duration_min: 13
      skills: [sysdesign.practice.architecture-upkeep]
      prereqs:
      - sysdesign.l4.an-architects-week
      - management.l4.deciding-under-uncertainty
      - design.l4.mapping-fitness-functions
      - design.l4.quantifying-technical-debt
      related:
      - management.l4.lightweight-governance
      - management.l3.superseding-an-adr
      - management.l4.technical-strategy
      - backend.l4.error-budget
      - devops.l4.delivery-metrics
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/architecture-health-review.md
      - docs/team/architecture-governance.md
      - docs/design/fitness-functions.md
      - docs/team/tech-debt-register.md
      outline:
      - "A decision can go stale while nobody touches it: the assumptions behind an ADR can stop holding while its text, and every check that guards it, stay exactly the same."
      - "`architecture-health-review.md` records one assumed quarterly review that reads inputs already kept: the watched assumptions in `architecture-governance.md`, the gaps in `fitness-functions.md`, the debt register and the SLOs."
      - "Each row read ends in one recorded choice: keep it, add a check, put an item on the roadmap, or propose a new ADR that supersedes the old one; a row with no choice yet stays visibly open."
      - "A reopen signal that has appeared leads to a proposed ADR, never to editing the accepted one; a signal that has not appeared is recorded as checked, so 'still holds' is a finding, not a guess."
      - "Known gaps, such as production running without Prometheus, are checked for a roadmap item and an owner by role, because a gap that everyone knows about but nobody owns stays open."
      - "The review is short because its inputs exist already; the architect's part is reading them side by side, which no single team's document does."
      misconceptions:
      - "Once an ADR is accepted, it stays correct until someone finds a bug in the code."
      - "If every check in CI is green, the architecture is healthy."
      - "An architecture review is only needed when a big new feature is planned."
      - "When an ADR's assumption turns out wrong, the ADR should be edited to match."
      depth_notes: "Không dạy lại tín hiệu mở lại, fitness function, lượng hóa nợ, error budget, thay thế ADR — management.l4.deciding-under-uncertainty, design.l4.mapping-fitness-functions, design.l4.quantifying-technical-debt, backend.l4.error-budget, management.l3.superseding-an-adr. Không quyết lại ADR nào."
    - id: sysdesign.l4.deciding-what-not-to-decide
      title:
        vi: "Kiến trúc sư chỉ giữ quyết định vắt qua nhiều đội hoặc khó đảo ngược"
        en: "An architect keeps the decisions that cross teams or are hard to undo"
      main_path: true
      duration_min: 13
      skills: [sysdesign.practice.architect-role]
      prereqs:
      - sysdesign.l4.architecture-health-review
      - management.l4.lightweight-governance
      - management.l4.deciding-under-uncertainty
      - management.l4.technical-strategy
      related:
      - management.l4.mentoring
      - management.l4.team-interaction-modes
      - devops.l4.golden-path
      - k8s.l4.when-a-mesh-pays-off
      - design.l4.over-abstraction
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/architect-week.md
      - docs/team/architecture-governance.md
      - docs/team/technical-strategy.md
      - docs/adr/0021-chua-dung-service-mesh.md
      outline:
      - "Each decision the architect takes for a team is one the team does not learn to take, so the architect keeps the decisions that cross team boundaries or are costly to undo and leaves the rest."
      - "The requests handed back in `architect-week.md` show how: a question inside a team's decision rights is answered by pointing to the rule or checklist that settles it, not by a ruling."
      - "When a team, within its decision rights, chooses differently from what the architect would, the architect states the concern in review and lets the choice stand, because the team carries its cost."
      - "Saying no rests on a written reason: a request for a service mesh is answered with the reopen conditions of ADR `0021` and the strategy's list of what the team will not do, not with taste."
      - "A decision not needed yet is left open on purpose, with the signal that would make it needed, so the architect does not decide early on facts that do not exist yet."
      - "Checklists, templates and the golden path let teams take decisions alone; fewer questions reaching the architect each quarter is a sign the role works, not that it is fading."
      misconceptions:
      - "A good architect takes every technical decision, so that the system stays consistent."
      - "If a team picks a solution I would not pick, I should overrule it."
      - "When the architect says no to a request, it is just the architect's personal opinion."
      - "Leaving a question undecided means the architect has not done the job."
      depth_notes: "Không dạy lại quyền quyết định, quyết định đảo ngược được, chiến lược kỹ thuật, mentoring — management.l4.lightweight-governance, management.l4.deciding-under-uncertainty, management.l4.technical-strategy, management.l4.mentoring. Không quyết lại ADR 0021."
    - id: sysdesign.l4.where-to-go-next
      title:
        vi: "Bước tiếp theo là loại tài liệu bạn chưa tự viết được một mình"
        en: "Your next step is the document you cannot yet write on your own"
      main_path: true
      duration_min: 12
      skills: [sysdesign.practice.self-assessment]
      prereqs:
      - sysdesign.l4.deciding-what-not-to-decide
      - sysdesign.l4.answering-challenges
      - sysdesign.l4.bank-signing-challenges
      - management.l4.mentoring
      related:
      - sysdesign.l4.system-design-steps
      - management.l3.architecture-decision-record
      - design.l4.architecture-review-findings
      - management.l2.design-doc
      - devops.l4.blameless-postmortems
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/architecture-skills-checklist.md
      - docs/team/mentoring-plan.md
      - STAGE.md
      - docs/adr/README.md
      outline:
      - "`architecture-skills-checklist.md` lists the kinds of document Đơn Hàng's decisions live in, from a requirements document to a leadership brief, each with an example file in the repository."
      - "Each row is rated in three steps: written with the template and help, written alone, and defended under challenge; the last step matters because a design you cannot defend is not yet understood."
      - "The weakest row, not the most interesting topic, picks what to practise next; the table in `STAGE.md` maps its example file to the topic it was used for, which leads back to those lessons."
      - "Redoing a module's exercise on a new problem, such as a new Đơn Hàng feature, shows more about a weak row than reading the lessons again."
      - "After the path, practice moves to a real system: write the design review and the ADR for the next real decision, then a quarter later compare the consequences it predicted with what happened."
      - "The checklist also names the gaps this path left on purpose as places to study next, and `mentoring-plan.md` uses the same rows to pick a developer's next task."
      misconceptions:
      - "Finishing every lesson of the path means I am now an architect."
      - "The best next step is whichever topic I found most interesting."
      - "Reading a lesson again is the best way to fix a weak area."
      - "Once a decision is shipped, there is nothing more to learn from it."
      depth_notes: "Không nói chức danh, lương, tuyển dụng hay lộ trình thăng tiến. Không dạy lại nội dung module nào; mỗi dòng chỉ trỏ về chủ đề đã dạy. Không thêm bài toán mới, không ADR mới."
