      - backend.l3.outbox-relay
      - management.l3.total-cost-of-ownership
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/product-search-design-review.md
      - docs/adr/0030-tim-san-pham-bang-full-text-search-cua-postgresql.md
      - DonHang.Catalog/ProductCache.cs
      - docs/design/capacity-plan.md
      outline:
      - "The review records where search runs as a trade-off point: inside PostgreSQL there is nothing new to run and no copy to sync, but search queries share the database with orders."
      - "Matching whole normalised words finds no product for a misspelt word and knows no synonyms; the review accepts this until measured complaints (assumed) meet ADR `0030`'s reopen condition."
      - "A separate search engine would offer richer matching and its own capacity, but it is a read model fed from Catalog's changes, so it lags behind `products` and needs a way to be rebuilt."
      - "Search load is held by limits already planned: the `catalog-reads` ceiling per process, per-shop limits of ADR `0016`, and moving search to the replica, which the product list's tolerance for stale data allows."
      - "`ProductCache` stores products by `id` for 5 minutes, so it does not answer searches; caching results by search words is left out, because the review assumes most searches differ."
      misconceptions:
      - "A dedicated search engine is always better, so staying in PostgreSQL is only a shortcut."
      - "If search runs on the replica, a product changed a second ago must still show its new name."
      - "Caching each search's results will remove the load, just as `ProductCache` does for product pages."
      depth_notes: "Số là giả định; không giá, không tên công cụ tìm kiếm. Không dạy lại điểm đánh đổi, định tuyến đọc, giới hạn theo cửa hàng, read model — design.l4.trade-off-points, backend.l4.read-routing, backend.l4.per-shop-limits, design.l3.read-model. Không đổi `Program.cs` hay `ProductCache`."
    - id: sysdesign.l4.product-search-challenges
      title:
        vi: "Câu phản biện về tìm kiếm được trả lời bằng ADR 0017, 0026 và 0030"
        en: "Search challenges are answered from ADRs 0017, 0026 and 0030"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.search]
      prereqs:
      - sysdesign.l4.product-search-trade-offs
      - sysdesign.l4.answering-challenges
      - sysdesign.l4.multi-shop-design
      related:
      - frontend.l4.client-technology-drivers
      - management.l3.superseding-an-adr
      - sysdesign.l4.multi-shop-challenges
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/product-search-design-review.md
      - docs/adr/0030-tim-san-pham-bang-full-text-search-cua-postgresql.md
      - docs/adr/0017-giu-mot-ma-flutter-cho-moi-nen-tang.md
      - docs/adr/0026-cua-hang-lon-chuyen-sang-database-rieng.md
      outline:
      - "Asked why customers cannot find our products from a search engine, the answer is ADR `0017`: public pages are HTML from the server, decided separately, and they would read the same Catalog."
      - "Asked why Đơn Hàng does not use a search engine, the answer is the estimate and the drivers, and ADR `0030` names the condition that reopens it rather than ruling it out."
      - "Asked what happens to search when a large shop moves to its own database under ADR `0026`, the answer is that the searchable words live in the shop's own product rows, so they move with them."
      - "Asked whether search can slow ordering at a sales peak, the answer points to `catalog-reads`, ADR `0016`'s per-shop limits and the replica trigger in `capacity-plan.md`."
      - "`product-search-design-review.md` keeps every challenge with its answer, the driver or ADR it traces to, and an owner by role when it stays open."
      misconceptions:
      - "If a reviewer asks for a feature the design lacks, such as typo tolerance, the design is wrong."
      - "Once a shop has its own database, searching its products needs a different design."
      - "A challenge about search engines means ADR `0017` must be decided again now."
      depth_notes: "Không quyết lại ADR 0016, 0017, 0026. Không dạy lại trả lời phản biện, thay thế ADR — sysdesign.l4.answering-challenges, management.l3.superseding-an-adr. Bài toán báo cáo — sysdesign.l4.reporting-requirements."
    - id: sysdesign.l4.reporting-requirements
      title:
        vi: "Báo cáo đọc rất nhiều đơn trong khi đặt hàng chỉ đụng vài dòng"
        en: "A report reads many orders where placing an order touches a few"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.analytics]
      prereqs:
      - sysdesign.l4.product-search-challenges
      - sysdesign.l4.multi-shop-challenges
      - backend.l4.read-routing
      - backend.l3.row-level-security
      related:
      - sysdesign.l4.clarifying-requirements
      - foundation.l1.time-and-timezones
      - backend.l4.data-ownership
      - sysdesign.l4.payment-reconciliation-requirements
      vocab: [analytical-query]
      example_tag: stage-4
      example_files:
      - docs/team/reporting-requirements.md
      - db/queries/revenue-by-customer.sql
      - db/queries/orders-by-day.sql
      - docs/design/multi-shop-design-review.md
      outline:
      - "An analytical query turns many rows into a few figures about a period, such as revenue per day, while placing an order reads and writes a few rows of one order."
      - "The reporting problem starts from questions left open: `multi-shop-design-review.md` asks how a report across all shops reads a shop with its own database, and `capacity-plan.md` keeps all reads on the primary."
      - "Since stage-3 payments live in `donhang_payments` and orders in `donhang`, so a revenue report like `revenue-by-customer.sql` can no longer be one query: a plain PostgreSQL query reads only the database its connection opened."
      - "`reporting-requirements.md` names two readers, a shop's staff seeing only their shop and Đơn Hàng's own team seeing all shops, and accepts figures up to two hours old (assumed), each shown with its as-of time."
      - "A clarifying question fixes what a day is: `orders-by-day.sql` shows orders that fall on different days in UTC and in Vietnam time, so the requirements define days in Vietnam time (assumed)."
      - "The ranked drivers are: reports never take capacity ordering needs, each shop sees only its own figures, and reports across shops include shops in their own databases."
      misconceptions:
      - "A report is just a bigger `SELECT`, so it can run on the same database as everything else."
      - "Reports must always show figures up to the second, or nobody will trust them."
      - "Every shop's figures are in one database, so a report across shops is one query."
      depth_notes: "Không dạy công cụ BI, biểu đồ; không quy định kế toán. Không dạy lại GROUP BY, múi giờ, row-level security, định tuyến đọc — foundation.l1.sql-group-by, foundation.l1.time-and-timezones, backend.l3.row-level-security, backend.l4.read-routing. Thiết kế — sysdesign.l4.reporting-design."
    - id: sysdesign.l4.reporting-design
      title:
        vi: "Một job chép tổng theo ngày của từng cửa hàng vào database báo cáo riêng"
        en: "A job copies daily totals per shop into a reporting database"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.analytics]
      prereqs:
      - sysdesign.l4.reporting-requirements
      - design.l3.read-model
      - backend.l3.cross-shard-queries
      - sysdesign.l4.multi-shop-design
      related:
      - backend.l4.data-ownership
      - backend.l3.read-replicas
      - k8s.l2.scheduled-backups
      - sysdesign.l4.deep-dive
      vocab: [etl]
      example_tag: stage-4
      example_files:
      - docs/design/reporting-design-review.md
      - docs/adr/0031-bao-cao-tu-database-bao-cao-rieng.md
      - DonHang.Domain/OrderMessage.cs
      - db/replica/start.sh
      outline:
      - "ETL is a scheduled job that extracts data from its sources, transforms it into the shape the readers need, and loads it into a separate store."
      - "ADR `0031` adds a reporting database on a server of its own (assumed): every hour (assumed) a job reads `donhang`, `donhang_payments` and every database the shop map lists, and writes totals per shop per day."
      - "Report queries read only the reporting database, so a long analytical query uses none of the primary's connections; the job's own reads are short queries for recent days."
      - "Each summary row carries the shop's id, so a shop's staff read only their shop's rows, guarded as ADR `0013` guards shared tables, while Đơn Hàng's own team reads across shops."
      - "The deep dive is a shop moving under ADR `0026`: the job reads the shop map on every run, so the shop's figures come from its new database and reports across shops stay complete."
      - "Rejected: reports on `db-replica`, which copies the whole `db` server but still cannot join two databases in one query; and a read model fed by order messages, which carry no amounts or items."
      misconceptions:
      - "A read replica is already a reporting database, so nothing else is needed."
      - "The reporting tables become the place where revenue is decided."
      - "The cleanest way to fill a reporting database is from the messages we already publish."
      depth_notes: "Không code ETL ở stage-4 (chỉ ADR 0031, tài liệu). Không tên công cụ ETL, database phân tích; không star schema. Không dạy lại read model, scatter-gather, shard map, CronJob — design.l3.read-model, backend.l3.cross-shard-queries, sysdesign.l4.multi-shop-design, k8s.l2.scheduled-backups."
    - id: sysdesign.l4.reporting-trade-offs
      title:
        vi: "Chép theo lô đổi độ mới của số liệu lấy việc không phải sửa message"
        en: "Copying in batches trades freshness for no change to messages"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.analytics]
      prereqs:
      - sysdesign.l4.reporting-design
      - design.l4.trade-off-points
      - backend.l4.message-schema-evolution
      - design.l3.event-projections
      related:
      - devops.l3.rpo-and-rto
      - backend.l3.eventual-consistency
      - sysdesign.l4.payment-reconciliation-trade-offs
      - backend.l2.at-least-once-jobs
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/reporting-design-review.md
      - docs/adr/0031-bao-cao-tu-database-bao-cao-rieng.md
      - docs/design/data-ownership.md
      - DonHang.Domain/OrderMessage.cs
      outline:
      - "The review records the run's interval as a trade-off point: running every hour keeps the sources' extra load small, but a report may be an hour behind plus any replication lag."
      - "Feeding reports from messages would be fresher, but every order message would need amounts and items, a schema change every reader must accept, and past orders cannot be read again from the broker."
      - "Each run recomputes the last few days (assumed) and replaces those days' rows, so a repeated run gives the same result and a late cancellation or refund still reaches its day."
      - "Totals per shop per day answer the agreed questions quickly, but a new question, such as sales per hour, needs a new summary filled again from the sources."
      - "The reporting database holds only copies it can rebuild from the owners' data, so the review accepts rebuilding it instead of restoring it, at the cost of the time a rebuild takes."
      misconceptions:
      - "An hourly copy is just a slow version of real-time, so real-time is always the better design."
      - "If the job runs twice by accident, every total will be counted twice."
      - "The reporting database needs the same backups and restore targets as the orders database."
      depth_notes: "Số là giả định; không giá, không tên công cụ. Không đổi `OrderMessage`. Không dạy lại điểm đánh đổi, tiến hóa schema message, event projection, RPO — design.l4.trade-off-points, backend.l4.message-schema-evolution, design.l3.event-projections, devops.l3.rpo-and-rto."
    - id: sysdesign.l4.reporting-challenges
      title:
        vi: "Câu phản biện về báo cáo được trả lời bằng việc ai là chủ mỗi con số"
        en: "Reporting challenges are answered from who owns each figure"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.analytics]
      prereqs:
      - sysdesign.l4.reporting-trade-offs
      - sysdesign.l4.answering-challenges
      - sysdesign.l4.payment-reconciliation-design
      related: [sysdesign.l4.multi-shop-challenges, management.l3.superseding-an-adr, backend.l4.pacelc]
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/reporting-design-review.md
      - docs/adr/0031-bao-cao-tu-database-bao-cao-rieng.md
      - docs/design/data-ownership.md
      - docs/adr/0028-doi-soat-hoan-tien-hang-ngay-voi-bao-cao-cua-cong.md
      outline:
      - "Asked why a report's revenue differs from accounting's figure, the answer is data ownership: the reporting database holds copies, Payments owns the money, and its reconciliation under ADR `0028` settles differences."
      - "Asked why reports do not simply read `db-replica`, the answer is the requirements: revenue joins two databases, and shops moved under ADR `0026` sit in databases of their own."
      - "Asked whether one shop's staff could see another shop's totals, the answer is that every summary row carries its shop and is read with the shop taken from the caller's access token."
      - "Asked for a live sales screen, the review records it as a new requirement that reopens ADR `0031`: it would need amounts in the order messages, a change for every reader."
      - "`reporting-design-review.md` keeps every challenge with its answer, the driver or ADR it traces to, and an owner by role when it stays open."
      misconceptions:
      - "When two reports disagree, the newer one is right."
      - "A request for live figures means the batch design was a mistake."
      - "Hiding other shops' totals in the report screen is enough to keep them private."
      depth_notes: "Không quyết lại ADR 0013, 0026, 0028. Không dạy lại trả lời phản biện, chủ dữ liệu, thay thế ADR — sysdesign.l4.answering-challenges, backend.l4.data-ownership, management.l3.superseding-an-adr. Bài toán tiếp theo — sysdesign/chat-and-saas."
  - id: chat-and-saas
    title:
      vi: "Bài toán: chat hỗ trợ real-time và nền tảng SaaS multi-tenant"
      en: "Problems: real-time support chat and a multi-tenant SaaS platform"
    stage: 4
    summary:
      vi: "Dùng khung thiết kế hệ thống cho hai bài toán cuối của Đơn Hàng — cho khách chat với nhân viên cửa hàng và thấy tin trả lời ngay, rồi cho cửa hàng tự đăng ký, chọn gói, rời đi và biết chi phí của từng cửa hàng — đi từ yêu cầu, thiết kế, đánh đổi tới trả lời câu phản biện bằng ADR đã có."
      en: "Apply the system design framework to Đơn Hàng's last two problems, letting customers chat with shop staff and see replies at once, then letting shops sign up, choose a plan and leave while each shop's cost stays known, from requirements through design and trade-offs to answering challenges from recorded ADRs."
    lessons:
    - id: sysdesign.l4.support-chat-requirements
      title:
        vi: "Chat hỗ trợ cần tin trả lời tự hiện trên màn hình không ai tải lại"
        en: "Support chat needs a reply to reach a screen nobody reloads"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.support-chat]
      prereqs:
      - sysdesign.l4.reporting-challenges
      - sysdesign.l4.notification-requirements
      - backend.l4.load-testing
      - frontend.l2.futureprovider-and-asyncvalue
      related:
      - sysdesign.l4.clarifying-requirements
      - sysdesign.l4.back-of-the-envelope
      - design.l4.quality-attribute-scenarios
      - frontend.l3.syncing-the-queue
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/support-chat-requirements.md
      - DonHang.App/lib/providers.dart
      - DonHang.App/lib/screens/order_detail_screen.dart
      - docs/adr/0017-giu-mot-ma-flutter-cho-moi-nen-tang.md
      outline:
      - "At stage-3 every screen of `DonHang.App` shows what it fetched: `orderProvider` fetches an order once and again only when the signed-in customer changes, and the app has no timer that asks the API again."
      - "A support chat between a customer and the shop's staff needs what the system lacks: the server must send a new message to a screen that is already open, without that screen asking for it."
      - "`support-chat-requirements.md` writes the scope as scenarios with a measure: a message shows on the other side within seconds (assumed), staff see only their shop's conversations, history is kept for an assumed period."
      - "A clarifying question settles what happens when the customer is not on the screen: the reply waits in the conversation and an email tells them, because push notifications need a phone build ADR `0017` has not made."
      - "The estimate counts open screens, not requests: by Little's law, conversations open at once equal conversations started per second times how long one stays open, all assumed, while messages per second stay few."
      - "The ranked drivers are: a message reaches an open screen within seconds, no message is lost when delivery fails, staff never see another shop's chats, and chat never takes capacity that ordering needs."
      misconceptions:
      - "Chat is just another endpoint: the app can fetch new messages the way it fetches an order."
      - "If there are only a few messages per second, chat is a small load for the system."
      - "When the customer has closed the app, we can still pop the reply up on their phone."
      depth_notes: "Không quyết lại ADR 0017, không dựng push. Không dạy lại làm rõ yêu cầu, Little's law, kênh email — sysdesign.l4.clarifying-requirements, backend.l4.load-testing, sysdesign.l4.notification-design. Thiết kế — sysdesign.l4.support-chat-design."
    - id: sysdesign.l4.support-chat-design
      title:
        vi: "WebSocket cho server gửi mỗi tin chat ngay khi tin được lưu"
        en: "A WebSocket lets the server send each chat message once it is saved"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.support-chat]
      prereqs:
      - sysdesign.l4.support-chat-requirements
      - sysdesign.l4.deep-dive
      - backend.l2.redis-key-value-store
      - backend.l3.exchanges-and-bindings
      related:
      - sysdesign.l4.high-level-design
      - foundation.l1.tcp-vs-udp
      - backend.l4.data-ownership
      - devops.l4.golden-path
      - sysdesign.l4.notification-design
      vocab: [websocket]
      example_tag: stage-4
      example_files:
      - docs/design/support-chat-design-review.md
      - docs/adr/0032-chat-ho-tro-qua-websocket-trong-service-rieng.md
      - deploy/gitops/config-repo-kustomize/base/redis.yaml
      - deploy/gitops/config-repo/platform/edge/httproutes.yaml
      outline:
      - "A WebSocket starts as an HTTP request asking to switch protocols; once the server accepts, the same TCP connection stays open and either side can send a message at any time."
      - "ADR `0032` puts support chat in a service of its own, `DonHang.Support`, with its own database, so connections held open for minutes never share Pods or limits with the API taking orders."
      - "Each message is saved in PostgreSQL first, with its conversation and shop, and only then sent to that conversation's open connections; the saved row, not the delivery, is the record."
      - "With several Pods, sender and receiver may hold connections to different Pods, so a Pod publishes each saved message to a Redis publish/subscribe channel and every Pod passes it to the connections it holds."
      - "The deep dive is a dropped connection: the app reconnects and asks for the messages after the last id it has, so anything missed while away is read from the database, not from Redis."
      - "A reply the customer has not read within minutes (assumed) leaves through the outbox as a message, and Notifications emails the customer under ADR `0027`."
      misconceptions:
      - "With a WebSocket, a message sent is a message received, so nothing else is needed."
      - "Each Pod only has to deliver to its own connections; the other Pods will take care of theirs."
      - "Redis now holds the chat history, so if Redis goes down the messages are lost."
      depth_notes: "Không có code chat ở stage-4 (chỉ ADR 0032 và tài liệu). Không dạy frame, ping, nén của WebSocket, thư viện client Dart. Không dạy lại Redis, publish/subscribe, outbox — backend.l2.redis-key-value-store, backend.l3.exchanges-and-bindings, backend.l3.outbox-pattern."
    - id: sysdesign.l4.support-chat-trade-offs
      title:
        vi: "Thứ chat hỗ trợ cạn trước là kết nối đang mở, không phải request"
        en: "Open connections, not requests, are what support chat runs out of"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.support-chat]
      prereqs:
      - sysdesign.l4.support-chat-design
      - design.l4.trade-off-points
      - backend.l3.retry-jitter
      - devops.l4.release-strategy-per-component
      related:
      - backend.l4.capacity-planning
      - sysdesign.l4.finding-bottlenecks
      - backend.l2.at-least-once-jobs
      - frontend.l4.library-reach
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/support-chat-design-review.md
      - docs/adr/0032-chat-ho-tro-qua-websocket-trong-service-rieng.md
      - docs/design/capacity-plan.md
      - docs/adr/0019-chien-luoc-phat-hanh-theo-thanh-phan.md
      outline:
      - "The review names the scarce resource: open connections per Pod, each held for a long, mostly idle time, so the chat service's capacity plan counts connections at the peak, not requests per second."
      - "A chat connection holds no database connection: a Pod opens one only to save or read messages, so `max_connections` limits how fast messages are written, not how many customers are connected."
      - "A release closes each replaced Pod's connections, so clients reconnect after a delay with jitter, and a Gateway weight decides only where new connections go; ADR `0032` keeps rolling updates for chat."
      - "Redis publish/subscribe passes a message only to subscribers connected at that moment, at most once; the review accepts this because PostgreSQL keeps every message and a reconnecting app reads what it missed."
      - "Polling every few seconds was rejected: it needs nothing new, but its load grows with open screens times frequency, and a message waits up to one interval; it stays the fallback when a connection cannot open."
      - "SignalR, ASP.NET Core's real-time library, would give reconnection and fan-out between Pods ready-made; ADR `0032` defers it because the app would need a SignalR client for Dart that ASP.NET Core does not ship."
      misconceptions:
      - "A connection that sends nothing costs nothing, so idle chat screens are free."
      - "Each open chat needs its own database connection, so `max_connections` caps how many customers can chat."
      - "A release that restarts the chat Pods loses the messages that were on their way."
      - "Polling is always the wrong choice for chat."
      depth_notes: "Số là giả định. Không dạy giới hạn file handle, keep-alive, timeout của Gateway, sticky session. Không dạy lại điểm đánh đổi, jitter, chiến lược phát hành, at-most-once — design.l4.trade-off-points, backend.l3.retry-jitter, devops.l4.release-strategy-per-component."
    - id: sysdesign.l4.support-chat-challenges
      title:
        vi: "Câu phản biện về chat được trả lời bằng ADR 0013, 0016, 0017 và 0032"
        en: "Chat challenges are answered from ADRs 0013, 0016, 0017 and 0032"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.support-chat]
      prereqs:
      - sysdesign.l4.support-chat-trade-offs
      - sysdesign.l4.answering-challenges
      - backend.l4.per-shop-limits
      related:
      - sysdesign.l4.notification-challenges
      - backend.l4.shop-data-layout
      - management.l3.superseding-an-adr
      vocab: []
      example_tag: stage-4
