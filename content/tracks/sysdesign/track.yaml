levels:
- level: 4
  title:
    vi: "Level 4"
    en: "Level 4"
  modules:
  - id: framework
    title:
      vi: "Khung thiết kế hệ thống"
      en: "A framework for system design"
    stage: 4
    summary:
      vi: "Thiết kế một hệ thống theo từng bước — làm rõ những nhu cầu làm đổi hình dạng thiết kế, ước lượng nhanh, vẽ thiết kế tổng thể, đi sâu vào phần dễ hỏng, tìm nút cổ chai — rồi viết tài liệu review thiết kế và trả lời câu phản biện bằng driver và điểm đánh đổi, trên ví dụ luồng hoàn tiền của Đơn Hàng."
      en: "Design a system in steps, clarifying the needs that change its shape, estimating sizes, sketching a high-level design, diving into the risky parts and finding bottlenecks, then write a design review doc and answer challenges with drivers and trade-offs, on Đơn Hàng's refund flow."
    lessons:
    - id: sysdesign.l4.system-design-steps
      title:
        vi: "Thiết kế hệ thống đi qua từng bước, bước trước nuôi bước sau"
        en: "System design moves through steps that each feed the next"
      main_path: true
      duration_min: 13
      skills: [sysdesign.method.steps]
      prereqs:
      - design.l4.architectural-drivers
      - management.l2.requirements-document
      - management.l2.design-doc
      - management.l3.architecture-decision-record
      related: [design.l4.reduced-atam, backend.l4.capacity-planning, design.l4.evolutionary-architecture]
      vocab: [system-design]
      example_tag: stage-3
      example_files:
      - docs/team/refund-requirements.md
      - docs/design/refund-design.md
      - docs/adr/0003-tach-payments-thanh-service.md
      outline:
      - "System design decides the parts of a whole system, how they connect, where each kind of data lives, and how the system behaves under load and when a part fails."
      - "A workable order of steps is: clarify the requirements, estimate the sizes, sketch the main parts, work out the riskiest parts in detail, then look for what limits or stops the whole."
      - "Each step hands the next what it needs: the ranked drivers say what must be estimated, and the estimate says which parts the design needs at all."
      - "The steps form a loop, not a line: detail that breaks a driver sends the designer back to the sketch, and a missing answer sends them back to the requirements."
      - "Đơn Hàng's refund work left the output of three steps in files: `refund-requirements.md`, `refund-design.md` with its rejected options, and ADR `0003` for the part costly to undo."
      - "None of those files states how many refunds to expect or draws the flow as a diagram; the later lessons of this module add those steps to the same example."
      misconceptions:
      - "System design starts by picking the database and the message broker."
      - "An experienced designer goes straight to the final diagram and needs no steps."
      - "A system design method is for job interviews, not for real projects."
      depth_notes: "Chỉ các bước và vòng lặp; từng bước ở các bài sau. Không dạy lại tài liệu yêu cầu, design doc, ADR — management.l2.requirements-document, management.l2.design-doc, management.l3.architecture-decision-record. Bài toán mới — các module bài toán của sysdesign."
    - id: sysdesign.l4.clarifying-requirements
      title:
        vi: "Trước hết hỏi rõ những nhu cầu làm đổi hình dạng của thiết kế"
        en: "Clarify first the needs that change the shape of the design"
      main_path: true
      duration_min: 13
      skills: [sysdesign.method.requirements]
      prereqs:
      - sysdesign.l4.system-design-steps
      - design.l4.quality-attribute-scenarios
      - backend.l4.service-level-objectives
      - design.l4.a-thousand-shops
      related: [management.l2.non-functional-requirements, design.l4.reduced-atam, backend.l4.cap-theorem]
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/system-design-method.md
      - docs/team/refund-requirements.md
      - docs/adr/0003-tach-payments-thanh-service.md
      outline:
      - "The first step turns a request into a scope, the key operations, quality attribute scenarios and constraints, before any part is drawn."
      - "A list of features rarely changes a design's shape; answers about how many, what may be stale or late, what must never happen and what happens when a dependency fails usually do."
      - "`system-design-method.md` groups its clarifying questions that way and adds constraints that are not features: the team, the deadline, decisions already taken in ADRs, and compliance."
      - "A question nobody can answer yet becomes a stated assumption with the person who will confirm it, so the design can go on now and be checked when the answer comes."
      - "The step ends with a short ranked list of drivers; in the method's refund example it is YC-7, YC-9 and the sensitivity of the gateway key, the drivers ADR `0003` starts from."
      misconceptions:
      - "The requirements are obvious from the feature list, so asking questions first wastes time."
      - "If nobody knows how many users there will be, the design should assume as many as possible."
      - "Every requirement weighs the same, so the design must meet each one at its strictest."
      depth_notes: "Không dạy lại tài liệu yêu cầu, NFR, kịch bản thuộc tính chất lượng, xếp hạng kịch bản — management.l2.requirements-document, design.l4.quality-attribute-scenarios, design.l4.reduced-atam. Không đặt yêu cầu mới cho đa cửa hàng — sysdesign/multi-shop-and-notifications."
    - id: sysdesign.l4.back-of-the-envelope
      title:
        vi: "Ước lượng nhanh cho thấy những thiết kế nào còn đáng xét"
        en: "A rough estimate shows which designs are even in play"
      main_path: true
      duration_min: 14
      skills: [sysdesign.method.estimation]
      prereqs: [sysdesign.l4.clarifying-requirements, backend.l4.load-testing, backend.l4.capacity-planning]
      related: [management.l2.three-point-estimation, backend.l3.sharding, backend.l4.read-routing]
      vocab: [back-of-the-envelope-estimate]
      example_tag: stage-4
      example_files:
      - docs/design/system-design-method.md
      - docs/design/capacity-plan.md
      - docs/design/refund-design.md
      outline:
      - "A back-of-the-envelope estimate is a few minutes of arithmetic with rounded numbers that shows the size of a load or of the data, tens, thousands or millions, not its exact value."
      - "It starts from stated assumptions, keeps the unit at every step, and names the decision it serves, so it stops as soon as the number keeps or rules out an option."
      - "The method's refund example takes the order volume assumed in `capacity-plan.md` and an assumed share of orders refunded, and finds refund requests a small fraction of order traffic."
      - "So load does not shape the refund flow; a failing gateway does, which is why the design spends its effort on retries and idempotency rather than on scaling."
      - "Little's law also sizes what piles up during a failure: with the gateway down for 24 hours, the pending refunds equal their arrival rate times 24 hours, a count one table holds easily."
      - "An estimate comes before anything is built and is replaced by measurement; a capacity plan later checks a planned peak against limits measured by a load test."
      misconceptions:
      - "Estimating in a design means estimating how many days the work will take."
      - "An estimate is useless unless every number in it is exact."
      - "If the estimate shows a small load, there is nothing left to design."
      depth_notes: "Số là giả định của dự án, không số thị trường. Không dạy lại Little's law, kế hoạch dung lượng, kiểm thử tải, ước lượng ba điểm — backend.l4.load-testing, backend.l4.capacity-planning, management.l2.three-point-estimation. Ước lượng cho bài toán mới — các module bài toán của sysdesign."
    - id: sysdesign.l4.high-level-design
      title:
        vi: "Thiết kế tổng thể cho thấy mọi phần mà một thao tác chính đi qua"
        en: "A high-level design shows every part a key operation passes through"
      main_path: true
      duration_min: 13
      skills: [sysdesign.method.design]
      prereqs:
      - sysdesign.l4.back-of-the-envelope
      - backend.l4.data-ownership
      - design.l4.where-boundaries-are-enforced
      - design.l4.over-abstraction
      related: [backend.l3.payments-service, backend.l3.outbox-pattern, management.l2.design-doc]
      vocab: [high-level-design]
      example_tag: stage-4
      example_files:
      - docs/design/system-design-method.md
      - docs/design/refund-design.md
      - docs/design/data-ownership.md
      outline:
      - "A high-level design is one diagram of a system's main parts, such as clients, entry points, services, stores and queues, with the path each key operation takes through them."
      - "It starts with the simplest set of parts that meets the ranked drivers, and each extra part, such as a cache or a queue, must name the driver or the estimate that calls for it."
      - "Each store in the diagram has one owner, as `data-ownership.md` records, so the diagram also shows which service writes which data."
      - "The method's refund diagram follows a request from `DonHang.Api` through its outbox and RabbitMQ to `DonHang.Payments` and the gateway, and the result back as a message."
      - "Walking every key operation through the diagram, including what happens when a part fails, shows a missing part or an unclear owner before any part is detailed."
      misconceptions:
      - "A high-level design should already show the classes and the table columns."
      - "Adding a cache, a queue and a gateway up front makes any design more scalable."
      - "Drawing the normal path of a request is enough; failures can be designed later."
      depth_notes: "Không dạy ký hiệu hay công cụ vẽ sơ đồ có tên; sơ đồ triển khai — các module bài toán của sysdesign. Không dạy lại quyền sở hữu dữ liệu, trừu tượng thừa, outbox — backend.l4.data-ownership, design.l4.over-abstraction, backend.l3.outbox-pattern. Đi sâu — sysdesign.l4.deep-dive."
    - id: sysdesign.l4.deep-dive
      title:
        vi: "Đi sâu vào đúng phần mà thiết kế dễ hỏng nhất"
        en: "A deep dive spends the detail where the design is most likely to fail"
      main_path: true
      duration_min: 14
      skills: [sysdesign.method.design]
      prereqs: [sysdesign.l4.high-level-design, design.l4.trade-off-points, backend.l4.pacelc, backend.l3.saga]
      related:
      - backend.l4.cap-theorem
      - management.l3.weighing-options-in-an-adr
      - backend.l2.idempotent-endpoints
      vocab: [deep-dive]
      example_tag: stage-4
      example_files:
      - docs/design/system-design-method.md
      - docs/design/refund-design.md
      - docs/adr/0003-tach-payments-thanh-service.md
      outline:
      - "A deep dive works out one part of a design in detail; time allows only one to three, so each is chosen where a top driver is hardest to meet or a trade-off point sits."
      - "A deep dive answers fixed questions about its part: the data it owns, the consistency each operation needs, what it does when each dependency fails, and how it grows with load."
      - "The method's refund example dives into sending to the gateway, where YC-9 and YC-10 are hardest to meet, and not into the staff list of failed refunds, which no driver makes hard."
      - "`refund-design.md` is that deep dive: each step is a local transaction, retries reuse the key `refund-<id>`, and the gateway is retried for 24 hours before a row becomes `failed`."
      - "A deep dive ends with what it rejected and why, as `refund-design.md` does for two-phase commit and for calling the gateway inside the customer's request."
      misconceptions:
      - "A thorough design details every part to the same depth."
      - "The deep dive should go into the part the designer knows best, to show expertise."
      - "Once the high-level design is agreed, a deep dive cannot change it."
      depth_notes: "Không dạy lại saga, idempotency key, two-phase commit, PACELC — backend.l3.saga, backend.l2.idempotent-endpoints, backend.l3.two-phase-commit, backend.l4.pacelc. Không đổi thiết kế hoàn tiền, không quyết lại ADR 0003."
    - id: sysdesign.l4.finding-bottlenecks
      title:
        vi: "Nút cổ chai là phần cạn sức đầu tiên khi tải tăng"
        en: "The bottleneck is the first part to run out as load grows"
      main_path: true
      duration_min: 13
      skills: [sysdesign.method.design]
      prereqs: [sysdesign.l4.deep-dive, backend.l4.capacity-planning, k8s.l3.highly-available-entry-point]
      related: [backend.l3.slow-dependencies, backend.l4.read-routing, backend.l3.bulkhead]
      vocab: [bottleneck]
      example_tag: stage-4
      example_files:
      - docs/design/system-design-method.md
      - docs/design/capacity-plan.md
      - docs/design/refund-design.md
      outline:
      - "A bottleneck is the part with the lowest limit on a path; the whole path can carry no more than it, so adding capacity anywhere else changes nothing."
      - "To find it, walk the estimated peak along the high-level design and compare it with each part's limit; `capacity-plan.md` did this for orders and product reads and named what runs out first."
      - "Removing a bottleneck moves it: the part with the next lowest limit takes its place, so a design states which part comes next and at roughly what load."
      - "The same walk lists single points of failure, parts whose loss alone stops a key operation, and says for each whether the operation stops, waits or works in a reduced way."
      - "In the method's refund example the gateway is a single point of failure for completing refunds but not for accepting them, because the outbox and the retries let requests wait."
      misconceptions:
      - "Adding more servers removes any bottleneck."
      - "The slowest piece of code is always the bottleneck."
      - "Once the bottleneck is fixed, the system can grow without limit."
      depth_notes: "Không dạy lại kế hoạch dung lượng, điểm hỏng đơn lẻ, bulkhead — backend.l4.capacity-planning, k8s.l3.highly-available-entry-point, backend.l3.bulkhead. Không đo tải mới, không đổi giới hạn trong `Program.cs`."
    - id: sysdesign.l4.design-review-doc
      title:
        vi: "Tài liệu review thiết kế để người review phản biện quyết định, không phải hình vẽ"
        en: "A design review doc lets reviewers challenge decisions, not drawings"
      main_path: true
      duration_min: 14
      skills: [sysdesign.review.design-review]
      prereqs:
      - sysdesign.l4.finding-bottlenecks
      - management.l4.presenting-to-leadership
      - design.l4.architecture-review-findings
      - management.l3.proposing-an-adr
      related:
      - management.l2.design-doc
      - backend.l4.backend-review-checklist
      - k8s.l4.cluster-review-checklist
      vocab: [design-review]
      example_tag: stage-4
      example_files:
      - docs/design/design-review-template.md
      - docs/design/system-design-method.md
      - docs/design/refund-design.md
      outline:
      - "A design review is a session where others challenge a proposed design before it is built, working from a document they have read in advance."
      - "`design-review-template.md` opens with the decision asked for and the proposal, then gives the ranked drivers, the estimates with their assumptions, the diagram, the deep dives and the bottlenecks."
      - "It ends with the rejected options, the trade-off points, the risks and open questions with who answers them, and the ADRs the design will need, so reviewers attack choices instead of guessing them."
      - "Unlike a design doc for one feature, the review document follows the steps of the method, so a reviewer can tell which step a weakness comes from."
      - "Questions raised in the session are written into the document with their answers, and each one left open gets an owner by role and a next step, like the findings of an architecture review."
      misconceptions:
      - "A design review is where the senior people approve or reject the design."
      - "The more pages and diagrams the document has, the better the review goes."
      - "Reviewers should see the design for the first time in the meeting, so their reactions are fresh."
      depth_notes: "Không dạy lại design doc, trình bày cho lãnh đạo, kết quả đánh giá kiến trúc, đề xuất ADR — management.l2.design-doc, management.l4.presenting-to-leadership, design.l4.architecture-review-findings, management.l3.proposing-an-adr."
    - id: sysdesign.l4.answering-challenges
      title:
        vi: "Trả lời câu phản biện bằng driver hay điểm đánh đổi đứng sau quyết định"
        en: "Answer a design challenge with the driver or trade-off behind it"
      main_path: true
      duration_min: 13
      skills: [sysdesign.review.design-review]
      prereqs:
      - sysdesign.l4.design-review-doc
      - design.l4.trade-off-points
      - management.l4.deciding-under-uncertainty
      related:
      - management.l3.weighing-options-in-an-adr
      - management.l3.superseding-an-adr
      - backend.l4.threat-modeling
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/system-design-method.md
      - docs/design/refund-design.md
      - docs/team/refund-requirements.md
      - docs/adr/0003-tach-payments-thanh-service.md
      outline:
      - "A challenge asks why the design is not another way, or what happens in a case it may not cover; it tests whether the decisions have reasons, not whether the designer is quick."
      - "A good answer names the driver or the trade-off point behind the decision: asked why the gateway is not called inside the customer's request, the answer is YC-7, not a liking for messages."
      - "A challenge that finds a case the design does not cover is recorded as a risk or an open question with its owner, instead of being answered on the spot with an invented fix."
      - "`system-design-method.md` lists sample challenges to the refund design with answers traced to YC numbers, ADR `0003` and the risks in `refund-design.md`, and one answered as still unknown."
      - "When a challenge shows that a driver has changed, the right answer is to reopen the decision with a new ADR, not to defend the old one."
      misconceptions:
      - "A good designer has a ready answer to every question in the review."
      - "Answering 'we do not know yet' in a review shows that the design is weak."
      - "A challenge from a reviewer means the reviewer thinks the design is wrong."
      depth_notes: "Không dạy kỹ năng tranh luận, đàm phán. Không dạy lại điểm đánh đổi, quyết định khi chưa chắc, thay thế ADR — design.l4.trade-off-points, management.l4.deciding-under-uncertainty, management.l3.superseding-an-adr. Phản biện thiết kế ký số ngân hàng — sysdesign/payments-and-signing."
  - id: multi-shop-and-notifications
    title:
      vi: "Bài toán: Đơn Hàng đa cửa hàng và hệ thống thông báo"
      en: "Problems: a multi-shop Đơn Hàng and a notification system"
    stage: 4
    summary:
      vi: "Dùng khung thiết kế hệ thống cho hai bài toán của Đơn Hàng — chuyển một cửa hàng lớn sang database riêng và khôi phục riêng một cửa hàng, rồi gửi thông báo qua nhiều kênh — đi từ yêu cầu, thiết kế, đánh đổi tới trả lời câu phản biện bằng ADR đã có."
      en: "Apply the system design framework to two Đơn Hàng problems, moving a large shop to its own database with restoring one shop alone, then sending notifications over several channels, from requirements through design and trade-offs to answering challenges from recorded ADRs."
    lessons:
    - id: sysdesign.l4.multi-shop-requirements
      title:
        vi: "Bài toán đa cửa hàng bắt đầu từ những điều ADR 0012–0016 còn để mở"
        en: "The multi-shop problem starts from what ADRs 0012–0016 left open"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.multi-shop]
      prereqs:
      - sysdesign.l4.answering-challenges
      - backend.l4.shop-id-rollout
      - backend.l4.per-shop-limits
      - devops.l3.point-in-time-recovery
      related:
      - sysdesign.l4.clarifying-requirements
      - design.l4.a-thousand-shops
      - backend.l4.shop-data-layout
      - devops.l3.rpo-and-rto
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/multi-shop-open-requirements.md
      - docs/team/multi-shop-requirements.md
      - docs/adr/0013-du-lieu-cua-hang-trong-bang-chung.md
      - docs/design/multi-shop-data-rollout.md
      outline:
      - "The multi-shop problem does not start from a blank page: ADRs `0012`, `0013` and `0016` and `multi-shop-data-rollout.md` already fix the deployment, the data layout, the per-shop limits and the rollout."
      - "Its requirements step lists only what those decisions left open: a shop that outgrows the shared tables, and restoring one shop without taking the other shops back in time."
      - "`multi-shop-open-requirements.md` writes each as a scenario with a measure, such as how long a moving shop may stop taking writes, and marks every number as an assumption."
      - "Its estimate assumes very uneven shop sizes, with a few large shops holding a large share of orders, so a database for each of 1,000 shops is not needed, but one for the largest may be."
      - "A question nobody can answer yet, such as whether a contract will demand a separate deployment, becomes an assumption with an owner; that case reopens ADR `0012` and stays out of scope."
      - "The step ends with ranked drivers: other shops see no change while one shop moves, one shop can be restored alone, and a large shop's load can leave the shared tables."
      misconceptions:
      - "A new design problem should begin by reconsidering every earlier decision."
      - "Restoring one shop is easy, because every backup already holds every shop's data."
      - "If one shop needs a database of its own, every shop should get one."
      depth_notes: "Không quyết lại ADR 0012, 0013, 0016. Không dạy lại kịch bản thuộc tính chất lượng, RPO/RTO, layout tenant — design.l4.quality-attribute-scenarios, devops.l3.rpo-and-rto, backend.l3.tenant-isolation-models. Thiết kế — sysdesign.l4.multi-shop-design."
    - id: sysdesign.l4.multi-shop-design
      title:
        vi: "Một bảng ánh xạ cửa hàng cho phép cửa hàng lớn chuyển sang database riêng"
        en: "A shop map lets one large shop move to a database of its own"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.multi-shop]
      prereqs:
      - sysdesign.l4.multi-shop-requirements
      - sysdesign.l4.deep-dive
      - backend.l3.rebalancing-shards
      - backend.l3.outbox-relay
      related:
      - sysdesign.l4.high-level-design
      - backend.l3.tenant-isolation-models
      - devops.l3.point-in-time-recovery
      - backend.l4.shop-id-rollout
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/multi-shop-design-review.md
      - docs/adr/0026-cua-hang-lon-chuyen-sang-database-rieng.md
      - docs/design/multi-shop-data-rollout.md
      - scripts/devops/pitr.sh
      outline:
      - "ADR `0026` keeps shared tables for every shop and adds a shard map keyed by shop: each row of `shops` records the database that holds that shop's data, the shared one by default."
      - "From release 2 of the rollout each request takes its shop from the access token; it then looks up that shop's database in the map, so the map is a dependency of every request."
      - "Only the database of `DonHang.Api` can take a shop out; Notifications and Payments keep every shop in their shared tables, because the estimate finds their data per shop small."
      - "The deep dive is moving a shop: its writes pause, the relay sends its remaining outbox rows, its rows are copied and counted, the map switches, and its writes resume; other shops never pause."
      - "The pause lasts longer than the time each Pod caches the map, so no Pod writes to the old place after the switch; the old rows are deleted only after a check period."
      - "Restoring one shop from shared tables recovers a copy of the server to just before the mistake and copies back only that shop's rows, the way `pitr.sh` lets deleted rows be read in a separate container."
      misconceptions:
      - "Moving a shop to another database means stopping the whole system for a night."
      - "Once a shop has its own database, it also needs its own deployment of the services."
      - "To restore one shop, the whole database has to be taken back in time."
      depth_notes: "Không có code đa cửa hàng ở stage-4 (chỉ ADR 0026 và tài liệu). Không dạy sao chép trực tuyến, logical replication. Không dạy lại shard map, PITR, outbox relay — backend.l3.rebalancing-shards, devops.l3.point-in-time-recovery, backend.l3.outbox-relay."
    - id: sysdesign.l4.multi-shop-trade-offs
      title:
        vi: "Database riêng cô lập một cửa hàng nhưng thêm một database phải vận hành"
        en: "A database of its own isolates a shop but adds one more to run"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.multi-shop]
      prereqs:
      - sysdesign.l4.multi-shop-design
      - sysdesign.l4.finding-bottlenecks
      - design.l4.trade-off-points
      - backend.l4.capacity-planning
      related: [backend.l4.expand-and-contract, devops.l3.restore-testing, backend.l3.tenant-isolation-models]
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/multi-shop-design-review.md
      - docs/adr/0026-cua-hang-lon-chuyen-sang-database-rieng.md
      - docs/design/capacity-plan.md
      outline:
      - "The design review records moving a large shop as a trade-off point: isolation of its load and of its restore improves, while migrations, backups and connections grow with each extra database."
      - "Every migration runs once more for each dedicated database, so a release can leave one database behind; expand and contract keeps the old and the new code working until all have caught up."
      - "Each database the API reaches gets its own connections in every Pod, so the rule in `capacity-plan.md` becomes Pods times connections per Pod times databases on one server, below `max_connections`."
      - "So ADR `0026` moves a shop only when an assumed trigger is met, such as its share of all orders or a restore it needs alone, and expects only a handful of dedicated databases."
      - "Restoring a shop that stays in shared tables is slower and more manual than restoring a database of its own; the review accepts this because such restores are assumed to be rare."
      - "The rejected options keep their reasons: a database for every shop fails on ADR `0013`'s migration cost, and a separate deployment is what ADR `0012` keeps for contracts that demand one."
      misconceptions:
      - "Giving a shop its own database costs nothing beyond the server it runs on."
      - "A design that still has trade-offs is a design that is not finished."
      - "More databases always give the whole system more capacity."
      depth_notes: "Số là giả định; không giá, không tên nhà cung cấp. Không dạy lại điểm đánh đổi, expand/contract, kế hoạch dung lượng — design.l4.trade-off-points, backend.l4.expand-and-contract, backend.l4.capacity-planning. Không đổi giới hạn trong `Program.cs`."
    - id: sysdesign.l4.multi-shop-challenges
      title:
        vi: "Phần lớn câu phản biện về đa cửa hàng đã có câu trả lời trong một ADR"
        en: "Most multi-shop challenges are answered by an ADR already accepted"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.multi-shop]
      prereqs: [sysdesign.l4.multi-shop-trade-offs, sysdesign.l4.answering-challenges]
      related:
      - design.l4.one-deployment-for-all-shops
      - backend.l4.shop-data-layout
      - backend.l4.per-shop-limits
      - management.l3.superseding-an-adr
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/multi-shop-design-review.md
      - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
      - docs/adr/0013-du-lieu-cua-hang-trong-bang-chung.md
      - docs/adr/0016-gioi-han-tai-theo-cua-hang.md
      outline:
      - "The challenges in `multi-shop-design-review.md` are of two kinds: those that ask to decide an accepted ADR again, and those that find a case the design does not cover."
      - "Asked why every shop does not get its own database, the answer is ADR `0013`'s reason, every migration run once per shop at 1,000 shops, not a new argument made up in the session."
      - "Asked what protects other shops while a large shop waits to move, the answer is ADR `0016`'s per-shop limits, which wait for the shop in the access token from release 2."
      - "Asked how a report across all shops reads a shop that has its own database, the review records an open question with an owner, since one query cannot join two databases."
      - "A challenge that names a reopen condition, such as a contract demanding a separate deployment, is answered by the condition ADR `0012` already wrote, not by changing the design now."
      misconceptions:
      - "An accepted ADR has to be argued again from the start in every review."
      - "If a reviewer finds a case the design misses, it must be fixed before the session ends."
      - "Pointing at an old ADR is a way to avoid the reviewer's question."
      depth_notes: "Không quyết lại ADR 0012, 0013, 0016. Không dạy lại trả lời phản biện, thay thế ADR — sysdesign.l4.answering-challenges, management.l3.superseding-an-adr. Báo cáo xuyên cửa hàng — sysdesign/search-and-analytics."
    - id: sysdesign.l4.notification-requirements
      title:
        vi: "Hệ thống thông báo được định hình bởi tin nào phải tới và được trễ bao lâu"
        en: "A notification system is shaped by what must arrive and how late"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.notifications]
      prereqs:
      - sysdesign.l4.multi-shop-challenges
      - management.l4.weighted-scoring-matrix
      - backend.l3.consumer-acknowledgements
      - backend.l2.skip-locked-claiming
      related:
      - frontend.l4.client-technology-drivers
      - backend.l4.capacity-planning
      - sysdesign.l4.back-of-the-envelope
      vocab: [push-notification]
      example_tag: stage-4
      example_files:
      - docs/team/notification-requirements.md
      - docs/adr/0024-dich-vu-gui-email-ben-ngoai.md
      - DonHang.Notifications/OrderEventsConsumer.cs
      - DonHang.Notifications/NotificationSender.cs
      outline:
      - "The notification problem starts from what stage-3 runs: Notifications turns each order message into an email row and sends it, and ADR `0024` moves the sending to an external email service."
      - "`notification-requirements.md` adds what 1,000 shops and the product owner ask: each email names the customer's shop, and a customer may also choose SMS or a push notification."
      - "A push notification is a message a phone's operating system shows for an installed app, sent through a push service run by the platform's vendor; Đơn Hàng's app has no phone build at stage-4."
      - "Clarifying questions keep messages about one customer's own order in scope and leave messages sent to many customers at once out, since those need consent rules and far larger sends."
      - "The estimate turns assumed peak orders into emails per second and compares them with two limits: the sender's 10 rows every 2 seconds per copy, and the external service's assumed allowed rate."
      - "The ranked drivers are: no order email lost, an email within minutes (assumed), one shop's burst not delaying other shops, and a paid SMS not sent twice."
      misconceptions:
      - "A notification system is just a call to an email library."
      - "Every new channel needs its own service, because SMS and email have nothing in common."
      - "If the email service is fast, there is nothing to estimate."
      depth_notes: "Không nêu tên, giá nhà cung cấp SMS/push; không dạy giao thức push, quy định đồng ý nhận tin. Không dạy lại message broker, ADR 0024 — backend.l3.message-broker, management.l4.weighted-scoring-matrix. Thiết kế — sysdesign.l4.notification-design."
    - id: sysdesign.l4.notification-design
      title:
        vi: "Mỗi kênh một sender riêng để một nhà cung cấp chậm không giữ chân kênh khác"
        en: "Each channel gets its own sender, so one slow provider holds no other"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.notifications]
      prereqs:
      - sysdesign.l4.notification-requirements
      - backend.l3.bulkhead
      - backend.l2.retry-with-backoff
      - backend.l4.data-ownership
      related:
      - design.l2.adapter-pattern
      - backend.l3.idempotent-consumer
      - backend.l4.message-schema-evolution
      - backend.l4.shop-id-rollout
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/notification-design-review.md
      - docs/adr/0027-thong-bao-nhieu-kenh-email-la-kenh-chinh.md
      - DonHang.Notifications/Notification.cs
      - DonHang.Notifications/NotificationSender.cs
      outline:
      - "The high-level design keeps the stage-3 path, outbox to RabbitMQ to Notifications, and changes only what Notifications does after a message arrives."
      - "The consumer saves one row per channel the customer chose, in the same transaction as its inbox row; the `Channel` column, `email` on every stage-3 row, already makes room for this."
      - "Each channel has its own sender with its own batch size, retries and pace, a bulkhead between channels, and each reaches its provider through an interface like `IEmailSender`."
      - "The deep dive is retries: the stage-3 sender marks a row `failed` after five attempts within about 30 seconds, enough for Mailpit but not for an outage of an external service."
      - "So ADR `0027` keeps retrying each channel over a window of hours (assumed) and paces sends to the provider's allowed rate, so a backlog after an outage drains without being refused."
      - "Customer choices and the shop's name need data Notifications lacks: it becomes the owner of notification preferences, and takes the shop from `shopId`, which messages carry from release 2."
      misconceptions:
      - "A slow SMS provider cannot affect emails, because they are different channels."
      - "A retry policy that worked against the local mail server will work against any provider."
      - "Adding a channel means changing every service that publishes order messages."
      depth_notes: "Không có code kênh mới ở stage-4 (chỉ ADR 0027 và tài liệu). Không dạy mẫu email, giao thức push, tên nhà cung cấp. Không dạy lại bulkhead, adapter, backoff, inbox — backend.l3.bulkhead, design.l2.adapter-pattern, backend.l2.retry-with-backoff."
    - id: sysdesign.l4.notification-trade-offs
      title:
        vi: "Mỗi kênh tự chọn giữa gửi trùng và mất tin"
        en: "Each channel chooses between a duplicate and a lost message"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.notifications]
      prereqs:
      - sysdesign.l4.notification-design
      - backend.l2.at-least-once-jobs
      - design.l4.trade-off-points
      - backend.l4.load-testing
      related:
      - backend.l3.idempotent-consumer
      - sysdesign.l4.finding-bottlenecks
      - management.l3.weighing-options-in-an-adr
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/notification-design-review.md
      - docs/adr/0027-thong-bao-nhieu-kenh-email-la-kenh-chinh.md
      - DonHang.Notifications/NotificationSender.cs
      outline:
      - "Stage-3 email is at-least-once: a crash after sending and before saving sends it again; the design keeps this for email, because a missing order email harms the customer more than a second copy."
      - "For SMS the same crash means a paid duplicate, so ADR `0027` sends SMS and push at most once, marking the row before the call, and accepts that a crash can lose one."
      - "That choice is safe only because every order notification also goes out by email; email becomes the channel of record, a sensitivity point the review writes down."
      - "Pacing trades delay for not being refused: by Little's law the backlog after an outage is the arrival rate times its length, and it drains only at the allowed rate minus new arrivals."
      - "The review records each choice as a trade-off point with the quality attribute it helps, the one it hurts and the driver that decided it, so a changed driver reopens the right choice."
      misconceptions:
      - "Every notification must be delivered exactly once, whatever the channel."
      - "At-most-once delivery is always a bug."
      - "Sending as fast as possible after an outage always gets the backlog out sooner."
      depth_notes: "Không dạy exactly-once, khử trùng lặp hay idempotency key phía nhà cung cấp. Không dạy lại at-least-once, at-most-once, điểm nhạy, điểm đánh đổi, Little's law — backend.l2.at-least-once-jobs, design.l4.trade-off-points, backend.l4.load-testing."
    - id: sysdesign.l4.notification-challenges
      title:
        vi: "Câu phản biện thiết kế thông báo được trả lời bằng ADR đứng sau lựa chọn"
        en: "A notification challenge is answered from the ADR behind the choice"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.notifications]
      prereqs:
      - sysdesign.l4.notification-trade-offs
      - sysdesign.l4.answering-challenges
      - backend.l4.per-shop-limits
      related:
      - frontend.l4.client-technology-drivers
      - management.l3.superseding-an-adr
      - sysdesign.l4.multi-shop-challenges
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/notification-design-review.md
      - docs/adr/0002-tach-notifications-thanh-service.md
      - docs/adr/0024-dich-vu-gui-email-ben-ngoai.md
      - docs/adr/0027-thong-bao-nhieu-kenh-email-la-kenh-chinh.md
      outline:
      - "Asked why the API does not call the SMS provider itself, the answer is ADR `0002`: every service notifies customers the same way, and a slow provider stays out of the process taking orders."
      - "Asked what happens if the external email service is down for a day, the answer names ADR `0027`'s retry window, what happens to rows after it, and ADR `0024`'s condition for a new choice."
      - "Asked whether one shop's sale day can delay other shops' emails, the review finds senders claim due rows by time, never by shop, and records a risk with ADR `0016`'s per-shop cap as next step."
      - "Asked why push is designed but not built, the answer is a dependency the review records: push needs a phone build of the app, which Đơn Hàng does not have at stage-4."
      - "`notification-design-review.md` keeps every challenge from the session with its answer, the ADR or driver it traces to, and an owner by role when it stays open."
      misconceptions:
      - "If the review finds a risk, the notification design was wrong."
      - "A channel that is designed but not built is a hole in the design."
      - "Every challenge needs a new mechanism as its answer."
      depth_notes: "Không dựng code chia đều giữa cửa hàng ở stage-4. Không dạy lại trả lời phản biện, giới hạn theo cửa hàng — sysdesign.l4.answering-challenges, backend.l4.per-shop-limits. Bài kết — sysdesign/architect-daily."
  - id: payments-and-signing
    title:
      vi: "Bài toán: thanh toán và đối soát, ký số tài liệu cho ngân hàng"
      en: "Problems: payment reconciliation and document signing for a bank"
    stage: 4
    summary:
      vi: "Dùng khung thiết kế hệ thống cho hai bài toán của Đơn Hàng — đối soát hoàn tiền của Payments với báo cáo của cổng thanh toán, rồi ký bảng kê cho một ngân hàng sao cho ngân hàng kiểm được nhiều năm sau, kể cả khi chứng chỉ đã hết hạn hay bị thu hồi — đi từ yêu cầu, thiết kế, đánh đổi tới trả lời câu phản biện bằng ADR đã có."
      en: "Apply the system design framework to two Đơn Hàng problems, reconciling Payments' refunds with the gateway's report, then signing statements for a bank so it can verify them years later, after the certificate has ended or been revoked, from requirements through design and trade-offs to answering challenges from recorded ADRs."
    lessons:
    - id: sysdesign.l4.payment-reconciliation-requirements
      title:
        vi: "Đối soát kiểm tra cổng thanh toán và Payments khớp nhau ở từng khoản hoàn tiền"
        en: "Reconciliation checks the gateway and Payments agree on every refund"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.payments]
      prereqs:
      - sysdesign.l4.notification-challenges
      - backend.l3.safe-to-repeat-saga-steps
      - backend.l3.compensating-action
      - management.l3.exit-plan
      related:
      - sysdesign.l4.clarifying-requirements
      - management.l3.evaluating-a-vendor
      - backend.l4.data-ownership
      - backend.l3.timeouts
      vocab: [reconciliation, settlement-report]
      example_tag: stage-4
      example_files:
      - docs/team/reconciliation-requirements.md
      - docs/team/refund-requirements.md
      - docs/team/payment-gateway-evaluation.md
      - docs/adr/0010-cong-thanh-toan-ben-ngoai.md
      outline:
      - "The payments problem starts from the stage-3 refund saga, which keeps Đơn Hàng's own records consistent but never checks them against what the gateway actually did."
      - "Reconciliation compares two independent records of the same money, here Payments' refund rows and the gateway's records, and explains every line on which they differ."
      - "A settlement report is the gateway's own list of the money it moved for a merchant in a period; Gateway A exports its refund history as CSV at any time, and the lab's `GET /v1/refunds` stands in for it."
      - "`refund-requirements.md` made reconciliation goal 2 but left open what list accounting needs and how often; `reconciliation-requirements.md` answers with assumed figures: one run a day, results by the next working morning."
      - "Clarifying questions find the cases that matter: a refund the gateway made while Payments marked the row `failed`, a gateway refund with no row, such as one made by hand, and an amount that differs."
      - "The estimate finds a day's refunds a small batch (assumed), so load does not shape the design; the ranked drivers are every difference explained, each found within a day, and money corrected only by people."
      misconceptions:
      - "With an idempotency key on every call, the gateway and our records can never disagree."
      - "Reconciliation is accounting's job; the system only has to record the refunds."
      - "If a refund row says `refunded`, the customer has the money, so there is nothing to check."
      depth_notes: "Không làm luồng thu tiền (charge) — stage-3 chỉ hoàn tiền qua cổng; không tên cổng thật, phí, quy định kế toán. Không dạy lại saga, idempotency key, exit plan — backend.l3.saga, backend.l2.idempotent-endpoints, management.l3.exit-plan. Thiết kế — sysdesign.l4.payment-reconciliation-design."
    - id: sysdesign.l4.payment-reconciliation-design
      title:
        vi: "Một job hằng ngày ghép từng dòng của cổng với dòng hoàn tiền theo khóa của nó"
        en: "A daily job matches each gateway line to a refund row by its key"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.payments]
      prereqs:
      - sysdesign.l4.payment-reconciliation-requirements
      - sysdesign.l4.deep-dive
      - backend.l4.data-ownership
      - backend.l4.audit-log
      related:
      - sysdesign.l4.high-level-design
      - backend.l3.dead-letter-queue
      - backend.l3.saga-in-progress-status
      - design.l3.anti-corruption-layer
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/reconciliation-design-review.md
      - docs/adr/0028-doi-soat-hoan-tien-hang-ngay-voi-bao-cao-cua-cong.md
      - fake-gateway/Program.cs
      - DonHang.Payments/Payment.cs
      outline:
      - "ADR `0028` puts reconciliation in Payments, the owner of the refund rows and of the gateway's key: once a day a job fetches the previous day's report and saves its lines in Payments' own database."
      - "Each report line is matched to a row by the idempotency key `refund-<id>`, since `payments` keeps no refund id of the gateway's; the lab's `GET /v1/refunds` lists the key, and the design assumes Gateway A's report does too."
      - "Every comparison ends in one category: matched, refunded by the gateway but `failed` in Payments, a gateway refund with no row, a `refunded` row the report lacks, or a different amount."
      - "A refund made near the end of a day may appear only in the next day's report, so a row missing from the report counts as a difference only after one more run (assumed)."
      - "The job never changes a refund row: each difference goes to a list for staff, and a correction is a new change made by a person and written to the audit log, as the saga's compensation keeps its history."
      - "The deep dive is a `failed` row the gateway refunded: its order is back at `paid`, and a late `payment.refunded` cannot fix it, because `CompleteRefund()` accepts only a `refunding` order, so the review records a new correction step."
      misconceptions:
      - "Reconciliation can match the two records by order and amount, so no key is needed."
      - "A row missing from today's report is always a refund that never happened."
      - "When the job finds a difference, it should simply overwrite our row with the gateway's value."
      depth_notes: "Không có code đối soát ở stage-4 (chỉ ADR 0028 và tài liệu). Không dạy định dạng file của cổng, kế toán kép. Không dạy lại chủ dữ liệu, audit log, ACL, dead-letter queue — backend.l4.data-ownership, backend.l4.audit-log, design.l3.anti-corruption-layer, backend.l3.dead-letter-queue."
    - id: sysdesign.l4.payment-reconciliation-trade-offs
      title:
        vi: "Đối soát mỗi ngày một lần đổi một ngày chậm lấy một job đơn giản"
        en: "Reconciling once a day trades a day's delay for one simple job"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.payments]
      prereqs:
      - sysdesign.l4.payment-reconciliation-design
      - design.l4.trade-off-points
      - backend.l3.eventual-consistency
      - management.l4.compliance-controls
      related:
      - sysdesign.l4.finding-bottlenecks
      - management.l3.weighing-options-in-an-adr
      - backend.l3.safe-to-repeat-saga-steps
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/reconciliation-design-review.md
      - docs/adr/0028-doi-soat-hoan-tien-hang-ngay-voi-bao-cao-cua-cong.md
      - DonHang.Payments/RefundSender.cs
      outline:
      - "The review records the run's frequency as a trade-off point: one run a day is one simple job and one report fetched, but a difference can stay unnoticed for up to a day."
      - "Asking the gateway about each refund right after it is sent would find a lost answer sooner, but adds a call per refund and still misses refunds made outside Đơn Hàng, so it cannot replace the report."
      - "The 24-hour retry window of YC-10 is another trade-off point: a longer window leaves fewer `failed` rows the gateway in fact refunded, but keeps orders `refunding` and staff waiting longer."
      - "Corrections made by hand are slower than letting the job fix rows, but staff propose and accounting approves (assumed roles), so no one person both makes and approves a change to money records."
      - "The saved report lines and each run's result are evidence for accounting and auditors, so they are kept as long as the refund rows (assumed), at the cost of storage."
      misconceptions:
      - "Checking every refund the moment it happens is always better than a daily run."
      - "Retrying the gateway for longer would remove the need to reconcile."
      - "Letting the job correct differences itself is safer, because a program makes no mistakes."
      depth_notes: "Số là giả định; không giá, không tên nhà cung cấp. Không đổi `RefundSettings` hay YC-10. Không dạy lại điểm đánh đổi, eventual consistency, tách nhiệm vụ — design.l4.trade-off-points, backend.l3.eventual-consistency, management.l4.compliance-controls."
    - id: sysdesign.l4.payment-reconciliation-challenges
      title:
        vi: "Câu phản biện về đối soát được trả lời từ giới hạn của chính saga hoàn tiền"
        en: "Reconciliation challenges are answered from the refund saga's limits"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.payments]
      prereqs: [sysdesign.l4.payment-reconciliation-trade-offs, sysdesign.l4.answering-challenges]
      related:
      - management.l3.exit-plan
      - management.l3.superseding-an-adr
      - sysdesign.l4.notification-challenges
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/reconciliation-design-review.md
      - docs/adr/0010-cong-thanh-toan-ben-ngoai.md
      - docs/adr/0028-doi-soat-hoan-tien-hang-ngay-voi-bao-cao-cua-cong.md
      - DonHang.Payments/GatewayRefundClient.cs
      outline:
      - "Asked why reconcile when every call carries an idempotency key, the answer is that the key stops a second refund, not a lost answer or a refund made by hand, cases YC-9 does not cover."
      - "Asked why the gateway's report alone is not enough, the answer is that only the two records together show a refund the gateway made for a row Payments marked `failed`."
      - "Asked what happens when the report is late or the gateway is down at run time, the answer names ADR `0028`'s rule: the run is tried again, and a missed day is reported to accounting (assumed)."
      - "Asked what changes with a second gateway under ADR `0010`'s exit plan, the review records a risk: refund rows do not record their gateway, a need step 4 of that plan already names."
      - "`reconciliation-design-review.md` keeps every challenge with its answer, the driver or ADR it traces to, and an owner by role when it stays open."
      misconceptions:
      - "The gateway moved the money, so its report is the only record worth trusting."
      - "If a reviewer asks about a second gateway, reconciliation must support it before it is built."
      - "An open question left in the review means reconciliation is not ready to build."
      depth_notes: "Không dựng code chuyển cổng ở stage-4. Không quyết lại ADR 0003, 0010. Không dạy lại trả lời phản biện, exit plan, thay thế ADR — sysdesign.l4.answering-challenges, management.l3.exit-plan, management.l3.superseding-an-adr."
    - id: sysdesign.l4.bank-signing-requirements
      title:
        vi: "Ngân hàng phải kiểm được tài liệu đã ký rất lâu sau khi chứng chỉ hết hạn"
        en: "A bank must verify a signed document long after its certificate ends"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.bank-signing]
      prereqs:
      - sysdesign.l4.payment-reconciliation-challenges
      - backend.l4.pki-and-signing
      - management.l4.compliance-controls
      - k8s.l4.keys-stay-in-the-key-service
      related:
      - sysdesign.l4.clarifying-requirements
      - backend.l4.signing-key-custody
      - backend.l4.audit-log
      - k8s.l4.choosing-managed-kubernetes
      vocab: [certificate-revocation]
      example_tag: stage-4
      example_files:
      - docs/team/bank-signing-requirements.md
      - docs/team/compliance-controls.md
      - docs/adr/0015-khoa-ky-hoa-don-trong-hsm.md
      - docs/adr/0023-khoa-ky-hoa-don-trong-hsm-cua-nha-cung-cap.md
      outline:
      - "The signing problem starts from decisions already taken: ADR `0015` keeps the invoice key in an HSM only Payments may call, and ADR `0023` puts that HSM in the provider's service."
      - "`bank-signing-requirements.md` adds what a bank that owns a chain of shops asks: Payments signs a monthly statement of those shops' payments and refunds, and the bank checks it with public keys and certificates alone."
      - "A certificate is valid only between two dates, and certificate revocation is its CA declaring it invalid before the end date, for example because its private key may have leaked."
      - "So the hardest requirement is time, not load: the bank must verify a statement years later (assumed ten), after the certificate has ended, and tell statements signed before a revocation from later ones."
      - "The estimate finds statements in the hundreds a month at most (assumed), so signing load is trivial and a statement may wait hours to be signed without breaking any driver."
      - "The bank's rules reuse the controls of `compliance-controls.md`, such as the audit log and separation of duties; the ranked drivers are: verifiable for years, a leaked key's damage limited in time, no key outside an HSM."
      misconceptions:
      - "Once a certificate has expired, nothing signed with it can be trusted any more."
      - "A bank as a customer means ADRs 0015 and 0023 must be decided again from the start."
      - "A signature that checks today will check the same way in ten years, so nothing else needs keeping."
      depth_notes: "Không nêu luật, chuẩn, chứng nhận, số hiệu quy định (không khóa `standards`); không định dạng chữ ký PDF/XML. Không quyết lại ADR 0015, 0022, 0023. Không dạy lại chứng chỉ, chuỗi chứng chỉ, tuân thủ — backend.l4.pki-and-signing, management.l4.compliance-controls."
    - id: sysdesign.l4.bank-signing-design
      title:
        vi: "Dấu thời gian và trạng thái thu hồi lưu kèm giữ chữ ký kiểm được lâu dài"
        en: "A timestamp and saved revocation status keep a signature checkable"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.bank-signing]
      prereqs:
      - sysdesign.l4.bank-signing-requirements
      - sysdesign.l4.deep-dive
      - backend.l4.signing-key-custody
      - backend.l4.audit-log
      related:
      - backend.l4.signing-documents
      - sysdesign.l4.high-level-design
      - k8s.l3.cert-manager
      - backend.l4.data-ownership
      vocab: [crl, ocsp, trusted-timestamp, timestamp-authority]
      example_tag: stage-4
      example_files:
      - docs/design/bank-signing-design-review.md
      - docs/adr/0029-ky-bang-ke-ngan-hang-kem-dau-thoi-gian.md
      - samples/DonHang.Samples/Samples/Security/InvoiceSigning.cs
      - samples/DonHang.Samples/Samples/Security/InvoiceCertificates.cs
      outline:
      - "A CRL is a list of revoked certificates that a CA signs and publishes at intervals; with OCSP a verifier asks the CA's responder about one certificate and gets a signed answer."
      - "A trusted timestamp is a statement signed by a timestamp authority, a third party, that a given hash existed at a given time; the signer's clock cannot serve, since whoever holds a leaked key can set it back."
      - "ADR `0029` has Payments sign each statement in the HSM, get a timestamp over the signature and fetch the certificate's revocation status, then store all three with the statement's exact bytes."
      - "The bank checks such a package alone: the signature against the certificate, the chain up to a root it trusts, the time from the timestamp, and the saved status showing the certificate valid at that time."
      - "The certificate comes from a CA the bank names (assumed), for a key created in the HSM; `InvoiceCertificates` trusts only Đơn Hàng's own root, which the bank does not, and checks no revocation."
      - "Every signing request, timestamp and status fetch is written to the audit log of `audit-log.md`, so the record of what Payments signed is evidence kept outside Payments' own tables."
      misconceptions:
      - "The server's own clock is good enough to prove when a document was signed."
      - "Revocation is checked once, when the bank receives the document, so nothing about it needs storing."
      - "A timestamp authority must read the whole statement, so private documents cannot be timestamped."
      depth_notes: "Không có code ký bảng kê ở stage-4 (chỉ ADR 0029, tài liệu và sample sẵn có). Không nêu tên CA, TSA, sản phẩm HSM; không định dạng CRL/OCSP, số RFC. Không dạy lại chữ ký số, HSM, audit log — backend.l4.signing-documents, backend.l4.signing-key-custody, backend.l4.audit-log."
    - id: sysdesign.l4.bank-signing-trade-offs
      title:
        vi: "Mỗi bằng chứng kèm chữ ký thêm một dịch vụ mà việc ký phải chờ"
        en: "Each piece of signing evidence adds a service that signing waits on"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.bank-signing]
      prereqs:
      - sysdesign.l4.bank-signing-design
      - design.l4.trade-off-points
      - sysdesign.l4.finding-bottlenecks
      - k8s.l4.choosing-managed-kubernetes
      related:
      - backend.l3.graceful-degradation
      - backend.l4.shared-credentials
      - management.l3.total-cost-of-ownership
      - sysdesign.l4.multi-shop-trade-offs
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/bank-signing-design-review.md
      - docs/adr/0029-ky-bang-ke-ngan-hang-kem-dau-thoi-gian.md
      - docs/adr/0022-production-tren-kubernetes-managed.md
      - docs/adr/0023-khoa-ky-hoa-don-trong-hsm-cua-nha-cung-cap.md
      outline:
      - "Signing now depends on the HSM, the timestamp authority and the CA's status service; each is a single point of failure for signing but not for taking orders, because a statement may wait hours (assumed)."
      - "OCSP gives a fresh answer for one certificate but needs the responder up at every check; a CRL can be fetched ahead and kept, but may be as old as one publishing interval."
      - "Saving the status at signing time makes each package larger, but the bank's check years later no longer needs the CA's services to be still running."
      - "The timestamp authority's own certificate also ends, so statements kept longer are timestamped again before it does, a recurring job the review records as a cost."
      - "ADR `0029` keeps ADR `0023`'s provider HSM, with a key used only for this bank's statements, so a revocation touches no invoice of other shops, at the cost of one more key and certificate to renew."
      - "An HSM of Đơn Hàng's own stays rejected for ADR `0023`'s reason, hardware in two places and people to run it; a contract demanding own machines meets ADR `0022`'s reopen condition."
      misconceptions:
      - "OCSP is always better than a CRL, because its answer is fresh."
      - "If the timestamp authority is down, taking orders must stop until signing works again."
      - "Having a bank as a customer always means buying our own HSM."
      depth_notes: "Số là giả định; không giá, không tên nhà cung cấp. Không quyết lại ADR 0022, 0023. Không dạy lại điểm đánh đổi, điểm hỏng đơn lẻ, blast radius, TCO — design.l4.trade-off-points, k8s.l3.highly-available-entry-point, backend.l4.shared-credentials, management.l3.total-cost-of-ownership."
    - id: sysdesign.l4.bank-signing-challenges
      title:
        vi: "Câu phản biện về ký số cho ngân hàng được trả lời bằng ADR 0015, 0023 và 0029"
        en: "Bank signing challenges are answered from ADRs 0015, 0023 and 0029"
      main_path: true
      duration_min: 13
      skills: [sysdesign.problem.bank-signing]
      prereqs:
      - sysdesign.l4.bank-signing-trade-offs
      - sysdesign.l4.answering-challenges
      - management.l3.superseding-an-adr
      related:
      - backend.l4.threat-modeling
      - sysdesign.l4.multi-shop-challenges
      - management.l4.deciding-under-uncertainty
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/bank-signing-design-review.md
      - docs/adr/0015-khoa-ky-hoa-don-trong-hsm.md
      - docs/adr/0022-production-tren-kubernetes-managed.md
      - docs/adr/0029-ky-bang-ke-ngan-hang-kem-dau-thoi-gian.md
      outline:
      - "Asked why statements are not signed with the server's time and Đơn Hàng's own root, the answer is the drivers: the bank trusts only roots it names, and a leaked key could write any time the server shows."
      - "Asked what happens to past statements if the key leaks, the answer is revocation: statements timestamped before it stay valid, later ones fail, and the audit log shows which earlier ones Payments really asked for."
      - "Asked why a bank does not get an HSM of Đơn Hàng's own, the answer is ADR `0023`'s reason and ADR `0022`'s reopen condition; if the contract demands own machines, a new ADR supersedes `0023` for this key only."
      - "Asked what happens if the timestamp authority is down at month end, the review records a risk with an owner: statements wait and are signed late, within the bank's deadline (assumed)."
      - "`bank-signing-design-review.md` keeps every challenge with its answer, the driver or ADR it traces to, and an owner by role when it stays open."
      misconceptions:
      - "Revoking a leaked key makes every document it ever signed invalid."
      - "A challenge about who owns the HSM can only be settled by buying one."
      - "If the design cannot answer a challenge on the spot, it must be redesigned before the review ends."
      depth_notes: "Không dựng HSM, CA hay TSA trong lab. Không quyết lại ADR 0015, 0022, 0023. Không dạy lại trả lời phản biện, thay thế ADR, threat model — sysdesign.l4.answering-challenges, management.l3.superseding-an-adr, backend.l4.threat-modeling. Bài kết — sysdesign/architect-daily."
  - id: search-and-analytics
    title:
      vi: "Bài toán: tìm kiếm sản phẩm, báo cáo và analytics"
      en: "Problems: product search, reports and analytics"
    stage: 4
    summary:
      vi: "Dùng khung thiết kế hệ thống cho hai bài toán của Đơn Hàng — cho khách tìm sản phẩm của một cửa hàng theo từ trong tên, rồi cho nhân viên xem báo cáo trên rất nhiều đơn mà không lấy tài nguyên của việc đặt hàng — đi từ yêu cầu, thiết kế, đánh đổi tới trả lời câu phản biện bằng ADR đã có."
      en: "Apply the system design framework to two Đơn Hàng problems, letting customers search a shop's products by the words in their names, then giving staff reports over many orders without taking capacity from ordering, from requirements through design and trade-offs to answering challenges from recorded ADRs."
    lessons:
    - id: sysdesign.l4.product-search-requirements
      title:
        vi: "Tìm kiếm sản phẩm bắt đầu từ một danh sách chỉ lọc được theo giá"
        en: "Product search starts from a list that filters only by price"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.search]
      prereqs:
      - sysdesign.l4.bank-signing-challenges
      - frontend.l4.pages-for-search
      - backend.l2.filtering-with-query-parameters
      - backend.l4.capacity-planning
      related:
      - sysdesign.l4.clarifying-requirements
      - backend.l2.offset-pagination
      - backend.l2.cache-aside
      - design.l4.quality-attribute-scenarios
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/team/product-search-requirements.md
      - DonHang.Catalog/CatalogService.cs
      - DonHang.Api/Controllers/ProductsController.cs
      - docs/adr/0017-giu-mot-ma-flutter-cho-moi-nen-tang.md
      outline:
      - "At stage-3 `GET /api/v1/products` returns pages of at most 100 products in `id` order and filters only by `maxPriceVnd`; a customer looking for a product by its name has to page through the list."
      - "The search problem has two meanings, kept apart in the requirements: customers finding a product inside one shop, and product pages found from outside by search engines, which ADR `0017` leaves to a separate decision."
      - "`product-search-requirements.md` writes in-shop search as scenarios with a measure, such as words typed without Vietnamese diacritics still finding the product, best matches first, within one shop only."
      - "A clarifying question settles how fresh results must be: a new product or a changed name may appear in search a little later (assumed minutes), the same choice the product list already makes."
      - "The estimate finds a shop's products few (assumed thousands at most), so the data fits easily in PostgreSQL; the risk is load, because a search is a query on every call and `ProductCache` keeps products only by `id`."
      - "The ranked drivers are: words typed without diacritics find the product, search never takes capacity that orders need, and results stay within the caller's shop."
      misconceptions:
      - "Search is just a `WHERE name = ...` added to the product list."
      - "Making products searchable in our shop also makes them show up on search engines."
      - "Product reads are already cached in Redis, so search adds no load to the database."
      depth_notes: "Không quyết lại ADR 0017, không xây trang công khai cho máy tìm kiếm. Không dạy lại lọc, phân trang, cache-aside, kế hoạch dung lượng — backend.l2.filtering-with-query-parameters, backend.l2.cache-aside, backend.l4.capacity-planning. Thiết kế — sysdesign.l4.product-search-design."
    - id: sysdesign.l4.product-search-design
      title:
        vi: "Full-text search tìm sản phẩm theo các từ trong tên của nó"
        en: "Full-text search finds products by the words in their names"
      main_path: true
      duration_min: 15
      skills: [sysdesign.problem.search]
      prereqs:
      - sysdesign.l4.product-search-requirements
      - sysdesign.l4.deep-dive
      - backend.l2.indexes-and-plans
      - backend.l4.data-ownership
      related:
      - sysdesign.l4.high-level-design
      - design.l3.module-contracts
      - backend.l4.shop-data-layout
      - foundation.l1.sql-index-intro
      vocab: [full-text-search, inverted-index]
      example_tag: stage-4
      example_files:
      - docs/design/product-search-design-review.md
      - docs/adr/0030-tim-san-pham-bang-full-text-search-cua-postgresql.md
      - DonHang.Catalog/ICatalog.cs
      - db/seed.sql
      outline:
      - "Full-text search splits text into words, normalises them the same way for the stored text and for the query, and returns the rows whose words match, ordered by how well they match."
      - "An inverted index maps each word to the rows that contain it, so a search reads only matching rows; an ordinary index on `name` cannot serve a pattern that starts with a wildcard, so `LIKE '%phím%'` reads every row."
      - "ADR `0030` keeps search in PostgreSQL, inside Catalog, the owner of `products`: the searchable words are built from the product's own row and indexed there, so there is no second copy to keep in sync."
      - "The deep dive is diacritics: both the stored name and the query are lowercased and stripped of diacritics before matching, so `ban phim` finds `Bàn phím cơ` from `seed.sql`."
      - "Search is an optional parameter of the existing product list behind `ICatalog`, limited to the caller's shop and read under the same `catalog-reads` limit as every other product read."
      - "The rejected options keep their reasons: `LIKE` patterns scan every row, and a separate search engine adds a copy of the products, a path to feed it and one more service to run, not needed at the estimated size."
      misconceptions:
      - "Full-text search needs a separate search engine; a SQL database cannot do it."
      - "An index on `name` makes `LIKE '%phím%'` fast."
      - "Searching for `ban phim` can only find names written exactly without diacritics."
      depth_notes: "Không code tìm kiếm ở stage-4 (chỉ ADR 0030, tài liệu). Không dạy cú pháp tsvector/tsquery, GIN/GiST, sửa lỗi gõ, đồng nghĩa; không tên công cụ tìm kiếm. Không dạy lại index, chủ dữ liệu, module contract — backend.l2.indexes-and-plans, backend.l4.data-ownership, design.l3.module-contracts."
    - id: sysdesign.l4.product-search-trade-offs
      title:
        vi: "Tìm kiếm ngay trong PostgreSQL bỏ bớt khả năng so khớp để khỏi giữ một bản sao"
        en: "Search inside PostgreSQL gives up richer matching to avoid a copy"
      main_path: true
      duration_min: 14
      skills: [sysdesign.problem.search]
      prereqs:
      - sysdesign.l4.product-search-design
      - design.l4.trade-off-points
