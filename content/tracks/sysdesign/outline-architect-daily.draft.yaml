module:
  id: architect-daily
  title:
    vi: "Kiến trúc sư thật làm gì mỗi ngày"
    en: "What an architect actually does every day"
  stage: 4
  summary:
    vi: "Nhìn mọi kỹ năng của lộ trình trong một tuần làm việc của kiến trúc sư Đơn Hàng — review, ADR, trao đổi, xem lại quyết định cũ, chọn việc không quyết — rồi tự đánh giá mình còn thiếu loại tài liệu nào để biết bước học tiếp theo."
    en: "See every skill of the path at work in one week of Đơn Hàng's architect, from reviews, ADRs and conversations to checking past decisions and choosing what not to decide, then assess which kind of document you cannot yet write alone to choose what to practise next."
  lessons:
    - id: sysdesign.l4.an-architects-week
      title:
        vi: "Một tuần của kiến trúc sư xoay quanh quyết định để người khác thực hiện"
        en: "An architect's week goes to decisions others can carry out"
      main_path: true
      duration_min: 13
      skills: [sysdesign.practice.architect-role]
      prereqs:
        - sysdesign.l4.saas-challenges
        - sysdesign.l4.design-review-doc
        - management.l4.mentoring
        - management.l4.presenting-to-leadership
      related:
        - management.l3.proposing-an-adr
        - backend.l4.backend-review-checklist
        - devops.l4.blameless-postmortems
        - management.l4.roadmap
        - management.l4.lightweight-governance
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/architect-week.md
        - docs/design/design-review-template.md
        - docs/team/mentoring-plan.md
        - docs/adr/README.md
      outline:
        - "`architect-week.md` logs one assumed week of Đơn Hàng's architect, a role that works across the three teams of ADR `0025`, and names for each activity the file or record it leaves behind."
        - "Most of the week goes to reviews and documents: a design review, comments on a proposed ADR, a pull request checked against a review checklist, a postmortem read and a roadmap check."
        - "Writing code is a small share of the week, assumed, kept for work that tests a decision, such as pairing on a fitness function, because an architect far from the code loses sight of what decisions cost."
        - "Each activity ends in a recorded output, such as an ADR, an answered review question or a risk with an owner, so the decision outlives the meeting and the next person finds it without asking."
        - "The audience changes through the week: developers get the reason behind a rule, the product owner gets trade-offs as outcomes, and leadership gets the decision asked of them first."
        - "Every activity in the log was taught earlier in the path; the week shows how they fit together, not how to do any one of them."
      misconceptions:
        - "An architect spends most of the day drawing diagrams of the system."
        - "Once you become the architect, you stop writing code completely."
        - "A decision agreed in a meeting is done; writing it down afterwards is just paperwork."
        - "The architect talks mostly to developers; talking to leadership is the manager's job."
      depth_notes: "Không dạy lại design review, đề xuất ADR, mentoring, brief lãnh đạo, postmortem — sysdesign.l4.design-review-doc, management.l3.proposing-an-adr, management.l4.mentoring, management.l4.presenting-to-leadership. Không nói lương, chức danh, lộ trình thăng tiến."
    - id: sysdesign.l4.architecture-health-review
      title:
        vi: "Mỗi quý xem lại sức khỏe kiến trúc để biết quyết định cũ còn đúng"
        en: "A quarterly health review checks that past decisions still hold"
      main_path: true
      duration_min: 13
      skills: [sysdesign.practice.architecture-upkeep]
      prereqs:
        - sysdesign.l4.an-architects-week
        - management.l4.deciding-under-uncertainty
        - design.l4.mapping-fitness-functions
        - design.l4.quantifying-technical-debt
      related:
        - management.l4.lightweight-governance
        - management.l3.superseding-an-adr
        - management.l4.technical-strategy
        - backend.l4.error-budget
        - devops.l4.delivery-metrics
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/design/architecture-health-review.md
        - docs/team/architecture-governance.md
        - docs/design/fitness-functions.md
        - docs/team/tech-debt-register.md
      outline:
        - "A decision can go stale while nobody touches it: the assumptions behind an ADR can stop holding while its text, and every check that guards it, stay exactly the same."
        - "`architecture-health-review.md` records one assumed quarterly review that reads inputs already kept: the watched assumptions in `architecture-governance.md`, the gaps in `fitness-functions.md`, the debt register and the SLOs."
        - "Each row read ends in one recorded choice: keep it, add a check, put an item on the roadmap, or propose a new ADR that supersedes the old one; a row with no choice yet stays visibly open."
        - "A reopen signal that has appeared leads to a proposed ADR, never to editing the accepted one; a signal that has not appeared is recorded as checked, so 'still holds' is a finding, not a guess."
        - "Known gaps, such as production running without Prometheus, are checked for a roadmap item and an owner by role, because a gap that everyone knows about but nobody owns stays open."
        - "The review is short because its inputs exist already; the architect's part is reading them side by side, which no single team's document does."
      misconceptions:
        - "Once an ADR is accepted, it stays correct until someone finds a bug in the code."
        - "If every check in CI is green, the architecture is healthy."
        - "An architecture review is only needed when a big new feature is planned."
        - "When an ADR's assumption turns out wrong, the ADR should be edited to match."
      depth_notes: "Không dạy lại tín hiệu mở lại, fitness function, lượng hóa nợ, error budget, thay thế ADR — management.l4.deciding-under-uncertainty, design.l4.mapping-fitness-functions, design.l4.quantifying-technical-debt, backend.l4.error-budget, management.l3.superseding-an-adr. Không quyết lại ADR nào."
    - id: sysdesign.l4.deciding-what-not-to-decide
      title:
        vi: "Kiến trúc sư chỉ giữ quyết định vắt qua nhiều đội hoặc khó đảo ngược"
        en: "An architect keeps the decisions that cross teams or are hard to undo"
      main_path: true
      duration_min: 13
      skills: [sysdesign.practice.architect-role]
      prereqs:
        - sysdesign.l4.architecture-health-review
        - management.l4.lightweight-governance
        - management.l4.deciding-under-uncertainty
        - management.l4.technical-strategy
      related:
        - management.l4.mentoring
        - management.l4.team-interaction-modes
        - devops.l4.golden-path
        - k8s.l4.when-a-mesh-pays-off
        - design.l4.over-abstraction
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/architect-week.md
        - docs/team/architecture-governance.md
        - docs/team/technical-strategy.md
        - docs/adr/0021-chua-dung-service-mesh.md
      outline:
        - "Each decision the architect takes for a team is one the team does not learn to take, so the architect keeps the decisions that cross team boundaries or are costly to undo and leaves the rest."
        - "The requests handed back in `architect-week.md` show how: a question inside a team's decision rights is answered by pointing to the rule or checklist that settles it, not by a ruling."
        - "When a team, within its decision rights, chooses differently from what the architect would, the architect states the concern in review and lets the choice stand, because the team carries its cost."
        - "Saying no rests on a written reason: a request for a service mesh is answered with the reopen conditions of ADR `0021` and the strategy's list of what the team will not do, not with taste."
        - "A decision not needed yet is left open on purpose, with the signal that would make it needed, so the architect does not decide early on facts that do not exist yet."
        - "Checklists, templates and the golden path let teams take decisions alone; fewer questions reaching the architect each quarter is a sign the role works, not that it is fading."
      misconceptions:
        - "A good architect takes every technical decision, so that the system stays consistent."
        - "If a team picks a solution I would not pick, I should overrule it."
        - "When the architect says no to a request, it is just the architect's personal opinion."
        - "Leaving a question undecided means the architect has not done the job."
      depth_notes: "Không dạy lại quyền quyết định, quyết định đảo ngược được, chiến lược kỹ thuật, mentoring — management.l4.lightweight-governance, management.l4.deciding-under-uncertainty, management.l4.technical-strategy, management.l4.mentoring. Không quyết lại ADR 0021."
    - id: sysdesign.l4.where-to-go-next
      title:
        vi: "Bước tiếp theo là loại tài liệu bạn chưa tự viết được một mình"
        en: "Your next step is the document you cannot yet write on your own"
      main_path: true
      duration_min: 12
      skills: [sysdesign.practice.self-assessment]
      prereqs:
        - sysdesign.l4.deciding-what-not-to-decide
        - sysdesign.l4.answering-challenges
        - sysdesign.l4.bank-signing-challenges
        - management.l4.mentoring
      related:
        - sysdesign.l4.system-design-steps
        - management.l3.architecture-decision-record
        - design.l4.architecture-review-findings
        - management.l2.design-doc
        - devops.l4.blameless-postmortems
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/architecture-skills-checklist.md
        - docs/team/mentoring-plan.md
        - STAGE.md
        - docs/adr/README.md
      outline:
        - "`architecture-skills-checklist.md` lists the kinds of document Đơn Hàng's decisions live in, from a requirements document to a leadership brief, each with an example file in the repository."
        - "Each row is rated in three steps: written with the template and help, written alone, and defended under challenge; the last step matters because a design you cannot defend is not yet understood."
        - "The weakest row, not the most interesting topic, picks what to practise next; the table in `STAGE.md` maps its example file to the topic it was used for, which leads back to those lessons."
        - "Redoing a module's exercise on a new problem, such as a new Đơn Hàng feature, shows more about a weak row than reading the lessons again."
        - "After the path, practice moves to a real system: write the design review and the ADR for the next real decision, then a quarter later compare the consequences it predicted with what happened."
        - "The checklist also names the gaps this path left on purpose as places to study next, and `mentoring-plan.md` uses the same rows to pick a developer's next task."
      misconceptions:
        - "Finishing every lesson of the path means I am now an architect."
        - "The best next step is whichever topic I found most interesting."
        - "Reading a lesson again is the best way to fix a weak area."
        - "Once a decision is shipped, there is nothing more to learn from it."
      depth_notes: "Không nói chức danh, lương, tuyển dụng hay lộ trình thăng tiến. Không dạy lại nội dung module nào; mỗi dòng chỉ trỏ về chủ đề đã dạy. Không thêm bài toán mới, không ADR mới."

glossary_additions: []

repo_changes_needed:
  - lesson: sysdesign.l4.an-architects-week
    need: "Tài liệu tiếng Việt (`### `, không `## `/`**`, mọi số ghi 'giả định', không tên người, không code): một tuần giả định của vai trò kiến trúc sư Đơn Hàng, làm việc với cả ba đội của ADR 0025 (không thuộc riêng đội nào — giả định). Mục `### Lịch trong tuần`: bảng Thứ Hai–Thứ Sáu, mỗi dòng: hoạt động, với ai (theo vai trò), đầu ra (file, ADR, dòng ghi), chủ đề đã học; ít nhất: đọc trước và dự một design review theo `design-review-template.md` (vd `support-chat-design-review.md`), ghi câu hỏi mở + người trả lời; góp ý một ADR ở trạng thái Đề xuất trong thời gian góp ý (giả định); review một pull request bằng `backend-review-checklist.md`/`cluster-review-checklist.md`; đọc postmortem 0001 và kiểm việc cần làm đã vào `roadmap.md`; xem roadmap với product owner; một buổi kèm theo `mentoring-plan.md`; trình brief với lãnh đạo (`leadership-brief-platform-team.md`); ghép cặp viết một phép kiểm cho một nguyên tắc (phần code nhỏ — giả định). Mục `### Thời gian theo loại việc`: review và tài liệu, trao đổi, kèm người, code — khoảng giờ giả định, code nhỏ nhưng khác 0; ghi rõ không phải số liệu ngành. Mục `### Yêu cầu chuyển lại cho đội` (cho bài 3): 4–5 yêu cầu giả định, mỗi dòng: yêu cầu, thuộc quyền quyết định của ai theo bảng 'ai quyết gì' của `architecture-governance.md`, câu trả lời trỏ tới quy tắc/checklist/ADR: (a) câu hỏi trong phạm vi một đội → trỏ checklist; (b) một đội chọn thư viện khác ý kiến trúc sư trong quyền của đội → giữ lựa chọn, ghi góp ý trong review; (c) đề nghị thêm service mesh → từ chối bằng điều kiện mở lại của ADR 0021 và mục 'không làm' của `technical-strategy.md`; (d) đề nghị chọn trước công cụ tìm kiếm riêng → để mở, trỏ điều kiện mở lại của ADR 0030."
    suggested_path: "docs/team/architect-week.md"
  - lesson: sysdesign.l4.architecture-health-review
    need: "Tài liệu tiếng Việt (`### `, không `## `/`**`, quan sát và số đều 'giả định', không code, không ADR mới): một buổi xem lại sức khỏe kiến trúc hằng quý (giả định). `### Đầu vào`: bảng 'Giả định cần theo dõi' của `architecture-governance.md`, mục 'Chưa có phép kiểm tự động' của `fitness-functions.md`, `### Ước lượng lãi và gốc` của `tech-debt-register.md`, SLO và error budget trong `slo.md`, `docs/postmortems/`, `delivery-metrics.md`, câu hỏi mở của các design review. `### Giả định cần theo dõi`: mỗi ADR trong bảng — tín hiệu mở lại (chép từ ADR), đã thấy chưa (giả định: chưa tín hiệu nào xuất hiện trong quý này), lựa chọn; kiểm bảng có đủ mọi ADR 'Đã chấp nhận' có điều kiện mở lại, thiếu thì lựa chọn là thêm dòng; ghi quy tắc: tín hiệu xuất hiện → đề xuất ADR mới thay thế, không sửa ADR cũ. `### Khoảng trống chưa có phép kiểm` và `### Nợ kỹ thuật`: mỗi dòng một lựa chọn (giữ / thêm phép kiểm / đưa vào roadmap / đề xuất ADR thay thế). `### Khoảng trống đã biết`: production chưa có Prometheus, sao lưu chưa rời một máy, một commit `gitops-promote.sh` đủ để lên production (thiếu người duyệt thứ hai theo `compliance-controls.md`) → có mục trong `roadmap.md` chưa, người phụ trách theo vai trò. `### Kết quả`: bảng dòng → lựa chọn → người phụ trách theo vai trò → lần xem lại; dòng chưa có lựa chọn để mở rõ ràng. Viết SAU `fitness-functions.md` và mọi doc GĐ4 khác."
    suggested_path: "docs/design/architecture-health-review.md"
  - lesson: sysdesign.l4.where-to-go-next
    need: "Tài liệu tiếng Việt (`### `, không `## `/`**`, không tên người, không chức danh/lương/thăng tiến): `### Cách dùng` (tự chấm hoặc dùng khi kèm người; chấm theo bằng chứng là file đã viết, không theo cảm giác); `### Bảng kỹ năng`: mỗi dòng một loại tài liệu mà quyết định của Đơn Hàng nằm trong đó → file ví dụ trong repo → ba bậc 'viết được với mẫu và người kèm' / 'tự viết một mình' / 'bảo vệ được trước câu phản biện'; ít nhất: tài liệu yêu cầu + NFR (`refund-requirements.md`), design doc (`refund-design.md`), ADR (`docs/adr/`), đánh giá nhà cung cấp bằng ma trận có trọng số (`email-service-evaluation.md`), threat model (`threat-model.md`), SLO + error budget (`slo.md`), kế hoạch dung lượng (`capacity-plan.md`), runbook (`docs/runbooks/`), postmortem (`docs/postmortems/`), design review (`design-review-template.md` + một `*-design-review.md`), đánh giá kiến trúc (`multi-shop-architecture-review.md`), chiến lược kỹ thuật, roadmap, brief lãnh đạo, biện pháp kiểm soát tuân thủ. `### Chọn bước tiếp theo`: dòng yếu nhất chọn việc luyện tiếp; làm lại bài tập trên bài toán mới; với hệ thống thật: viết design review + ADR cho quyết định thật kế tiếp, một quý sau so hệ quả đã dự đoán với điều đã xảy ra. `### Khoảng trống của lộ trình`: tối đa 6 chủ đề lộ trình cố ý không dạy, lấy từ các khoảng trống đã chấp nhận (xem open_questions), không lương/thăng tiến. Thêm một dòng vào `mentoring-plan.md` (management/teams-and-leadership): chọn việc tiếp theo của người được kèm theo dòng thấp nhất của bảng này."
    suggested_path: "docs/team/architecture-skills-checklist.md"
  - lesson: sysdesign.l4.an-architects-week
    need: "STAGE.md stage-4: thêm `architect-week.md`, `architecture-health-review.md`, `architecture-skills-checklist.md` vào bảng file → chủ đề. Thứ tự trong `/repo-stage 4`: ba file này làm CUỐI CÙNG, sau `fitness-functions.md` (trước đó là file 'làm sau cùng') và sau mọi doc GĐ4 mà chúng trích (`architecture-governance.md`, `technical-strategy.md`, `roadmap.md`, `mentoring-plan.md`, `leadership-brief-platform-team.md`, `compliance-controls.md`, hai checklist, `design-review-template.md`, postmortem 0001, `slo.md`, `delivery-metrics.md`, design review của các module bài toán)."
    suggested_path: "STAGE.md"

open_questions:
  - "Số bài: 4 (`an-architects-week`, `architecture-health-review`, `deciding-what-not-to-decide`, `where-to-go-next`). Lý do: docs/00 chỉ hứa một bài kết; schema đòi tối thiểu 3 bài/module; mọi kỹ năng thành phần (governance, ADR, design review, mentoring, brief lãnh đạo, chiến lược, roadmap, fitness function, sự cố) đã dạy ở GĐ3–4, nên module chỉ còn bốn ý mới thật sự: tuần làm việc thực tế, giữ quyết định cũ còn đúng, chọn việc không quyết, tự đánh giá để học tiếp. 'Kèm người' gộp vào bài 1 (một hoạt động trong tuần) và bài 3 (giao quyết định cho đội) thay vì bài riêng, vì `management.l4.mentoring` đã dạy (kể cả câu 'mentoring multiplies an architect's reach'). Đề xuất: chấp nhận 4 bài, main path, đều `stage-4`."
  - "Số ADR: module không cần ADR (chỉ 3 tài liệu thực hành, không quyết định kiến trúc mới, không quyết lại ADR nào). Đề xuất: chấp nhận; ADR tiếp theo (nếu có, sau V1) vẫn từ 0034."
  - "Glossary +0: mọi ý nói được bằng term đã có (architecture-governance, reversible-decision, fitness-function, technical-strategy, roadmap, mentoring, design-review…) hoặc lời thường ('quyền quyết định', 'xem lại sức khỏe kiến trúc', 'tự đánh giá'); module cuối nên term mới không bài sau nào dùng lại. Đề xuất: chấp nhận."
  - "Vai trò kiến trúc sư trong Đơn Hàng: một vai trò làm việc với cả ba đội của ADR 0025, không thuộc riêng đội nào, không tên người, không quyết ai giữ vai trò (giả định trong `architect-week.md`). Không viết ADR tổ chức mới, không sửa ADR 0025. Đề xuất: chấp nhận."
  - "Tỉ lệ thời gian trong tuần (review/tài liệu, trao đổi, kèm người, code) là giả định của dự án, không phải số liệu ngành; bài nêu như opinion có điều kiện ('trong một nhóm cỡ Đơn Hàng…'), không claim số liệu thị trường. Đề xuất: chấp nhận."
  - "Thứ tự `/repo-stage 4`: ba doc của module này làm cuối cùng, SAU `fitness-functions.md` (mục DECISIONS 2026-10-22 gọi file đó là 'sau cùng'), vì `architecture-health-review.md` đọc mục 'Chưa có phép kiểm tự động' của nó. Nếu `fitness-functions.md`, bảng 'Giả định cần theo dõi' của `architecture-governance.md` hoặc mục 'Yêu cầu chuyển lại cho đội' khác với outline (vd không có Prometheus production là khoảng trống) thì DỪNG, sửa outline bài 2–3 trước khi sinh bài, không sửa doc cho khớp."
  - "Khoảng trống liệt kê trong `architecture-skills-checklist.md`: phụ thuộc quyết định đang CHỜ CHỦ về OWASP/injection/XSS (mục backend/security-architecture (9)). Đề xuất: nếu chủ giữ là khoảng trống, liệt kê bảo mật ứng dụng (injection, XSS) cùng tối đa 5 khoảng trống đã chấp nhận khác có ích cho kiến trúc sư (vd chaos engineering/game day, developer portal, policy engine, autoscaling theo sự kiện, kỹ thuật tìm nguyên nhân gốc); nếu chủ thêm module tùy chọn, ghi tên module thay vì khoảng trống. Không ghi lương, career ladder, tuyển dụng, đánh giá hiệu suất (khoảng trống chấp nhận, không nhắc trong bài)."
  - "Bậc tự đánh giá (với mẫu và người kèm / một mình / bảo vệ được trước phản biện) khác ba bước của `mentoring-plan.md` (ghép cặp / tự làm có review sát / sở hữu trọn thay đổi) nhưng cùng tinh thần; `mentoring-plan.md` thêm một dòng trỏ tới checklist. Đề xuất: chấp nhận — sửa một dòng trong doc của management/teams-and-leadership, không đổi outline bài `management.l4.mentoring`."
  - "Bài 4 trỏ về chủ đề qua bảng file → chủ đề của `STAGE.md` (tiếng Anh, đã có từ stage-0), không đưa id bài của Lộ Trình vào tài liệu của đội Đơn Hàng. Prereq `sysdesign.l4.bank-signing-challenges` nối với mục tiêu GĐ4 trong path.yaml (thiết kế ký số ngân hàng và bảo vệ trước phản biện) để bậc 'bảo vệ được' có ví dụ vừa học. Đề xuất: chấp nhận."
  - "Kiểu misconception: câu người học nói thẳng như các module sysdesign trước, không dùng 'Seniors often assume…'. Không tên người, không số liệu thị trường. Đề xuất: chấp nhận."
  - "Tên file là đề xuất (`architect-week.md`, `architecture-health-review.md`, `architecture-skills-checklist.md`); nếu `/repo-stage 4` đổi tên thì sửa `example_files` trước khi sinh bài."
