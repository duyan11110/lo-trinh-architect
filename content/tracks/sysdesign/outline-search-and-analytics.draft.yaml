open_questions:
  - "Số ADR: 0030 = tìm sản phẩm bằng full-text search của PostgreSQL trong Catalog; 0031 = báo cáo từ database báo cáo riêng, nuôi bằng job ETL mỗi giờ; đều 'Đã chấp nhận', chưa xây. Đề xuất: chấp nhận; ADR GĐ4 tiếp theo từ 0032."
  - "versions.yaml không có khóa nào cho công cụ tìm kiếm hay nơi lưu dành cho phân tích (chỉ `data.postgresql` 17, `redis`, `rabbitmq`). Đề xuất: không thêm khóa — cả hai thiết kế dùng PostgreSQL 17 (full-text search, extension bỏ dấu đi kèm PostgreSQL, database báo cáo thường); công cụ tìm kiếm riêng và nơi lưu dành cho truy vấn phân tích chỉ là phương án bị loại/điều kiện mở lại, mô tả bằng lời, không tên sản phẩm. Nếu chủ muốn dạy một công cụ cụ thể, phải thêm khóa versions.yaml và đổi outline bài 2, 3, 6."
  - "Stage-4 không có code tìm kiếm hay ETL: chỉ 6 tài liệu (2 yêu cầu, 2 ADR, 2 design review), trích code/SQL stage-3 có sẵn (`ProductsController.cs`, `CatalogService.cs`, `ICatalog.cs`, `ProductCache.cs`, `OrderMessage.cs`, `db/seed.sql`, `db/queries/*.sql`, `db/replica/start.sh`). Đề xuất: chấp nhận, như tiền lệ multi-shop-and-notifications và payments-and-signing. Một script lab chạy thử full-text search trên seed (`ban phim` → `Bàn phím cơ`) sẽ làm bài 2 cụ thể hơn nhưng là code mới — không làm, claim về full-text search/bỏ dấu kiểm bằng tài liệu PostgreSQL 17."
  - "Chi tiết PostgreSQL cần reviewer 04 kiểm bằng tài liệu PostgreSQL 17 khi viết ADR 0030/bài 2: extension `unaccent` đi kèm bản phân phối và bỏ dấu tiếng Việt trong ví dụ của bài (ví dụ chỉ dùng `Bàn phím cơ`, không dựa vào chữ `đ`); PostgreSQL không có cấu hình text search tiếng Việt nên dùng cấu hình không bỏ đuôi từ; index B-tree không phục vụ mẫu `LIKE` bắt đầu bằng ký tự đại diện. Đề xuất: chấp nhận; câu nào không có nguồn thì viết ở mức nguyên lý."
  - "Phát hiện khi đọc stage-3 (khác với mô tả nhiệm vụ): `ProductCache` chỉ cache `FindAsync` theo `id` (TTL 5 phút); `CatalogService.ListAsync` đọc thẳng `CatalogDbContext`, danh sách sản phẩm không qua Redis. Đề xuất: outline viết đúng như code (bài 1 mục 5, bài 3 mục 5)."
  - "Trang sản phẩm công khai cho máy tìm kiếm (ADR 0017 để quyết riêng): module này không quyết, chỉ tách nghĩa ở bài 1 và trả lời phản biện ở bài 4 (HTML từ server, đọc cùng Catalog). Đề xuất: chấp nhận; không ADR mới cho việc này ở V1."
  - "Báo cáo xuyên cửa hàng khi cửa hàng có database riêng (câu hỏi mở của multi-shop-design-review.md): ADR 0031 trả lời bằng job đọc bảng ánh xạ mỗi lần chạy. Đề xuất: không sửa multi-shop-design-review.md (bài multi-shop-challenges dựa vào câu hỏi mở đó); reporting-design-review.md ghi rõ nó trả lời câu hỏi ấy."
  - "Báo cáo của nhân viên làm quá tải `db`: chọn database báo cáo riêng thay vì định tuyến báo cáo sang `db-replica`. Lý do: doanh thu cần `donhang` + `donhang_payments` (không join hai database trong một truy vấn), cửa hàng chuyển theo ADR 0026 không nằm trên replica đó. Đề xuất: chấp nhận; `capacity-plan.md` không đổi (vẫn mọi đọc ở primary); job ETL đọc nguồn bằng truy vấn ngắn, đọc qua replica nếu có (giả định)."
  - "Không nuôi báo cáo từ message ở V1: `OrderMessage` (stage-3) chỉ có `OrderId`, `CustomerEmail`, `CustomerName`, `OccurredAt` — không số tiền, không món; `shopId` chỉ thêm từ release 2 của multi-shop-data-rollout.md. Đề xuất: chấp nhận; không đổi `OrderMessage`; đó là bước của điều kiện mở lại 'số liệu trực tiếp' trong ADR 0031."
  - "Số giả định của dự án: sản phẩm mỗi cửa hàng nhiều nhất vài nghìn; sản phẩm mới/đổi tên xuất hiện trong tìm kiếm trong vài phút; số liệu báo cáo cũ nhiều nhất hai giờ; job chạy mỗi giờ; mỗi lần tính lại vài ngày gần nhất; ngày theo giờ Việt Nam; database báo cáo trên server riêng; đội Cửa hàng phụ trách Catalog và database báo cáo. Đề xuất: chấp nhận; `/repo-stage 4` đổi số thì sửa outline trước khi sinh bài."
  - "Glossary +4: `full-text-search` (vi_keep), `inverted-index` (vi_keep), `analytical-query`, `etl` (vi_keep). Không thêm term cho 'materialized view', 'data warehouse', 'column store' — bài nói bằng lời. Đề xuất: chấp nhận."
  - "Tên file là đề xuất (`product-search-requirements.md`, `product-search-design-review.md`, `reporting-requirements.md`, `reporting-design-review.md`, slug ADR 0030/0031). Nếu `/repo-stage 4` đổi tên, sửa `example_files` trước khi sinh bài."
