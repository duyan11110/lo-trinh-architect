    suggested_path: "docs/adr/0030-tim-san-pham-bang-full-text-search-cua-postgresql.md"
  - lesson: sysdesign.l4.product-search-design
    need: "Design review theo design-review-template.md: quyết định cần review + đề xuất, driver, ước lượng, một khối mermaid (app → API `GET /api/v1/products` có tham số tìm → `ICatalog` → `products` + inverted index trong PostgreSQL; replica là bước sau), đi sâu 'gõ không dấu' (cả tên lưu và câu tìm chuẩn hóa như nhau; `ban phim` tìm ra `Bàn phím cơ`), nút cổ chai (mỗi lần tìm là một truy vấn; `ProductCache` theo `id` không giúp; trần `catalog-reads` 20 chạy + 5 chờ mỗi process), điểm đánh đổi (chạy trong PostgreSQL vs công cụ riêng; khớp nguyên từ vs gõ sai/đồng nghĩa; không cache kết quả theo từ khóa — giả định phần lớn câu tìm khác nhau), rủi ro, câu hỏi mở với người phụ trách theo vai trò, mục 'Câu hỏi phản biện' 4–5 câu trỏ ADR 0016, 0017, 0026, 0030 và `capacity-plan.md`. Không code."
    suggested_path: "docs/design/product-search-design-review.md"
  - lesson: sysdesign.l4.reporting-requirements
    need: "Tài liệu tiếng Việt (`### `, không `## `/`**`, số 'giả định'): xuất phát (stage-3 không có báo cáo nào ngoài các file `db/queries/*.sql` của bài SQL; từ stage-3 thanh toán ở `donhang_payments`, đơn ở `donhang` nên `revenue-by-customer.sql` không còn chạy được như một truy vấn; câu hỏi mở 'báo cáo xuyên cửa hàng' của multi-shop-design-review.md; capacity-plan.md giữ mọi đọc ở primary); hai nhóm người đọc (nhân viên một cửa hàng chỉ thấy cửa hàng mình; đội Đơn Hàng xem mọi cửa hàng); BC-n dạng kịch bản có thước đo: doanh thu/số đơn/hoàn tiền theo ngày, sản phẩm bán chạy theo cửa hàng; số liệu cũ nhiều nhất hai giờ (giả định), luôn ghi thời điểm chốt số; ngày tính theo giờ Việt Nam (giả định, trỏ orders-by-day.sql); ước lượng: số đơn mỗi ngày theo giả định của capacity-plan.md × thời gian giữ (giả định) → báo cáo một năm đọc rất nhiều dòng, một truy vấn báo cáo giữ kết nối lâu hơn một lần đặt hàng nhiều lần (giả định); driver xếp hạng; giả định + vai trò xác nhận (người phụ trách database báo cáo — đội Cửa hàng của ADR 0025, giả định)."
    suggested_path: "docs/team/reporting-requirements.md"
  - lesson: sysdesign.l4.reporting-design
    need: "ADR 0031 (Đã chấp nhận, chưa xây) + dòng README ADR + một dòng trong data-ownership.md ('tổng báo cáo theo cửa hàng theo ngày — bản sao; chủ của từng con số vẫn là Ordering/Payments; giữ cho đúng bằng job chạy lại mỗi giờ'): database báo cáo trên server riêng (giả định); job ETL mỗi giờ (giả định) đọc `donhang`, `donhang_payments` và mọi database trong bảng ánh xạ cửa hàng của ADR 0026, ghi tổng theo cửa hàng theo ngày; mỗi lần chạy tính lại vài ngày gần nhất (giả định) và thay các dòng của những ngày đó (lặp lại an toàn); mỗi dòng có shop id, nhân viên cửa hàng đọc theo cửa hàng lấy từ access token (từ release 2), row-level security như ADR 0013 (giả định); truy vấn báo cáo chỉ đọc database báo cáo; dựng lại thay vì khôi phục; ít nhất 4 phương án (báo cáo trên primary; trên `db-replica` — bản sao cả server nhưng không join hai database trong một truy vấn, không có database riêng của cửa hàng; read model nuôi từ message — `OrderMessage` không có số tiền/món, không đọc lại được đơn cũ từ broker; database báo cáo nuôi bằng job — chọn); điều kiện mở lại (yêu cầu số liệu trực tiếp; câu hỏi mà tổng theo ngày không trả lời kịp — khi đó một nơi lưu dành cho truy vấn phân tích, mô tả bằng lời, không tên sản phẩm). Không code."
    suggested_path: "docs/adr/0031-bao-cao-tu-database-bao-cao-rieng.md"
  - lesson: sysdesign.l4.reporting-design
    need: "Design review theo design-review-template.md: driver, ước lượng, một khối mermaid (`donhang`, `donhang_payments`, database riêng của cửa hàng theo bảng ánh xạ → job ETL mỗi giờ → database báo cáo → báo cáo của nhân viên cửa hàng / của đội Đơn Hàng), đi sâu 'cửa hàng chuyển database' (job đọc bảng ánh xạ mỗi lần chạy; trả lời câu hỏi mở của multi-shop-design-review.md — không sửa file đó), nút cổ chai (lượt đọc của job lên nguồn: truy vấn ngắn theo ngày gần đây), điểm đánh đổi (chu kỳ chạy; lô vs message; tổng theo ngày vs câu hỏi mới; dựng lại vs sao lưu), rủi ro (thay đổi cũ hơn cửa sổ tính lại, ví dụ hoàn tiền muộn — chạy lại toàn bộ định kỳ, giả định), câu hỏi mở với người phụ trách theo vai trò, mục 'Câu hỏi phản biện' 4–5 câu trỏ data-ownership.md, ADR 0013, 0026, 0028, 0031. Không code."
    suggested_path: "docs/design/reporting-design-review.md"
