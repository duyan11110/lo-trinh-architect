    need: "Tài liệu tiếng Việt (`### `, không `## `/`**`, mọi số ghi 'giả định'): xuất phát stage-3 (`GET /api/v1/products` trang tối đa 100, sắp theo `id`, chỉ lọc `maxPriceVnd`; `ProductCache` chỉ giữ từng sản phẩm theo `id`, danh sách không qua cache); phạm vi: tìm trong một cửa hàng; trang sản phẩm công khai cho máy tìm kiếm ngoài phạm vi theo ADR 0017 (không quyết lại); TK-n dạng kịch bản có thước đo: gõ không dấu vẫn ra sản phẩm (ví dụ `ban phim` → `Bàn phím cơ` của seed), khớp nhất lên trước, chỉ sản phẩm của cửa hàng người gọi, sản phẩm mới/đổi tên xuất hiện trong vài phút (giả định, cùng lựa chọn với danh sách sản phẩm trong consistency-per-operation.md), tìm kiếm không lấy sức chứa của đặt hàng; ước lượng: sản phẩm mỗi cửa hàng nhiều nhất vài nghìn, phần đọc sản phẩm là tìm kiếm theo tỉ lệ giả định so với đỉnh đọc sản phẩm của capacity-plan.md (không sửa capacity-plan.md); giả định + vai trò xác nhận (đội Cửa hàng của ADR 0025 phụ trách Catalog — giả định); driver xếp hạng."
