  - "No multi-shop or multi-channel code at stage-4: the module is four prose files plus two ADRs, quoting only existing stage-3 code (`Notification.cs`, `NotificationSender.cs`, `OrderEventsConsumer.cs`, `pitr.sh`). A lab script restoring one shop from `db/tenancy/` was considered and left out. Proposed answer: accept; a script can come with a later optional lesson."
