levels:
- level: 1
  title:
    vi: "Level 1"
    en: "Level 1"
  modules:
  - id: deploy-basics
    title:
      vi: "Deploy là gì, và reverse proxy/TLS"
      en: "What deploy means, and reverse proxy/TLS"
    stage: 1
    summary:
      vi: "Giải thích deploy là gì, đọc được cấu hình Caddy làm reverse proxy có TLS termination thật cho API Đơn Hàng, và vì sao deploy bằng tay không đủ."
      en: "Explain what deploy means, read Caddy's real reverse-proxy-with-TLS-termination config for the Đơn Hàng API, and why deploying by hand isn't enough."
    lessons:
    - id: devops.l1.what-is-deploy
      title:
        vi: "Chạy trên máy mình khác chạy trên máy khác"
        en: "Running on your machine isn't running on another one"
      main_path: true
      duration_min: 12
      skills: [devops.deploy.what-is-deploy]
      prereqs: [foundation.l1.ssh-and-remote, management.l1.how-software-gets-made]
      related: []
      vocab: [deploy]
      example_tag: stage-1
      example_files: []
      outline:
      - "Deploy is getting a specific, tested version of code running somewhere other than the machine that wrote it — reachable by whoever needs to use it."
      - "'It works on my machine' says nothing about deploy: the target machine has its own OS, its own installed runtimes, its own network, none of which match the machine that built the code."
      - "The lab is a small version: `scripts/up.sh` builds the API and runs it apart from the editor, next to Postgres, reachable only through Caddy; a real deploy is the same idea on a machine meant to keep running."
      misconceptions:
      - "Deploy just means copying the built files to another folder; if they run there, deploy succeeded."
      - "A deploy that works once will keep working the same way every time after."
      depth_notes: "Không nói CI/CD pipeline hay môi trường nhiều tầng (staging/prod) — module devops GĐ2. Chỉ khái niệm deploy là gì."
    - id: devops.l1.reverse-proxy-basics
      title:
        vi: "Reverse proxy: client chỉ nói chuyện với Caddy"
        en: "Reverse proxy: the client only ever talks to Caddy"
      main_path: true
      duration_min: 13
      skills: [devops.deploy.reverse-proxy]
      prereqs: [devops.l1.what-is-deploy, backend.l1.what-kestrel-does]
      related: []
      vocab: [reverse-proxy]
      example_tag: stage-1
      example_files: [Caddyfile]
      outline:
      - "A reverse proxy sits in front of the real application, accepts requests from outside, and forwards them on — the client only ever talks to the proxy, never to Kestrel directly."
      - "Caddy answered `/api/v1/*` with fixed fake responses in stage 0; now one `reverse_proxy` line forwards it to Kestrel, while `/admin`, `/conflict` and `/slow` still use `respond`."
      - "A reverse proxy can do the same job for many things behind it — routing, adding headers — without the application itself knowing a proxy is even there."
      misconceptions:
      - "A reverse proxy is just a firewall that blocks bad requests, not something that forwards good ones."
      - "Kestrel could just as easily be reached directly, so the reverse proxy is only there for convenience."
      depth_notes: "Không nói load balancing nhiều instance hay retry logic — module devops GĐ2+. Chỉ vai trò forward request."
    - id: devops.l1.reverse-proxy-and-tls
      title:
        vi: "TLS termination: giải mã một lần, ở Caddy"
        en: "TLS termination: decrypted once, at Caddy"
      main_path: true
      duration_min: 13
      skills: [devops.deploy.reverse-proxy]
      prereqs: [devops.l1.reverse-proxy-basics, foundation.l1.tls-and-https]
      related: []
      vocab: [tls-termination]
      example_tag: stage-1
      example_files: [Caddyfile]
      outline:
      - "TLS termination is decrypting HTTPS traffic at one point — the reverse proxy — instead of every application behind it managing its own certificate."
      - "Caddy holds `donhang.local`'s certificate and speaks HTTPS to the outside world; the connection from Caddy to Kestrel, inside the same lab network, stays plain HTTP — Kestrel never sees a certificate."
      - "Terminating TLS at the proxy means renewing or replacing a certificate touches one place, not every service the proxy forwards to."
      misconceptions:
      - "If TLS is terminated at the proxy, the connection from the proxy to Kestrel is just as encrypted as the original one."
      - "Every application behind a reverse proxy needs its own TLS certificate, or the setup isn't really secure."
      depth_notes: "Không nói mTLS hay network policy giữa proxy và app — module devops GĐ3 (mTLS). Chỉ TLS termination cơ bản."
    - id: devops.l1.why-not-deploy-by-hand
      title:
        vi: "Deploy bằng tay: chạy được lần này, không đảm bảo lần sau"
        en: "Deploying by hand: works this time, no guarantee next time"
      main_path: true
      duration_min: 12
      skills: [devops.deploy.motivation]
      prereqs: [devops.l1.reverse-proxy-and-tls]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: []
      outline:
      - "Deploying by hand — SSH in, stop the old process, copy the new build, start it again — works once, but repeats differently every time a person does it, with no record of exactly what changed."
      - "A manual deploy has no fixed definition of what the target machine needs installed; the next module's Docker image is exactly that definition, made repeatable."
      - "The gap between 'built and tested here' and 'running the same way there' is what the rest of this track — Docker, config, and later CI/CD — closes, one piece at a time."
      misconceptions:
      - "A manual deploy is fine as long as the same person always does it."
      - "Once a deploy script exists, running it by hand is no different from an automated one."
      depth_notes: "Không nói CI/CD thật — module devops GĐ2. Bài này chỉ tạo động lực cho Docker (module ngay sau)."
  - id: docker
    title:
      vi: "Docker: image, layer, volume, network, và Compose"
      en: "Docker: image, layer, volume, network, and Compose"
    stage: 1
    summary:
      vi: "Đọc được docker-compose.yml và Dockerfile thật của Đơn Hàng, viết một Dockerfile multi-stage cho .NET, và thêm service api vào Compose."
      en: "Read Đơn Hàng's real docker-compose.yml and Dockerfile, write a multi-stage .NET Dockerfile, and add the api service to Compose."
    lessons:
    - id: devops.l1.image-vs-container
      title:
        vi: "Image là khuôn, container là bản đang chạy"
        en: "An image is the template, a container is the running copy"
      main_path: true
      duration_min: 12
      skills: [devops.docker.fundamentals]
      prereqs: [devops.l1.why-not-deploy-by-hand, foundation.l1.program-to-process]
      related: []
      vocab: [image, container]
      example_tag: stage-0
      example_files: [lab/Dockerfile]
      outline:
      - "A Docker image is a read-only template — filesystem plus metadata — built once; a container is one running instance of it, the same way a class relates to an object, or a program to a process."
      - "`docker build` produces an image; `docker run` starts a container from it — running the same image twice produces containers that start out identical."
      - "The lab box this course has used since GĐ0 is a container running from the image `lab/Dockerfile` builds; every script's output has been identical across machines because of exactly this."
      misconceptions:
      - "An image and a container are two names for the same thing."
      - "Starting a second container from the same image shares state with the first one, since they came from the same image."
      depth_notes: "Không nói registry hay image tagging chi tiết — bài compose-for-the-api chạm nhẹ. Chỉ phân biệt image/container."
    - id: devops.l1.dockerfile-and-layers
      title:
        vi: "Mỗi bước Dockerfile thay đổi file là một image layer"
        en: "Each Dockerfile step that changes files is one image layer"
      main_path: true
      duration_min: 13
      skills: [devops.docker.fundamentals]
      prereqs: [devops.l1.image-vs-container]
      related: []
      vocab: [image-layer]
      example_tag: stage-0
      example_files: [lab/Dockerfile]
      outline:
      - "`FROM` brings in a base image's layers, and each `RUN` or `COPY` adds one image layer on top; the image is those layers stacked, and Docker caches each one separately."
      - "`lab/Dockerfile` is two instructions: `FROM lscr.io/linuxserver/openssh-server:...` brings the base layers, and `RUN apk add ...` adds one layer with the lab's tools on top."
      - "Rebuilding an image reuses every layer whose instruction and inputs didn't change; only the layers after the first real change need to be rebuilt."
      misconceptions:
      - "Every Dockerfile instruction runs again from scratch on every build, so layers don't actually save any time."
      - "A layer is just a comment describing what a Dockerfile does, with no effect on the built image."
      depth_notes: "Không nói .dockerignore hay thứ tự COPY để tối ưu cache chi tiết — bài dockerfile-for-dotnet sau chạm nhẹ. Chỉ ý tưởng image layer."
    - id: devops.l1.volumes
      title:
        vi: "Volume sống ngoài vòng đời container"
        en: "A volume outlives the container's own lifecycle"
      main_path: true
      duration_min: 13
      skills: [devops.docker.storage]
      prereqs: [devops.l1.dockerfile-and-layers]
      related: []
      vocab: [volume]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "A container's own filesystem disappears when the container is removed; a volume is storage that exists independently of any one container's lifecycle."
      - "`docker-compose.yml`'s `db-data` volume is where Postgres actually keeps `customers`, `products`, `orders`; removing and recreating the `db` container does not lose that data, because the volume isn't part of the container."
      - "A bind mount (the `lab` service's `./:/repo:ro`) also keeps data outside the container, but it is a separate mount type tied to a host path; a named volume (`db-data`) is managed by Docker."
      misconceptions:
      - "Removing a container also deletes any volume it used, the same way removing a variable deletes what it pointed to."
      - "A volume is just a backup Docker makes automatically; nothing needs to be declared for it to exist."
      depth_notes: "Không nói volume driver hay backup/restore thật — module devops GĐ3 (backup/restore). Chỉ ý tưởng: dữ liệu sống ngoài vòng đời container."
    - id: devops.l1.docker-networks
      title:
        vi: "Cùng Docker network thì gọi được nhau bằng tên"
        en: "Same Docker network means you can call each other by name"
      main_path: true
      duration_min: 13
      skills: [devops.docker.networking]
      prereqs: [devops.l1.volumes, foundation.l1.dns]
      related: []
      vocab: [docker-network]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "Containers on the same Docker network can reach each other by service name, resolved the same way the DNS lesson already explained — Docker runs its own DNS for the network."
      - "The `donhang` network in `docker-compose.yml` gives `db` and `lab` fixed IP addresses, so every lesson's networking output is the same on every machine, not just reachable by name."
      - "Two containers on different Docker networks can't reach each other by default, the same way two machines on different physical networks can't without something bridging them."
      misconceptions:
      - "Any two running containers on the same machine can always reach each other, network or not."
      - "A container's IP address inside a Docker network is the same address other programs on the host machine would use to reach it."
      depth_notes: "Không nói CNI hay network policy — track k8s GĐ2+. Chỉ Docker network cơ bản (bridge network mặc định của Compose)."
    - id: devops.l1.dockerfile-for-dotnet
      title:
        vi: "Dockerfile cho DonHang.Api: SDK để build"
        en: "A Dockerfile for DonHang.Api: the SDK to build"
      main_path: true
      duration_min: 14
      skills: [devops.docker.dotnet-image]
      prereqs: [devops.l1.docker-networks, backend.l1.hosting-and-program-cs]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Dockerfile]
      outline:
      - "A Dockerfile for `DonHang.Api` starts from a .NET SDK base image to build, since compiling needs the SDK; running the built app doesn't."
      - "`dotnet publish` inside the image produces the same compiled output it would on a developer's machine — the Dockerfile just runs the exact command a person would."
      - "Copying only `.csproj`/`Directory.Packages.props` files before the rest of the source, then restoring just those, lets that layer be cached across builds where only application code changed."
      misconceptions:
      - "The same base image should run the app in production as compiled it, since that avoids extra steps."
      - "Copying the whole source tree first, then restoring packages, is simpler and just as fast to rebuild."
      depth_notes: "Không nói multi-stage build cụ thể (FROM thứ hai) — bài sau. Chỉ base image SDK và dotnet publish."
    - id: devops.l1.multi-stage-builds
      title:
        vi: "Multi-stage: build bằng SDK, chạy bằng runtime"
        en: "Multi-stage: build with the SDK, run with the runtime"
      main_path: true
      duration_min: 14
      skills: [devops.docker.dotnet-image]
      prereqs: [devops.l1.dockerfile-for-dotnet]
      related: []
      vocab: [multi-stage-build]
      example_tag: stage-1
      example_files: [DonHang.Api/Dockerfile]
      outline:
      - "A multi-stage build has more than one `FROM` in the same Dockerfile; each `FROM` starts a fresh stage, and a later stage can `COPY --from=` an earlier one's output without keeping anything else from it."
      - "`DonHang.Api`'s Dockerfile builds in an SDK-image stage, then copies only the published output into a runtime-image stage — the final image never contains the SDK, the source, or intermediate build files."
      - "A runtime-only final image is smaller and has a smaller attack surface than one carrying the whole SDK, since there's less installed to exploit or to download."
      misconceptions:
      - "Every FROM in a Dockerfile has to produce its own separate image; there's no way to combine stages into one final result."
      - "The SDK image and the runtime image behave identically, so which one the final container runs from doesn't matter."
      depth_notes: "Không nói image scanning hay supply chain security — module devops GĐ3 (supply chain). Chỉ ý tưởng multi-stage giảm kích thước/bề mặt."
    - id: devops.l1.compose-for-the-api
      title:
        vi: "Thêm service api vào docker-compose.yml"
        en: "Adding the api service to docker-compose.yml"
      main_path: true
      duration_min: 14
      skills: [devops.docker.compose]
      prereqs: [devops.l1.multi-stage-builds, devops.l1.docker-networks]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "The `api` service in `docker-compose.yml` reuses shapes the file already has: a `build` like `lab`, the `donhang` network like `db`, and a `depends_on` naming what must run first."
      - "`depends_on` with `db`'s healthcheck means Compose waits for Postgres to report ready, not just for the `db` container to exist, before starting `api` — a container can exist and still not accept connections yet."
      - "The connection string `DonHang.Api` uses to reach Postgres names the service, `db`, not `localhost` — inside the `donhang` network, that's the name that resolves."
      misconceptions:
      - "depends_on guarantees the dependency is fully ready, not just that its container has started."
      - "The API container should connect to the database using the same address a developer's own machine would use outside Docker."
      depth_notes: "Không nói CI/CD build image hay push registry — module devops GĐ2. Chỉ Compose service cho api chạy local."
  - id: config-and-secrets
    title:
      vi: "Config qua biến môi trường, secret, và 12-factor"
      en: "Config through environment variables, secrets, and 12-factor"
    stage: 1
    summary:
      vi: "Tách config khỏi code bằng biến môi trường, phân biệt secret với config thường bằng ví dụ thật của repo, và đặt đúng chỗ cho JWT secret."
      en: "Separate config from code with environment variables, distinguish secrets from ordinary config using the repo's real setup, and put the JWT secret where it belongs."
    lessons:
    - id: devops.l1.config-and-env
      title:
        vi: "Config: khác nhau theo nơi chạy, tách khỏi code"
        en: "Config: varies by where it runs, separate from code"
      main_path: true
      duration_min: 12
      skills: [devops.config.basics]
      prereqs: [foundation.l1.env-and-config, devops.l1.compose-for-the-api]
      related: []
      vocab: [config]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "Config is everything about how an app behaves that varies by where it runs — a database address, a log level — kept separate from code that doesn't change between environments."
      - "ASP.NET Core reads config from several sources; an environment variable overrides the same key from `appsettings.json` — the mechanism the env-and-config lesson covered, now for app settings."
      - "`docker-compose.yml`'s `environment:` block is how `DonHang.Api`'s container gets its config — the connection string, the database password — without any of it written into the image itself."
      misconceptions:
      - "Config belongs in appsettings.json only; environment variables are just for the operating system, not the app."
      - "The same config values should work unchanged in every environment, or something was set up wrong."
      depth_notes: "Không nói cấu hình phân tầng nhiều môi trường (appsettings.Production.json) chi tiết — module devops GĐ2. Chỉ ý tưởng config tách khỏi code."
    - id: devops.l1.secrets-vs-config
      title:
        vi: "Secret: config không ai ngoài người được phép được đọc"
        en: "Secrets: config nobody unauthorized should read"
      main_path: true
      duration_min: 13
      skills: [devops.config.secrets]
      prereqs: [devops.l1.config-and-env]
      related: []
      vocab: [secret]
      example_tag: stage-1
      example_files: [".gitignore", scripts/dev-secrets.sh]
      outline:
      - "A secret is config that must never be readable by anyone who shouldn't have it — a database password, a signing key — a stricter category than ordinary config like a log level."
      - "`.gitignore` already excludes `.env` and `secrets/`; `scripts/dev-secrets.sh` generates a `.env` with `POSTGRES_PASSWORD` and a key into `secrets/`, so every developer gets working values without any of them being committed."
      - "`docker-compose.yml`'s `${POSTGRES_PASSWORD}` is filled in from that gitignored `.env` automatically — the compose file itself contains no real password, committed or not."
      misconceptions:
      - "A secret that's gitignored locally is safe even if it was committed once, earlier in the repository's history."
      - "Ordinary config and secrets can be treated the same way, since both are just environment variables."
      depth_notes: "Không nói secret manager thật (Vault, SOPS) hay rotate secret — module devops GĐ3 (Secret: Vault, SOPS). Chỉ phân biệt secret khỏi config thường, bằng ví dụ thật của repo."
    - id: devops.l1.the-jwt-secret-in-practice
      title:
        vi: "JWT secret: đóng đúng chỗ đã hoãn"
        en: "The JWT secret: closing the gap left open earlier"
      main_path: true
      duration_min: 13
      skills: [devops.config.secrets]
      prereqs: [devops.l1.secrets-vs-config, backend.l1.issuing-a-jwt]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [scripts/dev-secrets.sh, DonHang.Api/Program.cs]
      outline:
      - "The signing secret `issuing-a-jwt` deferred is exactly a secret in this module's sense: generated into `.env` alongside `POSTGRES_PASSWORD`, and read from config the same way as the connection string."
      - "A JWT signed with a leaked secret would let anyone forge a valid token for any customer — the same reasoning that already kept `POSTGRES_PASSWORD` out of the repository applies here, for a different value."
      - "Once the API restarts with a new JWT secret, every token issued with the old one stops being accepted at once — there's no partial rollout of a signing key change."
      misconceptions:
      - "The JWT secret only matters if the API is publicly reachable; inside a private network it can be anything."
      - "A short, memorable JWT secret is fine, since the signature check is what matters, not the secret's own strength."
      depth_notes: "Không nói key rotation có kế hoạch hay asymmetric signing (RS256, đã hoãn ở issuing-a-jwt) — GĐ2+. Chỉ đóng đúng điểm đã hoãn: secret nằm ở đâu."
    - id: devops.l1.twelve-factor-config
      title:
        vi: "12-factor: nguyên tắc Config, gọi tên điều đã làm"
        en: "12-factor: naming the Config rule already followed"
      main_path: true
      duration_min: 12
      skills: [devops.config.twelve-factor]
      prereqs: [devops.l1.the-jwt-secret-in-practice]
      related: []
      vocab: [twelve-factor]
      example_tag: stage-1
      example_files: []
      outline:
      - "The twelve-factor app is a set of principles for apps that run reliably across many environments; this course has already been following its Config rule without naming it — strict separation of config from code."
      - "Under twelve-factor's Config rule, the same built artifact — the same Docker image — runs in every environment; only the environment variables around it change, never a rebuild for a different database address."
      - "This module covered one factor in depth; the other factors show up piece by piece in later modules, not all at once here."
      misconceptions:
      - "Twelve-factor is a checklist every app must fully satisfy from day one, or it's being built wrong."
      - "Config living in environment variables is the whole of twelve-factor, and the other eleven factors are about something else entirely unrelated."
      depth_notes: "Không liệt kê hay giải thích 11 factor còn lại — chỉ Config, factor duy nhất module này thật sự dạy. Không nói stateless process hay disposability — chạm ở module devops GĐ2+ khi liên quan."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: ci-cd
    title:
      vi: "CI/CD với GitHub Actions: kiểm tra, đóng gói, đưa tới môi trường"
      en: "CI/CD with GitHub Actions: check, package, deliver"
    stage: 2
    summary:
      vi: "Đọc và mở rộng được workflow GitHub Actions của Đơn Hàng: kiểm tra mỗi thay đổi, cache, build image một lần, trao artifact giữa các job, đưa bản xanh tới staging và migrate database thành bước riêng."
      en: "Read and extend Đơn Hàng's GitHub Actions workflow: check every change, cache, build the image once, pass artifacts between jobs, deliver a green build to staging and migrate the database as its own step."
    lessons:
    - id: devops.l2.continuous-integration
      title:
        vi: "Tích hợp liên tục: mỗi lần push được một máy sạch kiểm tra"
        en: "Continuous integration: every push is checked on a clean machine"
      main_path: true
      duration_min: 12
      skills: [devops.ci.continuous-integration]
      prereqs:
      - foundation.l2.git-merge-vs-rebase
      - management.l1.code-review-basics
      - devops.l1.twelve-factor-config
      related: []
      vocab: [continuous-integration]
      example_tag: stage-1
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "Continuous integration means merging small changes into the shared main branch often, with every change built and tested automatically rather than by whoever remembers to."
      - "Đơn Hàng's `.github/workflows/ci.yml` runs on every push and every pull request, so a change is checked on its branch before it is merged, and again after."
      - "CI runs on a fresh machine that has only what the repository declares, so a file that was never committed or a tool installed only on one laptop makes the run fail."
      - "A CI result belongs to one commit: a green run says that commit built and passed its checks, nothing about the commits that come after it."
      misconceptions:
      - "CI is the name of a tool like GitHub Actions; a team that uses GitHub Actions is doing CI by definition."
      - "If I run the tests on my own machine before pushing, a CI run adds nothing."
      depth_notes: "Không nói cú pháp workflow (job, step, runner) — devops.l2.ci-pipeline-anatomy; không nói chặn merge khi đỏ — devops.l2.quality-gate; không nói CD — devops.l2.deployment-environments. Không so sánh trunk-based với feature branch."
    - id: devops.l2.ci-pipeline-anatomy
      title:
        vi: "ci.yml chạy thế nào: đọc một workflow từ trên xuống"
        en: "What happens when ci.yml runs: a workflow read top to bottom"
      main_path: true
      duration_min: 14
      skills: [devops.ci.continuous-integration]
      prereqs: [devops.l2.continuous-integration, foundation.l1.shell-scripts]
      related: []
      vocab: [github-actions, workflow, runner]
      example_tag: stage-1
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "A GitHub Actions workflow is a YAML file in `.github/workflows/`; its `on:` block lists the events that start it, such as `push`, `pull_request` and `workflow_dispatch` (a manual run)."
      - "A workflow holds one or more jobs; each job runs on a runner, a machine started for that job and named by `runs-on` (`ubuntu-24.04` in `ci.yml`), which has no code until `actions/checkout` fetches it."
      - "A job's steps run in order on the same runner: a step with `uses:` runs a published action such as `actions/setup-dotnet@v4`, a step with `run:` runs shell commands."
      - "A step fails when its command exits with a non-zero code; later steps are then skipped unless their `if:` says otherwise, as `if: failure()` and `if: always()` do in `ci.yml`."
      misconceptions:
      - "The runner already has the repository's code, so `actions/checkout` is just a formality."
      - "If one step fails, GitHub still runs the remaining steps and reports how many of them failed."
      - "`uses:` and `run:` are two spellings of the same thing."
      depth_notes: "Chỉ một job như ci.yml stage-1; nhiều job song song và `needs:` — devops.l2.workflow-artifacts. Không nói matrix, reusable workflow, tự viết action, self-hosted runner, cú pháp expression."
    - id: devops.l2.quality-gate
      title:
        vi: "Quality gate: những gì phải xanh trước khi thay đổi đi tiếp"
        en: "A quality gate: what must pass before a change goes further"
      main_path: true
      duration_min: 13
      skills: [devops.ci.quality-gate]
      prereqs:
      - devops.l2.ci-pipeline-anatomy
      - design.l2.test-pyramid
      - design.l2.testcontainers-postgresql
      - management.l1.reading-a-300-line-pr
      related: []
      vocab: [quality-gate]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", DonHang.Tests/DonHang.Tests.csproj]
      outline:
      - "A quality gate is a set of automated checks a change must pass before it may go further; in Đơn Hàng they are the build with `--warnaserror`, `dotnet test`, `flutter analyze` and `flutter test`."
      - "At stage-2, `dotnet test` in CI also runs the integration tests: Testcontainers starts PostgreSQL and Redis on the Docker engine the GitHub-hosted Ubuntu runner already has, without the lab."
      - "A workflow only reports pass or fail on a commit; refusing to merge a pull request while a check is red is a repository setting on GitHub (required status checks), not something `ci.yml` does."
      - "A green gate proves only what its checks check: at stage-1 the suite passed while cancelling a `shipped` order was still allowed, because no test covered that case."
      misconceptions:
      - "A green CI run means the change has no bugs."
      - "Putting `dotnet test` in the workflow is enough to stop a failing pull request from being merged."
      - "Integration tests can't run in CI because they need Docker, so CI should run only unit tests."
      depth_notes: "Không nói code coverage, lint/format, quét bảo mật hay quét image — ngoài GĐ2 (quét image: devops/supply-chain GĐ3). Không hướng dẫn bật required status check trong settings. Không nói tách job — devops.l2.workflow-artifacts."
    - id: devops.l2.dependency-cache
      title:
        vi: "Cache gói NuGet giữa các lần chạy bằng cache key"
        en: "Caching NuGet packages between runs with a cache key"
      main_path: true
      duration_min: 13
      skills: [devops.ci.cache-and-artifacts]
      prereqs: [devops.l2.quality-gate, devops.l1.dockerfile-for-dotnet, foundation.l1.http-caching]
      related: []
      vocab: [cache-key]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", Directory.Packages.props]
      outline:
      - "Every job starts on a fresh runner, so without a cache `dotnet restore` downloads every NuGet package again on every run."
      - "`actions/cache` restores a saved folder when a copy exists under the step's cache key, and when no copy matched that key exactly it saves the folder under it after the job succeeds."
      - "Đơn Hàng keys the NuGet package folder on a hash of `Directory.Packages.props` and every `.csproj` file, so the key changes whenever the declared packages change, and also on any other edit to those files."
      - "When no key matches exactly, `restore-keys` restores the most recent cache whose key starts with a given prefix; `dotnet restore` then downloads only the packages still missing."
      - "A cache only saves time: the job must pass the same way when nothing is restored, because a cache can be missing or removed by GitHub."
      misconceptions:
      - "A cache hit means the build step itself is skipped."
      - "The cache key should never change, so that the cache is always hit."
      depth_notes: "Không nói cache layer Docker trong CI hay cache của Flutter/pub. Không nêu giới hạn dung lượng hay thời hạn giữ cache. Khác biệt cache với artifact — devops.l2.workflow-artifacts."
    - id: devops.l2.building-images-in-ci
      title:
        vi: "Build image của API trong CI, mỗi lần chạy một lần"
        en: "Building the API image in CI, once per run"
      main_path: true
      duration_min: 13
      skills: [devops.cd.delivery]
      prereqs: [devops.l2.quality-gate, devops.l1.multi-stage-builds, devops.l1.twelve-factor-config]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", DonHang.Api/Dockerfile, docker-compose.yml]
      outline:
      - "At stage-2 CI builds `DonHang.Api`'s image from the same `DonHang.Api/Dockerfile` the lab uses, so a change that breaks the image fails the pipeline instead of the next deploy."
      - "For delivery the image is built once per workflow run, in the `image` job, and tagged with the name `docker-compose.yml` gives the `api` service; `staging` and `publish` run that image instead of building again."
      - "Running the image that was built and checked, instead of rebuilding for each environment, is the twelve-factor idea of one build running everywhere with only config changing."
      - "An image built on a runner disappears with that runner: another job needs it handed over as a file, and machines outside the run need it published to a server that stores images."
      misconceptions:
      - "CI only needs to compile and test the code; the Dockerfile gets checked when someone deploys."
      - "Each environment can build its own image from the same commit, and the result is the same image anyway."
      depth_notes: "Không nói registry, push image hay cách đặt tag theo phiên bản — devops/release. Không nói cache layer Docker trong CI, build nhiều kiến trúc, ký hay quét image — devops/supply-chain GĐ3."
    - id: devops.l2.workflow-artifacts
      title:
        vi: "Artifact: job này trao file cho job sau thế nào"
        en: "Artifacts: how one job hands a file to the next"
      main_path: true
      duration_min: 13
      skills: [devops.ci.cache-and-artifacts]
      prereqs: [devops.l2.building-images-in-ci, devops.l2.dependency-cache]
      related: []
      vocab: [artifact]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "Jobs in one workflow run start at the same time on separate runners unless `needs:` makes one wait for another, and they share no files."
      - "An artifact is a set of files a job uploads with `actions/upload-artifact`; a later job in the same run downloads it with `actions/download-artifact`, and it stays attached to the run afterwards."
      - "At stage-2 the image job writes the images it built to a file with `docker save` and uploads it; the `staging` job, which `needs:` the image job, downloads it and runs `docker load`."
      - "A cache reuses files that rarely change across many runs to save time; an artifact keeps a specific output of one run, so a job that needs an artifact cannot go on without it."
      misconceptions:
      - "A job that `needs:` another runs on the same machine, so it can read the files the first job wrote."
      - "Cache and artifact are two names for stored files, so either one can pass a build between jobs."
      depth_notes: "Không nêu thời hạn giữ artifact hay giới hạn dung lượng. Không nói push image lên registry — devops/release. Không nói matrix hay job outputs."
    - id: devops.l2.deployment-environments
      title:
        vi: "Continuous delivery: bản xanh tới staging qua một cổng"
        en: "Continuous delivery: a green build reaches staging through a gate"
      main_path: true
      duration_min: 14
      skills: [devops.cd.delivery]
      prereqs: [devops.l2.workflow-artifacts, devops.l1.secrets-vs-config, devops.l1.compose-for-the-api]
      related: []
      vocab: [continuous-delivery, continuous-deployment, deployment-environment]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", docker-compose.yml]
      outline:
      - "Continuous delivery keeps every change that passes CI ready to deploy through automated steps; continuous deployment also deploys every such change to production with no person deciding."
      - "A job names a deployment environment with `environment:`; Đơn Hàng's stage-2 `staging` job does, runs only for pushes to `master`, and waits through `needs:` for the test and image jobs."
      - "Protection rules set on an environment in the repository settings, such as required reviewers, must pass before a job that references it starts; a required approval is what keeps delivery from being deployment."
      - "Secrets stored on an environment are given only to jobs that reference that environment; a job without `environment:` cannot read them."
      - "Đơn Hàng's `staging` is a throwaway copy of Đơn Hàng's services that the job starts on its own runner from the image artifact and checks with a request; running it on a cluster comes later."
      misconceptions:
      - "Continuous delivery and continuous deployment are the same thing: both mean every commit goes straight to production."
      - "An environment in GitHub Actions is a server that GitHub creates and keeps running."
      - "A staging environment has to be a permanent server, or it doesn't count as deploying."
      depth_notes: "Không deploy lên cluster — track k8s GĐ2. Không nói blue-green, canary, rollback tự động — devops GĐ4. Không nói registry hay tag phát hành — devops/release. Không cấu hình protection rule cụ thể cho repo Đơn Hàng."
    - id: devops.l2.migrations-in-the-pipeline
      title:
        vi: "Migrate database thành bước riêng, trước khi API chạy"
        en: "Migrating the database as its own step, before the API starts"
      main_path: true
      duration_min: 15
      skills: [devops.cd.db-migrations]
      prereqs: [devops.l2.deployment-environments, backend.l1.migrations, devops.l1.compose-for-the-api]
      related: []
      vocab: [migration-bundle]
      example_tag: stage-2
      example_files: [DonHang.Api/Dockerfile, docker-compose.yml, DonHang.Api/Program.cs, ".github/workflows/ci.yml"]
      outline:
      - "At stage-1, `Program.cs` applies pending migrations each time `DonHang.Api` starts; EF Core's documentation advises against that for production databases: every copy needs rights to change the schema, and the generated SQL runs unreviewed."
      - "A migration bundle is a single executable built by `dotnet ef migrations bundle`; run against a database, it applies the migrations that database has not recorded as applied yet."
      - "At stage-2 a `migrate` service runs the bundle and exits, `api` starts only after it exits successfully (`service_completed_successfully`), and `Program.cs` no longer migrates."
      - "The lab and the `staging` job start the same services, so a migration that fails stops the job before any `api` container runs on that database."
      misconceptions:
      - "Migrating at startup is safe everywhere, since EF Core skips migrations that are already applied."
      - "The pipeline should run `dotnet ef database update` on the deploy machine, from a copy of the source code."
      - "If a migration fails, the new API version still starts and simply keeps using the old schema."
      depth_notes: "Không nói migration không downtime (expand/contract, CREATE INDEX CONCURRENTLY) — GĐ4; không nói rollback migration hay script SQL idempotent; chạy migrate trong cluster (Job) — track k8s."
  - id: release
    title:
      vi: "Registry, phiên bản và phát hành"
      en: "Registry, versions and releases"
    stage: 2
    summary:
      vi: "Đưa image của Đơn Hàng lên registry với tag chỉ rõ commit và phiên bản, đặt số phiên bản theo semantic versioning, viết changelog, và phát hành từ một git tag mà không build lại."
      en: "Publish Đơn Hàng's images to a registry under tags that name their commit and version, number versions with semantic versioning, keep a changelog, and cut a release from a git tag without rebuilding."
    lessons:
    - id: devops.l2.container-registry
      title:
        vi: "Container registry: nơi máy khác lấy image của bạn"
        en: "A container registry: where other machines get your images"
      main_path: true
      duration_min: 12
      skills: [devops.release.registry]
      prereqs: [devops.l2.building-images-in-ci, devops.l1.image-vs-container]
      related: []
      vocab: [container-registry]
      example_tag: stage-1
      example_files: [docker-compose.yml, DonHang.Api/Dockerfile, lab/Dockerfile]
      outline:
      - "A container registry is a server that stores images by name and tag; `docker pull` downloads an image from a registry and `docker push` uploads one to it."
      - "When the first part of an image name is a host name, such as `mcr.microsoft.com` or `lscr.io`, that part names the registry; a name without one, such as `caddy:2.10.0`, comes from Docker Hub."
      - "`donhang-api:stage-1` exists only on the machine that built it: Compose builds it from `DonHang.Api/Dockerfile`, and no registry holds a copy."
      - "A machine outside the workflow run, such as a server, can run an image it did not build only if the image is pushed to a registry that machine can reach."
      misconceptions:
      - "`docker run` always downloads the image from the internet before starting it."
      - "An image I build with `docker build` is uploaded to Docker Hub automatically."
      - "A registry is where Docker keeps the containers it is running."
      depth_notes: "Không nói tự dựng registry, mirror, quyền kéo image riêng tư (pull secret — track k8s), quét/ký image (devops/supply-chain GĐ3). Tag và digest — devops.l2.image-tags-and-digests; push từ CI — devops.l2.pushing-images-from-ci."
    - id: devops.l2.image-tags-and-digests
      title:
        vi: "Tag có thể dời đi, digest thì không"
        en: "A tag can move, a digest cannot: naming the exact image"
      main_path: true
      duration_min: 13
      skills: [devops.release.registry]
      prereqs: [devops.l2.container-registry, devops.l1.dockerfile-for-dotnet]
      related: []
      vocab: [image-digest]
      example_tag: stage-1
      example_files: [DonHang.Api/Dockerfile, docker-compose.yml]
      outline:
      - "An image tag is a label that points at one image in a registry, and whoever can push to that name can later point the same tag at a different image by pushing again."
      - "`latest` is only the tag Docker uses when a name gives none; it does not mean newest, and it points at whatever image was last pushed under it."
      - "`mcr.microsoft.com/dotnet/sdk:10.0` in `DonHang.Api/Dockerfile` names a release line that moves to each new 10.0 SDK release and each rebuild of its image, so two builds months apart can start from different SDK images."
      - "An image digest, `sha256:` followed by a hash of the image's content, identifies exactly one image; pulling by digest returns that image whatever later happens to its tags."
      misconceptions:
      - "`latest` always gives me the newest version of an image."
      - "Once an image is published under a version tag such as `2.10.0`, that tag gives the same image forever."
      - "Two images with the same name and tag on two machines must be identical."
      depth_notes: "Không nói image nhiều kiến trúc (manifest list), ký hay xác minh image (devops/supply-chain GĐ3); repo Đơn Hàng không ghim image bằng digest — chỉ giải thích. Quy ước tag của Đơn Hàng — devops.l2.tagging-images-by-commit."
    - id: devops.l2.pushing-images-from-ci
      title:
        vi: "Đẩy image API lên GitHub Container Registry từ CI"
        en: "Pushing the API image to GitHub Container Registry from CI"
      main_path: true
      duration_min: 14
      skills: [devops.release.registry]
      prereqs:
      - devops.l2.image-tags-and-digests
      - devops.l2.deployment-environments
      - devops.l1.secrets-vs-config
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "GitHub Container Registry serves images under `ghcr.io/<owner>/<name>`; from stage-2 Đơn Hàng publishes `ghcr.io/duyan11110/donhang-api` and `ghcr.io/duyan11110/donhang-migrate` there."
      - "A job logs in to `ghcr.io` with the `GITHUB_TOKEN` that GitHub creates for each workflow run, and the workflow must grant it `packages: write` under `permissions:` before a push is allowed."
      - "At stage-2 the `publish` job runs only for pushes to `master`, `needs:` the test and image jobs, loads the image artifact and pushes it, so the registry receives only images that passed the quality gate."
      - "`docker tag` gives an image that already exists a second name, with the registry host and owner in front; it builds nothing, so the pushed image is the one the tests ran against."
      misconceptions:
      - "To push to GitHub's registry, CI needs my personal GitHub password or token stored as a secret."
      - "Pushing an image from every pull request is harmless, since images in a registry are only stored, not run."
      - "`docker tag` makes a copy of the image, so the pushed image may differ from the one that was tested."
      depth_notes: "Không nói quyền xem package (public/private) hay cài đặt package trên GitHub; không nói Docker Hub hay registry tự dựng; không nói cluster kéo image (track k8s). Tên tag Đơn Hàng dùng — devops.l2.tagging-images-by-commit."
    - id: devops.l2.tagging-images-by-commit
      title:
        vi: "Gắn tag image bằng commit đã build ra nó"
        en: "Tagging each image with the commit it was built from"
      main_path: true
      duration_min: 12
      skills: [devops.release.registry]
      prereqs: [devops.l2.pushing-images-from-ci, foundation.l2.git-mental-model]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "Đơn Hàng tags every image it pushes as `sha-` followed by the full id of the commit that was pushed, so any running image leads back to the exact code that built it."
      - "Each push to `master` is built and pushed once, tagged with its last commit, so a `sha-` tag is in practice never reused for different content; this is Đơn Hàng's convention, since the registry would accept a second push under the same tag."
      - "Đơn Hàng never pushes or deploys `latest`: a deployment names a tag that says which commit runs, and going back means naming the tag that ran before."
      - "A commit id says which code runs but not whether it is newer or older than another; people and clients need a version number for that."
      misconceptions:
      - "Tagging the image with the branch name, like `master`, tells you which code is running."
      - "`latest` is the safest tag to deploy, because it is always up to date."
      depth_notes: "Không nói dọn image cũ trong registry (retention), không ghim digest trong cấu hình deploy (track k8s). Số phiên bản — devops.l2.semantic-versioning."
    - id: devops.l2.semantic-versioning
      title:
        vi: "Semantic versioning: MAJOR.MINOR.PATCH hứa hẹn điều gì"
        en: "Semantic versioning: what MAJOR.MINOR.PATCH promises"
      main_path: true
      duration_min: 13
      skills: [devops.release.versioning]
      prereqs: [devops.l2.tagging-images-by-commit, backend.l2.api-versioning]
      related: []
      vocab: [semantic-versioning]
      example_tag: stage-1
      example_files: []
      outline:
      - "Under semantic versioning 2.0.0 a version is MAJOR.MINOR.PATCH: PATCH goes up for backward-compatible bug fixes, MINOR for backward-compatible additions, MAJOR for any breaking change to the public API."
      - "Raising MINOR resets PATCH to 0 and raising MAJOR resets both, so after 1.4.2 comes 1.4.3, 1.5.0 or 2.0.0, and 1.10.0 is newer than 1.9.0."
      - "The numbers mean something only against a declared public API; for a web API such as Đơn Hàng's, that is the requests and responses its clients rely on."
      - "Versions 0.y.z are for initial development, when anything may change at any time; 1.0.0 is the version that defines the public API."
      - "The `v1` in `/api/v1` versions the URL contract, not the product: many product releases can ship under `/api/v1`; adding `/api/v2` beside it is a MINOR, and retiring `/api/v1` is a MAJOR."
      misconceptions:
      - "After 1.9.0 the next minor version is 2.0.0, and 1.10.0 would be older than 1.9.0."
      - "A MAJOR version bump means the release has big new features."
      - "The `v1` in `/api/v1` and the product's version must always change together."
      depth_notes: "Không nói pre-release/build metadata (-rc.1, +…) chi tiết, dải phiên bản của NuGet/pub, tự tăng version từ commit message (Conventional Commits) — ngoài GĐ2. Số phiên bản của chính Đơn Hàng — devops.l2.changelog."
    - id: devops.l2.changelog
      title:
        vi: "Changelog: mỗi phiên bản đổi gì, viết cho người dùng nó"
        en: "A changelog: what changed in each version, for the people using it"
      main_path: true
      duration_min: 12
      skills: [devops.release.versioning]
      prereqs: [devops.l2.semantic-versioning, foundation.l2.good-commits]
      related: []
      vocab: [changelog]
      example_tag: stage-2
      example_files: [CHANGELOG.md]
      outline:
      - "A changelog is a file, `CHANGELOG.md` in Đơn Hàng, that lists for each released version, newest first, the changes that matter to the people who use it."
      - "Đơn Hàng follows the Keep a Changelog format: each version groups entries under headings such as Added, Changed, Removed and Fixed, below an Unreleased section at the top."
      - "Each pull request that changes behaviour adds its line under Unreleased, so a release turns that section into a version instead of rebuilding months of work from memory."
      - "Đơn Hàng's `1.0.0` entry lists `POST /api/v1/auth/login` under Removed, telling a client what it must change before it upgrades from `0.1.0`."
      - "A changelog is not the commit log: commit messages explain each change to developers, while a changelog entry sums up what a user of the version notices."
      misconceptions:
      - "The changelog is just `git log` pasted into a file at release time."
      - "Only new features belong in a changelog; fixes and removals are too small to mention."
      depth_notes: "Không sinh changelog tự động từ commit (Conventional Commits, công cụ release) — chỉ nhắc là có. Đưa phần changelog vào ghi chú phát hành — devops.l2.cutting-a-release."
    - id: devops.l2.cutting-a-release
      title:
        vi: "Phát hành: git tag nâng image đã qua kiểm tra thành phiên bản"
        en: "Cutting a release: a git tag promotes an image that already passed"
      main_path: true
      duration_min: 15
      skills: [devops.release.publishing]
      prereqs: [devops.l2.changelog, devops.l2.tagging-images-by-commit]
      related: []
      vocab: [git-tag]
      example_tag: stage-2
      example_files: [".github/workflows/release.yml", scripts/release-notes.sh, CHANGELOG.md]
      outline:
      - "A git tag is a name fixed to one commit; `git tag -a v1.0.0` creates an annotated tag with its own message, and `git push` sends a tag only when asked, as in `git push origin v1.0.0`."
      - "Đơn Hàng's `release.yml` runs when a tag matching `v*.*.*` is pushed; it pulls the `sha-` images of the tagged commit, adds the tag `1.0.0` to them and pushes, without building."
      - "Because the release reuses images CI already tested, the job fails when the tagged commit was never pushed to `master` and so has no `sha-` image."
      - "The job copies that version's section of `CHANGELOG.md`, extracted by `scripts/release-notes.sh`, into a GitHub release attached to the tag."
      - "Đơn Hàng's `stage-0`, `stage-1` and `stage-2` tags mark states of the course, while `v0.1.0` and `v1.0.0` mark product versions; one commit can carry both kinds."
      misconceptions:
      - "`git push` uploads my tags together with my commits."
      - "A release should rebuild the image from the tagged commit so that it is fresh."
      - "A git tag and an image tag are the same thing, so creating one creates the other."
      depth_notes: "Không nói nhánh release/hotfix, backport, ký tag, tự tăng version, blue-green/canary (devops GĐ4). Deploy một phiên bản lên cluster — track k8s GĐ2."
  - id: monitoring-basics
    title:
      vi: "Monitoring cơ bản: metric, dashboard và log tập trung"
      en: "Monitoring basics: metrics, dashboards and centralized logs"
    stage: 2
    summary:
      vi: "Cho API Đơn Hàng xuất metric, để Prometheus thu về, đọc tốc độ request, lỗi và thời gian phản hồi bằng PromQL trên dashboard Grafana, và tìm log JSON của mọi container ở một chỗ bằng Loki."
      en: "Make the Đơn Hàng API expose metrics, have Prometheus collect them, read request rate, errors and response time with PromQL on a Grafana dashboard, and search every container's JSON logs in one place with Loki."
    lessons:
    - id: devops.l2.why-monitoring
      title:
        vi: "Monitoring: biết API đang hỏng trước khi người dùng báo"
        en: "Monitoring: learning the API is failing before a user tells you"
      main_path: true
      duration_min: 12
      skills: [devops.monitoring.metrics]
      prereqs: [backend.l1.structured-logging, devops.l1.compose-for-the-api]
      related: []
      vocab: [monitoring, metric]
      example_tag: stage-1
      example_files: [DonHang.Api/Middleware/RequestLoggingMiddleware.cs, docker-compose.yml]
      outline:
      - "Monitoring means collecting signals from a running system all the time, so that a problem becomes visible without a user having to report it."
      - "At stage-1 the only signal Đơn Hàng's API gives is the line `RequestLoggingMiddleware` writes for each request to the container's output, read with `docker compose logs api`."
      - "A log line records one event with its details; a metric is one number measured again and again over time, such as how many requests ended with a `5xx` status."
      - "Answering how many requests failed in the last five minutes from logs means finding and counting lines, while a metric already holds that count."
      - "A metric's size depends on how many different things are counted, not on how much traffic arrives, while logs grow with every request."
      misconceptions:
      - "If the logs show no errors, the API is working fine."
      - "Metrics and logs are the same data; a metric is just a log drawn as a chart."
      - "Monitoring means somebody watches a screen all day."
      depth_notes: "Không nói trace, OpenTelemetry, khái niệm observability (backend/observability GĐ3); không nói alert, SLO (GĐ4). Cách API xuất metric — devops.l2.metrics-endpoint; log JSON — devops.l2.json-logs."
    - id: devops.l2.metrics-endpoint
      title:
        vi: "API bày số liệu của mình dạng văn bản ở /metrics"
        en: "The API publishes its numbers as text at /metrics"
      main_path: true
      duration_min: 13
      skills: [devops.monitoring.metrics]
      prereqs: [devops.l2.why-monitoring, backend.l1.middleware-pipeline]
      related: []
      vocab: [prometheus, metric-label]
      example_tag: stage-2
      example_files: [DonHang.Api/Program.cs, Directory.Packages.props, scripts/devops/metrics-endpoint.sh]
      outline:
      - "Prometheus is a monitoring system that reads metrics over HTTP in a plain-text format; from stage-2 `DonHang.Api` uses the prometheus-net library to publish its metrics in that format."
      - "`app.UseHttpMetrics()` measures every request that passes through the pipeline, and `app.MapMetrics()` answers `GET /metrics` with the current value of every metric."
      - "The API sends its metrics nowhere on its own: `/metrics` only reports the values at the moment it is asked, and another program has to ask."
      - "Each line of `/metrics` holds a metric name, labels in braces and a number; `http_requests_received_total` has one line per combination of label values such as `code` and `method`."
      - "Caddy forwards only the API's own paths, such as `/api/v1/*`, to the API, so `/metrics` is reachable from inside the Docker network, for example from the lab box at `api:8080`, but not through Caddy."
      misconceptions:
      - "The API pushes its metrics to a monitoring server every few seconds."
      - "`/metrics` returns the history of each value, like a small database."
      - "Counting `GET` and `POST` requests separately needs two differently named metrics."
      depth_notes: "Không nói OpenTelemetry hay Meter API của .NET (backend/observability GĐ3), không nói bảo vệ /metrics bằng xác thực. Loại metric và metric tự định nghĩa — devops.l2.counters-and-rate; Prometheus server — devops.l2.prometheus-scraping."
    - id: devops.l2.prometheus-scraping
      title:
        vi: "Prometheus tự đi lấy: scrape /metrics theo nhịp"
        en: "Prometheus pulls: scraping /metrics on a schedule"
      main_path: true
      duration_min: 14
      skills: [devops.monitoring.metrics]
      prereqs: [devops.l2.metrics-endpoint, devops.l1.docker-networks]
      related: []
      vocab: [scrape, time-series, compose-profile]
      example_tag: stage-2
      example_files: [docker-compose.yml, deploy/monitoring/prometheus.yml, scripts/devops/prometheus-targets.sh]
      outline:
      - "The Prometheus server scrapes: every `scrape_interval` it sends `GET /metrics` to each target in its configuration and stores the numbers it gets back with the time of the scrape."
      - "Đơn Hàng's `deploy/monitoring/prometheus.yml` has one scrape job, `api`, whose target is `api:8080`, the API's name and port on the `donhang` network."
      - "For every target Prometheus records a metric named `up`, which is `1` when the last scrape succeeded and `0` when it failed, so a stopped API shows up as `0`."
      - "Each distinct combination of metric name and label values is its own time series, so a label with unbounded values, such as an order id, adds a new series for every order."
      - "The monitoring services in `docker-compose.yml` carry `profiles: [monitoring]`, so they start only when the profile is named, as in `docker compose --profile monitoring up -d`."
      misconceptions:
      - "Prometheus reads the API's log output to build its numbers."
      - "If the API stops, its metrics just stop changing and Prometheus cannot tell that anything is wrong."
      - "Adding a label is free, so putting the customer id on a metric is a good way to get per-customer numbers."
      depth_notes: "Không nói service discovery, federation, remote write, retention, lưu trữ dài hạn; không nói Prometheus trong cluster (k8s GĐ3). Truy vấn PromQL — devops.l2.counters-and-rate."
    - id: devops.l2.counters-and-rate
      title:
        vi: "Counter chỉ tăng: đọc nó thành tốc độ bằng PromQL"
        en: "A counter only goes up: read it as a rate with PromQL"
      main_path: true
      duration_min: 14
      skills: [devops.monitoring.metrics, devops.monitoring.dashboards]
      prereqs: [devops.l2.prometheus-scraping]
      related: []
      vocab: [counter, gauge, promql]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Monitoring/OrderMetrics.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - scripts/devops/promql-rate.sh
      outline:
      - "A counter is a metric that only increases, such as `http_requests_received_total`, and starts again from zero when the process restarts; a gauge, such as `http_requests_in_progress`, can go up and down."
      - "Đơn Hàng adds its own counter, `donhang_orders_placed_total`, which `OrdersController` increases each time a new order is created, next to the metrics prometheus-net provides."
      - "PromQL is Prometheus's query language: `http_requests_received_total{code=~\"5..\"}` selects the series of that metric whose `code` label matches the pattern."
      - "`rate(http_requests_received_total[5m])` gives the average increase per second over the last five minutes, and treats a drop to zero as a restart, not as a negative change."
      - "`sum by (code) (...)` adds the per-series rates into one result per status code, which answers how many requests per second end in each status."
      misconceptions:
      - "The current value of `http_requests_received_total` tells me how busy the API is right now."
      - "After the API restarts, the chart of a counter shows a huge negative dip in traffic."
      - "A counter and a gauge are the same kind of number; only the naming convention differs."
      depth_notes: "Không nói increase, irate, recording rule, alert rule (alert — GĐ4); không nói summary. Histogram và thời gian phản hồi — devops.l2.histograms-and-percentiles."
    - id: devops.l2.histograms-and-percentiles
      title:
        vi: "Vì sao thời gian phản hồi trung bình che mất request chậm"
        en: "Why the average response time hides the slow requests"
      main_path: true
      duration_min: 14
      skills: [devops.monitoring.metrics, devops.monitoring.dashboards]
      prereqs: [devops.l2.counters-and-rate]
      related: []
      vocab: [histogram, percentile]
      example_tag: stage-2
      example_files: [scripts/devops/promql-latency.sh]
      outline:
      - "An average response time can stay low while a small share of requests is very slow, because the many fast requests pull the average down."
      - "The 95th percentile, p95, is the time that 95% of requests stayed under; it shows how slow the slower requests are, which the average cannot."
      - "A histogram counts observations into buckets by upper bound: each `http_request_duration_seconds_bucket` line counts requests that took at most its `le` value, so each bucket includes all smaller ones."
      - "`histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))` estimates p95 from the buckets, so its precision depends on where the bucket bounds are."
      - "A histogram also has `_sum` and `_count` series, so the average can be computed from the same metric and compared with the percentile."
      misconceptions:
      - "If the average response time is 50 ms, almost every user waits about 50 ms."
      - "A p95 of 200 ms means 5% of the requests failed."
      - "Prometheus keeps the duration of every single request, so the percentile it returns is exact."
      depth_notes: "Không nói summary, native histogram, cách chọn bucket; không đặt mục tiêu thời gian phản hồi/SLO (backend/capacity-and-slo GĐ4). Vẽ lên dashboard — devops.l2.grafana-dashboards."
    - id: devops.l2.grafana-dashboards
      title:
        vi: "Dashboard Grafana: các truy vấn đã lưu, vẽ thành panel"
        en: "A Grafana dashboard is saved queries drawn as panels"
      main_path: true
      duration_min: 13
      skills: [devops.monitoring.dashboards]
      prereqs: [devops.l2.histograms-and-percentiles]
      related: []
      vocab: [grafana, dashboard]
      example_tag: stage-2
      example_files:
      - deploy/monitoring/grafana/provisioning/datasources/datasources.yml
      - deploy/monitoring/grafana/provisioning/dashboards/dashboards.yml
      - deploy/monitoring/grafana/dashboards/donhang-api.json
      - docker-compose.yml
      outline:
      - "Grafana stores no metrics of its own: each panel sends a query to a data source, here Prometheus, and draws the result."
      - "Đơn Hàng's dashboard `donhang-api.json` has panels for requests per second by status code, `5xx` responses per second, p95 response time and orders placed, each one PromQL query."
      - "Grafana loads its data sources and the dashboard from provisioning files under `deploy/monitoring/grafana/` when it starts, so every fresh lab gets the same dashboard without clicking."
      - "Because the dashboard is a JSON file in the repository, changing it goes through a commit and a review like code, instead of living only inside one Grafana."
      - "When you start monitoring an API, request rate, error rate and response time are a common first set of panels, because together they show whether it is used, failing or slow."
      misconceptions:
      - "Grafana collects the metrics, and Prometheus is only where they get stored."
      - "A dashboard can only be built by clicking in the web page, so it cannot be kept in Git."
      - "The more panels a dashboard has, the better it shows what is wrong."
      depth_notes: "Không nói alert của Grafana, biến dashboard, người dùng và quyền Grafana, SLO (GĐ4). Log trong Grafana — devops.l2.centralized-logs."
    - id: devops.l2.json-logs
      title:
        vi: "Ghi log dạng JSON để công cụ đọc được từng field"
        en: "Writing logs as JSON so a tool can read every field"
      main_path: true
      duration_min: 13
      skills: [devops.monitoring.logs]
      prereqs: [backend.l1.structured-logging, devops.l1.config-and-env, devops.l2.why-monitoring]
      related: []
      vocab: [log-level]
      example_tag: stage-2
      example_files:
      - docker-compose.yml
      - DonHang.Api/appsettings.json
      - DonHang.Api/Middleware/RequestLoggingMiddleware.cs
      - scripts/devops/json-logs.sh
      outline:
      - "At stage-2 the `api` service in `docker-compose.yml` sets `Logging__Console__FormatterName` to `json`, so the console logger writes each log event as one JSON object per line."
      - "In that JSON line the template's fields, such as `Method`, `StatusCode` and `ElapsedMs` from `RequestLoggingMiddleware`, keep their own names inside the `State` object."
      - "Every log event has a log level, from `Trace` and `Debug` through `Information` and `Warning` to `Error` and `Critical`, and the JSON line carries it as `LogLevel`."
      - "`Logging:LogLevel` in `appsettings.json` sets the lowest level written for each category, which is why `Microsoft.AspNetCore` writes only `Warning` and above while the API's own `Information` lines appear."
      - "The output format is chosen by configuration, not by code: the log calls did not change, and without that variable the same build prints the usual readable lines."
      misconceptions:
      - "Switching to JSON logs means rewriting every log call in the code."
      - "Setting `Microsoft.AspNetCore` to `Warning` hides its errors too."
      - "A log level is only a label for people; it does not change what gets written."
      depth_notes: "Không nói log scope, trace id trong log (backend/observability GĐ3), Serilog hay provider khác; không bàn chọn level cho từng câu log. Gom log mọi container về một chỗ — devops.l2.centralized-logs."
    - id: devops.l2.centralized-logs
      title:
        vi: "Loki: log của mọi container, tìm ở một chỗ"
        en: "Loki: every container's logs searchable in one place"
      main_path: true
      duration_min: 15
      skills: [devops.monitoring.logs]
      prereqs: [devops.l2.json-logs, devops.l2.grafana-dashboards]
      related: []
      vocab: [log-aggregation, loki, logql]
      example_tag: stage-2
      example_files:
      - deploy/monitoring/alloy/config.alloy
      - docker-compose.yml
      - deploy/monitoring/grafana/provisioning/datasources/datasources.yml
      - scripts/devops/loki-query.sh
      outline:
      - "Log aggregation collects the logs of every service into one store, so you search one place instead of each container, and the logs outlive a removed container."
      - "In Đơn Hàng, Grafana Alloy reads the output of the Compose containers through the Docker socket and sends each line to Loki, labelled with its Compose service, such as `service=\"api\"`."
      - "Loki indexes only the labels of each log stream, not the text of its lines, so a LogQL query first picks streams by label, as in `{service=\"api\"}`, then filters their lines."
      - "In LogQL, `| json` turns the fields of each JSON line into labels for that query, so it can keep only the lines whose status code field is `500` or more."
      - "Loki has no page of its own in Đơn Hàng: you query it from Grafana, where it is a second data source next to Prometheus."
      misconceptions:
      - "Loki indexes every word of every line, so any text search is as fast as a lookup by label."
      - "To find one order's logs quickly, I should put the order id in a Loki label."
      - "`docker compose logs` already keeps every container's logs for good, so a log store adds nothing."
      depth_notes: "Không nói retention, object storage, Loki nhiều instance, collector khác, log trong cluster (k8s GĐ3), nối log với trace (backend/observability GĐ3); không nói alert từ log (GĐ4)."
- level: 3
  title:
    vi: "Level 3"
    en: "Level 3"
  modules:
  - id: iac
    title:
      vi: "Infrastructure as code với OpenTofu"
      en: "Infrastructure as code with OpenTofu"
    stage: 3
    summary:
      vi: "Mô tả cluster kind và những gì nền tảng cần trong đó bằng OpenTofu: đọc plan trước khi apply, giữ state chung có khóa và mã hóa, tách module và môi trường, và phát hiện drift do thay đổi bằng tay."
      en: "Describe kind clusters and what the platform needs inside them with OpenTofu: read the plan before applying, keep state shared, locked and encrypted, split modules and environments, and detect drift from changes made by hand."
    lessons:
    - id: devops.l3.infrastructure-as-code
      title:
        vi: "Script tạo cluster một lần không giữ được cluster khớp với file"
        en: "A script that creates the cluster once cannot keep it matching a file"
      main_path: true
      duration_min: 12
      skills: [devops.iac.declarative]
      prereqs:
      - k8s.l1.manifests-and-kubectl-apply
      - k8s.l1.cluster-nodes-and-control-plane
      - k8s.l1.deploying-don-hang
      - devops.l1.why-not-deploy-by-hand
      related: [k8s.l1.control-plane-components, devops.l2.deployment-environments]
      vocab: [infrastructure-as-code]
      example_tag: stage-2
      example_files:
      - scripts/k8s/cluster-up.sh
      - deploy/k8s/kind-config.yaml
      - scripts/k8s/cluster-down.sh
      - scripts/k8s/deploy.sh
      outline:
      - "Infrastructure as code means describing the machines, clusters and services a system runs on in files kept in Git, and letting a tool create or change them from those files instead of by hand."
      - "`scripts/k8s/cluster-up.sh` creates the kind cluster `donhang` from `deploy/k8s/kind-config.yaml` only when no cluster of that name exists; otherwise it prints that the cluster already exists."
      - "Editing `kind-config.yaml` after the cluster exists changes nothing: `cluster-up.sh` never compares the running cluster with the file, so the two can disagree without any warning."
      - "At stage-2 the only way to apply such an edit is to delete the whole cluster with `scripts/k8s/cluster-down.sh` and create it again, losing every object that ran in it."
      - "An infrastructure-as-code tool reads the files, compares them with what exists, and shows the changes it would make before it makes them."
      misconceptions:
      - "A setup script that is idempotent, safe to run twice, is already infrastructure as code."
      - "`kind-config.yaml` is in Git, so the running cluster always matches it."
      - "`kubectl apply` already makes everything declarative, so there is nothing left for another tool to describe."
      depth_notes: "Không dạy cú pháp OpenTofu — devops.l3.opentofu-resources. Đồng bộ liên tục từ Git — devops/gitops. Không dạy Ansible hay cấu hình bên trong máy. Không dạy lại kubectl apply — k8s.l1.manifests-and-kubectl-apply."
    - id: devops.l3.opentofu-resources
      title:
        vi: "Khối resource khai báo một object; provider biết cách tạo nó"
        en: "A resource block declares an object; a provider knows how to make it"
      main_path: true
      duration_min: 13
      skills: [devops.iac.declarative]
      prereqs: [devops.l3.infrastructure-as-code, devops.l2.quality-gate]
      related: [k8s.l1.cluster-nodes-and-control-plane, devops.l2.dependency-cache]
      vocab: [opentofu, tofu-resource, tofu-provider]
      example_tag: stage-3
      example_files:
      - deploy/tofu/lessons/first-cluster/main.tf
      - deploy/tofu/lessons/first-cluster/.terraform.lock.hcl
      - scripts/devops/tofu-first-cluster.sh
      - ".github/workflows/ci.yml"
      outline:
      - "OpenTofu reads every `.tf` file in one folder as one configuration; in it, each `resource` block declares one object that should exist, by a type such as `kind_cluster` and a local name such as `this`."
      - "OpenTofu itself knows no system's API: a provider is a plugin that does, and the `kind_cluster` type comes from the `tehcyx/kind` provider, which creates kind clusters through Docker."
      - "The `required_providers` block names each provider's source and the versions allowed, and `tofu init` downloads a matching provider into the folder's `.terraform` directory."
      - "`tofu init` writes the exact provider version it chose and its checksums to `.terraform.lock.hcl`; with that file committed, every later `init` installs the same version."
      - "`tofu validate` checks a configuration's syntax and references without contacting the systems it describes; Đơn Hàng's CI runs it with `tofu fmt -check` for every configuration under `deploy/tofu`."
      misconceptions:
      - "OpenTofu has built-in knowledge of kind, Kubernetes and every other system it can manage."
      - "A version range in `required_providers` is enough for every machine to get the same provider version."
      - "If `tofu validate` passes, the cluster can certainly be created."
      depth_notes: "Không dạy chi tiết plan/apply — devops.l3.plan-and-apply; state — devops.l3.tofu-state; biến, output, module — devops.l3.tofu-modules. Không dạy viết provider, không so sánh với công cụ IaC khác."
    - id: devops.l3.plan-and-apply
      title:
        vi: "tofu plan cho thấy mọi thay đổi trước khi tofu apply thực hiện"
        en: "tofu plan shows every change before tofu apply makes it"
      main_path: true
      duration_min: 13
      skills: [devops.iac.declarative]
      prereqs: [devops.l3.opentofu-resources, k8s.l1.manifests-and-kubectl-apply]
      related: [k8s.l1.rolling-updates, devops.l2.quality-gate]
      vocab: [tofu-plan]
      example_tag: stage-3
      example_files:
      - deploy/tofu/lessons/first-cluster/main.tf
      - scripts/devops/tofu-first-cluster.sh
      - scripts/devops/tofu-plan-apply.sh
      outline:
      - "`tofu plan` compares the configuration with the objects OpenTofu created earlier and prints the actions it would take without taking any: create (`+`), update in place (`~`), replace (`-/+`) or destroy (`-`)."
      - "`tofu apply` without a plan file makes a fresh plan, prints it, and acts only after you type `yes`."
      - "`tofu plan -out=<file>` saves a plan; `tofu apply <file>` then takes exactly the saved actions without asking again."
      - "Some attributes cannot change on an existing object: changing the node image in `first-cluster` makes the plan replace the whole cluster, so everything running in it is lost."
      - "A second `tofu apply` with unchanged files reports that no changes are needed, because the real cluster already matches the configuration."
      misconceptions:
      - "`tofu plan` already makes the harmless part of the changes; `apply` only finishes the rest."
      - "A `~` in the plan means the object is deleted and created again."
      - "The plan I read yesterday is exactly what `tofu apply` will do today."
      depth_notes: "Không giải thích OpenTofu nhớ object đã tạo bằng gì, kể cả plan đã lưu bị từ chối — devops.l3.tofu-state. Không dạy -target, -replace. Thay đổi làm bằng tay — devops.l3.configuration-drift."
    - id: devops.l3.tofu-state
      title:
        vi: "File state là cách OpenTofu biết object thật nào ứng với khối nào"
        en: "The state file is how OpenTofu knows which real object is which"
      main_path: true
      duration_min: 14
      skills: [devops.iac.state]
      prereqs: [devops.l3.plan-and-apply, k8s.l1.kubectl-and-the-api-server, devops.l1.secrets-vs-config]
      related: [k8s.l1.manifests-and-kubectl-apply, k8s.l1.secrets]
      vocab: [tofu-state]
      example_tag: stage-3
      example_files: [deploy/tofu/lessons/first-cluster/main.tf, scripts/devops/tofu-state.sh, ".gitignore"]
      outline:
      - "After each apply OpenTofu writes its state, by default to `terraform.tfstate` in the folder: every resource address, such as `kind_cluster.this`, mapped to the real object and the attributes read back from it."
      - "A resource whose block is removed from the files but which is still in the state is planned for destruction; `kubectl apply` keeps no such record, so an object whose manifest you delete keeps running."
      - "Deleting the state file does not make OpenTofu find its objects again: the next plan creates everything anew, and creating a second kind cluster with the same name fails."
      - "The state holds attribute values in plain text, sensitive ones included: the cluster's `client_key`, enough to administer the whole cluster, is readable in `terraform.tfstate`."
      - "`tofu apply` refuses a saved plan once the state has changed after the plan was made, because the plan's actions were worked out from the older state."
      - "Đơn Hàng's `.gitignore` excludes state files: the state must not go into Git, because anyone who can read it can use the credentials in it."
      misconceptions:
      - "The state file is just a cache; if I delete it, OpenTofu will find my resources again."
      - "Marking a value as sensitive keeps it out of the state file."
      - "Removing a block from the files only makes OpenTofu stop managing that object; the object itself stays."
      depth_notes: "Không dạy state dùng chung, khóa, mã hóa — devops.l3.remote-state-and-locking. Không dạy tofu import, tofu state mv/rm. Không dạy lại kubectl apply — k8s.l1.manifests-and-kubectl-apply."
    - id: devops.l3.tofu-modules
      title:
        vi: "Module là một thư mục .tf được gọi với giá trị của riêng bạn"
        en: "A module is a folder of .tf files you call with your own values"
      main_path: true
      duration_min: 14
      skills: [devops.iac.modules-environments]
      prereqs: [devops.l3.tofu-state, devops.l3.opentofu-resources]
      related: [design.l3.module-contracts]
      vocab: [tofu-module, input-variable, output-value]
      example_tag: stage-3
      example_files:
      - deploy/tofu/modules/kind-cluster/main.tf
      - deploy/tofu/modules/kind-cluster/variables.tf
      - deploy/tofu/modules/kind-cluster/outputs.tf
      - deploy/tofu/lessons/moved-into-module/main.tf
      outline:
      - "A module is a folder of `.tf` files that another configuration calls with a `module` block; `deploy/tofu/modules/kind-cluster` declares one kind cluster."
      - "Input variables, declared with `variable` blocks, are a module's parameters, such as the cluster name and the number of workers; the calling `module` block gives their values."
      - "Output values, declared with `output` blocks, are what a module hands back, such as the API server address, which the caller reads as `module.<name>.<output>`."
      - "Whatever a module does not take as a variable is the same for every caller: `kind-cluster` fixes the node image, so every environment runs the same Kubernetes version."
      - "Inside a module a resource's address gains a prefix, such as `module.cluster.kind_cluster.this`, and that is how it appears in plans and in the state."
      - "Moving an existing resource into a module changes its address, so the plan would destroy and recreate it unless a `moved` block names the old and the new address."
      misconceptions:
      - "Putting resources into a module only tidies the files; the plan stays the same."
      - "A good module turns every setting into a variable, so callers can change anything."
      - "The caller can read any attribute of a resource inside a module, like any other resource in its folder."
      depth_notes: "Không dạy module công khai từ registry, count, for_each (khối `dynamic` cho node của kind-cluster chỉ nói bằng lời). Dùng module cho từng môi trường — devops.l3.one-state-per-environment. Không dạy lại state — devops.l3.tofu-state."
    - id: devops.l3.one-state-per-environment
      title:
        vi: "Mỗi môi trường một thư mục và một state riêng"
        en: "One folder and one state for each environment"
      main_path: true
      duration_min: 14
      skills: [devops.iac.modules-environments]
      prereqs: [devops.l3.tofu-modules, devops.l2.deployment-environments, k8s.l1.namespaces, k8s.l1.secrets]
      related: [devops.l3.tofu-state]
      vocab: [tofu-workspace]
      example_tag: stage-3
      example_files:
      - deploy/tofu/envs/staging/cluster/main.tf
      - deploy/tofu/envs/production/cluster/main.tf
      - deploy/tofu/envs/staging/platform/main.tf
      - scripts/devops/tofu-environments.sh
      outline:
      - "`deploy/tofu/envs/staging` and `deploy/tofu/envs/production` call the same `kind-cluster` module with their own values: one node for staging, a control plane and two workers for production."
      - "Each environment folder is a separate configuration with its own state, so an apply in staging can change only what staging's state records, never production."
      - "Each environment is split into a `cluster` layer and a `platform` layer for the `donhang` namespace, because the Kubernetes provider can connect only once the cluster exists."
      - "The `platform` layer reads the `cluster` layer's outputs, such as the API server address, through a `terraform_remote_state` block instead of sharing one state with it."
      - "OpenTofu workspaces keep several states for one folder; they fit copies that differ only in variable values, while separate folders let environments differ in anything."
      - "`tofu-environments.sh` applies both layers of staging but only plans production's cluster, so you can read what production would get without running it."
      misconceptions:
      - "Keeping staging and production alike means putting both in one configuration with one state."
      - "A folder per environment means copying all the `.tf` code into each one."
      - "Splitting the state only makes plans faster; it does not change what one mistake can break."
      depth_notes: "Không dạy nơi lưu state chung — devops.l3.remote-state-and-locking. Deploy ứng dụng lên cluster staging — devops/gitops. Secret của ứng dụng không nằm ở platform — devops/secrets-backup-dr. Multi-region, multi-account — GĐ4."
    - id: devops.l3.remote-state-and-locking
      title:
        vi: "State dùng chung: một bản cho cả nhóm, khóa lại khi có người chạy"
        en: "Shared state: one copy for the team, locked while a command runs"
      main_path: true
      duration_min: 14
      skills: [devops.iac.state]
      prereqs: [devops.l3.one-state-per-environment, devops.l3.tofu-state, backend.l2.skip-locked-claiming]
      related: [devops.l1.secrets-vs-config]
      vocab: [state-backend, state-locking]
      example_tag: stage-3
      example_files:
      - deploy/tofu/envs/staging/cluster/backend.tf
      - scripts/devops/tofu-db.sh
      - scripts/devops/tofu-lock.sh
      - scripts/dev-secrets.sh
      outline:
      - "A state file on one laptop is invisible to everyone else: a teammate applying from another copy of the repository has no state, so OpenTofu plans to create everything again."
      - "A backend is where OpenTofu keeps a configuration's state; Đơn Hàng's environments use the `pg` backend, which stores each state in a table of the `donhang_tofu` database in Compose's PostgreSQL."
      - "OpenTofu holds a lock on the state for as long as a command such as `plan` or `apply` runs; while `tofu apply` waits for `yes` in one terminal, `tofu plan` in another fails because the state is locked."
      - "By default a command that finds the state locked fails at once; `-lock-timeout=60s` makes it wait up to that long for the lock instead."
      - "OpenTofu can encrypt the state before it reaches the backend; Đơn Hàng's environments derive the key from a passphrase in `.env`, so the rows in `donhang_tofu` hold no readable credentials."
      misconceptions:
      - "Committing `terraform.tfstate` to Git is a fine way to share it with the team."
      - "If two people apply at the same time, the second apply simply waits for the first one to finish."
      - "Keeping the state in a database means it is encrypted."
      depth_notes: "Không dạy backend dịch vụ cloud, force-unlock. Passphrase trong .env chỉ đủ cho lab; quản lý khóa thật — devops/secrets-backup-dr. Không dạy cách pg backend hiện thực khóa."
    - id: devops.l3.configuration-drift
      title:
        vi: "Drift: thay đổi làm bằng tay mà file không hề biết"
        en: "Drift: a change made by hand that the files know nothing about"
      main_path: true
      duration_min: 13
      skills: [devops.iac.state]
      prereqs: [devops.l3.remote-state-and-locking, k8s.l1.control-plane-components, k8s.l1.labels]
      related: [devops.l3.plan-and-apply, k8s.l1.manifests-and-kubectl-apply]
      vocab: [configuration-drift]
      example_tag: stage-3
      example_files: [deploy/tofu/envs/staging/platform/main.tf, scripts/devops/tofu-drift.sh]
      outline:
      - "Drift is a difference between real infrastructure and its configuration that was made outside OpenTofu, such as a label added to the staging `donhang` namespace with `kubectl label`."
      - "Before planning, `tofu plan` refreshes: it reads each resource's current attributes through its provider, so the hand-made label shows up as a change OpenTofu would undo."
      - "`tofu plan -refresh-only` lists only what changed outside OpenTofu; `tofu apply -refresh-only` records those values in the state and changes no real object."
      - "OpenTofu does nothing between runs, unlike a Kubernetes control loop: drift stays until someone runs a plan and reads it."
      - "`tofu plan -detailed-exitcode` exits with 2 when the plan has changes and with 0 when it has none, so a scheduled job can report drift without anyone reading the output."
      - "When the hand-made change was right, the fix is to write it into the files; applying the unchanged files would remove it."
      misconceptions:
      - "Once OpenTofu has applied a change, it keeps the infrastructure that way, like Kubernetes keeps a Deployment's Pods running."
      - "`tofu apply -refresh-only` puts the infrastructure back the way the files describe it."
      - "If `tofu plan` shows a change nobody wrote, someone must have edited the `.tf` files."
      depth_notes: "Không dạy ignore_changes, tofu import. Đồng bộ liên tục từ Git — devops/gitops. Không dựng job drift theo lịch trong CI (CI không tới được state của lab), chỉ nêu ý."
  - id: gitops
    title:
      vi: "GitOps với Argo CD"
      en: "GitOps with Argo CD"
    stage: 3
    summary:
      vi: "Để Argo CD trong cluster staging kéo manifest từ một repo cấu hình và giữ cluster khớp với nó: đọc trạng thái sync và health, đặt migration đúng thứ tự, deploy, quay lui và promote bằng commit thay vì lệnh kubectl."
      en: "Let Argo CD in the staging cluster pull manifests from a config repository and keep the cluster matching it: read sync and health status, order the migration, and deploy, roll back and promote by commit instead of kubectl commands."
    lessons:
    - id: devops.l3.pull-based-deployment
      title:
        vi: "deploy.sh đẩy từ bên ngoài; GitOps để cluster tự kéo từ Git"
        en: "deploy.sh pushes from outside; GitOps lets the cluster pull from Git"
      main_path: true
      duration_min: 13
      skills: [devops.gitops.pull-model]
      prereqs:
      - devops.l3.configuration-drift
      - k8s.l1.deploying-don-hang
      - k8s.l1.control-plane-components
      - devops.l2.deployment-environments
      related: [k8s.l1.manifests-and-kubectl-apply, devops.l3.infrastructure-as-code]
      vocab: [gitops, pull-based-deployment]
      example_tag: stage-2
      example_files: [scripts/k8s/deploy.sh, ".github/workflows/ci.yml", deploy/k8s/api.yaml]
      outline:
      - "At stage-2 someone runs `scripts/k8s/deploy.sh` on a machine with a kubeconfig, and kubectl pushes the manifests to the API server; whoever or whatever deploys must hold credentials that can change the cluster."
      - "Keeping manifests in Git, as `deploy/k8s/` already does, is not GitOps on its own: nothing checks that the cluster still matches those files after the script has run."
      - "GitOps keeps a cluster's desired state in a Git repository and runs an agent inside the cluster that pulls it and applies it, so a deploy is a commit, not a command."
      - "In pull-based deployment the agent works as a control loop: it compares the repository with the live objects again and again, so drift is noticed without anyone running a plan."
      - "With pull, CI needs write access to the repository instead of credentials for the cluster; the agent needs read access to the repository and rights inside its own cluster."
      - "Pull adds a component to install, upgrade and watch; for one small cluster that one person deploys, a push script run from CI can be enough."
      misconceptions:
      - "Seniors often assume GitOps just means keeping the Kubernetes manifests in Git, which Đơn Hàng already does."
      - "Seniors often assume a CI job that runs `kubectl apply` after every merge is GitOps."
      - "Seniors often assume that 'pull' refers to the nodes pulling images from the registry."
      depth_notes: "Không nói Argo CD cụ thể — bài argo-cd-applications. Không so sánh Argo CD với Flux hay công cụ khác. Không nói nhiều cluster, quyền RBAC chi tiết (k8s/security-and-policy). Không dạy lại drift của OpenTofu — devops.l3.configuration-drift."
    - id: devops.l3.argo-cd-applications
      title:
        vi: "Một Application chỉ cho Argo CD thư mục nào của repo đi vào đâu"
        en: "An Application tells Argo CD which repository folder goes where"
      main_path: true
      duration_min: 14
      skills: [devops.gitops.pull-model]
      prereqs: [devops.l3.pull-based-deployment, devops.l3.one-state-per-environment, k8s.l1.namespaces]
      related: [devops.l3.remote-state-and-locking, devops.l2.cutting-a-release]
      vocab: [argo-cd, argocd-application, config-repository]
      example_tag: stage-3
      example_files:
      - scripts/devops/argocd-install.sh
      - deploy/gitops/git-server.yaml
      - scripts/devops/gitops-repo.sh
      - deploy/gitops/lessons/staging-manual.yaml
      outline:
      - "Argo CD is a GitOps agent that runs as Pods in the namespace `argocd`; Đơn Hàng installs version 3.1 into `donhang-staging` by applying a copy of its install manifest kept under `deploy/argocd/`."
      - "Argo CD cannot install itself: something outside it, here `scripts/devops/argocd-install.sh`, has to apply it first, and upgrading it means changing that pinned copy."
      - "Installing Argo CD adds new kinds of objects to the API server, such as `Application`, which kubectl reads and applies like a Deployment."
      - "An Application names a source, a repository URL, a revision and a folder, and a destination, a cluster and a namespace; `staging-manual.yaml` maps `envs/staging` of the config repository to `donhang`."
      - "A config repository holds only manifests; Đơn Hàng's lives on a Git server that `gitops-repo.sh` starts inside `donhang-staging`, so the lab needs no account on an outside service."
      misconceptions:
      - "Seniors often assume Argo CD builds the images from the application's source code."
      - "Seniors often assume Argo CD runs on the developer's machine and connects to the cluster, like kubectl."
      - "Seniors often assume an Application is a running program, like a Deployment's Pods."
      depth_notes: "Không nói giao diện web và CLI argocd (chỉ kubectl), cài HA, Argo CD tự quản lý chính nó, app of apps, ApplicationSet, Project, quyền repo riêng tư. Trạng thái sync và health — bài sau. Cách thêm object kiểu mới (CRD) — k8s/operators-and-cluster-lifecycle."
    - id: devops.l3.synced-versus-healthy
      title:
        vi: "Synced nghĩa là khớp Git; Healthy mới nghĩa là chạy được"
        en: "Synced means it matches Git; Healthy means it works"
      main_path: true
      duration_min: 14
      skills: [devops.gitops.sync]
      prereqs: [devops.l3.argo-cd-applications, k8s.l1.readiness-probes, k8s.l1.rolling-updates]
      related: [k8s.l1.deploying-don-hang]
      vocab: [argocd-sync, sync-status, argocd-health-status]
      example_tag: stage-3
      example_files:
      - deploy/gitops/lessons/staging-manual.yaml
      - scripts/devops/gitops-first-sync.sh
      - deploy/gitops/config-repo/envs/staging/api.yaml
      outline:
      - "Argo CD compares the manifests at the Application's revision with the live objects; its sync status is `Synced` when they match and `OutOfSync` when any object differs or is missing."
      - "A sync applies the manifests from Git to the cluster; an Application with no sync policy only reports `OutOfSync` and waits until someone starts a sync."
      - "Health status is separate: right after a sync the api Deployment is `Synced` but `Progressing` until its new Pods are ready, then `Healthy`."
      - "An Application's health is the worst health among the objects it manages, so one api Pod that never becomes ready keeps the whole Application from `Healthy`."
      - "Argo CD manages only objects from its folder: the namespace `donhang`, made by OpenTofu's platform layer, is neither reported missing nor changed."
      - "Argo CD rereads the repository on an interval; `gitops-first-sync.sh` asks for a refresh so the comparison happens at once."
      misconceptions:
      - "Seniors often assume `Synced` means the new version is up and serving requests."
      - "Seniors often assume Argo CD deploys whatever it finds in the repository as soon as it is installed."
      - "Seniors often assume Argo CD will delete the namespace `donhang` because it is not in Git."
      depth_notes: "Không nói kiểm health tự viết (Lua), trạng thái Suspended/Missing chi tiết, ignoreDifferences, webhook từ Git server. Thứ tự sync và migration — bài ordering-a-sync; sync tự động — devops.l3.deploying-by-commit. Secret của staging đến từ file đã mã hóa — devops.l3.sealed-secrets."
    - id: devops.l3.ordering-a-sync
      title:
        vi: "Sync wave và hook cho migration chạy đúng lúc, không cần script"
        en: "Sync waves and a hook run the migration at the right moment"
      main_path: true
      duration_min: 15
      skills: [devops.gitops.sync]
      prereqs:
      - devops.l3.synced-versus-healthy
      - devops.l2.migrations-in-the-pipeline
      - k8s.l1.deploying-don-hang
      related: [k8s.l1.health-endpoints]
      vocab: [sync-wave, argocd-hook]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo/envs/staging/migrate-hook.yaml
      - deploy/gitops/config-repo/envs/staging/api.yaml
      - deploy/gitops/config-repo/envs/staging/db.yaml
      - scripts/devops/gitops-order.sh
      outline:
      - "`deploy.sh` gets its order from waiting between kubectl commands; with Argo CD no script runs, so the order has to be written into the manifests themselves."
      - "Within a sync Argo CD orders objects by phase, then by sync wave (lower first, 0 by default), then by kind and name, and moves to the next wave only once the current one is healthy."
      - "A hook is an object annotated `argocd.argoproj.io/hook` that Argo CD creates during a sync instead of keeping it in place; it may be any kind, and Đơn Hàng's is the migration Pod."
      - "In Đơn Hàng's staging folder the database and other services are wave 0, the migration hook wave 1 and the api wave 2, so a failed migration stops the sync before the new api is applied."
      - "`hook-delete-policy: BeforeHookCreation` deletes the previous migration Pod before the next sync creates it again, since two Pods cannot share one name."
      - "The hook runs on every sync, also when only the api's replicas change, so the migration must be safe to repeat, as the bundle is: it skips migrations the database has recorded."
      misconceptions:
      - "Seniors often assume Argo CD applies the files in the order they are listed in the folder."
      - "Seniors often assume a hook runs only when its own manifest changed."
      - "Seniors often assume each api replica should migrate at startup now that no script orders the steps."
      depth_notes: "Không nói Job (k8s GĐ3, sau module này), PostSync/SyncFail hook, hook xóa khi thành công, wave âm, timeout của hook. Không nói migration không downtime (GĐ4). Rollback migration — devops.l3.rollback-by-revert."
    - id: devops.l3.deploying-by-commit
      title:
        vi: "Phiên bản mới tới staging qua một commit đổi tag, không qua lệnh"
        en: "A new version reaches staging through a commit that changes a tag"
      main_path: true
      duration_min: 14
      skills: [devops.gitops.change-flow]
      prereqs:
      - devops.l3.ordering-a-sync
      - devops.l2.tagging-images-by-commit
      - devops.l2.pushing-images-from-ci
      related: [k8s.l1.deploying-an-image-tag, devops.l2.deployment-environments]
      vocab: [automated-sync]
      example_tag: stage-3
      example_files:
      - deploy/gitops/lessons/staging-auto.yaml
      - deploy/gitops/config-repo/envs/staging/api.yaml
      - scripts/devops/gitops-deploy.sh
      outline:
      - "With `syncPolicy.automated` Argo CD starts a sync by itself whenever the Application is `OutOfSync`, such as after a commit changes a manifest in its folder."
      - "Deploying a new api version to staging is a commit that changes the image tag of the api and of the migration hook to a tag CI has already pushed to `ghcr.io`."
      - "Argo CD does not watch the registry: an image pushed under a new tag reaches the cluster only when a commit names that tag."
      - "At work the CI job that pushes the image would commit the new tag; in the lab `gitops-deploy.sh` makes that commit, since CI cannot reach the Git server inside your cluster."
      - "`git log` of `envs/staging` lists every version staging was given, when and by whom, so anyone who can push there can change what runs and the repository must be protected like the cluster."
      misconceptions:
      - "Seniors often assume Argo CD notices a new image in the registry and deploys it by itself."
      - "Seniors often assume GitOps still needs `kubectl apply`, only run by the pipeline instead of a person."
      - "Seniors often assume pointing staging at `latest` would save writing a commit for every deploy."
      depth_notes: "Không nói Argo CD Image Updater, webhook, tự commit từ GitHub Actions vào repo cấu hình, ký commit. Thay đổi làm thẳng trên cluster — devops.l3.self-heal. Không dạy lại tag sha- — devops.l2.tagging-images-by-commit."
    - id: devops.l3.self-heal
      title:
        vi: "Self-heal: Argo CD tự gỡ thay đổi làm tay trên cluster"
        en: "Self-heal: Argo CD undoes changes made to the cluster by hand"
      main_path: true
      duration_min: 13
      skills: [devops.gitops.sync]
      prereqs:
      - devops.l3.deploying-by-commit
      - devops.l3.configuration-drift
      - devops.l3.tofu-state
      - k8s.l1.deployments
      related: [k8s.l1.manifests-and-kubectl-apply]
      vocab: [self-heal]
      example_tag: stage-3
      example_files: [deploy/gitops/config-repo/apps/staging.yaml, scripts/devops/gitops-self-heal.sh]
      outline:
      - "Automated sync alone acts on changes in Git; a change made in the cluster, such as `kubectl scale` of the api to 4 replicas, leaves the Application `OutOfSync` but running that way."
      - "With `selfHeal: true` Argo CD also syncs when the live objects drift from Git, so the api returns to the replicas its manifest declares shortly after the change."
      - "Unlike OpenTofu, which finds drift only when someone runs a plan, Argo CD compares continuously; with self-heal a hand-made fix lasts only until it is written into Git."
      - "Removing a manifest from Git deletes its object only when the policy also sets `prune: true`; without it the object keeps running and is shown as needing to be pruned."
      - "`apps/staging.yaml`, the Application Đơn Hàng keeps, turns on automated sync, self-heal and prune, so the staging namespace's objects from the folder follow Git in both directions."
      misconceptions:
      - "Seniors often assume automated sync already reverts any change made with kubectl."
      - "Seniors often assume deleting a file from the config repository deletes its object from the cluster in every case."
      - "Seniors often assume self-heal makes emergency fixes with kubectl safe, since Git can catch up later."
      depth_notes: "Không nói ignoreDifferences cho trường do controller khác sửa (vd autoscaler, k8s GĐ3), timeout self-heal, prune theo từng object, quyền sửa trực tiếp cluster (RBAC — k8s/security-and-policy). Không dạy lại drift của OpenTofu."
    - id: devops.l3.rollback-by-revert
      title:
        vi: "Quay lui với GitOps là git revert, không phải kubectl rollout undo"
        en: "Rolling back with GitOps is git revert, not kubectl rollout undo"
      main_path: true
      duration_min: 14
      skills: [devops.gitops.change-flow]
      prereqs: [devops.l3.self-heal, k8s.l1.rollbacks, foundation.l2.git-history-and-recovery]
      related: [devops.l3.ordering-a-sync]
      vocab: []
      example_tag: stage-3
      example_files: [scripts/devops/gitops-revert.sh, deploy/gitops/config-repo/envs/staging/api.yaml]
      outline:
      - "A commit that sets the api's tag to one missing from the registry is synced like any other: the new Pod cannot pull its image, both old api Pods keep serving, and the Application is `Synced` but not `Healthy`."
      - "With self-heal on, `kubectl rollout undo` does not last: the live Deployment no longer matches Git, so Argo CD applies the bad tag again."
      - "Argo CD's own rollback to an earlier sync is refused while automated sync is on, so the way back goes through the repository."
      - "`git revert` adds a commit that undoes the bad one; once it is pushed, Argo CD syncs the previous tag back, and the history keeps both the mistake and its fix."
      - "A revert restores manifests, not data: migrations a hook has already applied stay in the database, so going back past a schema change needs the older api to work with the newer schema."
      misconceptions:
      - "Seniors often assume `kubectl rollout undo` is still the quickest safe fix when Argo CD manages the Deployment."
      - "Seniors often assume the cleanest rollback is resetting the branch to the last good commit and force-pushing."
      - "Seniors often assume reverting the deploy commit also rolls the database back."
      depth_notes: "Không nói migration ngược hay expand/contract (GĐ4), rollback tự động hoặc canary (devops GĐ4), tắt automated sync tạm thời để chữa cháy. Không dạy lại git revert — foundation.l2.git-history-and-recovery."
    - id: devops.l3.promoting-between-environments
      title:
        vi: "Promote lên production là commit chép đúng tag staging đã chạy"
        en: "Promoting to production is a commit that copies staging's tag"
      main_path: true
      duration_min: 13
      skills: [devops.gitops.change-flow]
      prereqs:
      - devops.l3.rollback-by-revert
      - devops.l3.one-state-per-environment
      - devops.l2.cutting-a-release
      related: [devops.l2.deployment-environments, management.l1.code-review-basics]
      vocab: [environment-promotion]
      example_tag: stage-3
      example_files:
      - deploy/gitops/config-repo/envs/production/api.yaml
      - deploy/gitops/config-repo/envs/staging/api.yaml
      - scripts/devops/gitops-promote.sh
      outline:
      - "`envs/staging` and `envs/production` each hold a full set of manifests; they differ only in values such as the number of api replicas and the image tag."
      - "Promotion is a commit to `envs/production` that sets the tag staging already runs, so production gets the very image staging checked, with no rebuild."
      - "Opening that commit as a pull request lets review and required checks decide when production changes, the role the environment's protection rule played for the CI `staging` job."
      - "Keeping a full copy per environment means a change meant for both, such as a new probe, must be made twice, and a forgotten copy makes the environments differ unnoticed."
      - "In the lab nothing syncs production: OpenTofu only plans that cluster, so `gitops-promote.sh` shows the commit and its diff, not a rollout."
      misconceptions:
      - "Seniors often assume promoting to production means building the image again from the tagged commit."
      - "Seniors often assume each environment needs its own long-lived branch, and promoting means merging one branch into the next."
      - "Seniors often assume staging and production may share one folder as long as they run in different clusters."
      depth_notes: "Không nói Kustomize/Helm để dựng môi trường từ một base chung (k8s/ingress-helm), một Argo CD quản lý nhiều cluster, promote tự động, canary (GĐ4). Không dạy lại tag phát hành — devops.l2.cutting-a-release."
  - id: secrets-backup-dr
    title:
      vi: "Secret trong Git, sao lưu và khôi phục sau thảm họa"
      en: "Secrets in Git, backups and disaster recovery"
    stage: 3
    summary:
      vi: "Đưa Secret vào Git ở dạng chỉ cluster giải mã được, xoay vòng chúng có khoảng chồng lấn, sao lưu PostgreSQL bằng dump và WAL lưu trữ, chứng minh bản sao lưu bằng cách khôi phục thử, và dựng lại staging trong một buổi diễn tập có bấm giờ."
      en: "Keep Secrets in Git in a form only the cluster can decrypt, rotate them with a planned overlap, back up PostgreSQL with dumps and archived WAL, prove backups by restoring them, and rebuild staging in a timed drill."
    lessons:
    - id: devops.l3.secrets-and-gitops
      title:
        vi: "Vì sao Secret không thể vào repo cấu hình ở dạng nguyên"
        en: "Why Secrets cannot go into the config repository as they are"
      main_path: true
      duration_min: 13
      skills: [devops.secrets.sealing]
      prereqs: [k8s.l1.secrets, devops.l3.argo-cd-applications, devops.l3.self-heal]
      related: [devops.l1.secrets-vs-config, devops.l3.tofu-state]
      vocab: []
      example_tag: stage-2
      example_files: [scripts/k8s/secrets.sh, scripts/k8s/deploy.sh, scripts/dev-secrets.sh]
      outline:
      - "At stage-2 `scripts/k8s/deploy.sh` runs `scripts/k8s/secrets.sh`, which builds the Secrets `db`, `api` and `keycloak` from the gitignored `.env` of whoever deploys; no file in Git holds their values."
      - "Under GitOps the cluster takes its desired state only from the config repository, so a Secret kept out of it must arrive by another path, which Argo CD can neither restore nor record in history."
      - "Committing a Secret manifest as it is hands its values to everyone who can clone the repository, in every later copy of its history too, because base64 hides nothing."
      - "One way out commits each value encrypted so that only a component inside the cluster can decrypt it; another commits only a reference and lets a component copy the value from a separate secret store."
      - "Đơn Hàng encrypts into Git from stage-3, since the lab then needs nothing beyond the cluster and the repository; a separate store fits when many systems share secrets or values change without a commit."
      misconceptions:
      - "Seniors often assume a private config repository is safe enough for plain Secret manifests."
      - "Seniors often assume keeping Secrets out of Git costs nothing under GitOps, since Argo CD simply ignores them."
      - "Seniors often assume that if the values in Git are encrypted, Argo CD must hold the key to decrypt them."
      depth_notes: "Không nêu tên/so sánh công cụ secret store (Vault, External Secrets, SOPS chưa có trong versions.yaml), mã hóa etcd, RBAC đọc Secret (k8s/security-and-policy). Công cụ Đơn Hàng dùng — devops.l3.sealed-secrets. Không dạy lại base64 — k8s.l1.secrets."
    - id: devops.l3.sealed-secrets
      title:
        vi: "SealedSecret an toàn trong Git vì chỉ cluster mở được nó"
        en: "A SealedSecret is safe in Git because only the cluster can open it"
      main_path: true
      duration_min: 15
      skills: [devops.secrets.sealing]
      prereqs:
      - devops.l3.secrets-and-gitops
      - backend.l2.validating-provider-tokens
      - devops.l3.one-state-per-environment
      - devops.l3.synced-versus-healthy
      related: [k8s.l1.secrets, devops.l3.argo-cd-applications]
      vocab: [sealed-secret, sealing-key]
      example_tag: stage-3
      example_files:
      - scripts/devops/seal-secrets.sh
      - scripts/devops/sealed-secrets-install.sh
      - deploy/tofu/modules/donhang-platform/main.tf
      - scripts/dev-secrets.sh
      outline:
      - "The Sealed Secrets controller runs in the cluster with a sealing key pair; `kubeseal` encrypts a Secret with the public half into a SealedSecret, which only the controller's private key can decrypt."
      - "`seal-secrets.sh` seals the `db`, `api` and `keycloak` values from `.env` using only the certificate file in `secrets/`, without contacting the cluster, and commits the SealedSecrets to `envs/staging`."
      - "When Argo CD applies a SealedSecret, the controller decrypts it and creates the Secret of the same name, which the Pods read as before; the config repository holds only ciphertext."
      - "By default a SealedSecret decrypts only under the name and namespace it was sealed for, so copying it into another namespace or renaming it produces no Secret."
      - "The private key opens every SealedSecret: Đơn Hàng creates it in the gitignored `secrets/`, the platform layer installs it (its encrypted state holds a copy), and key renewal is off so it stays the only key."
      misconceptions:
      - "Seniors often assume Argo CD needs the private key to deploy a SealedSecret."
      - "Seniors often assume sealing a value requires kubectl access to the cluster."
      - "Seniors often assume a SealedSecret can be copied into another namespace like any other manifest."
      depth_notes: "Không dạy scope namespace-wide/cluster-wide, kubeseal --re-encrypt, cài bằng Helm, RBAC (k8s/security-and-policy), cách thêm kiểu object mới (k8s/operators-and-cluster-lifecycle). Đổi giá trị — devops.l3.secret-rotation; sao lưu khóa — devops.l3.disaster-recovery-drill."
    - id: devops.l3.secret-rotation
      title:
        vi: "Xoay vòng secret cần một lúc cả giá trị cũ lẫn mới đều dùng được"
        en: "Rotating a secret needs a time when old and new both work"
      main_path: true
      duration_min: 18
      skills: [devops.secrets.rotation]
      prereqs:
      - devops.l3.sealed-secrets
      - backend.l2.validating-provider-tokens
      - backend.l2.refresh-tokens
      - devops.l3.deploying-by-commit
      related: [devops.l1.the-jwt-secret-in-practice, k8s.l1.rolling-updates]
      vocab: [secret-rotation]
      example_tag: stage-3
      example_files:
      - scripts/devops/rotate-signing-key.sh
      - scripts/devops/rotate-db-password.sh
      - deploy/gitops/config-repo/envs/staging/api.yaml
      outline:
      - "Secret rotation replaces a secret's value on a schedule or after a suspected leak, so that any copy someone kept stops working."
      - "Keycloak can hold several signing keys: `rotate-signing-key.sh` adds one with a higher priority, so new tokens name the new key id while tokens signed with the old key still pass the API's checks."
      - "The API fetches Keycloak's public keys again by itself, but at most every few minutes, so a token signed by a brand-new key can be refused for a while; the rotation needs no restart, only that wait."
      - "The old key is removed only after every token it signed has expired; even then the API keeps accepting it until its next fetch of the keys."
      - "A PostgreSQL role has one password at a time: `rotate-db-password.sh` runs `ALTER ROLE` first, connections already open keep working, and the api uses the new value once its Pods restart."
      - "A changed Secret does not reach Pods that read it as environment variables, so the commit that reseals `api` also changes an annotation in its Pod template, which rolls the Pods."
      misconceptions:
      - "Seniors often assume rotating a signing key means swapping it in one step and restarting everything that checks tokens."
      - "Seniors often assume a new `POSTGRES_PASSWORD` in the db Secret changes the password inside the database."
      - "Seniors often assume running Pods pick up a changed Secret by themselves."
      depth_notes: "Không dạy rotation tự động theo lịch, hai role luân phiên để đổi mật khẩu DB không gián đoạn, đổi sealing key, khóa của refresh token. Không dạy lại kiểm token — backend.l2.validating-provider-tokens; rolling update — k8s.l1.rolling-updates."
    - id: devops.l3.rpo-and-rto
      title:
        vi: "RPO và RTO: sự cố được phép làm mất bao nhiêu dữ liệu và thời gian"
        en: "RPO and RTO: how much data and time a failure may cost"
      main_path: true
      duration_min: 12
      skills: [devops.dr.recovery]
      prereqs: [devops.l1.volumes, k8s.l1.deploying-don-hang, management.l2.non-functional-requirements]
      related: [foundation.l1.shell-scripts, backend.l2.redis-key-value-store]
      vocab: [disaster-recovery, rpo, rto]
      example_tag: stage-2
      example_files: [scripts/terminal/backup-db.sh, docker-compose.yml, deploy/k8s/db.yaml]
      outline:
      - "Disaster recovery is getting a system working again after losing something it cannot run without, such as the disk under its database or a whole cluster."
      - "RPO is how much recent data the business accepts losing, counted as time before the failure; RTO is how long it accepts the system being unusable until it works again."
      - "Both come from the business, such as how many orders the shop could re-enter by hand, and each step lower costs more storage, tooling and practice."
      - "At stage-2 `scripts/terminal/backup-db.sh` dumps `donhang` with `--schema-only`: its file creates every table but holds no rows, so it recovers no order."
      - "Đơn Hàng's data lives in the Compose volume `db-data` on one machine and, in the kind cluster, in an `emptyDir` deleted with the db Pod; neither survives losing its machine."
      - "Redis needs no backup because nothing in it is the only copy of a fact; deciding which stores hold the only copy comes before deciding how to back them up."
      misconceptions:
      - "Seniors often assume the RPO is whatever interval the backup job happens to run at."
      - "Seniors often assume the RTO is how long the restore command takes."
      - "Seniors often assume every data store in the system needs the same kind of backup."
      depth_notes: "Không dạy cách sao lưu — các bài sau của module. Không dạy SLA/SLO (backend/capacity-and-slo GĐ4), high availability, failover, multi-region (GĐ4). Không dạy lại volume — devops.l1.volumes."
    - id: devops.l3.logical-backups
      title:
        vi: "pg_dump chép một database đúng như tại một thời điểm"
        en: "pg_dump copies one database as it was at one moment"
      main_path: true
      duration_min: 14
      skills: [devops.backup.postgresql]
      prereqs: [devops.l3.rpo-and-rto, backend.l2.transactions-in-practice, foundation.l1.shell-scripts]
      related: [devops.l3.remote-state-and-locking, backend.l3.multi-tenancy]
      vocab: [logical-backup]
      example_tag: stage-3
      example_files: [scripts/devops/backup-logical.sh, docker-compose.yml]
      outline:
      - "A logical backup stores a database as the statements and data that rebuild it; `pg_dump` makes one per database inside a single transaction, so it is consistent while orders keep arriving."
      - "At stage-3 Compose's PostgreSQL holds `donhang`, `donhang_notifications`, `donhang_payments`, `donhang_tofu` and `keycloak`; `backup-logical.sh` dumps each and skips lab databases scripts can rebuild."
      - "Roles and their passwords belong to the server, not to one database, so `pg_dump` leaves them out and `pg_dumpall --globals-only` saves them separately."
      - "`pg_dump -Fc` writes the custom format, which `pg_restore` reads to rebuild the database inside an empty one, whole or only chosen tables."
      - "The dumps are taken one after another, each at its own moment, so restored together they may disagree about the same order across databases."
      - "Everything written after the last dump is lost, so the RPO is the time between dumps; dump files kept on the database's machine are lost with it."
      misconceptions:
      - "Seniors often assume `pg_dump` locks the database, so it can only run when nobody uses it."
      - "Seniors often assume copying the `db-data` volume's files while PostgreSQL runs gives a usable backup."
      - "Seniors often assume a dump of `donhang` also brings back the role the api logs in with."
      depth_notes: "Không dạy dump song song (-j), định dạng directory/tar, nén, lưu ngoài máy hay cloud storage. Base backup và WAL — devops.l3.point-in-time-recovery; kiểm bản restore — devops.l3.restore-testing."
    - id: devops.l3.point-in-time-recovery
      title:
        vi: "Base backup cùng WAL lưu trữ đưa server về đúng thời điểm bạn chọn"
        en: "A base backup plus archived WAL restores the moment you choose"
      main_path: true
      duration_min: 16
      skills: [devops.backup.postgresql]
      prereqs: [devops.l3.logical-backups, backend.l3.read-replicas, foundation.l1.transaction-intro]
      related: [devops.l3.restore-testing]
      vocab: [write-ahead-log, base-backup, point-in-time-recovery]
      example_tag: stage-3
      example_files: [docker-compose.yml, scripts/devops/base-backup.sh, scripts/devops/pitr.sh]
      outline:
      - "PostgreSQL records every change in its write-ahead log (WAL) before changing the data files; replaying the WAL from a known starting point redoes every change made since."
      - "A base backup, taken with `pg_basebackup` while the server runs, copies the data files of the whole server; with `archive_mode` on, `archive_command` copies each completed WAL segment to an archive."
      - "Point-in-time recovery starts a server from a base backup and replays archived WAL up to `recovery_target_time`, such as just before a mistaken `DELETE`."
      - "`pitr.sh` recovers into a separate container, so the deleted rows can be read there and copied back while the lab database keeps running."
      - "Recovery works on the whole server: every database in it returns to the same moment, and one database cannot be taken back on its own."
      - "With archiving the RPO is the WAL not yet archived; `archive_timeout` limits how long a quiet server waits before it archives a partly filled segment."
      misconceptions:
      - "Seniors often assume a read replica already protects them from a mistaken `DELETE`."
      - "Seniors often assume a base backup alone can bring the server back to any time after it was taken."
      - "Seniors often assume point-in-time recovery can take back one database while the others keep their newest data."
      depth_notes: "Không dạy backup tăng dần (pg_combinebackup), pgBackRest/Barman, timeline, replication slot, lưu archive ngoài máy, checkpoint/full page write. Read replica — backend.l3.read-replicas."
    - id: devops.l3.restore-testing
      title:
        vi: "Bản sao lưu chỉ đáng tin khi đã được khôi phục thử"
        en: "A backup counts only once a restore of it has been tested"
      main_path: true
      duration_min: 13
      skills: [devops.dr.recovery]
      prereqs: [devops.l3.point-in-time-recovery, devops.l3.logical-backups]
      related: [devops.l2.quality-gate, devops.l3.rpo-and-rto]
      vocab: [restore-test]
      example_tag: stage-3
      example_files: [scripts/devops/restore-test.sh, scripts/devops/backup-logical.sh]
      outline:
      - "A backup can fail without an error: a schema-only dump like stage-2's `backup-db.sh`, a database left off the list, or an archive that stopped all look fine until a restore is needed."
      - "A restore test restores the newest backup into a fresh, separate server and checks the result against facts recorded when the backup was taken, such as row counts per table."
      - "`restore-test.sh` restores the newest dumps into a throwaway PostgreSQL container, compares counts of `orders`, `order_items` and `customers` with the dump's record, and exits 1 on any difference."
      - "Timing the restore test gives a measured restore time to set against the RTO, in place of a guess."
      - "When backups run on a schedule, the restore test belongs on one too, with an alert when it fails, since last month's success says nothing about last night's backup."
      misconceptions:
      - "Seniors often assume `pg_dump` exiting with 0 proves its file can be restored."
      - "Seniors often assume restoring over the live database is the most realistic test."
      - "Seniors often assume a restore test is needed once, when the backup job is first set up."
      depth_notes: "Không dựng job theo lịch hay alert thật (CI không tới được lab; alert — devops/incidents GĐ4), không kiểm checksum trang. Khôi phục cả môi trường — devops.l3.disaster-recovery-drill."
    - id: devops.l3.disaster-recovery-drill
      title:
        vi: "Diễn tập DR: dựng lại staging từ Git, khóa và bản sao lưu, có bấm giờ"
        en: "A DR drill rebuilds staging from Git, keys and backups, and times it"
      main_path: true
      duration_min: 16
      skills: [devops.dr.recovery]
      prereqs:
      - devops.l3.restore-testing
      - devops.l3.sealed-secrets
      - devops.l3.remote-state-and-locking
      - devops.l3.argo-cd-applications
      related: [devops.l3.infrastructure-as-code, devops.l3.self-heal]
      vocab: [dr-drill]
      example_tag: stage-3
      example_files:
      - scripts/devops/dr-drill.sh
      - deploy/tofu/modules/donhang-platform/main.tf
      - scripts/dev-secrets.sh
      outline:
      - "A DR drill destroys an environment on purpose and rebuilds it by the written steps, to find what the steps miss before a real disaster does."
      - "`dr-drill.sh` destroys `donhang-staging` with OpenTofu, reapplies OpenTofu's cluster and platform layers, installs the controllers, restores the config repository and waits for Argo CD's `Healthy`, timing each step."
      - "The Git server runs inside the cluster and loses its storage with it, so the config repository comes back only from the mirror clone taken earlier; commits made after that clone are gone."
      - "SealedSecrets decrypt in the new cluster only because the platform layer installs the same sealing key; with `--without-sealing-key` no Secret appears and the db and api Pods never start."
      - "Two secrets sit outside every backup, the sealing key in `secrets/` and the state passphrase in `.env`: lose them and the backups they protect cannot be read."
      - "The drill's total time is staging's measured RTO; when it exceeds the target, change the steps or the target, then drill again."
      misconceptions:
      - "Seniors often assume that with everything in Git, rebuilding an environment needs nothing else."
      - "Seniors often assume a reviewed, written recovery plan works without ever being run."
      - "Seniors often assume a backup of the cluster's objects includes the keys needed to read them."
      depth_notes: "Không dạy backup etcd hay Velero (k8s GĐ3), dữ liệu trên PV (k8s/state-and-storage), failover tự động, multi-region, runbook/on-call (devops/incidents GĐ4). Dữ liệu staging khởi tạo lại từ seed, không restore."
  - id: supply-chain
    title:
      vi: "Bảo mật chuỗi cung ứng phần mềm"
      en: "Software supply chain security"
    stage: 3
    summary:
      vi: "Ghim mọi đầu vào của image bằng hash và để Dependabot đề xuất bản mới, liệt kê thành phần bằng SBOM và quét lỗ hổng, ký image trong CI kèm provenance, và chỉ deploy digest đã xác minh."
      en: "Pin every input of Đơn Hàng's images by hash and let Dependabot propose updates, list their contents in an SBOM and scan it, sign images with provenance in CI, and deploy only digests that verify."
    lessons:
    - id: devops.l3.software-supply-chain
      title:
        vi: "Image của bạn phần lớn là code người khác viết"
        en: "Your image is mostly code you never wrote: the supply chain"
      main_path: true
      duration_min: 12
      skills: [devops.supply-chain.inputs]
      prereqs:
      - devops.l2.cutting-a-release
      - devops.l2.pushing-images-from-ci
      - devops.l2.dependency-cache
      - devops.l1.multi-stage-builds
      related: [devops.l3.deploying-by-commit, devops.l2.image-tags-and-digests]
      vocab: [software-supply-chain]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Dockerfile
      - Directory.Packages.props
      - ".github/workflows/ci.yml"
      - DonHang.App/pubspec.yaml
      outline:
      - "A software supply chain is every input that goes into what you ship, such as packages, base images, build tools and CI actions, plus the steps that turn them into it."
      - "At stage-2 the api image holds Đơn Hàng's code, the NuGet packages in `Directory.Packages.props`, the packages those depend on, and everything in `mcr.microsoft.com/dotnet/aspnet:10.0`, including OS packages."
      - "`ci.yml` runs actions written by others, such as `actions/checkout@v4` and `subosito/flutter-action@v2`, as code inside its jobs, with access to what each job has."
      - "The `publish` job is granted `packages: write`, so any code that job runs could push an image to `ghcr.io` under Đơn Hàng's name."
      - "Whoever controls one input, a package release, a base image tag or an action tag, can put code into the image without any commit to Đơn Hàng's repository."
      - "The defences in this module answer three questions: is each input the one you reviewed, what is inside the image and is any of it known to be vulnerable, and was the running image built by your pipeline."
      misconceptions:
      - "Seniors often assume supply-chain security means checking the final image for known vulnerabilities."
      - "Seniors often assume a package from a well-known registry such as nuget.org cannot contain malicious code."
      - "Seniors often assume a third-party GitHub Action can touch only the files on the runner it runs on."
      depth_notes: "Chỉ mô tả và vạch rủi ro ở stage-2; cách chống — các bài sau của module. Không nêu tên/ngày vụ tấn công có thật. Không nói lỗ hổng trong code của chính Đơn Hàng (SAST, review bảo mật) hay quyền mặc định của GITHUB_TOKEN theo cài đặt repo."
    - id: devops.l3.pinning-by-content
      title:
        vi: "Ghim mọi đầu vào bằng hash nội dung, không bằng cái tên có thể dời"
        en: "Pin every input by its content hash, not by a name that can move"
      main_path: true
      duration_min: 15
      skills: [devops.supply-chain.inputs]
      prereqs:
      - devops.l3.software-supply-chain
      - devops.l2.image-tags-and-digests
      - devops.l3.opentofu-resources
      - devops.l2.dependency-cache
      related: [k8s.l1.cluster-nodes-and-control-plane, devops.l1.dockerfile-for-dotnet]
      vocab: [lock-file, transitive-dependency]
      example_tag: stage-3
      example_files:
      - Directory.Build.props
      - DonHang.Api/packages.lock.json
      - DonHang.Api/Dockerfile
      - ".github/workflows/ci.yml"
      outline:
      - "A name such as a version range, an action tag like `@v4` or an image tag like `aspnet:10.0` can lead to different content later; pinning names the content itself, by a hash."
      - "A lock file records the exact version and a content hash of every package, direct and transitive: `DonHang.App/pubspec.lock` has done so since stage-2, and from stage-3 each .NET project has a `packages.lock.json`."
      - "CI restores with `dotnet restore --locked-mode` and `flutter pub get --enforce-lockfile`, which fail instead of resolving something new, so a change to the packages must arrive as a reviewed change to a lock file."
      - "From stage-3 every `uses:` in Đơn Hàng's workflows names a full commit id with the version in a comment, because a tag such as `v4` is a Git tag its owner can move."
      - "`DonHang.Api/Dockerfile` names its base images by digest, as `kind-config.yaml` already did for the node image, so a rebuild months later starts from the same base layers."
      - "Pinning stops silent change but also stops fixes from arriving: every update becomes a change someone must make on purpose."
      misconceptions:
      - "Seniors often assume a version tag of a GitHub Action such as `v4` always runs the same code."
      - "Seniors often assume a lock file is generated output that does not belong in Git."
      - "Seniors often assume a lock file protects against a malicious package, rather than keeping whatever was locked."
      depth_notes: "Không dạy version range/floating version của NuGet, central transitive pinning, nhiều package source, build tái lập từng bit, ghim gói apt trong Dockerfile. Cập nhật bản ghim — devops.l3.automated-dependency-updates. Không dạy lại digest — devops.l2.image-tags-and-digests."
    - id: devops.l3.automated-dependency-updates
      title:
        vi: "Đầu vào đã ghim cần cập nhật: Dependabot mở pull request đề xuất"
        en: "Pinned inputs need updates, and Dependabot proposes them as PRs"
      main_path: true
      duration_min: 13
      skills: [devops.supply-chain.inputs]
      prereqs: [devops.l3.pinning-by-content, devops.l2.quality-gate, devops.l2.semantic-versioning]
      related: [management.l1.code-review-basics]
      vocab: [dependabot]
      example_tag: stage-3
      example_files: [".github/dependabot.yml", ".github/workflows/ci.yml"]
      outline:
      - "Dependabot is a GitHub service that reads `.github/dependabot.yml` and opens a pull request when a newer version of a dependency exists; Đơn Hàng's file covers NuGet, pub, GitHub Actions and Docker base images."
      - "A Dependabot pull request changes the pin itself, such as a lock file, an action's commit id or a base image digest, so the change is visible in review like any other."
      - "Each update arrives as a pull request, so it must pass the same CI checks as any other change before it can be merged."
      - "`groups` combines matching updates into one pull request; Đơn Hàng groups minor and patch updates per ecosystem and checks weekly, so the pull requests stay few enough to read."
      - "A `cooldown` makes Dependabot wait a set number of days after a release before proposing it, so a malicious release that is found and removed quickly never reaches a pull request."
      - "Dependabot runs only on GitHub, so the lab cannot run it; its configuration lives in the repository like the workflows."
      misconceptions:
      - "Seniors often assume Dependabot only opens pull requests for packages with known vulnerabilities."
      - "Seniors often assume merging every Dependabot pull request without review is safe, since the bot only proposes official releases."
      - "Seniors often assume automated updates make pinning pointless, so version ranges would do just as well."
      depth_notes: "Không dạy Renovate (chưa có trong versions.yaml), auto-merge, Dependabot alerts/security updates chi tiết, registry riêng, cài đặt trong GitHub settings. Không nêu số ngày cooldown như khuyến nghị chung."
    - id: devops.l3.software-bill-of-materials
      title:
        vi: "SBOM liệt kê mọi thành phần thật sự nằm trong image"
        en: "An SBOM lists every component that is actually inside the image"
      main_path: true
      duration_min: 13
      skills: [devops.supply-chain.inventory]
      prereqs: [devops.l3.pinning-by-content, devops.l2.building-images-in-ci, devops.l2.workflow-artifacts]
      related: [devops.l1.multi-stage-builds]
      vocab: [sbom]
      example_tag: stage-3
      example_files: [scripts/devops/sbom.sh, ".github/workflows/ci.yml"]
      outline:
      - "A software bill of materials (SBOM) is a machine-readable list of the components inside a piece of software, each with its name, version and kind, such as a NuGet package or an OS package."
      - "Syft reads a built image and writes its SBOM; `sbom.sh` runs it on the api image and shows OS packages from the base image next to the NuGet packages inside the published app."
      - "The project files list only the packages Đơn Hàng asked for; the SBOM of the image also shows transitive dependencies and whatever the base image brought."
      - "Đơn Hàng writes SBOMs in the CycloneDX JSON format, a published standard, so other tools can read the list without the image."
      - "CI makes the SBOM in the `image` job from the exact image it built and keeps it as an artifact of the run, so the list describes what runs, not what the source declares."
      - "An SBOM records what is inside, not whether it is safe; it pays off when a new vulnerability is published and you must find which images hold the affected version."
      misconceptions:
      - "Seniors often assume `Directory.Packages.props` and `pubspec.lock` together already are the SBOM of the api image."
      - "Seniors often assume an image that has an SBOM has been checked for vulnerabilities."
      depth_notes: "Không so sánh chi tiết CycloneDX với SPDX, không dạy VEX, license compliance, SBOM của DonHang.App. Quét lỗ hổng — bài sau. Gắn SBOM vào image trong registry — devops.l3.build-provenance."
    - id: devops.l3.vulnerability-scanning
      title:
        vi: "Kết quả quét lỗ hổng chỉ mới bằng cơ sở dữ liệu đứng sau nó"
        en: "A vulnerability scan is only as current as its database"
      main_path: true
      duration_min: 15
      skills: [devops.supply-chain.inventory]
      prereqs:
      - devops.l3.software-bill-of-materials
      - devops.l2.quality-gate
      - devops.l3.automated-dependency-updates
      related: [devops.l3.restore-testing]
      vocab: [cve, vulnerability-scanner]
      example_tag: stage-3
      example_files: [scripts/devops/scan-image.sh, ".grype.yaml", ".github/workflows/ci.yml"]
      outline:
      - "A vulnerability scanner matches each component's name and version against a database of published vulnerabilities, each known by a CVE id, with a severity and, when one exists, the version that fixes it."
      - "`dotnet restore` checks NuGet packages against known vulnerabilities, but only NuGet packages; Grype scans the whole SBOM, OS packages from the base image included."
      - "A scan's result depends on the database on the day it runs: the same image can scan clean today and show a critical finding next month, so a scan at build time says nothing about later."
      - "Đơn Hàng's `image` job fails when Grype finds a High or Critical vulnerability that has a fixed version (`--fail-on high --only-fixed`), so the pipeline blocks only what an update can fix."
      - "A finding the team accepts, such as one in a base-image package with no fixed version, is listed in `.grype.yaml` with a comment giving the reason, so the next reader sees why it was accepted."
      - "A scanner finds only vulnerabilities already published; it says nothing about a malicious package nobody has reported, which pinning, cooldowns and signatures address."
      misconceptions:
      - "Seniors often assume an image that passed the scan in CI stays free of known vulnerabilities while it runs."
      - "Seniors often assume every finding must be fixed before a release, or the scan is pointless."
      - "Seniors often assume a clean scan means the image contains no malicious code."
      depth_notes: "Không dạy reachability analysis, VEX, quét code nguồn (SAST), quét secret, tự dựng DB lỗ hổng. Quét lại định kỳ image đang chạy chỉ nêu ý (không có job theo lịch). Output quét đổi theo ngày — bài không khẳng định số finding."
    - id: devops.l3.signing-images
      title:
        vi: "Chữ ký gắn digest của image với pipeline đã build ra nó"
        en: "A signature ties an image digest to the pipeline that built it"
      main_path: true
      duration_min: 16
      skills: [devops.supply-chain.trust]
      prereqs:
      - devops.l3.software-supply-chain
      - devops.l2.image-tags-and-digests
      - backend.l2.validating-provider-tokens
      - devops.l2.cutting-a-release
      related: [backend.l2.openid-connect-id-token, devops.l3.sealed-secrets]
      vocab: [image-signature, cosign, keyless-signing, transparency-log]
      example_tag: stage-3
      example_files: [".github/workflows/ci.yml", ".github/workflows/release.yml", scripts/devops/verify-image.sh]
      outline:
      - "A digest says exactly which image you have, not who made it: anyone who can push to a name can push another image, and that image's digest is just as valid."
      - "An image signature is a signature over an image's digest; checking it proves the image is exactly the one the holder of the signing key signed."
      - "In keyless signing, Cosign in the `publish` job proves the job's identity with an ID token from GitHub, gets a short-lived certificate for that identity, signs, and discards the private key."
      - "Each keyless signature is recorded in a public transparency log, which lets a verifier confirm the signing happened while the short-lived certificate was valid."
      - "`release.yml` only adds a version tag to a digest CI already signed, so a release carries CI's signature without signing again."
      - "Anyone can get a valid keyless signature for their own identity, so `verify-image.sh` accepts only a certificate issued to `ci.yml` on `master` of Đơn Hàng's repository."
      misconceptions:
      - "Seniors often assume pinning an image by digest already proves who built it."
      - "Seniors often assume `cosign verify` passing on any valid signature proves the image came from their own pipeline."
      - "Seniors often assume giving an already signed image a release tag means signing it again."
      depth_notes: "Không dạy ký bằng cặp khóa tự quản lý hay KMS, tự dựng hạ tầng ký, ký commit/tag git, chi tiết CA và log của Sigstore. Provenance — devops.l3.build-provenance; chặn image chưa ký khi deploy — devops.l3.verifying-before-deploy."
    - id: devops.l3.build-provenance
      title:
        vi: "Provenance ghi commit và workflow nào đã build ra image"
        en: "Build provenance records which commit and workflow built an image"
      main_path: true
      duration_min: 15
      skills: [devops.supply-chain.trust]
      prereqs:
      - devops.l3.signing-images
      - devops.l3.software-bill-of-materials
      - devops.l2.tagging-images-by-commit
      related: [devops.l2.continuous-integration]
      vocab: [attestation, build-provenance, slsa]
      example_tag: stage-3
      example_files: [".github/workflows/ci.yml", scripts/devops/verify-image.sh]
      outline:
      - "An attestation is a signed statement about a digest: a signature says who vouches for an image, an attestation also says what they state about it."
      - "Build provenance is an attestation of how an image was built: the repository, the commit, the workflow and the event that started the run."
      - "The `publish` job attests provenance with `actions/attest-build-provenance` for each pushed digest, granted `id-token: write` and `attestations: write`, and stores it in the registry beside the image."
      - "`verify-image.sh` checks that the provenance names Đơn Hàng's repository and `ci.yml`; the `1.0.0` image, built before stage-3, has no attestation and fails."
      - "SLSA grades build integrity in levels: provenance exists (Build L1), is signed by a hosted build platform (L2), and comes from a platform that keeps the build's steps away from the signing key (L3); Đơn Hàng's is L2."
      - "The SBOM from the `image` job is attested the same way, so anyone who holds the digest can fetch a signed list of what the image contains."
      misconceptions:
      - "Seniors often assume an image signature already tells them which commit the image was built from."
      - "Seniors often assume provenance proves the source code at that commit is free of malicious changes."
      - "Seniors often assume SLSA is a tool you install in the pipeline."
      depth_notes: "Không dạy SLSA Build L3 (reusable workflow), source track, định dạng in-toto chi tiết, policy theo từng trường provenance. Chặn khi deploy — devops.l3.verifying-before-deploy."
    - id: devops.l3.verifying-before-deploy
      title:
        vi: "Xác minh ngay trên đường deploy, rồi deploy đúng digest đã xác minh"
        en: "Verify where the deploy happens, then deploy the verified digest"
      main_path: true
      duration_min: 15
      skills: [devops.supply-chain.trust]
      prereqs: [devops.l3.build-provenance, devops.l3.deploying-by-commit, devops.l2.image-tags-and-digests]
      related: [k8s.l1.deploying-an-image-tag, devops.l3.self-heal]
      vocab: []
      example_tag: stage-3
      example_files:
      - scripts/devops/deploy-verified.sh
      - scripts/devops/verify-image.sh
      - deploy/gitops/config-repo/envs/staging/api.yaml
      outline:
      - "A verification protects nothing unless it sits on the path every deploy takes; in the lab that path is the commit that changes the image in `envs/staging`."
      - "`deploy-verified.sh` resolves a `sha-` tag to its digest, verifies the signature and provenance of that digest, and only then commits; for the unsigned `1.0.0` it stops before committing anything."
      - "The commit names the image as `tag@sha256:…`; with a digest present the node pulls by digest, so what runs is what was verified even if the tag is later moved."
      - "Argo CD 3.1 syncs whatever image a manifest names without checking signatures, so anyone who can push to the config repository can still deploy an unsigned image."
      - "Enforcing the rule for every Pod needs a check inside the cluster that rejects unverified images when a Pod is created, which this module does not install."
      - "`deploy-verified.sh` stops when verification cannot complete, such as without network access, instead of deploying unverified; who may bypass it in an emergency must be decided in advance."
      misconceptions:
      - "Seniors often assume that once CI signs every image, an unsigned image can no longer be deployed."
      - "Seniors often assume Argo CD refuses to sync an image whose signature does not verify."
      - "Seniors often assume a tag that was verified yesterday still names the verified image today."
      depth_notes: "Không cài admission controller/policy engine (k8s/security-and-policy), không dạy RBAC của repo cấu hình, ký commit, Argo CD Image Updater. Không dạy lại deploy bằng commit — devops.l3.deploying-by-commit."
