  prereqs: [devops.deploy.reverse-proxy]
- id: devops.docker.fundamentals
  title:
    vi: "Image, container, layer"
    en: "Images, containers, layers"
  prereqs: [devops.deploy.motivation]
- id: devops.docker.storage
