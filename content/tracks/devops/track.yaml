  modules:
  - id: deploy-basics
    title:
      vi: "Deploy là gì, và reverse proxy/TLS"
      en: "What deploy means, and reverse proxy/TLS"
    stage: 1
    summary:
      vi: "Giải thích deploy là gì, đọc được cấu hình Caddy làm reverse proxy có TLS termination thật cho API Đơn Hàng, và vì sao deploy bằng tay không đủ."
      en: "Explain what deploy means, read Caddy's real reverse-proxy-with-TLS-termination config for the Đơn Hàng API, and why deploying by hand isn't enough."
    lessons:
    - id: devops.l1.what-is-deploy
      title:
        vi: "Chạy trên máy mình khác chạy trên máy khác"
        en: "Running on your machine isn't running on another one"
      main_path: true
      duration_min: 12
      skills: [devops.deploy.what-is-deploy]
      prereqs: [foundation.l1.ssh-and-remote, management.l1.how-software-gets-made]
      related: []
      vocab: [deploy]
      example_tag: stage-1
      example_files: []
      outline:
      - "Deploy is getting a specific, tested version of code running somewhere other than the machine that wrote it — reachable by whoever needs to use it."
      - "'It works on my machine' says nothing about deploy: the target machine has its own OS, its own installed runtimes, its own network, none of which match the machine that built the code."
      - "The lab is a small version: `scripts/up.sh` builds the API and runs it apart from the editor, next to Postgres, reachable only through Caddy; a real deploy is the same idea on a machine meant to keep running."
      misconceptions:
      - "Deploy just means copying the built files to another folder; if they run there, deploy succeeded."
      - "A deploy that works once will keep working the same way every time after."
      depth_notes: "Không nói CI/CD pipeline hay môi trường nhiều tầng (staging/prod) — module devops GĐ2. Chỉ khái niệm deploy là gì."
    - id: devops.l1.reverse-proxy-basics
      title:
        vi: "Reverse proxy: client chỉ nói chuyện với Caddy"
        en: "Reverse proxy: the client only ever talks to Caddy"
      main_path: true
      duration_min: 13
      skills: [devops.deploy.reverse-proxy]
      prereqs: [devops.l1.what-is-deploy, backend.l1.what-kestrel-does]
      related: []
      vocab: [reverse-proxy]
      example_tag: stage-1
      example_files: [Caddyfile]
      outline:
      - "A reverse proxy sits in front of the real application, accepts requests from outside, and forwards them on — the client only ever talks to the proxy, never to Kestrel directly."
      - "Caddy answered `/api/v1/*` with fixed fake responses in stage 0; now one `reverse_proxy` line forwards it to Kestrel, while `/admin`, `/conflict` and `/slow` still use `respond`."
      - "A reverse proxy can do the same job for many things behind it — routing, adding headers — without the application itself knowing a proxy is even there."
      misconceptions:
      - "A reverse proxy is just a firewall that blocks bad requests, not something that forwards good ones."
      - "Kestrel could just as easily be reached directly, so the reverse proxy is only there for convenience."
      depth_notes: "Không nói load balancing nhiều instance hay retry logic — module devops GĐ2+. Chỉ vai trò forward request."
    - id: devops.l1.reverse-proxy-and-tls
      title:
        vi: "TLS termination: giải mã một lần, ở Caddy"
        en: "TLS termination: decrypted once, at Caddy"
      main_path: true
      duration_min: 13
      skills: [devops.deploy.reverse-proxy]
      prereqs: [devops.l1.reverse-proxy-basics, foundation.l1.tls-and-https]
      related: []
      vocab: [tls-termination]
      example_tag: stage-1
      example_files: [Caddyfile]
      outline:
      - "TLS termination is decrypting HTTPS traffic at one point — the reverse proxy — instead of every application behind it managing its own certificate."
      - "Caddy holds `donhang.local`'s certificate and speaks HTTPS to the outside world; the connection from Caddy to Kestrel, inside the same lab network, stays plain HTTP — Kestrel never sees a certificate."
      - "Terminating TLS at the proxy means renewing or replacing a certificate touches one place, not every service the proxy forwards to."
      misconceptions:
      - "If TLS is terminated at the proxy, the connection from the proxy to Kestrel is just as encrypted as the original one."
      - "Every application behind a reverse proxy needs its own TLS certificate, or the setup isn't really secure."
      depth_notes: "Không nói mTLS hay network policy giữa proxy và app — module devops GĐ3 (mTLS). Chỉ TLS termination cơ bản."
    - id: devops.l1.why-not-deploy-by-hand
      title:
        vi: "Deploy bằng tay: chạy được lần này, không đảm bảo lần sau"
        en: "Deploying by hand: works this time, no guarantee next time"
      main_path: true
      duration_min: 12
      skills: [devops.deploy.motivation]
      prereqs: [devops.l1.reverse-proxy-and-tls]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: []
      outline:
      - "Deploying by hand — SSH in, stop the old process, copy the new build, start it again — works once, but repeats differently every time a person does it, with no record of exactly what changed."
      - "A manual deploy has no fixed definition of what the target machine needs installed; the next module's Docker image is exactly that definition, made repeatable."
      - "The gap between 'built and tested here' and 'running the same way there' is what the rest of this track — Docker, config, and later CI/CD — closes, one piece at a time."
      misconceptions:
      - "A manual deploy is fine as long as the same person always does it."
      - "Once a deploy script exists, running it by hand is no different from an automated one."
      depth_notes: "Không nói CI/CD thật — module devops GĐ2. Bài này chỉ tạo động lực cho Docker (module ngay sau)."
  - id: docker
    title:
      vi: "Docker: image, layer, volume, network, và Compose"
      en: "Docker: image, layer, volume, network, and Compose"
    stage: 1
    summary:
      vi: "Đọc được docker-compose.yml và Dockerfile thật của Đơn Hàng, viết một Dockerfile multi-stage cho .NET, và thêm service api vào Compose."
      en: "Read Đơn Hàng's real docker-compose.yml and Dockerfile, write a multi-stage .NET Dockerfile, and add the api service to Compose."
    lessons:
    - id: devops.l1.image-vs-container
      title:
        vi: "Image là khuôn, container là bản đang chạy"
        en: "An image is the template, a container is the running copy"
      main_path: true
      duration_min: 12
      skills: [devops.docker.fundamentals]
      prereqs: [devops.l1.why-not-deploy-by-hand, foundation.l1.program-to-process]
      related: []
      vocab: [image, container]
      example_tag: stage-0
      example_files: [lab/Dockerfile]
      outline:
      - "A Docker image is a read-only template — filesystem plus metadata — built once; a container is one running instance of it, the same way a class relates to an object, or a program to a process."
      - "`docker build` produces an image; `docker run` starts a container from it — running the same image twice produces containers that start out identical."
      - "The lab box this course has used since GĐ0 is a container running from the image `lab/Dockerfile` builds; every script's output has been identical across machines because of exactly this."
      misconceptions:
      - "An image and a container are two names for the same thing."
      - "Starting a second container from the same image shares state with the first one, since they came from the same image."
      depth_notes: "Không nói registry hay image tagging chi tiết — bài compose-for-the-api chạm nhẹ. Chỉ phân biệt image/container."
    - id: devops.l1.dockerfile-and-layers
      title:
        vi: "Mỗi bước Dockerfile thay đổi file là một image layer"
        en: "Each Dockerfile step that changes files is one image layer"
      main_path: true
      duration_min: 13
      skills: [devops.docker.fundamentals]
      prereqs: [devops.l1.image-vs-container]
      related: []
      vocab: [image-layer]
      example_tag: stage-0
      example_files: [lab/Dockerfile]
      outline:
      - "`FROM` brings in a base image's layers, and each `RUN` or `COPY` adds one image layer on top; the image is those layers stacked, and Docker caches each one separately."
      - "`lab/Dockerfile` is two instructions: `FROM lscr.io/linuxserver/openssh-server:...` brings the base layers, and `RUN apk add ...` adds one layer with the lab's tools on top."
      - "Rebuilding an image reuses every layer whose instruction and inputs didn't change; only the layers after the first real change need to be rebuilt."
      misconceptions:
      - "Every Dockerfile instruction runs again from scratch on every build, so layers don't actually save any time."
      - "A layer is just a comment describing what a Dockerfile does, with no effect on the built image."
      depth_notes: "Không nói .dockerignore hay thứ tự COPY để tối ưu cache chi tiết — bài dockerfile-for-dotnet sau chạm nhẹ. Chỉ ý tưởng image layer."
    - id: devops.l1.volumes
      title:
        vi: "Volume sống ngoài vòng đời container"
        en: "A volume outlives the container's own lifecycle"
      main_path: true
      duration_min: 13
      skills: [devops.docker.storage]
      prereqs: [devops.l1.dockerfile-and-layers]
      related: []
      vocab: [volume]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "A container's own filesystem disappears when the container is removed; a volume is storage that exists independently of any one container's lifecycle."
      - "`docker-compose.yml`'s `db-data` volume is where Postgres actually keeps `customers`, `products`, `orders`; removing and recreating the `db` container does not lose that data, because the volume isn't part of the container."
      - "A bind mount (the `lab` service's `./:/repo:ro`) also keeps data outside the container, but it is a separate mount type tied to a host path; a named volume (`db-data`) is managed by Docker."
      misconceptions:
      - "Removing a container also deletes any volume it used, the same way removing a variable deletes what it pointed to."
      - "A volume is just a backup Docker makes automatically; nothing needs to be declared for it to exist."
      depth_notes: "Không nói volume driver hay backup/restore thật — module devops GĐ3 (backup/restore). Chỉ ý tưởng: dữ liệu sống ngoài vòng đời container."
    - id: devops.l1.docker-networks
      title:
        vi: "Cùng Docker network thì gọi được nhau bằng tên"
        en: "Same Docker network means you can call each other by name"
      main_path: true
      duration_min: 13
      skills: [devops.docker.networking]
      prereqs: [devops.l1.volumes, foundation.l1.dns]
      related: []
      vocab: [docker-network]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "Containers on the same Docker network can reach each other by service name, resolved the same way the DNS lesson already explained — Docker runs its own DNS for the network."
      - "The `donhang` network in `docker-compose.yml` gives `db` and `lab` fixed IP addresses, so every lesson's networking output is the same on every machine, not just reachable by name."
      - "Two containers on different Docker networks can't reach each other by default, the same way two machines on different physical networks can't without something bridging them."
      misconceptions:
      - "Any two running containers on the same machine can always reach each other, network or not."
      - "A container's IP address inside a Docker network is the same address other programs on the host machine would use to reach it."
      depth_notes: "Không nói CNI hay network policy — track k8s GĐ2+. Chỉ Docker network cơ bản (bridge network mặc định của Compose)."
    - id: devops.l1.dockerfile-for-dotnet
      title:
        vi: "Dockerfile cho DonHang.Api: SDK để build"
        en: "A Dockerfile for DonHang.Api: the SDK to build"
      main_path: true
      duration_min: 14
      skills: [devops.docker.dotnet-image]
      prereqs: [devops.l1.docker-networks, backend.l1.hosting-and-program-cs]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Dockerfile]
      outline:
      - "A Dockerfile for `DonHang.Api` starts from a .NET SDK base image to build, since compiling needs the SDK; running the built app doesn't."
      - "`dotnet publish` inside the image produces the same compiled output it would on a developer's machine — the Dockerfile just runs the exact command a person would."
      - "Copying only `.csproj`/`Directory.Packages.props` files before the rest of the source, then restoring just those, lets that layer be cached across builds where only application code changed."
      misconceptions:
      - "The same base image should run the app in production as compiled it, since that avoids extra steps."
      - "Copying the whole source tree first, then restoring packages, is simpler and just as fast to rebuild."
      depth_notes: "Không nói multi-stage build cụ thể (FROM thứ hai) — bài sau. Chỉ base image SDK và dotnet publish."
    - id: devops.l1.multi-stage-builds
      title:
        vi: "Multi-stage: build bằng SDK, chạy bằng runtime"
        en: "Multi-stage: build with the SDK, run with the runtime"
      main_path: true
      duration_min: 14
      skills: [devops.docker.dotnet-image]
      prereqs: [devops.l1.dockerfile-for-dotnet]
      related: []
      vocab: [multi-stage-build]
      example_tag: stage-1
      example_files: [DonHang.Api/Dockerfile]
      outline:
      - "A multi-stage build has more than one `FROM` in the same Dockerfile; each `FROM` starts a fresh stage, and a later stage can `COPY --from=` an earlier one's output without keeping anything else from it."
      - "`DonHang.Api`'s Dockerfile builds in an SDK-image stage, then copies only the published output into a runtime-image stage — the final image never contains the SDK, the source, or intermediate build files."
      - "A runtime-only final image is smaller and has a smaller attack surface than one carrying the whole SDK, since there's less installed to exploit or to download."
      misconceptions:
      - "Every FROM in a Dockerfile has to produce its own separate image; there's no way to combine stages into one final result."
      - "The SDK image and the runtime image behave identically, so which one the final container runs from doesn't matter."
      depth_notes: "Không nói image scanning hay supply chain security — module devops GĐ3 (supply chain). Chỉ ý tưởng multi-stage giảm kích thước/bề mặt."
    - id: devops.l1.compose-for-the-api
      title:
        vi: "Thêm service api vào docker-compose.yml"
        en: "Adding the api service to docker-compose.yml"
      main_path: true
      duration_min: 14
      skills: [devops.docker.compose]
      prereqs: [devops.l1.multi-stage-builds, devops.l1.docker-networks]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "The `api` service in `docker-compose.yml` reuses shapes the file already has: a `build` like `lab`, the `donhang` network like `db`, and a `depends_on` naming what must run first."
      - "`depends_on` with `db`'s healthcheck means Compose waits for Postgres to report ready, not just for the `db` container to exist, before starting `api` — a container can exist and still not accept connections yet."
      - "The connection string `DonHang.Api` uses to reach Postgres names the service, `db`, not `localhost` — inside the `donhang` network, that's the name that resolves."
      misconceptions:
      - "depends_on guarantees the dependency is fully ready, not just that its container has started."
      - "The API container should connect to the database using the same address a developer's own machine would use outside Docker."
      depth_notes: "Không nói CI/CD build image hay push registry — module devops GĐ2. Chỉ Compose service cho api chạy local."
  - id: config-and-secrets
    title:
      vi: "Config qua biến môi trường, secret, và 12-factor"
      en: "Config through environment variables, secrets, and 12-factor"
    stage: 1
    summary:
      vi: "Tách config khỏi code bằng biến môi trường, phân biệt secret với config thường bằng ví dụ thật của repo, và đặt đúng chỗ cho JWT secret."
      en: "Separate config from code with environment variables, distinguish secrets from ordinary config using the repo's real setup, and put the JWT secret where it belongs."
    lessons:
    - id: devops.l1.config-and-env
      title:
        vi: "Config: khác nhau theo nơi chạy, tách khỏi code"
        en: "Config: varies by where it runs, separate from code"
      main_path: true
      duration_min: 12
      skills: [devops.config.basics]
      prereqs: [foundation.l1.env-and-config, devops.l1.compose-for-the-api]
      related: []
      vocab: [config]
      example_tag: stage-1
      example_files: [docker-compose.yml]
      outline:
      - "Config is everything about how an app behaves that varies by where it runs — a database address, a log level — kept separate from code that doesn't change between environments."
      - "ASP.NET Core reads config from several sources; an environment variable overrides the same key from `appsettings.json` — the mechanism the env-and-config lesson covered, now for app settings."
      - "`docker-compose.yml`'s `environment:` block is how `DonHang.Api`'s container gets its config — the connection string, the database password — without any of it written into the image itself."
      misconceptions:
      - "Config belongs in appsettings.json only; environment variables are just for the operating system, not the app."
      - "The same config values should work unchanged in every environment, or something was set up wrong."
      depth_notes: "Không nói cấu hình phân tầng nhiều môi trường (appsettings.Production.json) chi tiết — module devops GĐ2. Chỉ ý tưởng config tách khỏi code."
    - id: devops.l1.secrets-vs-config
      title:
        vi: "Secret: config không ai ngoài người được phép được đọc"
        en: "Secrets: config nobody unauthorized should read"
      main_path: true
      duration_min: 13
      skills: [devops.config.secrets]
      prereqs: [devops.l1.config-and-env]
      related: []
      vocab: [secret]
      example_tag: stage-1
      example_files: [".gitignore", scripts/dev-secrets.sh]
      outline:
      - "A secret is config that must never be readable by anyone who shouldn't have it — a database password, a signing key — a stricter category than ordinary config like a log level."
      - "`.gitignore` already excludes `.env` and `secrets/`; `scripts/dev-secrets.sh` generates a `.env` with `POSTGRES_PASSWORD` and a key into `secrets/`, so every developer gets working values without any of them being committed."
      - "`docker-compose.yml`'s `${POSTGRES_PASSWORD}` is filled in from that gitignored `.env` automatically — the compose file itself contains no real password, committed or not."
      misconceptions:
      - "A secret that's gitignored locally is safe even if it was committed once, earlier in the repository's history."
      - "Ordinary config and secrets can be treated the same way, since both are just environment variables."
      depth_notes: "Không nói secret manager thật (Vault, SOPS) hay rotate secret — module devops GĐ3 (Secret: Vault, SOPS). Chỉ phân biệt secret khỏi config thường, bằng ví dụ thật của repo."
    - id: devops.l1.the-jwt-secret-in-practice
      title:
        vi: "JWT secret: đóng đúng chỗ đã hoãn"
        en: "The JWT secret: closing the gap left open earlier"
      main_path: true
      duration_min: 13
      skills: [devops.config.secrets]
      prereqs: [devops.l1.secrets-vs-config, backend.l1.issuing-a-jwt]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [scripts/dev-secrets.sh, DonHang.Api/Program.cs]
      outline:
      - "The signing secret `issuing-a-jwt` deferred is exactly a secret in this module's sense: generated into `.env` alongside `POSTGRES_PASSWORD`, and read from config the same way as the connection string."
      - "A JWT signed with a leaked secret would let anyone forge a valid token for any customer — the same reasoning that already kept `POSTGRES_PASSWORD` out of the repository applies here, for a different value."
      - "Once the API restarts with a new JWT secret, every token issued with the old one stops being accepted at once — there's no partial rollout of a signing key change."
      misconceptions:
      - "The JWT secret only matters if the API is publicly reachable; inside a private network it can be anything."
      - "A short, memorable JWT secret is fine, since the signature check is what matters, not the secret's own strength."
      depth_notes: "Không nói key rotation có kế hoạch hay asymmetric signing (RS256, đã hoãn ở issuing-a-jwt) — GĐ2+. Chỉ đóng đúng điểm đã hoãn: secret nằm ở đâu."
    - id: devops.l1.twelve-factor-config
      title:
        vi: "12-factor: nguyên tắc Config, gọi tên điều đã làm"
        en: "12-factor: naming the Config rule already followed"
      main_path: true
      duration_min: 12
      skills: [devops.config.twelve-factor]
      prereqs: [devops.l1.the-jwt-secret-in-practice]
      related: []
      vocab: [twelve-factor]
      example_tag: stage-1
      example_files: []
      outline:
      - "The twelve-factor app is a set of principles for apps that run reliably across many environments; this course has already been following its Config rule without naming it — strict separation of config from code."
      - "Under twelve-factor's Config rule, the same built artifact — the same Docker image — runs in every environment; only the environment variables around it change, never a rebuild for a different database address."
      - "This module covered one factor in depth; the other factors show up piece by piece in later modules, not all at once here."
      misconceptions:
      - "Twelve-factor is a checklist every app must fully satisfy from day one, or it's being built wrong."
      - "Config living in environment variables is the whole of twelve-factor, and the other eleven factors are about something else entirely unrelated."
      depth_notes: "Không liệt kê hay giải thích 11 factor còn lại — chỉ Config, factor duy nhất module này thật sự dạy. Không nói stateless process hay disposability — chạm ở module devops GĐ2+ khi liên quan."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: ci-cd
    title:
      vi: "CI/CD với GitHub Actions: kiểm tra, đóng gói, đưa tới môi trường"
      en: "CI/CD with GitHub Actions: check, package, deliver"
    stage: 2
    summary:
      vi: "Đọc và mở rộng được workflow GitHub Actions của Đơn Hàng: kiểm tra mỗi thay đổi, cache, build image một lần, trao artifact giữa các job, đưa bản xanh tới staging và migrate database thành bước riêng."
      en: "Read and extend Đơn Hàng's GitHub Actions workflow: check every change, cache, build the image once, pass artifacts between jobs, deliver a green build to staging and migrate the database as its own step."
    lessons:
    - id: devops.l2.continuous-integration
      title:
        vi: "Tích hợp liên tục: mỗi lần push được một máy sạch kiểm tra"
        en: "Continuous integration: every push is checked on a clean machine"
      main_path: true
      duration_min: 12
      skills: [devops.ci.continuous-integration]
      prereqs:
      - foundation.l2.git-merge-vs-rebase
      - management.l1.code-review-basics
      - devops.l1.twelve-factor-config
      related: []
      vocab: [continuous-integration]
      example_tag: stage-1
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "Continuous integration means merging small changes into the shared main branch often, with every change built and tested automatically rather than by whoever remembers to."
      - "Đơn Hàng's `.github/workflows/ci.yml` runs on every push and every pull request, so a change is checked on its branch before it is merged, and again after."
      - "CI runs on a fresh machine that has only what the repository declares, so a file that was never committed or a tool installed only on one laptop makes the run fail."
      - "A CI result belongs to one commit: a green run says that commit built and passed its checks, nothing about the commits that come after it."
      misconceptions:
      - "CI is the name of a tool like GitHub Actions; a team that uses GitHub Actions is doing CI by definition."
      - "If I run the tests on my own machine before pushing, a CI run adds nothing."
      depth_notes: "Không nói cú pháp workflow (job, step, runner) — devops.l2.ci-pipeline-anatomy; không nói chặn merge khi đỏ — devops.l2.quality-gate; không nói CD — devops.l2.deployment-environments. Không so sánh trunk-based với feature branch."
    - id: devops.l2.ci-pipeline-anatomy
      title:
        vi: "ci.yml chạy thế nào: đọc một workflow từ trên xuống"
        en: "What happens when ci.yml runs: a workflow read top to bottom"
      main_path: true
      duration_min: 14
      skills: [devops.ci.continuous-integration]
      prereqs: [devops.l2.continuous-integration, foundation.l1.shell-scripts]
      related: []
      vocab: [github-actions, workflow, runner]
      example_tag: stage-1
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "A GitHub Actions workflow is a YAML file in `.github/workflows/`; its `on:` block lists the events that start it, such as `push`, `pull_request` and `workflow_dispatch` (a manual run)."
      - "A workflow holds one or more jobs; each job runs on a runner, a machine started for that job and named by `runs-on` (`ubuntu-24.04` in `ci.yml`), which has no code until `actions/checkout` fetches it."
      - "A job's steps run in order on the same runner: a step with `uses:` runs a published action such as `actions/setup-dotnet@v4`, a step with `run:` runs shell commands."
      - "A step fails when its command exits with a non-zero code; later steps are then skipped unless their `if:` says otherwise, as `if: failure()` and `if: always()` do in `ci.yml`."
      misconceptions:
      - "The runner already has the repository's code, so `actions/checkout` is just a formality."
      - "If one step fails, GitHub still runs the remaining steps and reports how many of them failed."
      - "`uses:` and `run:` are two spellings of the same thing."
      depth_notes: "Chỉ một job như ci.yml stage-1; nhiều job song song và `needs:` — devops.l2.workflow-artifacts. Không nói matrix, reusable workflow, tự viết action, self-hosted runner, cú pháp expression."
    - id: devops.l2.quality-gate
      title:
        vi: "Quality gate: những gì phải xanh trước khi thay đổi đi tiếp"
        en: "A quality gate: what must pass before a change goes further"
      main_path: true
      duration_min: 13
      skills: [devops.ci.quality-gate]
      prereqs:
      - devops.l2.ci-pipeline-anatomy
      - design.l2.test-pyramid
      - design.l2.testcontainers-postgresql
      - management.l1.reading-a-300-line-pr
      related: []
      vocab: [quality-gate]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", DonHang.Tests/DonHang.Tests.csproj]
      outline:
      - "A quality gate is a set of automated checks a change must pass before it may go further; in Đơn Hàng they are the build with `--warnaserror`, `dotnet test`, `flutter analyze` and `flutter test`."
      - "At stage-2, `dotnet test` in CI also runs the integration tests: Testcontainers starts PostgreSQL and Redis on the Docker engine the GitHub-hosted Ubuntu runner already has, without the lab."
      - "A workflow only reports pass or fail on a commit; refusing to merge a pull request while a check is red is a repository setting on GitHub (required status checks), not something `ci.yml` does."
      - "A green gate proves only what its checks check: at stage-1 the suite passed while cancelling a `shipped` order was still allowed, because no test covered that case."
      misconceptions:
      - "A green CI run means the change has no bugs."
      - "Putting `dotnet test` in the workflow is enough to stop a failing pull request from being merged."
      - "Integration tests can't run in CI because they need Docker, so CI should run only unit tests."
      depth_notes: "Không nói code coverage, lint/format, quét bảo mật hay quét image — ngoài GĐ2 (quét image: devops/supply-chain GĐ3). Không hướng dẫn bật required status check trong settings. Không nói tách job — devops.l2.workflow-artifacts."
    - id: devops.l2.dependency-cache
      title:
        vi: "Cache gói NuGet giữa các lần chạy bằng cache key"
        en: "Caching NuGet packages between runs with a cache key"
      main_path: true
      duration_min: 13
      skills: [devops.ci.cache-and-artifacts]
      prereqs: [devops.l2.quality-gate, devops.l1.dockerfile-for-dotnet, foundation.l1.http-caching]
      related: []
      vocab: [cache-key]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", Directory.Packages.props]
      outline:
      - "Every job starts on a fresh runner, so without a cache `dotnet restore` downloads every NuGet package again on every run."
      - "`actions/cache` restores a saved folder when a copy exists under the step's cache key, and when no copy matched that key exactly it saves the folder under it after the job succeeds."
      - "Đơn Hàng keys the NuGet package folder on a hash of `Directory.Packages.props` and every `.csproj` file, so the key changes whenever the declared packages change, and also on any other edit to those files."
      - "When no key matches exactly, `restore-keys` restores the most recent cache whose key starts with a given prefix; `dotnet restore` then downloads only the packages still missing."
      - "A cache only saves time: the job must pass the same way when nothing is restored, because a cache can be missing or removed by GitHub."
      misconceptions:
      - "A cache hit means the build step itself is skipped."
      - "The cache key should never change, so that the cache is always hit."
      depth_notes: "Không nói cache layer Docker trong CI hay cache của Flutter/pub. Không nêu giới hạn dung lượng hay thời hạn giữ cache. Khác biệt cache với artifact — devops.l2.workflow-artifacts."
    - id: devops.l2.building-images-in-ci
      title:
        vi: "Build image của API trong CI, mỗi lần chạy một lần"
        en: "Building the API image in CI, once per run"
      main_path: true
      duration_min: 13
      skills: [devops.cd.delivery]
      prereqs: [devops.l2.quality-gate, devops.l1.multi-stage-builds, devops.l1.twelve-factor-config]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", DonHang.Api/Dockerfile, docker-compose.yml]
      outline:
      - "At stage-2 CI builds `DonHang.Api`'s image from the same `DonHang.Api/Dockerfile` the lab uses, so a change that breaks the image fails the pipeline instead of the next deploy."
      - "For delivery the image is built once per workflow run, in the `image` job, and tagged with the name `docker-compose.yml` gives the `api` service; `staging` and `publish` run that image instead of building again."
      - "Running the image that was built and checked, instead of rebuilding for each environment, is the twelve-factor idea of one build running everywhere with only config changing."
      - "An image built on a runner disappears with that runner: another job needs it handed over as a file, and machines outside the run need it published to a server that stores images."
      misconceptions:
      - "CI only needs to compile and test the code; the Dockerfile gets checked when someone deploys."
      - "Each environment can build its own image from the same commit, and the result is the same image anyway."
      depth_notes: "Không nói registry, push image hay cách đặt tag theo phiên bản — devops/release. Không nói cache layer Docker trong CI, build nhiều kiến trúc, ký hay quét image — devops/supply-chain GĐ3."
    - id: devops.l2.workflow-artifacts
      title:
        vi: "Artifact: job này trao file cho job sau thế nào"
        en: "Artifacts: how one job hands a file to the next"
      main_path: true
      duration_min: 13
      skills: [devops.ci.cache-and-artifacts]
      prereqs: [devops.l2.building-images-in-ci, devops.l2.dependency-cache]
      related: []
      vocab: [artifact]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "Jobs in one workflow run start at the same time on separate runners unless `needs:` makes one wait for another, and they share no files."
      - "An artifact is a set of files a job uploads with `actions/upload-artifact`; a later job in the same run downloads it with `actions/download-artifact`, and it stays attached to the run afterwards."
      - "At stage-2 the image job writes the images it built to a file with `docker save` and uploads it; the `staging` job, which `needs:` the image job, downloads it and runs `docker load`."
      - "A cache reuses files that rarely change across many runs to save time; an artifact keeps a specific output of one run, so a job that needs an artifact cannot go on without it."
      misconceptions:
      - "A job that `needs:` another runs on the same machine, so it can read the files the first job wrote."
      - "Cache and artifact are two names for stored files, so either one can pass a build between jobs."
      depth_notes: "Không nêu thời hạn giữ artifact hay giới hạn dung lượng. Không nói push image lên registry — devops/release. Không nói matrix hay job outputs."
    - id: devops.l2.deployment-environments
      title:
        vi: "Continuous delivery: bản xanh tới staging qua một cổng"
        en: "Continuous delivery: a green build reaches staging through a gate"
      main_path: true
      duration_min: 14
      skills: [devops.cd.delivery]
      prereqs: [devops.l2.workflow-artifacts, devops.l1.secrets-vs-config, devops.l1.compose-for-the-api]
      related: []
      vocab: [continuous-delivery, continuous-deployment, deployment-environment]
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml", docker-compose.yml]
      outline:
      - "Continuous delivery keeps every change that passes CI ready to deploy through automated steps; continuous deployment also deploys every such change to production with no person deciding."
      - "A job names a deployment environment with `environment:`; Đơn Hàng's stage-2 `staging` job does, runs only for pushes to `master`, and waits through `needs:` for the test and image jobs."
      - "Protection rules set on an environment in the repository settings, such as required reviewers, must pass before a job that references it starts; a required approval is what keeps delivery from being deployment."
      - "Secrets stored on an environment are given only to jobs that reference that environment; a job without `environment:` cannot read them."
      - "Đơn Hàng's `staging` is a throwaway copy of Đơn Hàng's services that the job starts on its own runner from the image artifact and checks with a request; running it on a cluster comes later."
      misconceptions:
      - "Continuous delivery and continuous deployment are the same thing: both mean every commit goes straight to production."
      - "An environment in GitHub Actions is a server that GitHub creates and keeps running."
      - "A staging environment has to be a permanent server, or it doesn't count as deploying."
      depth_notes: "Không deploy lên cluster — track k8s GĐ2. Không nói blue-green, canary, rollback tự động — devops GĐ4. Không nói registry hay tag phát hành — devops/release. Không cấu hình protection rule cụ thể cho repo Đơn Hàng."
    - id: devops.l2.migrations-in-the-pipeline
      title:
        vi: "Migrate database thành bước riêng, trước khi API chạy"
        en: "Migrating the database as its own step, before the API starts"
      main_path: true
      duration_min: 15
      skills: [devops.cd.db-migrations]
      prereqs: [devops.l2.deployment-environments, backend.l1.migrations, devops.l1.compose-for-the-api]
      related: []
      vocab: [migration-bundle]
      example_tag: stage-2
      example_files: [DonHang.Api/Dockerfile, docker-compose.yml, DonHang.Api/Program.cs, ".github/workflows/ci.yml"]
      outline:
      - "At stage-1, `Program.cs` applies pending migrations each time `DonHang.Api` starts; EF Core's documentation advises against that for production databases: every copy needs rights to change the schema, and the generated SQL runs unreviewed."
      - "A migration bundle is a single executable built by `dotnet ef migrations bundle`; run against a database, it applies the migrations that database has not recorded as applied yet."
      - "At stage-2 a `migrate` service runs the bundle and exits, `api` starts only after it exits successfully (`service_completed_successfully`), and `Program.cs` no longer migrates."
      - "The lab and the `staging` job start the same services, so a migration that fails stops the job before any `api` container runs on that database."
      misconceptions:
      - "Migrating at startup is safe everywhere, since EF Core skips migrations that are already applied."
      - "The pipeline should run `dotnet ef database update` on the deploy machine, from a copy of the source code."
      - "If a migration fails, the new API version still starts and simply keeps using the old schema."
      depth_notes: "Không nói migration không downtime (expand/contract, CREATE INDEX CONCURRENTLY) — GĐ4; không nói rollback migration hay script SQL idempotent; chạy migrate trong cluster (Job) — track k8s."
  - id: release
    title:
      vi: "Registry, phiên bản và phát hành"
      en: "Registry, versions and releases"
    stage: 2
    summary:
      vi: "Đưa image của Đơn Hàng lên registry với tag chỉ rõ commit và phiên bản, đặt số phiên bản theo semantic versioning, viết changelog, và phát hành từ một git tag mà không build lại."
      en: "Publish Đơn Hàng's images to a registry under tags that name their commit and version, number versions with semantic versioning, keep a changelog, and cut a release from a git tag without rebuilding."
    lessons:
    - id: devops.l2.container-registry
      title:
        vi: "Container registry: nơi máy khác lấy image của bạn"
        en: "A container registry: where other machines get your images"
      main_path: true
      duration_min: 12
      skills: [devops.release.registry]
      prereqs: [devops.l2.building-images-in-ci, devops.l1.image-vs-container]
      related: []
      vocab: [container-registry]
      example_tag: stage-1
      example_files: [docker-compose.yml, DonHang.Api/Dockerfile, lab/Dockerfile]
      outline:
      - "A container registry is a server that stores images by name and tag; `docker pull` downloads an image from a registry and `docker push` uploads one to it."
      - "When the first part of an image name is a host name, such as `mcr.microsoft.com` or `lscr.io`, that part names the registry; a name without one, such as `caddy:2.10.0`, comes from Docker Hub."
      - "`donhang-api:stage-1` exists only on the machine that built it: Compose builds it from `DonHang.Api/Dockerfile`, and no registry holds a copy."
      - "A machine outside the workflow run, such as a server, can run an image it did not build only if the image is pushed to a registry that machine can reach."
      misconceptions:
      - "`docker run` always downloads the image from the internet before starting it."
      - "An image I build with `docker build` is uploaded to Docker Hub automatically."
      - "A registry is where Docker keeps the containers it is running."
      depth_notes: "Không nói tự dựng registry, mirror, quyền kéo image riêng tư (pull secret — track k8s), quét/ký image (devops/supply-chain GĐ3). Tag và digest — devops.l2.image-tags-and-digests; push từ CI — devops.l2.pushing-images-from-ci."
    - id: devops.l2.image-tags-and-digests
      title:
        vi: "Tag có thể dời đi, digest thì không"
        en: "A tag can move, a digest cannot: naming the exact image"
      main_path: true
      duration_min: 13
      skills: [devops.release.registry]
      prereqs: [devops.l2.container-registry, devops.l1.dockerfile-for-dotnet]
      related: []
      vocab: [image-digest]
      example_tag: stage-1
      example_files: [DonHang.Api/Dockerfile, docker-compose.yml]
      outline:
      - "An image tag is a label that points at one image in a registry, and whoever can push to that name can later point the same tag at a different image by pushing again."
      - "`latest` is only the tag Docker uses when a name gives none; it does not mean newest, and it points at whatever image was last pushed under it."
      - "`mcr.microsoft.com/dotnet/sdk:10.0` in `DonHang.Api/Dockerfile` names a release line that moves to each new 10.0 SDK release and each rebuild of its image, so two builds months apart can start from different SDK images."
      - "An image digest, `sha256:` followed by a hash of the image's content, identifies exactly one image; pulling by digest returns that image whatever later happens to its tags."
      misconceptions:
      - "`latest` always gives me the newest version of an image."
      - "Once an image is published under a version tag such as `2.10.0`, that tag gives the same image forever."
      - "Two images with the same name and tag on two machines must be identical."
      depth_notes: "Không nói image nhiều kiến trúc (manifest list), ký hay xác minh image (devops/supply-chain GĐ3); repo Đơn Hàng không ghim image bằng digest — chỉ giải thích. Quy ước tag của Đơn Hàng — devops.l2.tagging-images-by-commit."
    - id: devops.l2.pushing-images-from-ci
      title:
        vi: "Đẩy image API lên GitHub Container Registry từ CI"
        en: "Pushing the API image to GitHub Container Registry from CI"
      main_path: true
      duration_min: 14
      skills: [devops.release.registry]
      prereqs:
      - devops.l2.image-tags-and-digests
      - devops.l2.deployment-environments
      - devops.l1.secrets-vs-config
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "GitHub Container Registry serves images under `ghcr.io/<owner>/<name>`; from stage-2 Đơn Hàng publishes `ghcr.io/duyan11110/donhang-api` and `ghcr.io/duyan11110/donhang-migrate` there."
      - "A job logs in to `ghcr.io` with the `GITHUB_TOKEN` that GitHub creates for each workflow run, and the workflow must grant it `packages: write` under `permissions:` before a push is allowed."
      - "At stage-2 the `publish` job runs only for pushes to `master`, `needs:` the test and image jobs, loads the image artifact and pushes it, so the registry receives only images that passed the quality gate."
      - "`docker tag` gives an image that already exists a second name, with the registry host and owner in front; it builds nothing, so the pushed image is the one the tests ran against."
      misconceptions:
      - "To push to GitHub's registry, CI needs my personal GitHub password or token stored as a secret."
      - "Pushing an image from every pull request is harmless, since images in a registry are only stored, not run."
      - "`docker tag` makes a copy of the image, so the pushed image may differ from the one that was tested."
      depth_notes: "Không nói quyền xem package (public/private) hay cài đặt package trên GitHub; không nói Docker Hub hay registry tự dựng; không nói cluster kéo image (track k8s). Tên tag Đơn Hàng dùng — devops.l2.tagging-images-by-commit."
    - id: devops.l2.tagging-images-by-commit
      title:
        vi: "Gắn tag image bằng commit đã build ra nó"
        en: "Tagging each image with the commit it was built from"
      main_path: true
      duration_min: 12
      skills: [devops.release.registry]
      prereqs: [devops.l2.pushing-images-from-ci, foundation.l2.git-mental-model]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [".github/workflows/ci.yml"]
      outline:
      - "Đơn Hàng tags every image it pushes as `sha-` followed by the full id of the commit that was pushed, so any running image leads back to the exact code that built it."
      - "Each push to `master` is built and pushed once, tagged with its last commit, so a `sha-` tag is in practice never reused for different content; this is Đơn Hàng's convention, since the registry would accept a second push under the same tag."
      - "Đơn Hàng never pushes or deploys `latest`: a deployment names a tag that says which commit runs, and going back means naming the tag that ran before."
      - "A commit id says which code runs but not whether it is newer or older than another; people and clients need a version number for that."
      misconceptions:
      - "Tagging the image with the branch name, like `master`, tells you which code is running."
      - "`latest` is the safest tag to deploy, because it is always up to date."
      depth_notes: "Không nói dọn image cũ trong registry (retention), không ghim digest trong cấu hình deploy (track k8s). Số phiên bản — devops.l2.semantic-versioning."
    - id: devops.l2.semantic-versioning
      title:
        vi: "Semantic versioning: MAJOR.MINOR.PATCH hứa hẹn điều gì"
        en: "Semantic versioning: what MAJOR.MINOR.PATCH promises"
      main_path: true
      duration_min: 13
      skills: [devops.release.versioning]
      prereqs: [devops.l2.tagging-images-by-commit, backend.l2.api-versioning]
      related: []
      vocab: [semantic-versioning]
      example_tag: stage-1
      example_files: []
      outline:
      - "Under semantic versioning 2.0.0 a version is MAJOR.MINOR.PATCH: PATCH goes up for backward-compatible bug fixes, MINOR for backward-compatible additions, MAJOR for any breaking change to the public API."
      - "Raising MINOR resets PATCH to 0 and raising MAJOR resets both, so after 1.4.2 comes 1.4.3, 1.5.0 or 2.0.0, and 1.10.0 is newer than 1.9.0."
      - "The numbers mean something only against a declared public API; for a web API such as Đơn Hàng's, that is the requests and responses its clients rely on."
      - "Versions 0.y.z are for initial development, when anything may change at any time; 1.0.0 is the version that defines the public API."
      - "The `v1` in `/api/v1` versions the URL contract, not the product: many product releases can ship under `/api/v1`; adding `/api/v2` beside it is a MINOR, and retiring `/api/v1` is a MAJOR."
      misconceptions:
      - "After 1.9.0 the next minor version is 2.0.0, and 1.10.0 would be older than 1.9.0."
      - "A MAJOR version bump means the release has big new features."
      - "The `v1` in `/api/v1` and the product's version must always change together."
      depth_notes: "Không nói pre-release/build metadata (-rc.1, +…) chi tiết, dải phiên bản của NuGet/pub, tự tăng version từ commit message (Conventional Commits) — ngoài GĐ2. Số phiên bản của chính Đơn Hàng — devops.l2.changelog."
    - id: devops.l2.changelog
      title:
        vi: "Changelog: mỗi phiên bản đổi gì, viết cho người dùng nó"
        en: "A changelog: what changed in each version, for the people using it"
      main_path: true
      duration_min: 12
      skills: [devops.release.versioning]
      prereqs: [devops.l2.semantic-versioning, foundation.l2.good-commits]
      related: []
      vocab: [changelog]
      example_tag: stage-2
      example_files: [CHANGELOG.md]
      outline:
      - "A changelog is a file, `CHANGELOG.md` in Đơn Hàng, that lists for each released version, newest first, the changes that matter to the people who use it."
      - "Đơn Hàng follows the Keep a Changelog format: each version groups entries under headings such as Added, Changed, Removed and Fixed, below an Unreleased section at the top."
      - "Each pull request that changes behaviour adds its line under Unreleased, so a release turns that section into a version instead of rebuilding months of work from memory."
      - "Đơn Hàng's `1.0.0` entry lists `POST /api/v1/auth/login` under Removed, telling a client what it must change before it upgrades from `0.1.0`."
      - "A changelog is not the commit log: commit messages explain each change to developers, while a changelog entry sums up what a user of the version notices."
      misconceptions:
      - "The changelog is just `git log` pasted into a file at release time."
      - "Only new features belong in a changelog; fixes and removals are too small to mention."
      depth_notes: "Không sinh changelog tự động từ commit (Conventional Commits, công cụ release) — chỉ nhắc là có. Đưa phần changelog vào ghi chú phát hành — devops.l2.cutting-a-release."
    - id: devops.l2.cutting-a-release
      title:
        vi: "Phát hành: git tag nâng image đã qua kiểm tra thành phiên bản"
        en: "Cutting a release: a git tag promotes an image that already passed"
      main_path: true
      duration_min: 15
      skills: [devops.release.publishing]
      prereqs: [devops.l2.changelog, devops.l2.tagging-images-by-commit]
      related: []
      vocab: [git-tag]
      example_tag: stage-2
      example_files: [".github/workflows/release.yml", scripts/release-notes.sh, CHANGELOG.md]
      outline:
      - "A git tag is a name fixed to one commit; `git tag -a v1.0.0` creates an annotated tag with its own message, and `git push` sends a tag only when asked, as in `git push origin v1.0.0`."
      - "Đơn Hàng's `release.yml` runs when a tag matching `v*.*.*` is pushed; it pulls the `sha-` images of the tagged commit, adds the tag `1.0.0` to them and pushes, without building."
      - "Because the release reuses images CI already tested, the job fails when the tagged commit was never pushed to `master` and so has no `sha-` image."
      - "The job copies that version's section of `CHANGELOG.md`, extracted by `scripts/release-notes.sh`, into a GitHub release attached to the tag."
      - "Đơn Hàng's `stage-0`, `stage-1` and `stage-2` tags mark states of the course, while `v0.1.0` and `v1.0.0` mark product versions; one commit can carry both kinds."
      misconceptions:
      - "`git push` uploads my tags together with my commits."
      - "A release should rebuild the image from the tagged commit so that it is fresh."
      - "A git tag and an image tag are the same thing, so creating one creates the other."
      depth_notes: "Không nói nhánh release/hotfix, backport, ký tag, tự tăng version, blue-green/canary (devops GĐ4). Deploy một phiên bản lên cluster — track k8s GĐ2."
  - id: monitoring-basics
    title:
      vi: "Monitoring cơ bản: metric, dashboard và log tập trung"
      en: "Monitoring basics: metrics, dashboards and centralized logs"
    stage: 2
    summary:
      vi: "Cho API Đơn Hàng xuất metric, để Prometheus thu về, đọc tốc độ request, lỗi và thời gian phản hồi bằng PromQL trên dashboard Grafana, và tìm log JSON của mọi container ở một chỗ bằng Loki."
      en: "Make the Đơn Hàng API expose metrics, have Prometheus collect them, read request rate, errors and response time with PromQL on a Grafana dashboard, and search every container's JSON logs in one place with Loki."
    lessons:
    - id: devops.l2.why-monitoring
      title:
        vi: "Monitoring: biết API đang hỏng trước khi người dùng báo"
        en: "Monitoring: learning the API is failing before a user tells you"
      main_path: true
      duration_min: 12
      skills: [devops.monitoring.metrics]
      prereqs: [backend.l1.structured-logging, devops.l1.compose-for-the-api]
      related: []
      vocab: [monitoring, metric]
      example_tag: stage-1
      example_files: [DonHang.Api/Middleware/RequestLoggingMiddleware.cs, docker-compose.yml]
      outline:
      - "Monitoring means collecting signals from a running system all the time, so that a problem becomes visible without a user having to report it."
      - "At stage-1 the only signal Đơn Hàng's API gives is the line `RequestLoggingMiddleware` writes for each request to the container's output, read with `docker compose logs api`."
      - "A log line records one event with its details; a metric is one number measured again and again over time, such as how many requests ended with a `5xx` status."
      - "Answering how many requests failed in the last five minutes from logs means finding and counting lines, while a metric already holds that count."
      - "A metric's size depends on how many different things are counted, not on how much traffic arrives, while logs grow with every request."
      misconceptions:
      - "If the logs show no errors, the API is working fine."
      - "Metrics and logs are the same data; a metric is just a log drawn as a chart."
      - "Monitoring means somebody watches a screen all day."
      depth_notes: "Không nói trace, OpenTelemetry, khái niệm observability (backend/observability GĐ3); không nói alert, SLO (GĐ4). Cách API xuất metric — devops.l2.metrics-endpoint; log JSON — devops.l2.json-logs."
    - id: devops.l2.metrics-endpoint
      title:
        vi: "API bày số liệu của mình dạng văn bản ở /metrics"
        en: "The API publishes its numbers as text at /metrics"
      main_path: true
      duration_min: 13
      skills: [devops.monitoring.metrics]
      prereqs: [devops.l2.why-monitoring, backend.l1.middleware-pipeline]
      related: []
      vocab: [prometheus, metric-label]
      example_tag: stage-2
      example_files: [DonHang.Api/Program.cs, Directory.Packages.props, scripts/devops/metrics-endpoint.sh]
      outline:
      - "Prometheus is a monitoring system that reads metrics over HTTP in a plain-text format; from stage-2 `DonHang.Api` uses the prometheus-net library to publish its metrics in that format."
      - "`app.UseHttpMetrics()` measures every request that passes through the pipeline, and `app.MapMetrics()` answers `GET /metrics` with the current value of every metric."
      - "The API sends its metrics nowhere on its own: `/metrics` only reports the values at the moment it is asked, and another program has to ask."
      - "Each line of `/metrics` holds a metric name, labels in braces and a number; `http_requests_received_total` has one line per combination of label values such as `code` and `method`."
      - "Caddy forwards only the API's own paths, such as `/api/v1/*`, to the API, so `/metrics` is reachable from inside the Docker network, for example from the lab box at `api:8080`, but not through Caddy."
      misconceptions:
      - "The API pushes its metrics to a monitoring server every few seconds."
      - "`/metrics` returns the history of each value, like a small database."
      - "Counting `GET` and `POST` requests separately needs two differently named metrics."
      depth_notes: "Không nói OpenTelemetry hay Meter API của .NET (backend/observability GĐ3), không nói bảo vệ /metrics bằng xác thực. Loại metric và metric tự định nghĩa — devops.l2.counters-and-rate; Prometheus server — devops.l2.prometheus-scraping."
    - id: devops.l2.prometheus-scraping
      title:
        vi: "Prometheus tự đi lấy: scrape /metrics theo nhịp"
        en: "Prometheus pulls: scraping /metrics on a schedule"
      main_path: true
      duration_min: 14
      skills: [devops.monitoring.metrics]
      prereqs: [devops.l2.metrics-endpoint, devops.l1.docker-networks]
      related: []
      vocab: [scrape, time-series, compose-profile]
      example_tag: stage-2
      example_files: [docker-compose.yml, deploy/monitoring/prometheus.yml, scripts/devops/prometheus-targets.sh]
      outline:
      - "The Prometheus server scrapes: every `scrape_interval` it sends `GET /metrics` to each target in its configuration and stores the numbers it gets back with the time of the scrape."
      - "Đơn Hàng's `deploy/monitoring/prometheus.yml` has one scrape job, `api`, whose target is `api:8080`, the API's name and port on the `donhang` network."
      - "For every target Prometheus records a metric named `up`, which is `1` when the last scrape succeeded and `0` when it failed, so a stopped API shows up as `0`."
      - "Each distinct combination of metric name and label values is its own time series, so a label with unbounded values, such as an order id, adds a new series for every order."
      - "The monitoring services in `docker-compose.yml` carry `profiles: [monitoring]`, so they start only when the profile is named, as in `docker compose --profile monitoring up -d`."
      misconceptions:
      - "Prometheus reads the API's log output to build its numbers."
      - "If the API stops, its metrics just stop changing and Prometheus cannot tell that anything is wrong."
      - "Adding a label is free, so putting the customer id on a metric is a good way to get per-customer numbers."
      depth_notes: "Không nói service discovery, federation, remote write, retention, lưu trữ dài hạn; không nói Prometheus trong cluster (k8s GĐ3). Truy vấn PromQL — devops.l2.counters-and-rate."
    - id: devops.l2.counters-and-rate
      title:
        vi: "Counter chỉ tăng: đọc nó thành tốc độ bằng PromQL"
        en: "A counter only goes up: read it as a rate with PromQL"
      main_path: true
      duration_min: 14
      skills: [devops.monitoring.metrics, devops.monitoring.dashboards]
      prereqs: [devops.l2.prometheus-scraping]
      related: []
      vocab: [counter, gauge, promql]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Monitoring/OrderMetrics.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - scripts/devops/promql-rate.sh
      outline:
      - "A counter is a metric that only increases, such as `http_requests_received_total`, and starts again from zero when the process restarts; a gauge, such as `http_requests_in_progress`, can go up and down."
      - "Đơn Hàng adds its own counter, `donhang_orders_placed_total`, which `OrdersController` increases each time a new order is created, next to the metrics prometheus-net provides."
      - "PromQL is Prometheus's query language: `http_requests_received_total{code=~\"5..\"}` selects the series of that metric whose `code` label matches the pattern."
      - "`rate(http_requests_received_total[5m])` gives the average increase per second over the last five minutes, and treats a drop to zero as a restart, not as a negative change."
      - "`sum by (code) (...)` adds the per-series rates into one result per status code, which answers how many requests per second end in each status."
      misconceptions:
      - "The current value of `http_requests_received_total` tells me how busy the API is right now."
      - "After the API restarts, the chart of a counter shows a huge negative dip in traffic."
      - "A counter and a gauge are the same kind of number; only the naming convention differs."
      depth_notes: "Không nói increase, irate, recording rule, alert rule (alert — GĐ4); không nói summary. Histogram và thời gian phản hồi — devops.l2.histograms-and-percentiles."
    - id: devops.l2.histograms-and-percentiles
      title:
        vi: "Vì sao thời gian phản hồi trung bình che mất request chậm"
        en: "Why the average response time hides the slow requests"
      main_path: true
      duration_min: 14
      skills: [devops.monitoring.metrics, devops.monitoring.dashboards]
      prereqs: [devops.l2.counters-and-rate]
      related: []
      vocab: [histogram, percentile]
      example_tag: stage-2
      example_files: [scripts/devops/promql-latency.sh]
      outline:
      - "An average response time can stay low while a small share of requests is very slow, because the many fast requests pull the average down."
      - "The 95th percentile, p95, is the time that 95% of requests stayed under; it shows how slow the slower requests are, which the average cannot."
      - "A histogram counts observations into buckets by upper bound: each `http_request_duration_seconds_bucket` line counts requests that took at most its `le` value, so each bucket includes all smaller ones."
      - "`histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))` estimates p95 from the buckets, so its precision depends on where the bucket bounds are."
      - "A histogram also has `_sum` and `_count` series, so the average can be computed from the same metric and compared with the percentile."
      misconceptions:
      - "If the average response time is 50 ms, almost every user waits about 50 ms."
      - "A p95 of 200 ms means 5% of the requests failed."
      - "Prometheus keeps the duration of every single request, so the percentile it returns is exact."
      depth_notes: "Không nói summary, native histogram, cách chọn bucket; không đặt mục tiêu thời gian phản hồi/SLO (backend/capacity-and-slo GĐ4). Vẽ lên dashboard — devops.l2.grafana-dashboards."
    - id: devops.l2.grafana-dashboards
      title:
        vi: "Dashboard Grafana: các truy vấn đã lưu, vẽ thành panel"
        en: "A Grafana dashboard is saved queries drawn as panels"
      main_path: true
      duration_min: 13
      skills: [devops.monitoring.dashboards]
      prereqs: [devops.l2.histograms-and-percentiles]
      related: []
      vocab: [grafana, dashboard]
      example_tag: stage-2
      example_files:
      - deploy/monitoring/grafana/provisioning/datasources/datasources.yml
      - deploy/monitoring/grafana/provisioning/dashboards/dashboards.yml
      - deploy/monitoring/grafana/dashboards/donhang-api.json
      - docker-compose.yml
      outline:
      - "Grafana stores no metrics of its own: each panel sends a query to a data source, here Prometheus, and draws the result."
      - "Đơn Hàng's dashboard `donhang-api.json` has panels for requests per second by status code, `5xx` responses per second, p95 response time and orders placed, each one PromQL query."
      - "Grafana loads its data sources and the dashboard from provisioning files under `deploy/monitoring/grafana/` when it starts, so every fresh lab gets the same dashboard without clicking."
      - "Because the dashboard is a JSON file in the repository, changing it goes through a commit and a review like code, instead of living only inside one Grafana."
      - "When you start monitoring an API, request rate, error rate and response time are a common first set of panels, because together they show whether it is used, failing or slow."
      misconceptions:
      - "Grafana collects the metrics, and Prometheus is only where they get stored."
      - "A dashboard can only be built by clicking in the web page, so it cannot be kept in Git."
      - "The more panels a dashboard has, the better it shows what is wrong."
      depth_notes: "Không nói alert của Grafana, biến dashboard, người dùng và quyền Grafana, SLO (GĐ4). Log trong Grafana — devops.l2.centralized-logs."
    - id: devops.l2.json-logs
      title:
        vi: "Ghi log dạng JSON để công cụ đọc được từng field"
        en: "Writing logs as JSON so a tool can read every field"
      main_path: true
      duration_min: 13
      skills: [devops.monitoring.logs]
      prereqs: [backend.l1.structured-logging, devops.l1.config-and-env, devops.l2.why-monitoring]
      related: []
      vocab: [log-level]
      example_tag: stage-2
      example_files:
      - docker-compose.yml
      - DonHang.Api/appsettings.json
      - DonHang.Api/Middleware/RequestLoggingMiddleware.cs
      - scripts/devops/json-logs.sh
      outline:
      - "At stage-2 the `api` service in `docker-compose.yml` sets `Logging__Console__FormatterName` to `json`, so the console logger writes each log event as one JSON object per line."
      - "In that JSON line the template's fields, such as `Method`, `StatusCode` and `ElapsedMs` from `RequestLoggingMiddleware`, keep their own names inside the `State` object."
      - "Every log event has a log level, from `Trace` and `Debug` through `Information` and `Warning` to `Error` and `Critical`, and the JSON line carries it as `LogLevel`."
      - "`Logging:LogLevel` in `appsettings.json` sets the lowest level written for each category, which is why `Microsoft.AspNetCore` writes only `Warning` and above while the API's own `Information` lines appear."
      - "The output format is chosen by configuration, not by code: the log calls did not change, and without that variable the same build prints the usual readable lines."
      misconceptions:
      - "Switching to JSON logs means rewriting every log call in the code."
      - "Setting `Microsoft.AspNetCore` to `Warning` hides its errors too."
      - "A log level is only a label for people; it does not change what gets written."
      depth_notes: "Không nói log scope, trace id trong log (backend/observability GĐ3), Serilog hay provider khác; không bàn chọn level cho từng câu log. Gom log mọi container về một chỗ — devops.l2.centralized-logs."
    - id: devops.l2.centralized-logs
      title:
        vi: "Loki: log của mọi container, tìm ở một chỗ"
        en: "Loki: every container's logs searchable in one place"
      main_path: true
      duration_min: 15
      skills: [devops.monitoring.logs]
      prereqs: [devops.l2.json-logs, devops.l2.grafana-dashboards]
      related: []
      vocab: [log-aggregation, loki, logql]
      example_tag: stage-2
      example_files:
      - deploy/monitoring/alloy/config.alloy
      - docker-compose.yml
      - deploy/monitoring/grafana/provisioning/datasources/datasources.yml
      - scripts/devops/loki-query.sh
      outline:
      - "Log aggregation collects the logs of every service into one store, so you search one place instead of each container, and the logs outlive a removed container."
      - "In Đơn Hàng, Grafana Alloy reads the output of the Compose containers through the Docker socket and sends each line to Loki, labelled with its Compose service, such as `service=\"api\"`."
      - "Loki indexes only the labels of each log stream, not the text of its lines, so a LogQL query first picks streams by label, as in `{service=\"api\"}`, then filters their lines."
      - "In LogQL, `| json` turns the fields of each JSON line into labels for that query, so it can keep only the lines whose status code field is `500` or more."
      - "Loki has no page of its own in Đơn Hàng: you query it from Grafana, where it is a second data source next to Prometheus."
      misconceptions:
      - "Loki indexes every word of every line, so any text search is as fast as a lookup by label."
      - "To find one order's logs quickly, I should put the order id in a Loki label."
      - "`docker compose logs` already keeps every container's logs for good, so a log store adds nothing."
      depth_notes: "Không nói retention, object storage, Loki nhiều instance, collector khác, log trong cluster (k8s GĐ3), nối log với trace (backend/observability GĐ3); không nói alert từ log (GĐ4)."
