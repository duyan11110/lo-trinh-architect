repo_changes_needed:
  - lesson: devops.l4.recording-rules
    need: "File rule Prometheus thuần (không bọc ConfigMap, để promtool đọc trực tiếp) cho staging: recording rule cho từng SLI S1–S4 của `slo.md` — tỉ lệ request xấu trên cửa sổ 5m, 30m, 1h, 6h, cộng mọi Deployment api được scrape (api, api-canary, api-green), tên dạng `level:metric:operations`; alerting rule cho từng SLI hai bậc: nhanh (1h và 5m cùng > 13,44 × (1 − SLO), `for` vài phút, nhãn `severity: page`, ví dụ `ProductReadsFastBurn` cho S3) và chậm (6h và 30m cùng > 5,6 × (1 − SLO), `severity: ticket`); mỗi alert `severity: page` có annotation tóm tắt và đường dẫn file runbook trong repo (không URL). Sửa `prometheus.yaml` (của platform-and-release-strategy) thêm `rule_files`/`evaluation_interval` và nạp đúng file này (ví dụ Kustomize `configMapGenerator` trong `platform/monitoring/`, hash đổi thì Prometheus khởi động lại) — cơ chế do `/repo-stage 4` chọn, miễn promtool và staging đọc cùng một file. Làm sau Prometheus staging."
    suggested_path: "deploy/gitops/config-repo/platform/monitoring/rules/slo.rules.yml"
  - lesson: devops.l4.burn-rate-alerts
    need: "Test đơn vị cho rule + script chạy nó: `slo.test.yml` (series giả: S3 xấu đều 10% → `ProductReadsFastBurn` firing sau `for`; đợt 100% xấu chỉ 2 phút giữa lưu lượng tốt → không firing; S3 xấu đều 3% trong 6 giờ → alert chậm `severity: ticket` firing, alert nhanh không; ngừng lỗi → alert nhanh hết trong khoảng cửa sổ 5 phút) và `scripts/devops/alert-rules-test.sh` chạy `promtool check rules` rồi `promtool test rules` trong image `prom/prometheus` cùng bản ghim với Compose (khóa `prometheus` 3.5, không thêm khóa); thêm bước vào job CI `manifests`; capture trong chế độ `--all`."
    suggested_path: "deploy/gitops/config-repo/platform/monitoring/rules/slo.test.yml"
  - lesson: devops.l4.alerting-on-symptoms
    need: "`docs/design/alerts.md` (tiếng Việt, mục `### `, không `## `/`**`): bảng mọi alert — tên, SLI/điều kiện, cửa sổ dài/ngắn, ngưỡng viết thành số (burn rate × (1 − SLO), ví dụ S3: 13,44 × 0,5% ≈ 6,7%), page hay ticket, file runbook; mục `### Burn rate` (28 ngày = 672 giờ; 2% budget trong 1 giờ → 13,44; 5% trong 6 giờ → 5,6; ghi đây là lựa chọn của dự án tính cho 28 ngày); mục alert theo nguyên nhân chỉ ở bậc ticket, ghi 'chưa chạy' kèm lý do: dead-letter queue có message (biểu thức trên `rabbitmq_detailed_queue_messages_ready`, chỉ Prometheus của Compose scrape RabbitMQ, staging chưa), restore test thất bại (chưa có job theo lịch), Job migration/backup lỗi (chưa thu thập trạng thái object của cluster); CPU, Pod khởi động lại không alert mà xem dashboard; không dùng alert của Grafana."
    suggested_path: "docs/design/alerts.md"
  - lesson: devops.l4.alerting-on-symptoms
    need: "Cập nhật mục khoảng trống của `docs/design/slo.md`: staging đã có burn-rate alert (trỏ `alerts.md`), chưa có thành phần gửi thông báo, production chưa có Prometheus; giữ nguyên SLI, SLO, chính sách budget (kể cả câu sự cố tiêu hơn 1/4 budget phải có postmortem)."
    suggested_path: "docs/design/slo.md"
  - lesson: devops.l4.on-call
    need: "`docs/team/on-call.md` chỉ là kế hoạch (tiếng Việt, `### `, không `## `/`**`, không tên người, không tên sản phẩm): lịch trực theo vai trò, bàn giao ca, thời gian phản hồi (giả định), chỉ alert `severity: page` được gọi người trực, `severity: ticket` vào backlog giờ làm việc, thứ tự chuyển cấp, xem lại mọi lần gọi sau ca (gọi không cần làm gì → chuyển ticket hoặc xóa); mục khoảng trống: Prometheus không gửi thông báo, staging không chạy thành phần gửi, production chưa có Prometheus → chưa gọi trực thật."
    suggested_path: "docs/team/on-call.md"
  - lesson: devops.l4.runbooks
    need: "`docs/runbooks/product-reads-burn.md` (tiếng Việt, `### `): ý nghĩa với khách; cách xác nhận (tỉ lệ xấu 5m/1h trong Prometheus, `503` của `catalog-reads` hay `5xx` khác, Pod api Ready); bước 1 xem commit gần đây của `envs/staging` trong repo cấu hình và revert commit đổi api; bước 2 khi không có thay đổi gần đây; khi nào chuyển cấp (phút là giả định); ghi dòng thời gian. Mỗi alert `severity: page` khác (S1, S2, S4) có runbook ngắn cùng cấu trúc trong `docs/runbooks/`."
    suggested_path: "docs/runbooks/product-reads-burn.md"
  - lesson: devops.l4.runbooks
    need: "`scripts/devops/incident-drill.sh` (chạy trên host với `donhang-staging`): commit vào repo cấu hình biến môi trường `RateLimiting__CatalogReads__PermitLimit=1`, `RateLimiting__CatalogReads__QueueLimit=0` trên Deployment `api` của `envs/staging` (pod template đổi → rollout; `Program.cs` không đổi), gửi đọc sản phẩm song song qua Gateway liên tục, hỏi Prometheus và in trạng thái `ProductReadsFastBurn` (pending → firing, không in giờ), rồi `git revert` commit đó như bước runbook, tiếp tục đọc tốt tới khi alert hết, in lúc đó tỉ lệ xấu 5m (dưới ngưỡng) và 1h (còn trên ngưỡng); thêm vào chế độ `--devops-host`. Capture không firing, hoặc alert chỉ hết sau khi tỉ lệ 1h xuống dưới ngưỡng → DỪNG, sửa outline, không sửa code API hay giới hạn."
    suggested_path: "scripts/devops/incident-drill.sh"
  - lesson: devops.l4.incident-command
    need: "`docs/team/incident-response.md` (tiếng Việt, `### `, không tên người): mức nghiêm trọng SEV1–SEV3 theo ảnh hưởng tới khách (SEV1 đặt đơn lỗi cho mọi cửa hàng; SEV2 alert page của S2–S4; SEV3 alert ticket) và mỗi mức gọi ai, bao lâu cập nhật cho cửa hàng (giả định); vai trò người chỉ huy sự cố, người xử lý, người liên lạc — người trực giữ vai trò chỉ huy tới khi bàn giao, nhóm nhỏ có thể gộp vai trò khi nào; mẫu cập nhật cho cửa hàng (ảnh hưởng, đang làm gì, lần cập nhật sau, không đoán nguyên nhân); ghi dòng thời gian; điều kiện kết thúc (alert hết, SLI giữ tốt khi đã giảm thiểu); điều kiện postmortem trỏ `slo.md`."
    suggested_path: "docs/team/incident-response.md"
  - lesson: devops.l4.blameless-postmortems
    need: "`docs/postmortems/template.md` (các mục: ảnh hưởng + budget đã tiêu, dòng thời gian, yếu tố góp phần, điều đã giúp, action item có người phụ trách theo vai trò + hạn + trạng thái) và `docs/postmortems/0001-doc-san-pham-tra-503.md`: postmortem không đổ lỗi cho sự cố mà `incident-drill.sh` tái hiện, mốc thời gian tương đối (T+0…), số liệu ngoài output script ghi 'giả định', không tên người; yếu tố góp phần gồm thay đổi cấu hình đi thẳng vào Deployment `api` không qua bước canary của ADR 0019, không phép kiểm nào chặn giá trị giới hạn bất thường; điều đã giúp: alert hai cửa sổ, revert một commit; action item mở có hạn. `docs/team/delivery-metrics.md` thêm một dòng trỏ `docs/postmortems/` là nguồn ghi sự cố."
    suggested_path: "docs/postmortems/0001-doc-san-pham-tra-503.md"
  - lesson: devops.l4.runbooks
    need: "STAGE.md: thêm `alert-rules-test.sh` (`--all`) và `incident-drill.sh` (`--devops-host`, ghi thời gian chạy ước tính vì phải chờ alert firing rồi hết) vào chế độ capture và bảng 'file → bài'; thứ tự trong `/repo-stage 4`: sau Prometheus staging và `api-canary` của platform-and-release-strategy, trước `fitness-functions.md` (viết cuối)."
    suggested_path: "STAGE.md"

open_questions:
  - "Gửi thông báo: không có khóa `alertmanager` trong versions.yaml. Đề xuất: không thêm khóa; module chỉ dùng rule của Prometheus (khóa `prometheus` 3.5, promtool đi cùng image), alert xem qua API của Prometheus; `on-call.md` ghi khoảng trống, bài không nêu tên thành phần gửi thông báo. (Phương án khác cần chủ duyệt: thêm khóa `alertmanager` và gửi email tới Mailpit trên staging.)"
  - "Số ADR: module không cần ADR. Đề xuất: không dùng số; ADR GĐ4 tiếp theo vẫn từ 0020."
  - "Thu thập đo người dùng thật (RUM): đề xuất không làm ở đây; giữ nguyên quyết định của frontend (`app-experience.md` chỉ kế hoạch), thu thập để sau V1."
  - "Alert theo nguyên nhân đã hoãn về đây (dead-letter queue, restore test theo lịch, Job lỗi): đề xuất chỉ ghi trong `alerts.md` ở bậc ticket với lý do 'chưa chạy' — chạy thật cần staging scrape RabbitMQ hoặc thêm công cụ thu thập trạng thái object cluster (khóa mới), không làm ở V1."
  - "Ngưỡng 13,44 / 5,6 và cặp cửa sổ 1h/5m, 6h/30m: đề xuất là lựa chọn của dự án tính lại cho cửa sổ 28 ngày (không chép số tính cho 30 ngày của sách); sách Site Reliability Workbook chỉ nêu tên trần, claim `history`. `/repo-stage 4` đổi ngưỡng/cửa sổ thì sửa outline `burn-rate`, `burn-rate-alerts`, `runbooks` trước khi sinh bài."
  - "Chaos engineering / game day: không có trong chương trình. Đề xuất không dạy, không thêm term; `incident-drill.sh` là diễn tập giống DR drill."
  - "Tổ chức trực (số người, lương, mệt mỏi khi trực) và văn hóa không đổ lỗi ở mức tổ chức: đề xuất để `management/teams-and-leadership`; module này chỉ dạy quy trình kỹ thuật."
  - "Alert chỉ chạy trên staging (production không có Prometheus theo quyết định platform-and-release-strategy). Đề xuất chấp nhận; bài nói rõ đây là staging, kế hoạch production nằm trong `on-call.md`."
  - "Tên file, tên alert (`ProductReadsFastBurn`), tên postmortem `0001-doc-san-pham-tra-503.md` là đề xuất; `/repo-stage 4` đổi thì sửa `example_files`/outline trước khi sinh bài. Capture `incident-drill.sh` khác outline thì DỪNG, sửa outline, không sửa code API hay giới hạn `Program.cs`."
