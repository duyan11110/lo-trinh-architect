module:
  id: platform-and-release-strategy
  title:
    vi: "Platform engineering và chiến lược phát hành"
    en: "Platform engineering and release strategy"
  stage: 4
  summary:
    vi: "Phát hành phiên bản mới của Đơn Hàng mà không đổi tất cả cùng lúc: blue-green, canary được đánh giá bằng metric của chính staging và dừng ở giới hạn đặt trước, feature flag; chọn chiến lược cho từng thành phần trong ADR 0019, đo việc giao phần mềm bằng DORA metrics và cho service mới một golden path trên platform tự phục vụ."
    en: "Release new versions of Đơn Hàng without switching everything at once: blue-green, canaries judged by staging's own metrics and stopped at limits set in advance, feature flags; choose a strategy per component in ADR 0019, measure delivery with the DORA metrics, and give new services a golden path on a self-service platform."
  lessons:
    - id: devops.l4.blue-green-deployment
      title:
        vi: "Blue-green chạy sẵn bản mới bên cạnh rồi chuyển mọi request sang trong một lần"
        en: "Blue-green runs the new version beside the old, then moves all requests at once"
      main_path: true
      duration_min: 14
      skills: [devops.release.traffic-strategies]
      prereqs:
        - devops.l3.rollback-by-revert
        - k8s.l2.gateway-api
        - backend.l4.expand-and-contract
        - backend.l4.capacity-planning
      related: [k8s.l1.rolling-updates, k8s.l1.rollbacks, devops.l3.deploying-by-commit]
      vocab: [blue-green-deployment]
      example_tag: stage-4
      example_files:
        - scripts/devops/blue-green.sh
        - deploy/gitops/lessons/api-green.yaml
        - deploy/gitops/config-repo/platform/edge/httproutes.yaml
        - docs/design/capacity-plan.md
      outline:
        - "Deploying puts a version on running Pods and releasing sends customers' requests to it; a rolling update does both at once, Pod by Pod, so nobody chooses the moment customers meet the new version."
        - "Blue-green deployment runs the new version as a second full set of Pods, green, beside the current one, blue, and releases it by moving every request at once, here by changing the Service an HTTPRoute names."
        - "`blue-green.sh` starts `api-green` with as many replicas as `api`, waits until its Pods are ready, then commits the route change to the config repository; the requests it sends during the switch get no `5xx`."
        - "Going back is one commit that points the route at blue again; blue's Pods are still running, so no Pod has to start, unlike a rolling update back to the old image."
        - "Until blue is removed the api runs twice its Pods, and each opens its own database connections, so the capacity plan's connection limit must allow both colours at once."
        - "Both colours use one database, so a migration released with green must still work with blue's code: blue-green does not replace expand and contract."
      misconceptions:
        - "Blue-green is just a faster rolling update."
        - "Switching back to blue also undoes the schema changes green's migration made."
        - "Blue should be deleted as soon as the requests go to green, to free its resources."
      depth_notes: "Không chia một phần request — devops.l4.canary-release; không dạy blue-green bằng DNS hay load balancer ngoài cluster, mỗi màu một database. Không dạy lại HTTPRoute, expand/contract, revert — k8s.l2.gateway-api, backend.l4.expand-and-contract, devops.l3.rollback-by-revert."
    - id: devops.l4.canary-release
      title:
        vi: "Canary gửi một phần nhỏ request tới bản mới, phần còn lại vẫn ở bản cũ"
        en: "A canary sends a small share of requests to the new version"
      main_path: true
      duration_min: 15
      skills: [devops.release.traffic-strategies]
      prereqs:
        - devops.l4.blue-green-deployment
        - devops.l2.prometheus-scraping
        - devops.l2.counters-and-rate
        - k8s.l1.labels
      related: [k8s.l1.rolling-updates, backend.l4.error-budget, k8s.l2.gateway-api]
      vocab: [canary-release]
      example_tag: stage-4
      example_files:
        - scripts/devops/canary.sh
        - deploy/gitops/lessons/api-canary.yaml
        - deploy/gitops/config-repo/platform/monitoring/prometheus.yaml
      outline:
        - "A canary release sends a small share of the requests to the new version while the rest stays on the current one, so a fault in the new version reaches only that share."
        - "An HTTPRoute rule may name several Services with weights, each getting requests in proportion to its weight over their sum; `canary.sh` sets 90 for `api` and 10 for `api-canary`, a second Deployment with one Pod."
        - "Staging's Prometheus, added at stage-4, scrapes each api Pod and copies the Pod's `app` label onto its series, so one query shows how many requests each Deployment served."
        - "`canary.sh` sends 200 product reads through the Gateway and prints each Deployment's count from Prometheus: the canary's is close to a tenth, not exact, because each request is placed on its own."
        - "Weights split requests, not customers: one customer's requests may reach both versions in a single session, so each version must accept what the other wrote."
        - "A rolling update also runs two versions for a while, but the share follows the Pods replaced so far and keeps rising; a canary keeps its share until someone changes the weight."
      misconceptions:
        - "With weight 10, the same tenth of the customers always gets the new version."
        - "A canary is a test environment that only the team can reach."
        - "Errors on the canary do not matter, because it serves so few requests."
      depth_notes: "Không chia theo header hay cookie, không giữ một khách trên một phiên bản, không service mesh — k8s/multi-cluster-and-mesh. Tăng tỉ lệ và tiêu chí dừng — devops.l4.progressive-delivery. Không dạy chi tiết service discovery của Prometheus; không dạy lại scrape, label."
    - id: devops.l4.progressive-delivery
      title:
        vi: "Chỉ tăng phần của canary khi số đo của nó còn trong giới hạn đã đặt trước"
        en: "Raise a canary's share only while its measurements stay within set limits"
      main_path: true
      duration_min: 15
      skills: [devops.release.traffic-strategies]
      prereqs:
        - devops.l4.canary-release
        - backend.l4.error-budget
        - backend.l4.service-level-indicators
        - backend.l3.bulkhead
      related: [devops.l3.deploying-by-commit, backend.l4.load-testing, devops.l3.rollback-by-revert]
      vocab: [progressive-delivery]
      example_tag: stage-4
      example_files:
        - scripts/devops/canary-steps.sh
        - docs/design/canary-checks.md
        - deploy/gitops/lessons/api-canary.yaml
      outline:
        - "Progressive delivery raises a canary's share in steps and moves to the next step only while the canary's measurements stay within limits written down before the release starts."
        - "`canary-checks.md` sets Đơn Hàng's steps, 10, 50 and 100, the number of requests the canary must serve before a step is judged, and how much its `5xx` share may exceed the stable version's."
        - "A step is judged only after that minimum: after 20 requests one failure is already 5%, which says little about the version."
        - "`canary-steps.sh --bad` starts a canary whose `catalog-reads` setting lets one read run at a time: its `503` share crosses the limit at the first step, and the script sets its weight back to 0 instead of going on."
        - "Stopping costs little: the stable Deployment still runs at full size, and only the requests the canary served met the fault, spending that much of the error budget."
        - "Controllers exist that run the steps and checks inside the cluster; Đơn Hàng's script commits each weight to the config repository, so every step is a commit Argo CD applies."
      misconceptions:
        - "If the canary shows no errors in its first minute, it can take all the requests."
        - "A fixed error limit is enough; the stable version's own errors do not matter."
        - "Automatic rollback means nobody has to decide in advance what a bad canary looks like."
      depth_notes: "Không dùng controller canary tự động (versions.yaml chưa có), không phân tích thống kê, không alert — devops/incidents. Canary hỏng do cấu hình, `Program.cs` không đổi. Không dạy lại error budget, SLI, bulkhead — backend.l4.error-budget, backend.l4.service-level-indicators, backend.l3.bulkhead."
    - id: devops.l4.feature-flags
      title:
        vi: "Feature flag cho deploy code đang tắt rồi bật tính năng sau, không deploy lại"
        en: "A feature flag ships code switched off and turns it on without a deploy"
      main_path: true
      duration_min: 14
      skills: [devops.release.feature-flags]
      prereqs:
        - devops.l4.progressive-delivery
        - backend.l4.expand-and-contract
        - management.l3.technical-debt-register
        - backend.l3.graceful-degradation
      related: [devops.l1.twelve-factor-config, design.l1.test-doubles, backend.l4.shop-id-rollout]
      vocab: [feature-flag, kill-switch]
      example_tag: stage-4
      example_files:
        - samples/DonHang.Samples/Samples/Release/FeatureFlags.cs
        - samples/DonHang.Samples.Tests/FeatureFlagsTests.cs
        - docs/design/feature-flags.md
      outline:
        - "A feature flag is a setting the code reads while it runs to choose between two paths, so a feature can be deployed switched off and released later without a new deploy."
        - "A release flag lives only until its feature is fully on and is then removed; a kill switch stays for good and turns off a costly feature under load, a form of graceful degradation."
        - "`FeatureFlags` in the samples turns a flag on for a percentage of customers from a number computed from the flag's name and the customer id, so the same customer always gets the same answer."
        - "Its tests show that raising the percentage only adds customers: everyone who had the feature at 10% still has it at 50%, and 0% turns it off for all."
        - "Each flag doubles the paths that must work; `feature-flags.md` asks for an owner and a removal date for every release flag, and a flag past its date goes into the tech debt register."
        - "Code behind a flag that is off still runs against today's schema, so a flag does not replace expand and contract."
      misconceptions:
        - "A feature flag is just an if statement, so keeping it costs nothing."
        - "Turning a feature on for 10% of requests is the same as turning it on for 10% of customers."
        - "Code behind a flag that is off need not be tested, since it can be switched off again."
      depth_notes: "API Đơn Hàng chưa có flag ở stage-4 (chỉ sample + quy ước); không dạy dịch vụ quản lý flag, flag theo cửa hàng, thử nghiệm A/B. Không dạy lại graceful degradation, sổ nợ — backend.l3.graceful-degradation, management.l3.technical-debt-register."
    - id: devops.l4.release-strategy-per-component
      title:
        vi: "Mỗi thành phần được phát hành theo cách mà đường đi của nó cho phép"
        en: "Each component gets the release strategy its traffic allows"
      main_path: true
      duration_min: 14
      skills: [devops.release.strategy-choice]
      prereqs:
        - devops.l4.feature-flags
        - design.l4.one-deployment-for-all-shops
        - backend.l4.message-schema-evolution
        - management.l3.weighing-options-in-an-adr
      related:
        - backend.l4.error-budget
        - backend.l4.capacity-planning
        - backend.l4.shop-id-rollout
        - devops.l4.blue-green-deployment
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/adr/0019-chien-luoc-phat-hanh-theo-thanh-phan.md
        - docs/design/canary-checks.md
        - docs/design/slo.md
      outline:
        - "ADR `0019` chooses per component: a canary through the Gateway for the api, rolling updates for Notifications and Payments, feature flags for changes customers see; blue-green is rejected."
        - "Blue-green is rejected because 1,000 shops share one deployment: a second full set of api Pods doubles the database connections the capacity plan counts, for a quick switch back a canary also gives."
        - "Notifications and Payments take messages from queues, not requests through the Gateway, so no route weight reaches them; they rely on rolling updates and on messages both versions can read."
        - "Every strategy shares each service's database, so the ADR requires each release's schema to work with the previous release's code, which keeps any release reversible by deploying the version before it."
        - "The ADR ties releases to the error budget policy in `slo.md`: while a service's budget is spent only fixes ship, and they still go through the canary steps."
        - "It names what would reopen the decision, such as a shop that needs a deployment of its own or a change that cannot be made compatible."
      misconceptions:
        - "One release strategy should be used for every service, for consistency."
        - "Any service on Kubernetes can be released as a canary by giving it a route weight."
        - "An urgent fix should skip the canary to reach customers faster."
      depth_notes: "Không dạy multi-region, failover giữa cluster — k8s/multi-cluster-and-mesh; lịch phát hành, roadmap — management/governance-and-strategy. Không quyết lại ADR 0012, 0013. Không dạy lại các chiến lược — các bài trước của module."
    - id: devops.l4.delivery-metrics
      title:
        vi: "Bốn số đo cho biết phát hành nhanh hơn có phải trả bằng nhiều sự cố hơn không"
        en: "Four delivery measures show whether faster releases cost stability"
      main_path: true
      duration_min: 14
      skills: [devops.delivery.metrics]
      prereqs:
        - devops.l4.release-strategy-per-component
        - devops.l3.promoting-between-environments
        - devops.l3.rollback-by-revert
      related: [devops.l2.deployment-environments, devops.l2.cutting-a-release, backend.l4.error-budget]
      vocab: [dora-metrics, lead-time-for-changes, change-failure-rate]
      example_tag: stage-4
      example_files:
        - scripts/devops/delivery-metrics.sh
        - docs/team/delivery-metrics.md
        - scripts/devops/gitops-promote.sh
      outline:
        - "The DORA metrics, from a long-running research program on software delivery, are deployment frequency, lead time for changes, change failure rate and time to restore service."
        - "Deployment frequency and lead time for changes, the time from a commit to its running in production, measure throughput; change failure rate and time to restore measure stability."
        - "`delivery-metrics.sh` computes all four from a config repository's history: a commit that changes an image in `envs/production` is a deploy, and a deploy later reverted counts as a failed change."
        - "Read together, the four keep a team from buying speed with failures: more deploys a week while the change failure rate rises is not progress."
        - "The history sees only failures fixed by a revert; one fixed another way is found in incident records, so `delivery-metrics.md` names both sources."
        - "The metrics describe the delivery system, not people: used to rank developers they get gamed, for example by splitting one change into many deploys."
      misconceptions:
        - "Deploying more often always means more incidents."
        - "Lead time is how long the team took to build a feature from the first idea."
        - "These metrics are a good way to compare developers inside the team."
      depth_notes: "Không nêu mức chuẩn hay xếp hạng của nghiên cứu (số liệu thị trường). Không dạy sự cố, postmortem — devops/incidents. Lịch sử trong script là giả định, ngày cố định. Không dạy lại promote, revert — devops.l3.promoting-between-environments, devops.l3.rollback-by-revert."
    - id: devops.l4.platform-engineering
      title:
        vi: "Platform biến các bước mọi service lặp lại thành việc nhóm tự làm được"
        en: "A platform turns the steps every service repeats into self-service"
      main_path: true
      duration_min: 14
      skills: [devops.platform.engineering]
      prereqs:
        - devops.l4.delivery-metrics
        - design.l4.conways-law
        - devops.l3.one-state-per-environment
        - k8s.l2.gateway-api
      related: [management.l3.self-hosting-costs, devops.l3.argo-cd-applications, k8s.l3.network-policies]
      vocab: [platform-engineering, internal-developer-platform]
      example_tag: stage-4
      example_files:
        - scripts/devops/service-footprint.sh
        - docs/team/platform-capabilities.md
        - docs/team/self-run-components.md
      outline:
        - "`service-footprint.sh payments` lists every file outside Payments' own code that had to change for it, from CI jobs and Kustomize files to NetworkPolicies, routes and sealed secrets."
        - "Each new service repeats those steps: copied from another service, its mistakes and old defaults are copied too; asked of another team, each step waits in that team's queue."
        - "Platform engineering builds and runs an internal developer platform: the shared tools, defaults and documents that let a product team do such steps itself."
        - "`platform-capabilities.md` lists Đơn Hàng's platform today, from OpenTofu's layers, Argo CD and the Gateway to Sealed Secrets, the admission policy and the CI jobs, and marks which a team can use on its own."
        - "A platform is run as a product for internal users: it is judged by whether teams choose it and by their delivery metrics, not by how many tools it holds."
        - "A separate platform team pays off when several teams repeat the same steps; with one team, as Đơn Hàng has today, writing the steps down may be enough."
      misconceptions:
        - "Platform engineering means buying a developer portal product."
        - "The platform team should run every deploy for the product teams."
        - "Every company needs a platform team as soon as it uses Kubernetes."
      depth_notes: "Không dạy kiểu nhóm (Team Topologies) — management/teams-and-leadership; không nêu tên sản phẩm developer portal. Đường mặc định cho service mới — devops.l4.golden-path. Không dạy lại chi phí tự vận hành — management.l3.self-hosting-costs."
    - id: devops.l4.golden-path
      title:
        vi: "Golden path là con đường mặc định được hỗ trợ để thêm một service"
        en: "A golden path is the supported default way to add a service"
      main_path: true
      duration_min: 14
      skills: [devops.platform.golden-path]
      prereqs:
        - devops.l4.platform-engineering
        - k8s.l3.admission-policies
        - k8s.l2.kustomize-overlays
        - design.l4.fitness-functions
      related: [k8s.l3.security-context, k8s.l3.network-policies, devops.l3.verifying-before-deploy]
      vocab: [golden-path]
      example_tag: stage-4
      example_files:
        - scripts/devops/new-service.sh
        - templates/dotnet-service/kustomization.yaml
        - docs/team/golden-path.md
        - deploy/gitops/config-repo/platform/policies/require-image-digest.yaml
      outline:
        - "A golden path is the supported, documented way to build and run a service on the platform, whose defaults already meet the platform's rules."
        - "`new-service.sh` renders from `templates/dotnet-service/` the Kustomize files a new .NET service needs: a Deployment with probes and a security context, a Service, a migration hook and NetworkPolicies."
        - "The rendered files pass the checks the config repository already gets, `kubectl kustomize` and kubeconform, and name the image by digest, so the admission policy accepts them."
        - "`golden-path.md` lists what the path gives and what stays the team's own: its code, its migrations and its SLO."
        - "The path is a default, not a rule: a team may leave it, and then owns the checks and upkeep the path would have given."
        - "Files rendered once do not follow later changes to the template, so a rule that must hold for every service is enforced by a check, such as the admission policy, not by the template alone."
      misconceptions:
        - "A golden path forbids every other way to deploy a service."
        - "A service generated from the template stays up to date with the platform."
        - "The more options the template offers, the better the golden path."
      depth_notes: "Không dạy developer portal, sinh job CI hay code C# cho service mới; không thêm service thật vào Đơn Hàng. Không dạy lại Kustomize, admission policy, fitness function — k8s.l2.kustomize-overlays, k8s.l3.admission-policies, design.l4.fitness-functions."

