repo_changes_needed:
  - lesson: devops.l4.canary-release
    need: "Prometheus trong donhang-staging (khóa `prometheus` 3.5, image ghim digest): namespace `monitoring`, ServiceAccount + ClusterRole chỉ get/list/watch Pod, cấu hình service discovery theo Pod trong `donhang` chỉ giữ Pod có label `app` ∈ {api, api-canary, api-green} và chép label `app` vào series; Application `apps/monitoring-staging.yaml`; NetworkPolicy cho namespace `monitoring` vào cổng 8080 của các Pod đó. Không Grafana, không alert rule (devops/incidents). Production không có."
    suggested_path: "deploy/gitops/config-repo/platform/monitoring/prometheus.yaml"
  - lesson: devops.l4.blue-green-deployment
    need: "Manifest `api-green` (Deployment cùng số replica với `api`, label `app: api-green` — không trùng selector của `api` —, image theo digest, cùng Secret/ConfigMap, probe, securityContext) + Service `api-green`; các NetworkPolicy/egress policy hiện có (db, redis, rabbitmq, keycloak, from-the-gateway) thêm `api-green` và `api-canary` vào danh sách `app`. `httproutes.yaml` ở stage-4 vẫn chỉ trỏ Service `api` (script đổi trong repo cấu hình)."
    suggested_path: "deploy/gitops/lessons/api-green.yaml"
  - lesson: devops.l4.blue-green-deployment
    need: "`scripts/devops/blue-green.sh` (chạy trên host, donhang-staging): commit `api-green` vào repo cấu hình, chờ Pod ready; gửi request liên tục qua Gateway (HTTPS 18443, `--cacert secrets/lab-ca.crt`) trong lúc commit đổi backendRef của HTTPRoute `api` sang `api-green`; in số request theo status code của từng giai đoạn; revert commit để chuyển lại blue (in rằng không Pod blue nào khởi động lại); dọn `api-green`. Capture có `5xx` thì DỪNG, sửa outline, không sửa code API."
    suggested_path: "scripts/devops/blue-green.sh"
  - lesson: devops.l4.canary-release
    need: "Manifest `api-canary` (Deployment 1 replica, `app: api-canary`, image theo digest) + Service `api-canary`; `scripts/devops/canary.sh` (host): commit HTTPRoute `api` với hai backendRef weight 90 (`api`) / 10 (`api-canary`), gửi 200 lần `GET /api/v1/products?limit=20` qua Gateway, hỏi Prometheus số request theo `app` (increase của counter prometheus-net) và in hai số; đặt weight về 0 và dọn. Capture che số tuyệt đối nếu không ổn định; script tự kiểm tổng = 200."
    suggested_path: "scripts/devops/canary.sh"
  - lesson: devops.l4.progressive-delivery
    need: "`docs/design/canary-checks.md` (tiếng Việt, mục `### `, không `## `/`**`): các bước 10/50/100, số request tối thiểu canary phải phục vụ trước khi xét một bước, mức `5xx` của canary được vượt bản stable bao nhiêu (số ghi 'giả định'), ai quyết khi số đo nằm sát giới hạn, nối với chính sách error budget trong `slo.md`; khi tới 100 thì commit đổi image của `api` sang digest của canary rồi bỏ canary."
    suggested_path: "docs/design/canary-checks.md"
  - lesson: devops.l4.progressive-delivery
    need: "`scripts/devops/canary-steps.sh [--bad]` (host): mỗi bước commit weight, gửi request song song tới khi canary đủ số tối thiểu, đọc tỉ lệ `5xx` của canary và stable từ Prometheus, in quyết định từng bước. `--bad`: canary chạy cùng image với `RateLimiting__CatalogReads__PermitLimit=1`, `RateLimiting__CatalogReads__QueueLimit=0` (bind sẵn trong `Program.cs`, không sửa code) nên bị `503` khi đọc đồng thời; script đặt weight về 0 ở bước đầu. Capture không vượt giới hạn thì DỪNG, sửa outline."
    suggested_path: "scripts/devops/canary-steps.sh"
  - lesson: devops.l4.feature-flags
    need: "`samples/DonHang.Samples/Samples/Release/FeatureFlags.cs`: flag tắt/bật/theo phần trăm khách, phần trăm dựa trên một số ổn định tính từ tên flag + id khách (không dùng `GetHashCode` vì đổi giữa các lần chạy); khối ≤ 25 dòng. `samples/DonHang.Samples.Tests/FeatureFlagsTests.cs`: cùng khách luôn cùng kết quả; khách bật ở 10% vẫn bật ở 50%; 0% tắt hết, 100% bật hết. API không có flag ở stage-4."
    suggested_path: "samples/DonHang.Samples/Samples/Release/FeatureFlags.cs"
  - lesson: devops.l4.feature-flags
    need: "`docs/design/feature-flags.md` (tiếng Việt, `### `): hai loại (flag phát hành, kill switch), mỗi flag phát hành có người phụ trách và ngày gỡ, flag quá hạn ghi vào sổ nợ kỹ thuật (quy tắc, không sửa `tech-debt-register.md` ở module này), flag không thay expand/contract, bật theo phần trăm khách chứ không theo request."
    suggested_path: "docs/design/feature-flags.md"
  - lesson: devops.l4.release-strategy-per-component
    need: "`docs/adr/0019-chien-luoc-phat-hanh-theo-thanh-phan.md` (Đã chấp nhận; tiếng Việt, `### `): phương án blue-green / canary qua Gateway / chỉ rolling update; chọn canary cho api theo `canary-checks.md`, rolling update cho Notifications và Payments (nhận message từ queue, không qua route), feature flag cho thay đổi khách thấy; từ chối blue-green (gấp đôi Pod api và kết nối DB theo `capacity-plan.md`); mỗi release giữ schema chạy được với code bản trước; gắn chính sách error budget của `slo.md` (fix vẫn qua canary); điều kiện mở lại. Thêm dòng 0019 vào `docs/adr/README.md`."
    suggested_path: "docs/adr/0019-chien-luoc-phat-hanh-theo-thanh-phan.md"
  - lesson: devops.l4.delivery-metrics
    need: "`scripts/devops/delivery-metrics.sh`: dựng repo cấu hình tạm với lịch sử ngày cố định (như `git-playground/build-history.sh`) mô phỏng một quý giả định gồm commit promote kiểu `gitops-promote.sh` vào `envs/production` và vài revert, kèm commit ứng dụng có thời điểm cố định mà tag `sha-` trỏ tới; tính và in tần suất deploy, lead time for changes (trung vị), change failure rate, thời gian khôi phục (từ deploy hỏng tới revert) chỉ từ `git log`. Output ổn định."
    suggested_path: "scripts/devops/delivery-metrics.sh"
  - lesson: devops.l4.delivery-metrics
    need: "`docs/team/delivery-metrics.md` (tiếng Việt, `### `): định nghĩa bốn số đo theo cách Đơn Hàng đếm (deploy = commit đổi image ở `envs/production`; lead time tính từ commit ứng dụng; lỗi = revert hoặc bản ghi sự cố; khôi phục từ deploy hỏng tới bản chạy tốt), nguồn dữ liệu mỗi số, giới hạn (sự cố sửa không bằng revert chỉ thấy trong bản ghi sự cố — devops/incidents), không dùng để so sánh cá nhân. Không nêu mức chuẩn của nghiên cứu."
    suggested_path: "docs/team/delivery-metrics.md"
  - lesson: devops.l4.platform-engineering
    need: "`scripts/devops/service-footprint.sh <service>`: liệt kê, nhóm theo vùng (CI, Compose, Kustomize/manifest, NetworkPolicy, route, sealed secret, OpenTofu, script), mọi file ngoài thư mục code của service có nhắc tới nó, và tổng số file; chạy được trên chính repo (lab box hoặc host), output ổn định. Chạy với `payments` trên cây stage-4 cuối cùng."
    suggested_path: "scripts/devops/service-footprint.sh"
  - lesson: devops.l4.platform-engineering
    need: "`docs/team/platform-capabilities.md` (tiếng Việt, `### `): bảng năng lực platform hiện có (lớp cluster và platform của OpenTofu, Argo CD + repo cấu hình, Gateway + HTTPRoute, Sealed Secrets, admission policy, các job CI ký/quét image, Prometheus staging) — mỗi dòng: dùng để làm gì, ai giữ, nhóm tự làm được hay phải nhờ; mục 'chưa tự phục vụ' và nhận xét một nhóm hiện tại chưa cần nhóm platform riêng (ý kiến có điều kiện)."
    suggested_path: "docs/team/platform-capabilities.md"
  - lesson: devops.l4.golden-path
    need: "`templates/dotnet-service/` (kustomization.yaml + Deployment có probe `/health/live`, `/health/ready`, securityContext như `api`, `automountServiceAccountToken: false`, Service, migration hook, NetworkPolicy ingress/egress, image theo digest) và `scripts/devops/new-service.sh <name>`: render vào thư mục tạm, chạy `kubectl kustomize` và kubeconform (image ghim như job `manifests` của CI), in danh sách file và kết quả kiểm. Viết sau mọi thay đổi manifest khác của stage-4 để template khớp base cuối cùng; không thêm service thật."
    suggested_path: "scripts/devops/new-service.sh"
  - lesson: devops.l4.golden-path
    need: "`docs/team/golden-path.md` (tiếng Việt, `### `): golden path cho service .NET mới — các bước, phần path cho sẵn (manifest, policy, ký và quét image qua CI, digest), phần nhóm tự lo (code, migration, SLO), rời path thì tự chịu gì, và vì sao luật bắt buộc nằm ở phép kiểm (admission policy) chứ không chỉ ở template."
    suggested_path: "docs/team/golden-path.md"
  - lesson: devops.l4.golden-path
    need: "STAGE.md stage-4: thêm Prometheus staging, các script host mới vào chế độ `--devops-host` (sau `deploy-verified.sh`, trước teardown), `delivery-metrics.sh`/`service-footprint.sh`/`new-service.sh` vào `--all` nếu chạy được trong lab box; bảng 'file → bài học' cho mọi file trên."
    suggested_path: "STAGE.md"

open_questions:
  - "Số ADR: module này dùng 0019 (chiến lược phát hành theo thành phần). Đề xuất: ADR GĐ4 tiếp theo đánh từ 0020."
  - "Multi-region, failover giữa vùng (devops L4 'Multi-env, multi-region'): đề xuất chuyển hẳn sang k8s/multi-cluster-and-mesh (DECISIONS cho phép); 'multi-env' coi như đã dạy ở GĐ3 (overlay staging/production, promote). Module này chỉ trỏ tới trong depth_notes."
  - "Giám sát cluster: đề xuất module này thêm Prometheus vào donhang-staging, chỉ scrape Pod api/api-canary/api-green để quyết định phát hành; không Grafana, không alert; production vẫn chưa có. Khi `/repo-stage 4` viết `slo.md`, mục khoảng trống ghi: staging có Prometheus (dùng cho canary), chưa tính SLI/burn rate ở đó; production chưa có. devops/incidents dùng lại Prometheus này cho alert burn-rate."
  - "Không thêm khóa versions.yaml cho controller progressive delivery (Argo Rollouts, Flagger): đề xuất không thêm; canary làm bằng weight của HTTPRoute (khóa `gateway_api` 1.6, `traefik` 3.7) + script commit từng bước; bài chỉ nói 'controllers exist' không nêu tên. Reviewer 04 cần kiểm: weight trong backendRefs của HTTPRoute (tỉ lệ = weight/tổng, weight 0 không nhận request) và Traefik 3.7 hỗ trợ."
  - "Không thêm khóa cho thư viện/dịch vụ feature flag (Microsoft.FeatureManagement, OpenFeature): đề xuất không thêm; sample C# thuần dưới khóa `dotnet`, API Đơn Hàng không có flag ở stage-4."
  - "DORA: đề xuất coi là tham chiếu kinh điển (claim `history`, không tên người, không năm, không mức chuẩn/xếp hạng — số liệu thị trường). Mục 'Metric: lead time, DORA' của management L2 chưa module nào dạy; từ nay nhà của nó là bài này, management/governance-and-strategy dùng lại term."
  - "Phần còn lại của devops L4: 'Tuân thủ & audit ngân hàng/chính phủ' đề xuất sang management/governance-and-strategy (đã có 'Dự án tuân thủ ngân hàng/chính phủ') + sysdesign/problems; 'Tổ chức DevOps' và kiểu nhóm platform (Team Topologies) sang management/teams-and-leadership — bài platform-engineering chỉ nói 'a platform team' bằng lời, không thêm term `platform-team`; 'SLO, error budget, incident, postmortem' đã/ sẽ ở backend/capacity-and-slo và devops/incidents."
  - "Developer portal (k8s L4 'Platform trên K8s: ArgoCD, Backstage'): đề xuất không dạy, không thêm khóa; chỉ xuất hiện bằng lời ('a developer portal product') trong ngộ nhận của bài platform-engineering. Lịch phát hành, release train, roadmap để management/governance-and-strategy."
  - "Canary hỏng bằng cấu hình (`RateLimiting__CatalogReads__PermitLimit=1`, `QueueLimit=0` chỉ trên `api-canary`): giữ nguyên `Program.cs` như đã chốt. Nếu capture `canary-steps.sh --bad` không vượt giới hạn hoặc `blue-green.sh` có `5xx` lúc chuyển: DỪNG, sửa outline, không sửa code API."
  - "Label của Pod canary/green: đề xuất `app: api-canary`/`app: api-green` (không thêm label vào Pod `api` để selector Deployment không chồng nhau); hệ quả `/repo-stage 4` phải thêm hai giá trị vào mọi NetworkPolicy/egress policy đang liệt kê `api`. Nếu repo-stage chọn khác (ví dụ label `track`), sửa outline mục 3 bài canary-release trước khi sinh bài."
  - "Bộ nhớ lab: blue-green tạm chạy thêm 2 Pod api, canary 1 Pod, Prometheus 1 Pod trên donhang-staging (~4 GB hiện tại). Đề xuất chấp nhận, STAGE.md nâng khuyến nghị Docker nếu đo thấy cần."
  - "Thứ tự trong `/repo-stage 4`: Prometheus staging + NetworkPolicy trước các script canary; `templates/dotnet-service/` và `service-footprint.sh` làm sau mọi thay đổi manifest khác (để khớp cây cuối); `fitness-functions.md` (viết cuối) có thể thêm dòng admission policy giữ luật digest cho service sinh từ template — không bắt buộc."
  - "Tên file/script là đề xuất; `/repo-stage 4` đổi tên thì sửa `example_files` trước khi sinh bài."
