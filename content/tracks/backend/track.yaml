levels:
- level: 1
  title:
    vi: "Level 1"
    en: "Level 1"
  modules:
  - id: web-server
    title:
      vi: "Web server làm gì: Kestrel và vòng đời một request"
      en: "What a web server does: Kestrel and a request's lifecycle"
    stage: 1
    summary:
      vi: "Đọc được Program.cs của một ứng dụng ASP.NET Core và nói đúng thứ tự một request đi qua Kestrel, middleware, rồi endpoint."
      en: "Read an ASP.NET Core app's Program.cs and state the exact order one request travels through Kestrel, middleware, then an endpoint."
    lessons:
    - id: backend.l1.what-kestrel-does
      title:
        vi: "Kestrel: server chạy code C# của bạn"
        en: "Kestrel: the server that runs your C# code"
      main_path: true
      duration_min: 10
      skills: [backend.http.hosting]
      prereqs: [foundation.l1.http-request-response, foundation.l1.ip-and-ports]
      related: [management.l1.how-software-gets-made]
      vocab: [kestrel]
      example_tag: stage-0
      example_files: [Caddyfile]
      outline:
      - "Kestrel is the web server built into every ASP.NET Core app; without it running, the app cannot turn a TCP connection into an HTTP request your code can handle."
      - "A static file server like Caddy in this course's setup so far returns files or a fixed canned response as-is; Kestrel instead hands each request to your own C# code, which decides what to send back."
      - "The Caddyfile this course has used through stage 0 fakes the Đơn Hàng API's responses with fixed `respond` blocks precisely because no real application exists yet — that is what this module starts building."
      - "Kestrel by itself has no routes and no business logic; it only accepts connections and produces request/response objects for other code (the hosting model, next lesson) to act on."
      misconceptions:
      - "Kestrel is a load balancer that spreads traffic across multiple servers."
      - "Any program listening on a port serves HTTP the way Kestrel does, so Kestrel isn't doing anything special."
      - "Caddy runs your C# code the same way it serves a static HTML file."
      depth_notes: "Không nói về việc Caddy có tiếp tục đứng trước Kestrel làm reverse proxy ở stage 1 hay không (quyết ở /repo-stage 1, xem open_questions) — chỉ nói Kestrel làm gì bên trong một process. Không thiết kế REST endpoint thật — module rest-api sau."
    - id: backend.l1.hosting-and-program-cs
      title:
        vi: "Program.cs: nơi một ứng dụng ASP.NET Core bắt đầu"
        en: "Program.cs: where an ASP.NET Core app starts"
      main_path: true
      duration_min: 12
      skills: [backend.http.hosting]
      prereqs: [backend.l1.what-kestrel-does]
      related: []
      vocab: [endpoint]
      example_tag: stage-1
      example_files: [DonHang.Api/Program.cs]
      outline:
      - "`WebApplication.CreateBuilder` returns a `WebApplicationBuilder`, where an ASP.NET Core app registers what it needs before it starts."
      - "Calling `builder.Build()` produces the `WebApplication`: the same object you configure the pipeline on and the object whose `Run()` call starts Kestrel."
      - "An endpoint is a method-and-path pair mapped to handler code with a call like `app.MapControllers()`; a request reaches that code only when its method and path match."
      - "Program.cs runs top to bottom once, at startup; the order most `builder.Services.Add...` calls happen in does not decide how a later request is handled, but the order `app.Use`/`app.Map` calls happen in always does (next lesson)."
      misconceptions:
      - "Program.cs only matters when the app starts; nothing in it affects how an individual request is handled later."
      - "`app.MapControllers()`'s handler code runs immediately, when that line executes, not when a matching request later arrives."
      depth_notes: "Không nói về DI container hay service lifetime (singleton/scoped/transient) — module design/dependency-injection. Không thiết kế REST resource endpoints thật cho Đơn Hàng — module rest-api sau; endpoint ở đây chỉ là ví dụ tối giản."
    - id: backend.l1.middleware-pipeline
      title:
        vi: "Middleware chạy theo đúng thứ tự bạn đăng ký"
        en: "Middleware runs in the order you register it"
      main_path: true
      duration_min: 12
      skills: [backend.http.middleware]
      prereqs: [backend.l1.hosting-and-program-cs]
      related: []
      vocab: [middleware, short-circuit]
      example_tag: stage-1
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Api/Middleware/RequestLoggingMiddleware.cs
      - DonHang.Api/Controllers/OrdersController.cs
      outline:
      - "Middleware runs in the order it is registered with `app.Use`, and any middleware can short-circuit the pipeline by writing a response and not calling the next delegate."
      - "Each middleware can run code both before it calls the next delegate (on the way in) and after that call returns (on the way out), so the first middleware registered is also usually the last to finish."
      - "An endpoint mapped with `app.MapGet` (or similar) is a terminal step: it writes a response and does not call further into the pipeline."
      misconceptions:
      - "Middleware order in the code doesn't matter — ASP.NET Core figures out the right order to run things in."
      - "Every middleware always calls the next one, so nothing can stop a request partway through the pipeline."
      depth_notes: "Không giải thích cơ chế xác thực (module auth-basics sau). Repo chưa có middleware tự short-circuit, nên bài nêu quan sát bề ngoài của UseAuthorization()/[Authorize] có sẵn (không token → 401) làm ví dụ short-circuit duy nhất. RequestLoggingMiddleware là ví dụ chính cho before/after next."
    - id: backend.l1.request-lifecycle
      title:
        vi: "Một request, từ Kestrel đến response"
        en: "One request, from Kestrel to response"
      main_path: true
      duration_min: 14
      skills: [backend.http.lifecycle]
      prereqs: [backend.l1.middleware-pipeline]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Program.cs]
      outline:
      - "A request travels in order: Kestrel accepts the TCP connection and parses it, each middleware runs in turn, the matched endpoint produces a response, then the response travels back out through the same middleware in reverse."
      - "If a middleware earlier in the pipeline short-circuits, neither the endpoint's code nor any middleware registered after it runs."
      - "Reading Program.cs top to bottom tells you the exact order every request will travel through, before you ever see one arrive."
      misconceptions:
      - "The response leaves the app the moment the endpoint's code finishes, without passing back through the middleware that ran earlier."
      - "A request that a middleware rejects never reaches any of the app's own code at all, including the middleware after it."
      depth_notes: "Không nói cụ thể logging/exception-handling middleware thật hay auth middleware — chỉ dùng ví dụ tối giản của hai bài trước để minh họa thứ tự, không đi sâu nội dung từng middleware."
  - id: rest-api
    title:
      vi: "REST: tài nguyên, method, status, và API Đơn Hàng đầu tiên"
      en: "REST: resources, methods, status codes, and the first Đơn Hàng API"
    stage: 1
    summary:
      vi: "Thiết kế và đọc được một REST endpoint theo đúng quy ước tài nguyên/method/status, và xây được GET + POST đầu tiên cho Đơn Hàng."
      en: "Design and read a REST endpoint by resource/method/status convention, and build the first real GET and POST endpoints for Đơn Hàng."
    lessons:
    - id: backend.l1.rest-resources
      title:
        vi: "URL là danh từ, method là động từ"
        en: "The URL is a noun, the method is the verb"
      main_path: true
      duration_min: 12
      skills: [backend.rest.design]
      prereqs: [backend.l1.hosting-and-program-cs, foundation.l1.http-methods]
      related: []
      vocab: [resource]
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/OrdersController.cs, DonHang.Api/Controllers/ProductsController.cs]
      outline:
      - "A REST resource is a thing named by a noun in the URL (`/api/v1/orders`, `/api/v1/products`) — never a verb; the HTTP method, not the URL, says what to do to it."
      - "A collection URL (`/api/v1/orders`) and an item URL (`/api/v1/orders/1`) are two different resources: GET on the collection returns a list, GET on the item returns one."
      - "The Đơn Hàng API groups endpoints under `/api/v1/<plural-noun>` for each resource (products, orders); `/api/v1/auth` is an exception, since signing in isn't a resource with CRUD verbs."
      - "The same URL, `/api/v1/orders/1`, means something different depending on the method: GET reads it, PUT/PATCH change it, DELETE removes it."
      misconceptions:
      - "A REST URL like `/api/v1/cancelOrder` is fine as long as it's clear what it does."
      - "Creating an order and listing orders need two different URLs, since they're different actions."
      - "The `v1` in `/api/v1/orders` refers to the version of each individual order, not the API."
      depth_notes: "Không nói về DTO/serialization (bài sau) hay filtering/pagination/versioning nâng cao — module api-design GĐ2. Không nói xử lý lỗi chi tiết — module validation-errors-logging."
    - id: backend.l1.dtos-and-serialization
      title:
        vi: "DTO: hình dạng dữ liệu trên dây, không phải bên trong server"
        en: "DTOs: the shape of data on the wire, not inside the server"
      main_path: true
      duration_min: 10
      skills: [backend.rest.contracts]
      prereqs: [backend.l1.rest-resources]
      related: []
      vocab: [dto]
      example_tag: stage-1
      example_files: [DonHang.Api/Dtos.cs]
      outline:
      - "A DTO (data transfer object) is a plain type shaped for the wire — only the fields a client needs — kept separate from whatever internal type the server uses."
      - "An endpoint that returns a DTO gets it serialized to JSON automatically; the DTO's property names become the JSON's field names."
      - "A request body is deserialized into a DTO the same way a response is serialized from one — both directions go through the same kind of mapping."
      - "Returning a DTO instead of an internal type lets the server's internal shape change later without changing what a client already depends on."
      misconceptions:
      - "Returning the same class the server uses internally is simpler and just as safe as writing a DTO."
      - "A JSON field's name always matches a C# property name exactly, with nothing to configure."
      depth_notes: "Không nói về validation attribute hay error shape (RFC 9457) — module validation-errors-logging. Không nói mapping tự động (AutoMapper hay tương tự) — chỉ mapping tay."
    - id: backend.l1.get-and-status-codes
      title:
        vi: "GET và đúng status code: 200 hay 404"
        en: "GET and the right status code: 200 or 404"
      main_path: true
      duration_min: 14
      skills: [backend.rest.crud]
      prereqs: [backend.l1.dtos-and-serialization]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/ProductsController.cs]
      outline:
      - "`GET /api/v1/products` returns `200` with a JSON array of product DTOs; an empty list is still `200`, not `404`."
      - "`GET /api/v1/products/{id}` returns `200` with one product DTO when found, and `404` with no product data when the id doesn't exist."
      - "Reading a resource never changes it — a GET endpoint must not have side effects, matching the safe, idempotent method it already knows from HTTP methods."
      misconceptions:
      - "An empty list from a GET should be a 404, since there's 'nothing there'."
      - "A GET endpoint can also update something as a side effect, as long as it still returns data."
      depth_notes: "Không giải thích db.Products/EF Core bên trong ProductsController (module orm-efcore sau) — bài này chỉ nhìn vào method GET và status code nó trả về, không phải cách dữ liệu được lấy. Không nói phân trang/lọc — module api-design GĐ2."
    - id: backend.l1.creating-a-resource
      title:
        vi: "POST tạo tài nguyên: 201 và Location"
        en: "POST creates a resource: 201 and Location"
      main_path: true
      duration_min: 14
      skills: [backend.rest.crud]
      prereqs: [backend.l1.get-and-status-codes]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "`POST /api/v1/orders` creates a new order and returns `201` with a `Location` header pointing at the new order's own URL."
      - "The response body of a successful `POST` is the DTO of the resource just created, including the id the server assigned — the client never chooses it."
      - "`POST` is not idempotent: sending the same request twice creates two orders, unlike the safe, idempotent `GET` from the previous lesson."
      misconceptions:
      - "A successful POST should return 200, the same as a successful GET."
      - "The client can send its own id for the new order and the server should just use it."
      depth_notes: "Không kiểm tra dữ liệu đầu vào chi tiết — module validation-errors-logging. Không giải thích OrderService/repository lưu đơn thế nào — module orm-efcore. `Create` có `[Authorize]`: Try it cần đăng nhập lấy token trước, không phải POST ẩn danh."
    - id: backend.l1.rest-for-writes
      title:
        vi: "PUT, PATCH, DELETE: thay hẳn, sửa một phần, hay xóa"
        en: "PUT, PATCH, DELETE: replace, partly change, or remove"
      main_path: true
      duration_min: 10
      skills: [backend.rest.design]
      prereqs: [backend.l1.creating-a-resource]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "`PUT` replaces a resource entirely and is idempotent: sending the same `PUT` twice leaves the order in the same end state either time."
      - "`PATCH` changes part of a resource (for example, just its status) without the client resending fields that aren't changing."
      - "`DELETE` removes a resource and a successful call returns `204` with no body; `DELETE` is idempotent because repeating it has the same end effect as calling it once — the resource ends up gone either way."
      misconceptions:
      - "PATCH and PUT are interchangeable as long as the URL is the same."
      - "DELETE isn't idempotent, because the second call can't do anything — the resource is already gone."
      depth_notes: "Chỉ `PATCH /api/v1/orders/{id}/cancel` (Cancel) có thật, minh họa PATCH sửa một phần. Không có PUT/DELETE thật cho Đơn Hàng ở GĐ1 — dạy ngữ nghĩa PUT/DELETE bằng lời, không trích code. Không hứa endpoint sửa/hủy khác."
  - id: orm-efcore
    title:
      vi: "ORM và EF Core: mapping, migration, N+1"
      en: "ORM and EF Core: mapping, migrations, N+1"
    stage: 1
    summary:
      vi: "Đọc và viết được mapping EF Core cho schema Đơn Hàng đã có, hiểu migration là gì, và tránh được lỗi N+1."
      en: "Read and write an EF Core mapping for the existing Đơn Hàng schema, know what a migration is, and avoid the N+1 problem."
    lessons:
    - id: backend.l1.efcore-mapping
      title:
        vi: "DbContext ánh xạ class sang bảng, không phải ngược lại"
        en: "A DbContext maps classes to tables, not the other way around"
      main_path: true
      duration_min: 12
      skills: [backend.ef.mapping]
      prereqs: [backend.l1.get-and-status-codes, foundation.l1.tables-keys-relations]
      related: []
      vocab: [orm]
      example_tag: stage-1
      example_files: [DonHang.Infrastructure/DonHangDbContext.cs, DonHang.Domain/Entities.cs]
      outline:
      - "A `DbContext` maps C# entity classes to database tables; a `DbSet<Product>` on it represents the `products` table as a queryable collection of `Product` objects."
      - "EF Core's default naming expects PascalCase (`Products`, `PriceVnd`); the Đơn Hàng database uses snake_case (`products`, `price_vnd`), so `OnModelCreating` configures each name explicitly via Fluent API `HasColumnName`."
      - "The `Product` class the API queries against matches the shape `db/schema.sql`'s `products` table already has — the mapping targets an existing schema, not a new one."
      misconceptions:
      - "EF Core automatically figures out that `PriceVnd` in C# means the same thing as `price_vnd` in the database."
      - "A `DbSet<Product>` is just a `List<Product>` that happens to load from a file."
      depth_notes: "Không nói vì sao entity/DbContext nằm ở project riêng (DonHang.Domain/Infrastructure) — module layered sau. Không nói composite key hay navigation property — bài sau."
    - id: backend.l1.efcore-relationships-and-keys
      title:
        vi: "Khóa ngoại thành navigation property, và một khóa kết hợp"
        en: "A foreign key becomes a navigation property, and one composite key"
      main_path: true
      duration_min: 14
      skills: [backend.ef.mapping]
      prereqs: [backend.l1.efcore-mapping]
      related: []
      vocab: [composite-key]
      example_tag: stage-1
      example_files: [DonHang.Infrastructure/DonHangDbContext.cs, DonHang.Domain/Entities.cs]
      outline:
      - "A foreign key like `orders.customer_id` becomes a navigation property in C# (`order.Customer`), so code can follow the relationship without writing a JOIN by hand."
      - "`order_items` has no single-column primary key; its key is the pair `(order_id, product_id)`, so its mapping configures a composite key instead of relying on a single `Id`."
      - "A composite key means no one property alone identifies a row — EF Core needs both values together to find or update one `order_items` row."
      misconceptions:
      - "Every table EF Core maps needs a single column called `Id`, or EF Core can't work with it."
      - "Once a foreign key column exists, `order.Customer` works immediately, without EF Core needing any extra configuration."
      depth_notes: "Không nói lazy loading hay Include — bài efcore-n-plus-one sau. Không nói cascade delete hay ràng buộc xóa quan hệ — ngoài phạm vi GĐ1."
    - id: backend.l1.migrations
      title:
        vi: "Migration: thay đổi schema có phiên bản, có trong code"
        en: "Migrations: versioned schema changes, tracked in code"
      main_path: true
      duration_min: 12
      skills: [backend.ef.migrations]
      prereqs: [backend.l1.efcore-relationships-and-keys]
      related: []
      vocab: [migration]
      example_tag: stage-1
      example_files:
      - DonHang.Infrastructure/MigrationBaseline.cs
      - DonHang.Infrastructure/Migrations/20260923154700_AddPasswordHashToCustomers.cs
      outline:
      - "A migration is a versioned, code-tracked description of one schema change, created with `dotnet ef migrations add` and applied with `dotnet ef database update` (or, here, `Database.Migrate()` on startup)."
      - "`db/schema.sql` still creates the tables when a fresh container starts; `MigrationBaseline` marks EF's first migration, `InitialCreate` (matching `db/schema.sql` exactly), as already applied, so `Migrate()` doesn't recreate what exists."
      - "Because a migration is a file in the repository, a schema change goes through code review like any other change, instead of being a manual step someone runs by hand."
      misconceptions:
      - "A migration is a backup of the database, not something that changes its structure."
      - "Since the database already has the right tables, this API doesn't need any migrations at all."
      depth_notes: "Không nói migration chạy tự động trong CI/CD khi deploy — module devops GĐ2. Không nói rollback hay migration xung đột giữa nhiều nhánh — ngoài phạm vi GĐ1."
    - id: backend.l1.querying-with-linq
      title:
        vi: "LINQ dịch thành SQL, không chạy trong C#"
        en: "LINQ compiles to SQL, it doesn't run in C#"
      main_path: true
      duration_min: 14
      skills: [backend.ef.querying]
      prereqs: [backend.l1.migrations, foundation.l1.sql-join]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Infrastructure/EfOrderRepository.cs]
      outline:
      - "A LINQ query against a `DbSet`, like `db.Orders.Where(o => o.CustomerId == customerId)`, is translated into one SQL query — the filter runs in PostgreSQL, not in C# after loading every row."
      - "A LINQ query only reaches the database once it's enumerated (`.ToListAsync()`, `.FirstOrDefaultAsync()`); writing `db.Orders.Where(...)` alone does not run it yet."
      - "Joining two `DbSet`s in LINQ (an order and its customer, via `.Include(o => o.Customer)`) produces the same kind of JOIN already familiar from writing SQL directly, just expressed as chained C# calls."
      misconceptions:
      - "A LINQ query loads every row into memory first, and `.Where(...)` filters the C# list afterward."
      - "Writing `db.Orders.Where(o => o.CustomerId == customerId)` runs the query immediately, the moment that line executes, rather than when `.ToListAsync()` is awaited."
      depth_notes: "Không nói query plan hay index (đã dạy bằng SQL thô ở GĐ0) — bài indexes-and-plans GĐ2 nối lại với EF Core. Không nói AsNoTracking hay performance tuning — GĐ2."
    - id: backend.l1.saving-changes
      title:
        vi: "SaveChangesAsync: chưa gọi thì chưa ghi"
        en: "SaveChangesAsync: nothing is written until you call it"
      main_path: true
      duration_min: 14
      skills: [backend.ef.persistence]
      prereqs: [backend.l1.querying-with-linq, backend.l1.creating-a-resource]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Domain/OrderService.cs, DonHang.Infrastructure/EfOrderRepository.cs]
      outline:
      - "Calling `db.Orders.AddAsync(order)` only stages the new order in the DbContext's change tracker; nothing reaches the database until `SaveChangesAsync()` runs."
      - "`SaveChangesAsync()` wraps every staged change in one transaction: all of them succeed together, or none do."
      - "The two-step shape behind `POST /api/v1/orders` (met in `creating-a-resource`): `PlaceOrderAsync` calls `AddAsync(order)` then `SaveChangesAsync()` — the id only exists after that second call."
      misconceptions:
      - "`db.Orders.AddAsync(order)` writes the order to the database immediately."
      - "If one of several staged changes fails when saving, the others that already succeeded stay saved."
      depth_notes: "Không nói isolation level hay xung đột khi nhiều người sửa cùng lúc — module transactions-in-practice GĐ2. Không validate dữ liệu trước khi lưu — module validation-errors-logging."
    - id: backend.l1.efcore-n-plus-one
      title:
        vi: "N+1: một vòng lặp, N+1 lượt gọi DB"
        en: "N+1: one loop, N+1 round trips to the database"
      main_path: true
      duration_min: 14
      skills: [backend.ef.querying]
      prereqs: [backend.l1.querying-with-linq, backend.l1.saving-changes]
      related: []
      vocab: [n-plus-one, eager-loading]
      example_tag: stage-1
      example_files: [DonHang.Infrastructure/EfOrderRepository.cs, DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "Looping over a list of orders and querying each order's customer separately inside the loop sends one query per order, plus the original one — the N+1 problem."
      - "`.Include(o => o.Customer)` tells EF Core to fetch the related customers in the same query — an eager-loading JOIN — instead of one query per order; `ListByCustomerAsync` uses exactly this."
      - "N+1 is easy to miss with a handful of rows and expensive once the Đơn Hàng database holds thousands of orders: the query count grows with the data, not with the code."
      misconceptions:
      - "Accessing `order.Customer` inside a loop is always fast, since the data is already on the `order` object."
      - "N+1 only matters at a scale this course's example database will never reach."
      depth_notes: "`GET /api/v1/orders` (thêm cho bài này, DECISIONS.md 2026-09-24) trả `.Include` thật; bản 'xấu' chỉ minh họa bằng sửa tạm working tree. Không đo EXPLAIN/benchmark thật — GĐ2. Không nói caching — GĐ2."
  - id: validation-errors-logging
    title:
      vi: "Validation, lỗi, và logging có cấu trúc"
      en: "Validation, errors, and structured logging"
    stage: 1
    summary:
      vi: "Trả đúng status/hình dạng cho mọi lỗi của API Đơn Hàng, validate trước khi lưu, và ghi log tìm lại được."
      en: "Return the right status and shape for every Đơn Hàng API failure, validate before saving, and log in a way that's findable later."
    lessons:
    - id: backend.l1.errors-and-problem-details
      title:
        vi: "Một hình dạng cho mọi lỗi: Problem Details"
        en: "One shape for every error: Problem Details"
      main_path: true
      duration_min: 12
      skills: [backend.errors.shape]
      prereqs: [backend.l1.creating-a-resource, foundation.l1.http-status-codes]
      related: []
      vocab: [problem-details]
      example_tag: stage-0
      example_files: [Caddyfile]
      outline:
      - "RFC 9457 defines a JSON shape for error responses — `type`, `title`, `status`, `detail` — so every error looks the same no matter which endpoint produced it."
      - "A Problem Details response still uses the same status code the endpoint would return anyway (`400`, `404`, `409`); the shape is what's new, not the status code."
      - "Without a shared shape, each endpoint invents its own error JSON, like the Caddyfile's fixed `{\"error\":\"order not found\"}` from earlier lessons — fine for one fake response, not for a real API with many failure kinds."
      misconceptions:
      - "Problem Details is its own status code, separate from 400/404/etc."
      - "Only server errors (500) need a structured error body; a 400 can just say `{\"error\": \"bad request\"}`."
      depth_notes: "Không nói validate cụ thể hay exception-handling middleware — hai bài sau. Chỉ định nghĩa hình dạng response lỗi."
    - id: backend.l1.validating-input
      title:
        vi: "Validate trước khi lưu: SaveChangesAsync không phải chỗ để bắt lỗi"
        en: "Validate before saving: SaveChangesAsync isn't where you catch mistakes"
      main_path: true
      duration_min: 14
      skills: [backend.errors.validation]
      prereqs: [backend.l1.errors-and-problem-details, backend.l1.saving-changes]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [db/schema.sql]
      outline:
      - "`orders.customer_id` already has a foreign key and `order_items.quantity` already has `CHECK (quantity > 0)` in `db/schema.sql` — the database rejects a bad value either way, but as a raw database error, not a clean `400`."
      - "'At least one item' is a rule no single column's `CHECK` can express: only application code sees the whole list of items at once, so the endpoint checks it explicitly."
      - "`POST /api/v1/orders` checks what it can before calling `SaveChangesAsync()`; on failure it returns `400` with a Problem Details body naming which field was wrong."
      misconceptions:
      - "Letting the database reject bad data with its own constraints is enough; a 400 needs no separate check in the endpoint."
      - "A validation failure should still return 201, with an error field in the body explaining what went wrong."
      depth_notes: "Không dùng thư viện validation cụ thể — kiểm tra thủ công, rõ ràng cho junior. Không nói uniqueness check phức tạp hay validate bất đồng bộ — ngoài phạm vi GĐ1."
    - id: backend.l1.choosing-an-error-status
      title:
        vi: "400, 404, hay 409: chọn đúng cho từng kiểu lỗi"
        en: "400, 404, or 409: the right status for each kind of failure"
      main_path: true
      duration_min: 12
      skills: [backend.errors.validation]
      prereqs: [backend.l1.validating-input, backend.l1.creating-a-resource]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Domain/OrderService.cs]
      outline:
      - "A request that's malformed or fails validation (a missing field, a quantity of zero) is `400`; a request that's well-formed but names something that doesn't exist (`/api/v1/orders/999`) is `404`."
      - "A request that's well-formed and real, but conflicts with the resource's current state (cancelling an order that already shipped), is `409` — nothing about the request itself was wrong."
      - "Every one of these still returns a Problem Details body, so a client always parses errors the same way and only `status`/`title`/`detail` differ."
      misconceptions:
      - "404 and 400 are interchangeable for 'something about this request didn't work'."
      - "A conflict, like cancelling an already-shipped order, should be 400, since the client's request was 'wrong'."
      depth_notes: "Không nói idempotency key hay optimistic concurrency (ETag/If-Match) — ngoài phạm vi GĐ1. Ví dụ hủy đơn shipped minh họa 409 dưới dạng GIẢ ĐỊNH: `CancelOrderAsync` chưa check shipped (gap của management.l1.reading-a-300-line-pr) — không khẳng định 409 thật tồn tại."
    - id: backend.l1.structured-logging
      title:
        vi: "Log theo field, không phải theo câu văn"
        en: "Log by field, not by sentence"
      main_path: true
      duration_min: 12
      skills: [backend.errors.logging]
      prereqs: [backend.l1.validating-input, foundation.l2.debugger-and-logging]
      related: []
      vocab: [structured-logging]
      example_tag: stage-1
      example_files:
      - DonHang.Infrastructure/LoggingNotifier.cs
      - DonHang.Api/Middleware/RequestLoggingMiddleware.cs
      outline:
      - "A structured log writes each piece of information (the order id, the outcome) as its own named field, not interpolated into one free-text sentence."
      - "A structured log line about a failed order stays filterable by field (`orderId=41`), where a string like `\"Order 41 failed\"` only supports a text search."
      - "A second call site, `RequestLoggingMiddleware`, logs method, path, status, elapsed time as four more fields, independent of order id — only for requests completing without throwing; failures are `exception-handling-middleware`'s subject."
      misconceptions:
      - "Logging is `Console.WriteLine` with more steps; the format doesn't matter as long as a human can read it."
      - "A log message with the order id typed into the sentence (`$\"Order {id} failed\"`) already counts as structured logging."
      depth_notes: "Không nói log aggregation tập trung (Loki) hay dashboard — module devops GĐ2. Không nói log level chi tiết (khi nào Warning vs Error) — chỉ giới thiệu field có cấu trúc."
    - id: backend.l1.exception-handling-middleware
      title:
        vi: "Middleware bắt exception: log rồi mới trả 500"
        en: "The exception-handling middleware: log, then respond 500"
      main_path: true
      duration_min: 14
      skills: [backend.errors.logging]
      prereqs:
      - backend.l1.structured-logging
      - backend.l1.middleware-pipeline
      - backend.l1.validating-input
      - backend.l1.choosing-an-error-status
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs]
      outline:
      - "An exception-handling middleware, registered first in the pipeline, catches exceptions later code throws; any exception it doesn't have a specific case for becomes a generic `500` Problem Details response."
      - "Without this middleware, an unhandled exception either produces the host's own bare `500` with no detail, or in Development leaks the exception's own type, message, and stack trace straight to the client."
      - "The middleware logs the exception, structured, before writing the response, so the failure is findable even though the client only sees a generic `500` message."
      misconceptions:
      - "An exception an endpoint doesn't catch just means that one request fails silently; nothing else needs to run."
      - "Logging the exception and returning a response to the client are the same step; doing one does the other."
      depth_notes: "Không nói retry hay circuit breaker khi lỗi — module resilience GĐ3. Middleware này là middleware thật đã hứa tái dùng ở module web-server (không viết middleware minh họa mới)."
  - id: auth-basics
    title:
      vi: "Auth cơ bản: hash mật khẩu, session, JWT"
      en: "Auth basics: password hashing, sessions, JWT"
    stage: 1
    summary:
      vi: "Hash mật khẩu an toàn, hiểu session vs token, phát hành và kiểm JWT, và bảo vệ một endpoint bằng cả authentication lẫn authorization."
      en: "Hash passwords safely, understand sessions vs tokens, issue and validate a JWT, and protect an endpoint with both authentication and authorization."
    lessons:
    - id: backend.l1.hashing-passwords
      title:
        vi: "Không bao giờ lưu mật khẩu, chỉ lưu hash của nó"
        en: "Never store the password, only its hash"
      main_path: true
      duration_min: 14
      skills: [backend.auth.passwords]
      prereqs: [backend.l1.migrations, backend.l1.validating-input]
      related: []
      vocab: [password-hash, authentication]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/PasswordHasher.cs
      - DonHang.Infrastructure/Migrations/20260923154700_AddPasswordHashToCustomers.cs
      outline:
      - "Authentication answers 'who is making this request'; storing a password lets the API check that a login attempt is really from the account it claims to be."
      - "A password is never stored as the text the customer typed; `Rfc2898DeriveBytes.Pbkdf2` turns it into a password hash, a one-way transformation that can be checked against but not reversed."
      - "Checking a login means hashing the password just typed, with the same salt, and comparing that result to the stored hash — never comparing the typed password to anything directly."
      - "`customers` gets a new `password_hash` column through a real migration, the first schema change since baseline; the five seeded customers are backfilled with a hash, never the password — no registration endpoint yet hashes a new one."
      misconceptions:
      - "Encrypting a password, so it can be decrypted later, is just as safe as hashing it."
      - "Storing the password as typed is fine as long as nobody knows which column it sits in."
      depth_notes: "Không nói chi tiết thuật toán salt/pepper hay rainbow table — đủ độ sâu junior. Không nói OAuth2/OIDC — GĐ2."
    - id: backend.l1.sessions-vs-tokens
      title:
        vi: "Session hay token: ai nhớ bạn đã đăng nhập"
        en: "Session or token: who remembers you're logged in"
      main_path: true
      duration_min: 13
      skills: [backend.auth.sessions-and-tokens]
      prereqs: [backend.l1.hashing-passwords, foundation.l1.cookies-and-state]
      related: []
      vocab: [session]
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/AuthController.cs]
      outline:
      - "Session-based auth: after login the server creates a session record and gives the browser a cookie holding just the session's id; every later request's cookie says which session to look up."
      - "Token-based auth: after login the server gives the client a self-contained token holding who they are; the server stores nothing and re-checks the token itself on every request."
      - "A session needs server-side storage that grows with logged-in users; a token needs none, at the cost of being harder to revoke before it expires."
      - "The Đơn Hàng API uses token-based login (the token's format is the next lesson), so it keeps no login state — no session store to keep in sync if more than one instance of it runs later."
      misconceptions:
      - "A cookie always means session-based auth; a token is always sent some other way."
      - "Token-based auth is strictly better than session-based auth, so no real system still uses sessions."
      depth_notes: "Không nói refresh token hay revocation chi tiết — bài validating-a-jwt và module oauth-and-authz GĐ2. Chỉ so sánh hai mô hình."
    - id: backend.l1.issuing-a-jwt
      title:
        vi: "Header, payload, signature: phát hành một JWT"
        en: "Header, payload, signature: issuing a JWT"
      main_path: true
      duration_min: 14
      skills: [backend.auth.jwt-issuing]
      prereqs: [backend.l1.sessions-vs-tokens]
      related: []
      vocab: [jwt]
      example_tag: stage-1
      example_files: [DonHang.Api/JwtTokenService.cs]
      outline:
      - "A JWT has three parts separated by dots: a header, a payload of claims (who this is, when it expires), and a signature proving the API itself issued it."
      - "A login endpoint that verifies a password hash correctly creates a JWT, signs it with a signing key only the API holds, and returns it — nothing about the token is stored server-side."
      - "The payload is readable by anyone who has the token (it's encoded, not encrypted); the signature is what a client cannot forge, not the payload's contents."
      misconceptions:
      - "A JWT's payload is encrypted, so its claims can't be read without the API's signing key."
      - "Anyone who can read a JWT's payload could also produce a valid one, since both just need the same JSON."
      depth_notes: "Không nói asymmetric signing (RS256) hay refresh token — GĐ2. Không nói cách lưu secret an toàn — module config-and-secrets sau; secret coi như đã có sẵn trong config. Chỉ HMAC-signed JWT đơn giản."
    - id: backend.l1.validating-a-jwt
      title:
        vi: "401: API không biết bạn là ai"
        en: "401: the API doesn't know who you are"
      main_path: true
      duration_min: 13
      skills: [backend.auth.jwt-validating]
      prereqs: [backend.l1.issuing-a-jwt, backend.l1.middleware-pipeline]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Api/Program.cs, DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "`UseAuthentication` reads the `Authorization: Bearer` header on every request and checks signature and expiry, but only records who the caller is; it rejects nothing by itself."
      - "Marking an endpoint `[Authorize]` makes `UseAuthorization` short-circuit with `401` when no valid caller was established, before the endpoint runs; an endpoint without it answers even a bad token."
      - "`401` means the API doesn't know who's asking; it is not the status for 'the API knows who you are, but you can't do this' — that's the next lesson."
      misconceptions:
      - "A JWT that's expired still works as long as the signature is valid."
      - "401 and 403 both mean roughly 'not allowed', so either one is fine for a missing or invalid token."
      depth_notes: "Không nói refresh token hay logout (JWT không 'thu hồi' được như session) — GĐ2. Bài sau nói 403 và authorization."
    - id: backend.l1.protecting-an-endpoint
      title:
        vi: "403: biết bạn là ai rồi, nhưng không được làm việc này"
        en: "403: the API knows who you are, but not this"
      main_path: true
      duration_min: 14
      skills: [backend.auth.authorization]
      prereqs: [backend.l1.validating-a-jwt, backend.l1.choosing-an-error-status]
      related: []
      vocab: [authorization]
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "Authorization is a second question, asked only after authentication succeeds: now that the API knows who this is, is this specific action allowed for them?"
      - "`GET /api/v1/orders/{id}` should answer `403` when the order belongs to a different customer; at stage-1 nothing checks this, so any caller reads any order, while `List` already returns only the caller's own."
      - "Authentication answers 'who are you' once, at the middleware; authorization answers 'can you do this', per endpoint or per resource, using who the middleware already identified."
      misconceptions:
      - "If a request has a valid token, it should be allowed to do anything any logged-in customer can do."
      - "Authorization is the same check as authentication, just run a second time."
      depth_notes: "Không nói RBAC/ABAC hay policy phức tạp — module oauth-and-authz GĐ2. Chỉ một kiểm tra sở hữu đơn giản (order thuộc đúng customer)."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: api-design
    title:
      vi: "Thiết kế API: phân trang, lọc, versioning, hợp đồng"
      en: "API design: pagination, filtering, versioning, contracts"
    stage: 2
    summary:
      vi: "Mở rộng API Đơn Hàng mà client cũ vẫn chạy: trả collection theo trang, lọc bằng query parameter, đổi hợp đồng có version, lỗi phân biệt được bằng type, mô tả API bằng OpenAPI, và POST an toàn khi gửi lại."
      en: "Grow the Đơn Hàng API without breaking existing clients: page and filter collections, version breaking changes, give errors a machine-readable type, describe the API with OpenAPI, and make a POST safe to retry."
    lessons:
    - id: backend.l2.offset-pagination
      title:
        vi: "Đừng trả cả bảng: phân trang bằng limit và offset"
        en: "Never return the whole table: limit and offset pages"
      main_path: true
      duration_min: 13
      skills: [backend.api.pagination]
      prereqs: [backend.l1.get-and-status-codes, backend.l1.querying-with-linq]
      related: []
      vocab: [pagination, query-parameter]
      example_tag: stage-2
      example_files: [DonHang.Api/Controllers/ProductsController.cs]
      outline:
      - "A collection endpoint that returns every row sends a response that grows with the table; pagination returns one page at a time, and the client asks for the next page when it needs it."
      - "With offset pagination the client sends a page size and how many rows to skip as query parameters, such as `?limit=20&offset=40`, and EF Core turns `Take` and `Skip` into `LIMIT` and `OFFSET` in the SQL it sends to PostgreSQL."
      - "Pages need a fixed order: without `ORDER BY` on a unique column, PostgreSQL may return rows in a different order on each query, so two pages can overlap or miss a row."
      - "The Đơn Hàng endpoint accepts a `limit` of at most 100 and answers `400` to a larger one, so a client cannot ask for the whole table by sending a very large `limit`."
      misconceptions:
      - "Pagination is the app's job; the API can return everything and the app shows 20 at a time."
      - "Without an ORDER BY, the database returns rows in the order they were inserted, so pages are stable anyway."
      depth_notes: "Không nói cursor pagination — bài sau. Không nói lọc — bài filtering. Không nói đếm tổng số dòng (total count) và chi phí của nó — ngoài phạm vi GĐ2."
    - id: backend.l2.cursor-pagination
      title:
        vi: "Vì sao trang offset bị lặp hay sót dòng, và cursor sửa thế nào"
        en: "Why offset pages repeat or skip rows, and what a cursor fixes"
      main_path: true
      duration_min: 14
      skills: [backend.api.pagination]
      prereqs: [backend.l2.offset-pagination, foundation.l1.sql-index-intro]
      related: []
      vocab: [cursor-pagination]
      example_tag: stage-2
      example_files: [DonHang.Api/Controllers/OrdersController.cs, DonHang.Infrastructure/EfOrderRepository.cs]
      outline:
      - "Offset pagination counts from the start on every request, so if a row is inserted or deleted before the current position between two requests, the next page repeats a row or skips one."
      - "Cursor pagination asks for the rows after the last one the client saw, such as `?after=120&limit=20` with orders sorted by id, so a change to rows already passed does not shift the next page."
      - "With an index on the sort column, PostgreSQL can start reading at the cursor position, while a large `OFFSET` still reads and throws away every skipped row first."
      - "Cursor pagination only moves to the next page and cannot jump to page 50, which suits a list the user scrolls through better than numbered pages."
      misconceptions:
      - "Cursor pagination is only a speed trick; it returns exactly the same pages as offset pagination."
      - "A cursor means the server keeps a database cursor open between the client's requests."
      depth_notes: "Không nói cursor mã hóa (opaque, base64) hay sort nhiều cột — ngoài phạm vi GĐ2; bài dùng id làm cursor. Không đọc query plan — module indexes-and-plans."
    - id: backend.l2.filtering-with-query-parameters
      title:
        vi: "Lọc bằng query parameter trên cùng URL, không thêm endpoint"
        en: "Filter with query parameters on the same URL, not new endpoints"
      main_path: true
      duration_min: 12
      skills: [backend.api.filtering]
      prereqs: [backend.l2.offset-pagination]
      related: []
      vocab: []
      example_tag: stage-2
      example_files: [DonHang.Api/Controllers/ProductsController.cs]
      outline:
      - "A filter narrows a collection with query parameters on the same URL, such as `GET /api/v1/products?maxPriceVnd=500000`, because the resource is still the product collection, not a new resource per filter."
      - "The endpoint adds the filter to the database query with `Where` before the query runs, so PostgreSQL returns only matching rows instead of the server loading every product and filtering in C#."
      - "A filter value that cannot be read as the declared type, such as `maxPriceVnd=abc`, makes an `[ApiController]` endpoint answer `400` with Problem Details before the action runs; a query parameter the endpoint does not declare is ignored."
      - "Filters and pagination combine: the filter decides which rows qualify, and the page is cut from the rows that are left."
      misconceptions:
      - "Each filter needs its own endpoint, like `/api/v1/products/cheap`."
      - "Loading all products and filtering them in C# is fine, because the product list is small."
      depth_notes: "Không nói sắp xếp tùy chọn (sort parameter), tìm kiếm toàn văn hay ngôn ngữ truy vấn kiểu OData — ngoài phạm vi GĐ2."
    - id: backend.l2.breaking-changes
      title:
        vi: "Thay đổi nào làm hỏng client đang chạy"
        en: "Which API changes break a client that already works"
      main_path: true
      duration_min: 12
      skills: [backend.api.versioning]
      prereqs: [backend.l1.dtos-and-serialization, frontend.l1.fetching-with-http-package]
      related: []
      vocab: [breaking-change]
      example_tag: stage-1
      example_files: [DonHang.Api/Dtos.cs, DonHang.App/lib/models.dart]
      outline:
      - "A change breaks a client when a request that used to work now fails, or a response loses or changes something the client reads: removing or renaming a field, changing a field's type, or making an optional request field required."
      - "`Product.fromJson` in `DonHang.App` reads `id`, `name` and `priceVnd` by name, so renaming `priceVnd` in the API's DTO breaks the app even though the value is the same."
      - "Adding a field to a response is not a breaking change for a client that reads only the fields it knows, as `Product.fromJson` does."
      - "The server cannot see which fields each client reads, so a change counts as breaking if any existing client could rely on what it removes or changes."
      misconceptions:
      - "Renaming a field is safe as long as its value stays the same."
      - "Adding a field to a response breaks every client."
      depth_notes: "Không nói cách phát hành thay đổi phá vỡ (version) — bài sau. Không nói hợp đồng dạng tài liệu (OpenAPI) — bài openapi-contract."
    - id: backend.l2.api-versioning
      title:
        vi: "Khi buộc phải phá vỡ: /api/v2 chạy song song /api/v1"
        en: "When a break is unavoidable: /api/v2 alongside /api/v1"
      main_path: true
      duration_min: 13
      skills: [backend.api.versioning]
      prereqs: [backend.l2.breaking-changes]
      related: []
      vocab: [api-versioning]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Api/Controllers/V2/OrdersV2Controller.cs
      - DonHang.Api/Dtos.cs
      outline:
      - "When a breaking change cannot be avoided, the API publishes the new shape under a new version, such as `/api/v2/orders`, and keeps `/api/v1/orders` answering exactly as before, so existing clients keep working."
      - "The version in the URL belongs to the whole API contract, not to one resource or one record."
      - "In Đơn Hàng, both versions call the same service; only the controller and the DTO differ, so the business rules are not copied."
      - "Every version the API keeps is code the team runs and tests, so an old version is retired on a date announced to its clients rather than kept forever or removed without notice."
      misconceptions:
      - "Every change, even adding a field, needs a new version."
      - "Once v2 exists, v1 can be removed straight away."
      depth_notes: "Chỉ versioning bằng URL (quy ước của Đơn Hàng); không so sánh version qua header, query hay media type, không dùng thư viện versioning — ngoài phạm vi GĐ2."
    - id: backend.l2.problem-types
      title:
        vi: "Trường type: phân biệt hai lỗi cùng status code"
        en: "The type field: telling apart two errors with one status code"
      main_path: true
      duration_min: 12
      skills: [backend.errors.shape]
      prereqs: [backend.l1.errors-and-problem-details, backend.l1.choosing-an-error-status]
      related: []
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Domain/Entities.cs
      outline:
      - "The `type` member of a Problem Details body is a URI that names the kind of problem, and RFC 9457 makes it the primary identifier a client should use to tell problems apart, not the human-readable `title` or `detail`."
      - "When `type` is absent it is treated as `about:blank`, which means the problem says no more than its status code."
      - "In Đơn Hàng, cancelling an order that is already `cancelled` and cancelling one that is `shipped` both answer `409`, with different `type` values, so a client can react to each differently."
      - "Extra members beyond the standard ones, called extensions, can carry details such as the order id, and a client must ignore extensions it does not recognise."
      misconceptions:
      - "A client should compare the `title` text to tell one error from another."
      - "Two errors with the same status code are the same error."
      depth_notes: "Không dạy lại năm trường chuẩn của Problem Details — đã có ở backend.l1.errors-and-problem-details. Không nói bản địa hóa title/detail — ngoài phạm vi GĐ2."
    - id: backend.l2.openapi-contract
      title:
        vi: "OpenAPI: hợp đồng API sinh ra từ chính code"
        en: "OpenAPI: an API contract generated from the code itself"
      main_path: true
      duration_min: 12
      skills: [backend.api.contract]
      prereqs: [backend.l2.api-versioning]
      related: []
      vocab: [openapi]
      example_tag: stage-2
      example_files: [DonHang.Api/Program.cs, scripts/backend/openapi-document.sh]
      outline:
      - "An OpenAPI document is a machine-readable description of an API's endpoints, parameters and request and response shapes, written in JSON or YAML."
      - "In ASP.NET Core 10, `AddOpenApi` and `MapOpenApi` from the `Microsoft.AspNetCore.OpenApi` package build the document from the controllers and DTOs at run time and serve it, by default at `/openapi/v1.json`."
      - "Because the document is generated from the code, it changes when the code changes, so clients and tools read it instead of guessing the contract from examples."
      - "The `v1` in `/openapi/v1.json` is the name of the document, not the `/api/v1` prefix of the URLs; the name only happens to match, and Đơn Hàng's one document lists `/api/v2` too."
      misconceptions:
      - "An OpenAPI document is written by hand and has to be kept in sync with the code separately."
      - "OpenAPI is a web page for people to click through the endpoints."
      depth_notes: "Không dựng giao diện xem tài liệu (Swagger UI hay tương tự), không sinh client code từ tài liệu — ngoài phạm vi GĐ2. Không đi vào cấu trúc chi tiết của đặc tả OpenAPI."
    - id: backend.l2.idempotent-endpoints
      title:
        vi: "Gửi lại POST mà không tạo hai đơn: idempotency key"
        en: "Retrying a POST without a second order: idempotency keys"
      main_path: true
      duration_min: 14
      skills: [backend.api.idempotency]
      prereqs: [backend.l1.creating-a-resource, foundation.l1.transaction-intro]
      related: []
      vocab: [idempotency-key]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Infrastructure/DonHangDbContext.cs
      - scripts/backend/idempotent-order.sh
      outline:
      - "A client whose `POST /api/v1/orders` times out cannot tell whether the order was created, and sending the same `POST` again can create a second order."
      - "An idempotency key is a unique value the client creates once per intended order and sends in the `Idempotency-Key` header; a retry with the same key gets the first order back instead of a new one."
      - "Storing the key and creating the order must happen in one transaction with a unique constraint on the key, or two retries that arrive at the same time can both create an order."
      - "`PUT` and `DELETE` are idempotent by definition and need no key; the key is what makes a `POST` safe to retry."
      misconceptions:
      - "Retrying a failed POST is always safe, because a request that failed did nothing."
      - "The server can spot a duplicate order by comparing the items, so the client does not need to send anything extra."
      depth_notes: "Không nói thời hạn lưu key, idempotency trong message queue hay retry tự động phía client — ngoài phạm vi GĐ2 (messaging GĐ3)."
  - id: oauth-and-authz
    title:
      vi: "OAuth 2.0, OpenID Connect và phân quyền"
      en: "OAuth 2.0, OpenID Connect and authorization"
    stage: 2
    summary:
      vi: "Chuyển đăng nhập của Đơn Hàng sang Keycloak: lấy token bằng authorization code và PKCE, đọc ID token, kiểm token bằng public key, làm mới bằng refresh token, và phân quyền theo role lẫn theo chủ sở hữu đơn."
      en: "Move Đơn Hàng's login to Keycloak: get tokens with authorization code and PKCE, read the ID token, check tokens with public keys, renew them with refresh tokens, and authorize by role and by order owner."
    lessons:
    - id: backend.l2.oauth2-roles
      title:
        vi: "OAuth 2.0: ứng dụng nhận token, không bao giờ thấy mật khẩu"
        en: "OAuth 2.0: the app gets a token, never your password"
      main_path: true
      duration_min: 13
      skills: [backend.auth.oauth2]
      prereqs: [backend.l1.issuing-a-jwt, backend.l1.hashing-passwords]
      related: []
      vocab: [oauth2, authorization-server, resource-server, access-token]
      example_tag: stage-2
      example_files: [docker-compose.yml, keycloak/donhang-realm.json, DonHang.Api/Program.cs]
      outline:
      - "OAuth 2.0 names four roles; in Đơn Hàng the customer is the resource owner, `DonHang.App` the client, Keycloak the authorization server and `DonHang.Api` the resource server."
      - "At stage-2 the customer types the password on Keycloak's login page, so neither `DonHang.App` nor `DonHang.Api` ever receives it."
      - "The authorization server gives the client an access token, and the client sends it to the API in the `Authorization: Bearer` header, the same way it sent the stage-1 token."
      - "`DonHang.Api` no longer issues tokens or checks passwords: the stage-1 login endpoint and `JwtTokenService` are gone, and the API only checks the access tokens it receives."
      misconceptions:
      - "With OAuth, DonHang.App still takes my password; it just forwards it to Keycloak for me."
      - "Once Keycloak handles login, the API does not need to check anything about the token it receives."
      depth_notes: "Không nói luồng lấy token cụ thể — bài authorization-code-flow. Không nói ID token/OIDC — bài openid-connect-id-token. Không nói client credentials (máy gọi máy) hay đăng nhập bằng tài khoản mạng xã hội — ngoài phạm vi GĐ2."
    - id: backend.l2.authorization-code-flow
      title:
        vi: "Authorization code và PKCE: ứng dụng lấy token bằng cách nào"
        en: "Authorization code with PKCE: how the app gets its token"
      main_path: true
      duration_min: 15
      skills: [backend.auth.oauth2]
      prereqs: [backend.l2.oauth2-roles]
      related: []
      vocab: [authorization-code-flow, pkce, oauth-scope]
      example_tag: stage-2
      example_files: [keycloak/donhang-realm.json, scripts/backend/oauth-code-flow.sh]
      outline:
      - "The app sends the browser to Keycloak's authorization endpoint with its `client_id`, a `redirect_uri` and the scopes it asks for; after login, Keycloak redirects the browser back to that URI with a short-lived authorization code."
      - "The app then exchanges the code for an access token with a direct `POST` to Keycloak's token endpoint, so the token itself never appears in the browser's address bar."
      - "Keycloak redirects only to redirect URIs registered for the client, so a code is never delivered to a site the client did not register."
      - "An app running in the browser cannot keep a client secret, so it uses PKCE: it creates a random `code_verifier` and sends a SHA-256 hash of it as `code_challenge` in the first redirect."
      - "With the code the app sends the `code_verifier` itself, and Keycloak issues tokens only if its hash matches the challenge, so a code stolen on the way back is useless without the verifier."
      misconceptions:
      - "The authorization code in the redirect URL is the access token."
      - "PKCE encrypts the tokens so nobody else can read them."
      - "A client secret compiled into the app's code is safe, because users do not read compiled code."
      depth_notes: "Không nói refresh token — bài refresh-tokens. Không nói ID token — bài sau. Không nói implicit flow, password grant hay client credentials. Không dạy code đăng nhập phía Flutter — chỉ luồng HTTP qua script và cấu hình realm."
    - id: backend.l2.openid-connect-id-token
      title:
        vi: "OpenID Connect: ID token cho ứng dụng biết ai vừa đăng nhập"
        en: "OpenID Connect: the ID token tells the app who logged in"
      main_path: true
      duration_min: 12
      skills: [backend.auth.oidc]
      prereqs: [backend.l2.authorization-code-flow]
      related: []
      vocab: [openid-connect, id-token]
      example_tag: stage-2
      example_files: [scripts/backend/oidc-tokens.sh, DonHang.Api/Program.cs]
      outline:
      - "OAuth 2.0 gives the client an access token meant for the API; it does not define how the client learns who logged in."
      - "OpenID Connect is a layer on top of OAuth 2.0: when the app includes the `openid` scope, Keycloak also returns an ID token, a JWT that tells the app who logged in."
      - "The ID token's `aud` claim contains the app's `client_id` and its `sub` claim identifies the user at Keycloak; it is for the app to read, and the app never sends it to the API."
      - "The Đơn Hàng access token carries `donhang-api` in `aud`, so an API that checks the audience rejects an ID token sent in place of an access token."
      misconceptions:
      - "OAuth 2.0 and OpenID Connect are two competing ways to do the same thing."
      - "The ID token and the access token are interchangeable, since both are JWTs."
      depth_notes: "Không nói endpoint userinfo, nonce hay chi tiết tài liệu metadata của provider — ngoài phạm vi GĐ2. Không nói cách API kiểm chữ ký — bài validating-provider-tokens."
    - id: backend.l2.validating-provider-tokens
      title:
        vi: "Kiểm token mình không ký: public key của Keycloak"
        en: "Checking a token you did not sign: the provider's public keys"
      main_path: true
      duration_min: 14
      skills: [backend.auth.oidc]
      prereqs: [backend.l2.openid-connect-id-token, backend.l1.validating-a-jwt]
      related: []
      vocab: [public-key]
      example_tag: stage-2
      example_files: [DonHang.Api/Program.cs, DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "At stage-1 the API signed and checked tokens with one shared HMAC key, so anything able to check a token could also create one."
      - "Keycloak signs tokens with a private key only it holds and publishes the matching public keys; a public key can check a signature but cannot make one."
      - "With `Authority` set to the Keycloak realm URL, `AddJwtBearer` downloads Keycloak's metadata and public keys (in the lab, from `MetadataAddress`), then checks signature, issuer, audience and expiry on each request without calling Keycloak."
      - "The token's `sub` is Keycloak's id for the user, not `customers.id`, so the API finds the customer by a stored subject column instead of reading `sub` as a number."
      misconceptions:
      - "The API has to ask Keycloak on every request whether the token is still valid."
      - "If anyone can download the public key, anyone can sign tokens with it."
      depth_notes: "Không nói xoay vòng khóa (key rotation), toán học của RSA hay PKI — GĐ4 (kiến trúc bảo mật). Không nói introspection endpoint — ngoài phạm vi GĐ2."
    - id: backend.l2.refresh-tokens
      title:
        vi: "Vì sao access token hết hạn sau vài phút: refresh token"
        en: "Why access tokens expire in minutes: refresh tokens"
      main_path: true
      duration_min: 13
      skills: [backend.auth.oauth2]
      prereqs: [backend.l2.validating-provider-tokens, backend.l2.authorization-code-flow]
      related: [backend.l1.sessions-vs-tokens]
      vocab: [refresh-token]
      example_tag: stage-2
      example_files: [keycloak/donhang-realm.json, scripts/backend/refresh-token.sh]
      outline:
      - "Because the API checks an access token by itself, a leaked token or one held after logout keeps working until its `exp`; Đơn Hàng's API has no way to recall it earlier."
      - "The Đơn Hàng realm therefore gives access tokens a lifetime of minutes, and Keycloak returns a refresh token alongside the access token."
      - "When the access token expires, a client sends the refresh token to the token endpoint with `grant_type=refresh_token` and gets a new access token without the customer logging in again, as `refresh-token.sh` does."
      - "The refresh token goes only to Keycloak, never to the API, and logging out at Keycloak ends it, so a stolen access token stays usable for at most its own short lifetime."
      misconceptions:
      - "Logging out deletes the token, so it stops working straight away."
      - "A refresh token is just a longer-lived access token that the API also accepts."
      - "Access tokens that last for days are fine as long as every request uses HTTPS."
      depth_notes: "Không nói xoay vòng refresh token, danh sách thu hồi hay token revocation endpoint — ngoài phạm vi GĐ2. Không nói nơi app lưu token — track frontend."
    - id: backend.l2.role-based-access
      title:
        vi: "Role trong token: nhân viên được giao đơn, khách thì không"
        en: "Roles in the token: staff can ship orders, customers cannot"
      main_path: true
      duration_min: 13
      skills: [backend.auth.access-models]
      prereqs: [backend.l2.validating-provider-tokens, backend.l1.protecting-an-endpoint]
      related: []
      vocab: [rbac]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - keycloak/donhang-realm.json
      - scripts/backend/staff-only.sh
      outline:
      - "RBAC decides what a caller may do from the roles given to it, such as `staff`, instead of listing permissions user by user."
      - "Keycloak puts the user's roles into the access token; Đơn Hàng's realm writes them to a `roles` claim, and `RoleClaimType = \"roles\"` tells ASP.NET Core to read roles from it."
      - "`PATCH /api/v1/orders/{id}/ship` requires a policy that demands the `staff` role: a customer's valid token gets `403`, and a missing token still gets `401`."
      - "Roles come from the token, so a role granted or removed in Keycloak reaches the API only in the next access token the app obtains."
      misconceptions:
      - "OAuth scopes and roles are the same thing, so the app can ask for the staff role as a scope."
      - "Removing someone's role in Keycloak blocks them from the API immediately."
      depth_notes: "Không nói kiểm quyền theo chủ sở hữu đơn — bài sau. Không nói role lồng nhau, composite role hay client role của Keycloak — ngoài phạm vi GĐ2."
    - id: backend.l2.resource-based-authorization
      title:
        vi: "Khi role không đủ: kiểm ai sở hữu đơn hàng"
        en: "When a role is not enough: checking who owns the order"
      main_path: true
      duration_min: 14
      skills: [backend.auth.access-models]
      prereqs: [backend.l2.role-based-access]
      related: []
      vocab: [abac]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Authorization/OrderOwnerHandler.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - scripts/backend/order-owner.sh
      outline:
      - "Whether a customer may read order 42 depends on that order's `customer_id`, which a role cannot express, because every customer has the same role."
      - "ABAC decides from attributes of the caller, the resource and the request; Đơn Hàng's rule is that the caller owns the order or has the `staff` role."
      - "The order must be loaded before the rule can run, so the endpoint calls `IAuthorizationService.AuthorizeAsync` with the order after reading it, instead of relying only on an attribute."
      - "At stage-2, `GET /api/v1/orders/{id}` and the cancel endpoint answer `403` for another customer's order, closing the gap left open at stage-1."
      misconceptions:
      - "Giving each customer their own role is a fine way to control who reads which order."
      - "An `[Authorize]` attribute with a role can also check who owns the order."
      depth_notes: "Không nói trả 404 thay 403 để giấu đơn tồn tại, policy engine bên ngoài hay phân quyền theo tenant — GĐ3–4. Chỉ một quy tắc: chủ đơn hoặc staff."
  - id: caching
    title:
      vi: "Caching trong ứng dụng với Redis"
      en: "Application caching with Redis"
    stage: 2
    summary:
      vi: "Đặt Redis trước PostgreSQL cho danh mục sản phẩm của Đơn Hàng: đọc theo cache-aside, xóa bản sao khi giá đổi, và giải thích được vì sao cache vẫn có thể trả dữ liệu cũ hay dồn truy vấn vào database."
      en: "Put Redis in front of PostgreSQL for Đơn Hàng's product catalogue: read with cache-aside, delete the copy when a price changes, and explain why a cache can still serve stale data or pile queries onto the database."
    lessons:
    - id: backend.l2.redis-key-value-store
      title:
        vi: "Redis: giá trị cất theo khóa, nằm trong bộ nhớ, có hạn dùng"
        en: "Redis: values stored under keys, in memory, with an expiry"
      main_path: true
      duration_min: 12
      skills: [backend.cache.redis]
      prereqs:
      - foundation.l1.http-caching
      - foundation.l1.collections-in-practice
      - devops.l1.compose-for-the-api
      related: []
      vocab: [redis, key-value-store, ttl]
      example_tag: stage-2
      example_files: [docker-compose.yml, scripts/backend/redis-basics.sh]
      outline:
      - "Redis is a key-value store: a server that keeps values under keys, like a hash map living in its own process, so every program connected to it reads the same data and the data outlives a restart of the API."
      - "In Đơn Hàng, Redis runs as the `redis` service in Compose, and the API reaches it over the Compose network by the name `redis`, the same way it reaches `db`."
      - "`SET product:3 <value> EX 60` stores a value that Redis removes by itself after 60 seconds; `TTL product:3` shows the seconds left, and once they run out `GET product:3` finds nothing."
      - "Redis keeps its data in memory, which is what makes reads fast; Đơn Hàng treats everything in Redis as a copy that can be rebuilt from PostgreSQL, never as the only place a fact is stored."
      misconceptions:
      - "Redis is just a faster database, so the products table could move into it."
      - "A `Dictionary` inside the API does the same job as Redis, only without an extra container."
      depth_notes: "Chỉ kiểu chuỗi với SET/GET/EX/TTL qua redis-cli; không nói hash, list, sorted set, pub/sub, persistence (RDB/AOF), eviction khi đầy bộ nhớ hay replication — ngoài phạm vi GĐ2. Không nói cách API gọi Redis — bài cache-aside."
    - id: backend.l2.cache-aside
      title:
        vi: "Cache-aside: hỏi Redis trước, thiếu thì đọc PostgreSQL"
        en: "Cache-aside: ask Redis first, fall back to PostgreSQL"
      main_path: true
      duration_min: 15
      skills: [backend.cache.cache-aside]
      prereqs:
      - backend.l2.redis-key-value-store
      - backend.l1.get-and-status-codes
      - design.l1.service-lifetimes
      related: [foundation.l1.http-caching]
      vocab: [cache-aside, cache-hit, cache-miss]
      example_tag: stage-2
      example_files:
      - DonHang.Infrastructure/ProductCache.cs
      - DonHang.Api/Controllers/ProductsController.cs
      - DonHang.Infrastructure/ServiceCollectionExtensions.cs
      - scripts/backend/cache-aside.sh
      outline:
      - "With cache-aside the application does the work, not Redis: it looks for the key in Redis first, and only on a miss reads PostgreSQL and stores the answer in Redis with a TTL."
      - "At stage-2, `GET /api/v1/products/{id}` reads through `ProductCache`: the first request for product 3 is a cache miss that queries PostgreSQL, and a repeat within the TTL is a cache hit that does not."
      - "The value under `product:3` is the product serialized as JSON, so a hit deserializes it instead of running an EF Core query."
      - "The API registers one `ConnectionMultiplexer` as a singleton, because StackExchange.Redis is designed to share one connection object across all requests."
      - "`ProductCache` treats a Redis error like a miss and reads PostgreSQL, so Redis being down makes product reads slower, not broken."
      misconceptions:
      - "Redis loads the product from PostgreSQL by itself when the key is missing."
      - "If Redis is down, the product endpoint has to fail as well."
      - "Every endpoint should go through the cache, since a cache only makes things faster."
      depth_notes: "Chỉ `GET /api/v1/products/{id}`; không cache danh sách có phân trang/lọc, không cache đơn hàng. Đổi giá — bài cache-invalidation; nhiều request cùng miss — bài cache-stampede. Không dạy IDistributedCache, HybridCache, read-through/write-through — ngoài GĐ2."
    - id: backend.l2.cache-invalidation
      title:
        vi: "Giá vừa đổi: xóa bản sao trong cache, đừng chờ TTL"
        en: "A price changed: delete the cached copy, do not wait for the TTL"
      main_path: true
      duration_min: 14
      skills: [backend.cache.invalidation]
      prereqs: [backend.l2.cache-aside, backend.l2.role-based-access]
      related: []
      vocab: [cache-invalidation]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Controllers/ProductsController.cs
      - DonHang.Infrastructure/ProductCache.cs
      - scripts/backend/cache-invalidation.sh
      outline:
      - "When staff change a product's price in PostgreSQL, the copy in Redis keeps the old price until its TTL runs out, so customers can see the old price for up to that long."
      - "Stage-2 adds staff-only `PATCH /api/v1/products/{id}`, which saves the new price and then deletes `product:{id}` from Redis, so the next read is a miss that loads the new price."
      - "The key is deleted after the database save succeeds, not before: deleting first leaves a moment in which a read can put the old price back into Redis."
      - "A read that loaded the old price just before the update can still write it to Redis just after the delete, so Đơn Hàng keeps the TTL as the upper limit on how long a stale copy can live."
      misconceptions:
      - "Once PostgreSQL has the new price, every customer sees it."
      - "With the key deleted on every update, the TTL is no longer needed."
      - "It is safer to delete the cached copy first and update the database afterwards."
      depth_notes: "Chỉ xóa key sau khi lưu; không so sánh với ghi đè giá trị mới vào cache, không nói phát sự kiện invalidation giữa các service hay khóa phân tán — messaging GĐ3. Không dạy lại policy StaffOnly — đã có ở backend.l2.role-based-access."
    - id: backend.l2.cache-stampede
      title:
        vi: "Khi một key hot hết hạn: truy vấn dồn cùng lúc vào PostgreSQL"
        en: "When a popular key expires: a rush of queries to PostgreSQL"
      main_path: true
      duration_min: 14
      skills: [backend.cache.cache-aside]
      prereqs: [backend.l2.cache-aside, foundation.l1.threads-and-async-intro]
      related: []
      vocab: [cache-stampede]
      example_tag: stage-2
      example_files: [DonHang.Infrastructure/ProductCache.cs, scripts/backend/cache-stampede.sh]
      outline:
      - "When a key that many requests read expires, every request that arrives before it is refilled is a miss, and each sends the same query to PostgreSQL at once: a cache stampede."
      - "The stampede reaches the database exactly when the cache stops shielding it, and its size grows with the traffic on that key, not with the amount of data."
      - "`ProductCache` lets only one request per key query PostgreSQL at a time with a `SemaphoreSlim`; the other requests for that key wait, then read the value the first one stored."
      - "After it is let through, a request checks Redis again before querying, because another request may have filled the key while it waited."
      - "This waiting happens inside one API process, so with several API instances each can still send one query for the same key, which is still far fewer than one per request."
      misconceptions:
      - "A cache can only take load off the database, never add to it."
      - "A longer TTL fixes a stampede."
      depth_notes: "Không nói khóa phân tán qua Redis, làm mới trước khi hết hạn (refresh-ahead) hay TTL ngẫu nhiên hóa — ngoài phạm vi GĐ2. Không dạy HybridCache. Không nói đo tải/benchmark thật — chỉ đếm truy vấn trong log của script."
  - id: background-jobs
    title:
      vi: "Background job: gửi email đơn hàng ngoài request"
      en: "Background jobs: order emails outside the request"
    stage: 2
    summary:
      vi: "Đưa việc gửi email đơn hàng ra khỏi request: lưu job vào bảng notifications cùng transaction với đơn, chạy nó bằng một hosted service, thử lại có giãn cách, và giải thích được vì sao email có thể đi hai lần nhưng không bao giờ mất."
      en: "Move Đơn Hàng's order emails out of the request: save the job in the notifications table in the order's transaction, run it with a hosted service, retry with growing delays, and explain why an email can go out twice but is never lost."
    lessons:
    - id: backend.l2.work-outside-the-request
      title:
        vi: "Vì sao response đặt đơn không nên chờ gửi email"
        en: "Why the order response should not wait for the email"
      main_path: true
      duration_min: 12
      skills: [backend.jobs.background]
      prereqs:
      - design.l1.the-service-layer
      - backend.l1.exception-handling-middleware
      - foundation.l1.threads-and-async-intro
      related: []
      vocab: [background-job]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/OrderService.cs
      - DonHang.Infrastructure/LoggingNotifier.cs
      - DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs
      outline:
      - "At stage-1, `PlaceOrderAsync` saves the order and then calls `notifier.Send` in the same request, so the response to `POST /api/v1/orders` waits for whatever `Send` does."
      - "`LoggingNotifier` only writes a log line, which is quick; a real email means talking to a mail server over the network, which can take seconds or fail."
      - "The order is already saved when `Send` runs, so a mail error reaching `ExceptionHandlingMiddleware` would answer `500` for an order that exists, and the customer may place it again."
      - "A background job is work the application does outside any request: the request only records that the email must be sent, so its response no longer depends on the mail server."
      - "Work started only in memory, such as a `Task.Run` nobody awaits, is lost if the process stops before it ends, and nothing tries it again when it fails."
      misconceptions:
      - "If `Send` becomes async and I `await` it, the customer no longer waits for the email."
      - "Starting the email with `Task.Run` and not awaiting it is already a background job."
      - "If the email fails, the order was not placed."
      depth_notes: "Chỉ nêu vấn đề bằng code stage-1; không dạy BackgroundService — bài hosted-services; không nói lưu job ở đâu — bài database-job-queue. Không nói message broker — messaging GĐ3."
    - id: backend.l2.hosted-services
      title:
        vi: "Hosted service: code chạy song song với request suốt đời app"
        en: "A hosted service runs beside the requests for the app's whole life"
      main_path: true
      duration_min: 14
      skills: [backend.jobs.background]
      prereqs:
      - backend.l2.work-outside-the-request
      - design.l1.service-lifetimes
      - backend.l1.hosting-and-program-cs
      related: []
      vocab: [hosted-service]
      example_tag: stage-2
      example_files: [DonHang.Api/Jobs/NotificationSender.cs, DonHang.Api/Program.cs]
      outline:
      - "`NotificationSender` derives from `BackgroundService` and is registered with `AddHostedService<NotificationSender>()`; the host calls its `ExecuteAsync` when the app starts, in the same process that serves requests."
      - "`ExecuteAsync` receives a `CancellationToken` that is signalled when the app shuts down: the timer stops waiting, a round in progress is cancelled, and the loop ends instead of starting new work."
      - "The loop waits on a `PeriodicTimer`, which wakes it every few seconds and holds no thread while it waits."
      - "A hosted service is created once and lives as long as the app, like a singleton, so it must not keep a scoped `DonHangDbContext`; each round creates a scope with `IServiceScopeFactory` and gets a fresh `DbContext` from it."
      - "By default an exception that escapes `ExecuteAsync` stops the whole app, so `NotificationSender` catches and logs errors inside each round and keeps looping."
      misconceptions:
      - "A background service runs as a separate program next to the API."
      - "The background service can take `DonHangDbContext` in its constructor, just like a controller does."
      - "If the background loop throws, only the loop stops and the API keeps serving requests."
      depth_notes: "Không nói Worker Service tách riêng, thứ tự khởi động giữa hosted service và Kestrel hay thời gian chờ khi tắt app — ngoài GĐ2. Không nói lịch chạy theo giờ (cron) — CronJob của Kubernetes, GĐ3. Việc bảng notifications làm hàng đợi — bài sau."
    - id: backend.l2.database-job-queue
      title:
        vi: "Hàng đợi job trong PostgreSQL: lưu việc gửi email cùng đơn hàng"
        en: "A job queue in PostgreSQL: save the email job with the order"
      main_path: true
      duration_min: 15
      skills: [backend.jobs.background]
      prereqs: [backend.l2.hosted-services, backend.l1.saving-changes]
      related: [backend.l3.outbox-pattern]
      vocab: [job-queue]
      example_tag: stage-2
      example_files:
      - DonHang.Domain/OrderService.cs
      - DonHang.Infrastructure/QueuedNotifier.cs
      - DonHang.Api/Jobs/NotificationSender.cs
      - scripts/backend/order-email.sh
      outline:
      - "At stage-2, placing an order stages a `notifications` row with status `pending` next to the order, and one `SaveChangesAsync` saves both in one transaction, so there is never an order without its email job or a job without its order."
      - "The request then answers without contacting the mail server; the `notifications` table is Đơn Hàng's job queue, and `NotificationSender` is the only code that takes work from it."
      - "On each tick, `NotificationSender` reads the pending rows that are due, sends each email to the mail server running in Compose, and sets `status` to `sent` together with `sent_at`."
      - "Because each job is a row in PostgreSQL, a restart of the API loses nothing: rows still pending when it stopped are sent after it starts again."
      - "An email goes out a few seconds after the order, not at the same moment, because the sender only looks for work when its timer wakes it."
      misconceptions:
      - "Keeping pending emails in a list in memory works just as well as a table, and it is faster."
      - "Saving the order and adding the email job in two separate `SaveChangesAsync` calls is just as safe."
      - "When the order response comes back, the email has already been sent."
      depth_notes: "Không gọi tên outbox pattern hay message broker (RabbitMQ) — backend.l3.outbox-pattern và messaging GĐ3. Không nói thất bại khi gửi — bài retry-with-backoff; không nói nhiều bản API cùng lấy job — bài skip-locked-claiming. Không dạy cấu hình SMTP hay thư viện gửi mail."
    - id: backend.l2.retry-with-backoff
      title:
        vi: "Mail server sập: thử lại sau, mỗi lần chờ lâu hơn"
        en: "When the mail server is down: retry later, waiting longer each time"
      main_path: true
      duration_min: 13
      skills: [backend.jobs.reliability]
      prereqs: [backend.l2.database-job-queue, backend.l1.structured-logging]
      related: []
      vocab: [exponential-backoff]
      example_tag: stage-2
      example_files: [DonHang.Api/Jobs/NotificationSender.cs, scripts/backend/email-retry.sh]
      outline:
      - "When a send fails, `NotificationSender` keeps the row `pending`, adds one to `attempts` and moves `next_attempt_at` later, so the email is tried again on a later tick instead of being dropped."
      - "Retrying at once in a loop sends a burst of attempts to a mail server that is already failing; with exponential backoff the wait doubles after each failure, which gives the server time to recover."
      - "After a fixed number of failed attempts the row is marked `failed` and never retried automatically, so an email that can never be sent does not keep the sender busy forever."
      - "Each failure is logged with the notification id and the attempt number as structured fields, so a person can find why a row ended up `failed`."
      misconceptions:
      - "If sending fails, the most reliable fix is to retry straight away until it works."
      - "A job that keeps failing should be retried forever, because giving up loses the email."
      depth_notes: "Không nói jitter, circuit breaker hay thư viện resilience — backend/resilience GĐ3. Không nói dead-letter queue — messaging GĐ3. Không nói gửi lại hàng loạt các dòng failed bằng tay."
    - id: backend.l2.at-least-once-jobs
      title:
        vi: "Sập sau khi gửi mà trước khi đánh dấu: email đi hai lần"
        en: "A crash after sending but before marking sends the email twice"
      main_path: true
      duration_min: 13
      skills: [backend.jobs.reliability]
      prereqs: [backend.l2.retry-with-backoff, backend.l2.idempotent-endpoints]
      related: []
      vocab: [at-least-once, at-most-once]
      example_tag: stage-2
      example_files: [DonHang.Api/Jobs/NotificationSender.cs]
      outline:
      - "`NotificationSender` sends the email first and saves `sent` afterwards; if the process stops between the two steps, the row is still `pending` and the email is sent again after the restart."
      - "A send that fails with a timeout may still have reached the mail server, so its retry can deliver a second copy."
      - "Such a job is at-least-once: it is never lost but can run more than once; saving `sent` before sending makes it at-most-once, where a crash loses the email instead."
      - "No order of the two steps gives exactly once, because the mail server and PostgreSQL cannot take part in one transaction."
      - "Đơn Hàng accepts a rare duplicate email; when a repeat would do harm, such as taking a payment twice, the job must be idempotent, for example by sending a key the receiver checks, as `Idempotency-Key` does for orders."
      misconceptions:
      - "Putting the send and the status update in one database transaction makes the email go out exactly once."
      - "Marking the row as sent before sending is the safer order, because then nothing is ever sent twice."
      depth_notes: "Không nói inbox/outbox, khử trùng lặp phía người nhận hay exactly-once của message broker — messaging GĐ3. Không nói nhiều bản API cùng gửi — bài skip-locked-claiming."
    - id: backend.l2.skip-locked-claiming
      title:
        vi: "Hai bản API không được gửi trùng một email: SKIP LOCKED"
        en: "Two API copies must not send the same email: SKIP LOCKED"
      main_path: true
      duration_min: 15
      skills: [backend.jobs.reliability]
      prereqs: [backend.l2.database-job-queue, foundation.l1.transaction-intro]
      related: [backend.l2.at-least-once-jobs]
      vocab: [row-lock]
      example_tag: stage-2
      example_files:
      - DonHang.Infrastructure/NotificationQueue.cs
      - DonHang.Api/Jobs/NotificationSender.cs
      - scripts/backend/skip-locked.sh
      outline:
      - "Every running copy of the API runs its own `NotificationSender`, so two copies that read the same pending row can both send its email."
      - "Inside a transaction, `SELECT ... FOR UPDATE` takes a row lock on each row it returns; another transaction that tries to lock or change those rows waits until the first one commits or rolls back."
      - "With `SKIP LOCKED` added, the second query skips rows another transaction has locked instead of waiting, so each copy of the sender claims a different set of pending rows."
      - "The lock lasts until the transaction ends, so the sender claims a small batch, sends it and commits; a crash rolls the transaction back and leaves the rows pending for the next claim."
      - "A row lock does not stop a plain `SELECT` from reading the row; it only makes other lockers and writers wait or, with `SKIP LOCKED`, pass the row by."
      misconceptions:
      - "The `WHERE status = 'pending'` filter is enough: once one copy sends the email, the other copy will not see the row."
      - "A locked row is hidden from every other query until the transaction ends."
      depth_notes: "Không nói isolation level — backend.l2.transactions-in-practice; không nói deadlock — ngoài GĐ2. Không nói advisory lock, bầu leader hay cột lease — ngoài GĐ2. Không nói competing consumers trên RabbitMQ — messaging GĐ3."
  - id: indexes-and-plans
    title:
      vi: "Index, query plan, truy vấn EF Core và ghi đồng thời"
      en: "Indexes, query plans, EF Core reads and concurrent writes"
    stage: 2
    summary:
      vi: "Đọc được plan của PostgreSQL kèm chi phí và thời gian thật, chọn index cho đúng truy vấn Đơn Hàng gửi, bắt EF Core bớt việc thừa khi đọc, và chặn được hai request ghi đè thay đổi của nhau."
      en: "Read a PostgreSQL plan with its costs and real timings, choose indexes for the queries Đơn Hàng actually sends, make EF Core reads do less needless work, and stop two requests from overwriting each other's change."
    lessons:
    - id: backend.l2.indexes-and-plans
      title:
        vi: "EXPLAIN ANALYZE: đọc plan kèm chi phí, số dòng và thời gian"
        en: "EXPLAIN ANALYZE: reading a plan with costs, rows and timings"
      main_path: true
      duration_min: 15
      skills: [backend.data.query-plans]
      prereqs: [foundation.l1.sql-index-intro, foundation.l1.sql-join]
      related: []
      vocab: [query-plan, query-planner]
      example_tag: stage-2
      example_files: [db/queries/explain-analyze.sql, scripts/backend/explain-analyze.sh]
      outline:
      - "Without `COSTS OFF`, each step of an `EXPLAIN` plan shows an estimated cost as two numbers (before the first row, for all rows) plus estimated rows; cost is in the planner's own units, not milliseconds."
      - "`EXPLAIN ANALYZE` really runs the statement and adds actual time in milliseconds, actual rows and loops for each step, so on an `UPDATE` or `DELETE` it changes data unless wrapped in a transaction that is rolled back."
      - "A plan is a tree: each step takes rows from the more indented steps under it, and the top line's figures cover the whole query."
      - "The planner estimates row counts from statistics that `ANALYZE` collects, and autovacuum refreshes them after enough rows change; an estimate far from the actual rows often means the statistics are out of date."
      - "The planner picks the plan with the lowest estimated cost, so a sequential scan is the right choice when a query needs a large share of the table's rows."
      misconceptions:
      - "A cost of 1000 in the plan means the query takes 1000 milliseconds."
      - "A sequential scan in a plan always means an index is missing."
      - "`EXPLAIN ANALYZE` only prints a plan, so it is safe to put in front of a `DELETE`."
      depth_notes: "Không nói các kiểu join (nested loop, hash, merge) chi tiết, BUFFERS, song song hóa hay chỉnh tham số planner — ngoài GĐ2. Chọn index cho truy vấn thật — bài composite-indexes; lấy SQL EF Core gửi — bài efcore-generated-sql."
    - id: backend.l2.foreign-key-indexes
      title:
        vi: "Index của Đơn Hàng từ đâu ra: EF Core index khóa ngoại, PostgreSQL thì không"
        en: "Where Đơn Hàng's indexes come from: EF Core indexes foreign keys"
      main_path: true
      duration_min: 12
      skills: [backend.data.query-plans]
      prereqs: [backend.l2.indexes-and-plans, backend.l1.migrations, backend.l1.efcore-n-plus-one]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - DonHang.Infrastructure/Migrations/20260924092625_AddOrderCustomerNavigation.cs
      - DonHang.Infrastructure/Migrations/20260923154631_InitialCreate.cs
      - DonHang.Infrastructure/DonHangDbContext.cs
      - db/schema.sql
      outline:
      - "PostgreSQL builds an index for every `PRIMARY KEY` and `UNIQUE` constraint but none for `REFERENCES` alone, so `db/schema.sql` left `orders.customer_id` without an index."
      - "By convention EF Core creates an index for each foreign key in its model, so the `AddOrderCustomerNavigation` migration that mapped `Order.Customer` also runs `CreateIndex` for `IX_orders_customer_id`."
      - "EF Core skips that index when the foreign key columns already start a key, which is why `InitialCreate` adds the `order_items` foreign key to `orders` with no index: the key `(order_id, product_id)` starts with `order_id`."
      - "A foreign key that exists only in `db/schema.sql`, such as `payments.order_id`, is not in EF Core's model, so no migration indexed it; the C# model does not list every index the database has."
      misconceptions:
      - "`orders.customer_id` has had an index since stage-0, because it is a foreign key."
      - "EF Core only creates the indexes I write with `HasIndex`."
      - "`order_items` needs its own index on `order_id`, since every foreign key needs one."
      depth_notes: "Không đọc plan hay đo tốc độ — bài indexes-and-plans và composite-indexes. Không nói hai ràng buộc khóa ngoại trùng trên `orders.customer_id` (schema.sql và migration) hay cascade delete. Không thêm index mới — bài composite-indexes."
    - id: backend.l2.composite-indexes
      title:
        vi: "Index hai cột: thứ tự cột quyết định truy vấn nào được lợi"
        en: "A two-column index: column order decides which queries it serves"
      main_path: true
      duration_min: 15
      skills: [backend.data.query-plans]
      prereqs: [backend.l2.foreign-key-indexes, backend.l2.cursor-pagination]
      related: []
      vocab: [composite-index]
      example_tag: stage-2
      example_files:
      - DonHang.Infrastructure/DonHangDbContext.cs
      - db/queries/composite-index.sql
      - scripts/backend/composite-index.sh
      outline:
      - "An index on `(customer_id, id)` keeps its entries sorted by `customer_id` and, for the same customer, by `id`, like a phone book sorted by family name and then given name."
      - "It narrows the search for a condition on `customer_id`, or on both columns, but not for a condition on `id` alone, because entries with nearby ids are spread across every customer."
      - "For one customer's page after a cursor, the plan reads the index from the cursor in `id` order and stops after the `LIMIT` rows, with no separate `Sort` step."
      - "With only `IX_orders_customer_id`, no index gives one customer's orders in `id` order, so the plan either sorts all of that customer's orders or walks `orders` by id skipping other customers, reading more rows than it returns."
      - "The composite index serves every query `IX_orders_customer_id` served, so the stage-2 migration from `HasIndex` replaces the single-column index instead of keeping both."
      misconceptions:
      - "An index on `(customer_id, id)` helps any query that filters on either column."
      - "The order of the columns in an index does not matter."
      - "Two separate indexes on `customer_id` and on `id` do the same job as one index on both."
      depth_notes: "Không nói index covering (INCLUDE), index một phần, kiểu index khác B-tree hay skip scan — ngoài GĐ2. Không nói CREATE INDEX CONCURRENTLY và khóa ghi khi tạo index trên bảng đang chạy — zero-downtime migration GĐ4."
    - id: backend.l2.efcore-generated-sql
      title:
        vi: "Xem SQL mà EF Core thật sự gửi trước khi đoán vì sao chậm"
        en: "See the SQL EF Core really sends before guessing why it is slow"
      main_path: true
      duration_min: 12
      skills: [backend.ef.performance]
      prereqs: [backend.l2.indexes-and-plans, backend.l1.structured-logging, backend.l1.querying-with-linq]
      related: [backend.l1.efcore-n-plus-one]
      vocab: []
      example_tag: stage-2
      example_files: [docker-compose.yml, DonHang.Api/appsettings.json, scripts/backend/efcore-sql.sh]
      outline:
      - "EF Core logs each command it sends, with its SQL and how long it took, under the category `Microsoft.EntityFrameworkCore.Database.Command` at `Information` level."
      - "Đơn Hàng's `appsettings.json` keeps `Microsoft.EntityFrameworkCore` at `Warning`, so at stage-2 the lab's `api` service raises only the command category to `Information` through configuration."
      - "Parameter values show as `?` in that log unless sensitive data logging is turned on, because they can hold personal data such as an email."
      - "`ToQueryString()` on a LINQ query returns the SQL EF Core would send for it, without running it."
      - "The logged SQL, with its parameters filled in, is what you give to `EXPLAIN ANALYZE` to see how PostgreSQL plans the query your code sends."
      misconceptions:
      - "When a LINQ query is slow, the problem is in the C# code, so the API is the place to look first."
      - "The `?` in the logged SQL means EF Core sent the query without the values."
      - "EF Core sends exactly the SQL I would have written by hand for the same LINQ."
      depth_notes: "Không bật sensitive data logging ngoài môi trường dev, không nói interceptor, compiled query hay OpenTelemetry — observability GĐ3. Không nói plan chung cho truy vấn có tham số (generic plan) — ngoài GĐ2."
    - id: backend.l2.no-tracking-queries
      title:
        vi: "AsNoTracking: đọc entity mà bạn sẽ không sửa"
        en: "AsNoTracking: reading entities you will not change"
      main_path: true
      duration_min: 12
      skills: [backend.ef.performance]
      prereqs: [backend.l1.saving-changes, backend.l2.efcore-generated-sql]
      related: []
      vocab: [change-tracker]
      example_tag: stage-2
      example_files: [DonHang.Infrastructure/EfOrderRepository.cs, DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "By default every entity a query returns is tracked: the change tracker keeps a snapshot of it, so `SaveChangesAsync` can find what changed and write only that."
      - "`AsNoTracking()` returns entities the change tracker does not keep, which saves that work and memory for data that is only read to build a response."
      - "`AsNoTracking()` does not change the SQL sent to PostgreSQL; what it saves is work inside the API process."
      - "Changing an entity loaded with `AsNoTracking()` and then calling `SaveChangesAsync` writes nothing, because the context never knew about it."
      - "At stage-2 the read-only `GET /api/v1/orders/{id}` loads the order with `AsNoTracking()`, while cancelling keeps the tracked query because it changes the order."
      misconceptions:
      - "`AsNoTracking()` makes the database run the query faster."
      - "After `AsNoTracking()`, I can still change the order and `SaveChangesAsync` will save it."
      - "Tracking costs nothing when I never call `SaveChangesAsync`."
      depth_notes: "Không nói identity resolution (AsNoTrackingWithIdentityResolution), đặt no-tracking mặc định cho cả context hay attach entity để cập nhật — ngoài GĐ2. Chọn cột bằng Select — bài projection-queries."
    - id: backend.l2.projection-queries
      title:
        vi: "Chỉ lấy những gì response cần: Select thay cho Include"
        en: "Fetch only what the response needs: Select instead of Include"
      main_path: true
      duration_min: 13
      skills: [backend.ef.performance]
      prereqs:
      - backend.l2.no-tracking-queries
      - backend.l1.efcore-n-plus-one
      - backend.l1.dtos-and-serialization
      related: []
      vocab: [projection]
      example_tag: stage-2
      example_files:
      - DonHang.Infrastructure/EfOrderRepository.cs
      - DonHang.Domain/OrderSummary.cs
      - scripts/backend/efcore-sql.sh
      outline:
      - "At stage-1, `ListByCustomerAsync` uses `Include(o => o.Customer)` and loads whole `Order` and `Customer` entities, every mapped column, while the order list shows only id, status and the customer's name."
      - "At stage-2 a `Select` into an `OrderSummary` record inside the query makes EF Core put only those columns in the SQL, as the logged command shows."
      - "Reading `o.Customer.FullName` inside the `Select` makes EF Core write the JOIN itself, so the query needs no `Include`."
      - "A projection whose results contain no entities is not tracked, so it skips the change tracker without `AsNoTracking()`."
      - "A projection returns plain records that cannot be changed and saved back, so it fits reading for a response, not loading something to change."
      misconceptions:
      - "`Include` is the only way to read data from a related table."
      - "EF Core only fetches the columns my code later reads from the entity."
      - "A query that returns records still fills the change tracker, so I also need `AsNoTracking()`."
      depth_notes: "Không nói split query, projection lồng collection hay AutoMapper/ProjectTo — ngoài GĐ2. Không dạy lại N+1 — backend.l1.efcore-n-plus-one. Record `OrderSummary` nằm ở DonHang.Domain để repository không phụ thuộc DTO của DonHang.Api; không bàn sâu read model — design GĐ3."
    - id: backend.l2.transactions-in-practice
      title:
        vi: "Read Committed: hai request cùng đọc trạng thái cũ rồi ghi đè nhau"
        en: "Read Committed: two requests act on the same old status"
      main_path: true
      duration_min: 15
      skills: [backend.data.concurrency]
      prereqs:
      - foundation.l1.transaction-intro
      - backend.l1.saving-changes
      - backend.l2.role-based-access
      - backend.l2.problem-types
      related: [backend.l2.skip-locked-claiming]
      vocab: [isolation-level, lost-update]
      example_tag: stage-2
      example_files:
      - DonHang.Domain/OrderService.cs
      - DonHang.Domain/Entities.cs
      - scripts/backend/lost-update.sh
      - scripts/backend/repeatable-read-conflict.sh
      outline:
      - "An isolation level decides what a transaction sees of changes other transactions make while it runs; PostgreSQL's default is Read Committed, and `SaveChangesAsync` runs its transaction under Read Committed unless code asks otherwise."
      - "Under Read Committed each statement sees only rows committed before it began, so a cancel and a ship request that both read order 5 before either writes both see `paid` and both pass their status check."
      - "The second `UPDATE` waits for the first one's row lock and, once it commits, overwrites its status: a lost update, such as a shipped order that ends up `cancelled`."
      - "The repository's `FindAsync` and `SaveChangesAsync` run in separate transactions unless code wraps both in `Database.BeginTransactionAsync`, so an isolation level on the save alone cannot protect a read-then-write."
      - "Under Repeatable Read the read and the write share one snapshot, and PostgreSQL rejects the second write with a serialization error (`40001`) that the application must catch and retry."
      misconceptions:
      - "Because `SaveChangesAsync` uses a transaction, two requests cannot overwrite each other's change."
      - "Under PostgreSQL's default isolation level, a transaction sees the database as it was when the transaction began."
      - "Raising the isolation level fixes concurrent writes without changing any other code."
      depth_notes: "Không nói Serializable chi tiết, anomaly khác (phantom, write skew), deadlock hay transaction phân tán — ngoài GĐ2 (outbox, saga GĐ3). Cách Đơn Hàng chặn lost update — bài optimistic-concurrency."
    - id: backend.l2.optimistic-concurrency
      title:
        vi: "Concurrency token: lần lưu thứ hai thất bại thay vì ghi đè"
        en: "A concurrency token makes the second save fail, not overwrite"
      main_path: true
      duration_min: 14
      skills: [backend.data.concurrency]
      prereqs: [backend.l2.transactions-in-practice, backend.l1.exception-handling-middleware]
      related: [backend.l2.skip-locked-claiming]
      vocab: [optimistic-concurrency, concurrency-token]
      example_tag: stage-2
      example_files:
      - DonHang.Infrastructure/DonHangDbContext.cs
      - DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs
      - scripts/backend/concurrency-conflict.sh
      outline:
      - "Optimistic concurrency lets requests read without locking and checks at save time whether the row changed since it was read; the losing save fails instead of overwriting."
      - "Đơn Hàng's token is PostgreSQL's `xmin`, a system column every row has that changes whenever the row is updated; `Order` gets a `uint` property the Npgsql provider maps to it via `IsRowVersion()`."
      - "EF Core adds the token's original value to the `WHERE` of its `UPDATE`; when no row matches, `SaveChangesAsync` throws `DbUpdateConcurrencyException` and writes nothing."
      - "The API answers that exception with `409` and its own problem `type`, so the client reloads the order and decides again instead of repeating a change based on a stale status."
      - "Locking the row first with `SELECT ... FOR UPDATE` is the alternative: the second request waits instead of failing, which costs less when many writers compete for the same row."
      misconceptions:
      - "Optimistic concurrency locks the order while someone is changing it."
      - "When `SaveChangesAsync` throws a concurrency exception, the fix is to call it again."
      - "A concurrency token needs a new column added to the `orders` table."
      depth_notes: "Không nói ETag/If-Match trên HTTP, gộp thay đổi khi xung đột hay token trên nhiều bảng — ngoài GĐ2. Không dạy lại row lock — backend.l2.skip-locked-claiming."
- level: 3
  title:
    vi: "Level 3"
    en: "Level 3"
  modules:
  - id: messaging
    title:
      vi: "Messaging: RabbitMQ, outbox và consumer đáng tin cậy"
      en: "Messaging: RabbitMQ, the outbox and reliable consumers"
    stage: 3
    summary:
      vi: "Cho service Notifications nhận sự kiện đơn hàng của Đơn Hàng qua RabbitMQ mà không mất hay gửi trùng email: lưu message vào outbox cùng đơn, publish có xác nhận, và nhận bằng acknowledgement, inbox và dead-letter queue."
      en: "Let the Notifications service receive Đơn Hàng's order events through RabbitMQ without losing or doubling an email: save each message in an outbox with the order, publish it with confirms, and consume it with acknowledgements, an inbox and a dead-letter queue."
    lessons:
    - id: backend.l3.message-broker
      title:
        vi: "Message broker giữ việc lại cho tới khi service nhận sẵn sàng"
        en: "A message broker holds work until the receiving service is ready"
      main_path: true
      duration_min: 13
      skills: [backend.messaging.brokers]
      prereqs:
      - design.l3.before-extracting-a-module
      - design.l3.when-to-extract-a-service
      - backend.l2.database-job-queue
      related: [backend.l2.work-outside-the-request, design.l3.module-owns-its-tables]
      vocab: [message-broker, message-queue, rabbitmq]
      example_tag: stage-3
      example_files: [docker-compose.yml, DonHang.Notifications/Program.cs, scripts/backend/notifications-down.sh]
      outline:
      - "At stage-3, order emails are sent by their own service, `DonHang.Notifications`, which has its own database; `DonHang.Api` can no longer add a row to its tables."
      - "Calling that service over HTTP while placing an order would tie the two together: if Notifications were down or slow, placing an order would fail or wait."
      - "A message broker is a server that accepts messages from one program and keeps them in a message queue until another program takes them, so the sender does not need the receiver to be running."
      - "Đơn Hàng's broker is RabbitMQ, the `rabbitmq` service in Compose; with `notifications` stopped, an order still succeeds and its message waits in the queue until the service is back."
      - "Each message carries the customer's email address and name, because the Notifications service no longer reads the `customers` table."
      misconceptions:
      - "A message broker is just a slower way of calling the other service's API."
      - "If the Notifications service is down when an order is placed, that order's email is lost."
      - "The Notifications service can still look up what it needs in Đơn Hàng's database."
      depth_notes: "Không dạy exchange, binding — backend.l3.exchanges-and-bindings; không nói API ghi message cùng đơn thế nào — backend.l3.outbox-pattern. Không so sánh RabbitMQ với Kafka hay broker khác; không dạy cài đặt, cluster RabbitMQ — ngoài module."
    - id: backend.l3.exchanges-and-bindings
      title:
        vi: "Message gửi tới exchange, binding quyết định queue nào nhận"
        en: "Messages go to an exchange, and bindings choose the queues"
      main_path: true
      duration_min: 14
      skills: [backend.messaging.brokers]
      prereqs: [backend.l3.message-broker, design.l3.domain-events, design.l2.observer-pattern]
      related: [design.l3.context-map]
      vocab: [rabbitmq-exchange, rabbitmq-binding, routing-key, publish-subscribe]
      example_tag: stage-3
      example_files:
      - DonHang.Notifications/RabbitMqTopology.cs
      - DonHang.Messaging/RabbitMqPublisher.cs
      - scripts/backend/rabbitmq-topology.sh
      outline:
      - "A publisher never writes into a queue directly: it sends each message to an exchange together with a routing key, and the exchange decides which queues receive it."
      - "A binding links a queue to an exchange with a pattern; at stage-3 `notifications.order-events` is bound to the topic exchange `donhang.orders` with `order.*`."
      - "In a topic exchange's pattern, `*` stands for exactly one dot-separated word and `#` for zero or more words, so `order.*` matches `order.placed`, `order.cancelled` and `order.shipped`."
      - "Every queue whose binding matches gets its own copy, so another service can receive the same events by binding its own queue, with no change to `DonHang.Api`: this is publish/subscribe."
      - "By default an exchange drops a message that matches no binding, so a queue must be bound before the messages it needs are published."
      misconceptions:
      - "The API sends each message straight into the Notifications service's queue."
      - "When two queues are bound to the same exchange, they share its messages, each getting about half."
      - "If no queue is bound yet, RabbitMQ keeps the message until one is."
      depth_notes: "Không dạy exchange kiểu direct, fanout, headers hay alternate exchange — ngoài module. Không nói ai đọc queue và xác nhận — backend.l3.consumer-acknowledgements. Không dạy lại Observer — design.l2.observer-pattern."
    - id: backend.l3.dual-write
      title:
        vi: "Lưu đơn và publish message không thể nằm chung một transaction"
        en: "Saving an order and publishing its message cannot share a transaction"
      main_path: true
      duration_min: 13
      skills: [backend.messaging.outbox]
      prereqs:
      - backend.l3.exchanges-and-bindings
      - backend.l2.at-least-once-jobs
      - design.l3.dispatching-domain-events
      - backend.l2.optimistic-concurrency
      related: [foundation.l1.transaction-intro, backend.l2.transactions-in-practice]
      vocab: [dual-write]
      example_tag: stage-2
      example_files: [DonHang.Domain/OrderService.cs, DonHang.Infrastructure/QueuedNotifier.cs]
      outline:
      - "At stage-2, an order and its email job are rows in one PostgreSQL database, so one `SaveChangesAsync` keeps both or loses both."
      - "Once the email job belongs to another service, changing an order means writing to two systems, PostgreSQL and RabbitMQ: a dual write, which no single transaction covers."
      - "Publishing after `SaveChangesAsync` loses the message if the process stops between the two steps: the order is saved and no email ever goes out."
      - "Publishing before `SaveChangesAsync` can announce a change that is never saved, for example a cancellation whose save fails on a concurrency conflict."
      - "Publishing inside a database transaction does not help: rolling the transaction back cannot take back a message RabbitMQ has already accepted."
      misconceptions:
      - "Publishing right after `SaveChangesAsync` is safe, since the order is already saved by then."
      - "A `try`/`catch` around the publish is enough: if publishing fails, try it again."
      - "If the publish runs inside the database transaction, a rollback cancels the message too."
      depth_notes: "Chỉ nêu vấn đề; cách sửa — backend.l3.outbox-pattern. Không dạy giao dịch phân tán hay 2PC — backend/sagas-and-consistency GĐ3. Không dạy lại at-least-once hay optimistic concurrency — backend.l2.at-least-once-jobs, backend.l2.optimistic-concurrency."
    - id: backend.l3.outbox-pattern
      title:
        vi: "Outbox: lưu message trong cùng transaction với thay đổi của đơn"
        en: "The outbox saves a message in the same transaction as the order"
      main_path: true
      duration_min: 14
      skills: [backend.messaging.outbox]
      prereqs: [backend.l3.dual-write, design.l3.dispatching-domain-events, backend.l2.database-job-queue]
      related: [foundation.l1.transaction-intro, design.l3.domain-events]
      vocab: [outbox]
      example_tag: stage-3
      example_files:
      - DonHang.Domain/NotifyCustomerOnOrderEvents.cs
      - DonHang.Domain/IOutbox.cs
      - DonHang.Infrastructure/EfOutbox.cs
      - DonHang.Infrastructure/DonHangDbContext.cs
      outline:
      - "An outbox is a table in the sender's own database where a message is saved by the same transaction as the change it describes, to be published afterwards."
      - "At stage-3, `NotifyCustomerOnOrderEvents` reacts to `OrderPlaced`, `OrderCancelled` and `OrderShipped` by adding one row to `outbox_messages` through `IOutbox`, before `SaveChangesAsync` runs."
      - "The order's change and its outbox row are saved by one `SaveChangesAsync`, so there is never a changed order without its message, nor a message about a change that was rolled back."
      - "Each row holds a new id, the routing key and the message body as JSON; its `published_at` stays empty until the message has reached RabbitMQ."
      - "The stage-2 `notifications` table already worked this way for emails; the outbox does the same for messages bound for any other service."
      misconceptions:
      - "The outbox is a queue inside RabbitMQ."
      - "Saving the outbox row with a second `SaveChangesAsync`, right after the order's, is just as safe."
      - "With an outbox, the message is published at the moment the order is saved."
      depth_notes: "Không nói ai publish các dòng outbox — backend.l3.outbox-relay. Không dạy lại domain event hay dispatch — design.l3.dispatching-domain-events. Không dạy thư viện làm sẵn outbox — ngoài module."
    - id: backend.l3.outbox-relay
      title:
        vi: "Relay chỉ đánh dấu dòng outbox đã gửi sau khi RabbitMQ xác nhận"
        en: "The relay marks an outbox row sent only after RabbitMQ confirms it"
      main_path: true
      duration_min: 15
      skills: [backend.messaging.outbox]
      prereqs: [backend.l3.outbox-pattern, backend.l2.skip-locked-claiming, backend.l2.hosted-services]
      related: [backend.l2.at-least-once-jobs, backend.l2.retry-with-backoff]
      vocab: [publisher-confirm]
      example_tag: stage-3
      example_files:
      - DonHang.Messaging/OutboxRelay.cs
      - DonHang.Messaging/RabbitMqPublisher.cs
      - scripts/backend/broker-down.sh
      outline:
      - "At stage-3, `DonHang.Api` runs `OutboxRelay` as a hosted service; on each tick it claims unpublished `outbox_messages` rows with `FOR UPDATE SKIP LOCKED`, publishes each to `donhang.orders` and sets `published_at`."
      - "With publisher confirms turned on, RabbitMQ answers each publish once it has taken responsibility for the message, and the relay sets `published_at` only after that answer."
      - "The exchange and the queues are declared durable and each message is marked persistent, so a message RabbitMQ has confirmed survives a restart of the broker."
      - "While RabbitMQ is down, orders are still accepted and their rows wait in the outbox; `broker-down.sh` shows them published once the broker is back."
      - "A crash after the confirm and before `published_at` is saved publishes that row again: the outbox gives at-least-once delivery, so receivers must expect duplicates."
      misconceptions:
      - "Once the publish call returns without an error, RabbitMQ has stored the message, even without publisher confirms."
      - "If RabbitMQ is down, placing an order has to fail, or its email would be lost."
      - "An outbox makes sure each message is delivered exactly once."
      depth_notes: "Không dạy đọc WAL/CDC thay cho polling, dọn dòng outbox cũ hay thứ tự message — ngoài module. Không dạy kiểu queue và cụm RabbitMQ — ngoài module. Không dạy lại SKIP LOCKED — backend.l2.skip-locked-claiming."
    - id: backend.l3.consumer-acknowledgements
      title:
        vi: "RabbitMQ chỉ quên một message sau khi consumer xác nhận nó"
        en: "RabbitMQ forgets a message only after the consumer acknowledges it"
      main_path: true
      duration_min: 14
      skills: [backend.messaging.consumers]
      prereqs: [backend.l3.outbox-relay, backend.l2.at-least-once-jobs, design.l2.driving-and-driven-adapters]
      related: [backend.l2.skip-locked-claiming, backend.l2.hosted-services]
      vocab: [message-consumer]
      example_tag: stage-3
      example_files:
      - DonHang.Notifications/OrderEventsConsumer.cs
      - DonHang.Notifications/Program.cs
      - DonHang.Tests/Notifications/OrderEventsConsumerTests.cs
      outline:
      - "A message consumer is code that receives messages from a queue; at stage-3, `OrderEventsConsumer` is a hosted service in `DonHang.Notifications` that consumes `notifications.order-events`."
      - "Like a controller, the consumer is a driving adapter: it turns a message from outside into a call to the service's own code."
      - "With manual acknowledgement, RabbitMQ keeps each delivered message until the consumer acknowledges it, and delivers it again if the consumer's channel or connection closes first."
      - "`OrderEventsConsumer` acknowledges a message only after the `notifications` row it creates is saved, so a crash between receiving and saving loses nothing."
      - "A crash after the save and before the acknowledgement delivers the message again, so consuming is at-least-once too."
      - "When several copies of a service consume one queue, RabbitMQ hands each message to only one of them, so adding copies shares the work."
      misconceptions:
      - "RabbitMQ deletes a message from the queue as soon as it hands it to a consumer."
      - "The consumer should acknowledge first and save afterwards, so RabbitMQ is not kept waiting."
      - "Two copies of the Notifications service reading one queue each receive every message."
      depth_notes: "Không dạy prefetch, thứ tự message hay số consumer tối ưu — ngoài module. Không nói xử lý message trùng — backend.l3.idempotent-consumer; message lỗi mãi — backend.l3.dead-letter-queue. Không dạy lại driving adapter — design.l2.driving-and-driven-adapters."
    - id: backend.l3.idempotent-consumer
      title:
        vi: "Idempotent consumer: nhận một message hai lần, chỉ làm việc một lần"
        en: "An idempotent consumer handles a repeated message only once"
      main_path: true
      duration_min: 14
      skills: [backend.messaging.consumers]
      prereqs:
      - backend.l3.consumer-acknowledgements
      - backend.l2.idempotent-endpoints
      - foundation.l1.transaction-intro
      related: [backend.l2.at-least-once-jobs]
      vocab: [idempotent-consumer, inbox]
      example_tag: stage-3
      example_files:
      - DonHang.Notifications/OrderEventsConsumer.cs
      - DonHang.Notifications/NotificationsDbContext.cs
      - DonHang.Tests/Notifications/OrderEventsConsumerTests.cs
      - scripts/backend/duplicate-message.sh
      outline:
      - "Both the outbox relay and a missing acknowledgement can repeat a message, so a consumer must expect any message to arrive more than once."
      - "An idempotent consumer handles a repeated message without repeating its effect; Đơn Hàng's consumer spots a repeat by the message id the relay copies from the outbox row."
      - "At stage-3 the consumer saves the message id in `inbox_messages` and the new `notifications` row in one transaction, and the id is that table's primary key."
      - "When the id is already in `inbox_messages`, the consumer acknowledges the message and does nothing else, so `duplicate-message.sh` publishes one message twice and gets one email."
      - "The check works because the inbox row and the effect are saved in one transaction; a check made in another system could not be saved together with them."
      misconceptions:
      - "RabbitMQ drops duplicate messages, so a consumer never sees the same one twice."
      - "Skipping a message when its order already has a `notifications` row is enough to stop duplicates."
      - "Saving the message id after the email has been sent is just as safe."
      depth_notes: "Không nói thời gian giữ hay dọn dòng inbox, không khử trùng lặp ở mail server — ngoài module. Không dạy lại idempotent endpoint — backend.l2.idempotent-endpoints."
    - id: backend.l3.dead-letter-queue
      title:
        vi: "Message lỗi mãi được chuyển sang dead-letter queue"
        en: "A message that keeps failing moves to a dead-letter queue"
      main_path: true
      duration_min: 13
      skills: [backend.messaging.consumers]
      prereqs: [backend.l3.idempotent-consumer, backend.l2.retry-with-backoff]
      related: [backend.l3.exchanges-and-bindings]
      vocab: [poison-message, dead-letter-queue]
      example_tag: stage-3
      example_files:
      - DonHang.Notifications/RabbitMqTopology.cs
      - DonHang.Notifications/OrderEventsConsumer.cs
      - scripts/backend/dead-letter.sh
      outline:
      - "A poison message is one the consumer can never handle, such as a body that is not valid JSON; putting it back in the queue would make it fail again on every delivery."
      - "A dead-letter queue is an ordinary queue that receives the messages another queue gives up on, so a person can inspect them later."
      - "At stage-3 `notifications.order-events` names a dead-letter exchange, and the consumer rejects a message it cannot read without requeueing it, so RabbitMQ moves it to `notifications.order-events.dead`."
      - "For any other failure the consumer returns the message to the queue; the queue's delivery limit dead-letters it after a set number of deliveries, so it is not retried forever."
      - "RabbitMQ records on a dead-lettered message which queue it left and why, and `dead-letter.sh` prints that record."
      misconceptions:
      - "A message that fails should go back in the queue until it finally works."
      - "Messages in the dead-letter queue are retried automatically after a while."
      - "A dead-letter queue is a special component that needs a server of its own."
      depth_notes: "Không dạy retry trễ bằng TTL, đưa message từ dead-letter queue về lại hay cảnh báo khi nó có message — ngoài module; panel số message ở backend/observability, alert rule ở devops/incidents (GĐ4). Không dạy lại retry/backoff — backend.l2.retry-with-backoff."
  - id: sagas-and-consistency
    title:
      vi: "Saga và tính nhất quán giữa các service"
      en: "Sagas and consistency across services"
    stage: 3
    summary:
      vi: "Hoàn tiền một đơn đã thanh toán khi Payments là service riêng: hiểu vì sao không dùng giao dịch phân tán, chia việc thành saga gồm các bước cục bộ nối bằng message, giữ đơn ở trạng thái dở dang, bù khi cổng thanh toán từ chối, và chọn choreography hay orchestration."
      en: "Refund a paid order once Payments is a service of its own: see why a distributed transaction is avoided, split the work into a saga of local steps joined by messages, mark the order while the saga runs, compensate when the gateway refuses, and choose choreography or orchestration."
    lessons:
    - id: backend.l3.payments-service
      title:
        vi: "Payments thành service riêng, giữ bảng payments và cổng thanh toán"
        en: "Payments becomes a service that owns payments and the gateway"
      main_path: true
      duration_min: 13
      skills: [backend.consistency.distributed]
      prereqs: [design.l3.when-to-extract-a-service, backend.l3.idempotent-consumer, management.l2.design-doc]
      related: [design.l3.module-owns-its-tables, design.l3.anti-corruption-layer, backend.l3.message-broker]
      vocab: []
      example_tag: stage-3
      example_files:
      - docker-compose.yml
      - DonHang.Payments/Program.cs
      - DonHang.Payments/PaymentsDbContext.cs
      - docs/design/refund-design.md
      outline:
      - "At stage-3 `DonHang.Payments` is a separate service with its own database, `donhang_payments`, which holds the `payments` table; `DonHang.Api` no longer reads or writes payment rows."
      - "Only `DonHang.Payments` calls the payment gateway, so the gateway's address and key are configured in that one service and in no other part of Đơn Hàng."
      - "The second version of `refund-design.md` gives the reason for the split: the gateway's key and the money records stay in one service that is deployed and given access on its own."
      - "A refund now changes data owned by three services: the refund row in Payments, the order's status in `DonHang.Api` and the customer's email in Notifications."
      - "Payments learns about refund requests the way Notifications learns about orders: through the same RabbitMQ exchange, outbox and inbox, not a mechanism of its own."
      misconceptions:
      - "Now that Payments is a service, the API can call it over HTTP and wait for the refund inside the customer's request."
      - "Payments can still set the order's status in Đơn Hàng's database, since both services use PostgreSQL."
      - "Each new service needs its own way of sending messages, so Payments brings a second broker."
      depth_notes: "Không nói refund đi qua các service theo thứ tự nào — backend.l3.saga; không nói vì sao không gộp vào một transaction — backend.l3.two-phase-commit. Không dạy lại lý do tách service — design.l3.when-to-extract-a-service; không nói thanh toán (charge) — ngoài module."
    - id: backend.l3.two-phase-commit
      title:
        vi: "Two-phase commit trải được nhiều database nhưng bắt chúng chờ nhau"
        en: "Two-phase commit can span databases, but makes each wait on the others"
      main_path: true
      duration_min: 14
      skills: [backend.consistency.distributed]
      prereqs: [backend.l3.payments-service, backend.l3.dual-write, backend.l2.skip-locked-claiming]
      related: [foundation.l1.transaction-intro, backend.l2.transactions-in-practice]
      vocab: [distributed-transaction, two-phase-commit]
      example_tag: stage-3
      example_files: [docs/design/refund-design.md, scripts/backend/prepare-transaction.sh]
      outline:
      - "A distributed transaction is one transaction over several databases or systems; the stage-2 refund design saved the refund, the order and the email in one transaction, which at stage-3 would need one."
      - "In two-phase commit a coordinator first asks every participant to prepare, so each can still commit later; only if all succeed does it tell all of them to commit, otherwise all roll back."
      - "A prepared participant keeps its row locks until the coordinator's decision arrives; if the coordinator stops, it cannot decide alone and those rows stay locked."
      - "PostgreSQL offers this through `PREPARE TRANSACTION`, which is off by default because `max_prepared_transactions` is 0; `prepare-transaction.sh` shows Đơn Hàng's database refusing it."
      - "RabbitMQ cannot join a PostgreSQL transaction and the gateway's HTTP API has no prepare step, so `refund-design.md` rejects two-phase commit as an option for refunds."
      misconceptions:
      - "Two-phase commit makes a change across services as cheap and safe as a transaction in one database."
      - "If one participant is slow, two-phase commit just times out and rolls back, and the others lose nothing."
      - "Any system that supports transactions can take part in a two-phase commit with any other."
      depth_notes: "Không dạy XA, cách phục hồi sau khi coordinator hỏng, three-phase commit hay đồng thuận — ngoài module. Không nói cách thay thế — backend.l3.saga. Không dạy lại row lock hay dual write — backend.l2.skip-locked-claiming, backend.l3.dual-write."
    - id: backend.l3.saga
      title:
        vi: "Saga thay một transaction lớn bằng chuỗi transaction cục bộ"
        en: "A saga replaces one big transaction with a chain of local ones"
      main_path: true
      duration_min: 15
      skills: [backend.sagas.steps]
      prereqs:
      - backend.l3.two-phase-commit
      - backend.l3.outbox-pattern
      - backend.l3.idempotent-consumer
      - design.l3.dispatching-domain-events
      related: [backend.l3.exchanges-and-bindings, management.l2.design-doc]
      vocab: [saga]
      example_tag: stage-3
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Payments/RefundRequestedConsumer.cs
      - DonHang.Api/Messaging/PaymentEventsConsumer.cs
      - scripts/backend/refund-saga.sh
      outline:
      - "A saga is a sequence of local transactions, each in one service, where each step saves its change and publishes a message that starts the next step."
      - "At stage-3 `POST /api/v1/orders/{id}/refund` moves the order to `refunding` and saves an `order.refund-requested` outbox row in one transaction, then answers `202 Accepted`."
      - "`DonHang.Payments` consumes that message and saves a `pending` refund row; a later transaction there saves the gateway's answer together with a `payment.refunded` outbox row."
      - "`DonHang.Api` consumes `payment.refunded` and, in one transaction, moves the order to `cancelled` and saves an `order.refunded` row, from which Notifications sends the email."
      - "Every step reuses the messaging module: the outbox keeps each step's message from being lost, and each consumer's inbox makes a repeated message harmless."
      - "`refund-saga.sh` requests a refund for order 1 and prints the order's status and the refund row as the saga moves on."
      misconceptions:
      - "A saga is a product you install, like RabbitMQ."
      - "When a later step of a saga fails, the earlier steps are rolled back automatically."
      - "The refund endpoint should wait for Payments, so it can return the final result."
      depth_notes: "Không nói bước thất bại — backend.l3.compensating-action; trạng thái giữa các bước — backend.l3.eventual-consistency; ai điều phối — backend.l3.choreography-vs-orchestration. Không dạy thứ tự message — mỗi bước chỉ sinh message sau bước trước."
    - id: backend.l3.eventual-consistency
      title:
        vi: "Các service khớp nhau sau một lúc, không phải ngay khi đổi"
        en: "Services agree after a while, not at the moment of the change"
      main_path: true
      duration_min: 13
      skills: [backend.consistency.distributed]
      prereqs: [backend.l3.saga, backend.l2.cache-invalidation]
      related: [backend.l3.message-broker, management.l2.non-functional-requirements]
      vocab: [strong-consistency, eventual-consistency]
      example_tag: stage-3
      example_files:
      - scripts/backend/refund-saga.sh
      - scripts/backend/payments-down.sh
      - DonHang.Api/Controllers/OrdersController.cs
      outline:
      - "Inside one PostgreSQL database, a query that starts after a transaction commits sees its change: this is strong consistency, and it ends at the boundary of each service."
      - "While a refund saga runs, the services disagree for a while: Payments can already show `refunded` while the order still shows `refunding`."
      - "Eventual consistency means that once every message has been handled and no new change arrives, all services agree; it promises no time limit."
      - "`payments-down.sh` stops `DonHang.Payments`: refund requests are still accepted and their orders stay `refunding` until the service is back and works through its queue."
      - "The API reports `refunding` instead of pretending the refund is done, which is what the refund requirements ask the customer to see."
      misconceptions:
      - "Eventual consistency means the data may stay wrong for good."
      - "Eventually consistent services catch up within a fixed time, such as a second."
      - "While Payments is down, refund requests should fail, so the services never disagree."
      depth_notes: "Không dạy CAP, PACELC hay replica đọc — GĐ4 và backend/multitenancy-and-sharding. Không nói chặn thay đổi khác lúc saga chạy — backend.l3.saga-in-progress-status. Không dạy lại cache cũ — backend.l2.cache-invalidation. Mục 2 không có script riêng — chỉ nói bằng lời."
    - id: backend.l3.saga-in-progress-status
      title:
        vi: "Trạng thái refunding chặn mọi thay đổi khác khi saga đang chạy"
        en: "A refunding status keeps other changes away while the saga runs"
      main_path: true
      duration_min: 13
      skills: [backend.sagas.steps]
      prereqs:
      - backend.l3.eventual-consistency
      - design.l2.status-changes-through-methods
      - design.l3.aggregates-and-invariants
      - backend.l2.problem-types
      related: [backend.l2.optimistic-concurrency, management.l2.requirements-document]
      vocab: []
      example_tag: stage-3
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Tests/Domain/OrderTests.cs
      - DonHang.Api/Controllers/OrdersController.cs
      outline:
      - "Unlike one transaction, a saga cannot hide its unfinished work: between its steps, other requests can read the same order and try to change it."
      - "At stage-3 `Order.RequestRefund()` accepts only a `paid` order and moves it to `refunding`; `Ship()` and `Cancel()` refuse a `refunding` order, and the API answers `409`."
      - "A second refund request for the same order is refused the same way, so a customer cannot start two refunds for one order."
      - "From stage-3 `Cancel()` also refuses a `paid` order, closing the gap `refund-design.md` left open: every paid order leaves through the refund saga."
      - "The new status is a rule of the order, so it lives in `Order` and `OrderTests` checks it like the other status rules."
      misconceptions:
      - "Staff can still ship an order while its refund runs; the refund will catch up."
      - "Holding a row lock on the order for the whole saga would keep others out more simply."
      - "`refunding` is only a label for the app to show; the server does not need to check it."
      depth_notes: "Không nói khi hoàn tiền thất bại thì đơn về đâu — backend.l3.compensating-action. Không dạy lại phương thức đổi trạng thái hay problem type — design.l2.status-changes-through-methods, backend.l2.problem-types. Không sửa DonHang.App."
    - id: backend.l3.compensating-action
      title:
        vi: "Bước saga thất bại được bù bằng một thay đổi mới, không rollback"
        en: "A failed saga step is undone by a new change, not a rollback"
      main_path: true
      duration_min: 14
      skills: [backend.sagas.steps]
      prereqs: [backend.l3.saga-in-progress-status, backend.l2.role-based-access]
      related: [backend.l3.dead-letter-queue, management.l2.requirements-document]
      vocab: [compensating-action]
      example_tag: stage-3
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Payments/RefundSender.cs
      - DonHang.Api/Messaging/PaymentEventsConsumer.cs
      - scripts/backend/refund-declined.sh
      outline:
      - "The earlier steps of a saga are already committed, so a later failure cannot roll them back; each needs a compensating action, a new change that undoes its effect for the business."
      - "At stage-3, when the gateway refuses a refund, Payments marks the refund row `failed` with the gateway's reason and publishes `payment.refund-failed`."
      - "`DonHang.Api` compensates by moving the order from `refunding` back to `paid` and saving an `order.refund-failed` row, so the customer is told and the order can ship again."
      - "Compensating keeps history instead of erasing it: the `failed` row and its reason stay, and staff find them through `GET /api/v1/refunds?status=failed`."
      - "Money returned by the gateway cannot be taken back, so the steps after it, cancelling the order and sending the email, are retried until they succeed rather than undone."
      - "`refund-declined.sh` asks for a refund the fake gateway refuses and prints the order back at `paid`."
      misconceptions:
      - "When a later step fails, the database rolls back the earlier steps."
      - "A compensating action deletes the rows the failed saga created, as if nothing had happened."
      - "Every step of a saga can be undone, including an email already sent."
      depth_notes: "Không nói khi nào cổng bị coi là từ chối hay thử lại — backend.l3.safe-to-repeat-saga-steps. Không dạy hoàn một phần hay đơn shipped — ngoài phạm vi refund-requirements. Không dạy lại dead-letter queue — backend.l3.dead-letter-queue."
    - id: backend.l3.safe-to-repeat-saga-steps
      title:
        vi: "Bước saga gọi cổng thanh toán phải lặp lại được mà không hoàn tiền hai lần"
        en: "A saga step that calls the gateway must be safe to repeat"
      main_path: true
      duration_min: 15
      skills: [backend.sagas.steps]
      prereqs:
      - backend.l3.compensating-action
      - backend.l2.retry-with-backoff
      - backend.l2.idempotent-endpoints
      - design.l3.anti-corruption-layer
      related: [backend.l2.skip-locked-claiming, backend.l2.at-least-once-jobs]
      vocab: []
      example_tag: stage-3
      example_files:
      - DonHang.Payments/RefundSender.cs
      - DonHang.Payments/GatewayRefundClient.cs
      - DonHang.Tests/Payments/RefundSenderTests.cs
      - scripts/backend/gateway-down.sh
      outline:
      - "`RefundSender` in `DonHang.Payments` claims due `pending` refund rows with `FOR UPDATE SKIP LOCKED` and calls the gateway for each, as `NotificationSender` does for emails."
      - "Every call for one row sends the same idempotency key, `refund-` followed by the row's id, so a retry after a timeout cannot refund the payment twice."
      - "`GatewayRefundClient` is the anti-corruption layer: it turns the gateway's own answers into three outcomes Đơn Hàng uses: refunded, refused, or try again later."
      - "An error or no answer from the gateway schedules another try with exponential backoff; only a refusal, or 24 hours of failed tries, marks the row `failed` and starts the compensation."
      - "`gateway-down.sh` stops the fake gateway: the refund stays `pending` with growing `attempts`, and completes once the gateway is back."
      misconceptions:
      - "A timeout from the gateway means no refund happened, so a new request with a new key is safe."
      - "The gateway's own status names can be stored as they are; translating them is extra work."
      - "Retrying a refund forever is safer than ever marking it failed."
      depth_notes: "Không dạy timeout, circuit breaker — backend/resilience GĐ3; không dạy cổng gọi ngược báo kết quả — refund-design loại. Không dạy lại backoff, idempotency key, SKIP LOCKED hay ACL — backend.l2.retry-with-backoff, backend.l2.idempotent-endpoints, design.l3.anti-corruption-layer."
    - id: backend.l3.choreography-vs-orchestration
      title:
        vi: "Choreography hay orchestration: ai quyết bước tiếp theo của saga"
        en: "Choreography or orchestration: who decides a saga's next step"
      main_path: true
      duration_min: 13
      skills: [backend.sagas.coordination]
      prereqs: [backend.l3.safe-to-repeat-saga-steps, backend.l3.exchanges-and-bindings]
      related: [design.l3.context-map, design.l3.domain-events]
      vocab: [saga-choreography, saga-orchestration]
      example_tag: stage-3
      example_files:
      - DonHang.Payments/RabbitMqTopology.cs
      - DonHang.Notifications/RabbitMqTopology.cs
      - DonHang.Api/Messaging/PaymentEventsConsumer.cs
      outline:
      - "In choreography no service directs the saga: each reacts to the others' messages, as Đơn Hàng's refund does through `order.refund-requested` and `payment.refunded`."
      - "Payments binds its own queue to `order.refund-requested` on `donhang.orders`, so `DonHang.Api` publishes an event without knowing which service acts on it."
      - "In orchestration one orchestrator keeps the saga's state, sends each service a command, and picks the next step from each reply."
      - "Choreography needs no extra part but spreads the flow: to follow one refund you read the bindings and consumers of three services."
      - "Orchestration puts the flow in one place at the price of a part every step depends on; it tends to pay off when a saga has many steps and failure paths."
      misconceptions:
      - "Choreography and orchestration are two libraries for building sagas."
      - "An orchestrator always has to be a separate service."
      - "Choreography is always better, because the services never depend on each other."
      depth_notes: "Không xây orchestrator hay process manager trong repo, không dạy workflow engine — ngoài module. Không dạy lại publish/subscribe hay binding — backend.l3.exchanges-and-bindings."
  - id: observability
    title:
      vi: "Observability: theo một request qua nhiều service"
      en: "Observability: following one request across services"
    stage: 3
    summary:
      vi: "Theo một yêu cầu hoàn tiền qua DonHang.Api, RabbitMQ, Payments và Notifications: gửi span của mỗi service tới Tempo bằng OpenTelemetry, mang ngữ cảnh trace qua HTTP và qua outbox, tìm log của một trace bằng trace id, lấy mẫu trace mà vẫn giữ trọn, và theo dõi message tồn trong queue."
      en: "Follow one refund through DonHang.Api, RabbitMQ, Payments and Notifications: send each service's spans to Tempo with OpenTelemetry, carry the trace context over HTTP and through the outbox, find a trace's logs by its id, sample whole traces, and watch queue backlogs."
    lessons:
    - id: backend.l3.observability
      title:
        vi: "Observability: biết chuyện gì đã xảy ra với một request từ bên ngoài"
        en: "Observability: telling from outside what happened to one request"
      main_path: true
      duration_min: 13
      skills: [backend.observability.signals]
      prereqs:
      - devops.l2.centralized-logs
      - devops.l2.grafana-dashboards
      - backend.l2.database-job-queue
      - backend.l3.choreography-vs-orchestration
      related:
      - devops.l2.why-monitoring
      - backend.l1.structured-logging
      - backend.l1.exception-handling-middleware
      vocab: [observability, telemetry]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Middleware/RequestLoggingMiddleware.cs
      - DonHang.Api/Jobs/NotificationSender.cs
      - DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs
      outline:
      - "Observability is how well you can tell what happened inside a running system from the telemetry it sends out, including for questions nobody planned for when the code was written."
      - "Telemetry is the data a program sends out about its own work: the logs and metrics Đơn Hàng already has, and a third kind, added in this module, that follows one request."
      - "Metrics answer how many and how fast across all requests, such as the `5xx` rate on the dashboard, but cannot say what happened to one particular order."
      - "At stage-2 the line `RequestLoggingMiddleware` writes for `POST /api/v1/orders` and the line `NotificationSender` writes for that order's email share no field, so only their times link them."
      - "The `unhandled exception` line from `ExceptionHandlingMiddleware` holds no method or path, so when two requests fail at once no field says which error belongs to which request line."
      - "Once one refund passes through `DonHang.Api`, RabbitMQ, `DonHang.Payments` and `DonHang.Notifications`, matching lines by time gets harder with every service and every request running at once."
      misconceptions:
      - "Observability is a new name for monitoring: it just means more dashboards."
      - "With enough log lines I can always rebuild what happened to one order."
      - "Searching Loki for the order id finds every line about that order."
      - "Matching log lines by their timestamps is precise enough to follow one request."
      depth_notes: "Không dạy trace, span — backend.l3.traces-and-spans; OpenTelemetry — backend.l3.opentelemetry-sdk. Không đặt SLO hay alert — GĐ4 (backend/capacity-and-slo, devops/incidents). Không dạy lại metric, Loki — devops/monitoring-basics."
    - id: backend.l3.traces-and-spans
      title:
        vi: "Trace là cây các span có thời gian của một request qua nhiều service"
        en: "A trace is one request's tree of timed spans across services"
      main_path: true
      duration_min: 14
      skills: [backend.observability.tracing]
      prereqs: [backend.l3.observability, backend.l3.saga]
      related:
      - design.l1.tracing-a-request-through-layers
      - backend.l2.efcore-generated-sql
      - devops.l2.grafana-dashboards
      vocab: [distributed-trace, trace-span, tempo]
      example_tag: stage-3
      example_files:
      - scripts/backend/trace-refund.sh
      - docker-compose.yml
      - deploy/monitoring/grafana/provisioning/datasources/datasources.yml
      outline:
      - "A trace records one piece of work, such as one request, across every process it reaches; every span in it carries the same trace id."
      - "A span is one timed operation inside a trace, such as handling one HTTP request or running one SQL command, with a name, a start time, a duration and attributes."
      - "Every span except the first names its parent span, so a trace forms a tree that shows which operation caused which."
      - "At stage-3 every service sends its spans to Tempo, a store for traces that Grafana queries as a third data source next to Prometheus and Loki."
      - "`trace-refund.sh` requests a refund and prints its trace from Tempo as an indented tree, one line per span with its service and name and a count of its SQL spans, from `DonHang.Api` through Payments to Notifications."
      - "The consumer spans of the refund saga start after `POST /api/v1/orders/{id}/refund` has already answered `202`, so a child span can end long after its parent."
      misconceptions:
      - "A trace is just a more detailed log file of one service."
      - "Each service keeps its own trace of a request, and someone matches them up later."
      - "Tracing records every line of code that ran, like a debugger does."
      - "A child span always ends before its parent does."
      depth_notes: "Không nói span được tạo thế nào — backend.l3.opentelemetry-sdk; trace id đi qua HTTP, RabbitMQ thế nào — backend.l3.trace-context-propagation, backend.l3.tracing-through-the-outbox. Không dạy span event, link giữa trace, TraceQL, giao diện Tempo chi tiết — ngoài module."
    - id: backend.l3.opentelemetry-sdk
      title:
        vi: "OpenTelemetry biến việc của mỗi service thành span gửi đi qua OTLP"
        en: "OpenTelemetry turns each service's work into spans sent over OTLP"
      main_path: true
      duration_min: 15
      skills: [backend.observability.tracing]
      prereqs: [backend.l3.traces-and-spans, devops.l2.centralized-logs, backend.l1.hosting-and-program-cs]
      related: [devops.l2.metrics-endpoint, backend.l3.payments-service]
      vocab: [opentelemetry, instrumentation, otlp]
      example_tag: stage-3
      example_files:
      - DonHang.Api/Program.cs
      - Directory.Packages.props
      - deploy/monitoring/alloy/config.alloy
      - docker-compose.yml
      outline:
      - "OpenTelemetry is an open standard with libraries for producing telemetry: an API that code calls, an SDK that collects and exports, and OTLP, the protocol for sending the data on."
      - "In .NET a span is a `System.Diagnostics.Activity` started from an `ActivitySource`; the OpenTelemetry SDK records only activities from the sources it has been told to listen to."
      - "Instrumentation is code that creates spans for a library: ASP.NET Core, `HttpClient` and Npgsql instrumentation give spans for requests, outgoing calls and SQL commands with no change to controllers."
      - "At stage-3 each service's `Program.cs` calls `AddOpenTelemetry()` with its own service name and exports spans over OTLP to Alloy, which forwards them to Tempo."
      - "The SDK exports spans in batches in the background, so a request does not wait for its spans to reach Tempo."
      - "Because the services speak only OTLP to Alloy, moving traces to another store changes Alloy's configuration, not the services' code."
      misconceptions:
      - "OpenTelemetry is a product like Grafana that stores traces and shows them."
      - "To get spans, every controller action has to start and stop its own."
      - "Sending spans makes every request wait for Tempo, and fails it when Tempo is down."
      depth_notes: "Không chuyển metric sang OpenTelemetry/Meter API: giữ prometheus-net (exporter Prometheus của OpenTelemetry cho ASP.NET Core còn prerelease); không gửi log qua OTLP. Không dạy span tự viết, semantic conventions — ngoài module. Truyền trace — backend.l3.trace-context-propagation."
    - id: backend.l3.trace-context-propagation
      title:
        vi: "Header traceparent mang trace từ process này sang process kế tiếp"
        en: "The traceparent header carries a trace from one process to the next"
      main_path: true
      duration_min: 13
      skills: [backend.observability.tracing]
      prereqs:
      - backend.l3.opentelemetry-sdk
      - backend.l3.safe-to-repeat-saga-steps
      - foundation.l1.http-request-response
      related: [design.l3.anti-corruption-layer]
      vocab: [trace-context, context-propagation]
      example_tag: stage-3
      example_files:
      - DonHang.Payments/GatewayRefundClient.cs
      - DonHang.Payments/Program.cs
      - scripts/backend/traceparent.sh
      outline:
      - "Context propagation passes the trace id and the current span id from one process to the next, so the receiver's spans join the sender's trace instead of starting a new one."
      - "Over HTTP this trace context travels in the W3C `traceparent` header: a version, a 32-hex-digit trace id, a 16-hex-digit parent span id and flags, joined by dashes."
      - "ASP.NET Core instrumentation reads an incoming `traceparent`, and `HttpClient` instrumentation writes one on each outgoing call, so neither controllers nor clients handle it."
      - "At stage-3 the call `GatewayRefundClient` makes from Payments to the fake gateway carries `traceparent`, so the gateway's span is part of the refund's trace."
      - "`traceparent.sh` sends a request with a `traceparent` it made up, then finds the API's spans in Tempo under that same trace id."
      misconceptions:
      - "Tempo puts spans from different services into one trace by matching their times."
      - "Each service creates its own trace id, and the ids get linked later."
      - "Passing the trace along means adding a trace id parameter to every method and endpoint."
      depth_notes: "Không nói RabbitMQ — backend.l3.tracing-through-the-outbox. Không dạy header tracestate, baggage, định dạng propagation khác hay có nên tin traceparent từ internet — ngoài module. Không dạy lại header HTTP, ACL — foundation.l1.http-request-response, design.l3.anti-corruption-layer."
    - id: backend.l3.tracing-through-the-outbox
      title:
        vi: "Qua outbox, ngữ cảnh trace được lưu cùng dòng message"
        en: "Through the outbox, the trace context is saved with the message row"
      main_path: true
      duration_min: 15
      skills: [backend.observability.tracing]
      prereqs:
      - backend.l3.trace-context-propagation
      - backend.l3.outbox-relay
      - backend.l3.consumer-acknowledgements
      related: [backend.l3.saga, backend.l3.outbox-pattern, backend.l3.dual-write]
      vocab: []
      example_tag: stage-3
      example_files:
      - DonHang.Messaging/OutboxMessage.cs
      - DonHang.Messaging/OutboxRelay.cs
      - DonHang.Messaging/MessageTracing.cs
      - DonHang.Tests/Messaging/TracePropagationTests.cs
      outline:
      - "RabbitMQ messages carry headers too, so a publisher can put `traceparent` in them and a consumer's span can continue the publisher's trace."
      - "With an outbox, the relay publishes later and outside the request, so the context current at publish time is the relay's own, not that of the request that saved the row."
      - "At stage-3 a new outbox row stores the current `traceparent` in its `trace_parent` column, in both `DonHang.Api` and `DonHang.Payments`; a refund row in `payments` stores one too, for `RefundSender`'s span."
      - "`OutboxRelay` starts a publish span whose parent is the stored context, and puts that span's `traceparent` in the message headers."
      - "Each consumer starts its span as a child of the context in the message header, so one refund's spans from every service form one trace."
      - "A row saved before the column existed has no `trace_parent`, so its message starts a new trace instead of failing."
      misconceptions:
      - "RabbitMQ passes the trace along by itself, so nothing needs to be done."
      - "The relay publishes the request's row, so its publish belongs to that request's trace automatically."
      - "A trace has to end when the HTTP response is sent."
      depth_notes: "Không dạy link giữa trace, span cho lô message hay instrumentation có sẵn của RabbitMQ.Client — ngoài module. Không nối trace tới bước gửi email của NotificationSender. Không dạy lại outbox, relay — backend.l3.outbox-pattern, backend.l3.outbox-relay."
    - id: backend.l3.trace-ids-in-logs
      title:
        vi: "Trace id trong mỗi dòng log gom các log của một request lại"
        en: "A trace id in every log line ties one request's logs together"
      main_path: true
      duration_min: 14
      skills: [backend.observability.correlation]
      prereqs: [backend.l3.tracing-through-the-outbox, devops.l2.json-logs, devops.l2.centralized-logs]
      related: [devops.l2.prometheus-scraping, backend.l1.structured-logging]
      vocab: [correlation-id]
      example_tag: stage-3
      example_files:
      - docker-compose.yml
      - deploy/monitoring/alloy/config.alloy
      - deploy/monitoring/grafana/provisioning/datasources/datasources.yml
      - scripts/backend/logs-for-trace.sh
      outline:
      - "A correlation id is an id that every record of one piece of work carries, so the records can be gathered later; once tracing is in place, the trace id is that id."
      - "At stage-3 every service's JSON log line carries, in its `Scopes`, the `TraceId` and `SpanId` of the span current when it was written, turned on by logging configuration with no change to the log calls."
      - "Alloy keeps the trace id as a field of each line, not as a Loki label, because a label with one value per request would create a new stream for every request."
      - "`logs-for-trace.sh` requests a refund, then with one LogQL query prints that refund's log lines from `DonHang.Api`, `DonHang.Payments` and `DonHang.Notifications`."
      - "In Grafana, the Loki data source turns the trace id in a log line into a link that opens the trace in Tempo."
      misconceptions:
      - "To find one request's logs, I must pass a request id into every log call."
      - "The trace id should be a Loki label, so that looking it up is fast."
      - "Logs and traces live in separate tools, so I have to line them up by time."
      depth_notes: "Không gửi log qua OTLP, không dạy log scope tự viết hay exemplar nối metric với trace — ngoài module. Không dạy lại log JSON, LogQL, label — devops.l2.json-logs, devops.l2.centralized-logs."
    - id: backend.l3.trace-sampling
      title:
        vi: "Sampling giữ trọn một phần trace, quyết một lần ở nơi trace bắt đầu"
        en: "Sampling keeps some whole traces, decided once where each one starts"
      main_path: true
      duration_min: 13
      skills: [backend.observability.tracing]
      prereqs: [backend.l3.trace-context-propagation, backend.l3.trace-ids-in-logs]
      related: [devops.l2.counters-and-rate, backend.l3.opentelemetry-sdk]
      vocab: [trace-sampling]
      example_tag: stage-3
      example_files: [DonHang.Api/Program.cs, docker-compose.yml, scripts/backend/trace-sampling.sh]
      outline:
      - "Recording and storing every span of every request costs CPU, network and storage in step with traffic, so a busy system keeps only some traces: this is sampling."
      - "With head sampling, the service where a trace starts decides whether to keep it, and the decision travels in the sampled flag of `traceparent`."
      - "A parent-based sampler follows the parent's decision for every span that has a parent, so all services keep or drop the same trace and kept traces stay whole."
      - "At stage-3 the root's ratio comes from configuration and the lab keeps every trace; `trace-sampling.sh` sends one `traceparent` marked sampled and one not, and only the first reaches Tempo."
      - "Đơn Hàng's request metrics come from prometheus-net, not from traces, so sampling traces does not change the request counts on the dashboard."
      - "Head sampling decides before the request has run, so it can drop the trace of a rare error; keeping traces by their outcome needs a component that waits for the whole trace."
      misconceptions:
      - "Keeping 10% of traces means each trace keeps 10% of its spans."
      - "Each service can keep 10% of its spans on its own, and the traces still come out whole."
      - "Once traces are sampled, the request rate on the dashboard is sampled too."
      depth_notes: "Không dạy tail sampling, sampling trong Alloy hay chọn tỉ lệ cho tải thật — ngoài module (chi phí — GĐ4). Không dạy lại traceparent — backend.l3.trace-context-propagation; counter — devops.l2.counters-and-rate."
    - id: backend.l3.queue-backlog-metrics
      title:
        vi: "Số message tồn trong queue cho thấy phía bất đồng bộ đang tụt lại"
        en: "A queue's backlog shows the asynchronous side falling behind"
      main_path: true
      duration_min: 13
      skills: [backend.observability.signals, devops.monitoring.dashboards]
      prereqs:
      - backend.l3.dead-letter-queue
      - devops.l2.counters-and-rate
      - devops.l2.grafana-dashboards
      - backend.l3.observability
      related: [backend.l3.eventual-consistency, devops.l2.prometheus-scraping, backend.l3.message-broker]
      vocab: []
      example_tag: stage-3
      example_files:
      - deploy/monitoring/prometheus.yml
      - deploy/monitoring/grafana/dashboards/donhang-api.json
      - docker-compose.yml
      - scripts/backend/queue-backlog.sh
      outline:
      - "At stage-3 a stopped or slow consumer does not slow `POST /api/v1/orders`: the API's request rate, errors and p95 stay normal while order emails wait in the queue."
      - "The number of messages waiting in a queue is a gauge: it rises while messages arrive faster than the consumer handles them and falls as it catches up."
      - "RabbitMQ's Prometheus plugin publishes queue numbers on port `15692`; by default it adds all queues together, so Đơn Hàng's scrape job asks it for one series per queue."
      - "Đơn Hàng's dashboard gains panels for messages waiting in `notifications.order-events` and in `notifications.order-events.dead`, where any message at all needs a person to look."
      - "`queue-backlog.sh` stops `notifications`, places orders and shows the queue's count rising in Prometheus while the API's `5xx` rate stays at zero."
      misconceptions:
      - "If the API's dashboard looks healthy, every part of Đơn Hàng is working."
      - "Payments and Notifications are fine as long as their containers are running."
      - "The number of messages in a queue is a counter, so I should read it with `rate()`."
      depth_notes: "Không dạy alert rule hay gửi cảnh báo khi dead-letter queue có message — GĐ4 (devops/incidents); không dạy thời gian chờ của từng message, prefetch, số consumer — ngoài module. Không dạy lại gauge, scrape — devops/monitoring-basics."
  - id: resilience
    title:
      vi: "Resilience: vẫn chạy khi một phụ thuộc hỏng"
      en: "Resilience: staying up when a dependency fails"
    stage: 3
    summary:
      vi: "Giữ Đơn Hàng trả lời được khi Redis, mail server hay cổng thanh toán chậm hoặc sập: đặt timeout cho mọi lần chờ, chọn trước phần được hạ cấp, rải lần thử lại bằng jitter, bọc lời gọi cổng thanh toán trong resilience pipeline có circuit breaker, và chặn tải bằng rate limiting và bulkhead."
      en: "Keep Đơn Hàng answering when Redis, the mail server or the payment gateway is slow or down: bound every wait with a timeout, choose in advance what degrades, spread retries with jitter, wrap gateway calls in a resilience pipeline with a circuit breaker, and cap load with rate limits and bulkheads."
    lessons:
    - id: backend.l3.slow-dependencies
      title:
        vi: "Phụ thuộc chậm gây hại nhiều hơn phụ thuộc đã sập"
        en: "A slow dependency does more harm than one that is down"
      main_path: true
      duration_min: 13
      skills: [backend.resilience.failure-modes]
      prereqs: [backend.l2.cache-aside, backend.l2.cache-stampede, foundation.l1.threads-and-async-intro]
      related: [foundation.l1.tcp-vs-udp, backend.l3.queue-backlog-metrics]
      vocab: [cascading-failure]
      example_tag: stage-3
      example_files:
      - scripts/backend/slow-dependency.sh
      - DonHang.Catalog/ProductCache.cs
      - DonHang.Catalog/CatalogModule.cs
      - docker-compose.yml
      outline:
      - "A dependency that is down usually fails at once, for example with a refused connection, while one that accepts the call but answers late or never keeps the caller waiting."
      - "A waiting request still holds what it took: async code frees the thread, but the client's connection, the request's memory and any database connection it opened stay taken until the wait ends."
      - "When requests start waiting faster than they finish, they pile up until a shared limit runs out, and requests that never use the slow dependency start to fail too: a cascading failure."
      - "Đơn Hàng connects to Redis with `abortConnect=false` and `BacklogPolicy.FailFast`, so while Redis is unreachable each Redis command fails at once and `ProductCache` reads PostgreSQL instead."
      - "`slow-dependency.sh` reads product 3 with Redis stopped, which answers quickly, then with Redis paused, which keeps the connection open without answering, and the same read takes seconds."
      misconceptions:
      - "The worst thing a dependency can do is go down completely."
      - "With async/await, a request that waits on a slow call costs the server nothing."
      - "A slow dependency only slows its own feature; the rest of the app is not affected."
      depth_notes: "Không dạy đặt timeout — backend.l3.timeouts; circuit breaker, bulkhead — các bài sau trong module. Không đo hay cấu hình connection pool của Npgsql. Không dạy lại cache-aside, SemaphoreSlim theo key — backend.l2.cache-aside, backend.l2.cache-stampede."
    - id: backend.l3.timeouts
      title:
        vi: "Timeout quyết định một lời gọi được bắt bạn chờ bao lâu"
        en: "A timeout decides how long a call may keep you waiting"
      main_path: true
      duration_min: 12
      skills: [backend.resilience.call-policies]
      prereqs: [backend.l3.slow-dependencies, backend.l2.retry-with-backoff, backend.l2.at-least-once-jobs]
      related: [design.l2.adapter-pattern, foundation.l1.tcp-vs-udp]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Infrastructure/MailKitEmailSender.cs
      - DonHang.Api/Jobs/NotificationSender.cs
      - docker-compose.yml
      outline:
      - "A timeout is the longest a caller waits for an answer; when it passes, the caller stops waiting and treats the call as failed."
      - "`MailKitEmailSender` sets `Timeout = 10_000` on MailKit's `SmtpClient`, so a network operation with the mail server that gets no answer for 10 seconds throws, and `NotificationSender` records a failed attempt."
      - "`NotificationSender` sends the emails of a batch one after another, so one send stuck until its timeout delays every email after it in that batch."
      - "Each library that talks over the network has its own timeout setting and default: Đơn Hàng sets the SMTP one in code and leaves Redis at the StackExchange.Redis default."
      - "A timeout ends the wait, not the work: the mail server may still deliver an email whose send timed out, which is why a retry can send it twice."
      misconceptions:
      - "Without a timeout, a call to a broken server still fails by itself sooner or later."
      - "A longer timeout is always safer, because fewer calls end in an error."
      - "The library's default timeout was chosen for my app, so I never need to look at it."
      depth_notes: "Không nêu giá trị mặc định cụ thể của từng thư viện. Timeout cho HttpClient qua resilience pipeline — backend.l3.resilience-pipeline. Không dạy lại at-least-once, backoff — backend.l2.at-least-once-jobs, backend.l2.retry-with-backoff."
    - id: backend.l3.graceful-degradation
      title:
        vi: "Với từng phụ thuộc, quyết trước phần nào vẫn chạy khi nó hỏng"
        en: "Decide for each dependency what still works without it"
      main_path: true
      duration_min: 13
      skills: [backend.resilience.failure-modes]
      prereqs:
      - backend.l3.timeouts
      - backend.l2.cache-aside
      - k8s.l1.health-endpoints
      - backend.l2.database-job-queue
      related: [backend.l3.eventual-consistency, k8s.l1.readiness-probes]
      vocab: [graceful-degradation]
      example_tag: stage-2
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Infrastructure/ProductCache.cs
      - DonHang.Infrastructure/QueuedNotifier.cs
      - scripts/backend/cache-aside.sh
      outline:
      - "Graceful degradation means that when a dependency fails, the system keeps its most important functions and loses only what needs that dependency, in a way chosen in advance."
      - "At stage-2 PostgreSQL is required: the `/health/ready` check needs a database connection, so the API reports itself not ready when PostgreSQL is unreachable."
      - "Redis is optional: `ProductCache` treats any Redis error as a miss and reads PostgreSQL, and `Program.cs` leaves Redis out of the ready check on purpose."
      - "The mail server is deferred: placing an order only saves a `pending` notification row, so orders keep working while their emails wait for the mail server."
      - "A fallback moves load somewhere else: with Redis down, every product read becomes a PostgreSQL query, so the fallback is only safe while PostgreSQL can carry that load."
      misconceptions:
      - "If any dependency fails, the honest thing is for the whole API to report itself not ready."
      - "A fallback costs nothing, because it only runs when something is already broken."
      - "Graceful degradation means catching every exception and returning an empty result."
      depth_notes: "Không dạy lại cache-aside, health endpoint, job queue — backend.l2.cache-aside, k8s.l1.health-endpoints, backend.l2.database-job-queue. Giới hạn tải dồn lên PostgreSQL — backend.l3.bulkhead. Payments/Notifications khi tách service — backend.l3.eventual-consistency."
    - id: backend.l3.retry-jitter
      title:
        vi: "Jitter rải các lần thử lại để chúng không ập về cùng lúc"
        en: "Jitter spreads retries so they do not come back in waves"
      main_path: true
      duration_min: 12
      skills: [backend.resilience.call-policies]
      prereqs:
      - backend.l3.safe-to-repeat-saga-steps
      - backend.l2.retry-with-backoff
      - backend.l3.slow-dependencies
      related: [backend.l2.cache-stampede, backend.l3.timeouts]
      vocab: [jitter]
      example_tag: stage-3
      example_files:
      - DonHang.Payments/RefundSender.cs
      - DonHang.Tests/Payments/RefundSenderTests.cs
      - scripts/backend/retry-jitter.sh
      outline:
      - "When the gateway fails, every refund that failed at that moment gets the same backoff, so they all come due together and reach the recovering gateway in one burst."
      - "Jitter is a random part added to each wait, so retries that failed together come back spread over a span of time instead of at one moment."
      - "At stage-3 `RefundSender` picks each wait at random between half of the backoff delay and the full delay, so the waits still grow with every attempt."
      - "`RefundSenderTests` checks that each computed wait falls inside that range, because a random wait cannot be compared with one exact value."
      - "`retry-jitter.sh` stops the fake gateway, requests refunds for orders 1, 5 and 10, and prints their next attempt times, which differ although the three refunds failed together."
      misconceptions:
      - "Exponential backoff already spreads the retries, so jitter adds nothing."
      - "Jitter only matters when many servers retry, not for one background job."
      - "A random wait makes a refund less reliable, since it might wait much longer than planned."
      depth_notes: "Không dạy các công thức jitter khác hay jitter có sẵn của thư viện resilience; không đổi NotificationSender. Không dạy lại backoff, idempotency key, SKIP LOCKED — backend.l2.retry-with-backoff, backend.l3.safe-to-repeat-saga-steps."
    - id: backend.l3.resilience-pipeline
      title:
        vi: "Resilience pipeline bọc mọi lời gọi qua một HttpClient"
        en: "A resilience pipeline wraps every call through one HttpClient"
      main_path: true
      duration_min: 15
      skills: [backend.resilience.call-policies]
      prereqs: [backend.l3.timeouts, backend.l3.retry-jitter, backend.l3.safe-to-repeat-saga-steps]
      related: [design.l3.anti-corruption-layer, design.l2.decorator-pattern, backend.l3.opentelemetry-sdk]
      vocab: [resilience-pipeline]
      example_tag: stage-3
      example_files:
      - DonHang.Payments/Program.cs
      - DonHang.Payments/GatewayRefundClient.cs
      - Directory.Packages.props
      - scripts/backend/gateway-slow.sh
      outline:
      - "A resilience pipeline is a chain of strategies, such as a timeout or a retry, that every call passes through; Microsoft.Extensions.Http.Resilience attaches one to an `HttpClient` registration."
      - "At stage-3 Payments registers the `HttpClient` that `GatewayRefundClient` uses with `AddResilienceHandler`, so every gateway call goes through the pipeline and `GatewayRefundClient` holds no timeout code."
      - "Strategies run in the order they are added: the first one added wraps all the ones after it and sees every call they make."
      - "The pipeline's timeout strategy ends a gateway call that has no answer within the configured time, and `GatewayRefundClient` reports it as try again later."
      - "Unlike `AddStandardResilienceHandler`, the pipeline has no retry: `RefundSender` already retries each refund on later rounds, and retries in both layers multiply the calls to a failing gateway."
      - "`gateway-slow.sh` makes the fake gateway answer late and shows the refund's attempt ending at the timeout while the refund stays `pending`."
      misconceptions:
      - "The standard resilience handler fits every client, since it was built for exactly this."
      - "Retrying inside the call and again from the background job is twice as safe."
      - "The order in which strategies are added does not matter, because each one works on its own."
      depth_notes: "Circuit breaker trong pipeline — backend.l3.circuit-breaker. Không dạy IHttpClientFactory chi tiết, hedging, rate limiter phía client — ngoài module. Không dạy lại timeout, backoff, ACL — backend.l3.timeouts, backend.l3.retry-jitter, design.l3.anti-corruption-layer."
    - id: backend.l3.circuit-breaker
      title:
        vi: "Circuit breaker ngừng gọi một phụ thuộc cứ hỏng liên tục"
        en: "A circuit breaker stops calling a dependency that keeps failing"
      main_path: true
      duration_min: 15
      skills: [backend.resilience.call-policies]
      prereqs: [backend.l3.resilience-pipeline, backend.l3.slow-dependencies]
      related: [backend.l3.safe-to-repeat-saga-steps, backend.l3.compensating-action]
      vocab: [circuit-breaker]
      example_tag: stage-3
      example_files:
      - DonHang.Payments/Program.cs
      - DonHang.Payments/GatewayRefundClient.cs
      - DonHang.Tests/Payments/GatewayCircuitBreakerTests.cs
      - scripts/backend/circuit-breaker.sh
      outline:
      - "A circuit breaker watches the outcomes of calls to one dependency and, once too many fail, stops sending calls for a while: they fail at once without reaching the dependency."
      - "Closed, it lets calls through and counts failures; open, it rejects every call until a break time passes; half-open, it lets a trial call through, which closes it on success or opens it again."
      - "The breaker in Payments' pipeline opens when the share of failed calls in a time window passes a limit, and only after a minimum number of calls, set low for `RefundSender`'s few calls."
      - "The breaker is added before the timeout, so an attempt ended by the timeout counts as a failure, like an error or a `5xx` answer; the gateway refusing a refund is a normal answer and does not count."
      - "While the circuit is open, each due refund fails at once without a call and is scheduled again with backoff, so the gateway gets no calls from Payments while it recovers."
      - "`circuit-breaker.sh` stops the fake gateway, shows Payments logging that the circuit opened, starts the gateway again and shows the trial call that closes the circuit."
      misconceptions:
      - "A circuit breaker is a retry with a limit on the number of tries."
      - "Once the circuit opens, someone has to close it by hand."
      - "Any failed answer should open the circuit, including the gateway refusing a refund."
      - "When the circuit is open, the refunds waiting for the gateway are lost."
      depth_notes: "Không dạy breaker dùng chung giữa nhiều bản Payments, mở/đóng bằng tay, breaker cho Redis hay RabbitMQ — ngoài module. Không dạy lại pipeline, compensation — backend.l3.resilience-pipeline, backend.l3.compensating-action."
    - id: backend.l3.rate-limiting
      title:
        vi: "Rate limiting giới hạn tần suất một khách được đặt đơn"
        en: "Rate limiting caps how often one customer may place orders"
      main_path: true
      duration_min: 14
      skills: [backend.resilience.load-limits]
      prereqs:
      - backend.l3.graceful-degradation
      - backend.l1.middleware-pipeline
      - backend.l2.resource-based-authorization
      - devops.l1.reverse-proxy-basics
      related: [foundation.l1.http-status-codes, backend.l2.idempotent-endpoints, backend.l2.cache-stampede]
      vocab: [rate-limiting]
      example_tag: stage-3
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - scripts/backend/rate-limit.sh
      outline:
      - "Rate limiting caps how many requests a client may make in a period, so one client sending too many cannot take the capacity other clients need."
      - "At stage-3 `POST /api/v1/orders` goes through ASP.NET Core's rate limiting middleware with a fixed window per customer, keyed on the `sub` of the access token."
      - "A request over the limit is rejected before the controller runs with `429 Too Many Requests` and a `Retry-After` header; the middleware's default rejection status is `503`, so Đơn Hàng sets `429`."
      - "The limit is per customer, not per client IP address, because behind Caddy every request reaches the API from Caddy's address."
      - "Each API process keeps its own counts in memory, so with two copies of the API running a customer can place up to twice the limit."
      - "`rate-limit.sh` places orders as one customer until the API answers `429`, while an order from a second customer still succeeds."
      misconceptions:
      - "Limiting by IP address is the simplest fair rule, and it works the same behind a proxy."
      - "The limit holds across the whole system, however many copies of the API run."
      - "A limited request should get `503`, since the server is too busy."
      depth_notes: "Không dạy token bucket, sliding window, limiter phân tán qua Redis hay giới hạn ở Caddy — ngoài module. Giới hạn số request chạy cùng lúc — backend.l3.bulkhead. Không dạy lại middleware, policy — backend.l1.middleware-pipeline, backend.l2.resource-based-authorization."
    - id: backend.l3.bulkhead
      title:
        vi: "Bulkhead không cho một loại việc dùng hết tài nguyên chung"
        en: "A bulkhead keeps one kind of work from using up shared capacity"
      main_path: true
      duration_min: 14
      skills: [backend.resilience.load-limits]
      prereqs:
      - backend.l3.rate-limiting
      - backend.l3.graceful-degradation
      - backend.l3.slow-dependencies
      - backend.l3.payments-service
      related:
      - k8s.l1.requests-and-limits
      - backend.l3.queue-backlog-metrics
      - design.l3.when-to-extract-a-service
      vocab: [bulkhead]
      example_tag: stage-3
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Api/Controllers/ProductsController.cs
      - docker-compose.yml
      - scripts/backend/bulkhead.sh
      outline:
      - "A bulkhead splits shared capacity into separate parts, like the sealed compartments of a ship, so a flood of one kind of work fills only its own part."
      - "At stage-3 Payments and Notifications run as separate processes, so a mail server that hangs ties up Notifications' resources and not the API's."
      - "Inside the API, product reads and orders use the same database connections, and with Redis down every product read needs one."
      - "At stage-3 product reads go through a concurrency limiter that lets a set number run at once and queues a few more; any read beyond that is answered `503` at once instead of waiting."
      - "`bulkhead.sh` stops Redis, sends many product reads at once, and shows some answered `503` while an order placed at the same time succeeds."
      misconceptions:
      - "Splitting the system into services is the only way to keep one failure from spreading."
      - "A bulkhead makes product reads more reliable."
      - "Rejecting a request at once is worse than letting it wait, because a waiting request succeeds in the end."
      depth_notes: "Không dạy kích thước connection pool của Npgsql, concurrency limiter của Polly hay giới hạn tài nguyên container — ngoài module; giới hạn theo khách — backend.l3.rate-limiting. Không dạy lại tách service — design.l3.when-to-extract-a-service."
  - id: multitenancy-and-sharding
    title:
      vi: "Multi-tenancy, partitioning và sharding"
      en: "Multi-tenancy, partitioning and sharding"
    stage: 3
    summary:
      vi: "Giữ dữ liệu của nhiều cửa hàng tách nhau bằng bảng chung, schema hay database riêng và row-level security, chia bảng lớn bằng partitioning, gánh việc đọc bằng read replica, rồi chọn shard key, truy vấn xuyên shard và thêm shard mà không phải chuyển phần lớn dữ liệu."
      en: "Keep many shops' data apart with shared tables, schemas or databases and row-level security, split a large table with partitioning, take reads off the primary with a replica, then choose a shard key, query across shards and add a shard without moving most of the data."
    lessons:
    - id: backend.l3.multi-tenancy
      title:
        vi: "Một hệ thống phục vụ nhiều cửa hàng mà không cửa hàng nào thấy dữ liệu của nhau"
        en: "One system can serve many shops that never see each other's data"
      main_path: true
      duration_min: 12
      skills: [backend.tenancy.isolation]
      prereqs: [backend.l2.resource-based-authorization, backend.l2.validating-provider-tokens]
      related: [backend.l3.rate-limiting, backend.l3.bulkhead]
      vocab: [tenant, multi-tenancy, tenant-isolation, noisy-neighbor]
      example_tag: stage-2
      example_files: [DonHang.Api/Controllers/OrdersController.cs, DonHang.Api/Authorization/OrderOwnerHandler.cs]
      outline:
      - "A tenant is one organisation that uses a system as if it were its own, such as one shop; multi-tenancy means one running system, code and databases, serves many tenants."
      - "Đơn Hàng's API serves a single shop at stage-3; this module tries multi-shop layouts on separate lab databases and leaves the choice for Đơn Hàng to a later stage."
      - "Tenant isolation means no request can read or change another tenant's data; one query that forgets its tenant filter is enough to break it."
      - "`OrdersController` takes the customer from the access token's `sub` claim, never from the request body; a tenant has to be found the same way, from the caller's verified identity."
      - "Tenants that share a system also share its CPU, database connections and rate limits, so one busy tenant can slow all the others: the noisy-neighbor problem."
      misconceptions:
      - "Each shop can send its shop id in a header, and the API filters every query by it."
      - "If every query in the code filters by shop today, the shops are isolated for good."
      - "Multi-tenancy means each shop gets its own copy of the application."
      depth_notes: "Không so cách tách dữ liệu (bảng chung, schema, database) — backend.l3.tenant-isolation-models; không dạy row-level security — backend.l3.row-level-security. Không dạy giới hạn tài nguyên theo tenant hay quyết định đa cửa hàng cho Đơn Hàng — GĐ4."
    - id: backend.l3.tenant-isolation-models
      title:
        vi: "Ranh giới dữ liệu giữa các cửa hàng nằm ở bảng, schema hay database"
        en: "Where to draw the line between one shop's data and the next"
      main_path: true
      duration_min: 16
      skills: [backend.tenancy.isolation]
      prereqs: [backend.l3.multi-tenancy, backend.l2.composite-indexes, design.l3.module-owns-its-tables]
      related: [backend.l3.payments-service, backend.l1.migrations]
      vocab: [shared-table-tenancy, schema-per-tenant, database-per-tenant]
      example_tag: stage-3
      example_files:
      - db/tenancy/shared-schema.sql
      - db/tenancy/schema-per-shop.sql
      - scripts/backend/tenancy-models.sh
      outline:
      - "With shared tables, every shop's rows sit in the same `orders` table with a `shop_id` column, so keys and indexes used for one shop's queries start with `shop_id`."
      - "With a schema per tenant, each shop has a PostgreSQL schema, a named group of tables inside one database, and the session's `search_path` decides which shop's `orders` a query reads."
      - "With a database per tenant, each shop has its own database; PostgreSQL cannot join tables of two databases in one query, and `tenancy-models.sh` shows the error it gives."
      - "`tenancy-models.sh` adds one column in each layout: one `ALTER TABLE` with shared tables, one per shop with a schema or a database per shop."
      - "Going from shared tables towards a database per shop buys stronger isolation and a backup per shop, at the cost of one more set of migrations, connections and monitoring per shop."
      - "The layouts can be mixed: when one shop is far larger than the rest, it can get its own database while the small shops share tables."
      misconceptions:
      - "A schema per shop isolates shops as strongly as a database per shop."
      - "A database per shop is always the safest choice, so it should be the default."
      - "Shared tables only need a `shop_id` column; the existing keys and indexes can stay as they are."
      depth_notes: "Không dạy row-level security — backend.l3.row-level-security; không dạy chuyển một shop sang layout khác, backup/restore theo shop hay chọn layout cho Đơn Hàng — GĐ4. Không dạy lại composite index — backend.l2.composite-indexes."
    - id: backend.l3.row-level-security
      title:
        vi: "Row-level security để PostgreSQL tự lọc dữ liệu theo cửa hàng"
        en: "Row-level security makes PostgreSQL apply the shop filter itself"
      main_path: true
      duration_min: 16
      skills: [backend.tenancy.isolation]
      prereqs: [backend.l3.tenant-isolation-models, backend.l2.transactions-in-practice]
      related: [backend.l2.resource-based-authorization]
      vocab: [row-level-security]
      example_tag: stage-3
      example_files: [db/tenancy/row-level-security.sql, scripts/backend/row-level-security.sh]
      outline:
      - "After `ENABLE ROW LEVEL SECURITY` on a table, the `USING` condition of its policies is added to every query on it, and a table with no policy shows such queries no rows at all."
      - "The table's owner, superusers and roles with `BYPASSRLS` skip the policies; the PostgreSQL image creates `donhang` as a superuser, so the demo switches to a separate role."
      - "The policy reads the shop from `current_setting('app.shop_id', true)` and turns a missing or empty value into null, so a request that never set its shop sees no rows, not every shop's."
      - "Pooled connections are reused by later requests, so the shop is set with `SET LOCAL` inside the request's transaction and is gone when that transaction ends."
      - "A policy for all commands with no `WITH CHECK` uses its `USING` condition for new rows too, so `row-level-security.sh` fails to insert an order for shop 2 while set to shop 1."
      - "A filter in application code protects only queries that go through that code; row-level security also covers raw SQL, reports and scripts that run as the restricted role."
      misconceptions:
      - "Once row-level security is on, every connection is filtered, including the one the API uses today."
      - "Setting the shop once when a connection opens is enough, because each request gets its own connection."
      - "With row-level security, the API no longer needs to know which shop the caller belongs to."
      depth_notes: "Không dạy policy riêng cho từng lệnh, policy RESTRICTIVE, chi phí của policy hay nối row-level security vào EF Core — ngoài module. API Đơn Hàng không bật row-level security ở stage-3. Không dạy lại transaction — backend.l2.transactions-in-practice."
    - id: backend.l3.table-partitioning
      title:
        vi: "Partitioning chia một bảng lớn thành nhiều bảng nhỏ theo một khóa"
        en: "Partitioning splits one large table into smaller ones by a key"
      main_path: true
      duration_min: 16
      skills: [backend.data.partitioning]
      prereqs: [backend.l2.indexes-and-plans, backend.l2.composite-indexes]
      related: [backend.l2.cursor-pagination]
      vocab: [table-partitioning, partition-key]
      example_tag: stage-3
      example_files: [db/partitioning/orders-by-month.sql, scripts/backend/partition-pruning.sh]
      outline:
      - "A partitioned table holds no rows itself: PostgreSQL stores each row in the partition whose range of the partition key contains it, here one partition per month of `placed_at`."
      - "`partition-pruning.sh` copies the 200,000 orders of `donhang_perf` into `orders_by_month`; the plan of a query for one month's orders reads only that month's partition."
      - "A query with no condition on the partition key, such as one customer's orders, reads every partition, so the key is chosen from the queries the table answers most."
      - "A primary key or unique constraint on a partitioned table must include the partition key, so `orders_by_month` uses `(id, placed_at)` as its key."
      - "Removing a month of old orders is detaching or dropping its partition, which avoids the row-by-row work of a large `DELETE`."
      - "Every partition stays in the same database on the same server, so partitioning does not add the CPU or disk of another machine."
      misconceptions:
      - "Partitioning makes every query on the table faster."
      - "Partitioning spreads a table over several database servers."
      - "A partitioned table can keep `id` alone as its primary key."
      depth_notes: "Không dạy partition kiểu list/hash, partition lồng nhau, tự tạo partition tháng mới hay đổi bảng `orders` thật sang partition — ngoài module. Chia qua nhiều server — backend.l3.sharding. Không dạy lại đọc plan — backend.l2.indexes-and-plans."
    - id: backend.l3.read-replicas
      title:
        vi: "Read replica gánh bớt việc đọc nhưng có thể chậm hơn bản chính"
        en: "A read replica takes reads off the primary but can lag behind it"
      main_path: true
      duration_min: 15
      skills: [backend.data.replication]
      prereqs: [backend.l3.eventual-consistency, backend.l3.table-partitioning]
      related: [backend.l2.cache-invalidation, k8s.l1.deploying-don-hang]
      vocab: [read-replica, replication-lag, read-your-writes]
      example_tag: stage-3
      example_files: [docker-compose.yml, scripts/backend/replica-lag.sh]
      outline:
      - "A read replica is a second PostgreSQL server that receives the primary's changes as a stream and applies them; it answers queries but refuses every write."
      - "At stage-3 the Compose profile `replica` adds `db-replica`, and `replica-lag.sh` shows an `UPDATE` sent to it failing because its transactions are read-only."
      - "Replication is asynchronous by default: the primary commits without waiting for the replica, so the replica can return a value from before a committed change; the delay is replication lag."
      - "The lab replica waits on purpose before applying changes, so `replica-lag.sh` reads a product's old price on the replica right after the primary commits the new one."
      - "A request that reads right after its own write, such as showing the order just placed, must read from the primary; this read-your-writes rule decides which reads may go to a replica."
      - "A replica adds capacity for reads only: every write still goes to the one primary, so growth in writes needs the data split across several servers instead."
      misconceptions:
      - "A replica always holds the same data as the primary, since it copies every change."
      - "Sending every `GET` to a replica is safe, because reads cannot break anything."
      - "Adding replicas also makes placing orders faster."
      depth_notes: "Không dạy replication đồng bộ, failover hay nâng replica thành primary — devops/secrets-backup-dr và GĐ4; API Đơn Hàng chưa đọc từ replica. Không dạy lại eventual consistency — backend.l3.eventual-consistency."
    - id: backend.l3.sharding
      title:
        vi: "Sharding chia các dòng qua nhiều database theo shard key"
        en: "Sharding splits rows across databases by a shard key"
      main_path: true
      duration_min: 15
      skills: [backend.data.sharding]
      prereqs: [backend.l3.table-partitioning, backend.l3.read-replicas, backend.l3.tenant-isolation-models]
      related: [design.l3.module-owns-its-tables]
      vocab: [sharding, database-shard, shard-key, hot-shard]
      example_tag: stage-3
      example_files: [db/sharding/shard-skew.sql, scripts/backend/shard-skew.sh]
      outline:
      - "Sharding stores each row in one of several databases, usually on separate servers, chosen from the row's shard key; each such database is a shard and holds only its share of the rows."
      - "Unlike partitions, shards each have their own CPU, disk and connections, so write capacity grows with the number of shards, but no single database sees all the rows."
      - "`shard-skew.sh` counts the orders of `donhang_perf` per shard for `customer_id % 4` and for `id % 4`: by customer, one shard holds most orders, because customer 1 placed 81% of them."
      - "A shard holding far more than its share of rows or traffic is a hot shard; one very large customer or tenant makes one however the keys are spread."
      - "Rows read together should share a shard key: sharding orders and `order_items` by `customer_id` keeps one customer's history on one shard, readable in one query."
      - "A database per tenant is sharding by tenant: the tenant id is the shard key, and one large shop can be a hot shard by itself."
      misconceptions:
      - "Sharding orders by order id is best, because it spreads the orders evenly."
      - "A hot shard goes away if I add more shards."
      - "After sharding, the shards still act like one database for joins and transactions."
      depth_notes: "Không dạy truy vấn thiếu shard key — backend.l3.cross-shard-queries; thêm shard — backend.l3.rebalancing-shards. Không dạy công cụ sharding bên ngoài hay consistent hashing — ngoài module."
    - id: backend.l3.cross-shard-queries
      title:
        vi: "Truy vấn không có shard key phải hỏi mọi shard"
        en: "A query without the shard key has to ask every shard"
      main_path: true
      duration_min: 17
      skills: [backend.data.sharding]
      prereqs: [backend.l3.sharding, backend.l2.cursor-pagination, backend.l3.saga, design.l3.read-model]
      related: [backend.l3.two-phase-commit, backend.l3.timeouts]
      vocab: [scatter-gather]
      example_tag: stage-3
      example_files:
      - scripts/backend/shard-split.sh
      - samples/DonHang.Samples/Samples/Data/Sharding/ShardedOrders.cs
      outline:
      - "`shard-split.sh` copies `donhang_perf` into two databases by `customer_id % 2`; the lab keeps both on one PostgreSQL server, where real shards would sit on separate servers."
      - "`ShardedOrders` sends a query for one customer's latest orders to the single shard that customer's id maps to, because the shard key is in the query."
      - "The latest orders of all customers have no shard key, so `ShardedOrders` asks every shard for its own newest N, merges the lists and keeps the N newest: a scatter-gather."
      - "Each shard has to return N rows, not N divided by the number of shards, because the newest orders may all sit on one shard."
      - "A scatter-gather query waits for its slowest shard and fails when any shard is down, so frequent queries without the shard key point to the wrong key or to a separate read model."
      - "A change to rows on two shards is no longer one transaction; it needs the same tools as a change across two services, such as a saga."
      misconceptions:
      - "To get the 10 newest orders from 2 shards, I take the 5 newest from each."
      - "If one shard is down, a query over all shards still gives a correct answer from the others."
      - "Two orders on different shards can still be updated in one transaction, as before."
      depth_notes: "Không dạy phân trang cursor xuyên shard, GROUP BY xuyên shard hay postgres_fdw — ngoài module. Không dạy lại saga, read model — backend.l3.saga, design.l3.read-model."
    - id: backend.l3.rebalancing-shards
      title:
        vi: "Bảng ánh xạ bucket cho thêm shard mà không phải chuyển phần lớn dữ liệu"
        en: "A shard map lets you add a shard without moving most rows"
      main_path: true
      duration_min: 15
      skills: [backend.data.sharding]
      prereqs: [backend.l3.sharding, backend.l3.cross-shard-queries]
      related: [backend.l2.cache-aside]
      vocab: [shard-map]
      example_tag: stage-3
      example_files: [db/sharding/rebalance.sql, scripts/backend/rebalance-shards.sh]
      outline:
      - "Rebalancing moves rows between shards when a shard is added or one has grown too large, and every row must stay findable while it moves."
      - "With `shard = key % N`, going from 4 to 5 shards changes the shard of 4 in every 5 keys; `rebalance-shards.sh` counts the orders of `donhang_perf` that would move."
      - "A shard map splits keys into a fixed number of buckets, such as `id % 64`, and a table says which shard holds each bucket; adding a shard reassigns some buckets and moves only their rows."
      - "`rebalance-shards.sh` gives 12 of the 64 buckets to a fifth shard and counts the orders that move: only the rows of those 12 buckets."
      - "Every query looks up the shard map first, so the map is a dependency of every request, and a bucket being moved must not take writes on two shards at once."
      - "The number of buckets is fixed when the map is created, and it caps how many shards the data can ever be spread over."
      misconceptions:
      - "Adding a fifth shard to `key % 4` moves only the fifth shard's share of the rows."
      - "Rebalancing is a one-off copy that can run at night while the system works as usual."
      - "A shard map with 64 buckets lets me grow to any number of shards later."
      depth_notes: "Không dạy consistent hashing, chia đôi một shard, chuyển dữ liệu trực tuyến từng bước hay công cụ rebalancing — ngoài module. Không dạy lại chọn shard key — backend.l3.sharding."
- level: 4
  title:
    vi: "Level 4"
    en: "Level 4"
  modules:
  - id: consistency-and-ownership
    title:
      vi: "Nhất quán, quyền sở hữu dữ liệu và thay đổi schema không gián đoạn"
      en: "Consistency, data ownership and changing schemas without downtime"
    stage: 4
    summary:
      vi: "Chọn cho từng thao tác của Đơn Hàng giữa trả lời và nhất quán, giữa nhanh và mới nhất, giao mỗi loại dữ liệu cho một chủ, đổi schema và message trong lúc hệ thống vẫn chạy, rồi chốt bố cục dữ liệu đa cửa hàng trong ADR 0013 và kế hoạch đưa nó vào từng bước."
      en: "Choose for each Đơn Hàng operation between answering and staying consistent and between fast and fresh, give each kind of data one owner, change schemas and messages while the system runs, then decide the multi-shop data layout in ADR 0013 and plan its rollout in steps."
    lessons:
    - id: backend.l4.cap-theorem
      title:
        vi: "Khi mạng đứt, mỗi thao tác phải chọn: vẫn trả lời hay giữ nhất quán"
        en: "During a partition, each operation either answers or stays consistent"
      main_path: true
      duration_min: 14
      skills: [backend.consistency.tradeoffs]
      prereqs: [backend.l3.eventual-consistency, backend.l3.read-replicas, backend.l3.graceful-degradation]
      related: [design.l4.trade-off-points, backend.l3.slow-dependencies, backend.l2.cache-aside]
      vocab: [network-partition, cap-theorem]
      example_tag: stage-4
      example_files:
      - scripts/backend/db-unreachable.sh
      - docs/design/consistency-per-operation.md
      - DonHang.Catalog/ProductCache.cs
      - DonHang.Domain/OrderService.cs
      outline:
      - "A network partition is a fault that splits a system into parts that keep running but cannot reach each other, so each part sees the others as unreachable."
      - "The CAP theorem says that during a partition, a system holding copies of data cannot both answer every request and give only the latest value (strong consistency); it gives up one of the two."
      - "A networked system cannot rule partitions out, so the real choice is what each operation does while one lasts: answer with the copy it has, or refuse."
      - "`db-unreachable.sh` stops PostgreSQL while Redis still holds product 3: reading product 3 is still answered from the copy, while listing products and placing an order fail."
      - "A write that must be saved in the owner's database can only refuse while that database is unreachable; a read served from a copy can choose to answer, with data that may be old."
      - "`consistency-per-operation.md` records each operation's choice and its business reason, such as a product page that may show a price a few minutes old, while a refund is never shown as done before the gateway confirms it."
      misconceptions:
      - "A well-built system can keep consistency, availability and partition tolerance all at once."
      - "The consistency in CAP is the same thing a database transaction keeps inside one database."
      - "CAP is chosen once for the whole system, by picking the right database."
      depth_notes: "Không dạy PACELC, độ trễ — backend.l4.pacelc; không bàn readiness probe loại Pod khi DB mất, đồng thuận, quorum. Dừng `db` không giống hệt đứt mạng (lỗi nhanh, không treo). Không dạy lại eventual consistency, cache-aside — backend.l3.eventual-consistency, backend.l2.cache-aside."
    - id: backend.l4.pacelc
      title:
        vi: "Kể cả khi không có sự cố, dữ liệu mới hơn phải trả bằng câu trả lời chậm hơn"
        en: "Even without failures, fresher data costs a slower answer"
      main_path: true
      duration_min: 13
      skills: [backend.consistency.tradeoffs]
      prereqs: [backend.l4.cap-theorem, backend.l2.cache-invalidation, backend.l3.read-replicas]
      related: [backend.l3.eventual-consistency, design.l4.quality-attribute-scenarios]
      vocab: [latency, pacelc]
      example_tag: stage-4
      example_files:
      - docs/design/consistency-per-operation.md
      - DonHang.Catalog/ProductCache.cs
      - scripts/backend/replica-lag.sh
      outline:
      - "Latency is the time from sending a request to receiving its answer; PACELC extends CAP: if there is a partition, choose availability or consistency, else choose lower latency or consistency."
      - "Without any failure, keeping copies in step still costs time: a read from a nearby copy is fast but may be old, and a write that waits until every copy has it answers later."
      - "`ProductCache` chooses latency for reading one product: the Redis copy answers without a query, and if the delete after a price change is missed it stays old until its 5-minute TTL ends."
      - "PostgreSQL replication is asynchronous by default, so a commit does not wait for the replica; synchronous replication makes each commit wait for it, trading slower writes for a replica that holds every committed change."
      - "One system makes different choices per operation: product reads choose latency, while the API reads a customer's orders from the database it wrote them to, so a new order is always seen (read-your-writes)."
      - "`consistency-per-operation.md` gives each operation both choices, under a partition and in normal running, so a later change, such as reading from `db-replica`, is judged against the stated choice."
      misconceptions:
      - "Without failures there is no trade-off, so every read can be both fast and current."
      - "A cache only makes reads faster; it has nothing to do with consistency."
      - "Synchronous replication is always better, because no copy can ever fall behind."
      depth_notes: "Không dạy chi tiết `synchronous_commit` (`remote_apply`…), failover, multi-region — devops/k8s GĐ4. API không đọc từ replica ở stage-4; định tuyến đọc — backend/capacity-and-slo. Không dạy lại replication lag, cache invalidation — backend.l3.read-replicas, backend.l2.cache-invalidation."
    - id: backend.l4.data-ownership
      title:
        vi: "Mỗi loại dữ liệu có một chủ, mọi nơi khác chỉ giữ bản sao"
        en: "Each kind of data has one owner; everywhere else holds a copy"
      main_path: true
      duration_min: 14
      skills: [backend.data.ownership]
      prereqs:
      - backend.l4.pacelc
      - design.l3.module-owns-its-tables
      - backend.l3.payments-service
      - backend.l2.validating-provider-tokens
      related: [management.l3.proposing-an-adr, design.l4.distributed-monolith, design.l3.read-model]
      vocab: [data-ownership]
      example_tag: stage-4
      example_files:
      - docs/design/data-ownership.md
      - docs/adr/0008-xoa-bang-cu-trong-donhang.md
      - DonHang.Domain/Entities.cs
      - keycloak/donhang-realm.json
      outline:
      - "Data ownership means each kind of data has exactly one owner, the service or module that writes it and whose value counts when copies disagree; every other place holds a copy."
      - "`data-ownership.md` lists Đơn Hàng's data with its owner and its copies: Catalog owns products, Ordering owns orders and customers, Payments owns payments, Notifications owns emails, and Keycloak owns sign-in accounts."
      - "Each copy needs a stated way to stay current or a stated reason not to: the Redis copy of a product lives at most 5 minutes, while each order item keeps the price paid on purpose, because that price is a fact of the order."
      - "The old `payments` table in `donhang` is a copy nobody updates; accounting reconciles against the owner's database, `donhang_payments`, which is why ADR `0008` drops the old table only after they confirm."
      - "The list also shows a gap: a customer's email is kept by both Keycloak and `customers`, nothing keeps the two equal, and order emails use the `customers` value; the document records this as an open question."
      - "When two services both need to change the same data, the fix is to give it one owner and have the other ask that owner, by a message or a call, instead of letting both write."
      misconceptions:
      - "When two copies disagree, the one changed most recently is the correct one."
      - "Data that several services need should sit in one table that all of them write."
      - "`order_items` repeating the product's price is duplication that should be removed."
      depth_notes: "Không quyết ai giữ email khách (chỉ ghi câu hỏi mở), không đồng bộ Keycloak với `customers`. Không dạy lại module sở hữu bảng, read model — design.l3.module-owns-its-tables, design.l3.read-model. Chủ dữ liệu cửa hàng — backend.l4.shop-data-layout."
    - id: backend.l4.expand-and-contract
      title:
        vi: "Code cũ và mới dùng chung một schema, nên schema phải đổi qua các bước tương thích"
        en: "Old and new code share one schema, so change it in compatible steps"
      main_path: true
      duration_min: 15
      skills: [backend.data.schema-evolution]
      prereqs:
      - backend.l4.data-ownership
      - devops.l3.rollback-by-revert
      - devops.l3.ordering-a-sync
      - k8s.l1.rolling-updates
      related:
      - devops.l2.migrations-in-the-pipeline
      - backend.l1.migrations
      - design.l4.evolutionary-architecture
      vocab: [zero-downtime-migration, expand-contract]
      example_tag: stage-4
      example_files:
      - deploy/gitops/config-repo-kustomize/base/migrate-hook.yaml
      - DonHang.Infrastructure/Migrations/20261005231652_PaymentsAndNotificationsLeaveOrdering.cs
      - DonHang.Infrastructure/Migrations/20261101090000_DropOldNotificationsTable.cs
      - docs/adr/0008-xoa-bang-cu-trong-donhang.md
      outline:
      - "Argo CD runs the migration hook in wave 1, before the api Deployment in wave 2 is updated, and the rolling update then replaces the 2 api Pods a few at a time, so old Pods serve against the new schema for a while."
      - "A zero-downtime migration is a schema change made while the system keeps serving, which requires each migration to work with both the code before it and the code after it."
      - "Expand and contract splits an incompatible change into compatible steps: expand adds the new shape next to the old, the code moves to the new shape, and contract removes the old shape once no running version uses it."
      - "Moving emails out of `donhang` followed these steps: at stage-3 Notifications got a table of its own, `DonHangDbContext` stopped mapping the old one, and the scaffolded `DropTable` was deleted by hand, so the old table stayed."
      - "At stage-4 the migration `DropOldNotificationsTable` drops it, after the dump ADR `0008` asks for, in a release whose previous version no longer reads it, so an old Pod still running cannot fail on a missing table."
      misconceptions:
      - "The migration runs first and then every new Pod starts at once, so old code never meets the new schema."
      - "Renaming a column in one migration is fine as long as the code of the same release uses the new name."
      - "Expand and contract can go into one release, as long as the migrations run in the right order."
      depth_notes: "Không dạy khóa của lệnh DDL — backend.l4.migration-locks; message — backend.l4.message-schema-evolution. Không xóa bảng `payments` cũ (chờ kế toán, ADR 0008). Không dạy lại hook, sync wave, git revert — devops.l3.ordering-a-sync, devops.l3.rollback-by-revert."
    - id: backend.l4.migration-locks
      title:
        vi: "Khóa mà migration giữ, không phải thời gian chạy, quyết định ai phải chờ"
        en: "A migration's locks, not its length, decide who has to wait"
      main_path: true
      duration_min: 15
      skills: [backend.data.schema-evolution]
      prereqs:
      - backend.l4.expand-and-contract
      - backend.l2.skip-locked-claiming
      - backend.l2.indexes-and-plans
      - backend.l2.transactions-in-practice
      related: [backend.l2.composite-indexes, backend.l3.slow-dependencies]
      vocab: []
      example_tag: stage-4
      example_files: [scripts/backend/migration-locks.sh, scripts/backend/perf-db.sh]
      outline:
      - "Each schema change takes a lock on its table; plain `CREATE INDEX` takes one that lets reads continue but makes every `INSERT`, `UPDATE` and `DELETE` on the table wait until the index is built."
      - "`migration-locks.sh` holds a plain `CREATE INDEX` on the 200,000 orders of `donhang_perf` inside an open transaction: a `SELECT` still answers while an `INSERT` waits until its `lock_timeout` ends it."
      - "`CREATE INDEX CONCURRENTLY` lets writes continue while it builds, at the cost of a slower build; it cannot run inside a transaction block, and a failed build leaves an invalid index to drop."
      - "EF Core runs a migration's statements in a transaction unless the SQL is passed with `suppressTransaction: true`, which a concurrent index build needs."
      - "Even a quick `ALTER TABLE ... ADD COLUMN` needs the strongest lock for a moment; behind a long transaction that has read the table it waits, and every later query on the table waits behind it."
      - "Setting `lock_timeout` for a migration makes it fail fast instead of stalling the queries queued behind it, so it can be run again at a quieter moment."
      misconceptions:
      - "A migration that finishes in a second cannot block anyone."
      - "Adding an index only changes how reads work, so it is safe on a busy table."
      - "`CONCURRENTLY` makes an index build faster."
      depth_notes: "Không dạy bảng đầy đủ các chế độ khóa, pg_locks chi tiết, `NOT VALID` cho khóa ngoại — backend.l4.shop-id-rollout, hay công cụ migration trực tuyến. Không dạy lại row lock, index, transaction — backend.l2.skip-locked-claiming, backend.l2.indexes-and-plans."
    - id: backend.l4.message-schema-evolution
      title:
        vi: "Message chỉ được đổi theo cách mọi bên đọc vẫn đọc được"
        en: "A message may change only in ways every reader can still read"
      main_path: true
      duration_min: 15
      skills: [backend.data.schema-evolution]
      prereqs:
      - backend.l4.expand-and-contract
      - backend.l3.dead-letter-queue
      - backend.l2.breaking-changes
      - design.l4.distributed-monolith
      related: [design.l4.fitness-functions, backend.l3.outbox-relay, backend.l2.api-versioning]
      vocab: [schema-evolution]
      example_tag: stage-4
      example_files:
      - DonHang.Notifications/OrderEventsConsumer.cs
      - DonHang.Domain/OrderMessage.cs
      - scripts/backend/message-shapes.sh
      - DonHang.Tests/Messaging/OrderMessageContractTests.cs
      outline:
      - "Schema evolution is changing the shape of data that other programs read, such as a message body, while those programs keep running."
      - "Notifications and Payments read `OrderMessage` with `JsonSerializerOptions.Web`: a property they do not know is skipped, and one missing from the JSON is left at its default value."
      - "So adding a property breaks no reader, while renaming `customerEmail` makes Notifications reject every message as poison; `message-shapes.sh` publishes both and shows only the renamed one in the dead-letter queue."
      - "A deploy does not empty the outbox, the queue or the dead-letter queue, so old-shaped messages still arrive after it; a property a reader starts to need stays optional until no old message is left."
      - "When a shape has to break, the producer can publish the new shape under a new routing key beside the old one until every reader has moved: expand and contract applied to messages."
      - "`OrderMessageContractTests` serialises the API's `OrderMessage` and reads it with the copies in Notifications and Payments, so a change that breaks a reader fails in the pull request that makes it."
      misconceptions:
      - "Each service has its own copy of `OrderMessage`, so the API can rename its fields freely."
      - "Once every service runs the new version, no message of the old shape can arrive."
      - "Adding a field to a message forces every consumer to be updated before the producer."
      depth_notes: "Không dùng schema registry, Avro hay Protobuf; không dạy version trong header message — ngoài module. Không dạy lại breaking change của REST, dead-letter queue — backend.l2.breaking-changes, backend.l3.dead-letter-queue."
    - id: backend.l4.shop-data-layout
      title:
        vi: "Dữ liệu mọi cửa hàng nằm chung bảng, có row-level security canh giữ"
        en: "All shops' data shares tables, guarded by row-level security"
      main_path: true
      duration_min: 15
      skills: [backend.tenancy.data-layout]
      prereqs:
      - backend.l4.message-schema-evolution
      - design.l4.architecture-review-findings
      - design.l4.one-deployment-for-all-shops
      - backend.l3.row-level-security
      related:
      - backend.l3.tenant-isolation-models
      - backend.l4.data-ownership
      - backend.l3.multi-tenancy
      - design.l4.a-thousand-shops
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/adr/0013-du-lieu-cua-hang-trong-bang-chung.md
      - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
      - docs/team/multi-shop-requirements.md
      - db/tenancy/row-level-security.sql
      outline:
      - "ADR `0013` decides how shops' data is laid out inside the one shared deployment ADR `0012` chose, weighing shared tables, a schema per shop and a database per shop."
      - "A schema or a database per shop repeats every migration once per shop, as `tenancy-models.sh` showed; at 1,000 shops each release of a service would run its migrations 1,000 times."
      - "The ADR chooses shared tables with `shop_id` in every table that holds one shop's data, and row-level security as a second guard behind the shop filter in code, so a query that forgets its filter still sees one shop only."
      - "Opening a shop becomes adding a row to `shops`, with no new schema, database or deploy, which meets the requirement that a new shop needs no deploy."
      - "The ADR names what shared tables leave open: a busy shop still shares connections and limits with the others, and restoring one shop alone means extracting its rows instead of restoring a database."
      - "It names what would reopen the decision: a shop that outgrows the shared tables, or must be restored on its own, can move to a database of its own while the others stay shared."
      misconceptions:
      - "A database per shop is the only way to be sure shops never see each other's data."
      - "With row-level security on, the code no longer needs to filter by shop."
      - "Choosing shared tables means no shop can ever get a database of its own."
      depth_notes: "Không quyết lại ADR 0012; không sửa limiter theo cửa hàng — backend/capacity-and-slo. Đưa shop_id vào từng bước — backend.l4.shop-id-rollout. Không dạy lại các layout, row-level security — backend.l3.tenant-isolation-models, backend.l3.row-level-security."
    - id: backend.l4.shop-id-rollout
      title:
        vi: "Thêm cột cửa hàng vào bảng đang chạy cần ba lần phát hành, không phải một migration"
        en: "Adding a shop column to live tables takes three releases, not one"
      main_path: true
      duration_min: 15
      skills: [backend.tenancy.data-layout, backend.data.schema-evolution]
      prereqs: [backend.l4.shop-data-layout, backend.l4.migration-locks, backend.l4.message-schema-evolution]
      related:
      - backend.l4.expand-and-contract
      - backend.l3.row-level-security
      - design.l4.evolutionary-architecture
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/multi-shop-data-rollout.md
      - docs/adr/0013-du-lieu-cua-hang-trong-bang-chung.md
      - db/tenancy/shared-schema.sql
      outline:
      - "`multi-shop-data-rollout.md` puts `shop_id` into every table that holds one shop's data, in each service's own database, over three releases instead of one migration."
      - "Release 1 creates `shops` with today's shop as shop 1 and adds `shop_id` as `NOT NULL DEFAULT 1`; in PostgreSQL 17 a constant default does not rewrite the table, so existing rows get the value without a long lock."
      - "In release 1 the foreign keys to `shops` are added `NOT VALID` and validated in a separate step, and the indexes that start with `shop_id` are built concurrently, so no step blocks writes for longer than a moment."
      - "Release 2 makes the code take the shop from the caller's access token and carry `shopId` in every message as a new optional property; only then is the default dropped, so no new row gets a shop by accident."
      - "Release 3 turns on row-level security on `shop_id` and moves the services to a role without `BYPASSRLS`, once every request sets its shop with `SET LOCAL`."
      - "Each release leaves a schema the previous release's code still works with, so any one of them can be rolled back by deploying the version before it."
      misconceptions:
      - "Adding `shop_id` is one migration: add the column, fill it and make it required at once."
      - "Giving every existing row a `shop_id` means rewriting the whole table under a lock."
      - "Row-level security can be turned on in the same release that adds the column."
      depth_notes: "Đơn Hàng chưa chạy ba bước ở stage-4 (chỉ kế hoạch). Không chuyển shop sang database riêng, không backup theo shop — sysdesign/multi-shop-and-notifications. Không dạy lại khóa, expand/contract, row-level security — backend.l4.migration-locks, backend.l4.expand-and-contract."
  - id: security-architecture
    title:
      vi: "Kiến trúc bảo mật: mô hình mối đe dọa, ký số và nhật ký kiểm toán"
      en: "Security architecture: threat models, signatures and audit logs"
    stage: 4
    summary:
      vi: "Lập mô hình mối đe dọa cho Đơn Hàng theo từng ranh giới tin cậy, xếp biện pháp bảo mật thành nhiều lớp quanh cổng vào và thông tin đăng nhập của từng service, quyết ai giữ email khách trong ADR 0014, ký hóa đơn bằng khóa riêng có chứng chỉ, giữ khóa đó trong HSM theo ADR 0015 và thiết kế nhật ký kiểm toán không sửa lén được."
      en: "Build a threat model of Đơn Hàng boundary by boundary, layer its controls around the entry point and each service's credentials, decide who owns a customer's email in ADR 0014, sign invoices with a certified private key kept in an HSM under ADR 0015, and design an audit log that cannot be quietly rewritten."
    lessons:
    - id: backend.l4.threat-modeling
      title:
        vi: "Mô hình mối đe dọa hỏi điều gì có thể hỏng ở mỗi ranh giới tin cậy"
        en: "A threat model asks what can go wrong at each trust boundary"
      main_path: true
      duration_min: 15
      skills: [backend.security.threat-modeling]
      prereqs:
      - backend.l4.data-ownership
      - design.l4.architecture-review-findings
      - k8s.l3.network-policies
      - backend.l3.payments-service
      related:
      - backend.l4.shop-data-layout
      - management.l3.architecture-decision-record
      - devops.l3.software-supply-chain
      vocab: [threat-model, trust-boundary, stride]
      example_tag: stage-4
      example_files:
      - docs/design/threat-model.md
      - docker-compose.yml
      - deploy/gitops/config-repo-kustomize/base/network-policies.yaml
      outline:
      - "A threat model is a written list of what could go wrong with a system's security, where it could happen and what is done about each case, made from the system's data flow before an attacker finds the gaps."
      - "A trust boundary is a place in the data flow where data passes between parts that trust each other to different degrees, such as browser to Gateway, service to database, or Payments to the payment gateway."
      - "STRIDE, a canonical checklist, names six kinds of threat to ask about at each boundary: spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege."
      - "`threat-model.md` walks Đơn Hàng's stage-3 data flow boundary by boundary and gives each threat either the control that already answers it or a finding with a decision: fix, accept with a reason, or defer to a named plan."
      - "Its findings include every service signing in to PostgreSQL and RabbitMQ as the same user `donhang`, and refund requests recorded in a row that Payments itself can rewrite."
      - "The model is reviewed whenever the data flow changes; the multi-shop rollout adds the threat of one shop reading another's data, which ADR `0013` answers with row-level security behind the shop filter."
      misconceptions:
      - "Security gets checked by a penetration test at the end; it is not something you design."
      - "Since every request uses HTTPS, there is nothing left to model inside the system."
      - "A finished threat model lists every possible attack, so after it the system is safe."
      depth_notes: "Không dạy công cụ vẽ threat model, chấm điểm rủi ro theo thang số, pen test hay danh sách lỗ hổng ứng dụng (injection, XSS) — ngoài module. Từng phát hiện được làm tiếp ở các bài sau của module. Không dạy lại NetworkPolicy, row-level security — k8s.l3.network-policies, backend.l3.row-level-security."
    - id: backend.l4.api-gateway
      title:
        vi: "API gateway là một cửa vào chung, nhưng mỗi service vẫn tự kiểm token"
        en: "An API gateway is one way in, yet each service still checks its token"
      main_path: true
      duration_min: 14
      skills: [backend.security.layered-controls]
      prereqs:
      - backend.l4.threat-modeling
      - k8s.l2.gateway-api
      - backend.l2.validating-provider-tokens
      - k8s.l3.network-policies
      related: [devops.l1.reverse-proxy-and-tls, k8s.l2.tls-at-the-gateway, backend.l3.rate-limiting]
      vocab: [api-gateway, defense-in-depth]
      example_tag: stage-3
      example_files:
      - Caddyfile
      - deploy/gitops/config-repo/platform/edge/httproutes.yaml
      - DonHang.Payments/Program.cs
      - deploy/gitops/config-repo-kustomize/base/network-policies.yaml
      outline:
      - "An API gateway is the single entry point that receives every client request and routes it to the service that answers it, the one place for concerns all requests share, such as TLS and routing."
      - "In Đơn Hàng, Caddy in Compose and the Traefik Gateway on staging play this part: they route `/api/v1/refunds` to Payments and the rest of `/api/v1` to the API, and neither checks tokens."
      - "The API and Payments each check every token's signature, issuer, audience and expiry themselves with `AddJwtBearer`, so trusting a request never depends on which path it took to reach them."
      - "Defense in depth means stacking independent controls so that one failing or being bypassed does not open the system: the NetworkPolicy `from-the-gateway` lets only Traefik reach the two services, which still check every token."
      - "The per-customer limit on placing orders stays in the API's `Program.cs`, because it counts by the token's `sub`, which only a component that has checked the token can trust."
      - "Checking tokens only at the gateway would remove the repeated configuration, but every service would then trust whatever reaches it, and one gateway mistake would expose all of them."
      misconceptions:
      - "Once the gateway has checked the token, the services behind it can trust every request they get."
      - "Rules such as 'only the owner may read this order' belong in the API gateway, so services stay simple."
      - "Checking the same token in two places is wasted work that only slows requests down."
      depth_notes: "Không dạy BFF — frontend/stack-and-boundaries; mã hóa giữa Pod, mTLS — k8s/multi-cluster-and-mesh; client credentials, token exchange, sản phẩm API gateway. Không sửa giới hạn trong `Program.cs`. Không dạy lại Gateway API, kiểm token — k8s.l2.gateway-api, backend.l2.validating-provider-tokens."
    - id: backend.l4.shared-credentials
      title:
        vi: "Một mật khẩu chung cho mọi service trao cho mỗi service quyền của tất cả"
        en: "One password shared by every service gives each the power of all"
      main_path: true
      duration_min: 14
      skills: [backend.security.layered-controls]
      prereqs:
      - backend.l4.api-gateway
      - k8s.l3.roles-and-role-bindings
      - backend.l4.shop-id-rollout
      - backend.l3.message-broker
      related: [devops.l1.secrets-vs-config, backend.l3.row-level-security, k8s.l3.service-accounts]
      vocab: [blast-radius]
      example_tag: stage-4
      example_files: [docker-compose.yml, scripts/backend/shared-credentials.sh, docs/design/threat-model.md]
      outline:
      - "The blast radius of a compromise is everything an attacker can reach with what one compromised part holds; least privilege is how you keep it small."
      - "In Compose the API, Notifications and Payments connect to PostgreSQL as `donhang`, the superuser the `db` image creates from `POSTGRES_USER`, and to RabbitMQ as `donhang`, the broker's default user."
      - "`shared-credentials.sh` signs in with the user and password Notifications is given and reads `payments` in `donhang_payments` and the users table of `keycloak`, then shows the RabbitMQ user may configure, write and read everything."
      - "So a flaw in Notifications, which only sends emails, would let an attacker read payments and publish as Payments; a database role and RabbitMQ user per service, limited to its own data, would shrink that."
      - "A NetworkPolicy decides which Pods may open a connection, not what that connection may do once open; credentials and their permissions are the layer that limits it."
      - "`threat-model.md` plans per-service roles and users together with release 3 of the multi-shop rollout, which already moves the services to a role without `BYPASSRLS`."
      misconceptions:
      - "Services inside our own network trust each other anyway, so one shared password is fine."
      - "The NetworkPolicies already stop Notifications from touching the payments data."
      - "A superuser for the app is harmless because the app's own code never runs dangerous queries."
      depth_notes: "Đơn Hàng chưa tách role và user ở stage-4 (chỉ kế hoạch). Không dạy cú pháp GRANT, regex quyền của RabbitMQ, vault cấp mật khẩu động — ngoài module. Không dạy lại RBAC, quyền tối thiểu — k8s.l3.roles-and-role-bindings; BYPASSRLS — backend.l4.shop-id-rollout."
    - id: backend.l4.verified-email-owner
      title:
        vi: "Keycloak xác minh email của khách, nên Keycloak là chủ của nó"
        en: "Keycloak verifies a customer's email, so Keycloak should own it"
      main_path: true
      duration_min: 13
      skills: [backend.security.layered-controls, backend.data.ownership]
      prereqs:
      - backend.l4.shared-credentials
      - backend.l4.data-ownership
      - backend.l2.openid-connect-id-token
      - management.l3.weighing-options-in-an-adr
      related:
      - backend.l2.validating-provider-tokens
      - management.l3.proposing-an-adr
      - backend.l4.message-schema-evolution
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/adr/0014-keycloak-giu-email-khach-hang.md
      - docs/design/data-ownership.md
      - keycloak/donhang-realm.json
      - DonHang.Domain/Entities.cs
      outline:
      - "`data-ownership.md` leaves one question open: a customer's email is kept by Keycloak and by `customers`, nothing keeps the two equal, and order emails go to the `customers` copy."
      - "Keycloak records for each account whether its email is verified (`emailVerified` in the realm file), while `customers` keeps no such mark, so order details can go to an address nobody has confirmed lately."
      - "ADR `0014` weighs three options: keep both copies with a sync job, make Keycloak the owner and refresh the copy from the customer's token, or drop the copy and have Notifications ask Keycloak for every email."
      - "It chooses the second: the API refreshes `customers.email` from the `email` claim of the access token when the customer places an order, taking it only when `email_verified` is true."
      - "The third option was rejected because Notifications would need a credential that can read every account at Keycloak, widening its blast radius for a service that only sends emails."
      - "The ADR is accepted but not built at stage-4: `OrderMessage` keeps `customerEmail` unchanged, and the ADR names what would reopen it, such as emails sent to customers who have not signed in for a long time."
      misconceptions:
      - "The copy in our own database is the more reliable one, because our team controls it."
      - "Letting Notifications query Keycloak directly is the simplest fix and costs nothing in security."
      - "Once an ADR is accepted, the code has to change in the same release."
      depth_notes: "Không viết code làm mới email ở stage-4; không dạy admin API của Keycloak, cấu hình gửi email xác minh hay protocol mapper. Không dạy lại chủ dữ liệu, ID token — backend.l4.data-ownership, backend.l2.openid-connect-id-token. Không đổi hình dạng `OrderMessage`."
    - id: backend.l4.signing-documents
      title:
        vi: "Hóa đơn có chữ ký số thì ai giữ public key cũng tự kiểm được"
        en: "A signed invoice can be checked by anyone who has the public key"
      main_path: true
      duration_min: 15
      skills: [backend.security.signing]
      prereqs:
      - backend.l4.threat-modeling
      - backend.l2.validating-provider-tokens
      - devops.l3.signing-images
      - backend.l1.issuing-a-jwt
      related: [devops.l3.build-provenance, backend.l1.hashing-passwords]
      vocab: [digital-signature, non-repudiation]
      example_tag: stage-4
      example_files:
      - samples/DonHang.Samples/Samples/Security/InvoiceSigning.cs
      - samples/DonHang.Samples.Tests/InvoiceSigningTests.cs
      outline:
      - "A digital signature is a value computed from a hash of a document with a private key; anyone with the matching public key can check that the document is unchanged and was signed with that key."
      - "At stage-1 the API signed tokens with one HMAC key that both makes and checks signatures, so only the API could check them; a private-key signature can be checked by a customer or an auditor holding just the public key."
      - "Non-repudiation means the signer cannot credibly deny having signed, and it holds only while the private key is held by the signer alone."
      - "`InvoiceSigning` signs an invoice's bytes with `ECDsa` over SHA-256 and verifies them with the public key alone; its test changes one amount in the signed bytes and the check fails."
      - "A signature covers exact bytes, so the sample keeps the bytes it signed and verifies those, instead of signing an object and serialising it again later, which may produce different bytes."
      - "A signature does not hide the invoice: anyone can read it, and the signature only shows it has not changed since it was signed."
      misconceptions:
      - "Signing a document encrypts it, so only the receiver can read it."
      - "A valid signature proves that what the invoice says is true."
      - "Sending the invoice over HTTPS already proves later who issued it."
      depth_notes: "Không dạy định dạng chữ ký XML/PDF, quy định pháp lý về hóa đơn điện tử, toán học của ECDSA/RSA, mã hóa tài liệu. Ai sở hữu public key — backend.l4.pki-and-signing; nơi giữ khóa — backend.l4.signing-key-custody. Đơn Hàng chưa phát hành hóa đơn ở stage-4; chỉ có sample."
    - id: backend.l4.pki-and-signing
      title:
        vi: "Chữ ký chỉ chứng minh ai ký khi có chứng chỉ gắn khóa với một cái tên"
        en: "A signature proves who signed only once a certificate ties key to name"
      main_path: true
      duration_min: 15
      skills: [backend.security.signing]
      prereqs:
      - backend.l4.signing-documents
      - k8s.l3.cert-manager
      - k8s.l2.tls-at-the-gateway
      - foundation.l1.tls-and-https
      related: [devops.l3.signing-images, backend.l2.validating-provider-tokens]
      vocab: [certificate-authority, certificate-chain, pki]
      example_tag: stage-4
      example_files:
      - samples/DonHang.Samples/Samples/Security/InvoiceCertificates.cs
      - samples/DonHang.Samples.Tests/InvoiceSigningTests.cs
      - scripts/dev-secrets.sh
      outline:
      - "Checking a signature proves which key made it, not whose key it is; a certificate is a statement, signed by a certificate authority, that binds a name to a public key."
      - "A verifier accepts a certificate by following its chain of signatures up to a root certificate it already trusts; PKI is the whole arrangement of authorities, certificates and the roots each verifier trusts."
      - "`InvoiceCertificates` creates a root for Đơn Hàng and, signed by it, an invoice certificate whose key may only make digital signatures; `X509Chain` with that root as its only trusted root accepts it."
      - "The same check rejects a certificate signed by a different root even when its name is identical, because its chain does not reach a root the verifier trusts."
      - "`dev-secrets.sh` shows the same split at stage-3: the lab CA is marked `CA:TRUE` with `keyCertSign`, while the Gateway's certificate is only for authenticating a server (`serverAuth`)."
      - "Whoever holds a certificate authority's private key can issue certificates for any name its verifiers accept, so that key needs more protection than any key it certifies."
      misconceptions:
      - "If the signature checks out with the key in the certificate, the invoice comes from the name in it, whoever signed the certificate."
      - "A certificate has to be kept secret, like the private key."
      - "The Gateway's certificate can sign our invoices too, since both belong to Đơn Hàng."
      depth_notes: "Không dạy thu hồi chứng chỉ (CRL, OCSP), dấu thời gian cho kiểm chữ ký sau khi chứng chỉ hết hạn — sysdesign/payments-and-signing; CA trung gian, từng trường X.509, quy định CA công cộng. Không dạy lại cert-manager, TLS ở Gateway — k8s.l3.cert-manager, k8s.l2.tls-at-the-gateway."
    - id: backend.l4.signing-key-custody
      title:
        vi: "Khóa ký hóa đơn không bao giờ rời khỏi thiết bị ký bằng nó"
        en: "The invoice signing key never leaves the device that signs with it"
      main_path: true
      duration_min: 14
      skills: [backend.security.key-custody]
      prereqs:
      - backend.l4.pki-and-signing
      - backend.l4.shared-credentials
      - devops.l3.sealed-secrets
      - devops.l3.secret-rotation
      related:
      - k8s.l3.encryption-at-rest
      - management.l3.weighing-options-in-an-adr
      - backend.l3.payments-service
      vocab: [hsm]
      example_tag: stage-4
      example_files:
      - docs/adr/0015-khoa-ky-hoa-don-trong-hsm.md
      - samples/DonHang.Samples/Samples/Security/InvoiceSigning.cs
      - DonHang.Payments/Program.cs
      outline:
      - "A private key kept in a file or a Secret can be copied by anyone who can read it, and a copy signs as well as the original, leaving no sign of who used it."
      - "An HSM (hardware security module) is a device that creates private keys inside itself and signs on request, and can keep a key from ever leaving it, so callers get signatures, never the key."
      - "ADR `0015` weighs keeping the invoice key in a sealed Secret that Payments reads against keeping it in an HSM that only Payments may call, and chooses the HSM."
      - "With the HSM, a compromised Payments can request signatures only while the compromise lasts, instead of carrying off a key that keeps signing after the flaw is fixed."
      - "An HSM signs whatever a permitted caller sends it, so Payments asks for a signature only for an invoice of an order it holds as paid, and records each request."
      - "The ADR leaves where the HSM runs, own hardware or the hosting provider's service, to the hosting decision, and names the software key in the sample as lab-only."
      misconceptions:
      - "A key file protected by a password is as safe as an HSM."
      - "With the key in an HSM, nobody can ever get a fake invoice signed."
      - "An HSM is just hardware that makes cryptography faster."
      depth_notes: "Không nêu tên/sản phẩm HSM hay KMS, PKCS#11, mức chứng nhận, nghi thức tạo khóa, mã hóa dữ liệu bằng KMS — k8s/managed-vs-selfhosted. Không dựng HSM trong lab. Không dạy lại xoay vòng khóa, SealedSecret — devops.l3.secret-rotation, devops.l3.sealed-secrets."
    - id: backend.l4.audit-log
      title:
        vi: "Nhật ký kiểm toán chỉ là bằng chứng khi người bị ghi không sửa được nó"
        en: "An audit log is evidence only if those it records cannot change it"
      main_path: true
      duration_min: 14
      skills: [backend.security.audit]
      prereqs:
      - backend.l4.signing-key-custody
      - design.l3.read-model
      - devops.l3.signing-images
      - devops.l2.centralized-logs
      related:
      - backend.l3.safe-to-repeat-saga-steps
      - backend.l4.shared-credentials
      - k8s.l3.api-request-checks
      vocab: [audit-log, tamper-evident]
      example_tag: stage-4
      example_files:
      - docs/design/audit-log.md
      - DonHang.Payments/Payment.cs
      - DonHang.Infrastructure/RecordOrderStatusHistory.cs
      outline:
      - "An audit log records who did what to which resource, when and with what outcome, so that the record can serve later as evidence, such as of who asked for a refund."
      - "Payments' `RequestedBy` and `order_status_history` hold part of this, but in tables their own service and the shared user `donhang` can update, so a change to them leaves no trace."
      - "Application logs in Loki serve debugging: any service can write any line to its output, so they cannot prove who acted."
      - "`audit-log.md` lists the actions Đơn Hàng audits, such as shipping an order, requesting a refund, granting a role at Keycloak and signing an invoice, and each entry's fields: caller's `sub`, action, resource, time, outcome."
      - "A log is tamper-evident when each entry carries a hash over the entry before it, so changing or removing one breaks every hash after it, the same idea a transparency log uses."
      - "The design sends entries to a store the services may append to but not change or delete, and keeps tokens and secrets out of every entry."
      misconceptions:
      - "Our application logs in Loki already are the audit log."
      - "To be complete, an audit log has to record every request the API receives."
      - "If the app can only append to the log, nobody can tamper with it."
      depth_notes: "Đơn Hàng chưa dựng nhật ký kiểm toán ở stage-4 (chỉ thiết kế). Không dạy audit log của API server Kubernetes, cấu hình event của Keycloak, SIEM, thời hạn lưu theo luật. Không dạy lại read model, transparency log — design.l3.read-model, devops.l3.signing-images."
  - id: capacity-and-slo
    title:
      vi: "Capacity và SLO: hứa một mức dịch vụ và giữ được nó"
      en: "Capacity and SLOs: promising a level of service and keeping it"
    stage: 4
    summary:
      vi: "Đo mức dịch vụ của Đơn Hàng bằng SLI, đặt SLO và SLA cho cửa hàng, dùng error budget để quyết khi nào dừng phát hành tính năng, tìm giới hạn bằng kiểm thử tải, lập kế hoạch dung lượng cho 1.000 cửa hàng kèm điều kiện đọc từ replica, chốt giới hạn theo cửa hàng trong ADR 0016 và review thay đổi backend bằng một checklist."
      en: "Measure Đơn Hàng's level of service with SLIs, set SLOs and an SLA for shops, use the error budget to decide when feature releases stop, find limits with a load test, plan capacity for 1,000 shops including when reads go to the replica, decide per-shop limits in ADR 0016 and review backend changes with a checklist."
    lessons:
    - id: backend.l4.service-level-indicators
      title:
        vi: "SLI đếm tỉ lệ request tốt trên tổng số, theo cách khách cảm nhận"
        en: "An SLI counts good requests out of all, as customers feel them"
      main_path: true
      duration_min: 14
      skills: [backend.reliability.slo]
      prereqs:
      - design.l4.mapping-fitness-functions
      - devops.l2.histograms-and-percentiles
      - devops.l2.counters-and-rate
      - backend.l3.bulkhead
      related: [devops.l2.grafana-dashboards, backend.l3.observability, design.l4.quality-attribute-scenarios]
      vocab: [service-level-indicator]
      example_tag: stage-4
      example_files:
      - docs/design/slo.md
      - scripts/backend/slo-report.sh
      - deploy/monitoring/grafana/dashboards/donhang-api.json
      outline:
      - "A service level indicator (SLI) is a measured ratio of good events to all valid events, such as the share of `POST /api/v1/orders` requests not answered with a `5xx`."
      - "Which answers count as bad is a decision `slo.md` writes down: every `5xx`, including the `503` the `catalog-reads` limit gives, while `429` from the per-customer limit and other `4xx` are not counted bad."
      - "A latency SLI counts the share of requests answered within a threshold, read from the histogram bucket at that bound, such as `le=\"0.512\"`, instead of from an estimated p95."
      - "A threshold that is not a bucket bound cannot be counted exactly: YC-7's 2 seconds lies between the bounds 1.024 and 2.048, so `slo.md` measures the refund request against 2.048 and says so."
      - "The API's metrics see only requests that reach it, so a request that fails at Caddy or the Gateway never appears in these SLIs; `slo.md` names this gap."
      - "`slo-report.sh` asks Prometheus for each SLI of `slo.md` over the last hour and prints the good count, the total and their ratio."
      misconceptions:
      - "CPU and memory use are the best measures of whether customers are being served well."
      - "The p95 response time on the dashboard already is the measure of service we need."
      - "A request our own limit refused is not a failure, because the system did what it was built to do."
      depth_notes: "Chưa dạy mục tiêu, cửa sổ thời gian — backend.l4.service-level-objectives; error budget — backend.l4.error-budget. Không đổi bucket của prometheus-net, không dạy recording rule hay alert — devops/incidents. Không dạy lại histogram, rate(), bulkhead — devops/monitoring-basics, backend.l3.bulkhead."
    - id: backend.l4.service-level-objectives
      title:
        vi: "SLO đặt mục tiêu dưới 100% cho một SLI trong một khoảng thời gian"
        en: "An SLO sets a target below 100% for an SLI over a time window"
      main_path: true
      duration_min: 13
      skills: [backend.reliability.slo]
      prereqs:
      - backend.l4.service-level-indicators
      - management.l3.service-level-agreement
      - design.l4.quality-attribute-scenarios
      - design.l4.a-thousand-shops
      related: [management.l2.non-functional-requirements, design.l4.mapping-fitness-functions]
      vocab: [service-level-objective]
      example_tag: stage-4
      example_files: [docs/design/slo.md, docs/team/multi-shop-requirements.md, docs/team/refund-requirements.md]
      outline:
      - "A service level objective (SLO) is a target for one SLI over a time window, such as 99.5% of order requests not answered with a `5xx` over a rolling 28 days."
      - "A 100% target cannot be met by a system whose own dependencies fail now and then, and it would rule out every change that carries any risk, so `slo.md` sets every target below 100%."
      - "Each target in `slo.md` comes from what customers and shops need, such as YC-7 for refund requests, not from whatever the dashboard happens to show today."
      - "The SLA Đơn Hàng offers shops promises less than the SLO, 99% of order requests per calendar month in `slo.md`, so the team sees a problem before the contract is broken."
      - "A percentage becomes concrete as an allowance: over 28 days, 99.5% leaves 0.5% of the order requests, or about 3 hours and 22 minutes if every request in that time failed."
      misconceptions:
      - "The higher the SLO the better, so we should aim for 100%."
      - "Our SLO and the SLA we promise shops should be the same number."
      - "The right SLO is whatever the system achieves today."
      depth_notes: "Chưa dạy dùng phần còn lại để quyết phát hành — backend.l4.error-budget. Số SLA với cửa hàng là giả định, chưa có hợp đồng; không dạy điều khoản pháp lý. Không dạy lại SLA vendor, kịch bản thuộc tính chất lượng — management.l3.service-level-agreement, design.l4.quality-attribute-scenarios."
    - id: backend.l4.error-budget
      title:
        vi: "Error budget quyết định khi nào độ tin cậy được ưu tiên hơn tính năng"
        en: "The error budget decides when reliability comes before features"
      main_path: true
      duration_min: 13
      skills: [backend.reliability.slo]
      prereqs:
      - backend.l4.service-level-objectives
      - devops.l2.cutting-a-release
      - devops.l3.rollback-by-revert
      related: [management.l3.technical-debt-register, backend.l3.graceful-degradation]
      vocab: [error-budget]
      example_tag: stage-4
      example_files: [docs/design/slo.md, scripts/backend/slo-report.sh]
      outline:
      - "The error budget is the share of events an SLO allows to be bad over its window, 1 minus the target: with 99.5% and 200,000 order requests in 28 days, 1,000 of them may fail."
      - "While budget remains, the team may spend it on changes that carry risk, such as releases; a release that causes failures spends budget like any outage does."
      - "`slo.md` holds the policy: once a service's budget is spent, its feature releases stop and only fixes and reliability work ship until the SLI over the window is back above the SLO."
      - "The team and the product owner agreed the policy before any incident, so the choice between features and reliability is not argued again while customers are affected."
      - "`slo-report.sh` places orders while `db` is stopped for a few seconds, and the remaining budget it prints afterwards is lower than before."
      misconceptions:
      - "An error budget means some errors are allowed, so we do not have to fix them."
      - "Using up part of the error budget means the team failed."
      - "Only outages count against the budget; a bad release that is rolled back quickly does not."
      depth_notes: "Không dạy alert theo tốc độ tiêu budget, trực sự cố, postmortem — devops/incidents. Không dạy feature flag, canary — devops/platform-and-release-strategy. Số request là giả định. Không dạy lại phát hành, revert — devops.l2.cutting-a-release, devops.l3.rollback-by-revert."
    - id: backend.l4.load-testing
      title:
        vi: "Kiểm thử tải tìm điểm mà tải thêm chỉ làm request chờ lâu hơn"
        en: "A load test finds the point where more load only adds waiting"
      main_path: true
      duration_min: 15
      skills: [backend.capacity.planning]
      prereqs:
      - backend.l4.error-budget
      - backend.l3.bulkhead
      - backend.l3.slow-dependencies
      - devops.l2.histograms-and-percentiles
      related: [backend.l3.rate-limiting, design.l4.trade-off-points, k8s.l1.requests-and-limits]
      vocab: [load-test, throughput, littles-law]
      example_tag: stage-4
      example_files:
      - scripts/backend/load-steps.sh
      - DonHang.Api/Program.cs
      - DonHang.Api/Controllers/ProductsController.cs
      outline:
      - "A load test sends a controlled load that rises in steps and records at each step the throughput, the number of answers per second, along with response times and errors."
      - "`load-steps.sh` sends product list reads with 1, 5, 10, 20 and 40 requests in flight at a time and prints, per step, reads answered `200` per second, average time, p95 and `503` count."
      - "Little's law says the requests in flight equal the throughput times the average time each one takes; at every step the script's throughput times its average time comes out close to the step's number."
      - "So once a shared resource is full, throughput stops rising and each extra request in flight only adds waiting: from 1 to 40 at once, `200` answers per second rise far less than 40 times while p95 climbs."
      - "The `catalog-reads` limit sets a deliberate ceiling: with 20 reads running and 5 queued per process, the step with 40 in flight gets some `503` answers, and steps up to 20 get none."
      - "The lab runs every service on one machine, so its numbers show the shape of the curve, not the capacity of production; a load test for sizing needs an environment shaped like production."
      misconceptions:
      - "Twice as many users at once means twice as many answers per second, until the server crashes."
      - "A load test means sending as many requests as possible and seeing when it breaks."
      - "If the lab handles a load, production will handle it too."
      depth_notes: "Không dùng công cụ kiểm thử tải riêng (versions.yaml chưa có), không dạy tải theo tốc độ đến cố định, soak test — ngoài module. Không đổi giới hạn trong `Program.cs`. Kế hoạch dung lượng — backend.l4.capacity-planning. Không dạy lại bulkhead, percentile."
    - id: backend.l4.capacity-planning
      title:
        vi: "Kế hoạch dung lượng so đỉnh tải dự kiến với giới hạn đã đo"
        en: "A capacity plan checks the expected peak against measured limits"
      main_path: true
      duration_min: 15
      skills: [backend.capacity.planning]
      prereqs:
      - backend.l4.load-testing
      - design.l4.a-thousand-shops
      - k8s.l1.requests-and-limits
      - backend.l3.sharding
      related: [backend.l3.read-replicas, k8s.l1.rolling-updates, design.l4.one-deployment-for-all-shops]
      vocab: [capacity-planning, headroom]
      example_tag: stage-4
      example_files:
      - docs/design/capacity-plan.md
      - docs/team/multi-shop-requirements.md
      - deploy/gitops/config-repo-kustomize/base/api.yaml
      - DonHang.Api/Program.cs
      outline:
      - "Capacity planning estimates the load a system must carry at its peak from business drivers, and checks it against the measured limit of each shared resource before that peak arrives."
      - "`capacity-plan.md` derives peak orders and product reads per second for 1,000 shops from assumed figures, each marked as an assumption, and plans from the busiest hour, not the daily average."
      - "Headroom is the margin kept between the planned peak and a measured limit; the plan keeps the peak under half the ceiling of the 2 api Pods, so one Pod can carry it if the other is lost."
      - "Adding api Pods raises the `catalog-reads` ceiling but multiplies the database connections they may open, so Pods times connections per Pod must stay below PostgreSQL's `max_connections`."
      - "The plan names the resource that runs out first and the step taken before it does, and lists the drivers that trigger a new plan, such as the number of shops or orders per shop."
      misconceptions:
      - "Capacity planning means buying the biggest server we can afford."
      - "The average load over a day is enough to size the system."
      - "Kubernetes can always start more Pods, so we do not need a capacity plan."
      depth_notes: "Không dạy autoscaling, chi phí hạ tầng — k8s/managed-vs-selfhosted; đọc từ replica — backend.l4.read-routing. Số tải và thời gian là giả định, không đo trên production. Không dạy lại request/limit, sharding — k8s.l1.requests-and-limits, backend.l3.sharding."
    - id: backend.l4.read-routing
      title:
        vi: "Chỉ chuyển một truy vấn đọc sang replica khi nó chịu được độ trễ của bản sao"
        en: "A read moves to the replica only when it can tolerate the lag"
      main_path: true
      duration_min: 13
      skills: [backend.capacity.planning, backend.data.replication]
      prereqs: [backend.l4.capacity-planning, backend.l4.pacelc, backend.l3.read-replicas]
      related: [backend.l4.data-ownership, backend.l2.cache-aside, backend.l4.cap-theorem]
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/design/capacity-plan.md
      - docs/design/consistency-per-operation.md
      - scripts/backend/replica-lag.sh
      - DonHang.Api/Program.cs
      outline:
      - "Routing reads means the code chooses, query by query, whether to use the primary or a replica; at stage-4 the API has one connection string, `Default`, so every read goes to the primary."
      - "A read may move to a replica only if `consistency-per-operation.md` lets its operation answer with data a little old; the product list qualifies, the customer's own orders do not."
      - "A read that follows the caller's own write, such as showing the order just placed or its history, stays on the primary, because the replica may not have the write yet."
      - "A replica relieves the primary only of the reads moved to it; every write and every read that must stay still lands on the primary."
      - "`capacity-plan.md` keeps all reads on the primary at stage-4 and names the trigger for moving the product list: its planned peak crossing the primary's headroom."
      - "Routed reads need a way back to the primary when the replica falls further behind than the operation allows, or is down, so routing adds a check to every routed query."
      misconceptions:
      - "Adding a replica means pointing every `GET` at it."
      - "A replica is free extra capacity, so we should add one as early as possible."
      - "Once reads go to a replica, the primary only has to handle writes."
      depth_notes: "API không đọc từ replica ở stage-4 (chỉ kế hoạch); không dạy code chọn kết nối, pool riêng hay failover — devops/k8s GĐ4. Không dạy lại replication lag, read-your-writes, PACELC — backend.l3.read-replicas, backend.l4.pacelc."
    - id: backend.l4.per-shop-limits
      title:
        vi: "Giới hạn theo cửa hàng không để một cửa hàng đông làm chậm các cửa hàng khác"
        en: "A per-shop limit keeps one busy shop from slowing the others"
      main_path: true
      duration_min: 15
      skills: [backend.tenancy.fair-share]
      prereqs:
      - backend.l4.read-routing
      - backend.l4.shop-id-rollout
      - design.l4.architecture-review-findings
      - backend.l3.rate-limiting
      related:
      - backend.l3.multi-tenancy
      - backend.l4.shop-data-layout
      - management.l3.weighing-options-in-an-adr
      vocab: []
      example_tag: stage-4
      example_files:
      - docs/adr/0016-gioi-han-tai-theo-cua-hang.md
      - docs/design/multi-shop-architecture-review.md
      - DonHang.Api/Program.cs
      outline:
      - "ADR `0013` left the noisy-neighbor problem open, and the architecture review recorded the risk: `catalog-reads` counts all callers of a process together, and `orders` counts per customer, never per shop."
      - "ADR `0016` weighs three options: keep the shared limits, add limits counted per shop inside the API, or move a large shop to a database or deployment of its own."
      - "It chooses per-shop limits on top of the shared ones: each shop may use at most a set share of the reads a process runs at once, while the shared limit still protects the database."
      - "A cap per shop limits what one shop takes without reserving capacity for each, so capacity one shop leaves unused stays available to the rest of the 1,000."
      - "An SLI over all shops can stay above its SLO while one shop is refused most of the time, so the ADR adds a request count labelled by shop and keeps the shop off the histogram to limit the series."
      - "The limits need the shop from the caller's access token, which arrives with release 2 of the rollout, so `Program.cs` keeps its stage-3 limits at stage-4."
      misconceptions:
      - "The existing per-customer rate limit already stops one shop from hurting the others."
      - "Giving each shop a fixed reserved share is the fairest way to split capacity."
      - "If the SLO is met overall, every shop is being served well."
      depth_notes: "Không viết code giới hạn theo cửa hàng ở stage-4; không dạy limiter phân tán, quota theo gói trả phí. Không quyết lại ADR 0012, 0013. Không dạy lại noisy neighbor, rate limiting — backend.l3.multi-tenancy, backend.l3.rate-limiting."
    - id: backend.l4.backend-review-checklist
      title:
        vi: "Checklist review backend gắn mỗi câu hỏi với một quyết định đã ghi"
        en: "A backend review checklist ties each question to a recorded decision"
      main_path: true
      duration_min: 14
      skills: [backend.review.checklist]
      prereqs:
      - backend.l4.per-shop-limits
      - backend.l4.audit-log
      - backend.l4.message-schema-evolution
      - design.l4.mapping-fitness-functions
      related:
      - backend.l4.threat-modeling
      - design.l4.architecture-review-findings
      - management.l1.reviewing-for-layers
      vocab: []
      example_tag: stage-4
      example_files: [docs/design/backend-review-checklist.md, docs/design/capacity-plan.md, docs/design/slo.md]
      outline:
      - "`backend-review-checklist.md` groups its questions by concern: data ownership and consistency, schema and message changes, security, resilience, SLOs and capacity, and isolation between shops."
      - "Each question names the document or ADR that holds the expected answer, such as `consistency-per-operation.md` or ADR `0016`, so a reviewer checks a change against a decision instead of a taste."
      - "Questions that a test or CI step already answers point to that check instead, so the checklist covers what no automated check can see, such as a new copy of data with no stated owner."
      - "A change is reviewed against the groups it touches, not against every question, so a small change gets a short review and a change to a trust boundary or a limit gets a long one."
      - "The document ends with a worked example: the proposal to read the product list from `db-replica`, reviewed against the consistency, capacity, SLO and data ownership questions."
      misconceptions:
      - "With a good checklist, a reviewer no longer needs experience of the system."
      - "Every pull request has to answer every question on the checklist."
      - "A checklist that passes once can be kept unchanged for good."
      depth_notes: "Không dạy review code từng dòng — management/code-review; checklist kiến trúc cluster — k8s GĐ4. Không thêm phép kiểm tự động mới. Không dạy lại các quyết định đã có — các bài backend GĐ4 trước."
