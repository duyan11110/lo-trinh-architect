open_questions:
  - "Tên thuật ngữ 'Conway's law' chứa tên người, trong khi prompt 00 cấm tên người (chỉ cho tên sách/bài báo kinh điển như tham chiếu trần, ghi claim `history`). Đề xuất: coi tên định luật như tham chiếu kinh điển (claim history), bài không nói gì thêm về người đó. Nếu chủ không đồng ý: đổi term thành 'mirroring between teams and systems' (vi 'hệ thống soi theo cấu trúc đội') và đổi tên bài."
  - "Ai quyết layout dữ liệu đa cửa hàng (bảng chung + row-level security / schema / database theo shop) và theme theo shop cho Đơn Hàng ở GĐ4? Bài design.l4.one-deployment-for-all-shops chỉ chốt kiểu kiến trúc + một bản triển khai chung (ADR 0012) và để layout cho 'một ADR sau'. Đề xuất: sysdesign/problems (bài toán 'Đơn Hàng đa cửa hàng') dùng lại ADR 0012 làm điểm xuất phát thay vì quyết lại, và layout dữ liệu là ADR riêng của sysdesign/problems hoặc backend/consistency-and-ownership."
  - "Số ADR 0011/0012 là lần đầu GĐ4 dùng số; /repo-stage 4 cần giữ chỗ cho chúng (các module GĐ4 khác outline sau sẽ dùng 0013+). Nếu /repo-stage 4 đánh số lại hoặc đổi tên file, sửa example_files và outline của hai bài."
  - "ADR 0012 ở trạng thái `Đã chấp nhận` có cần code đa cửa hàng thật ở stage-4 không? Đề xuất: không bắt buộc trong module này (bài chỉ trích tài liệu); nếu module GĐ4 khác thêm cột shop vào `orders`/`products` ở stage-4, mục outline 1 của design.l4.a-thousand-shops vẫn đúng (nói 'up to stage-3', không trích `db/schema.sql`)."
  - "Các mục L4 còn lại của design trong docs/00 (evolutionary architecture, fitness function, ATAM rút gọn, trade-off, lượng hóa technical debt) để cho module design/evolutionary-and-tradeoffs; 'Viết ADR' coi như đã dạy ở management/tech-debt-and-adr GĐ3 — mỗi bài ở đây trích một ADR. Xác nhận cách chia này."
