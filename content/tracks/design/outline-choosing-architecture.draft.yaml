module:
  id: choosing-architecture
  title:
    vi: "Chọn kiến trúc theo bối cảnh"
    en: "Choosing an architecture for its context"
  stage: 4
  summary:
    vi: "Chọn kiểu kiến trúc cho từng phần của Đơn Hàng từ các yếu tố định hình nó, đi giữa monolith, module và service theo cả hai chiều, nhận ra distributed monolith và trừu tượng hóa thừa, rồi chọn lại kiến trúc khi Đơn Hàng phục vụ 1.000 cửa hàng."
    en: "Choose a style for each part of Đơn Hàng from its drivers, move between monolith, modules and services in both directions, spot a distributed monolith and over-abstraction, and re-choose when Đơn Hàng serves 1,000 shops."
  lessons:
    - id: design.l4.architectural-drivers
      title:
        vi: "Kiến trúc được chọn từ các yếu tố định hình nó, không từ một kiểu có sẵn"
        en: "An architecture is chosen from its drivers, not from a style"
      main_path: true
      duration_min: 14
      skills: [design.architecture.drivers]
      prereqs:
        - design.l3.when-to-extract-a-service
        - management.l3.weighing-options-in-an-adr
        - management.l2.non-functional-requirements
      related: [design.l3.when-not-to-event-source, management.l3.build-buy-or-adopt]
      vocab: [architectural-driver, architecture-style]
      example_tag: stage-3
      example_files:
        - docs/adr/0003-tach-payments-thanh-service.md
        - docs/adr/0002-tach-notifications-thanh-service.md
        - docs/team/refund-requirements.md
      outline:
        - "An architectural driver is a need or constraint that shapes how a system is split and run, such as a non-functional requirement, the team's size and skills, or a part that changes often."
        - "An architecture style is a recurring shape for a whole system, such as a layered monolith, a modular monolith or microservices; a style is good or bad only against a set of drivers."
        - "ADR `0003` starts from drivers, not from a style: answering a refund request within 2 seconds even when the gateway fails (YC-7), never refunding twice (YC-9), and the gateway's key being the most sensitive data."
        - "ADR `0002` names a tempting reason and rejects it: the email job could run with the API's number of copies, so scaling alone did not justify a separate service."
        - "Because drivers decide, one team can rightly choose different styles for different systems or at different times; a change in the drivers, not in fashion, is the reason to revisit a choice."
      misconceptions:
        - "Microservices are the target architecture, and a monolith is only a step on the way there."
        - "The best architecture is the one that large, well-known companies use."
        - "The features to build decide the architecture; non-functional requirements only matter when tuning later."
      depth_notes: "Không dạy kịch bản thuộc tính chất lượng hay ATAM — design/evolutionary-and-tradeoffs GĐ4. Không dạy lại ADR, NFR — management.l3.architecture-decision-record, management.l2.non-functional-requirements; không giải thích lại vì sao tách từng service — backend.l3.payments-service."
    - id: design.l4.where-boundaries-are-enforced
      title:
        vi: "Ba kiểu kiến trúc khác nhau ở chỗ ranh giới giữa các phần được giữ ở đâu"
        en: "Three styles differ in where a boundary between parts is enforced"
      main_path: true
      duration_min: 15
      skills: [design.architecture.styles]
      prereqs:
        - design.l4.architectural-drivers
        - design.l3.testing-module-boundaries
        - backend.l3.message-broker
      related: [design.l3.module-contracts, design.l3.modular-monolith]
      vocab: []
      example_tag: stage-3
      example_files:
        - DonHang.Tests/Architecture/ModuleBoundaryTests.cs
        - DonHang.Catalog/ICatalog.cs
        - DonHang.Notifications/OrderMessage.cs
      outline:
        - "In a monolith without modules nothing stops one part from using another part's classes or tables; the boundary holds only as long as everyone respects it."
        - "In a modular monolith the boundary is checked when code is built and tested: `internal` types and `ModuleBoundaryTests` keep Catalog's insides out of reach, while a call across it stays an ordinary method call."
        - "Between services the boundary is the network: Notifications cannot call Ordering's code at all and knows an order only from the `OrderMessage` it receives."
        - "Each step toward services buys independence in releasing, scaling and failing, and pays for it with calls that can fail over the network, data that agrees only after a while, and more to run."
        - "Stage-3 Đơn Hàng uses two styles at once: Ordering and Catalog are modules of one process, Notifications and Payments are services, each part placed where its own drivers put it."
      misconceptions:
        - "A modular monolith is just a monolith that has not been split into services yet."
        - "A boundary only really exists once the parts run in separate processes."
        - "A system should use one style throughout; mixing modules and services is a half-finished migration."
      depth_notes: "Không dạy lại monolith, modular monolith, microservice — design.l3.modular-monolith, design.l3.before-extracting-a-module. Không nói gộp service lại — design.l4.merging-a-service-back. Không bàn serverless hay event-driven như kiểu riêng."
    - id: design.l4.distributed-monolith
      title:
        vi: "Các service phải sửa và phát hành cùng nhau là một distributed monolith"
        en: "Services that must change together are a distributed monolith"
      main_path: true
      duration_min: 15
      skills: [design.architecture.anti-patterns]
      prereqs:
        - design.l4.where-boundaries-are-enforced
        - design.l3.module-owns-its-tables
        - devops.l3.promoting-between-environments
      related: [backend.l3.choreography-vs-orchestration, backend.l3.payments-service]
      vocab: [distributed-monolith]
      example_tag: stage-3
      example_files:
        - DonHang.Notifications/OrderMessage.cs
        - DonHang.Payments/Messages.cs
        - DonHang.Tests/Architecture/ModuleBoundaryTests.cs
        - deploy/gitops/config-repo-kustomize/envs/production/kustomization.yaml
      outline:
        - "A distributed monolith is a system split into services that still cannot change, release or fail on their own; it pays the network's costs without getting the services' independence."
        - "Its signs are changes that always touch several services, services released only together, services reading each other's tables, and chains of calls where one slow service stalls the rest."
        - "Đơn Hàng's services share no domain classes: Notifications and Payments each keep their own copy of `OrderMessage`, so the JSON message, not a shared project, is what ties them to the API."
        - "`ModuleBoundaryTests` fails if either service references a Đơn Hàng project other than `DonHang.Messaging`, which knows no order, payment or email."
        - "Each image has its own entry in the production `kustomization.yaml`, so one service can be promoted without the others, even though at stage-3 all six images come from one commit."
        - "Some coupling remains: the three services' databases share one PostgreSQL server, and renaming a field of `OrderMessage` would still make the API and both readers change in step."
      misconceptions:
        - "Once each part runs in its own container, the system is no longer a monolith."
        - "Services should share one project of domain classes, so that every service uses the same `Order`."
        - "Giving each service its own database is enough to avoid a distributed monolith."
      depth_notes: "Không dạy đổi hình dạng message mà không làm hỏng consumer (schema evolution) — backend GĐ4. Không dạy lại outbox, message broker — backend.l3.outbox-pattern, backend.l3.message-broker. Gộp service lại — design.l4.merging-a-service-back."
    - id: design.l4.merging-a-service-back
      title:
        vi: "Gộp một service trở lại cũng được quyết từ những yếu tố như khi tách nó"
        en: "Merging a service back is decided by the same drivers as splitting it"
      main_path: true
      duration_min: 14
      skills: [design.architecture.styles]
      prereqs:
        - design.l4.distributed-monolith
        - management.l3.superseding-an-adr
        - design.l3.before-extracting-a-module
      related: [design.l3.when-to-extract-a-service, management.l3.exit-plan]
      vocab: []
      example_tag: stage-3
      example_files:
        - docs/adr/0002-tach-notifications-thanh-service.md
        - docs/adr/README.md
        - docs/adr/0003-tach-payments-thanh-service.md
      outline:
        - "Moving a service back into one process is an ordinary architecture change, not an admission of failure: it is right when the drivers that justified the split no longer hold."
        - "A merge is worth weighing when the services have become a distributed monolith, when the reason for the split has gone, or when running them costs more than their independence returns."
        - "ADR `0002` split Notifications out for two reasons: another service must also message customers, and email failures should stay out of the process that takes orders; a merge would have to show both had gone."
        - "Merging has costs too: the separate database has to be folded back or kept apart inside one process, and the boundary the network used to enforce must then be kept by the compiler and tests."
        - "Merging a service back as a module, with its contract kept, leaves splitting it out again cheap, so the choice stays open in both directions."
        - "A merge is recorded like any other decision: a new ADR supersedes `0002`, which stays in `docs/adr/` with its reasons."
      misconceptions:
        - "Once a service has been split out, the team should never merge it back."
        - "Merging services back means returning to one big ball of code with no boundaries."
        - "If a split turns out to be wrong, the old ADR should be edited to say it never made sense."
      depth_notes: "Đơn Hàng không gộp service nào; bài chỉ cân bằng lời, không có code gộp. Không dạy chuyển dữ liệu giữa hai database — backend GĐ4. Không dạy lại thay thế ADR — management.l3.superseding-an-adr; không dạy lại vì sao tách — design.l3.when-to-extract-a-service."
    - id: design.l4.conways-law
      title:
        vi: "Ranh giới của hệ thống thường đi theo cách các đội trao đổi với nhau"
        en: "A system's boundaries tend to follow how its teams communicate"
      main_path: true
      duration_min: 13
      skills: [design.architecture.drivers]
      prereqs:
        - design.l4.merging-a-service-back
        - design.l3.bounded-context
        - management.l1.scrum-from-junior-seat
      related: [design.l3.subdomains, management.l3.proposing-an-adr]
      vocab: [conways-law]
      example_tag: stage-3
      example_files:
        - docs/team/sprint-example.md
        - docs/adr/0002-tach-notifications-thanh-service.md
        - docs/adr/0003-tach-payments-thanh-service.md
      outline:
        - "Conway's law observes that the structure of a system tends to mirror the communication structure of the organisation that builds it."
        - "Đơn Hàng's docs describe a single team, with a product owner, a scrum master, four developers and a tester, and no service has a team of its own."
        - "So Đơn Hàng's split into services did not follow a team boundary: ADRs `0002` and `0003` give failure isolation and the gateway's key as reasons, and one team changes all three services."
        - "When one team owns several services, a change across them is a conversation inside the team; when several teams share one module, each change needs them to agree, and the module's boundary tends to blur."
        - "Drawing module boundaries and team boundaries together lets each team change its part without waiting for another, which is why a growing team is itself an architectural driver."
      misconceptions:
        - "How teams are organised is a management matter that has no effect on the code."
        - "Splitting into microservices is what lets one small team move faster."
        - "Conway's law means every service must have a team of its own."
      depth_notes: "Không dạy cách tổ chức đội hay các kiểu đội (Team Topologies) — management/teams-and-leadership GĐ4. Không nêu tên người ngoài tên định luật. Không dạy lại bounded context — design.l3.bounded-context."
    - id: design.l4.over-abstraction
      title:
        vi: "Một lớp trừu tượng chỉ đáng có khi nó có lý do ngay hôm nay"
        en: "An abstraction must earn its place with a reason that exists today"
      main_path: true
      duration_min: 15
      skills: [design.architecture.anti-patterns]
      prereqs:
        - design.l4.architectural-drivers
        - management.l3.vendor-lock-in
        - design.l2.decorator-pattern
        - design.l3.one-way-module-dependencies
      related: [design.l2.unit-of-work, backend.l3.outbox-pattern]
      vocab: [over-abstraction]
      example_tag: stage-4
      example_files:
        - docs/adr/0011-khong-boc-message-broker-sau-lop-chung.md
        - DonHang.Catalog/IProductRepository.cs
        - DonHang.Catalog/CatalogService.cs
        - DonHang.Domain/IOutbox.cs
      outline:
        - "Over-abstraction is adding interfaces, layers or generic wrappers for needs nobody has yet; each one is more code to read and change, paid for now against a future that may not come."
        - "An abstraction earns its place with a present reason: `IProductRepository` has two implementations, the EF Core repository and the cache wrapped around it, and `IOutbox` keeps `DonHang.Domain` free of the messaging project."
        - "Where no such reason exists, Đơn Hàng goes without one: `CatalogService` reads a page of products straight from its DbContext instead of through one more repository."
        - "ADR `0011` rejects a proposal to put every RabbitMQ call behind a broker-neutral interface: no driver calls for another broker, and the interface would hide RabbitMQ features the services rely on, such as dead-letter queues."
        - "Instead the ADR lists the files that use RabbitMQ and names what would reopen the question, so the cost of switching is known without being paid in advance."
      misconceptions:
        - "Every class should sit behind an interface, so that it can be replaced later."
        - "A broker-neutral layer over RabbitMQ costs nothing, because the services only call it."
        - "An interface with only one production implementation is always over-abstraction."
      depth_notes: "Không dạy lại decorator, port, unit of work, vendor lock-in — design.l2.decorator-pattern, design.l2.ports-and-adapters, design.l2.unit-of-work, management.l3.vendor-lock-in. Không bàn đa cloud — k8s/managed-vs-selfhosted GĐ4."
    - id: design.l4.a-thousand-shops
      title:
        vi: "Phục vụ 1.000 cửa hàng làm đổi những yếu tố quan trọng nhất của Đơn Hàng"
        en: "Serving 1,000 shops changes which drivers matter most"
      main_path: true
      duration_min: 14
      skills: [design.architecture.context-change]
      prereqs:
        - design.l4.conways-law
        - backend.l3.multi-tenancy
        - management.l2.requirements-document
      related: [backend.l3.tenant-isolation-models, backend.l3.rate-limiting]
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/multi-shop-requirements.md
      outline:
        - "Up to stage-3 the running Đơn Hàng serves one shop: its orders and products carry no shop, and tables with a shop exist only in the lab files under `db/tenancy/`."
        - "`multi-shop-requirements.md` sets the new context: 1,000 shops on one platform, each seeing only its own data, a new shop opened without a deploy, and one shop's busy day not slowing the others."
        - "It labels its numbers as assumptions and sets the drivers side by side for one shop and for 1,000, so a reader can see which ones change."
        - "The drivers that change most are isolation between shops, opening and configuring shops, and how many people work on the system; total order volume grows too, but sizing it is a separate exercise."
        - "Drivers that stay the same matter as much: refunds, emails and the order rules work the same way inside each shop, so the parts built for them can keep their shape."
      misconceptions:
        - "Going from one shop to 1,000 is mainly a performance problem."
        - "Serving many shops means the system has to be rebuilt as microservices."
        - "Every requirement written for one shop has to be rewritten when there are many."
      depth_notes: "Không chọn cách lưu dữ liệu từng shop (bảng chung, schema, database) — quyết ở ADR GĐ4 khác; không tính capacity — backend/capacity-and-slo GĐ4. Quyết định kiến trúc — design.l4.one-deployment-for-all-shops. Không dạy lại multi-tenancy — backend.l3.multi-tenancy."
    - id: design.l4.one-deployment-for-all-shops
      title:
        vi: "Đơn Hàng phục vụ mọi cửa hàng từ một bản triển khai chung"
        en: "Đơn Hàng serves every shop from one shared deployment"
      main_path: true
      duration_min: 15
      skills: [design.architecture.context-change]
      prereqs:
        - design.l4.a-thousand-shops
        - design.l4.distributed-monolith
        - backend.l3.tenant-isolation-models
      related: [backend.l3.multi-tenancy, management.l3.weighing-options-in-an-adr]
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
        - docs/team/multi-shop-requirements.md
        - docs/adr/README.md
      outline:
        - "ADR `0012` weighs three options against the multi-shop drivers: a copy of the whole system per shop, one shared deployment keeping the stage-3 shape, and splitting Ordering and Catalog into more services."
        - "A copy per shop isolates shops best, but multiplies every deployment, migration and dashboard by the number of shops, and opening a shop becomes a deploy."
        - "Splitting Ordering and Catalog further answers no multi-shop driver: the same team would still change them together, which risks a distributed monolith."
        - "The ADR chooses one shared deployment: a shop becomes data inside the system, so isolation between shops must be enforced inside it, by a data layout that a later ADR decides."
        - "It names what would reopen the decision, such as a shop whose contract demands a copy of its own, which could then get one without changing how the other shops are served."
      misconceptions:
        - "Each shop should get its own copy of the system, because that is always the safest isolation."
        - "A system for 1,000 shops needs a bigger architecture than a system for one shop."
        - "Once one shared deployment is chosen, giving a single shop its own copy later is impossible."
      depth_notes: "Không chọn layout dữ liệu tenant hay row-level security cho Đơn Hàng — ADR GĐ4 khác. Không dạy ATAM hay ma trận chấm điểm — design/evolutionary-and-tradeoffs. Không dạy lại tenant isolation — backend.l3.tenant-isolation-models."

glossary_additions:
  - term: architectural-driver
    en: "architectural driver"
    vi_keep: false
    vi: "yếu tố định hình kiến trúc"
    short_vi: "Nhu cầu hay ràng buộc quyết định cách chia và chạy hệ thống, như yêu cầu phi chức năng hay quy mô đội"
    short_en: "A need or constraint that shapes how a system is split and run, such as an NFR or team size"
    introduced_in: design.l4.architectural-drivers
  - term: architecture-style
    en: "architecture style"
    vi_keep: false
    vi: "kiểu kiến trúc"
    short_vi: "Một hình dạng lặp lại cho cả hệ thống, như layered monolith, modular monolith hay microservice"
    short_en: "A recurring shape for a whole system, such as a layered monolith, a modular monolith or microservices"
    introduced_in: design.l4.architectural-drivers
  - term: distributed-monolith
    en: "distributed monolith"
    vi_keep: true
    vi: "distributed monolith"
    short_vi: "Hệ thống đã chia thành service nhưng các service vẫn phải sửa, phát hành và hỏng cùng nhau"
    short_en: "A system split into services that still must change, release and fail together"
    introduced_in: design.l4.distributed-monolith
  - term: conways-law
    en: "Conway's law"
    vi_keep: false
    vi: "định luật Conway"
    short_vi: "Cấu trúc của hệ thống có xu hướng phản chiếu cách các đội xây nó trao đổi với nhau"
    short_en: "A system's structure tends to mirror the communication structure of the teams that build it"
    introduced_in: design.l4.conways-law
  - term: over-abstraction
    en: "over-abstraction"
    vi_keep: false
    vi: "trừu tượng hóa thừa"
    short_vi: "Thêm interface, tầng hay lớp bọc cho nhu cầu chưa có; trả chi phí ngay cho một tương lai có thể không tới"
    short_en: "Adding interfaces, layers or wrappers for needs nobody has yet, paying now for a future that may not come"
    introduced_in: design.l4.over-abstraction

repo_changes_needed:
  - lesson: design.l4.over-abstraction
    need: "ADR tiếng Việt, trạng thái `Bị từ chối`, mục `### ` như template (không `## `, không `**`): đề xuất bọc mọi lời gọi RabbitMQ sau một interface trung lập để đổi broker sau này; hai phương án (giữ như stage-3 / bọc hết); từ chối vì không driver nào cần broker khác và lớp bọc sẽ giấu tính năng đang dùng (dead-letter queue, quorum queue, publisher confirm); liệt kê đúng các file production dùng `RabbitMQ.Client` ở stage-3 (DonHang.Messaging/RabbitMqConnection.cs, RabbitMqPublisher.cs, MessageTracing.cs; RabbitMqTopology.cs và consumer của Api, Notifications, Payments); ghi điều gì sẽ khiến đội xem lại."
    suggested_path: "docs/adr/0011-khong-boc-message-broker-sau-lop-chung.md"
  - lesson: design.l4.a-thousand-shops
    need: "Tài liệu yêu cầu tiếng Việt cho Đơn Hàng phục vụ 1.000 cửa hàng, dùng `### ` (không `## `, không `**`): bối cảnh, mục tiêu, yêu cầu phi chức năng đánh số (mỗi shop chỉ thấy dữ liệu của mình; mở shop mới không cần deploy; ngày đông khách của một shop không làm chậm shop khác; cấu hình riêng từng shop), một bảng so sánh driver một shop với 1.000 shop, số liệu ghi rõ 'giả định', ghi rằng tính capacity là việc riêng; nói rõ hoàn tiền, email và quy tắc đơn không đổi trong mỗi shop."
    suggested_path: "docs/team/multi-shop-requirements.md"
  - lesson: design.l4.one-deployment-for-all-shops
    need: "ADR tiếng Việt `Đã chấp nhận`, mục `### `: ba phương án (một bản toàn hệ thống cho mỗi shop / một bản triển khai chung giữ hình dạng stage-3 / tách thêm Ordering và Catalog thành service), cân theo các YC của `multi-shop-requirements.md`; chọn bản triển khai chung; hệ quả: cách ly giữa shop phải làm bên trong hệ thống, layout dữ liệu tenant để một ADR sau quyết; điều mở lại quyết định (shop có hợp đồng đòi bản riêng — được cấp riêng mà không đổi cách phục vụ shop khác; số đội tăng)."
