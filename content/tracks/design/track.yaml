levels:
- level: 1
  title:
    vi: "Level 1"
    en: "Level 1"
  modules:
  - id: solid
    title:
      vi: "SOLID qua ví dụ Đơn Hàng"
      en: "SOLID through the Đơn Hàng example"
    stage: 1
    summary:
      vi: "Chẩn đoán coupling/cohesion kém trong code có thật, và áp đúng 5 nguyên tắc SOLID để sửa, mỗi nguyên tắc một phản ví dụ."
      en: "Diagnose poor coupling and cohesion in real code, and apply each of the five SOLID principles against a real counter-example."
    lessons:
    - id: design.l1.why-design-matters
      title:
        vi: "Một hàm bốn việc: đọc PlaceOrderLong"
        en: "One function, four jobs: reading PlaceOrderLong"
      main_path: true
      duration_min: 12
      skills: [design.foundations.motivation]
      prereqs: [foundation.l1.small-functions, foundation.l1.code-smells-basic]
      related: []
      vocab: []
      example_tag: stage-0
      example_files: [samples/DonHang.Samples/Samples/Clean/PlaceOrderLong.cs]
      outline:
      - "`PlaceOrderLong.Place` (already seen in the small-functions lesson) checks input, prices the order, saves it, and sends a notification — four different reasons for this one method to change, and no name for any of the four."
      - "A change to how loyalty discounts are calculated risks breaking validation, saving, or notification too, simply because all four share the same method body."
      - "Design is the set of choices that decide how expensive a later change is — not decoration on top of code that already 'works', but part of what keeps it easy to change."
      misconceptions:
      - "Code that works and passes its tests doesn't need any more design thought."
      - "Design is about making code look elegant, not about how easy it is to change later."
      depth_notes: "Không nêu SOLID hay coupling/cohesion cụ thể — hai khái niệm này là các bài kế; bài này chỉ tạo động lực bằng đúng một ví dụ đã quen."
    - id: design.l1.coupling-and-cohesion
      title:
        vi: "Coupling và cohesion: hai phép đo khác nhau"
        en: "Coupling and cohesion: two different measurements"
      main_path: true
      duration_min: 14
      skills: [design.foundations.motivation]
      prereqs: [design.l1.why-design-matters]
      related: []
      vocab: [coupling, cohesion]
      example_tag: stage-0
      example_files: [samples/DonHang.Samples/Samples/Clean/PlaceOrderSplit.cs]
      outline:
      - "Cohesion is how closely the things inside one unit (a method, a class) belong together; `PlaceOrderSplit`'s `TotalWithShippingVnd` only computes a total — everything inside it serves that one job."
      - "Coupling is how much one unit knows about, or depends on, another; two units are tightly coupled when a change to one is likely to force a change in the other."
      - "High cohesion and low coupling both lower the cost of change, but they measure different things: a method can do one focused job while the class around it still depends on too many others."
      - "Splitting `PlaceOrderLong` into `PlaceOrderSplit`'s private methods raised each piece's cohesion — it did not remove the class's coupling to validation, pricing, saving and notifying; the class still touches all four."
      misconceptions:
      - "Coupling and cohesion are the same idea, described from two directions."
      - "Splitting one long method into private methods in the same class, the way `PlaceOrderSplit` does, already fixes both its coupling and its cohesion problem."
      depth_notes: "Không nói SRP cụ thể (bài sau nói đúng vấn đề PlaceOrderSplit chưa giải quyết) — chỉ định nghĩa hai từ vựng."
    - id: design.l1.solid-srp
      title:
        vi: "SRP: một class, một lý do để thay đổi"
        en: "SRP: one class, one reason to change"
      main_path: true
      duration_min: 15
      skills: [design.solid.srp]
      prereqs: [design.l1.coupling-and-cohesion]
      related: []
      vocab: [solid, srp]
      example_tag: stage-0
      example_files: [samples/DonHang.Samples/Samples/Clean/PlaceOrderSplit.cs]
      outline:
      - "SOLID names five design principles (SRP, OCP, LSP, ISP, DIP); this lesson covers the first, Single Responsibility."
      - "The Single Responsibility Principle: a class should have only one reason to change."
      - "`PlaceOrderSplit` raised each piece's cohesion, but the class itself still has four reasons to change: a new validation rule, pricing rule, way of saving, or way of notifying all touch the same class."
      - "Splitting `PlaceOrderSplit` into a validator, a pricer, an order saver and a notifier — one class per reason to change — is what SRP asks for; none of the four needs to know how the others are implemented."
      misconceptions:
      - "Single Responsibility means a class should have only one method."
      - "A class that already looks small and tidy, like `PlaceOrderSplit`, must already satisfy SRP."
      depth_notes: "Không thiết kế class Validator/Pricer/Repository/Notifier thật (interface, DI) — module dependency-injection và layered sau. Chỉ nói nguyên tắc và chẩn đoán đúng vấn đề của ví dụ đã có."
    - id: design.l1.solid-ocp
      title:
        vi: "OCP: thêm trường hợp mới không cần sửa code cũ"
        en: "OCP: adding a case shouldn't mean editing old code"
      main_path: true
      duration_min: 15
      skills: [design.solid.ocp]
      prereqs: [design.l1.solid-srp]
      related: []
      vocab: [ocp]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Design/ShippingFeeIfElseChain.cs
      - samples/DonHang.Samples/Samples/Oop/ShippingFee.cs
      outline:
      - "The Open/Closed Principle: code should be open for extension but closed for modification — adding a new case shouldn't require editing code that already works and is already tested."
      - "`ShippingFeeIfElseChain.ForOrder` picks the fee with `if (kind == \"standard\") ... else if (kind == \"express\") ...`; a fourth kind means editing that method and re-checking every branch already there."
      - "`ShippingFee` (already seen for polymorphism) satisfies OCP instead: a new shipping method is a new subclass, like `StandardShipping` or `ExpressShipping` — nothing about the existing classes or their callers changes."
      misconceptions:
      - "OCP means you should never change a class once it's written."
      - "Using an abstract class or interface automatically makes code follow OCP, no matter how it's used."
      depth_notes: "Không gọi tên pattern GoF (Strategy) — chọn lọc GĐ2 gọi đúng tên. Chỉ dùng đúng cấu trúc code đã có."
    - id: design.l1.solid-lsp
      title:
        vi: "LSP: thay được kiểu con mà không hỏng gì"
        en: "LSP: swap in a subtype and nothing breaks"
      main_path: true
      duration_min: 14
      skills: [design.solid.lsp]
      prereqs: [design.l1.solid-ocp]
      related: []
      vocab: [lsp]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Design/ShippingFeeLspViolation.cs
      - samples/DonHang.Samples/Samples/Oop/ShippingFee.cs
      - samples/DonHang.Samples.Tests/SamplesTests.cs
      outline:
      - "The Liskov Substitution Principle: code written against a base type must keep working, unchanged, when given any of its subtypes."
      - "Every existing `ShippingFee` subtype (`StandardShipping`, `ExpressShipping`, `PickUpInStore`) can replace any other at the one call site that asks `ForOrder`, and the caller never needs to know which one it got — LSP holding."
      - "`BulkOnlyShipping` throws when `totalVnd` is below 5,000,000 instead of returning a fee, which breaks LSP: code written for `ShippingFeeBase` doesn't expect the calculation itself to throw."
      misconceptions:
      - "LSP just means a subclass must implement every method its base type declares."
      - "As long as a subclass compiles against its base type, it automatically satisfies LSP."
      depth_notes: "Không nói variance hay pre/post-condition hình thức — quá sâu cho GĐ1, chỉ dùng trực giác 'thay được mà không hỏng gì'."
    - id: design.l1.solid-isp
      title:
        vi: "ISP: interface nhỏ, không ai phải cài đặt thứ không dùng"
        en: "ISP: small interfaces, nobody implements what they don't use"
      main_path: true
      duration_min: 13
      skills: [design.solid.isp]
      prereqs: [design.l1.solid-lsp]
      related: []
      vocab: [isp]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Oop/INotifier.cs
      - samples/DonHang.Samples/Samples/Oop/NotifierBase.cs
      - samples/DonHang.Samples/Samples/Design/NotifierIspViolation.cs
      outline:
      - "The Interface Segregation Principle: no code should be forced to depend on methods it doesn't use — many small, focused interfaces beat one large one."
      - "`INotifier` (seen for interface vs abstract class) already follows ISP: it declares one method, `Send`, so `EmailNotifier` and `SmsNotifier` (through `NotifierBase`) fill in only `Format`."
      - "`IFullNotifier` bundles `Send`, `History` and `Retry`, forcing `SmsOnlyNotifier` to implement two methods it has no real behavior for — it throws `NotSupportedException` from both."
      misconceptions:
      - "A big interface is fine as long as each of its methods is used by some class somewhere."
      - "ISP is only about how many methods an interface has, not about who is forced to depend on it."
      depth_notes: "Không gọi tên Adapter hay role interface bằng thuật ngữ GoF — GĐ2. Chỉ dùng INotifier đã có và một phản ví dụ."
    - id: design.l1.solid-dip
      title:
        vi: "DIP: phụ thuộc vào abstraction, không phụ thuộc cài đặt cụ thể"
        en: "DIP: depend on the abstraction, not the concrete class"
      main_path: true
      duration_min: 14
      skills: [design.solid.dip]
      prereqs: [design.l1.solid-isp]
      related: []
      vocab: [dip]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Design/OrderNotifications.cs
      - samples/DonHang.Samples/Samples/Oop/INotifier.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Infrastructure/LoggingNotifier.cs
      outline:
      - "The Dependency Inversion Principle: high-level code should depend on an abstraction, not on a concrete, low-level implementation."
      - "Code that takes an `INotifier` — not an `EmailNotifier` — as a constructor parameter, like `OrderNotifications` or the API's `OrderService`, can be given any notifier later without its own source changing."
      - "Without DIP, high-level code that creates `new EmailNotifier()` itself, like `OrderPlacedTightlyCoupled`, is coupled to that one concrete class, undoing the coupling lesson from earlier in this module."
      misconceptions:
      - "Dependency Inversion just means using interfaces somewhere in the codebase."
      - "Dependency Inversion is just a way of creating objects and handing them to the classes that need them."
      depth_notes: "Không nói DI container, service lifetime, hay cách wiring thật — module dependency-injection ngay sau. DIP chỉ là nguyên tắc; cơ chế injection là bài khác."
  - id: layered
    title:
      vi: "Kiến trúc phân tầng: Controller, Service, Repository"
      en: "Layered architecture: Controller, Service, Repository"
    stage: 1
    summary:
      vi: "Chia đúng API Đơn Hàng thành controller/service/repository và theo dõi được một request đi qua cả ba."
      en: "Split the Đơn Hàng API correctly into controller/service/repository and trace a request through all three."
    lessons:
    - id: design.l1.why-layers
      title:
        vi: "SRP cho cả ứng dụng, không chỉ một class"
        en: "SRP for a whole application, not just one class"
      main_path: true
      duration_min: 12
      skills: [design.layers.motivation]
      prereqs: [design.l1.solid-srp, backend.l1.saving-changes]
      related: []
      vocab: [layer]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Clean/PlaceOrderSplit.cs
      - DonHang.Domain/DonHang.Domain.csproj
      - DonHang.Infrastructure/DonHang.Infrastructure.csproj
      outline:
      - "SRP asks one class to have one reason to change; a layered architecture applies the same idea to a whole application, grouping classes into a few large-scale concerns instead of judging one class at a time."
      - "A typical split is by kind of concern: talking HTTP, deciding what the business allows, and reading or writing the database — each layer changes for a different reason."
      - "`PlaceOrderSplit`'s four methods hint at separate concerns; the Đơn Hàng API at stage-1 is already split into three projects — `DonHang.Api`, `DonHang.Domain`, `DonHang.Infrastructure` — one per kind of concern."
      misconceptions:
      - "Layers are just folders for organizing files; putting a class in the right folder is what matters."
      - "More layers is always better design, no matter how small the application."
      depth_notes: "Không nói tên các tầng cụ thể (controller/service/repository) — ba bài sau. Chỉ nói ý tưởng chung: nhóm theo loại lý do thay đổi."
    - id: design.l1.the-controller-layer
      title:
        vi: "Controller chỉ nói HTTP"
        en: "The controller only speaks HTTP"
      main_path: true
      duration_min: 12
      skills: [design.layers.controller]
      prereqs: [design.l1.why-layers, backend.l1.rest-resources]
      related: []
      vocab: [controller]
      example_tag: stage-1
      example_files: [DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "A controller only speaks HTTP: it reads the request, calls into the layer below, and shapes the result into a DTO and a status code."
      - "A controller doesn't decide business rules or touch the database directly — it delegates both to the layers below it."
      - "`OrdersController.Create` does only HTTP work: it reads the caller's id from the token, maps the request to `OrderItem`s, calls `OrderService.PlaceOrderAsync`, and turns the result into `201` with an `OrderDto`."
      misconceptions:
      - "Business rules like discount logic belong in the controller, since that's what the client is asking for."
      - "A thin controller means writing less code overall, not moving code to a different layer."
      depth_notes: "Không nói action filter hay model binding chi tiết — ngoài phạm vi GĐ1. Chỉ đọc controller; service và repository là hai bài sau."
    - id: design.l1.the-service-layer
      title:
        vi: "Service giữ quy tắc nghiệp vụ, không biết gì về HTTP"
        en: "The service holds the rules, and knows nothing about HTTP"
      main_path: true
      duration_min: 14
      skills: [design.layers.service]
      prereqs: [design.l1.the-controller-layer, backend.l1.validating-input]
      related: []
      vocab: [service-layer]
      example_tag: stage-1
      example_files: [DonHang.Domain/OrderService.cs, DonHang.Api/Controllers/OrdersController.cs]
      outline:
      - "The service layer holds business rules and orchestration: `OrderService.PlaceOrderAsync` checks for items, builds the `Order`, saves it and notifies — the validation lesson's empty-items check lives here, not in the controller."
      - "A service method takes plain input, not an HTTP request, and returns a plain result, not an HTTP response, so it can be tested without any HTTP involved."
      - "`OrdersController` knows HTTP and DTOs while `OrderService` knows orders: deciding whether an order is valid sits in a different class from turning it into JSON and a status code, as SRP predicted."
      misconceptions:
      - "The service layer is just where you put code that doesn't fit anywhere else."
      - "A service method should accept the raw HTTP request object, so it has access to everything it might need."
      depth_notes: "Không nói transaction script vs domain model — module domain-model GĐ2. Chỉ nói service layer có trách nhiệm gì."
    - id: design.l1.the-repository-layer
      title:
        vi: "Repository che DbContext sau vài phương thức"
        en: "A repository hides the DbContext behind a few methods"
      main_path: true
      duration_min: 14
      skills: [design.layers.repository]
      prereqs: [design.l1.the-service-layer, backend.l1.querying-with-linq]
      related: []
      vocab: [repository]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/IOrderRepository.cs
      - DonHang.Infrastructure/EfOrderRepository.cs
      - DonHang.Domain/OrderService.cs
      outline:
      - "A repository hides how data is fetched or saved behind a small set of methods that describe what the service needs, not how EF Core does it."
      - "`OrderService` depends on `IOrderRepository`, declared in `DonHang.Domain`, while `EfOrderRepository` in `DonHang.Infrastructure` implements it with the `DbContext` — DIP again, now between the service and data-access layers."
      - "Because the service only sees the repository's methods, changing how data is stored later would not require changing the service's own code."
      misconceptions:
      - "A repository is just a different name for a DbContext; wrapping it in a class with the same methods changes nothing."
      - "Every query the app needs should be written inline wherever it's used, since the repository can't anticipate every query."
      depth_notes: "Không nói Unit of Work hay Repository pattern đầy đủ theo tên GoF — module Repository & Unit of Work GĐ2. Ở đây chỉ dạy ý tưởng: một lớp che truy vấn thật."
    - id: design.l1.tracing-a-request-through-layers
      title:
        vi: "Một request đi qua ba tầng"
        en: "One request, through three layers"
      main_path: true
      duration_min: 14
      skills: [design.layers.tracing]
      prereqs: [design.l1.the-repository-layer]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Infrastructure/EfOrderRepository.cs
      outline:
      - "`POST /api/v1/orders` travels: the controller reads the caller and the request, the service checks the items and builds the order, the repository saves it, and the controller turns the result into `201` with a `Location` header."
      - "In `Create`, each layer calls only the one below it; `Get`/`List` read through the repository without a service, and the products and login endpoints query the `DbContext` directly — shortcuts past the service."
      - "A change to which orders are allowed only touches the service; a change to how orders are queried only touches the repository — one change no longer forces several unrelated ones."
      misconceptions:
      - "Any layer can call any other layer directly, as long as the end result is correct."
      - "Splitting into layers means writing the same logic three times, once per layer."
      depth_notes: "Không nói DI container thật (đăng ký service trong Program.cs) — module dependency-injection ngay sau, bài này chỉ vẽ luồng gọi."
  - id: dependency-injection
    title:
      vi: "Dependency Injection: từ new đến container"
      en: "Dependency Injection: from new to container"
    stage: 1
    summary:
      vi: "Chuyển từ tự new() phụ thuộc sang nhận qua constructor, hiểu container và lifetime, và đăng ký thật cho API Đơn Hàng."
      en: "Move from new-ing dependencies to receiving them via constructor, understand the container and lifetimes, and wire real registrations for the Đơn Hàng API."
    lessons:
    - id: design.l1.dependency-injection-intro
      title:
        vi: "DI khác DIP: nguyên tắc và cách thực hiện nó"
        en: "DI isn't DIP: the principle and the mechanic that carries it out"
      main_path: true
      duration_min: 12
      skills: [design.di.intro]
      prereqs: [design.l1.solid-dip, design.l1.the-repository-layer]
      related: []
      vocab: [dependency-injection]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Design/OrderNotifications.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Domain/OrderService.cs
      outline:
      - "Dependency Injection is a technique: a class receives the objects it depends on as constructor parameters, instead of creating them itself with `new`."
      - "`OrderPlacedTightlyCoupled` creates its own `EmailNotifier` with `new()` and is stuck with it; `OrderNotifications` takes an `INotifier` constructor parameter and can be given any implementation, even one written later."
      - "Dependency Injection is how DIP (the principle: depend on abstractions) actually gets carried out in code — the principle says what to depend on, injection is the mechanic that supplies it."
      - "In the API, `OrdersController` receives `OrderService`, and `OrderService` receives `IOrderRepository` and `INotifier`; neither calls `new` on a dependency, so something outside them must build the objects and pass them in."
      misconceptions:
      - "Dependency Injection and Dependency Inversion are two names for the same thing."
      - "A class 'uses DI' as soon as it takes any constructor parameter, even a plain string or number."
      depth_notes: "Không nói container hay lifetime — hai bài sau. Chỉ phân biệt DI (kỹ thuật) khỏi DIP (nguyên tắc, đã học ở module solid). Ai dựng OrderService lúc chạy: chỉ nói 'một thứ bên ngoài', để bài container trả lời."
    - id: design.l1.the-di-container
      title:
        vi: "Container: đăng ký một lần, dựng cả cây phụ thuộc"
        en: "The container: register once, resolve the whole graph"
      main_path: true
      duration_min: 13
      skills: [design.di.container]
      prereqs: [design.l1.dependency-injection-intro]
      related: []
      vocab: [di-container]
      example_tag: stage-1
      example_files:
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Infrastructure/EfOrderRepository.cs
      - DonHang.Infrastructure/LoggingNotifier.cs
      outline:
      - "A DI container is registered once, at startup, with mappings: 'when something needs an `IOrderRepository`, give it an `EfOrderRepository`.'"
      - "To build `OrdersController`, the container resolves each constructor parameter; for `OrderService` it looks at what that constructor asks for (`IOrderRepository`, `INotifier`), resolves those the same way, recursively, then passes them in."
      - "Without a container, building `OrdersController` by hand means writing every nested `new` (`EfOrderRepository` needs a `DonHangDbContext`) wherever one is needed, and updating each of them whenever a dependency changes."
      misconceptions:
      - "The container guesses which implementation to use based on the interface's name."
      - "Every object the app creates goes through the container, including simple data objects like a DTO."
      depth_notes: "Không trích đăng ký thật trong Program.cs — bài wiring-the-container sau. Chỉ giải thích container làm gì, dựa trên constructor của các class có thật."
    - id: design.l1.service-lifetimes
      title:
        vi: "Singleton, scoped, transient: sống bao lâu"
        en: "Singleton, scoped, transient: how long an instance lives"
      main_path: true
      duration_min: 14
      skills: [design.di.lifetimes]
      prereqs: [design.l1.the-di-container, backend.l1.efcore-mapping]
      related: []
      vocab: [service-lifetime]
      example_tag: stage-1
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Infrastructure/ServiceCollectionExtensions.cs
      - DonHang.Api/JwtTokenService.cs
      outline:
      - "A service lifetime decides how long one resolved instance lives: singleton (one instance, ever), scoped (one per request), or transient (a new one every time)."
      - "`AddDbContext` registers `DonHangDbContext` as scoped, and `EfOrderRepository`, `LoggingNotifier` and `OrderService` are scoped too: every part of the same request shares one `DbContext`, and the next request gets a fresh one."
      - "Registering `DonHangDbContext` as singleton would share one change tracker across every concurrent request — the wrong lifetime for a type not safe to use from more than one request at once."
      - "`JwtTokenService` is registered singleton: it keeps no state of its own between calls, so one instance can serve every request; at startup, outside any request, Program.cs creates a scope by hand to get a `DbContext` for migrations."
      misconceptions:
      - "Singleton is the safest default, since there's only ever one object to worry about."
      - "Service lifetime only affects performance, not correctness."
      depth_notes: "Không nói captive dependency (singleton phụ thuộc scoped) hay lifetime validation của container — ngoài phạm vi GĐ1. Repo không có đăng ký transient nào; chỉ nêu bằng lời."
    - id: design.l1.wiring-the-container
      title:
        vi: "Đăng ký thật: repository, service, DbContext"
        en: "The real registrations: repository, service, DbContext"
      main_path: true
      duration_min: 14
      skills: [design.di.wiring]
      prereqs: [design.l1.service-lifetimes, design.l1.the-repository-layer]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - DonHang.Infrastructure/ServiceCollectionExtensions.cs
      - DonHang.Api/Program.cs
      - DonHang.Api/Controllers/OrdersController.cs
      outline:
      - "`AddDonHangInfrastructure` registers `DonHangDbContext`, `IOrderRepository` → `EfOrderRepository` and `INotifier` → `LoggingNotifier`; Program.cs calls it, then registers `OrderService` — the container lesson's mappings, for real."
      - "`OrdersController` lists `OrderService` and `IOrderRepository` in its constructor and gets them from the container on each request; it never calls `new OrderService(...)` or knows what `OrderService` itself depends on."
      - "The registrations for infrastructure classes live in `DonHang.Infrastructure`, next to the classes they name, so Program.cs never names `EfOrderRepository` or `LoggingNotifier`."
      - "These registrations are what connect the layers from the previous module at startup: without them the classes still exist, but ASP.NET Core cannot build an `OrdersController`."
      misconceptions:
      - "An interface and its implementation need to be registered separately, once for each place that uses them."
      - "If a registration is missing, the app still runs and just returns null for that dependency."
      depth_notes: "Không nói options pattern hay named/keyed registration — ngoài phạm vi GĐ1."
    - id: design.l1.why-di-helps-testing
      title:
        vi: "Vì sao DI làm test được: một service, một bản thay thế"
        en: "Why DI makes testing possible: one service, one stand-in"
      main_path: true
      duration_min: 12
      skills: [design.di.testing-payoff]
      prereqs: [design.l1.wiring-the-container]
      related: []
      vocab: []
      example_tag: stage-1
      example_files:
      - DonHang.Domain/OrderService.cs
      - samples/DonHang.Samples/Samples/Design/OrderNotifications.cs
      - samples/DonHang.Samples/Samples/Oop/NotifierBase.cs
      outline:
      - "Because `OrderService` receives `IOrderRepository` and `INotifier` through its constructor, a test can hand it stand-in versions that keep orders in memory and only record notifications, without changing `OrderService`'s own code."
      - "`OrderPlacedTightlyCoupled` creates its own `EmailNotifier`, so any check of `Handle` also runs what `EmailNotifier.Send` really does — here, writing to the console; there is no place to swap it without editing the class."
      - "This is why DIP and DI matter beyond tidiness: a class built around abstractions can be tested in isolation, which the next module puts to direct use."
      misconceptions:
      - "Testing is a separate concern from how a class gets its dependencies; DI doesn't change what's testable."
      - "A class needs a testing framework installed before dependency injection is worth doing."
      depth_notes: "Không trích test thật (DonHang.Tests) hay giới thiệu test double bằng tên — module unit-testing ngay sau. Nói 'bản thay thế' (stand-in), không nói 'fake'."
  - id: unit-testing
    title:
      vi: "Unit test và test double"
      en: "Unit testing and test doubles"
    stage: 1
    summary:
      vi: "Đọc và viết được unit test cho code Đơn Hàng, dùng fake repository để cô lập OrderService khỏi DB thật."
      en: "Read and write a unit test for Đơn Hàng code, and use a fake repository to isolate OrderService from a real database."
    lessons:
    - id: design.l1.unit-test-first-look
      title:
        vi: "Một khẳng định kiểm tra tự động: unit test"
        en: "A checkable claim, checked automatically: the unit test"
      main_path: true
      duration_min: 12
      skills: [design.testing.first-look]
      prereqs:
      - design.l1.why-di-helps-testing
      - foundation.l1.code-smells-basic
      - management.l1.user-story-and-ac
      related: []
      vocab: [unit-test]
      example_tag: stage-0
      example_files:
      - samples/DonHang.Samples.Tests/SamplesTests.cs
      - samples/DonHang.Samples/Samples/Oop/ShippingFee.cs
      outline:
      - "A unit test is a small program that puts one piece of code into a specific state and checks a specific claim about it, automatically, without a person reading the output."
      - "Arrange, act, assert: a unit test sets up the situation, does the one thing being tested, then checks the result — in that order, every time."
      - "`ShippingFeeTests.StandardShippingIsFreeFromTwoMillion` (already in the repository) arranges a `StandardShipping`, acts by calling `ForOrder`, and asserts the fee matches the business rule."
      - "A unit test's claim is the same kind of thing an acceptance criterion already is: a checkable statement, just checked by a program instead of a person."
      misconceptions:
      - "A unit test is any test that runs quickly, no matter what it touches (a database, the file system, the network)."
      - "Reading the code and confirming it looks right is basically the same as writing a unit test for it."
      depth_notes: "Không viết test mới ở bài này — chỉ đọc test đã có. Không nói test double — bài sau."
    - id: design.l1.writing-a-unit-test
      title:
        vi: "Fact, tên test, và Assert.Equal"
        en: "Fact, a test's name, and Assert.Equal"
      main_path: true
      duration_min: 14
      skills: [design.testing.writing]
      prereqs: [design.l1.unit-test-first-look]
      related: []
      vocab: []
      example_tag: stage-0
      example_files: [samples/DonHang.Samples.Tests/SamplesTests.cs]
      outline:
      - "An xUnit test method is marked `[Fact]`, takes no parameters, and returns `void` (or `Task` when it awaits something); xUnit finds and runs every `[Fact]` method in the project."
      - "A test name states the behavior being checked, not the method under test — `AnEmptyOrderCannotBePaid` says what should happen; `TestMarkPaid` would not."
      - "`Assert.Equal(expected, actual)` compares the two values and fails with a clear message if they differ; the expected value always comes first."
      misconceptions:
      - "Test method names don't matter, as long as the test passes."
      - "`Assert.Equal(actual, expected)` and `Assert.Equal(expected, actual)` behave identically, since both just check equality."
      depth_notes: "Không nói test double hay setup/teardown phức tạp — bài sau. Chỉ cơ chế viết một test đơn giản."
    - id: design.l1.test-doubles
      title:
        vi: "Test double: không cần phụ thuộc thật để test"
        en: "Test doubles: no real dependency needed to test"
      main_path: true
      duration_min: 13
      skills: [design.testing.doubles]
      prereqs: [design.l1.writing-a-unit-test, design.l1.why-di-helps-testing]
      related: []
      vocab: [test-double, fake]
      example_tag: stage-1
      example_files: [DonHang.Tests/FakeOrderRepository.cs, DonHang.Tests/FakeNotifier.cs]
      outline:
      - "A test double is a stand-in object used in a test instead of a class's real dependency, given to the class the same way dependency injection already supplies the real one."
      - "A fake is a test double with a real, simplified implementation of its own — `FakeOrderRepository` keeps orders in a `Dictionary<int, Order>` in memory and hands out ids itself, instead of talking to PostgreSQL."
      - "A test double exists because the class being tested doesn't need everything its dependency does in production, only a small, predictable version of it."
      misconceptions:
      - "A test double is a copy of the real class, with the same code, just renamed."
      - "Any class taking a constructor parameter can already be tested without a test double."
      depth_notes: "Không phân biệt sâu stub/mock/spy — module integration-testing GĐ2 khi cần testcontainers. Chỉ dùng đúng một loại (fake), đủ cho bài sau."
    - id: design.l1.testing-with-a-fake-repository
      title:
        vi: "Test OrderService bằng fake, không cần Postgres"
        en: "Testing OrderService with a fake, no Postgres needed"
      main_path: true
      duration_min: 14
      skills: [design.testing.applying-doubles]
      prereqs: [design.l1.test-doubles, design.l1.the-repository-layer]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.Tests/Services/OrderServiceTests.cs, DonHang.Tests/DonHang.Tests.csproj]
      outline:
      - "`OrderService`'s tests give it a `FakeOrderRepository` instead of `EfOrderRepository`, exactly because `OrderService` depends on the `IOrderRepository` abstraction, not a concrete EF Core class."
      - "A test against `OrderService` with a fake repository runs in memory, with no database server and no PostgreSQL connection needed — `DonHang.Tests` references only `DonHang.Domain` — fast enough to run on every change."
      - "Testing `OrderService` this way only checks its own logic; it does not check that `EfOrderRepository` actually saves correctly — that's a different kind of test."
      misconceptions:
      - "A test using a fake repository proves the real, EF Core-backed repository works too."
      - "Since the fake repository isn't 'real', tests using it aren't really testing anything important."
      depth_notes: "Không nói integration test hay testcontainers — module integration-testing GĐ2 kiểm EfOrderRepository thật. Bài này chỉ kiểm OrderService cô lập."
    - id: design.l1.what-makes-a-good-unit-test
      title:
        vi: "Một unit test tốt: nhanh, một hành vi, không flaky"
        en: "A good unit test: fast, one behavior, not flaky"
      main_path: true
      duration_min: 12
      skills: [design.testing.quality]
      prereqs: [design.l1.testing-with-a-fake-repository]
      related: []
      vocab: [flaky-test]
      example_tag: stage-1
      example_files: [DonHang.Tests/Services/OrderServiceTests.cs, DonHang.Domain/OrderService.cs]
      outline:
      - "A good unit test is fast, checks one behavior, and gives the same result every time against unchanged code; a test that sometimes passes and sometimes fails with no code change is a flaky test."
      - "Depending on the current time, a random number, or the order other tests ran in commonly makes a test flaky; `PlaceOrderAsync` stamps `PlacedAt` with the current time, and no `OrderServiceTests` test asserts it."
      - "One assertion failure should point at one broken behavior; a test asserting many unrelated things makes a failure hard to diagnose, even when it correctly passes or fails."
      misconceptions:
      - "More assertions in one test method means better coverage, so a test should check as much as possible at once."
      - "A flaky test is still useful, since it catches the bug most of the time."
      depth_notes: "Không nói code coverage hay test pyramid — ngoài phạm vi GĐ1. Chỉ nói đặc điểm của một test tốt."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: gof-patterns
    title:
      vi: "GoF patterns chọn lọc qua Đơn Hàng"
      en: "Selected GoF patterns in Đơn Hàng"
    stage: 2
    summary:
      vi: "Nhận ra bảy GoF pattern ngay trong code Đơn Hàng, nói được mỗi pattern giải quyết vấn đề gì, và phân biệt các cặp dễ nhầm như strategy với template method, decorator với adapter."
      en: "Recognise seven GoF patterns in Đơn Hàng's own code, state the problem each one solves, and tell apart look-alike pairs such as strategy and template method, or decorator and adapter."
    lessons:
    - id: design.l2.strategy-pattern
      title:
        vi: "Strategy: truyền quy tắc vào thay vì rẽ nhánh theo nó"
        en: "Strategy: pass the rule in instead of branching on it"
      main_path: true
      duration_min: 14
      skills: [design.patterns.behavior]
      prereqs: [design.l1.solid-ocp, design.l1.dependency-injection-intro]
      related: [foundation.l1.oop-polymorphism]
      vocab: [design-pattern, strategy-pattern]
      example_tag: stage-2
      example_files:
      - samples/DonHang.Samples/Samples/Design/CheckoutTotal.cs
      - samples/DonHang.Samples/Samples/Oop/ShippingFee.cs
      - samples/DonHang.Samples.Tests/SamplesTests.cs
      outline:
      - "A design pattern is a named, reusable shape of solution to a design problem that keeps coming back; the GoF book, Design Patterns, catalogues 23 of them for object-oriented code."
      - "The Strategy pattern puts each variant of one rule in its own class behind a shared type, and the code that needs the rule is handed one of those objects instead of choosing a branch itself."
      - "At stage-2, `CheckoutTotal` receives a `ShippingFee` in its constructor and adds `ForOrder`'s result to the items total, without ever checking which kind of shipping it was given."
      - "Which `ShippingFee` `CheckoutTotal` gets is decided while the program runs, by the code that creates it, so a new shipping kind needs no change to `CheckoutTotal`."
      - "Polymorphism is the language feature; Strategy is the design decision to make one rule replaceable by handing the object in from outside, and it is worth it only when the rule really varies."
      misconceptions:
      - "Every abstract class with a few subclasses is already the Strategy pattern."
      - "Using more design patterns always makes code better, even for a rule that never changes."
      - "Strategy only moves the `if/else` to another file, so nothing is really gained."
      depth_notes: "Không dạy ai chọn ShippingFee từ chuỗi kind — bài design.l2.factory; không so với template method — bài design.l2.template-method-pattern. Không liệt kê 23 pattern hay chia nhóm creational/structural/behavioral của sách GoF."
    - id: design.l2.factory
      title:
        vi: "Factory: một chỗ duy nhất quyết định tạo class nào"
        en: "A factory: one place decides which class to create"
      main_path: true
      duration_min: 13
      skills: [design.patterns.creation]
      prereqs: [design.l2.strategy-pattern, backend.l2.hosted-services]
      related: [design.l1.the-di-container]
      vocab: [factory]
      example_tag: stage-2
      example_files:
      - samples/DonHang.Samples/Samples/Design/ShippingFeeFactory.cs
      - samples/DonHang.Samples/Samples/Design/ShippingFeeIfElseChain.cs
      - DonHang.Api/Jobs/NotificationSender.cs
      outline:
      - "A factory is a method or object whose job is to create objects, so the code that uses those objects never names the concrete class."
      - "At stage-2, `ShippingFeeFactory.ForKind` turns a kind string such as `\"express\"` into a `ShippingFee` subclass, and throws `ArgumentException` for a kind it does not know."
      - "The branch on the kind string still exists, but only in the factory and only to pick a class; the fee rules stay in the subclasses, whereas `ShippingFeeIfElseChain` mixes both."
      - "Adding a shipping kind now means one new subclass and one new line in the factory; no code that calculates a fee or uses `CheckoutTotal` changes."
      - "`NotificationSender` asks `IServiceScopeFactory` for a fresh `IServiceScope` each round instead of building one itself: a factory the framework provides and the DI container hands in."
      misconceptions:
      - "A factory removes every `if` or `switch` on the kind from the program."
      - "Once there is a DI container, an application never needs a factory of its own."
      depth_notes: "Không dạy Factory Method và Abstract Factory đúng nghĩa sách GoF (lớp con quyết định class được tạo; họ đối tượng đi cùng nhau) hay keyed service của DI container — ngoài GĐ2. Không nhắc lại scope và lifetime — design.l1.service-lifetimes, backend.l2.hosted-services."
    - id: design.l2.template-method-pattern
      title:
        vi: "Template method: lớp cha giữ thứ tự, lớp con điền một bước"
        en: "Template method: the base class fixes the steps, subclasses fill one"
      main_path: true
      duration_min: 12
      skills: [design.patterns.behavior]
      prereqs: [design.l2.strategy-pattern, foundation.l1.oop-interface-vs-abstract]
      related: []
      vocab: [template-method-pattern]
      example_tag: stage-1
      example_files:
      - samples/DonHang.Samples/Samples/Oop/NotifierBase.cs
      - samples/DonHang.Samples/Samples/Oop/INotifier.cs
      outline:
      - "The Template Method pattern puts the fixed order of steps in one base-class method and leaves one or more of those steps abstract, for subclasses to fill in."
      - "`NotifierBase.Send` always formats the message, records it in `Sent`, then writes it to the console; `EmailNotifier` and `SmsNotifier` override only `Format` and cannot reorder or skip the other steps."
      - "Template Method varies a step through inheritance, fixed when the subclass is written; Strategy varies it through an object handed in, which can be chosen while the program runs."
      - "A C# class has only one base class, so two steps that vary independently would need a subclass for every combination; with Strategy each step can get its own object instead."
      misconceptions:
      - "Any abstract class is the Template Method pattern, as long as it has an abstract method."
      - "Template Method and Strategy are the same idea, one written with an abstract class and the other with an interface."
      depth_notes: "Không nói hook method (bước có cài đặt mặc định, lớp con tùy chọn ghi đè) hay chi tiết virtual/sealed — ngoài GĐ2. Không nhắc lại interface vs abstract class — foundation.l1.oop-interface-vs-abstract."
    - id: design.l2.builder-pattern
      title:
        vi: "Builder: gom cấu hình từng bước, tạo đối tượng một lần"
        en: "Builder: collect the settings first, create the object once"
      main_path: true
      duration_min: 13
      skills: [design.patterns.creation]
      prereqs: [design.l2.strategy-pattern, design.l1.wiring-the-container, backend.l1.migrations]
      related: [design.l2.factory]
      vocab: [builder-pattern]
      example_tag: stage-1
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Infrastructure/DesignTimeDbContextFactory.cs
      - DonHang.Domain/OrderService.cs
      outline:
      - "The Builder pattern separates collecting an object's settings, over several steps, from creating it: a builder object gathers the settings, and one final call produces the finished object."
      - "In `Program.cs`, `WebApplication.CreateBuilder(args)` returns a `WebApplicationBuilder`; the code adds registrations to `builder.Services`, then `builder.Build()` creates the `WebApplication` that runs."
      - "Once `Build()` has run, the service registrations are fixed: adding a registration to `builder.Services` after that throws an `InvalidOperationException`."
      - "`DesignTimeDbContextFactory` uses a smaller builder: `DbContextOptionsBuilder` is given `UseNpgsql(...)`, and its `Options` property hands the finished options to `DonHangDbContext`."
      - "`OrderService` creates an `Order` with an object initializer instead: when every value is known at once and no step must finish first, C# needs no builder."
      misconceptions:
      - "A builder is just a constructor with many parameters, split across several lines."
      - "`builder.Services` can still take new registrations after `Build()`, as long as `app.Run()` has not been called yet."
      - "Every class with many properties deserves its own builder."
      depth_notes: "Không nói director của sách GoF, fluent interface tổng quát hay test data builder — ngoài GĐ2. Không nhắc lại từng đăng ký trong Program.cs — design.l1.wiring-the-container."
    - id: design.l2.decorator-pattern
      title:
        vi: "Decorator: cùng interface, bọc thêm một việc quanh lời gọi"
        en: "Decorator: same interface, one more job around each call"
      main_path: true
      duration_min: 15
      skills: [design.patterns.wrapping]
      prereqs: [design.l2.strategy-pattern, backend.l2.cache-invalidation, design.l1.the-repository-layer]
      related: [backend.l1.middleware-pipeline]
      vocab: [decorator-pattern]
      example_tag: stage-2
      example_files:
      - DonHang.Domain/IProductRepository.cs
      - DonHang.Infrastructure/ProductCache.cs
      - DonHang.Infrastructure/EfProductRepository.cs
      - DonHang.Infrastructure/ServiceCollectionExtensions.cs
      outline:
      - "The Decorator pattern wraps an object in another object that implements the same interface, holds the wrapped one, and adds work before or after passing each call on."
      - "At stage-2, `ProductCache` implements `IProductRepository` and receives another `IProductRepository` to wrap; on a cache miss it passes `FindAsync` on and stores the result in Redis."
      - "When staff change a price, `ProductCache` lets the wrapped repository save it first and only then deletes `product:{id}`, so cache invalidation is added around the call, not inside the query code."
      - "`ProductsController` depends only on `IProductRepository` and cannot tell which one it got; the registration in `ServiceCollectionExtensions` alone puts `ProductCache` around an `EfProductRepository`."
      - "Because a decorator has the same interface as what it wraps, decorators can be stacked, each adding one job, without any change to the class at the centre."
      misconceptions:
      - "To cache product reads, you have to edit the repository method that runs the query."
      - "A decorator is a subclass of the class it adds behaviour to."
      depth_notes: "Không nhắc lại cache-aside, TTL hay stampede — module backend/caching. Không dạy thư viện đăng ký decorator (Scrutor) hay proxy pattern — ngoài GĐ2. Không so decorator với adapter — bài design.l2.adapter-pattern."
    - id: design.l2.adapter-pattern
      title:
        vi: "Adapter: khớp một thư viện vào interface code của bạn cần"
        en: "Adapter: make a library fit the interface your code wants"
      main_path: true
      duration_min: 13
      skills: [design.patterns.wrapping]
      prereqs: [design.l2.decorator-pattern, backend.l2.retry-with-backoff]
      related: [design.l1.solid-isp]
      vocab: [adapter-pattern]
      example_tag: stage-2
      example_files:
      - DonHang.Domain/IEmailSender.cs
      - DonHang.Infrastructure/MailKitEmailSender.cs
      - DonHang.Api/Jobs/NotificationSender.cs
      outline:
      - "The Adapter pattern puts a class between your code and a library whose interface does not match what your code wants; the adapter implements your interface and translates each call into the library's."
      - "`NotificationSender` depends on `IEmailSender`, which Đơn Hàng declares in its own words: send one email to an address, with a subject and a body."
      - "At stage-2, `MailKitEmailSender` implements `IEmailSender` by building a MailKit `MimeMessage` and sending it through MailKit's `SmtpClient`, so no MailKit type appears in `NotificationSender`."
      - "A decorator keeps the interface of the object it wraps and adds work; an adapter offers a different interface from the one it wraps and adds no business rule of its own."
      - "Moving to another mail library means writing another `IEmailSender` adapter; `NotificationSender`, including its retry with exponential backoff, stays as it is."
      misconceptions:
      - "An adapter and a decorator are the same thing, since both wrap another object."
      - "Wrapping a library in your own interface only pays off if you already plan to switch libraries."
      depth_notes: "Không dạy cấu hình SMTP, TLS tới mail server hay API chi tiết của MailKit — ngoài GĐ2. Không nói anti-corruption layer — design/ddd-strategic GĐ3. Facade không có bài riêng ở GĐ2; không gọi tên."
    - id: design.l2.observer-pattern
      title:
        vi: "Observer: bên phát sự kiện không cần biết ai đang nghe"
        en: "Observer: the object raising an event doesn't know who listens"
      main_path: true
      duration_min: 14
      skills: [design.patterns.behavior]
      prereqs: [design.l2.strategy-pattern, backend.l2.database-job-queue]
      related: [backend.l2.work-outside-the-request]
      vocab: [observer-pattern]
      example_tag: stage-2
      example_files:
      - samples/DonHang.Samples/Samples/Design/OrderEvents.cs
      - samples/DonHang.Samples.Tests/SamplesTests.cs
      outline:
      - "The Observer pattern lets objects subscribe to something that happens in another object; that object keeps the list of subscribers and calls each one, without knowing what they do."
      - "In C#, an `event` holds that list: at stage-2, `OrderEvents` declares an `OrderPlaced` event, and each subscriber adds its handler with `+=`."
      - "Raising a C# event calls the handlers one after another, in the order they subscribed, on the same thread, and the raising method continues only after the last one returns."
      - "If a handler throws, the handlers after it are not called and the exception reaches the method that raised the event, as a test in `SamplesTests` shows."
      - "An observer is therefore not a background job: it runs inside the call that raised the event and nothing retries it, which is why Đơn Hàng keeps order emails in the `notifications` job queue."
      misconceptions:
      - "Raising an event runs the subscribers in the background, so the raiser does not wait for them."
      - "If one subscriber throws, the others still run, because subscribers do not know about each other."
      depth_notes: "Không nói domain event, message broker hay publish/subscribe giữa các service — design/ddd-tactical và backend/messaging GĐ3. Không nói hủy đăng ký, rò bộ nhớ do event hay IObservable<T> — ngoài GĐ2."
  - id: clean-hexagonal
    title:
      vi: "Clean và Hexagonal: khác gì Layered"
      en: "Clean and hexagonal: how they differ from layered"
    stage: 2
    summary:
      vi: "Chỉ ra được chiều phụ thuộc giữa các project Đơn Hàng, gọi đúng tên port, adapter, use case, unit of work, composition root, và giữ dependency rule bằng một test."
      en: "Point out which way Đơn Hàng's projects depend on each other, name its ports, adapters, use cases, unit of work and composition root, and guard the dependency rule with a test."
    lessons:
    - id: design.l2.dependency-rule
      title:
        vi: "Gọi đi một chiều, phụ thuộc chiều ngược lại: dependency rule"
        en: "Calls go one way, dependencies the other: the dependency rule"
      main_path: true
      duration_min: 13
      skills: [design.architecture.dependency-rule]
      prereqs: [design.l1.the-repository-layer, design.l1.tracing-a-request-through-layers]
      related: [design.l1.solid-dip]
      vocab: [dependency-rule]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/DonHang.Domain.csproj
      - DonHang.Infrastructure/DonHang.Infrastructure.csproj
      - DonHang.Domain/IOrderRepository.cs
      - DonHang.Infrastructure/EfOrderRepository.cs
      outline:
      - "In a classic layered design each layer depends on the one below it, so the business layer depends on the data-access layer and, through it, on the database technology."
      - "Đơn Hàng reverses that arrow: `DonHang.Infrastructure.csproj` has a `ProjectReference` to `DonHang.Domain`, while `DonHang.Domain.csproj` references no other project and no package."
      - "At run time `OrderService` calls into `EfOrderRepository`, yet at compile time `EfOrderRepository` depends on `DonHang.Domain`: `IOrderRepository` lets the call and the dependency point in opposite directions."
      - "The dependency rule: source-code dependencies point only toward the business rules, so the code that holds the rules never names a class, package or project from outside it."
      misconceptions:
      - "If `OrderService` calls the repository, `DonHang.Domain` must depend on `DonHang.Infrastructure`."
      - "Splitting code into layers already guarantees that the business rules don't depend on the database."
      - "The dependency rule means no project may reference another project."
      depth_notes: "Không gọi tên port/adapter hay hexagonal — design.l2.ports-and-adapters; không nói Clean Architecture — design.l2.clean-architecture. Vì sao DonHang.Api tham chiếu cả hai project — design.l2.composition-root."
    - id: design.l2.ports-and-adapters
      title:
        vi: "Hexagonal: lõi chỉ nói chuyện với bên ngoài qua port của chính nó"
        en: "Hexagonal: the core reaches the outside only through its own ports"
      main_path: true
      duration_min: 14
      skills: [design.architecture.hexagonal]
      prereqs: [design.l2.dependency-rule, design.l2.adapter-pattern]
      related: [design.l1.solid-isp]
      vocab: [hexagonal-architecture]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/INotifier.cs
      - DonHang.Infrastructure/LoggingNotifier.cs
      - DonHang.Domain/Entities.cs
      - DonHang.Infrastructure/DonHangDbContext.cs
      outline:
      - "Hexagonal architecture, also called ports and adapters, puts the business rules in a core that reaches the outside world only through interfaces the core declares itself, called ports."
      - "`IOrderRepository` and `INotifier` are Đơn Hàng's ports: both live in `DonHang.Domain` and say what `OrderService` needs in its own words — find an order, save, send a message about an order."
      - "An adapter implements a port for one technology: `EfOrderRepository` for PostgreSQL through EF Core, `LoggingNotifier` for the application log; neither class is named anywhere in `DonHang.Domain`."
      - "`Order` and `OrderItem` carry no EF Core attribute; which table and column each property maps to is set in `DonHangDbContext`, outside the core."
      - "Changing a technology means writing another adapter for the same port; `FakeOrderRepository` in `DonHang.Tests` is already a second adapter for `IOrderRepository`, one that keeps orders in memory."
      misconceptions:
      - "Hexagonal architecture means splitting the application into six layers."
      - "A port is the network port the API listens on."
      - "An interface belongs next to its implementation, so `IOrderRepository` should live in `DonHang.Infrastructure`."
      depth_notes: "Không phân biệt hai phía adapter — design.l2.driving-and-driven-adapters. Không nói lịch sử hay hình lục giác có nghĩa gì ngoài việc vẽ. Không nhắc lại Adapter pattern — design.l2.adapter-pattern."
    - id: design.l2.driving-and-driven-adapters
      title:
        vi: "Controller cũng là adapter: phía gọi vào lõi và phía lõi gọi ra"
        en: "Controllers are adapters too: the side that calls in, the side called"
      main_path: true
      duration_min: 13
      skills: [design.architecture.hexagonal]
      prereqs:
      - design.l2.ports-and-adapters
      - design.l1.testing-with-a-fake-repository
      - design.l1.the-controller-layer
      related: []
      vocab: [driving-adapter, driven-adapter]
      example_tag: stage-1
      example_files:
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Tests/Services/OrderServiceTests.cs
      - DonHang.Tests/FakeNotifier.cs
      - DonHang.Domain/OrderService.cs
      outline:
      - "Adapters sit on two sides of the core: a driving adapter calls into the core to ask it to do something, and a driven adapter is called by the core through a port the core declares."
      - "`OrdersController` is a driving adapter: it turns an HTTP request into a call to `OrderService.PlaceOrderAsync` and the result back into HTTP; `EfOrderRepository` and `LoggingNotifier` are driven adapters."
      - "`OrderServiceTests` drives the same core with no HTTP at all: it calls `PlaceOrderAsync` directly and plugs `FakeOrderRepository` and `FakeNotifier` into the driven ports."
      - "The core cannot tell which adapter calls it or which one it calls, so the same `OrderService` runs unchanged behind a controller in the API and behind a test in `DonHang.Tests`."
      - "On the driving side Đơn Hàng declares no interface: `OrdersController` calls `OrderService`'s public methods directly, because that dependency already points toward the core."
      misconceptions:
      - "Only the database and notification code are adapters; controllers belong to the core."
      - "Every port must be a C# interface, including the one a controller calls."
      - "Tests sit outside the architecture, so they don't count as using the core."
      depth_notes: "Không nói driving adapter khác (hosted service, CLI, message consumer) — backend/messaging GĐ3. Không nhắc lại fake và test double — module unit-testing GĐ1."
    - id: design.l2.clean-architecture
      title:
        vi: "Clean, hexagonal hay layered: khác nhau ở chiều phụ thuộc"
        en: "Clean vs hexagonal vs layered: where the dependencies point"
      main_path: true
      duration_min: 14
      skills: [design.architecture.clean]
      prereqs: [design.l2.driving-and-driven-adapters, design.l1.why-layers]
      related: []
      vocab: [clean-architecture, use-case]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/OrderService.cs
      - DonHang.Domain/Entities.cs
      - DonHang.Domain/DonHang.Domain.csproj
      - DonHang.Api/DonHang.Api.csproj
      outline:
      - "Clean Architecture, named after the book Clean Architecture, draws a system as rings: business rules at the centre, then use cases, then adapters such as controllers, then frameworks and the database at the edge."
      - "A use case is one thing the application does for its user, with the rules for doing it; `PlaceOrderAsync` and `CancelOrderAsync` in `OrderService` are Đơn Hàng's use cases."
      - "Clean Architecture's central rule is the dependency rule: code in an inner ring names nothing in an outer ring — the same direction hexagonal architecture keeps between the core and its adapters."
      - "Layered, hexagonal and Clean all keep HTTP, business rules and data access apart; classic layering lets business code depend on data access, while hexagonal and Clean make data access depend on the rules."
      - "The rings describe dependency direction, not a count of projects: in Đơn Hàng, `Order` and `OrderService` share `DonHang.Domain`, while controllers and repositories sit outside it, in `DonHang.Api` and `DonHang.Infrastructure`."
      misconceptions:
      - "Clean Architecture and hexagonal architecture are rival designs, so a project has to pick one."
      - "Following Clean Architecture means one project per ring."
      - "`DonHang.Api`, `DonHang.Domain` and `DonHang.Infrastructure` are three layers, so Đơn Hàng is just a classic layered design."
      depth_notes: "Không dạy presenter, input/output boundary hay tách project theo ring; không nói domain model vs anemic — design/domain-model; không chia theo module/feature — design/modular-monolith GĐ3. Không nêu tên tác giả."
    - id: design.l2.unit-of-work
      title:
        vi: "DbContext của EF Core đã là một unit of work"
        en: "EF Core's DbContext is already a unit of work"
      main_path: true
      duration_min: 14
      skills: [design.architecture.unit-of-work]
      prereqs: [design.l2.ports-and-adapters, backend.l2.no-tracking-queries, design.l1.service-lifetimes]
      related: [backend.l2.database-job-queue, backend.l2.transactions-in-practice]
      vocab: [unit-of-work]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/IOrderRepository.cs
      - DonHang.Infrastructure/EfOrderRepository.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Tests/FakeOrderRepository.cs
      outline:
      - "A unit of work keeps track of everything one business operation changes and writes all of it together at the end, so the operation is saved completely or not at all."
      - "EF Core's `DbContext` is a unit of work: its change tracker records what was added or modified, and one `SaveChangesAsync` writes all of it in a single transaction."
      - "`CancelOrderAsync` sets `Status` on the order `FindAsync` returned, then calls `SaveChangesAsync`; it never tells the repository what changed, because the tracked `DbContext` behind `EfOrderRepository` noticed."
      - "`EfOrderRepository.SaveChangesAsync` calls `db.SaveChangesAsync()`, which saves every change tracked by that scoped `DbContext`, including changes made by any other class given the same instance in that request."
      - "Declaring `SaveChangesAsync` on the `IOrderRepository` port lets `OrderService` decide when an operation is finished without naming EF Core; `FakeOrderRepository` implements it as doing nothing."
      - "A hand-written unit-of-work class around the `DbContext` repeats what EF Core does; it pays off when the core coordinates several repositories and needs one commit call that belongs to none of them."
      misconceptions:
      - "A unit of work is just another name for a database transaction."
      - "`IOrderRepository` has no `Update` method, so changing `order.Status` is never saved."
      - "Each repository saves its own changes, so two repositories used in one request always write in two separate transactions."
      - "Clean code needs a generic repository and a unit-of-work class wrapped around EF Core."
      depth_notes: "Không nhắc lại AsNoTracking hay chi tiết change tracker — backend.l2.no-tracking-queries; không nói isolation level — backend.l2.transactions-in-practice. Không trích code stage-2 (đơn + dòng notifications) — chỉ related."
    - id: design.l2.composition-root
      title:
        vi: "Composition root: chỗ duy nhất được biết mọi project"
        en: "The composition root: the one place that knows every project"
      main_path: true
      duration_min: 13
      skills: [design.architecture.dependency-rule]
      prereqs: [design.l2.driving-and-driven-adapters, design.l1.wiring-the-container]
      related: [design.l1.tracing-a-request-through-layers]
      vocab: [composition-root]
      example_tag: stage-1
      example_files:
      - DonHang.Api/Program.cs
      - DonHang.Api/DonHang.Api.csproj
      - DonHang.Api/Controllers/ProductsController.cs
      - DonHang.Api/Controllers/AuthController.cs
      outline:
      - "The composition root is the one place where the application's objects are wired together; in Đơn Hàng it is `Program.cs`, together with the `AddDonHangInfrastructure` method it calls."
      - "`DonHang.Api.csproj` references `DonHang.Infrastructure` because the composition root must name the adapters to register them; `DonHang.Domain` never needs that reference."
      - "The same reference lets any class in `DonHang.Api` use `DonHangDbContext`: at stage-1, `ProductsController` and `AuthController` do, so those driving adapters reach the database without going through the core."
      - "Such a shortcut leaves `DonHang.Domain` untouched, but a business rule later added to those endpoints would live in a driving adapter, outside the core and outside its tests."
      - "Skipping the core is a reasonable trade for an endpoint that only reads rows and applies no rule; once an endpoint has a rule to enforce, sending it through the core keeps that rule in one place."
      misconceptions:
      - "`DonHang.Api` references `DonHang.Infrastructure`, so Đơn Hàng breaks the dependency rule."
      - "The composition root is just another name for the DI container."
      - "Every endpoint must go through a service in the core, even one that only lists rows."
      depth_notes: "Không nhắc lại từng đăng ký hay lifetime — design.l1.wiring-the-container. Không nói ProductsController ở stage-2 (IProductRepository) — design.l2.decorator-pattern. Không tách project Api/Host — ngoài GĐ2."
    - id: design.l2.testing-the-dependency-rule
      title:
        vi: "Một test đỏ lên khi lõi bắt đầu phụ thuộc framework"
        en: "A test that fails when the core starts depending on a framework"
      main_path: true
      duration_min: 12
      skills: [design.architecture.dependency-rule]
      prereqs: [design.l2.composition-root, design.l1.writing-a-unit-test]
      related: []
      vocab: [architecture-test]
      example_tag: stage-2
      example_files:
      - DonHang.Tests/Architecture/DependencyRuleTests.cs
      - DonHang.Domain/DonHang.Domain.csproj
      - DonHang.Tests/DonHang.Tests.csproj
      outline:
      - "An architecture test is a unit test that checks how the code is structured, such as which assemblies a project uses, instead of how it behaves."
      - "At stage-2, `DependencyRuleTests` reads `typeof(OrderService).Assembly.GetReferencedAssemblies()` and fails if a name starts with `DonHang.Infrastructure`, `DonHang.Api`, `Microsoft.EntityFrameworkCore` or `Microsoft.AspNetCore`."
      - "Without a project reference, code in `DonHang.Domain` cannot name a type from `DonHang.Infrastructure` — the build fails; but nothing in the build stops someone adding an EF Core package to `DonHang.Domain`."
      - "The test runs with every other test in `DonHang.Tests`, so a change that breaks the dependency rule shows up as a failing test before code review, not as a comment during it."
      - "A passing architecture test proves only the rule it checks: it says nothing about whether a business rule sits in the core or in a controller."
      misconceptions:
      - "If the solution builds, the core cannot depend on a framework."
      - "Unit tests can only check behaviour, so structure needs a separate tool."
      - "If the architecture test passes, the design is clean."
      depth_notes: "Không dạy thư viện kiểm kiến trúc (NetArchTest, ArchUnitNET) hay kiểm ranh giới giữa các module — design/modular-monolith GĐ3; fitness function — GĐ4. Không nói CI chạy test — devops/ci-cd."
  - id: domain-model
    title:
      vi: "Domain model hay anemic model"
      en: "Domain model versus anemic model"
    stage: 2
    summary:
      vi: "Nhận ra transaction script và anemic model trong Đơn Hàng stage-1, chuyển quy tắc trạng thái đơn vào chính Order mà EF Core vẫn đọc ghi được, test quy tắc đó không cần fake, và chọn đúng chỗ cho từng quy tắc."
      en: "Recognise the transaction script and anemic model in stage-1 Đơn Hàng, move the order status rules into Order itself while EF Core still loads it, test them with no fake, and place each rule where it belongs."
    lessons:
    - id: design.l2.transaction-script
      title:
        vi: "Transaction script: một method chạy trọn một thao tác nghiệp vụ"
        en: "Transaction script: one method runs the whole business operation"
      main_path: true
      duration_min: 12
      skills: [design.domain.anemic-vs-rich]
      prereqs: [design.l1.the-service-layer, design.l2.clean-architecture]
      related: [foundation.l1.transaction-intro]
      vocab: [transaction-script]
      example_tag: stage-1
      example_files: [DonHang.Domain/OrderService.cs, DonHang.Domain/Entities.cs]
      outline:
      - "A transaction script puts one business operation in one procedure that runs its steps in order: check the input, load or build the data, change it, save it, report it."
      - "`PlaceOrderAsync` and `CancelOrderAsync` in `OrderService` are transaction scripts: each method holds its whole use case, while `Order` only carries the values the method reads and writes."
      - "The name means one business operation handled by one procedure; it does not mean the method runs inside a database transaction."
      - "A transaction script is easy to follow while an operation has few rules, because every step sits in one method you can read from top to bottom."
      - "When several scripts change the same data, each needs its own copy of the checks on that data, and nothing forces a new script to repeat them."
      misconceptions:
      - "A transaction script is a method that wraps its work in a database transaction."
      - "Putting all the logic in service methods is simply bad design, whatever the application does."
      depth_notes: "Không gọi tên anemic model — design.l2.anemic-domain-model; không đưa hành vi vào Order — design.l2.domain-model. Không nhắc lại service layer — design.l1.the-service-layer. Tên sách Patterns of Enterprise Application Architecture chỉ là tham chiếu trần (history), không nêu tác giả."
    - id: design.l2.anemic-domain-model
      title:
        vi: "Anemic model: Order có dữ liệu mà không có quy tắc nào"
        en: "An anemic model: Order holds the data but none of the rules"
      main_path: true
      duration_min: 13
      skills: [design.domain.anemic-vs-rich]
      prereqs: [design.l2.transaction-script, foundation.l1.oop-encapsulation]
      related: [management.l1.reviewing-for-tests, backend.l1.efcore-mapping]
      vocab: [anemic-domain-model]
      example_tag: stage-1
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Domain/OrderService.cs
      - samples/DonHang.Samples/Samples/Oop/OrderExposed.cs
      outline:
      - "An anemic domain model has classes named after business things, such as `Order`, whose data any code can change, while every rule about that data lives in other classes."
      - "At stage-1, `Order` has a public getter and setter for every property and no methods, and the comment at the top of `Entities.cs` says its classes hold nothing beyond what a row is."
      - "Because `Status` has a public setter, any class holding an `Order` can assign it any string; a rule about which status may follow which exists only where a script remembered to check it."
      - "`CancelOrderAsync` shows the cost: it cancels a `shipped` order, and nothing in `Order` can refuse, because the class has no place where that rule could live."
      - "A DTO is meant to carry data with no rules across a boundary; an anemic domain model is a class that stands for a business thing yet holds none of that thing's rules."
      - "An anemic domain model is a reasonable choice when the data really has no rules; it becomes a cost once rules about that data appear and get repeated across scripts."
      misconceptions:
      - "`Order` uses properties, not public fields, so it is already encapsulated."
      - "An anemic domain model is just another name for a DTO."
      - "An anemic domain model is always a mistake, even for data that has no rules."
      depth_notes: "Không sửa Order ở bài này — cách sửa ở design.l2.domain-model. Không dạy lại đóng gói — foundation.l1.oop-encapsulation; không nói EF Core có cần setter public không — design.l2.ef-core-and-private-setters."
    - id: design.l2.domain-model
      title:
        vi: "Domain model: Order tự quyết có được hủy hay không"
        en: "A domain model: Order itself decides whether it can be cancelled"
      main_path: true
      duration_min: 15
      skills: [design.domain.entity-behaviour]
      prereqs: [design.l2.anemic-domain-model, backend.l2.problem-types, design.l2.dependency-rule]
      related: [design.l3.aggregates-and-invariants]
      vocab: [domain-model]
      example_tag: stage-2
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Domain/OrderStatusException.cs
      - DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs
      outline:
      - "A domain model puts each business rule in the class whose data the rule is about, so that class's methods become the way to change the data."
      - "At stage-2, `Order.Cancel()` throws `OrderStatusException` for an order that is already `cancelled` or `shipped`, and otherwise sets `Status` to `cancelled`."
      - "`CancelOrderAsync` now finds the order, calls `order.Cancel()`, saves and notifies: `OrderService` still runs the use case, while `Order` decides what is allowed."
      - "`OrderStatusException` lives in `DonHang.Domain` and names no HTTP status; `ExceptionHandlingMiddleware` turns it into `409` with one problem `type` per case, so the dependency rule still holds."
      - "Moving a rule into `Order` pays off when several use cases change the same data; for data with no rules it only adds methods that set a value."
      misconceptions:
      - "In a domain model the service disappears, because all logic moves into the entities."
      - "`Order` should throw an exception that already carries status `409`, since the API returns `409` anyway."
      - "A domain model means each entity saves itself to the database."
      depth_notes: "Không nói aggregate, invariant, domain event hay value object — design/ddd-tactical GĐ3 (design.l3.aggregates-and-invariants). Không dạy lại problem type — backend.l2.problem-types. Ship và setter private — bài sau."
    - id: design.l2.status-changes-through-methods
      title:
        vi: "Chỉ method của Order được đổi trạng thái đơn"
        en: "Only Order's own methods can change an order's status"
      main_path: true
      duration_min: 13
      skills: [design.domain.entity-behaviour]
      prereqs: [design.l2.domain-model, backend.l2.role-based-access]
      related: [backend.l2.optimistic-concurrency]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Api/Controllers/OrdersController.cs
      outline:
      - "At stage-2, `Status` has a private setter: code outside `Order` can read it but not assign it, so `order.Status = \"shipped\"` written in `OrderService` would not compile."
      - "Each allowed change is its own method that checks the status it starts from: `MarkPaid()` from `new`, `Ship()` from `paid`, `Cancel()` from `new` or `paid`."
      - "`PATCH /api/v1/orders/{id}/ship` calls `OrderService.ShipOrderAsync`, which calls `order.Ship()`: the endpoint's policy decides who may ship, and `Order` decides whether this order can be shipped."
      - "Reading `Order` alone now lists every status change Đơn Hàng allows, named in business words instead of spread across assignments in several scripts."
      misconceptions:
      - "Turning `Status` into an enum would already stop an order going from `cancelled` to `shipped`."
      - "The ship endpoint requires the `staff` role, so a cancelled order cannot be shipped."
      - "A private setter alone protects the status; `Order` does not also need methods that check anything."
      depth_notes: "Không nói enum, value object hay thư viện state machine cho trạng thái — GĐ3; không dạy lại policy/role — backend.l2.role-based-access; hai request cùng đổi một đơn — backend.l2.optimistic-concurrency. Constructor — bài sau."
    - id: design.l2.valid-from-construction
      title:
        vi: "Constructor từ chối tạo một đơn không có hàng"
        en: "A constructor that refuses to create an order with no items"
      main_path: true
      duration_min: 12
      skills: [design.domain.entity-behaviour]
      prereqs: [design.l2.status-changes-through-methods, backend.l1.validating-input]
      related: [design.l2.builder-pattern]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Api/Middleware/ExceptionHandlingMiddleware.cs
      outline:
      - "At stage-2, `Order`'s public constructor takes the customer id, the items and the time placed, throws `ArgumentException` when there are no items, and sets `Status` to `new` itself."
      - "`PlaceOrderAsync` calls that constructor instead of an object initializer, so the empty-items check moves from `OrderService` into `Order`, and no code can create an order without items."
      - "The API still answers `400` for an order with no items, because `ExceptionHandlingMiddleware` already maps `ArgumentException` to `400`: moving the check did not change the contract."
      - "A constructor that checks its inputs means every `Order` the code creates starts in an allowed state, so later methods need not ask whether it was built correctly."
      misconceptions:
      - "A constructor should only copy its parameters into properties; checks belong in methods."
      - "Moving the empty-items check into `Order` makes the API answer `500` for an empty order."
      depth_notes: "Không nói static factory method hay builder cho entity — design.l2.factory, design.l2.builder-pattern; không nói EF Core tạo Order bằng constructor nào khi đọc — design.l2.ef-core-and-private-setters."
    - id: design.l2.ef-core-and-private-setters
      title:
        vi: "EF Core vẫn đọc được Order dù setter đã private"
        en: "EF Core still loads Order after its setters turn private"
      main_path: true
      duration_min: 13
      skills: [design.domain.entity-behaviour]
      prereqs: [design.l2.valid-from-construction, backend.l1.efcore-relationships-and-keys]
      related: [backend.l1.efcore-mapping]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Infrastructure/DonHangDbContext.cs
      - DonHang.Tests/FakeOrderRepository.cs
      outline:
      - "EF Core maps a property whose setter is private and sets it when it loads a row, so `Status` can be closed to other code and still be read from and saved to the `orders` table."
      - "EF Core cannot pass a navigation such as `Items` to a constructor, so it cannot use `Order`'s public constructor; at stage-2 `Order` has a private parameterless constructor for EF Core."
      - "Loading an order does not run the public constructor's checks: those checks guard orders the code creates, not rows already stored in the table."
      - "`Id` keeps a public setter, because the database generates it on insert and `FakeOrderRepository.AddAsync` assigns it the same way; an id is not a business rule."
      misconceptions:
      - "A class mapped by EF Core must keep public setters, or EF Core cannot fill it."
      - "When EF Core loads an order it calls the public constructor, so a stored order with no items would throw."
      depth_notes: "Không nói backing field, owned type, value converter hay lazy-loading proxy — ngoài GĐ2. Không nhắc lại mapping cột hay navigation — backend.l1.efcore-mapping, backend.l1.efcore-relationships-and-keys."
    - id: design.l2.testing-the-entity
      title:
        vi: "Test quy tắc của Order không cần fake nào"
        en: "Testing Order's rules needs no fake at all"
      main_path: true
      duration_min: 13
      skills: [design.domain.entity-behaviour]
      prereqs: [design.l2.valid-from-construction, design.l1.testing-with-a-fake-repository]
      related: [management.l1.reviewing-for-tests]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Tests/Domain/OrderTests.cs
      - DonHang.Domain/Entities.cs
      - DonHang.Tests/Services/OrderServiceTests.cs
      outline:
      - "At stage-2, `OrderTests` builds an `Order` with its constructor and calls its methods directly: no repository, no notifier, no fake and no `await`."
      - "`OrderTests` covers the case the stage-1 suite never had: an order that was paid and then shipped throws `OrderStatusException` when `Cancel()` is called."
      - "`OrderServiceTests` keeps only what needs the fakes, such as a cancelled order being saved and notified; checking each status rule there again would repeat `OrderTests`."
      - "A rule inside the entity is cheaper to test than the same rule inside a service, because the test creates only the object under test instead of wiring its dependencies."
      misconceptions:
      - "Every unit test needs a fake for something."
      - "Rules must be tested through `OrderService`, because that is what the controller calls."
      depth_notes: "Không nói test theo bảng dữ liệu hay property-based testing — ngoài GĐ2. Không nhắc lại fake và test double — design.l1.test-doubles; test với database thật — design/integration-testing."
    - id: design.l2.where-a-rule-belongs
      title:
        vi: "Entity, service hay controller: mỗi quy tắc Đơn Hàng nằm ở đâu"
        en: "Entity, service or controller: where each Đơn Hàng rule goes"
      main_path: true
      duration_min: 14
      skills: [design.domain.anemic-vs-rich]
      prereqs:
      - design.l2.testing-the-entity
      - backend.l2.resource-based-authorization
      - design.l2.composition-root
      related: [design.l3.aggregates-and-invariants]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.Domain/Entities.cs
      - DonHang.Domain/OrderService.cs
      - DonHang.Api/Controllers/OrdersController.cs
      - DonHang.Api/Authorization/OrderOwnerHandler.cs
      outline:
      - "A rule that needs only one order's own data, such as which status may follow which or that an order has items, belongs in `Order`."
      - "Steps that reach outside the order, such as loading it, saving it and sending a notification, stay in `OrderService`, which runs the use case and asks `Order` for each decision."
      - "Who may act is decided in `DonHang.Api`: the ship endpoint's `staff` policy and `OrderOwnerHandler` run there, before `OrderService` changes anything."
      - "Turning HTTP into a call and the result back into HTTP stays in `OrdersController`; a controller that starts deciding status changes has taken a rule out of `Order`."
      - "A domain model is worth its extra methods where rules exist; an operation with no rule, such as listing products, stays simpler as a direct query or a short script."
      misconceptions:
      - "Checking whether the caller is staff is a business rule, so it belongs in `Order`."
      - "Once there is a domain model, every class in `DonHang.Domain`, including `Product` and `Payment`, must get methods too."
      depth_notes: "Không nói aggregate, domain service hay domain event — design/ddd-tactical GĐ3; không nói chia module hay bounded context — GĐ3. Không nhắc lại composition root hay RBAC/ABAC — các bài trước."
