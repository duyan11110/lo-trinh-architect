module:
  id: evolutionary-and-tradeoffs
  title:
    vi: "Kiến trúc tiến hóa và đánh đổi"
    en: "Evolutionary architecture and trade-offs"
  stage: 4
  summary:
    vi: "Đổi kiến trúc Đơn Hàng từng bước có fitness function canh giữ, viết yêu cầu chất lượng thành kịch bản đo được, gọi tên điểm đánh đổi, đánh giá kiến trúc đa cửa hàng bằng ATAM rút gọn và lượng hóa nợ kỹ thuật bằng giờ."
    en: "Change Đơn Hàng's architecture in steps guarded by fitness functions, write quality requirements as measurable scenarios, name trade-off points, review the multi-shop architecture with a reduced ATAM, and quantify technical debt in hours."
  lessons:
    - id: design.l4.evolutionary-architecture
      title:
        vi: "Kiến trúc tiến hóa đổi từng bước nhỏ, bước nào cũng được kiểm"
        en: "An evolutionary architecture changes in small steps that are checked"
      main_path: true
      duration_min: 13
      skills: [design.evolution.fitness-functions]
      prereqs:
        - design.l4.merging-a-service-back
        - design.l4.over-abstraction
        - management.l3.where-debt-comes-from
        - management.l3.superseding-an-adr
      related: [design.l3.before-extracting-a-module, design.l4.architectural-drivers]
      vocab: [evolutionary-architecture, quality-attribute]
      example_tag: stage-3
      example_files:
        - docs/adr/0002-tach-notifications-thanh-service.md
        - docs/adr/0008-xoa-bang-cu-trong-donhang.md
        - docs/team/tech-debt-register.md
        - docs/adr/README.md
      outline:
        - "An evolutionary architecture is built to be changed in small, guided steps as its drivers change, instead of being fixed up front for drivers guessed in advance."
        - "A quality attribute is a property the whole system must have, such as how fast it answers, how well its parts stay apart or how safely it can be changed; the drivers decide which ones matter."
        - "Đơn Hàng's email moved in steps: at stage-2 it ran inside `DonHang.Api`, and ADR `0002` records the two drivers that changed before Notifications became a service at stage-3."
        - "Each step leaves the system working: the split left the old `notifications` table behind as debt N1, and ADR `0008` removes it in later steps, dumping the data first."
        - "Small steps are safe only when checks after each step confirm that the quality attributes that matter still hold; without them a step can quietly undo what an earlier decision secured."
      misconceptions:
        - "A good architect designs the final architecture up front, so that it never has to change."
        - "Having to change the architecture later proves the first design was wrong."
        - "An evolutionary architecture means skipping design and letting the code grow on its own."
      depth_notes: "Không dạy fitness function — design.l4.fitness-functions. Không dạy lại các bước tách module, thay thế ADR — design.l3.before-extracting-a-module, management.l3.superseding-an-adr. Không nêu tên sách, tác giả."
    - id: design.l4.fitness-functions
      title:
        vi: "Fitness function tự động kiểm một thuộc tính chất lượng còn được giữ"
        en: "A fitness function checks automatically that a quality attribute holds"
      main_path: true
      duration_min: 15
      skills: [design.evolution.fitness-functions]
      prereqs:
        - design.l4.evolutionary-architecture
        - design.l3.testing-module-boundaries
        - devops.l2.quality-gate
        - devops.l3.vulnerability-scanning
      related: [design.l2.testing-the-dependency-rule, design.l2.test-pyramid]
      vocab: [fitness-function]
      example_tag: stage-3
      example_files:
        - DonHang.Tests/Architecture/ModuleBoundaryTests.cs
        - DonHang.Tests/Architecture/DependencyRuleTests.cs
        - .github/workflows/ci.yml
        - .grype.yaml
      outline:
        - "A fitness function is an automated check that the system still has a quality attribute it must keep, run with every change instead of left to people's memory."
        - "`DependencyRuleTests` and `ModuleBoundaryTests` are fitness functions for keeping parts apart: they fail when Ordering's core references an outer assembly or a service references a Đơn Hàng project other than `DonHang.Messaging`."
        - "They run in the `test` job of `ci.yml` on every push and pull request, so a change that crosses a boundary fails in the same pull request that made it."
        - "The Grype step of the `image` job is a fitness function for security: it fails the run on a High or Critical vulnerability that has a fixed version, and `.grype.yaml` lists each accepted exception with its reason."
        - "A fitness function checks a quality attribute, not a feature: `OrdersApiTests` checks that an order is placed correctly, while `ModuleBoundaryTests` checks how projects depend on each other, whatever the features do."
        - "A check sees only what it states: `ModuleBoundaryTests` reads assembly references, so a service that connected to another service's database would still pass it."
      misconceptions:
        - "Architecture is checked in design reviews; automated tests are only for features."
        - "A fitness function needs a special tool that the test project does not already have."
        - "If the architecture tests pass, the architecture is fine in every respect."
      depth_notes: "Không dạy lại architecture test, test ranh giới module, quét lỗ hổng — design.l2.testing-the-dependency-rule, design.l3.testing-module-boundaries, devops.l3.vulnerability-scanning. Danh sách fitness function theo thuộc tính và chỗ còn trống — design.l4.mapping-fitness-functions."
    - id: design.l4.quality-attribute-scenarios
      title:
        vi: "Kịch bản thuộc tính chất lượng biến một mong muốn mơ hồ thành điều kiểm được"
        en: "A quality attribute scenario turns a vague wish into a checkable need"
      main_path: true
      duration_min: 12
      skills: [design.evaluation.tradeoffs]
      prereqs:
        - design.l4.fitness-functions
        - management.l2.non-functional-requirements
        - backend.l3.payments-service
      related: [management.l2.requirements-document, backend.l3.saga-in-progress-status]
      vocab: [quality-attribute-scenario]
      example_tag: stage-3
      example_files:
        - docs/team/refund-requirements.md
        - docs/adr/0003-tach-payments-thanh-service.md
      outline:
        - "A quality attribute scenario states one quality requirement as a situation that can be checked: what triggers it, under which conditions, what the system must do and how the response is measured."
        - "YC-7 in `refund-requirements.md` already has that shape: a customer's refund request, while the gateway does not answer or reports an error, is received and answered within 2 seconds."
        - "YC-10 is another: when the gateway fails, the request is sent again automatically for at least 24 hours before it is handed to staff."
        - "A wish such as 'the system must be fast' is not yet a scenario, because nobody can tell whether a design meets it; adding the conditions and the measure is what makes it checkable."
        - "One scenario serves several later uses, comparing designs, writing a fitness function and reviewing an architecture, because each needs to know exactly what must hold."
      misconceptions:
        - "A requirement like 'the system must be highly available' is precise enough to design against."
        - "A quality attribute scenario is just a user story under another name."
        - "Only speed can be written as a measurable requirement; security or ease of change cannot."
      depth_notes: "Không dạy SLO, error budget — backend/capacity-and-slo GĐ4. Không dạy lại yêu cầu phi chức năng — management.l2.non-functional-requirements. Không dạy cây tiện ích (utility tree) như một term; xếp hạng kịch bản — design.l4.reduced-atam."
    - id: design.l4.mapping-fitness-functions
      title:
        vi: "Ghép mỗi thuộc tính chất lượng với phép kiểm của nó để thấy chỗ chưa ai canh"
        en: "Mapping each quality attribute to its check shows what nothing guards"
      main_path: true
      duration_min: 13
      skills: [design.evolution.fitness-functions]
      prereqs:
        - design.l4.quality-attribute-scenarios
        - devops.l2.histograms-and-percentiles
      related: [devops.l3.vulnerability-scanning, devops.l3.restore-testing]
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/design/fitness-functions.md
        - .github/workflows/ci.yml
        - docs/team/refund-requirements.md
      outline:
        - "`fitness-functions.md` lists each quality attribute Đơn Hàng must keep, the ADR or requirement it comes from, the check that guards it and when that check runs."
        - "When a check runs matters: a check that runs only when code changes misses what changes outside the code, such as a vulnerability published after the image was built."
        - "The list also names what no automated check guards yet, such as answering a refund request within 2 seconds (YC-7), so the gap is known instead of assumed covered."
        - "For each gap the team records one choice: add a check, watch the attribute in production with a dashboard, or accept the gap with a stated reason."
        - "A check that would cost more to keep than the risk it covers is not worth automating; writing that choice down keeps it from being mistaken for an oversight."
      misconceptions:
        - "Every quality attribute must be checked automatically on every commit."
        - "If CI is green, every quality attribute the system needs is being checked."
        - "A quality attribute that has no automated check is not really a requirement."
      depth_notes: "Không viết phép kiểm mới cho YC-7 hay cho đa cửa hàng; không dạy alert, SLO — backend/capacity-and-slo GĐ4. Không dạy lại percentile, quét lỗ hổng — devops.l2.histograms-and-percentiles, devops.l3.vulnerability-scanning."
    - id: design.l4.trade-off-points
      title:
        vi: "Điểm đánh đổi: quyết định mà giúp thuộc tính này thì hại thuộc tính kia"
        en: "At a trade-off point, helping one quality attribute hurts another"
      main_path: true
      duration_min: 14
      skills: [design.evaluation.tradeoffs]
      prereqs:
        - design.l4.quality-attribute-scenarios
        - backend.l3.bulkhead
        - management.l3.weighing-options-in-an-adr
      related: [backend.l3.graceful-degradation, backend.l3.saga]
      vocab: [sensitivity-point, trade-off-point]
      example_tag: stage-3
      example_files:
        - DonHang.Api/Program.cs
        - docs/adr/0003-tach-payments-thanh-service.md
        - docs/team/refund-requirements.md
      outline:
        - "A sensitivity point is a decision or setting that one quality attribute depends on strongly, so that changing it moves how well a scenario is met."
        - "A trade-off point is a sensitivity point for two or more quality attributes at once: moving it improves one and worsens another."
        - "The `catalog-reads` limit in `Program.cs` is a trade-off point: allowing more product reads at once serves more product lists under load, but uses more of the database connections that orders also need when Redis is down."
        - "ADR `0003`'s saga is a trade-off point at the scale of the architecture: a refund request is answered within 2 seconds even when the gateway fails, and in exchange the order and the refund agree only after a while."
        - "Naming trade-off points tells the team which decisions to revisit when a driver changes, and what each such change will cost elsewhere."
      misconceptions:
        - "With enough effort, one design can be the best at every quality attribute at once."
        - "Settings such as limits are implementation details, not architecture decisions."
        - "A trade-off is made once at the start and never needs revisiting."
      depth_notes: "Không dạy lại bulkhead, eventual consistency, saga — backend.l3.bulkhead, backend.l3.eventual-consistency, backend.l3.saga. Không chỉnh giá trị limit. ATAM — design.l4.reduced-atam."
    - id: design.l4.reduced-atam
      title:
        vi: "ATAM rút gọn cho các kịch bản quan trọng nhất đi qua kiến trúc"
        en: "A reduced ATAM walks the key scenarios through the architecture"
      main_path: true
      duration_min: 15
      skills: [design.evaluation.atam]
      prereqs:
        - design.l4.trade-off-points
        - design.l4.one-deployment-for-all-shops
      related: [management.l3.weighing-options-in-an-adr, design.l4.a-thousand-shops]
      vocab: [atam]
      example_tag: stage-4
      example_files:
        - docs/design/multi-shop-architecture-review.md
        - docs/team/multi-shop-requirements.md
        - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
      outline:
        - "ATAM, the Architecture Tradeoff Analysis Method, evaluates an architecture by walking its most important quality attribute scenarios through it and recording where its decisions put them at risk."
        - "The full method involves many stakeholders over several sessions; Đơn Hàng's reduced form is one session of the team and the product owner, recorded in `multi-shop-architecture-review.md`."
        - "The review starts from the drivers in `multi-shop-requirements.md` and the shape ADR `0012` chose, and writes each multi-shop requirement as one or more scenarios with a measure."
        - "Each scenario is ranked twice, by how much it matters to the business and by how hard the architecture makes it, and only those high on both are walked through in the session."
        - "Unlike a weighted scoring matrix, which adds scores into one total per option, the review keeps each scenario separate, so one that fails badly cannot hide behind good scores elsewhere."
        - "A reduced review is worth its cost before a decision that is expensive to reverse, such as serving every shop from one deployment; it does not replace testing what is later built."
      misconceptions:
        - "Evaluating an architecture means giving it a score out of ten."
        - "An architecture can only be evaluated after it has been built and is running."
        - "Every scenario anyone raises must be analysed in the session."
      depth_notes: "Không dạy đủ chín bước ATAM hay cây tiện ích như term; không nêu tên người, tổ chức đặt ra phương pháp ngoài tên của nó. Kết quả đánh giá — design.l4.architecture-review-findings. Không quyết lại ADR 0012."
    - id: design.l4.architecture-review-findings
      title:
        vi: "Đánh giá kiến trúc kết thúc bằng rủi ro gắn với quyết định, không bằng một phán quyết"
        en: "An architecture review ends in risks tied to decisions, not a verdict"
      main_path: true
      duration_min: 15
      skills: [design.evaluation.atam]
      prereqs:
        - design.l4.reduced-atam
        - backend.l3.multi-tenancy
        - backend.l3.rate-limiting
      related: [backend.l3.tenant-isolation-models, management.l3.technical-debt-register]
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/design/multi-shop-architecture-review.md
        - DonHang.Api/Program.cs
        - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
      outline:
        - "For each scenario walked through, the review names the decisions involved and records each one as a risk, a non-risk, a sensitivity point or a trade-off point."
        - "The `catalog-reads` limit counts every caller of one API process together, so one busy shop can use it up and other shops' product reads are refused with `503`: a risk for the scenario that one shop's busy day must not slow the others."
        - "The `orders` rate limit counts per customer, never per shop; the review groups such findings into one theme, limits that know no shop, because a theme points at the decision to revisit."
        - "Isolation between shops depends on a data layout that ADR `0012` left to a later ADR, so the review records it as a risk and hands it on instead of deciding it."
        - "Refunds are a non-risk: a refund request is answered without calling the gateway whichever shop it comes from, so YC-7 holds as it did for one shop."
        - "Each risk ends with an owner and a next step, such as a later ADR, a debt register entry or a fitness function to add, so the review changes what the team does next."
      misconceptions:
        - "An architecture review ends with a pass or a fail for the architecture."
        - "A review that finds risks shows that the decision it looked at was wrong."
        - "Risks found in a review should be fixed during the same session."
      depth_notes: "Không chọn bố cục dữ liệu tenant, không sửa limiter theo cửa hàng — ADR GĐ4 khác, backend/capacity-and-slo GĐ4. Không dạy lại noisy neighbor, bulkhead, rate limiting — backend.l3.multi-tenancy, backend.l3.bulkhead, backend.l3.rate-limiting."
    - id: design.l4.quantifying-technical-debt
      title:
        vi: "Lượng hóa nợ: giờ lãi mỗi quý so với số giờ để trả"
        en: "Quantified debt compares interest per quarter with the cost to repay"
      main_path: true
      duration_min: 14
      skills: [design.evolution.debt-quantification]
      prereqs:
        - management.l3.debt-as-a-portfolio
        - management.l2.three-point-estimation
        - design.l4.architecture-review-findings
      related: [management.l3.technical-debt-register, management.l2.schedule-buffer]
      vocab: []
      example_tag: stage-4
      example_files:
        - docs/team/tech-debt-register.md
      outline:
        - "Quantifying debt means estimating, in hours and as a range, the interest an item charges per quarter and the principal it would take to repay it."
        - "Interest per quarter is the number of changes the team expects to that area in a quarter times the extra hours each change pays because of the debt."
        - "At stage-4 `tech-debt-register.md` gives these estimates for each open item, as a low and a high value labelled as the team's assumptions."
        - "Repaying pays off when the interest expected over the time the area will still be changed exceeds the principal; an area about to be removed is cheaper to leave as it is."
        - "N3 stays accepted on these numbers: it charges little interest per quarter, while repaying it needs a new API version that old clients must move to."
        - "Hours put debt in the same unit as feature estimates, so a repayment can be planned and argued for like a story, and the ranges keep the numbers from claiming more precision than they have."
      misconceptions:
        - "Technical debt can only be described in words; it cannot be measured at all."
        - "One exact number for a debt's cost is more trustworthy than a range."
        - "The debt that would take longest to repay is the most urgent one to repay."
      depth_notes: "Không quy ra tiền bằng đơn giá (số liệu thị trường), không đặt tỉ lệ sprint cố định, không dùng công cụ chấm điểm chất lượng code. Không dạy lại hotspot, danh mục nợ, ước lượng ba điểm — management.l3.debt-as-a-portfolio, management.l2.three-point-estimation."

glossary_additions:
  - term: evolutionary-architecture
    en: "evolutionary architecture"
    vi_keep: false
    vi: "kiến trúc tiến hóa"
    short_vi: "Kiến trúc được làm để đổi từng bước nhỏ có kiểm tra khi các yếu tố định hình nó thay đổi"
    short_en: "An architecture built to change in small, checked steps as its drivers change"
    introduced_in: design.l4.evolutionary-architecture
  - term: quality-attribute
    en: "quality attribute"
    vi_keep: false
    vi: "thuộc tính chất lượng"
    short_vi: "Tính chất cả hệ thống phải có, như trả lời nhanh, các phần tách bạch hay sửa an toàn"
    short_en: "A property the whole system must have, such as answering fast, parts kept apart or safe change"
    introduced_in: design.l4.evolutionary-architecture
  - term: fitness-function
    en: "fitness function"
    vi_keep: true
    vi: "fitness function"
    short_vi: "Phép kiểm tự động cho biết hệ thống còn giữ một thuộc tính chất lượng cần giữ hay không"
    short_en: "An automated check that the system still keeps a quality attribute it must keep"
    introduced_in: design.l4.fitness-functions
  - term: quality-attribute-scenario
    en: "quality attribute scenario"
    vi_keep: false
    vi: "kịch bản thuộc tính chất lượng"
    short_vi: "Một yêu cầu chất lượng viết thành tình huống kiểm được: cái gì kích hoạt, điều kiện, hệ thống phải làm gì, đo thế nào"
    short_en: "A quality requirement as a checkable situation: trigger, conditions, required response and its measure"
    introduced_in: design.l4.quality-attribute-scenarios
  - term: sensitivity-point
    en: "sensitivity point"
    vi_keep: false
    vi: "điểm nhạy"
    short_vi: "Quyết định hay thiết lập mà một thuộc tính chất lượng phụ thuộc mạnh vào"
    short_en: "A decision or setting that one quality attribute depends on strongly"
    introduced_in: design.l4.trade-off-points
  - term: trade-off-point
    en: "trade-off point"
    vi_keep: false
    vi: "điểm đánh đổi"
    short_vi: "Điểm nhạy của nhiều thuộc tính chất lượng cùng lúc: đổi nó thì một thuộc tính tốt lên, thuộc tính khác kém đi"
    short_en: "A sensitivity point for several quality attributes: moving it helps one and hurts another"
    introduced_in: design.l4.trade-off-points
  - term: atam
    en: "ATAM (Architecture Tradeoff Analysis Method)"
    vi_keep: true
    vi: "ATAM"
    short_vi: "Phương pháp đánh giá kiến trúc bằng cách đưa các kịch bản quan trọng nhất đi qua kiến trúc và ghi rủi ro"
    short_en: "A method that evaluates an architecture by walking its key scenarios through it and recording risks"
    introduced_in: design.l4.reduced-atam

repo_changes_needed:
  - lesson: design.l4.mapping-fitness-functions
    need: "docs/design/fitness-functions.md (tiếng Việt, mục `### `, không `## `/`**`): bảng mỗi thuộc tính chất lượng Đơn Hàng phải giữ → ADR/YC sinh ra nó → phép kiểm (DependencyRuleTests, ModuleBoundaryTests ×3 ý, bước Grype job image + .grype.yaml, `dotnet restore --locked-mode`, job manifests, RateLimitTests) → chạy khi nào (mỗi push/PR, chỉ push master…); mục 'Chưa có phép kiểm tự động' gồm YC-7 2 giây (thiết kế giữ: API trả 202 không gọi cổng, chưa đo tự động), lỗ hổng công bố sau khi image đã build (không có lần quét theo lịch), cô lập giữa cửa hàng (chờ ADR bố cục dữ liệu), mỗi dòng ghi lựa chọn: thêm phép kiểm / theo dõi bằng dashboard / chấp nhận kèm lý do; mục 'Khi nào sửa danh sách'. Mọi dòng phải đúng với repo ở stage-4; nếu stage-4 có quét theo lịch hay phép kiểm YC-7 thì chuyển dòng và báo để sửa outline mục 2–3."
    suggested_path: "docs/design/fitness-functions.md"
  - lesson: design.l4.reduced-atam
