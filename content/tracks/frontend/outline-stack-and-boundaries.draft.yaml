skills:
  - id: frontend.architecture.client-technology
    title: { vi: "Chọn công nghệ cho client theo driver", en: "Choosing client technology from drivers" }
    prereqs: [design.architecture.drivers, frontend.design-system.brands]
  - id: frontend.architecture.feature-modules
    title: { vi: "Chia app theo feature và giữ ranh giới giữa các feature", en: "Splitting an app by feature and keeping its boundaries" }
    prereqs: [design.modular.boundaries, frontend.state.riverpod]
  - id: frontend.architecture.dependency-cost
    title: { vi: "Chi phí của việc phụ thuộc vào một thư viện bên ngoài", en: "What depending on a third-party library costs" }
    prereqs: [frontend.architecture.feature-modules, management.sourcing.vendors]
  - id: frontend.integration.backend-for-frontend
    title: { vi: "BFF: khi nào một client cần server riêng", en: "Backends for frontends: when a client needs its own server" }
    prereqs: [backend.security.layered-controls, design.architecture.styles]
  - id: frontend.integration.contracts
    title: { vi: "Hợp đồng giữa app và API được kiểm bằng test", en: "App–API contracts checked by tests" }
    prereqs: [backend.api.contract, frontend.testing.widget]
  - id: frontend.observability.real-users
    title: { vi: "Đo trải nghiệm trên máy của khách", en: "Measuring experience on customers' devices" }
    prereqs: [backend.reliability.slo, frontend.performance.measuring]

module:
  id: stack-and-boundaries
  title: { vi: "Công nghệ client và ranh giới của app", en: "Client technology and app boundaries" }
  stage: 4
  summary:
    vi: "Chọn công nghệ cho app từ driver và biết Flutter web hợp với việc gì, xếp DonHang.App theo feature với ranh giới do test giữ, đọc được chi phí của một thư viện bên ngoài, quyết khi nào cần BFF, kiểm hợp đồng app–API bằng test, và đo trải nghiệm trên máy của khách."
    en: "Choose the client's technology from its drivers and know what Flutter web suits, organise DonHang.App by feature with boundaries a test keeps, read what a third-party library costs, decide when a BFF is worth it, check the app–API contract with tests, and measure experience on customers' devices."
  lessons:
    - id: frontend.l4.client-technology-drivers
      title:
        vi: "Chọn công nghệ cho app theo driver, không theo sở thích"
        en: "Pick the client technology from drivers, not from taste"
      main_path: true
      duration_min: 14
      skills: [frontend.architecture.client-technology]
      prereqs:
        - design.l4.architectural-drivers
        - design.l4.one-deployment-for-all-shops
        - frontend.l3.brand-themes
        - frontend.l3.offline-order-queue
      related: [design.l4.conways-law, management.l3.weighing-options-in-an-adr, frontend.l3.profile-mode]
      vocab: [native-app, cross-platform]
      example_tag: stage-4
      example_files:
        - docs/adr/0017-giu-mot-ma-flutter-cho-moi-nen-tang.md
        - docs/adr/0012-phuc-vu-moi-cua-hang-tu-mot-ban-trien-khai.md
        - DonHang.App/lib/design/brand.dart
      outline:
        - "A client can be a web app in the browser, a native app written separately for each platform, or one cross-platform code base, such as Flutter's, built for several platforms."
        - "The choice follows drivers: which devices customers use, which device features are needed, working offline, how people find the product, and what the team already knows."
        - "At stage-3 DonHang.App has only a `web/` platform folder, so it is built for browsers only; most of its Dart code could also be built for Android and iOS once their folders are added."
        - "At stage-4 ADR 0017 keeps one Flutter code base for 1,000 shops: one team keeps one design system and one offline queue, and each shop's look stays a `Brand` value on any platform."
        - "The ADR records what Flutter web costs: the engine the browser downloads before the first frame, and pages whose output does not suit what search engines need to index."
        - "It names what would reopen the decision, such as a device feature Flutter cannot reach or a separate team for each platform."
      misconceptions:
        - "One cross-platform code base is always cheaper than separate apps."
        - "A native app is always faster, so a serious product has to be native."
        - "The technology the team likes best is the right one, as long as it can draw the screens."
      depth_notes: "Không nêu tên hay so sánh framework ngoài versions.yaml (nói bằng lời: framework web dựng HTML, app native). Không build Android/iOS, store, push notification. Trang cho máy tìm kiếm → frontend.l4.pages-for-search. Không dạy lại driver, ADR 0012 — design.l4.architectural-drivers."

    - id: frontend.l4.pages-for-search
      title:
        vi: "Trang Flutter web không có chữ nào cho tới khi app chạy"
        en: "A Flutter web page holds no text until the app runs"
      main_path: true
      duration_min: 13
      skills: [frontend.architecture.client-technology]
      prereqs:
        - frontend.l4.client-technology-drivers
        - frontend.l2.deep-links
        - frontend.l1.html-css-js-roles
      related: [frontend.l1.the-dom, frontend.l3.web-bundle-size]
      vocab: [server-side-rendering]
      example_tag: stage-4
      example_files:
        - scripts/frontend/what-the-server-sends.sh
        - DonHang.App/web/index.html
        - deploy/app-web/Caddyfile
        - docs/adr/0017-giu-mot-ma-flutter-cho-moi-nen-tang.md
      outline:
        - "For `/products/3`, app-web answers with the app's `index.html`, whose body holds only the script tag that starts the app: no product name and no price."
        - "At stage-4 `what-the-server-sends.sh` reads product 3's name from the API, fetches `/products/3` from app-web, and reports that the name is not in the HTML it received."
        - "The name appears only after the browser runs the app's code and the app calls the API, so anything that reads the HTML without running that code sees no product."
        - "Server-side rendering means the server builds, for each request, HTML that already contains the page's text; a hand-written file such as `www/index.html` on `:8080` also carries its text directly."
        - "Flutter's docs say Flutter web's output does not suit what search engines need to index, and recommend HTML for static, document-like pages, kept apart from the Flutter app."
        - "So ADR 0017 keeps ordering in the Flutter app and leaves public product pages meant for search to HTML from the server, decided separately if shops ask for them."
      misconceptions:
        - "A search engine sees a Flutter web page the same way a customer does."
        - "If the product name is on the screen, it was in the HTML the server sent."
        - "Every page of a product has to be built with the same technology."
      depth_notes: "Không dạy framework SSR/SSG cụ thể, hydration, sitemap hay thẻ meta cho SEO; không xây trang sản phẩm công khai. Không nêu kích thước bundle — frontend.l3.web-bundle-size. Không dạy lại DOM, deep link — frontend.l1.the-dom, frontend.l2.deep-links."

    - id: frontend.l4.feature-folders
      title:
        vi: "Xếp file của app theo feature, không theo loại file"
        en: "Group the app's files by feature, not by kind"
      main_path: true
      duration_min: 13
      skills: [frontend.architecture.feature-modules]
      prereqs:
        - design.l3.modules-cut-through-layers
        - frontend.l3.sync-conflicts
        - frontend.l3.component-library
      related: [design.l2.composition-root, frontend.l1.composing-widgets, design.l4.where-boundaries-are-enforced]
      vocab: [package-by-feature]
      example_tag: stage-4
      example_files:
        - docs/design/app-structure.md
        - DonHang.App/lib/router.dart
        - DonHang.App/lib/main.dart
      outline:
        - "At stage-3 `lib/` is split by kind of file, so ordering code is spread over `screens/`, `offline/`, `models.dart`, `providers.dart` and `api_client.dart`, each shared with other features."
        - "Package by feature groups files by what they do for the customer: at stage-4 `lib/features/` holds `catalog/`, `ordering/` and `auth/`, each with its own screens, providers, models and API calls."
        - "Code every feature uses but none owns stays outside them: the design system in `lib/design/`, and the HTTP setup and on-device storage in `lib/shared/`."
        - "`app-structure.md` maps the app to the backend: the app's Catalog and Ordering carry the names of `DonHang.Api`'s modules, so the team's words lead to matching code on both sides."
        - "`main.dart` and `router.dart` stay outside the features and assemble them, the job a composition root does for `DonHang.Api`."
        - "Grouping by feature pays off once several features change for different reasons; an app with one or two screens gains little from the extra folders."
      misconceptions:
        - "Folder layout is a matter of taste; it does not change how many places a change touches."
        - "Package by feature means each feature copies its own HTTP and design code."
        - "Keeping every screen in one folder makes screens easiest to find, however large the app grows."
      depth_notes: "Không dạy kiến trúc thư mục có tên riêng (Feature-Sliced Design…), không tách package Dart. Ranh giới giữa feature → frontend.l4.feature-public-files. Không dạy lại module, composition root — design.l3.modules-cut-through-layers, design.l2.composition-root."

    - id: frontend.l4.feature-public-files
      title:
        vi: "Feature khác chỉ chạm vào một feature qua file công khai của nó"
        en: "A feature is reached only through its public file"
      main_path: true
      duration_min: 14
      skills: [frontend.architecture.feature-modules]
      prereqs:
        - frontend.l4.feature-folders
        - design.l3.testing-module-boundaries
        - design.l3.one-way-module-dependencies
        - frontend.l3.brand-themes
      related: [design.l3.module-contracts, design.l4.conways-law, design.l4.where-boundaries-are-enforced]
      vocab: []
      example_tag: stage-4
      example_files:
        - DonHang.App/lib/features/catalog/catalog.dart
        - DonHang.App/test/architecture/feature_boundaries_test.dart
        - DonHang.App/lib/features/ordering/create_order_screen.dart
        - DonHang.Catalog/ICatalog.cs
      outline:
        - "At stage-4 each feature has one public file, such as `features/catalog/catalog.dart`, exporting the screens, providers and models others may use; every other file in the folder is the feature's own."
        - "`CreateOrderScreen` gets the product list through `catalog.dart`, the way the API's Ordering module reaches products only through `ICatalog`."
        - "`feature_boundaries_test.dart` reads the imports of every file under `lib/` and fails when a feature imports another feature's file other than its public one, or when `shared/` or `design/` imports a feature."
        - "The test also fixes the direction: Ordering may use Catalog and Auth, Catalog may use Auth, and Auth uses neither, so no two features depend on each other."
        - "Building each feature as a separate app with its own release, joined in one page, pays off when separate teams own the features; DonHang.App has one team and stays one app."
      misconceptions:
        - "Dart has no internal keyword, so nothing can stop one folder from using another folder's files."
        - "Code review catches imports across features just as well as a test does."
        - "A boundary is only real when each feature is its own package or its own app."
      depth_notes: "Không tách package Dart, không làm micro-frontend thật, không viết lint rule riêng. Không dạy lại kiểm ranh giới module, phụ thuộc một chiều — design.l3.testing-module-boundaries, design.l3.one-way-module-dependencies. Thư viện bên ngoài → frontend.l4.library-reach."

    - id: frontend.l4.library-reach
      title:
        vi: "Thay một thư viện tốn bằng phần code import nó"
        en: "Replacing a library costs as much as the code that imports it"
      main_path: true
      duration_min: 13
      skills: [frontend.architecture.dependency-cost]
      prereqs:
        - frontend.l4.feature-public-files
        - design.l4.over-abstraction
        - management.l3.vendor-lock-in
        - frontend.l2.overriding-providers-in-tests
      related: [frontend.l2.riverpod-providers, devops.l3.automated-dependency-updates, design.l2.adapter-pattern]
      vocab: []
      example_tag: stage-4
      example_files:
        - scripts/frontend/package-reach.sh
        - DonHang.App/pubspec.yaml
        - DonHang.App/lib/shared/browser.dart
        - DonHang.App/lib/shared/browser_web.dart
      outline:
        - "At stage-4 `package-reach.sh` prints, for each dependency in `pubspec.yaml`, how many files under `lib/` import it, so the cost of replacing a library can be read before anyone argues about it."
        - "`flutter_riverpod` is imported by the providers and screens of every feature, while the `web` package is imported only by the two `browser_web.dart` files that wrap the browser."
        - "A state-management library decides how every screen reads and changes data, so choosing one is a decision for the whole app, judged by testing with overrides, how changes reach screens, and team knowledge."
        - "Hiding Riverpod behind the app's own interfaces would cost what the screens use it for, such as `ref.watch` and provider overrides in tests, so DonHang.App accepts its reach on purpose."
        - "A library that reaches every screen is replaced one feature at a time, old and new side by side until the last feature moves, not in one change that stops all other work."
      misconceptions:
        - "Swapping the state library later is a small refactor, like swapping the HTTP client."
        - "Every third-party library should be wrapped in our own interface, so any of them is cheap to replace."
        - "The most popular state library is the right choice for any app."
      depth_notes: "Không nêu tên hay so sánh thư viện state ngoài versions.yaml; không dạy nâng riverpod/go_router hay đọc changelog. Không dạy lại vendor lock-in, trừu tượng hóa thừa — management.l3.vendor-lock-in, design.l4.over-abstraction. Thay cả hệ thống cũ theo đường dẫn → management GĐ4."

    - id: frontend.l4.backend-for-frontend
      title:
        vi: "BFF chỉ đáng làm khi các client cần những thứ khác nhau"
        en: "A backend for frontend pays off only when clients differ"
      main_path: true
      duration_min: 14
      skills: [frontend.integration.backend-for-frontend]
      prereqs:
        - backend.l4.api-gateway
        - frontend.l4.client-technology-drivers
        - design.l4.conways-law
      related: [backend.l3.payments-service, design.l4.where-boundaries-are-enforced, backend.l2.api-versioning]
      vocab: [backend-for-frontend]
      example_tag: stage-4
      example_files:
        - docs/adr/0018-app-goi-thang-api-chua-them-bff.md
        - DonHang.App/lib/features/ordering/orders_api.dart
        - DonHang.App/lib/features/catalog/catalog_api.dart
        - Caddyfile
      outline:
        - "A backend for frontend (BFF) is a server-side component built for one kind of client: it calls the backend services and returns what that client's screens need, in the shape they need it."
        - "It earns its place when clients differ, such as a staff app and a customer app wanting different data, or when one screen needs answers from several services combined."
        - "At stage-4 every DonHang.App screen that shows Đơn Hàng's data gets it with one request to `DonHang.Api`, and the app never calls Payments, so there is nothing to combine."
        - "ADR 0018 keeps the app calling the API directly: one kind of client, one team, answers already shaped for the screens; a BFF would add a service to run and one more hop per request."
        - "The ADR names what would reopen it: a second kind of client whose needs the API's answers do not fit, or a screen that must combine the API and Payments."
        - "A BFF serves its client but does not replace the services' own checks: who may read an order is still decided by `DonHang.Api`, as behind an API gateway."
      misconceptions:
        - "A BFF is just another name for an API gateway."
        - "Every app should get its own BFF from day one, even as the only client."
        - "Putting business rules in the BFF keeps the services simpler."
      depth_notes: "Không xây BFF; không dạy GraphQL, gRPC hay giữ token phía server cho trình duyệt. Không dạy lại API gateway, defense in depth — backend.l4.api-gateway. Hợp đồng app–API → frontend.l4.app-api-contract."

    - id: frontend.l4.app-api-contract
      title:
        vi: "Hợp đồng của app chỉ liệt kê những field app thật sự đọc"
        en: "The app's contract lists only the fields it reads"
      main_path: true
      duration_min: 15
      skills: [frontend.integration.contracts]
      prereqs:
        - frontend.l4.backend-for-frontend
        - backend.l2.openapi-contract
        - backend.l4.message-schema-evolution
        - design.l2.webapplicationfactory
      related: [backend.l2.breaking-changes, backend.l4.expand-and-contract, frontend.l2.server-errors-in-forms]
      vocab: [contract-test, consumer-driven-contract]
      example_tag: stage-4
      example_files:
        - contracts/app/product.json
        - contracts/app/order.json
        - DonHang.App/test/api_contract_test.dart
        - DonHang.Tests/Integration/AppContractTests.cs
      outline:
        - "DonHang.App reads only a few fields of the API's answers: a product's `id`, `name` and `priceVnd`, and an order's `id`, `status` and each item's `productId`, `quantity` and `unitPriceVnd`."
        - "A contract test checks one side of an integration against a shared description of what the other side expects, so a mismatch fails a test instead of a customer's screen."
        - "At stage-4 `contracts/app/` holds sample answers with only those fields, and the app's `api_contract_test.dart` reads them with `Product.fromJson` and `OrderResult.fromJson`."
        - "`AppContractTests` asks the API, started by `WebApplicationFactory`, for a product and a placed order and fails when a sample's field is missing or has another JSON type, so renaming `PriceVnd` fails it."
        - "Because the consumer writes the samples, this consumer-driven contract lets the API add fields freely and flags only the changes this app would notice."
        - "The OpenAPI document describes everything the API offers; the contract describes what one client depends on, the idea `OrderMessageContractTests` already applies to messages."
      misconceptions:
        - "The OpenAPI document already guarantees that the app will not break."
        - "Tests that run the app against a fake API prove it works with the real one."
        - "A contract test has to list every field of every response."
      depth_notes: "Không dùng công cụ contract test bên ngoài, broker hợp đồng hay sinh code client từ OpenAPI. Không dạy lại OpenAPI, breaking change, WebApplicationFactory — backend.l2.openapi-contract, backend.l2.breaking-changes, design.l2.webapplicationfactory."

    - id: frontend.l4.measuring-real-users
      title:
        vi: "Trải nghiệm của khách được đo trên máy của khách, không phải máy bạn"
        en: "Customers' experience is measured on their devices, not yours"
      main_path: true
      duration_min: 13
      skills: [frontend.observability.real-users]
      prereqs:
        - backend.l4.service-level-indicators
        - frontend.l3.profile-mode
        - frontend.l3.syncing-the-queue
      related: [backend.l4.service-level-objectives, devops.l2.histograms-and-percentiles, frontend.l3.offline-order-queue]
      vocab: [real-user-monitoring, crash-free-sessions]
      example_tag: stage-4
      example_files:
        - docs/design/app-experience.md
        - docs/design/slo.md
      outline:
        - "Profile-mode measurements run on the team's own machine and network, so they find slow code but cannot say how the app behaves on customers' phones, browsers and connections."
        - "Real-user monitoring collects measurements from real customers' devices while they use the app, such as how long the first screen took to appear and which errors happened."
        - "In a release build, a widget whose `build` throws is shown as a gray area while the rest of the app keeps running, so a broken screen does not close the app and can go unnoticed."
        - "Flutter routes errors it catches during build, layout and paint to `FlutterError.onError`, and errors outside its callbacks to `PlatformDispatcher.instance.onError`; an app sets both to see them."
        - "Crash-free sessions is the share of sessions that end without an uncaught error; at stage-4 `app-experience.md` sets it beside `slo.md`'s SLIs, since a failure on the device may never reach the server."
        - "The same document records that DonHang.App collects none of these yet, so until it does, the server's SLIs are the only numbers the team watches."
      misconceptions:
        - "If the server meets its SLOs, customers are having a good experience."
        - "Measuring the app on a fast developer laptop tells you how it feels for customers."
        - "An error that does not close the app is not worth counting."
      depth_notes: "Không nêu tên chỉ số Web Vitals, không dùng dịch vụ crash reporting hay SDK giám sát, không xây endpoint nhận báo cáo. Không dạy DevTools, memory profiling. Không dạy lại SLI, SLO, profile mode — backend.l4.service-level-indicators, frontend.l3.profile-mode."

glossary_additions:
  - term: native-app
    en: "native app"
    vi_keep: true
    vi: "native app"
    short_vi: "App viết riêng cho một nền tảng (Android, iOS) bằng ngôn ngữ và công cụ của chính nền tảng đó"
    short_en: "An app written for one platform, such as Android or iOS, with that platform's own language and tools"
    introduced_in: frontend.l4.client-technology-drivers
  - term: cross-platform
    en: "cross-platform"
    vi_keep: false
    vi: "đa nền tảng"
    short_vi: "Một mã nguồn được build thành app cho nhiều nền tảng, như Flutter cho web, Android và iOS"
    short_en: "One code base built into apps for several platforms, as Flutter does for web, Android and iOS"
    introduced_in: frontend.l4.client-technology-drivers
  - term: server-side-rendering
    en: "server-side rendering (SSR)"
    vi_keep: true
    vi: "server-side rendering (SSR)"
    short_vi: "Server dựng cho mỗi request một trang HTML đã chứa sẵn nội dung, đọc được mà không cần chạy code"
    short_en: "The server builds, per request, HTML that already holds the page's content, readable without running code"
    introduced_in: frontend.l4.pages-for-search
    aliases: ["SSR"]
  - term: package-by-feature
    en: "package by feature"
    vi_keep: true
    vi: "package by feature"
    short_vi: "Xếp code theo tính năng người dùng thấy, mỗi tính năng một thư mục chứa mọi loại file của nó"
    short_en: "Grouping code by user-facing feature, one folder holding every kind of file that feature needs"
    introduced_in: frontend.l4.feature-folders
    aliases: ["feature folders"]
  - term: backend-for-frontend
    en: "backend for frontend (BFF)"
    vi_keep: true
    vi: "backend for frontend (BFF)"
    short_vi: "Thành phần phía server làm riêng cho một loại client, gọi các service và trả đúng thứ màn hình của client đó cần"
    short_en: "A server-side component built for one kind of client, calling services and returning what its screens need"
    introduced_in: frontend.l4.backend-for-frontend
    aliases: ["BFF"]
  - term: contract-test
    en: "contract test"
    vi_keep: true
    vi: "contract test"
    short_vi: "Test kiểm một bên của tích hợp theo bản mô tả chung về điều bên kia cần, để chỗ lệch hỏng ở test"
    short_en: "A test checking one side of an integration against a shared description of what the other side expects"
    introduced_in: frontend.l4.app-api-contract
  - term: consumer-driven-contract
    en: "consumer-driven contract"
    vi_keep: true
    vi: "consumer-driven contract"
    short_vi: "Hợp đồng do bên dùng viết, chỉ liệt kê những gì nó thật sự đọc; bên cung cấp chạy test theo hợp đồng đó"
    short_en: "A contract written by the consumer, listing only what it reads; the provider runs tests against it"
    introduced_in: frontend.l4.app-api-contract
  - term: real-user-monitoring
    en: "real-user monitoring (RUM)"
    vi_keep: true
    vi: "real-user monitoring (RUM)"
    short_vi: "Thu số đo từ máy của khách thật khi họ dùng app, thay vì đo trên máy của đội"
    short_en: "Collecting measurements from real customers' devices while they use the app, not from the team's machines"
    introduced_in: frontend.l4.measuring-real-users
    aliases: ["RUM"]
  - term: crash-free-sessions
    en: "crash-free sessions"
    vi_keep: false
