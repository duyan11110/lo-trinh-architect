repo_changes_needed:
  - lesson: frontend.l4.client-technology-drivers
    need: "ADR tiếng Việt (`### `, không `## `/`**`, không tên framework ngoài versions.yaml — nói bằng lời) `0017` Đã chấp nhận: bối cảnh 1.000 cửa hàng (ADR 0012), khách đặt chủ yếu từ trình duyệt điện thoại, có cửa hàng hỏi app cài trên máy và trang sản phẩm tìm được qua máy tìm kiếm (giả định); 3 phương án: (1) giữ một mã Flutter, web bây giờ, Android/iOS build từ cùng mã khi cần — chọn; (2) viết lại client web bằng framework web dựng HTML + app native riêng; (3) app native mỗi nền tảng + giữ Flutter web; lý do: một đội, design system/`Brand`/hàng đợi offline viết bằng Dart dùng lại được, mỗi cửa hàng khác nhau ở giá trị `Brand`; giá phải trả: engine tải trước khung hình đầu, output Flutter web không hợp việc máy tìm kiếm lập chỉ mục → trang sản phẩm công khai (nếu cửa hàng cần) làm bằng HTML từ server, ADR riêng; stage-4 không thêm thư mục `android/`/`ios/`; xem lại khi cần tính năng thiết bị Flutter không với tới hoặc tách đội theo nền tảng. Thêm dòng 0017 vào README ADR."
    suggested_path: "docs/adr/0017-giu-mot-ma-flutter-cho-moi-nen-tang.md"
  - lesson: frontend.l4.pages-for-search
    need: "Script chạy trên host (lab đang chạy): lấy tên sản phẩm 3 từ `GET http://localhost:8080/api/v1/products/3`, `curl` `http://localhost:8081/products/3` và in phần `<body>` cùng dòng 'tên sản phẩm có trong HTML: không'; rồi `curl http://localhost:8080/` in dòng chữ của `www/index.html`; capture vào `outputs/stage-4/scripts/frontend/`. Capture thấy tên trong HTML của app-web thì DỪNG, sửa outline, không sửa app."
    suggested_path: "scripts/frontend/what-the-server-sends.sh"
  - lesson: frontend.l4.feature-folders
    need: "Xếp lại `DonHang.App/lib/` theo feature, không đổi hành vi (mọi test stage-3 vẫn xanh, golden không đổi, chỉ sửa import và provider bị override): `features/auth/` (auth_controller, keycloak_sign_in, token_subject, browser*.dart của auth, login_screen, auth_callback_screen), `features/catalog/` (model `Product`, `catalog_api.dart` với fetchProducts/fetchProduct, `catalogApiProvider`, productsProvider/productProvider/LoadedProducts, product_list/product_detail screen, product_catalog, product_tile), `features/ordering/` (model OrderItemRequest/OrderResult/totalVnd, `orders_api.dart` với fetchOrder/createOrder giữ Idempotency-Key và ApiUnreachable, `ordersApiProvider`, orderProvider, order_queue, queue_sync, create_order/order_detail/queued_orders screen), `shared/` (`api_client.dart` chỉ còn base URL, header token, ApiProblem, ApiUnreachable; local_store + browser*.dart của offline); `design/`, `l10n/`, `gallery/`, `main.dart`, `router.dart`, `gallery_main.dart` giữ chỗ. `shared/`/`design/` không import feature. Thêm `docs/design/app-structure.md` (tiếng Việt, `### `): bảng thư mục → nội dung, feature ↔ module backend cùng tên (Catalog, Ordering), quy tắc phụ thuộc giữa feature, `main.dart`/`router.dart` ghép các feature. Cập nhật STAGE.md."
    suggested_path: "DonHang.App/lib/features/"
  - lesson: frontend.l4.feature-public-files
    need: "Mỗi feature một file công khai `features/<f>/<f>.dart` chỉ `export` thứ feature khác/`router.dart`/`main.dart` dùng; `create_order_screen.dart` lấy `productsProvider`/`Product` qua `catalog.dart`. Test đọc dòng import/export của mọi file `.dart` dưới `lib/` (như `no_raw_colors_test.dart`), fail khi: feature import file của feature khác không phải file công khai; `shared/` hoặc `design/` import `features/`; hướng phụ thuộc khác bảng cho phép (ordering → catalog, auth; catalog → auth; auth → không feature nào). Thông báo lỗi nêu file và dòng import."
    suggested_path: "DonHang.App/test/architecture/feature_boundaries_test.dart"
  - lesson: frontend.l4.library-reach
    need: "Script (bash thuần, đọc file): với mỗi package trong mục `dependencies:` của `DonHang.App/pubspec.yaml`, đếm số file `.dart` dưới `lib/` (bỏ `lib/l10n/` sinh tự động) có dòng import/export `package:<tên>/`, in xếp giảm dần, liệt kê tên file khi ≤ 3 file; capture. Capture cho thấy `flutter_riverpod` không phải package chạm nhiều file nhất, hoặc `web` nằm ngoài hai file `browser_web.dart` thì DỪNG, sửa outline."
    suggested_path: "scripts/frontend/package-reach.sh"
  - lesson: frontend.l4.backend-for-frontend
    need: "ADR tiếng Việt `0018` Đã chấp nhận: app gọi thẳng `DonHang.Api` (qua Caddy/Gateway), chưa thêm BFF; bối cảnh: một loại client, một đội, mỗi màn hình lấy dữ liệu bằng một request tới API, app không gọi Payments; 3 phương án: giữ nguyên — chọn / một BFF cho DonHang.App / API cho client tự chọn field (nói bằng lời); hệ quả: không thêm service, kiểm quyền vẫn ở API; xem lại khi có loại client thứ hai (vd app cho nhân viên) mà câu trả lời của API không hợp, hoặc một màn hình phải ghép API và Payments; BFF không giữ quy tắc nghiệp vụ. Thêm dòng 0018 vào README ADR. Caddyfile không đổi."
    suggested_path: "docs/adr/0018-app-goi-thang-api-chua-them-bff.md"
  - lesson: frontend.l4.app-api-contract
    need: "Mẫu JSON chỉ gồm field app đọc: `contracts/app/product.json` (`id`, `name`, `priceVnd`), `contracts/app/order.json` (`id`, `status`, `items[]` với `productId`, `quantity`, `unitPriceVnd`); `DonHang.App/test/api_contract_test.dart` đọc hai file (`../contracts/app/`) bằng `Product.fromJson`/`OrderResult.fromJson`; `DonHang.Tests/Integration/AppContractTests.cs` dùng `ApiFactory` gọi `GET /api/v1/products/{id}` và đặt rồi đọc một đơn, so mỗi field trong mẫu: có mặt và cùng kiểu JSON (số, chuỗi, mảng, object), field thừa được phép. Không đổi DTO, không đổi CI (job `test` và `app` đã chạy mọi test)."
    suggested_path: "contracts/app/"
  - lesson: frontend.l4.measuring-real-users
    need: "Tài liệu tiếng Việt (`### `, chỉ kế hoạch): đo ở phòng lab (profile mode, kích thước bundle) khác đo trên máy khách; chỉ số phía app: A1 tỉ lệ phiên không có lỗi không được bắt, A2 thời gian tới màn hình đầu tiên trên trình duyệt của khách (theo percentile), A3 đơn trong hàng đợi offline chưa tới được API sau một khoảng (giả định); mục tiêu ghi 'giả định'; cách thu dự kiến: `FlutterError.onError` + `PlatformDispatcher.instance.onError`, gửi theo phiên; khoảng trống: stage-4 chưa thu gì, chưa có endpoint, giới hạn `Program.cs` không đổi; trỏ `slo.md` bằng tên file. Không tên dịch vụ giám sát, không tên chỉ số Web Vitals."
    suggested_path: "docs/design/app-experience.md"
  - lesson: frontend.l3.web-bundle-size
    need: "(Mang từ GĐ3, DECISIONS 2026-10-20/21/22, không thuộc bài của module này) `scripts/up.sh` build `flutter build web --no-web-resources-cdn` để engine (CanvasKit) do `app-web` phục vụ và được nén; `web-bundle.sh` (hoặc script mới) in kích thước thô/gzip và số byte `app-web` thật sự gửi cho `main.dart.js` và file engine trình duyệt tải; capture không che số khi số ổn định giữa các lần chạy; kiểm trong network log còn request nào ra ngoài (font) thì ghi rõ trong comment script và STAGE.md. Sau đó sửa outline bài GĐ3 (`example_tag: stage-4`, `vocab` thêm gzip/zstd) rồi sinh lại theo `.review.json`."
    suggested_path: "scripts/up.sh"

open_questions:
  - "Số ADR: module này dùng 0017 (giữ một mã Flutter) và 0018 (chưa thêm BFF); ADR GĐ4 tiếp theo đánh từ 0019. Đề xuất: chấp nhận."
  - "'Migrate legacy' của chương trình: Đơn Hàng không có client cũ để thay. Module chỉ dạy thay một thư viện chạm mọi màn hình theo từng feature (mục 5 của library-reach). Đề xuất: strangler fig (thay hệ thống cũ theo từng đường dẫn sau proxy, viết lại hay thay dần) để management/governance-and-strategy (hiện đại hóa), term `strangler-fig` giới thiệu ở đó."
  - "Web Vitals (ba depth_notes GĐ3 hẹn về đây): versions.yaml không có khóa nguồn. Đề xuất: không thêm khóa; measuring-real-users dạy lab vs thiết bị thật và crash-free bằng lời, không nêu tên chỉ số. Chủ muốn tên chỉ số thì thêm `standards.web_vitals` và một mục outline. DevTools từng màn hình/memory profiling (profile-mode hẹn) không dạy: là hướng dẫn công cụ, không phải kiến trúc."
  - "Micro-frontend: chỉ một câu bằng lời trong feature-public-files (tách mỗi feature thành app riêng chỉ đáng khi có nhiều đội), không term, không bài. Đề xuất: chấp nhận; cần bài riêng thì thêm bài `main_path: false` sau."
  - "Lời hứa 'chọn Riverpod hay Bloc/hooks ở GĐ4' (depth_notes frontend.l2): giữ bằng tiêu chí trong library-reach, không nêu tên thư viện ngoài versions.yaml. Đề xuất: chấp nhận."
  - "Tách `ApiClient` thành phần truyền tải dùng chung (`shared/api_client.dart`) và lời gọi theo feature (`catalog_api.dart`, `orders_api.dart`) để `shared/` không import model của feature; test override `apiClientProvider` chuyển sang provider của feature. Bài GĐ1–3 trích stage-3 nên không bị ảnh hưởng. Đề xuất: chấp nhận; nếu `/repo-stage 4` giữ `ApiClient` nguyên khối thì quy tắc của feature_boundaries_test đổi → sửa outline feature-folders/feature-public-files/backend-for-frontend trước khi sinh bài."
  - "Thứ tự trong `/repo-stage 4`: nâng riverpod 3.0 → 3.4, go_router 16 → 18 (DECISIONS 2026-10-21) trước, rồi mới xếp lại thư mục, để bộ test chứng minh lần nâng. Đề xuất: chấp nhận."
  - "measuring-real-users chỉ có tài liệu kế hoạch, không code thu số đo: endpoint công khai nhận báo cáo từ app cần giới hạn tải mà `Program.cs` giữ nguyên ở stage-4. Đề xuất: chấp nhận; thu thật để devops/incidents hoặc sau V1."
  - "`fitness-functions.md` (viết sau cùng, module design/evolutionary-and-tradeoffs) nên thêm `feature_boundaries_test.dart` (tính module của app) và `AppContractTests` + `api_contract_test.dart` (tương thích app–API), và ghi A1–A3 của `app-experience.md` vào mục 'Chưa có phép kiểm tự động'. Đề xuất: có."
  - "Trang sản phẩm công khai cho máy tìm kiếm (HTML từ server): ADR 0017 để quyết riêng, stage-4 không xây. Đề xuất: sysdesign/problems 'Tìm kiếm sản phẩm' có thể dùng lại, không quyết lại 0017."
  - "Backlog `frontend.l3.web-bundle-size` đưa vào `repo_changes_needed` để `/repo-stage 4` làm cùng; outline bài GĐ3 đó sửa riêng (không trong draft này). `frontend.l3.offline-first` (chờ khóa `standards.html`): không bài nào ở đây dựa vào khẳng định về localStorage; `local_store.dart` chỉ dời sang `shared/`."
  - "Tên file/ADR/script là đề xuất — `/repo-stage 4` đổi tên thì sửa `example_files` trước khi sinh bài; capture `what-the-server-sends.sh` hoặc `package-reach.sh` khác outline thì DỪNG, sửa outline, không sửa code app."
