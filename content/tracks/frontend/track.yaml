levels:
- level: 1
  title:
    vi: "Level 1"
    en: "Level 1"
  modules:
  - id: web-foundations
    title:
      vi: "Nền web: HTML/CSS/JS, DOM, event loop, render"
      en: "Web foundations: HTML/CSS/JS, DOM, event loop, render"
    stage: 1
    summary:
      vi: "Giải thích được ba ngôn ngữ web làm gì, DOM khác HTML gốc thế nào, JS chạy tuần tự ra sao, và render là gì."
      en: "Explain what the three web languages each do, how the DOM differs from the original HTML, how JS runs sequentially, and what rendering is."
    lessons:
    - id: frontend.l1.html-css-js-roles
      title:
        vi: "Cấu trúc, hình thức, hành vi: HTML, CSS, JS"
        en: "Structure, look, behavior: HTML, CSS, JS"
      main_path: true
      duration_min: 12
      skills: [frontend.web.languages]
      prereqs: [foundation.l1.url-to-page, foundation.l1.http-request-response]
      related: []
      vocab: [html, css, javascript]
      example_tag: stage-0
      example_files: [www/index.html]
      outline:
      - "HTML structures a page's content (headings, paragraphs, links); `www/index.html`, served since the HTTP lessons, is plain HTML with no styling or behavior of its own."
      - "CSS describes how that structure looks — color, spacing, layout; the same HTML can look completely different depending on what CSS is attached to it, if any."
      - "JavaScript (JS) is the language a browser runs to change a page after it loads: a click, a fetch, updating what's on screen without asking the server for a whole new page."
      - "Nothing on a loaded page changes on its own; JS is the only one of the three that can change what's already there after the page has loaded."
      misconceptions:
      - "HTML alone can make a page interactive, the same way a button click can run code."
      - "CSS changes what content is there, not just how it looks."
      depth_notes: "Không nói framework JS (React, v.v.) — Đơn Hàng dùng Flutter, không phải web thuần (module flutter-foundations sau). Chỉ nền tảng chung của web."
    - id: frontend.l1.the-dom
      title:
        vi: "DOM: cây sống trong bộ nhớ, không phải HTML gốc"
        en: "The DOM: a live tree in memory, not the original HTML"
      main_path: true
      duration_min: 12
      skills: [frontend.web.dom]
      prereqs: [frontend.l1.html-css-js-roles]
      related: []
      vocab: [dom]
      example_tag: stage-0
      example_files: []
      outline:
      - "The DOM is the browser's live, in-memory tree of a page's elements, built from the HTML it downloaded; JS reads and changes the DOM, not the original HTML text."
      - "Changing the DOM — adding an element, changing some text — changes what's on screen immediately, without downloading a new page."
      - "The HTML source and the DOM can drift apart the moment JS runs: viewing a page's source shows the original HTML, not whatever the DOM looks like right now."
      misconceptions:
      - "The DOM and the page's HTML source are always the same thing, since the DOM is just built from the HTML."
      - "JS can only read the DOM, not change it — changing what's on screen needs a new page load."
      depth_notes: "Không nói Shadow DOM hay virtual DOM (React) — ngoài phạm vi GĐ1. Chỉ DOM trình duyệt thật."
    - id: frontend.l1.the-event-loop
      title:
        vi: "Event loop: một luồng, một việc một lúc"
        en: "The event loop: one thread, one thing at a time"
      main_path: true
      duration_min: 13
      skills: [frontend.web.event-loop]
      prereqs: [frontend.l1.the-dom, foundation.l1.threads-and-async-intro]
      related: []
      vocab: [event-loop]
      example_tag: stage-0
      example_files: []
      outline:
      - "JavaScript runs on a single thread: only one piece of JS code runs at a time, the same way one C# thread only runs one line at a time."
      - "The event loop decides which piece of queued JS runs next — a click handler, a finished network request, a timer — one at a time, never two at once."
      - "A long-running piece of JS blocks everything else waiting in the queue, including clicks and rendering updates, the same way a blocking call ties up a thread in any language."
      misconceptions:
      - "JavaScript can run two event handlers at the exact same time, since browsers are 'multi-threaded'."
      - "Fetching data with JS pauses the whole page until the data arrives, the way a synchronous call would."
      depth_notes: "Không nói microtask vs macrotask hay Web Worker — quá sâu cho GĐ1. Chỉ trực giác single-thread + hàng đợi, đối chiếu với async/await đã biết."
    - id: frontend.l1.render
      title:
        vi: "Render: DOM và CSS thành pixel"
        en: "Render: DOM and CSS become pixels"
      main_path: true
      duration_min: 12
      skills: [frontend.web.render]
      prereqs: [frontend.l1.the-event-loop]
      related: []
      vocab: [render]
      example_tag: stage-0
      example_files: []
      outline:
      - "Rendering is the browser turning the current DOM plus CSS into the pixels on screen; it happens again whenever a DOM change affects what's visible."
      - "Not every DOM change costs the same: changing text is cheaper than changing something that moves every other element around it."
      - "A page that changes the DOM task after task, many times a second, re-renders again and again — the same concern the next module's Flutter build/layout/paint pipeline shares."
      misconceptions:
      - "Rendering only happens once, when the page first loads."
      - "Changing CSS is free and never triggers any of the same rendering work a DOM change does."
      depth_notes: "Không nói layout thrashing hay đo hiệu năng thật — ngoài phạm vi GĐ1. Chỉ ý tưởng chung, nối sang Flutter build/layout/paint ở module sau."
  - id: flutter-foundations
    title:
      vi: "Flutter: widget tree, build/layout/paint, state cục bộ"
      en: "Flutter: widget tree, build/layout/paint, local state"
    stage: 1
    summary:
      vi: "Đọc và mở rộng được một màn hình Flutter thật của Đơn Hàng: widget tree, BuildContext, StatefulWidget/setState, và ghép widget nhỏ."
      en: "Read and extend a real Đơn Hàng Flutter screen: the widget tree, BuildContext, StatefulWidget/setState, and composing small widgets."
    lessons:
    - id: frontend.l1.the-widget-tree
      title:
        vi: "Mọi thứ đều là widget"
        en: "Everything is a widget"
      main_path: true
      duration_min: 13
      skills: [frontend.flutter.widget-tree]
      prereqs: [frontend.l1.the-dom]
      related: []
      vocab: [widget, widget-tree]
      example_tag: stage-1
      example_files: [DonHang.App/lib/screens/product_list_screen.dart, DonHang.App/lib/main.dart]
      outline:
      - "Everything visible in a Flutter app is a widget — text, spacing, a button, even the screen itself; a widget tree is the nested structure of widgets describing what the UI should look like."
      - "Unlike the DOM, which JS mutates in place, a Flutter widget tree is rebuilt: a change describes a new tree of what the UI should be now, not an instruction to mutate the old one."
      - "`ProductListScreen`'s tree nests a `Scaffold` around a `FutureBuilder` around a `ListView` of one `ListTile` per product — each level describing containment, the same way nested HTML elements did."
      misconceptions:
      - "A widget is a screen; a whole app has one widget per screen."
      - "Building a new widget tree on every change means Flutter redraws every pixel from scratch every time."
      depth_notes: "Không nói Element hay RenderObject — quá sâu cho GĐ1, chỉ Widget. Không nói build/layout/paint cụ thể — bài sau."
    - id: frontend.l1.build-layout-paint
      title:
        vi: "Build, layout, paint: từ widget đến pixel"
        en: "Build, layout, paint: from widget to pixel"
      main_path: true
      duration_min: 13
      skills: [frontend.flutter.render-pipeline]
      prereqs: [frontend.l1.the-widget-tree, frontend.l1.render]
      related: []
      vocab: [build-layout-paint]
      example_tag: stage-1
      example_files: [DonHang.App/lib/screens/product_list_screen.dart]
      outline:
      - "Flutter turns a widget tree into pixels in three phases: build (widgets describe what should exist), layout (each is given a size and position), and paint (pixels are drawn)."
      - "Build runs top-down: a parent's `build` method can create child widgets, but a child doesn't know its own size or position yet at that point."
      - "Layout runs after build, working out sizes from constraints the parent passes down and the size each child reports back up; only then does paint have enough information to draw anything."
      misconceptions:
      - "Layout and paint are the same step, since layout only matters visually anyway."
      - "A widget decides its own size and position independently, without anything from its parent."
      depth_notes: "Không nói thuật toán constraint đi xuống/size đi lên chi tiết — chỉ trực giác ba giai đoạn. Nối với bài render (module web-foundations) đã hứa từ trước."
    - id: frontend.l1.buildcontext
      title:
        vi: "BuildContext: vị trí của widget trong cây"
        en: "BuildContext: where a widget sits in the tree"
      main_path: true
      duration_min: 13
      skills: [frontend.flutter.buildcontext]
      prereqs: [frontend.l1.build-layout-paint]
      related: []
      vocab: [buildcontext]
      example_tag: stage-1
      example_files: [DonHang.App/lib/screens/product_list_screen.dart, DonHang.App/lib/screens/login_screen.dart]
      outline:
      - "`BuildContext` is a handle to exactly where a widget sits in the tree; every `build` method receives one for the widget it's building."
      - "Code inside `build` uses its `context` to look upward in the tree — `Navigator.of(context)` finds the navigator that opens another screen — without that widget needing a reference passed in some other way."
      - "A `BuildContext` is only meaningful while its widget is in the tree; `LoginScreen` checks `mounted` after an `await` before using `context`, because the screen may have been removed meanwhile."
      misconceptions:
      - "BuildContext is just a container for any global app state a widget might need."
      - "The same BuildContext works for looking things up no matter which widget's build method it came from."
      depth_notes: "Không nói InheritedWidget cơ chế bên trong hay context.mounted chi tiết — quá sâu cho GĐ1. Chỉ trực giác: context = vị trí trong cây."
    - id: frontend.l1.stateless-vs-stateful
      title:
        vi: "StatelessWidget hay StatefulWidget"
        en: "StatelessWidget or StatefulWidget"
      main_path: true
      duration_min: 14
      skills: [frontend.flutter.state]
      prereqs: [frontend.l1.buildcontext]
      related: []
      vocab: [stateless-widget, stateful-widget]
      example_tag: stage-1
      example_files: [DonHang.App/lib/main.dart, DonHang.App/lib/screens/product_list_screen.dart]
      outline:
      - "A `StatelessWidget` describes the UI from only the values passed into it; given the same inputs, it always builds the same tree."
      - "A `StatefulWidget` holds a separate `State` object that can change over time — the product list currently being loaded — without new values being passed in from outside."
      - "`DonHangApp` stays stateless, since it only builds from what it is given; `ProductListScreen` is stateful because it keeps the `_products` future across rebuilds and replaces it when the user reloads."
      misconceptions:
      - "StatefulWidget is just a StatelessWidget with more code; use it whenever unsure."
      - "A StatelessWidget can never change what it shows on screen."
      depth_notes: "Không nói lifecycle method (initState, dispose) chi tiết — ngoài phạm vi GĐ1. Chỉ phân biệt khi nào cần State."
    - id: frontend.l1.setstate-and-rebuilding
      title:
        vi: "setState: không gọi thì màn hình không đổi"
        en: "setState: nothing changes on screen until you call it"
      main_path: true
      duration_min: 13
      skills: [frontend.flutter.state]
      prereqs: [frontend.l1.stateless-vs-stateful]
      related: []
      vocab: [setstate]
      example_tag: stage-1
      example_files: [DonHang.App/lib/screens/product_list_screen.dart, DonHang.App/lib/screens/login_screen.dart]
      outline:
      - "Calling `setState` inside a `State` object tells Flutter the state changed and schedules that widget's subtree to rebuild; nothing on screen updates until `setState` is called, even if a variable already changed."
      - "Only the widget that called `setState`, and its descendants, rebuild — a sibling outside that subtree doesn't rebuild just because something else on screen changed."
      - "Tapping the refresh button calls `_reload`, whose `setState` replaces `_products`; the screen rebuilds and shows the spinner, then the list — the same 'a new tree describing the current state' idea, now triggered by an event."
      misconceptions:
      - "Changing a variable inside a State object updates the screen immediately, without needing setState."
      - "setState rebuilds the entire app, not just the widget whose state changed."
      depth_notes: "Không nói Riverpod/Bloc hay state toàn cục — module state-and-routing GĐ2. Chỉ state cục bộ, setState."
    - id: frontend.l1.composing-widgets
      title:
        vi: "Tách ProductTile: SRP áp vào Flutter"
        en: "Extracting ProductTile: SRP applied to Flutter"
      main_path: true
      duration_min: 13
      skills: [frontend.flutter.composition]
      prereqs: [frontend.l1.setstate-and-rebuilding, design.l1.solid-srp]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.App/lib/main.dart, DonHang.App/lib/screens/product_list_screen.dart]
      outline:
      - "`DonHangApp` composes the app from small widgets, one per screen (`ProductListScreen`, `LoginScreen`, `CreateOrderScreen`) — the same move SRP asked for in a class: one widget, one reason to change."
      - "A widget's constructor parameters are its whole contract with whoever uses it — `ProductListScreen` needs only an `ApiClient`; a `ProductTile` extracted from its inline `ListTile` would need only a product."
      - "Composing small widgets instead of one large `build` method keeps each piece's tree, and its own state if it has any, easy to reason about on its own."
      misconceptions:
      - "Extracting a widget into its own class is just about file organization, not about reuse or responsibility."
      - "A widget needs access to the whole screen's state to do its job, even if it only displays one row."
      depth_notes: "Không nói feature-based folder structure hay design pattern cụ thể — kiến trúc thư mục GĐ2+. Chỉ áp SOLID đã học vào Flutter."
  - id: calling-apis
    title:
      vi: "Gọi API: loading/error/empty, đăng nhập, responsive, accessibility"
      en: "Calling APIs: loading/error/empty, login, responsive, accessibility"
    stage: 1
    summary:
      vi: "Nối màn hình sản phẩm với API thật, xử lý ba trạng thái tải dữ liệu, đăng nhập và tạo đơn thật, và làm layout responsive/accessible cơ bản."
      en: "Connect the product screen to the real API, handle the three data-loading states, log in and place a real order, and make the layout basically responsive and accessible."
    lessons:
    - id: frontend.l1.fetching-with-http-package
      title:
        vi: "http.get và jsonDecode: lấy sản phẩm thật"
        en: "http.get and jsonDecode: fetching real products"
      main_path: true
      duration_min: 13
      skills: [frontend.api.fetching]
      prereqs: [frontend.l1.composing-widgets, backend.l1.get-and-status-codes]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.App/lib/api_client.dart, DonHang.App/lib/models.dart]
      outline:
      - "The `http` package's `http.get(uri)` sends a GET request and returns a `Future<http.Response>`; the response's `body` is the same JSON `GET /api/v1/products` already defined."
      - "`jsonDecode` turns that JSON text into Dart `Map`/`List` values; mapping those into a typed `Product` is the same idea as the API's own DTO mapping, now on the client."
      - "A network call takes real time and can fail; `await`-ing it inside an `async` function is how Dart waits without blocking the UI thread — the same event-loop idea from web-foundations, now in Dart."
      misconceptions:
      - "http.get returns the data immediately, since Dart doesn't need async for something this simple."
      - "The JSON returned by the API always matches the Dart class exactly, with no chance of a missing or differently-named field."
      depth_notes: "Không nói package dio hay interceptor — ngoài phạm vi GĐ1. Chỉ package http đơn giản. Không nói loading/error/empty — bài sau."
    - id: frontend.l1.futurebuilder-loading-error-empty
      title:
        vi: "FutureBuilder: đang tải, lỗi, hay rỗng"
        en: "FutureBuilder: loading, error, or empty"
      main_path: true
      duration_min: 14
      skills: [frontend.api.async-states]
      prereqs: [frontend.l1.fetching-with-http-package, frontend.l1.setstate-and-rebuilding]
      related: []
      vocab: [loading-error-empty]
      example_tag: stage-1
      example_files: [DonHang.App/lib/screens/product_list_screen.dart]
      outline:
      - "A screen that fetches data has at least three states to show: loading (not finished yet), error (it failed), and empty (it finished, successfully, with zero results) — each needs its own UI."
      - "`FutureBuilder` rebuilds around a `Future`'s progress: waiting is loading, `snapshot.hasError` is error, `snapshot.hasData` with an empty list is empty, and data with items is the real content."
      - "Treating 'still loading' and 'genuinely empty' as the same blank screen hides a real difference: one resolves on its own, the other is the true answer."
      misconceptions:
      - "An empty product list and a still-loading one can show the same blank screen; the user can't tell the difference anyway."
      - "Error handling only matters for the request itself; once data arrives, nothing else can go wrong."
      depth_notes: "Không nói retry hay pull-to-refresh — ngoài phạm vi GĐ1. Chỉ ba trạng thái cơ bản qua FutureBuilder."
    - id: frontend.l1.logging-in-from-the-app
      title:
        vi: "Đăng nhập: POST rồi giữ JWT"
        en: "Logging in: POST, then hold onto the JWT"
      main_path: true
      duration_min: 14
      skills: [frontend.api.auth-flow]
      prereqs: [frontend.l1.futurebuilder-loading-error-empty, backend.l1.issuing-a-jwt]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.App/lib/api_client.dart, DonHang.App/lib/screens/login_screen.dart]
      outline:
      - "A login screen collects an email and password, `POST`s them to `/api/v1/auth/login`, and on success holds onto the returned JWT for the rest of the session."
      - "The token is attached as an `Authorization: Bearer <token>` header on every later request that needs to know who's asking — the same header the validating-a-jwt lesson's middleware reads."
      - "A failed login answers `401`; `ApiClient.login` turns any status other than `200` into an exception, and `LoginScreen` shows its text in red instead of pretending the request succeeded."
      misconceptions:
      - "Once logged in, the app doesn't need to send anything special on later requests; the server remembers who's asking."
      - "Storing the token anywhere in the app is equally safe, since it's just a string."
      depth_notes: "Không nói secure storage (flutter_secure_storage) hay refresh token — đơn giản hóa có chủ đích cho GĐ1: token giữ trong bộ nhớ phiên làm việc. Không nói OAuth2 — GĐ2."
    - id: frontend.l1.creating-an-order
      title:
        vi: "Tạo đơn thật: customer_id đến từ token, không phải form"
        en: "Placing a real order: customer_id comes from the token, not the form"
      main_path: true
      duration_min: 14
      skills: [frontend.api.auth-flow]
      prereqs: [frontend.l1.logging-in-from-the-app, backend.l1.creating-a-resource]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.App/lib/api_client.dart, DonHang.App/lib/screens/create_order_screen.dart]
      outline:
      - "Placing an order `POST`s to `/api/v1/orders` with the same `Authorization` header the login lesson attached, so the API knows which customer is ordering without the app sending a `customer_id` at all."
      - "A `201` shows the new order's id and status; any other status becomes an exception carrying only the status code, so the screen shows 'Failed: …' with the code, not the Problem Details text the API sent."
      - "The order-placing button disables itself while the request is in flight — the same loading state from the earlier lesson — so a second tap can't send the same order twice."
      misconceptions:
      - "The app should still send a customer_id in the request body; the server can double-check it matches the token."
      - "Showing a generic 'something went wrong' message is good enough for every kind of failure a POST can have."
      depth_notes: "Không nói idempotency key hay optimistic UI — ngoài phạm vi GĐ1. Chỉ luồng tạo đơn thật, cơ bản."
    - id: frontend.l1.responsive-basics
      title:
        vi: "LayoutBuilder: layout theo không gian thật có"
        en: "LayoutBuilder: layout for the space you actually have"
      main_path: true
      duration_min: 12
      skills: [frontend.ui.responsive]
      prereqs: [frontend.l1.creating-an-order]
      related: []
      vocab: [responsive]
      example_tag: stage-1
      example_files:
      - DonHang.App/lib/widgets/product_catalog.dart
      - DonHang.App/lib/widgets/product_tile.dart
      - DonHang.App/test/product_catalog_test.dart
      outline:
      - "A responsive layout adapts to the space it's given instead of assuming one fixed screen size; `LayoutBuilder` reports the constraints a widget has to work with, so it can build a different tree for a narrow versus a wide screen."
      - "`ProductCatalog` shows one column on a narrow width and a multi-column grid on a wide one, using the same `ProductTile` either way — responsiveness changes the arrangement, not the pieces."
      - "Hardcoding a pixel width to decide a layout breaks the moment the app runs somewhere with a different one; checking the constraints Flutter already provides doesn't."
      misconceptions:
      - "Responsive design is only relevant for a web browser, not a Flutter app running on a phone or tablet."
      - "Using a fixed pixel width for every widget makes a layout more predictable, and predictable is what responsive means."
      depth_notes: "Không nói breakpoint chi tiết theo thiết bị hay orientation thay đổi động — ngoài phạm vi GĐ1. Chỉ LayoutBuilder cơ bản."
    - id: frontend.l1.accessibility-basics
      title:
        vi: "Semantics và kích thước chạm: ai cũng dùng được"
        en: "Semantics and tap size: usable by everyone"
      main_path: true
      duration_min: 12
      skills: [frontend.ui.accessibility]
      prereqs: [frontend.l1.responsive-basics]
      related: []
      vocab: [accessibility]
      example_tag: stage-1
      example_files: [DonHang.App/lib/widgets/product_tile.dart, DonHang.App/test/product_catalog_test.dart]
      outline:
      - "Accessibility is making an app usable by people using a screen reader, larger text, or limited motor control — not a feature bolted on afterward."
      - "`ProductTile` shows a name and a price as two separate texts; its `Semantics` label joins them into one sentence, which is what lets a screen reader announce something meaningful instead of loose fragments."
      - "A tap target smaller than roughly 48 logical pixels is hard to hit accurately for anyone with limited precision, whether from a device, a disability, or just a moving bus."
      misconceptions:
      - "Accessibility only matters for apps built for users who are blind."
      - "As long as the app looks right, it's accessible; screen readers can figure out anything visible."
      depth_notes: "Không nói kiểm thử accessibility tự động hay WCAG chi tiết — ngoài phạm vi GĐ1. Chỉ Semantics và kích thước chạm cơ bản."
- level: 2
  title:
    vi: "Level 2"
    en: "Level 2"
  modules:
  - id: state-and-routing
    title:
      vi: "Quản lý state và routing: Riverpod, go_router"
      en: "State management and routing: Riverpod, go_router"
    stage: 2
    summary:
      vi: "Tách app state khỏi state của từng màn hình, giữ nó trong provider của Riverpod, test màn hình không cần server, và cho mỗi màn hình của DonHang.App một URL mở thẳng được, có chặn khi chưa đăng nhập."
      en: "Separate app state from a single screen's state, keep it in Riverpod providers, test screens without a server, and give every DonHang.App screen a URL that opens it directly, guarded when nobody is signed in."
    lessons:
    - id: frontend.l2.ephemeral-vs-app-state
      title:
        vi: "State của một màn hình hay của cả app?"
        en: "Whose state is it: one screen's or the whole app's?"
      main_path: true
      duration_min: 12
      skills: [frontend.state.app-state]
      prereqs: [frontend.l1.creating-an-order, frontend.l1.setstate-and-rebuilding]
      related: []
      vocab: [ephemeral-state, app-state]
      example_tag: stage-1
      example_files:
      - DonHang.App/lib/main.dart
      - DonHang.App/lib/api_client.dart
      - DonHang.App/lib/screens/product_list_screen.dart
      - DonHang.App/lib/screens/login_screen.dart
      outline:
      - "Ephemeral state belongs to one widget and nothing else reads it, such as `LoginScreen`'s `_loading` and `_error`; `setState` in that widget's `State` is enough for it."
      - "App state is read by several screens or must outlive the screen that changed it; whether the customer is signed in is app state, because the product list, sign-in and order screens all depend on it."
      - "At stage-1 the token lives in the one `ApiClient` that `DonHangApp` creates, and each screen receives that object through its constructor from the widget that opened it."
      - "After sign-in, `ProductListScreen` still offers the same sign-in button: it never reads the token, and changing a field inside `ApiClient` does not rebuild any widget."
      misconceptions:
      - "Every piece of state should be app state, so any widget can reach it."
      - "A global variable is enough for shared state, since every screen can read it."
      depth_notes: "Không dạy Riverpod — bài riverpod-providers. Không nói InheritedWidget hay cơ chế bên trong thư viện state. Không so sánh Riverpod với Bloc/hooks — chọn stack là frontend/stack-and-boundaries GĐ4."
    - id: frontend.l2.riverpod-providers
      title:
        vi: "Riverpod: app state nằm trong provider, ngoài cây widget"
        en: "Riverpod keeps app state in providers outside the widget tree"
      main_path: true
      duration_min: 14
      skills: [frontend.state.riverpod]
      prereqs: [frontend.l2.ephemeral-vs-app-state, design.l1.the-di-container]
      related: []
      vocab: [riverpod]
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/main.dart
      - DonHang.App/lib/providers.dart
      - DonHang.App/lib/screens/product_list_screen.dart
      outline:
      - "Riverpod keeps app state in providers: each provider is declared once as a top-level `final` and describes how to create one value, such as `apiClientProvider` creating the app's `ApiClient`."
      - "`ProviderScope`, wrapped around `DonHangApp` in `main.dart`, stores the value of every provider; the top-level declaration only describes the value and does not hold it."
      - "A provider is lazy: its function runs the first time something reads it, and later reads get that same value instead of a new object."
      - "A `ConsumerWidget`'s `build` receives a `WidgetRef` to watch providers, and a provider gets the `ApiClient` with `ref.watch(apiClientProvider)`, so `ProductListScreen` no longer takes it as a constructor parameter."
      - "Asking a provider for a dependency plays the role the DI container plays in `DonHang.Api`: a widget names what it needs instead of every parent passing it down."
      misconceptions:
      - "A provider declared as a top-level variable is just a global variable with a new name."
      - "Every provider is created when the app starts."
      - "Without ProviderScope, providers simply start out empty."
      depth_notes: "Không nói FutureProvider/AsyncValue — bài sau; không nói Notifier hay ref.read — bài notifier-for-app-state. Không dùng code generation (riverpod_generator), autoDispose hay family. Không so sánh với Bloc — GĐ4."
    - id: frontend.l2.futureprovider-and-asyncvalue
      title:
        vi: "FutureProvider: ba trạng thái tải dữ liệu, không cần FutureBuilder"
        en: "FutureProvider: the three loading states without FutureBuilder"
      main_path: true
      duration_min: 14
      skills: [frontend.state.riverpod]
      prereqs: [frontend.l2.riverpod-providers, frontend.l1.futurebuilder-loading-error-empty]
      related: []
      vocab: [asyncvalue]
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/providers.dart
      - DonHang.App/lib/screens/product_list_screen.dart
      - DonHang.App/lib/widgets/product_catalog.dart
      outline:
      - "`productsProvider` is a `FutureProvider` that calls `ApiClient.fetchProducts`; watching it gives an `AsyncValue`, which is either loading, error or data."
      - "`AsyncValue.when` takes one builder per case, so `ProductListScreen` shows the spinner, the error text, the empty message or the `ProductCatalog` without a `State` class holding a `Future`."
      - "The provider stores the loaded list: two widgets watching `productsProvider` share one request and one list, and the screen no longer starts its own fetch in `initState`."
      - "The refresh button calls `ref.invalidate(productsProvider)`, which throws away the stored list so the provider fetches it again, instead of the screen replacing a `Future` inside `setState`."
      misconceptions:
      - "Once a provider has loaded the product list, the screen can never show newer products."
      - "Moving the fetch into a provider removes the need to handle the error and empty cases."
      depth_notes: "Không nói skipLoadingOnRefresh, isRefreshing hay việc Riverpod tự thử lại khi lỗi; không nói autoDispose. family chỉ gặp ở bài deep-links. Không nói Notifier — bài sau. Không cache theo thời gian phía app."
    - id: frontend.l2.notifier-for-app-state
      title:
        vi: "Đã đăng nhập hay chưa: một Notifier mọi màn hình cùng theo dõi"
        en: "Signed in or not: one Notifier every screen can watch"
      main_path: true
      duration_min: 14
      skills: [frontend.state.riverpod]
      prereqs:
      - frontend.l2.futureprovider-and-asyncvalue
      - frontend.l1.logging-in-from-the-app
      - backend.l2.oauth2-roles
      related: []
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/auth/auth_controller.dart
      - DonHang.App/lib/screens/product_list_screen.dart
      - DonHang.App/lib/api_client.dart
      outline:
      - "`authProvider` is a `NotifierProvider` whose `AuthController` holds the access token, or `null` when nobody is signed in; `ApiClient` reads the token from it instead of keeping its own field."
      - "Only the notifier's own methods change its value, by assigning `state`; every widget watching `authProvider` then rebuilds with the new value."
      - "`ProductListScreen` watches `authProvider`, so its app bar switches between a sign-in and a sign-out button as soon as the token changes, closing the gap left at stage-1."
      - "`ref.watch` belongs in `build`, where a change should rebuild the widget; a button's `onPressed` uses `ref.read(authProvider.notifier)` to call a method once without subscribing to changes."
      misconceptions:
      - "ref.read and ref.watch do the same thing; read is just the shorter name."
      - "Using ref.watch inside onPressed is safer, because it always gets the newest value."
      - "The signed-in token is the login screen's own state, so it belongs in that screen's State."
      depth_notes: "Không dạy code đổi authorization code lấy token hay refresh token phía app — chỉ kết quả: token vào authProvider. Không nói lưu token bền vững — bảo mật frontend GĐ3. Không nói AsyncNotifier hay StateProvider."
    - id: frontend.l2.overriding-providers-in-tests
      title:
        vi: "Widget test không cần server: thay giá trị của provider"
        en: "Widget tests without a server: overriding a provider"
      main_path: true
      duration_min: 15
      skills: [frontend.testing.widget]
      prereqs: [frontend.l2.futureprovider-and-asyncvalue, design.l1.test-doubles]
      related: [design.l2.test-pyramid]
      vocab: [widget-test]
      example_tag: stage-2
      example_files:
      - DonHang.App/test/product_list_screen_test.dart
      - DonHang.App/lib/providers.dart
      - DonHang.App/lib/screens/product_list_screen.dart
      outline:
      - "A widget test builds a widget in a test environment with no real screen, using `testWidgets` and `tester.pumpWidget`, then checks what the tree shows with `find` and `expect`."
      - "`ProductListScreen` gets its data from `productsProvider`, so the test wraps it in a `ProviderScope` whose `overrides` replace that provider with a fixed result, and no HTTP request is sent."
      - "The same screen is tested in each state by overriding the provider with two products, an empty list or an error, then looking for the product names, the empty message or the error text."
      - "An override applies only inside the `ProviderScope` that declares it, so each test gets its own values and `main.dart` stays unchanged."
      misconceptions:
      - "Testing a screen that shows API data needs the API running."
      - "A widget test opens the app in a browser or emulator and taps through it."
      - "Overriding a provider in one test changes it for the tests that run after it."
      depth_notes: "Không nói golden test, package integration_test hay test qua trình duyệt; không test go_router hay AuthController. Không nhắc lại test double/fake — design.l1.test-doubles; mức test — design.l2.test-pyramid."
    - id: frontend.l2.routes-with-go-router
      title:
        vi: "go_router: mỗi màn hình có một URL riêng"
        en: "go_router: every screen gets its own URL"
      main_path: true
      duration_min: 13
      skills: [frontend.routing.declarative]
      prereqs: [frontend.l2.riverpod-providers, frontend.l1.buildcontext]
      related: []
      vocab: [go-router]
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/router.dart
      - DonHang.App/lib/main.dart
      - DonHang.App/lib/screens/product_list_screen.dart
      outline:
      - "At stage-1, screens open with `Navigator.of(context).push` and a `MaterialPageRoute`; a screen opened that way has no path of its own, so no link can open it directly."
      - "go_router declares the app's screens up front as a list of `GoRoute`s, each pairing a path such as `/` or `orders/new` (a child of `/`, so its location is `/orders/new`) with a builder for the screen."
      - "`MaterialApp.router`, given the router from `routerProvider` as `routerConfig`, hands navigation to that router, and `context.go('/orders/new')` asks for a location by its path instead of constructing the next screen."
      - "On the web, go_router keeps the browser's address bar in step with the current location, so the URL always names the screen being shown."
      misconceptions:
      - "Navigator.push and context.go are two spellings of the same thing."
      - "Declaring every route up front means every screen is built when the app starts."
      depth_notes: "Không nói path parameter hay deep link — bài deep-links; không nói redirect — bài route-guards. Không nói ShellRoute, StatefulShellRoute, typed routes hay khác biệt chi tiết giữa context.push và context.go."
    - id: frontend.l2.deep-links
      title:
        vi: "Deep link: màn hình mở ra chỉ từ URL của nó"
        en: "Deep links: a screen opened from nothing but its URL"
      main_path: true
      duration_min: 15
      skills: [frontend.routing.deep-links]
      prereqs:
      - frontend.l2.routes-with-go-router
      - frontend.l2.futureprovider-and-asyncvalue
      - backend.l2.authorization-code-flow
      related: []
      vocab: [deep-link, path-parameter]
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/router.dart
      - DonHang.App/lib/screens/product_detail_screen.dart
      - DonHang.App/lib/providers.dart
      - DonHang.App/lib/main.dart
      outline:
      - "A deep link is a URL that opens one specific screen of an app, such as `/products/3`, even when the app was not running or was showing another screen."
      - "`products/:id` declares `id` as a path parameter; the route reads it from `state.pathParameters['id']` as a string and turns it into a number for the screen."
      - "`ProductDetailScreen` receives only the id and loads the product itself through `productProvider(id)`, a provider family with one value per id, because a deep link has no earlier screen to hand it a `Product`."
      - "Because `products/:id` is declared as a child of `/`, opening `/products/3` directly also builds the product list beneath it, so the back arrow leads to the list."
      - "Keycloak's redirect to `/auth/callback?code=…` is a deep link too: the browser loads the app fresh at that URL, and the route reads `code` from the query parameters."
      - "Flutter web puts the route after a `#` by default; `main.dart` calls `usePathUrlStrategy()` so routes are plain paths, which needs the `app-web` server to answer every path with `index.html`."
      misconceptions:
      - "The detail screen can take the Product object from the list screen, since users always arrive from the list."
      - "Deep links only matter for mobile apps opened from another app, not for an app in the browser."
      - "Path parameters arrive already typed, so id is an int."
      depth_notes: "Không nói App Links/Universal Links (DonHang.App chỉ chạy web). Không dạy code đổi code lấy token trong route callback — chỉ việc route đọc query parameter. Không nói chặn khi chưa đăng nhập — bài route-guards."
    - id: frontend.l2.route-guards
      title:
        vi: "Route guard: chưa đăng nhập thì đi đăng nhập trước"
        en: "Route guards: send signed-out customers to sign in first"
      main_path: true
      duration_min: 13
      skills: [frontend.routing.deep-links]
      prereqs:
      - frontend.l2.deep-links
      - frontend.l2.notifier-for-app-state
      - backend.l2.resource-based-authorization
      related: [backend.l2.role-based-access]
      vocab: [route-guard]
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/router.dart
      - DonHang.App/lib/auth/auth_controller.dart
      - DonHang.App/lib/screens/order_detail_screen.dart
      outline:
      - "A route guard checks a condition before a route is shown and sends the user somewhere else if it fails; in go_router it is the `redirect` callback."
      - "Đơn Hàng's top-level `redirect` returns `/login` when `authProvider` holds no token and the location starts with `/orders`, and returns `null` otherwise, which keeps the requested location."
      - "`redirect` runs on every navigation, including a deep link typed into the address bar, so opening `/orders/15` while signed out lands on the sign-in screen instead of a screen that would get `401`."
      - "The router's `refreshListenable` is tied to `authProvider`, so `redirect` runs again when the sign-in state changes and signing out on an order screen moves the user off it."
      - "The guard only spares the customer a screen that would fail; `DonHang.Api` still answers `401` without a token and `403` for another customer's order, because anyone can call the API without the app."
      misconceptions:
      - "With a route guard in the app, the API no longer needs to check who is calling."
      - "A route guard only runs when the user taps a button, so typing a URL skips it."
      depth_notes: "Không nói quay lại đúng trang đã yêu cầu sau khi đăng nhập hay guard theo role staff — ngoài GĐ2. Không nói redirect riêng của từng GoRoute. Không nhắc lại 401/403 — các bài backend."
  - id: forms-i18n-theming
    title:
      vi: "Theme, đa ngôn ngữ và form"
      en: "Theming, i18n and forms"
    stage: 2
    summary:
      vi: "Đổi màu cả app từ một chỗ và có dark mode, hiện DonHang.App bằng tiếng Việt hoặc tiếng Anh, và đặt đơn qua một form thật có kiểm tra dữ liệu và hiện lỗi 400 từ API."
      en: "Change the whole app's colors from one place with a dark mode, show DonHang.App in Vietnamese or English, and place orders through a real form that validates input and shows the API's 400 errors."
    lessons:
    - id: frontend.l2.theme-and-color-scheme
      title:
        vi: "Một hạt màu, cả bảng màu: ThemeData và ColorScheme"
        en: "One seed color, a whole palette: ThemeData and ColorScheme"
      main_path: true
      duration_min: 12
      skills: [frontend.ui.theming]
      prereqs: [frontend.l1.buildcontext, frontend.l1.composing-widgets]
      related: []
      vocab: [color-scheme, design-token]
      example_tag: stage-1
      example_files: [DonHang.App/lib/main.dart, DonHang.App/lib/screens/login_screen.dart]
      outline:
      - "`ThemeData` holds the app-wide look, such as colors and text styles; `DonHangApp` sets it once through `MaterialApp`'s `theme` in `main.dart`, and every widget below can read it."
      - "`colorSchemeSeed: Colors.indigo` does not paint everything indigo: Flutter generates a whole color scheme from that one seed, a set of named roles such as `primary`, `onPrimary`, `surface` and `error`."
      - "Material widgets such as `AppBar` and `ElevatedButton` take their default colors from those roles, so no screen in `DonHang.App` names a color for them."
      - "Naming a role instead of a raw value is the idea of a design token: `Theme.of(context).colorScheme.error` follows the theme, while `LoginScreen`'s `Colors.red` stays fixed whatever the theme says."
      misconceptions:
      - "colorSchemeSeed sets the one color every widget is painted with."
      - "Writing Colors.red is the same as using the theme's error color, since both look red."
      depth_notes: "Không nói darkTheme/ThemeMode — bài dark-mode. Không nói TextTheme chi tiết, ThemeExtension, theme riêng từng loại widget hay font riêng. Design system đầy đủ → frontend/design-system GĐ3."
    - id: frontend.l2.dark-mode
      title:
        vi: "Dark mode: theme thứ hai sinh từ cùng một hạt màu"
        en: "Dark mode: a second theme generated from the same seed"
      main_path: true
      duration_min: 12
      skills: [frontend.ui.theming]
      prereqs: [frontend.l2.theme-and-color-scheme, frontend.l2.routes-with-go-router]
      related: []
      vocab: [dark-mode]
      example_tag: stage-2
      example_files: [DonHang.App/lib/main.dart]
      outline:
      - "`MaterialApp` takes a `darkTheme` next to `theme`; at stage-2 `main.dart` builds both from the same indigo seed, the dark one with `brightness: Brightness.dark`, so the dark colors are generated, not picked by hand."
      - "`themeMode` chooses between the two; `DonHang.App` leaves the default `ThemeMode.system`, which follows the light or dark setting of the device or browser."
      - "Dark mode keeps the same roles with different values: `surface` becomes dark and `onSurface` light, so code that names a role needs no change."
      - "A widget that takes its colors from `Theme.of(context).colorScheme` changes with the mode; a hardcoded color such as stage-1's `Colors.red` stays the same on both backgrounds."
      misconceptions:
      - "Dark mode means inverting every color of the light theme."
      - "Without a switch inside the app, the app always stays light."
      - "Every color in the app has to be written twice, once for each mode."
      depth_notes: "Không làm nút chuyển sáng/tối trong app hay lưu lựa chọn — DonHang.App theo cài đặt hệ thống. Không nói độ tương phản đo bằng số hay kiểm tra accessibility của màu — ngoài GĐ2."
    - id: frontend.l2.localizing-with-arb
      title:
        vi: "Chữ trên màn hình không nằm trong widget: ARB và gen-l10n"
        en: "Text lives outside the widgets: ARB files and gen-l10n"
      main_path: true
      duration_min: 14
      skills: [frontend.i18n.localization]
      prereqs: [frontend.l1.buildcontext, frontend.l2.routes-with-go-router]
      related: []
      vocab: [i18n, locale, arb-file]
      example_tag: stage-2
      example_files:
      - DonHang.App/l10n.yaml
      - DonHang.App/lib/l10n/app_en.arb
      - DonHang.App/lib/l10n/app_vi.arb
      - DonHang.App/lib/main.dart
      outline:
      - "Internationalization (i18n) means user-visible text is not written into widgets: each message has a key, and the text for the current language is looked up by that key when the widget builds."
      - "At stage-2 `DonHang.App` keeps one ARB file per language, `app_en.arb` and `app_vi.arb`: JSON objects mapping the same keys to English and Vietnamese text, with `app_en.arb` as the template."
      - "Flutter's `gen-l10n` tool, configured by `l10n.yaml`, turns the ARB files into an `AppLocalizations` class with one getter per key, so a mistyped key fails to compile instead of showing blank text."
      - "`MaterialApp` receives `AppLocalizations.localizationsDelegates` and `supportedLocales`; a widget reads its text with `AppLocalizations.of(context)`, looking up the tree like `Navigator.of(context)`."
      - "The app uses the supported locale that matches the browser's preferred languages, and falls back to the first entry of `supportedLocales` when none matches."
      misconceptions:
      - "Translating an app means keeping a second copy of every screen in the other language."
      - "The app shows the language of the developer's machine, since that is where it was built."
      depth_notes: "Không nói placeholder, định dạng số — bài messages-with-values. Không nói plural/select, đổi ngôn ngữ trong app, viết phải-sang-trái, dịch dữ liệu từ API (tên sản phẩm, detail của lỗi), khai báo pubspec chi tiết hay nơi đặt file sinh ra."
    - id: frontend.l2.messages-with-values
      title:
        vi: "Câu có giá trị bên trong: placeholder và định dạng số"
        en: "Messages with values inside: placeholders and number formats"
      main_path: true
      duration_min: 13
      skills: [frontend.i18n.localization]
      prereqs: [frontend.l2.localizing-with-arb]
      related: [frontend.l1.accessibility-basics]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/l10n/app_en.arb
      - DonHang.App/lib/l10n/app_vi.arb
      - DonHang.App/lib/widgets/product_tile.dart
      outline:
      - "A message that contains a value is one ARB entry with a placeholder, such as `{price}`, so each language puts the value where its own sentence needs it."
      - "Joining translated pieces with `+` fixes the English word order and hands a translator fragments without their sentence; one message per whole sentence avoids both."
      - "The template ARB file declares each placeholder and its type in the message's `@` entry, and the generated code turns the getter into a method taking that value, such as `productPrice(int price)`."
      - "An `int` placeholder can name a number format; the generated code then formats the number with the current locale's rules, so `1250000` is grouped differently in Vietnamese and in English."
      - "At stage-2 `ProductTile` builds both its visible price and its `Semantics` label from these messages, so a screen reader also hears the price in the user's language."
      misconceptions:
      - "Translating each piece and joining them with + gives the same sentence as translating it whole."
      - "Vietnamese and English write large numbers the same way, so a price needs no formatting."
      depth_notes: "Không nói plural/select, placeholder kiểu ngày giờ, định dạng tiền tệ hay gọi package intl trực tiếp. Semantics đã dạy ở frontend.l1.accessibility-basics — chỉ nhắc label cũng phải dịch."
    - id: frontend.l2.text-editing-controller
      title:
        vi: "TextEditingController: chữ trong ô nhập nằm ở đâu"
        en: "TextEditingController: where a text field's text lives"
      main_path: true
      duration_min: 12
      skills: [frontend.forms.input]
      prereqs: [frontend.l1.logging-in-from-the-app, frontend.l1.setstate-and-rebuilding]
      related: []
      vocab: []
      example_tag: stage-1
      example_files: [DonHang.App/lib/screens/login_screen.dart]
      outline:
      - "A `TextField` displays and edits text, but the text is held by a `TextEditingController` that the `State` keeps across rebuilds; `LoginScreen` reads `_emailController.text` only when the button is pressed."
      - "Passing `text:` to the controller's constructor starts the field with that value; `LoginScreen` pre-fills a seeded customer's email and the lab's dev password so signing in takes one tap."
      - "Typing updates the field on screen without the screen calling `setState`, because the field listens to its own controller; nothing else on `LoginScreen` rebuilds, and nothing needs to."
      - "The Flutter docs ask for a controller to be disposed in its `State`'s `dispose` method once it is no longer needed; `LoginScreen` at stage-1 does not override `dispose`, so its two controllers never are."
      misconceptions:
      - "Each keystroke needs setState, or the typed text is lost."
      - "The typed text lives in the TextField widget, so it disappears whenever the screen rebuilds."
      - "A TextEditingController needs no cleanup, because Dart frees unused objects by itself."
      depth_notes: "Không nói Form hay validator — bài form-validation. Không nói focus, bàn phím, định dạng khi gõ hay onChanged. Không nói vì sao mật khẩu điền sẵn chỉ hợp với lab — màn hình này bị thay bằng đăng nhập Keycloak ở stage-2."
    - id: frontend.l2.form-validation
      title:
        vi: "Form và validator: kiểm tra trước khi gửi đơn"
        en: "Forms and validators: checking input before sending an order"
      main_path: true
      duration_min: 14
      skills: [frontend.forms.validation]
      prereqs:
      - frontend.l2.text-editing-controller
      - frontend.l2.localizing-with-arb
      - frontend.l2.futureprovider-and-asyncvalue
      related: [backend.l1.validating-input]
      vocab: []
      example_tag: stage-2
      example_files: [DonHang.App/lib/screens/create_order_screen.dart]
      outline:
      - "At stage-2 `CreateOrderScreen` wraps its fields in a `Form` with a `GlobalKey<FormState>`; the key lets the submit button reach the form's state from outside the fields."
      - "Each field takes a `validator` that receives the current value and returns an error message, or `null` when the value is fine; the messages come from `AppLocalizations` like any other text."
      - "The product is chosen in a `DropdownButtonFormField` filled from `productsProvider`, whose validator rejects an empty choice; the quantity `TextFormField` accepts only a whole number of at least 1."
      - "`_formKey.currentState!.validate()` runs every validator, shows each message under its own field and returns `false` if any failed, so the screen stops before calling `ApiClient.createOrder`."
      misconceptions:
      - "A validator returns true or false, and the form decides which message to show."
      - "Putting fields inside a Form checks them automatically, so the submit button can send right away."
      - "Each field needs its own setState to show its error message."
      depth_notes: "Không nói autovalidateMode, onSaved/save() hay package form bên ngoài. Không nói lỗi từ API — bài server-errors-in-forms. Giỏ nhiều dòng hàng ngoài GĐ2: đơn có một sản phẩm với một số lượng."
    - id: frontend.l2.server-errors-in-forms
      title:
        vi: "API vẫn là người quyết: hiện lỗi 400 ngay trong form"
        en: "The API still decides: showing a 400 inside the form"
      main_path: true
      duration_min: 15
      skills: [frontend.forms.validation]
      prereqs:
      - frontend.l2.form-validation
      - frontend.l2.overriding-providers-in-tests
      - backend.l2.problem-types
      - backend.l1.validating-input
      related: [frontend.l2.route-guards]
      vocab: []
      example_tag: stage-2
      example_files:
      - DonHang.App/lib/api_client.dart
      - DonHang.App/lib/screens/create_order_screen.dart
      - DonHang.App/test/create_order_screen_test.dart
      - DonHang.Domain/Entities.cs
      outline:
      - "Checks in the form only save a round trip; `DonHang.Api` checks the order again because any client can call it without the app, so at stage-2 an item with a quantity below 1 still gets `400`."
      - "At stage-2 `ApiClient.createOrder` reads a non-`201` Problem Details body into an `ApiProblem` holding its status, `type`, `title` and `detail`, instead of an exception carrying only the status code."
      - "`CreateOrderScreen` shows the problem's `detail` above the submit button in `colorScheme.error` and keeps every field as the customer left it, so one value can be fixed and the order sent again."
      - "A widget test overrides `apiClientProvider` with a fake whose `createOrder` throws a `400` `ApiProblem`, then checks that the detail text appears and the quantity field still holds its value."
      misconceptions:
      - "If the form passes its validators, the server will accept the order."
      - "Once the app validates input, the API can skip its own checks."
      - "After a failed request the form should be cleared so the customer starts again."
      depth_notes: "Không dịch detail của server — bản địa hóa title/detail ngoài GĐ2 (backend.l2.problem-types). Không gắn lỗi vào từng field, không xử lý riêng 401/409, không thử lại. Không dạy lại type — backend.l2.problem-types."
