# versions.yaml — NGUỒN SỰ THẬT DUY NHẤT về phiên bản cho toàn bộ giáo trình.
# Cập nhật bằng lệnh thật trước khi sinh mỗi giai đoạn; KHÔNG ghi theo trí nhớ.
# Mỗi khóa (dotnet, kubernetes, ...) là `version_key` dùng trong claims và `versions_used` của bài.
# `check`: lệnh để xác nhận. `docs`: gốc tài liệu chính thức reviewer 04 được phép dùng làm bằng chứng.
# Xác nhận lần đầu (Bước 1 autopilot) bằng lệnh thật trên máy chủ, 2026-09-06 (Asia/Ho_Chi_Minh).

updated_at: 2026-09-06
policy:
  - "Chỉ dạy hành vi của đúng phiên bản ghi ở đây; khác phiên bản → không nhắc, hoặc nhắc rõ là khác phiên bản."
  - "Không nhắc tính năng preview/experimental trừ khi bài nói rõ."
  - "Khi nâng một khóa: mọi bài có versions_used chứa khóa đó phải qua lại review 04."

runtimes:
  dotnet:
    version: "10.0"            # xác nhận: dotnet --list-sdks → SDK 10.0.300 cài trên máy chủ
    lang: "C# 14"
    check: "dotnet --version"
    docs: "https://learn.microsoft.com/dotnet/"
  aspnetcore:
    version: "10.0"            # xác nhận: dotnet --list-runtimes → Microsoft.AspNetCore.App 10.0.11
    check: "dotnet --list-runtimes | grep AspNetCore"
    docs: "https://learn.microsoft.com/aspnet/core/"
  efcore:
    version: "10.0"            # xác nhận /repo-stage 1: Directory.Packages.props → Microsoft.EntityFrameworkCore.Design 10.0.4, Npgsql.EntityFrameworkCore.PostgreSQL 10.0.3 (DonHang.Infrastructure)
    check: "dotnet list package | grep EntityFrameworkCore"
    docs: "https://learn.microsoft.com/ef/core/"
  npgsql:
    version: "9"                # xác nhận GĐ0: Directory.Packages.props → Npgsql 9.0.4 (samples/DonHang.Samples, C8). DonHang.Infrastructure dùng Npgsql.EntityFrameworkCore.PostgreSQL 10.0.3 (kéo theo driver Npgsql 10.0.3 riêng cho project đó — hai project độc lập, không xung đột)
    check: "dotnet list package | grep Npgsql"
    docs: "https://www.npgsql.org/doc/"
  npgsql_efcore:
    version: "10.0"            # xác nhận /repo-stage 1: Directory.Packages.props → Npgsql.EntityFrameworkCore.PostgreSQL 10.0.3 (DonHang.Infrastructure). Khóa riêng cho hành vi của provider (xmin làm concurrency token, index khóa ngoại trong migration) — module backend/indexes-and-plans, tự quyết 2026-09-27
    check: "grep Npgsql.EntityFrameworkCore.PostgreSQL examples/don-hang/Directory.Packages.props"
    docs: "https://www.npgsql.org/efcore/"
  flutter:
    version: "3.47"            # xác nhận: flutter --version → Flutter 3.47.2 • channel stable
    dart: "3.13"
    check: "flutter --version"
    docs: "https://docs.flutter.dev/"
  riverpod:
    version: "3.0"              # app/: chưa xác nhận — xác nhận khi app/pubspec.lock tạo (Bước 4). DonHang.App từ stage-2 (module frontend/state-and-routing): /repo-stage 2 xác nhận examples/don-hang/DonHang.App/pubspec.lock → flutter_riverpod 3.0.3, riverpod 3.0.3 (pubspec ghim đúng 3.0.3, dù 3.4.x đã có)
    check: "pubspec.lock"
    docs: "https://riverpod.dev/docs"
  go_router:
    version: "16"                # app/: chưa xác nhận — xác nhận khi app/pubspec.lock tạo (Bước 4). DonHang.App từ stage-2 (module frontend/state-and-routing): /repo-stage 2 xác nhận examples/don-hang/DonHang.App/pubspec.lock → go_router 16.3.0 (bản 16.x mới nhất; pubspec ghim đúng 16.3.0)
    check: "pubspec.lock"
    docs: "https://pub.dev/packages/go_router"
  stackexchange_redis:         # client Redis của DonHang.Api từ stage-2 (module backend/caching, tự quyết 2026-09-27); /repo-stage 2 ghim Directory.Packages.props → StackExchange.Redis 3.3.1 (DonHang.Infrastructure)
    version: "3.3"
    check: "grep StackExchange.Redis examples/don-hang/Directory.Packages.props"
    docs: "https://stackexchange.github.io/StackExchange.Redis/"
  mailkit:                     # thư viện SMTP của IEmailSender từ stage-2 (module backend/background-jobs, tự quyết 2026-09-27); /repo-stage 2 ghim Directory.Packages.props → MailKit 4.18.0 (DonHang.Infrastructure/MailKitEmailSender.cs)
    version: "4.18"
    check: "grep MailKit examples/don-hang/Directory.Packages.props"
    docs: "https://github.com/jstedfast/MailKit"
  intl:                        # package intl mà code sinh bởi gen-l10n dùng để định dạng số theo locale; DonHang.App thêm từ stage-2 cùng flutter_localizations (thuộc Flutter SDK, đi theo khóa flutter) — module frontend/forms-i18n-theming, tự quyết 2026-09-27. /repo-stage 2 xác nhận examples/don-hang/DonHang.App/pubspec.lock → intl 0.20.3 (pubspec `intl: any` như docs gen-l10n; lock ghim)
    version: "0.20"
    check: "pubspec.lock"
    docs: "https://pub.dev/packages/intl"
  prometheus_net:              # prometheus-net.AspNetCore: DonHang.Api xuất metric ở /metrics từ stage-2 (module devops/monitoring-basics, tự quyết 2026-09-27; không dùng OpenTelemetry Prometheus exporter vì gói đó còn prerelease). /repo-stage 2 ghim Directory.Packages.props → prometheus-net.AspNetCore 8.2.1 (DonHang.Api)
    version: "8.2"
    check: "grep prometheus-net examples/don-hang/Directory.Packages.props"
    docs: "https://github.com/prometheus-net/prometheus-net"
  http:
    version: "1.6"               # xác nhận /repo-stage 1: examples/don-hang/DonHang.App/pubspec.lock → http 1.6.0; gói http chính thức của dart.dev, dùng cho DonHang.App gọi API (frontend.l1.fetching-with-http-package)
    check: "pubspec.lock"
    docs: "https://pub.dev/packages/http"
  rabbitmq_client:             # client RabbitMQ .NET dùng trực tiếp (không MassTransit/Wolverine) từ stage-3 (module backend/messaging); /repo-stage 3 mảng B1 ghim Directory.Packages.props → RabbitMQ.Client 7.2.2
    version: "7.2"
    check: "grep RabbitMQ.Client examples/don-hang/Directory.Packages.props"
    docs: "https://www.rabbitmq.com/client-libraries/dotnet"
  npgsql_opentelemetry:        # span cho lệnh SQL của Npgsql từ stage-3 (module backend/observability); /repo-stage 3 mảng B2 ghim Directory.Packages.props → Npgsql.OpenTelemetry 10.0.3
    version: "10.0"
    check: "grep Npgsql.OpenTelemetry examples/don-hang/Directory.Packages.props"
    docs: "https://www.npgsql.org/doc/"
  http_resilience:             # AddResilienceHandler của DonHang.Payments từ stage-3 (bài backend.l3.resilience-pipeline); /repo-stage 3 mảng B2 ghim Directory.Packages.props → Microsoft.Extensions.Http.Resilience 10.10.0
    version: "10.10"
    check: "grep Microsoft.Extensions.Http.Resilience examples/don-hang/Directory.Packages.props"
    docs: "https://learn.microsoft.com/dotnet/core/resilience/"
  polly:                       # strategy (timeout, circuit breaker) dưới http_resilience, gói phụ thuộc kéo theo; /repo-stage 3 mảng B2: DonHang.Payments/obj/project.assets.json → Polly.Core 8.4.2 (Polly.Extensions, Polly.RateLimiting 8.4.2)
    version: "8.4"
    check: "grep -o 'Polly.Core/[0-9.]*' examples/don-hang/DonHang.Payments/obj/project.assets.json"
    docs: "https://www.pollydocs.org/"

data:
  postgresql:
    version: "17"                # xác nhận Bước 3: server postgres:17.6-alpine, client psql 17.11 trong lab box của repo ví dụ
    check: "psql --version"
    docs: "https://www.postgresql.org/docs/17/"
  redis:
    version: "8"                 # /repo-stage 2: image redis:8.10.2-alpine (service redis trong docker-compose.yml); redis-cli trong lab box là gói Alpine redis 8.8
    check: "redis-server --version"
    docs: "https://redis.io/docs/latest/"
  rabbitmq:
    version: "4.1"
    check: "rabbitmqctl version"
    docs: "https://www.rabbitmq.com/docs"

infra:
  docker:
    version: "28"               # xác nhận: docker --version → Docker version 28.0.1
    compose: "2.33"             # xác nhận: docker compose version → v2.33.1-desktop.1
    check: "docker --version && docker compose version"
    docs: "https://docs.docker.com/"
  kubernetes:
    version: "1.34"            # xác nhận: kubectl version (chưa cần GĐ0)
    check: "kubectl version"
    docs: "https://kubernetes.io/docs/"
  kind:                        # kind (Kubernetes IN Docker): cluster local của học viên từ stage-2 — mỗi node là một container Docker trên máy học viên (module k8s/why-and-architecture, tự quyết 2026-09-27). Xác nhận /repo-stage 2: `kind version` → kind v0.33.0; node image ghim trong deploy/k8s/kind-config.yaml = `kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d` (danh sách image của release v0.33.0 cho dòng 1.34); kubectl client dùng khi capture: v1.34.3
    version: "0.33"
    check: "kind version"
    docs: "https://kind.sigs.k8s.io/"
  helm:
    version: "3.19"
    check: "helm version"
    docs: "https://helm.sh/docs/"
  kustomize:
    version: "5.7"
    check: "kubectl kustomize --help"
    docs: "https://kubectl.docs.kubernetes.io/"
  argocd:
    version: "3.1"
    check: "argocd version"
    docs: "https://argo-cd.readthedocs.io/"
  opentofu:
    version: "1.10"
    check: "tofu version"
    docs: "https://opentofu.org/docs/"
  opentofu_provider_kind:      # provider tehcyx/kind tạo cluster kind từ OpenTofu, từ stage-3 (module devops/iac); /repo-stage 3 mảng P/E2 ghim `version = "0.11.0"` + .terraform.lock.hcl trong deploy/tofu/
    version: "0.11"
    check: "grep -A1 tehcyx/kind examples/don-hang/deploy/tofu/envs/staging/cluster/.terraform.lock.hcl"
    docs: "https://search.opentofu.org/provider/tehcyx/kind/latest"
  opentofu_provider_kubernetes: # provider hashicorp/kubernetes tạo namespace + Secret (lớp platform) từ stage-3 (module devops/iac); /repo-stage 3 mảng P/E2 ghim `version = "3.3.0"` + .terraform.lock.hcl trong deploy/tofu/
    version: "3.3"
    check: "grep -A1 hashicorp/kubernetes examples/don-hang/deploy/tofu/envs/staging/platform/.terraform.lock.hcl"
    docs: "https://search.opentofu.org/provider/hashicorp/kubernetes/latest"
  ansible:
    version: "2.19"
    check: "ansible --version"
    docs: "https://docs.ansible.com/"
  metallb:
    version: "0.15"
    docs: "https://metallb.io/"
  longhorn:
    version: "1.9"
    docs: "https://longhorn.io/docs/"
  cert_manager:
    version: "1.20"
    docs: "https://cert-manager.io/docs/"
  prometheus:
    version: "3.5"             # từ stage-2 chạy trong Compose profile monitoring của Đơn Hàng (module devops/monitoring-basics); /repo-stage 2 ghim image prom/prometheus:v3.5.5, grafana/grafana:12.4.11, grafana/loki:3.5.12
    docs: "https://prometheus.io/docs/"
  grafana:
    version: "12"
    docs: "https://grafana.com/docs/"
  loki:
    version: "3.5"
    docs: "https://grafana.com/docs/loki/"
  alloy:                       # Grafana Alloy: collector đọc output container qua Docker socket, đẩy log sang Loki, trong Compose profile monitoring từ stage-2 (module devops/monitoring-basics, tự quyết 2026-09-27); /repo-stage 2 ghim image grafana/alloy:v1.20.0
    version: "1.20"
    check: "grep grafana/alloy: examples/don-hang/docker-compose.yml"
    docs: "https://grafana.com/docs/alloy/latest/"
  tempo:                       # Grafana Tempo: nơi lưu trace OTLP của các service trong Compose từ stage-3 (module backend/observability); /repo-stage 3 mảng B2 ghim image grafana/tempo:2.8.4
    version: "2.8"
    check: "grep grafana/tempo: examples/don-hang/docker-compose.yml"
    docs: "https://grafana.com/docs/tempo/latest/"
  opentelemetry_dotnet:
    version: "1.15"            # /repo-stage 3 mảng B2 ghim Directory.Packages.props → OpenTelemetry.Extensions.Hosting + Exporter.OpenTelemetryProtocol 1.15.3, Instrumentation.AspNetCore 1.15.2, Instrumentation.Http 1.15.1 (trước ghi 1.13: dòng 1.13 có advisory NuGet, Npgsql.OpenTelemetry 10.x đòi OpenTelemetry.Api ≥ 1.14)
    check: "grep OpenTelemetry examples/don-hang/Directory.Packages.props"
    docs: "https://opentelemetry.io/docs/languages/dotnet/"
  github_actions:
    version: "n/a"             # dịch vụ; ghi ngày kiểm tra docs
    checked: 2026-09-06
    docs: "https://docs.github.com/actions"
  git:
    version: "2.54"            # chủ quyết 2026-09-27: theo lab box (docker exec donhang-lab git --version → 2.54.0), nơi output các bài git được capture; trước là 2.46 của máy Windows
    check: "git --version"
    docs: "https://git-scm.com/docs"
  shell:
    version: "5.3"             # chủ quyết 2026-09-27: bash trong lab box (bash --version → 5.3.9, Alpine 3.24)
    check: "bash --version"
    docs: "https://www.gnu.org/software/bash/manual/"
  procps:
    version: "4.0"             # ps trong lab box (ps --version → procps-ng 4.0.6)
    check: "ps --version"
    docs: "https://gitlab.com/procps-ng/procps"
  nginx:
    version: "1.28"
    docs: "https://nginx.org/en/docs/"
  caddy:
    version: "2.10"            # xác nhận Bước 3: docker pull caddy:2.10.0 (C4), dùng trong docker-compose.yml của repo ví dụ
    docs: "https://caddyserver.com/docs/"
  keycloak:                    # authorization server/OIDC provider của Đơn Hàng từ stage-2 (module backend/oauth-and-authz, tự quyết 2026-09-27); /repo-stage 2 ghim image quay.io/keycloak/keycloak:26.7.4 (log khởi động: "Keycloak 26.7.4 on JVM")
    version: "26.7"
    check: "grep keycloak/keycloak: examples/don-hang/docker-compose.yml"
    docs: "https://www.keycloak.org/documentation"
  ghcr:
    version: "n/a"             # GitHub Container Registry (dịch vụ) — nơi Đơn Hàng push image từ stage-2 (module devops/release, tự quyết 2026-09-27); ghi ngày kiểm tra docs
    checked: 2026-09-27
    docs: "https://docs.github.com/packages/working-with-a-github-packages-registry/working-with-the-container-registry"
  mailpit:                     # SMTP server giả trong Compose nhận email đơn hàng từ stage-2 (module backend/background-jobs, tự quyết 2026-09-27); /repo-stage 2 ghim image axllent/mailpit:v1.31.3
    version: "1.31"
    check: "grep axllent/mailpit: examples/don-hang/docker-compose.yml"
    docs: "https://mailpit.axllent.org/docs/"
  gitea:                       # Git server trong cluster mà Argo CD đọc config repo, từ stage-3 (module devops/gitops); /repo-stage 3 mảng P/E2 ghim image gitea/gitea:28.0.0-rootless + digest
    version: "28.0"
    check: "grep -r gitea/gitea: examples/don-hang/deploy"
    docs: "https://docs.gitea.com/"
  sealed_secrets:              # controller Sealed Secrets + CLI kubeseal từ stage-3 (module devops/secrets-backup-dr); /repo-stage 3 mảng P/E2 ghim image docker.io/bitnami/sealed-secrets-controller:0.40.0 + digest, kubeseal 0.40.0
    version: "0.40"
    kubeseal: "0.40"
    check: "kubeseal --version"
    docs: "https://github.com/bitnami-labs/sealed-secrets"
  cosign:                      # ký image + kiểm chữ ký/attestation từ stage-3 (module devops/supply-chain); /repo-stage 3 mảng E1 ghim image ghcr.io/sigstore/cosign/cosign:v3.1.3 + digest (scripts/devops/verify-image.sh), CI dùng sigstore/cosign-installer 4.1.2
    version: "3.1"
    check: "grep cosign_image= examples/don-hang/scripts/devops/verify-image.sh"
    docs: "https://docs.sigstore.dev/cosign/"
  syft:                        # sinh SBOM từ stage-3 (module devops/supply-chain); /repo-stage 3 mảng E1 ghim image anchore/syft:v1.54.0 + digest (scripts/devops/sbom.sh)
    version: "1.54"
    check: "grep syft= examples/don-hang/scripts/devops/sbom.sh"
    docs: "https://github.com/anchore/syft"
  grype:                       # quét lỗ hổng image từ stage-3 (module devops/supply-chain); /repo-stage 3 mảng E1 ghim image anchore/grype:v0.120.0 + digest (scripts/devops/scan-image.sh)
    version: "0.120"
    check: "grep grype_image= examples/don-hang/scripts/devops/scan-image.sh"
    docs: "https://github.com/anchore/grype"
  kubeconform:                 # kiểm manifest theo schema trong job CI `manifests` từ stage-3; /repo-stage 3 mảng E1 ghim image ghcr.io/yannh/kubeconform:v0.8.0 + digest (biến KUBECONFORM trong .github/workflows/ci.yml)
    version: "0.8"
    check: "grep KUBECONFORM: examples/don-hang/.github/workflows/ci.yml"
    docs: "https://github.com/yannh/kubeconform"
  traefik:                     # Gateway controller của cluster từ stage-3 (module k8s/ingress-helm); /repo-stage 3 mảng P/F1 ghim chart traefik 41.6.1 (appVersion v3.7.13) — deploy/gitops/config-repo/apps/traefik.yaml, scripts/k8s/traefik-*.sh
    version: "3.7"
    chart: "41.6"
    check: "helm show chart traefik --repo https://traefik.github.io/charts --version 41.6.1"
    docs: "https://doc.traefik.io/traefik/"
  gateway_api:                 # CRD Gateway API (standard channel) cài riêng vì chart Traefik không kèm, từ stage-3 (module k8s/ingress-helm); /repo-stage 3 mảng P/F1 ghim deploy/gateway-api/standard-install.yaml (bundle-version v1.6.2)
    version: "1.6"
    check: "grep -m1 bundle-version examples/don-hang/deploy/gateway-api/standard-install.yaml"
    docs: "https://gateway-api.sigs.k8s.io/"
  local_path_provisioner:
    version: "n/a"             # StorageClass `standard` (rancher.io/local-path) đi kèm node image kind, không ghim riêng; cluster donhang chạy docker.io/kindest/local-path-provisioner:v20260820-69b56db7 (tag bản dựng của kind, không semver) — module k8s/state-and-storage; ghi ngày kiểm tra docs
    checked: 2026-10-06
    check: "kubectl get deploy -n local-path-storage -o jsonpath='{..image}'"
    docs: "https://github.com/rancher/local-path-provisioner"
  coredns:                     # DNS của cluster, đi theo node image kind v1.34.11 (không ghim riêng) — module k8s/networking-deep; /repo-stage 3 mảng F2: registry.k8s.io/coredns/coredns:v1.12.1
    version: "1.12"
    check: "kubectl get deploy coredns -n kube-system -o jsonpath='{..image}'"
    docs: "https://coredns.io/manual/toc/"
  etcd:                        # kho dữ liệu của control plane, đi theo node image kind v1.34.11 (không ghim riêng) — module k8s/operators-and-cluster-lifecycle (snapshot/restore); /repo-stage 3 mảng P/F2: registry.k8s.io/etcd:3.6.5-0
    version: "3.6"
    check: "kubectl get pod -n kube-system -l component=etcd -o jsonpath='{..image}'"
    docs: "https://etcd.io/docs/v3.6/"

testing:
  xunit:
    version: "2.9.2"           # xác nhận: examples/don-hang/Directory.Packages.props tại tag stage-0 (dùng cho DonHang.Samples.Tests, sẽ dùng cho DonHang.Tests từ GĐ1)
    check: "grep xunit examples/don-hang/Directory.Packages.props"
    docs: "https://xunit.net/docs/getting-started/v2/getting-started"
  testcontainers:              # Testcontainers for .NET (Testcontainers.PostgreSql, Testcontainers.Redis) cho integration test của DonHang.Tests từ stage-2 (module design/integration-testing, tự quyết 2026-09-27). WebApplicationFactory (Microsoft.AspNetCore.Mvc.Testing 10.0.12) đi theo khóa aspnetcore
    version: "4.15.0"          # xác nhận /repo-stage 2: Directory.Packages.props → Testcontainers.PostgreSql 4.15.0, Testcontainers.Redis 4.15.0; dotnet test DonHang.slnx xanh với Docker 28.0.1
    check: "grep Testcontainers examples/don-hang/Directory.Packages.props"
    docs: "https://dotnet.testcontainers.org/"

standards:                     # không có phiên bản, nhưng có nguồn chính thức
  http:
    docs: "https://www.rfc-editor.org/rfc/rfc9110"      # HTTP Semantics
  http_messaging:
    docs: "https://www.rfc-editor.org/rfc/rfc9112"      # HTTP/1.1 (status line, reason phrase) — chủ quyết 2026-09-27
  openapi:
    docs: "https://spec.openapis.org/oas/"        # đặc tả OpenAPI; bài không nêu số phiên bản đặc tả mà ASP.NET Core sinh ra (tự quyết 2026-09-27)
  http_problem_details:
    docs: "https://www.rfc-editor.org/rfc/rfc9457"
  oauth2:
    docs: "https://www.rfc-editor.org/rfc/rfc6749"
  oauth2_pkce:
    docs: "https://www.rfc-editor.org/rfc/rfc7636"      # PKCE (code_verifier/code_challenge, S256) — bài backend.l2.authorization-code-flow (tự quyết 2026-09-27)
  oidc:
    docs: "https://openid.net/specs/openid-connect-core-1_0.html"
  jwt:
    docs: "https://www.rfc-editor.org/rfc/rfc7519"
  tls:
    docs: "https://www.rfc-editor.org/rfc/rfc8446"
  sql:
    docs: "https://www.postgresql.org/docs/17/sql.html"
