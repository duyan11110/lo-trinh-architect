# docs/07 §10, DECISIONS.md E8 — content: validate → build → dist/ as an
# artifact (always) → app.yml picks it up through workflow_run.
#
# Safety: dist/ is committed back only on `main` (push or a manual run from
# main) and only when the AUTO_PUSH_TOKEN secret exists. Pushes to auto/*
# branches validate and build, upload the artifact, and change nothing.
name: content

on:
  push:
    branches: ["auto/**", main]
    paths:
      - "content/**"
      - ".github/workflows/content.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
      - name: Example repo tags (validate S07/L08 read files at stage-N tags)
        run: git -C examples/don-hang fetch --tags --force
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: mermaid-cli (tools/build renders diagrams with it)
        run: |
          npm install -g @mermaid-js/mermaid-cli@12.2.0
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's
          # sandbox needs; mermaid-cli's headless Chrome fails without this.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Previous build (content_version continues from it)
        run: |
          if [ -f dist/VERSION ] && [ -f dist/content.json ]; then
            echo "dist/ from the checkout: v$(cat dist/VERSION)"
          else
            bash .github/scripts/fetch-published-content.sh dist || {
              code=$?
              if [ "$code" = "3" ]; then echo "no published content yet: first build"; else exit "$code"; fi
            }
          fi
      - run: bash tools/validate
      - run: bash tools/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/content.json
            dist/content.json.gz
            dist/manifest.json
            dist/VERSION
          if-no-files-found: error
      - name: Commit dist/ (main only, needs AUTO_PUSH_TOKEN)
        if: github.ref == 'refs/heads/main'
        env:
          AUTO_PUSH_TOKEN: ${{ secrets.AUTO_PUSH_TOKEN }}
        run: |
          if [ -z "$AUTO_PUSH_TOKEN" ]; then
            echo "AUTO_PUSH_TOKEN not set: dist/ stays an artifact only"
            exit 0
          fi
          git config user.name "An (Lộ Trình Architect)"
          git config user.email "nguyenduyan11110@gmail.com"
          # dist/ is gitignored; -f keeps the published build in the repo.
          git add -f dist/content.json dist/content.json.gz dist/manifest.json dist/VERSION
          if git diff --cached --quiet; then
            echo "dist/ unchanged"
            exit 0
          fi
          git commit -m "content: build dist v$(cat dist/VERSION) [skip ci]"
          git push "https://x-access-token:${AUTO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
